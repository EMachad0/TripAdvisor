# pnpm workspace for the new stack. The root package.json stays npm-compatible for the old image (plain
# specifiers, never catalog:); every workspace package takes its versions from the catalog below.
packages:
  - platform
  - packages/*
  - apps/*
  - tooling

catalogMode: strict
savePrefix: ''
minimumReleaseAge: 1440
strictPeerDependencies: true
engineStrict: true

# bits-ui 2.21.0 pins runed 0.35.1, whose optional @sveltejs/kit peer says ^2.21.0. runed only reads
# $app/environment and $app/state, which Kit 3 keeps; accept Kit 3 for that one peer instead of turning
# strictPeerDependencies off.
peerDependencyRules:
  allowedVersions:
    'runed>@sveltejs/kit': '3'

# @convex-dev/eslint-plugin 5.0.1 depends on typescript ^5.9 and @typescript-eslint/* ~8.58; align them with
# the workspace copies so typed rules share one TypeScript program (spike S4).
overrides:
  '@convex-dev/eslint-plugin>typescript': ~6.0.3
  '@convex-dev/eslint-plugin>@typescript-eslint/parser': 8.72.2
  '@convex-dev/eslint-plugin>@typescript-eslint/utils': 8.72.2
  '@convex-dev/eslint-plugin>@typescript-eslint/types': 8.72.2

# Only packages pnpm reports as needing install scripts.
allowBuilds:
  esbuild: true
  sharp: true
  '@napi-rs/canvas': true

# The root eslint.config.ts and .prettierrc resolve their plugins from tooling/ through these hoists.
publicHoistPattern:
  - eslint
  - '@eslint/*'
  - eslint-*
  - '@eslint-community/*'
  - typescript-eslint
  - '@typescript-eslint/*'
  - globals
  - prettier
  - prettier-plugin-*
  - '@shadcn/lint'
  - '@convex-dev/eslint-plugin'
  - '@sveltejs/load-config'
  - svelte-eslint-parser
  - jiti
  - '@types/node'

