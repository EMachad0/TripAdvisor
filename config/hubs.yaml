# Transport hubs: the airports, railway stations and bus terminals where the traveler enters or leaves a city.
# Loaded into the content payload as `hubs`; the city map shows them and marks each as arrival / departure from
# the trip legs (a flight's or transport leg's from / to, or a stay leg's `arrive` / `leave` hub id).
#
# Each entry:
#   id          lowercase slug, unique; for an airport its IATA code in lowercase (pvg)
#   kind        airport | station | bus | ferry
#   code        optional; the IATA code for an airport. Matched against legs' from / to, case-insensitive
#   name        English name
#   name_local  optional; the name in the local script (what signs and ticket apps show)
#   country     country id as in places/<country>/
#   city        city id as in places/<country>/<city>/ (the city the hub serves, e.g. KIX -> osaka)
#   lat, lng    WGS84 as OpenStreetMap shows them (not GCJ-02 from Chinese map apps), at the terminal building
#               or station concourse. Sources: OpenStreetMap (Nominatim / Overpass) and Wikidata, checked 2026-11-26.
#   note        optional; one line the traveler needs
#
# Bad entries are dropped when loading, never thrown on.
hubs:
  # ---------------------------------------------------------------- China: Shanghai
