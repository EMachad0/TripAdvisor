    name: Shanghai Hongqiao railway station
    name_local: 上海虹桥站
    country: china
    city: shanghai
    lat: 31.19603
    lng: 121.3161
    note: Most high-speed trains to Beijing South and Huangshan North; Metro Line 2 from People's Square, about 40 min.
  - id: shanghai-station
    kind: station
    name: Shanghai railway station
