    kind: airport
    code: PVG
    name: Shanghai Pudong International Airport
    name_local: 上海浦东国际机场
    country: china
    city: shanghai
    lat: 31.1536
    lng: 121.80593
    note: Pin at Terminal 2 (Star Alliance, so Turkish TK280); Terminal 1 is a short walk north.
  - id: sha
    kind: airport
    code: SHA
    name: Shanghai Hongqiao International Airport
    name_local: 上海虹桥国际机场
    country: china
