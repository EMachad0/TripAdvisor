  - type: highlights
    items:
      - title: The Great Rockery
        text: A 14-metre mountain of yellow **Wukang stone**, stacked in the 1500s; climb it for a view over the rooftops.
      - title: Dragon walls
        text: Undulating whitewashed walls topped with clay dragon heads snake through the garden.
      - title: Exquisite Jade Rock
        text: A porous rock said to be meant for the imperial court — pour water in the top and it streams out of every hole.
      - title: Winter calm
        text: Bare branches and thin crowds; the koi still flash orange under the grey sky.
  - type: prose
    title: A garden built for parents
    dropcap: true
    text: |
      A retired Ming official spent almost twenty years building this garden so his ageing parents could enjoy a tranquil old age. They did not live to see it finished.

      Today the garden sits inside the noisy **Yuyuan bazaar**. Push past the souvenir stalls and the noise drops away into a maze of halls, ponds and moon gates — a miniature landscape designed to be walked slowly.
