    problem: "`why` says \"Tickets by online lottery only\", but the official news says January 2027 tickets are on first-come sale. The page's own booking block tells the traveler to buy 20–31 Jan first-come, so the line contradicts the page."
    evidence: 'https://museum.nintendo.com/en/ — 2026.11.11: "Nintendo Museum tickets for January 2027 are now available on a first-come, first-served basis."'
    fix: 'Change the end of `why` to "Tickets online only: monthly drawing, then first-come leftovers."'
  - severity: nit
    field: blocks[4].steps[1].text
    problem: The step says results "arrive by email" and gives the payment deadline as "23:59 JST on 7 Dec". The visit-flow page says results come on the 1st (afternoon) and payment is due "Until 23:59 on the 7th of the month". It mentions neither email nor JST for this deadline.
    evidence: https://museum.nintendo.com/en/guide/visit-flow/ — "1st day of the month following the application (afternoon)"; "Until 23:59 on the 7th of the month"
    fix: Say "results on the ticketing site on the afternoon of 1 Dec" and drop JST, or cite a source that states email and JST.
summary: "I found no blocker or should. Price, hours, closures, the two Tuesday closures in the traveler's Japan dates (26 Jan, 2 Feb), address, transit and the full ticket process all match the official site. The official news (11 Nov) confirms the January 2027 first-come sale, and the 1 Nov post confirms the February 2027 drawing deadline of 23:59 JST, 30 Nov. Two small fixes remain: `why` says tickets are by lottery only, and the results/payment step says email and JST, which the official page does not state."
