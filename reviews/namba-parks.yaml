    problem: The page calls the Glacier Court 'waterfall of light' and the Christmas illumination 'December features' and says nothing is planned for late January. No listed source gives their dates. The official about page only says the waterfall appears 'in winter', and the Christmas 2026 page has no dates, so it may still be running on 20 Jan – 4 Feb.
    evidence: hours.winter no longer calls the illumination a December feature. It now repeats the official wording and says the late-January status is unknown. https://nambaparks.com/about says "冬になると「光の滝」が出現し" and gives no dates. https://nambaparks.com/christmas2026/ gives no illumination dates. https://nambaparks.com/event/357 is only the Christmas Challenge lottery (2026年12月11日～12月25日), not the illumination, so no end date is published.
