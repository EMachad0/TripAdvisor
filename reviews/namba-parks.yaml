    problem: The pitfall says restaurants close 'around' 21:00, like the shops. The official access page gives restaurant hours of 11:00–22:00, and OSAKA-INFO gives 11:00–23:00. The page tells the traveler to finish dinner an hour or more earlier than they need to.
