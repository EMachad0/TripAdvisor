    problem: "Two claims have no source: Mixue's \"¥7 lemonade\" (the Korea Herald article never mentions Mixue) and the \"queues of over 5 hours\" on the Fengshengli lab's opening day (neither Digitaling nor the Shanghai government page mentions a queue)."
