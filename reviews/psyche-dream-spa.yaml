    problem: "The legal pitfall says sex work is 'technically illegal' under the 1996 Act. The cited source says the opposite on the client side: the act itself is not illegal, and buying sex for yourself is legal. Public soliciting and the venue's role are what the law targets."
    evidence: "blocks[10].items[0] now says the Act targets soliciting and running or profiting from sex work, that buying it for yourself isn't punished, and that charges are rare and mostly in Pattaya. https://en.wikipedia.org/wiki/Prostitution_in_Thailand says: \"Obtaining sexual services for oneself... remains legal and is not subject to punishment\"; \"Pattaya being the location in which most foreigners have been caught up in a police raid\"."
