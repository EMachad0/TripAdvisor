issues:
  - severity: nit
    field: sources
    problem: The new text relies on the Ban Phe → Ekkamai return times, but the operator's own timetable, which confirms them, is not in sources. They are cited only to a partly sponsored third-party guide.
    evidence: https://www.cherdchaitour.com/th-th/timetables — บ้านเพ - เอกมัย "12:00", "14:00"
    fix: Add the Cherdchai timetable page to sources as the primary source for the bus times.
resolved:
  - field: blocks[2].text
    problem: The page says a second night and 'a morning bus on Monday also works' (the hero hook also promises a 'Monday-morning ferry back'). Cherdchai's own timetable has only two Ban Phe → Ekkamai buses, at 12:00 and 14:00. Taking the 12:00 bus puts the traveler in Ekkamai at about 15:00–16:00, and the 14:00 bus at about 17:00–18:00, against a 19:00 shift start.
    evidence: The 'morning bus on Monday' line is gone. The plan and the hook now use Monday's 12:00 Ban Phe bus, arriving in Ekkamai at about 15:00–16:00. https://www.cherdchaitour.com/th-th/timetables lists Ban Phe → Ekkamai at "12:00", "14:00". The listed source https://www.visitthailandtoday.com/guides/bangkok-to-koh-samet says "Coming back, the buses leave Ban Phe at 12:00 and 14:00" and "the ride takes 3 to 4 hours".
  - field: blocks[2].text
    problem: The plan says to 'take the 07:00 bus from Ekkamai on Saturday Jan 2', but docs/TRIP.md has the China → Thailand flight on Jan 2, and it is not booked. The traveler cannot be at Ekkamai at 07:00 on their arrival day unless an overnight flight lands before dawn. The page does not flag this. The same applies to the tips item 'Sat Jan 2 → Sun Jan 3'.
    evidence: blocks[2] now recommends Sun Jan 3 → Mon Jan 4 on the 09:00 or 11:00 bus, and says Sat Jan 2 is the flight day from China and works only with a landing the night before or very early. The tips item is changed to match.
  - field: blocks[2].text
    problem: The page offers 'Jan 9–10 is the alternative', but Sun Jan 10 is the flight to Korea. A night on Samet on Jan 9 would mean taking the 12:00 or 14:00 bus back on Jan 10 and then flying the same day.
    evidence: blocks[2] now says Jan 9–10 doesn't work because of the Sun Jan 10 flight to Korea and the noon and 14:00 return buses. That matches config/trip.yaml (thailand to 2027-01-10).
  - field: blocks[2].text
    problem: "'Roughly ฿1,200–1,400 (R$198–231) … about a day over your two-day budget' does not add up. The Thailand budget is R$100/day excluding beds, so two days is R$200. The total including the bed (R$198–231) is about the two-day budget, and without the bed (about R$115–140) it is well under it."
    evidence: The bed is now shown separately. Non-bed spend is 2×฿190 + 2×฿50–70 + ฿200 + 2×฿20–60 = ฿720–840 (R$119–139), well inside the 2 × R$100 budget in config/trip.yaml. The bed is ฿500–600 (R$82–99). The arithmetic checks out, and the rate matches the one used before (~0.165).
