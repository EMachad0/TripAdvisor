resolved:
  - field: blocks[3].steps[1]
    problem: The step at 3 days before calls that day the 'last moment to cancel for free'. The venue charges 100% from 3 days before the booking, so a traveler who cancels on that day pays the full ¥4,800.
    evidence: 'blocks[3].steps[1] now says 4 days before is the last free day and that the full price is charged from 3 days before. book_ahead.lead_time, notes and the pitfalls tip say the same. https://www.tablecheck.com/en/shops/sushi-azabu/reserve: "3 days prior or later: 100% of the course price". No fee tier is listed for 4 or more days before. The page also says "contact us at least three days in advance", so the 4-day step is the safe reading.'
  - field: blocks[5] (cost_breakdown)
    problem: Every guest must order a drink, but the cost table and quick facts leave it out. The page shows R$169 and '99% of daily budget' while highlights[0] says the total with the drink is 'about one full day's R$170'. With the drink the real total goes over the budget by an amount the page does not give.
    evidence: 'The cost_breakdown note now says the total "leaves out the compulsory drink" and that drink prices are not published, and highlights[0] no longer claims a ~R$170 total. TableCheck: "Each guest is required to order at least one beverage". No drink prices appear on the page. The note shows correctly under the total on the phone screenshot (s05).'
