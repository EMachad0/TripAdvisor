  - field: book_ahead.notes
    problem: The page says dinner is 120 min from the booked time, and time_needed says '2 h (dinner seat limit)'. TableCheck's booking policy cuts that to 70 min at peak times, so a solo traveler could be rushed out after about an hour.
    evidence: 'https://www.tablecheck.com/en/hantei-nezu/reserve (rendered) — "Time limits: Lunch: 90 min / Dinner: 120 min (Peak periods: 70 min)." The page now says 70 min at peak times in book_ahead.notes, time_needed and quick_facts.time_needed. Both the phone-light and desktop-dark renders show "2 h dinner, 70 min at peak".'
  - field: blocks[0].hook
    problem: The hero hook ('A tasting menu of fried skewers, served in rounds in a Meiji-era house') repeats the first half of `why` ('Twelve fried skewers brought a few at a time… in a Meiji-era wooden house'). The page says the same thing twice, one line apart.
    evidence: 'The hook now reads "Thirty-odd kinds of skewer in rotation, behind iron bars on a Nezu corner." It no longer repeats `why` (desktop-dark hero shot). Both claims are on the official site: https://www.hantei.co.jp/nedu/nedu_kusiage.html "三十余種の串" and https://www.hantei.co.jp/nedu/nedu_tatemono.html "大きな「鉄の矢来」で被い".'
