  - field: hours.summary
    problem: The page says 'from 10:00 or 11:00 until late (listings differ)', but the official site, which is a listed source, gives clear hours. The 10:00 opening comes only from a 2025 blog, so a traveler following the 'weekday at opening' tip could arrive an hour early.
