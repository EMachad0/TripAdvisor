  - field: blocks[6].note
    problem: The page says the shop is about 5 min on foot from JR Shin-Osaka, but the official access page says 11 min.
    evidence: "blocks[6].note now says 'about 11 min south from JR Shin-Osaka' and 'walk 1 min' from the subway. Source: https://www.jinrui-minamenrui.com/access/ — \"JR「新大阪駅」より徒歩11分\", \"地下鉄御堂筋線「西中島南方駅」徒歩1分\"."
  - field: blocks[5].note
    problem: The menu note and a pitfall (blocks[8].items[2]) tell the traveler to use a Japanese ticket machine. A 2025 visit describes ordering by QR code on LINE instead.
    evidence: 'The ticket-machine wording is gone. The menu note and pitfall now say ordering may be by QR code on LINE and that the shop is cash only. Sources: https://ameblo.jp/heath0723/entry-12903749941.html — "前回同様、ＱＲコードを読み込みＬＩＮＥでオーダー"; https://reerac.net/blog/2025/10/02/… (2025-10-02) — "お支払いは現金のみなので要注意！".'
