issues:
  - severity: should
    field: why
    problem: The page says Central Street is 'ending at a green-domed cathedral', and the vibe quote says 'a gold cathedral at the end of the street'. The street actually ends at the Songhua River and Jingwei Street. St. Sophia is on Toulong/Zhaolin Street, about 10–15 min walk east, as the page's own map note says.
    evidence: https://en.wikipedia.org/wiki/Saint_Sophia_Cathedral_in_Harbin — "located on the corner of Toulong Street (Toulong Jie) and Zhaolin Street"; https://goasia.cc/en/article/saint-sophia-cathedral-harbin — walk of "about 15 minutes" to Central Street
    fix: Reword `why` and the vibe quote so the cathedral is a short walk east of the street, not at its end.
  - severity: should
    field: blocks[9].note
    problem: The map note says 'The pin is mid-street'. The pin (45.7670, 126.6107) sits on the Central Street metro stop on Jingwei Street, at the street's southern end.
    evidence: 'https://nominatim.openstreetmap.org/reverse?lat=45.7670&lon=126.6107&format=json&zoom=17 — "name":"经纬街" (Jingwei Street); search result: 中央大街 railway stop at 45.76699, 126.61072'
    fix: Say the pin is at Central Street metro (south end, Jingwei Street), or move the pin to the middle of the pedestrian street.
  - severity: should
    field: blocks[2].items[2]
    problem: The highlight promises free ice and snow sculptures along Central Street in winter, from polar bears to giant bottles. No listed source says this, and the China Highlights festival page doesn't mention Central Street sculptures. The traveler would plan the evening around them.
    evidence: https://www.chinahighlights.com/harbin/attraction/harbin-international-ice-and-snow-festival.htm — Central Street mentioned only as a place to stay near; https://en.wikipedia.org/wiki/Central_Street_(Harbin) — no sculpture mention
    fix: Cite a source showing the street's winter sculptures, ideally one dated 2025–26 that says when they go up, or soften the claim.
  - severity: should
    field: blocks[13] (weather) / blocks[1].extra[0]
    problem: The weather numbers (−24/−12 °C, about −20 °C at night, below −25 °C some nights) have no climate source. The only listed source gives a general winter range of '-25°C to -10°C'.
    evidence: https://www.chinahighlights.com/harbin/attraction/harbin-international-ice-and-snow-festival.htm — "typically from -25°C (-13°F) to -10°C (14°F)"
    fix: Take late-December averages from a climate source (e.g. Wikipedia Harbin climate table or the CMA) and cite it, or use the cited −25 to −10 °C range.
  - severity: nit
    field: blocks[11].items[2]
    problem: The tip says Ice and Snow World 'usually opens around Dec 17–20'. The cited source only estimates 'around December 20, 2026'.
    evidence: https://www.chinahighlights.com/harbin/attraction/harbin-international-ice-and-snow-festival.htm — "likely to open around December 20, 2026"
    fix: Change to 'expected around Dec 20 (not yet confirmed)'.
  - severity: nit
    field: blocks[2].items[3]
    problem: The page calls the closure 'a year of mural restoration'. GoAsia says the interior closed on 10 April 2025 and reopened on 6 Dec 2025, which is about 8 months.
    evidence: https://goasia.cc/en/article/saint-sophia-cathedral-harbin — "From 10 April 2025" … "reopened to the public on 6 December 2025"
    fix: Say 'after eight months of mural restoration'.
  - severity: nit
    field: cost_breakdown.items[2]
    problem: No source gives Harbin metro fares, so the ¥4 round trip is unsupported (the metro guide gives none).
    evidence: https://www.wanderinchina.com/destinations/harbin/transport/metro/ — ticket types listed, no prices
    fix: Cite a fare source or keep the word 'rough' and add 'unverified'.
  - severity: nit
    field: blocks[1].extra[2] / hours.winter / blocks[3].text
    problem: "'Christmas isn't a holiday, everything's open, no official program' appears three times on the page (quick facts, the Dec–Jan hours note and the prose)."
    evidence: ./atr shot phone light s02, s04
    fix: Keep it in the hours note and the prose, and drop the quick-fact tile or give it a different fact.
summary: "Cathedral price, hours, lighting, reopening, ticketing, the 2025 light-show date, and the trains and metro all match the listed sources, and the page is honest that nothing special is scheduled for Christmas. Four things need fixing: the claim that the street ends at the cathedral, the wrong 'pin is mid-street' note, the unsourced Central Street ice sculptures, and the weather numbers with no climate source."
