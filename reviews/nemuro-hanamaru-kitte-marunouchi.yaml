    problem: The page says the Dec 2024 visitor waited 1.5 h 'at lunch' and gives 'Ticket at 11:00' as the best time, which implies opening time avoids the wait. The source says that visitor got a ticket before opening and still waited 1.5 h behind about 20 groups. So taking a ticket at 11:00 does not avoid the long wait.
    evidence: 'The Wait detail now says "Even with a ticket taken at opening (Dec 2024)", and best_time now says "ticket at 11:00, then expect ~1.5 h". This matches https://mydyney-github-io.pages.dev/posts/tokyo-station-nemuro-hanamaru-sushi-guide: "We arrived around 10:40 AM", "got ticket #22", "called in at 12:10 PM", about 1.5 hours.'
