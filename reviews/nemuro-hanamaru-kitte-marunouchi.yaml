    problem: Every plate price, plus cost.local, comes from one blog post dated 2 Dec 2024 that is almost two years old, and the official site publishes no prices. I searched for a newer menu and found only average budgets (Gurunavi ¥1,800, Tabelog ¥2,000–2,999).
    evidence: This uses the second fix I offered. cost.note now gives a range, "budget ≈¥2,900–3,300 now", and labels the plates as "Dec 2024 prices". The highlights text now opens with "At Dec 2024 prices", and confidence_note says no 2025–26 price list turned up. The blog (posted December 2, 2024) still shows ¥176/308/418/550 for the listed plates.
