    problem: The highlights and cost_breakdown give the sightseeing bus as a flat ¥20. The listed Baba Goes China page gives ¥40 in its Quick Facts and ¥20 elsewhere on the same page. The page states ¥20 as fact and leaves the conflict only in confidence_note.
    evidence: cost.note now says ¥20–40, blocks[3].items[3] says '¥20 or ¥40; sources disagree', and cost_breakdown[1] carries the note '¥20 or ¥40; sources disagree'. https://www.babagoeschina.com/orange-island-juzizhou-in-changsha/ — "sightseeing train (40RMB)" and "Mini tourist train around island (¥20)"
