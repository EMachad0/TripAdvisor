    problem: The page marks this as `hidden`, but the Young Mao statue on Orange Isle is Changsha's headline sight. It gets about 17 million visits a year and appears in every foreign guide to the city, so a foreign visitor who goes to Changsha would have heard of it.
    evidence: fame is now `popular`. The project scale has only iconic | popular | hidden (docs/CURATOR-GUIDE.md:143). `popular` means 'well known to anyone who researched the city', which fits Changsha's headline sight with about 17 million visits a year (People's Daily, 10 Dec 2025).
