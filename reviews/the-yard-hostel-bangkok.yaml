resolved:
  - field: book_ahead.required
    problem: The hero badge and quick facts say "No booking needed", but no source supports that. On the cited 4–6 Jan search, Hostelworld shows "Only 3 beds left!" in the 4-bed mixed dorm, "Only 4 beds left!" in the 6-bed female dorm and a 2-night minimum. The page's own tip says to book the whole work week together.
    evidence: "book_ahead is now required: recommended, and the hero badge reads 'Booking recommended · 21 days ahead'. The new 4–9 Jan Hostelworld link opens the right page and shows 'Only 4 beds left!' (8-bed, THB 605.00, Free Cancellation), 'Only 3 beds left!' (4-bed) and 'Only 2 beds left!' (female dorm), so book_ahead.notes is correct. https://www.hostelworld.com/pwa/hosteldetails.php/The-Yard-Hostel-Bangkok/Bangkok/96020?from=2027-01-04&to=2027-01-09&guests=1&currency=THB"
  - field: blocks[0] (hero) / media
    problem: The media folder is empty, so the hero is a plain gradient with no photo. Most of the page's case rests on the garden and the bunks, and the traveler never sees either.
    evidence: The hero now uses media/ari-bts (Commons 'Ari BTS Station.jpg', Crcolas, CC BY-SA 4.0, credited in credits.yaml). Its caption says plainly that it shows BTS Ari and not the hostel, and the phone-light s01 and desktop-dark s01 shots show the station platform with the caption readable.
