    evidence: 'https://www.kiyomura.co.jp/menu/ (opened with curl -k): "本鮪 中とろ 1個 547 円" and "本鮪 かまとろ 1個 767 円". The listed Tabelog EN menu gives the same prices ("Medium Fatty JPY 547", "Chutoro JPY 767"). The page now keeps chūtoro at ¥547, the ¥2,462 total is still correct, and the ¥767 piece is listed separately as kama-toro.'
