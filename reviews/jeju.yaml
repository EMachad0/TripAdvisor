summary: "Most facts check out against the listed sources: the flight time and Kayak fares, the 2024 end of the ferries, bus fares, the January normals (3.7/8.6 °C, about 12 wet days), and the Hallasan permit, crampons, 17:00 buses and three-month no-show ban. The page renders cleanly on phone and desktop. The return-flight cost in the prose (R$320–470) is wrong by the page's own fares; the Jeju→Japan flight list and the 2024-only Hallasan hours need current sources."
