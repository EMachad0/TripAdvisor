    evidence: "cost.note now gives the walk-in price and marks the online price as not verified. A tip links the official booking page (https://kpmn.welovebooking.net/book/kpmn/home, the 'Get Tickets' target on https://kingpowermahanakhon.co.th/experience/mahanakhon-skywalk) and says to compare it and Klook before paying. The curator's reason holds: I rendered the booking page and it showed no prices, and Klook returned HTTP 403. No cheaper price can be verified, so an honest note and a way to compare is the fix that can actually be made."
