  - field: blocks[6].items[2]
    problem: The tip says the 2026 installation 'opened Feb 5, the day before New Year'. Lunar New Year 2026 was 17 February, so the display opened 12 days early. The wrong framing suggests a 2027 display would open on Feb 5, the day before Feb 6.
    evidence: blocks[6].items[2] now says 'In 2026 it ran Feb 5 – Mar 3, opening about two weeks before New Year (Feb 17). The 2027 dates aren't out.' https://thebeat.asia/hong-kong/the-list/events/ifc-mall-the-phoenixs-celestial-court-art-installation — "Thu, February 5, 2026 - Tue, March 3, 2026", "Oval Atrium, Podium Level 1, ifc mall". The Feb 17 date comes from the first review's gov.hk quote; on this run gov.hk returned an empty page.
  - field: hours.summary
    problem: The 10:00–22:00 mall hours are borrowed from a 2026 atrium installation, not from any published mall hours, and nothing listed says the rooftop is open in the early evening. Yet best_time sends the traveler there in the early evening. Neither the official ifc location page nor the ifc mall homepage nor the HKTB page gives any hours.
    evidence: "The 10:00–22:00 estimate is gone. hours.summary now reads 'Mall and rooftop garden hours are not published on the official site'. https://ifc.com.hk/en/mall/location lists no mall hours; the only hours on it are car park rates (07:01–23:00). best_time changed from early evening to 'Afternoon'. The pitfall tip warns that rooftop hours are unpublished. The confidence_note gives the customer service number, which the official location page shows: \"Tel: (852) 2295 3308\"."
