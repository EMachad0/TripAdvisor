summary: "All five earlier findings are fixed on the page and backed by the listed sources. Concierge is out for the trip dates, the landing rates are hedged and the chart is linked, the lead time is 20 days, payment is cash, and the detour cost is now spelled out. The new facts match Yamasa's site, the Concierge notice and tabiris. The only gap left is a nit: the rail fares rest on one undated third-party source."
