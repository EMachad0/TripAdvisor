    problem: The legal-status pitfall flatly says 'buying isn't punished'. The cited Wikipedia page says paying is not punished only when there are no aggravating circumstances, and that foreign clients have been charged in police raids, though rarely. Its lead also says prostitution 'is not itself illegal', while a later section calls it 'technically illegal', so the page's 'prostitution is illegal' takes one side of a source that disagrees with itself.
    evidence: "blocks[11].items[0] now reads 'a grey area under the 1996 Prostitution Act. Clients are rarely charged, but foreign clients have been caught in raids'. https://en.wikipedia.org/wiki/Prostitution_in_Thailand says: 'Although uncommon, cases of foreign clients being charged have happened … most foreigners have been caught up in a police raid'. The lead says prostitution 'is not itself illegal', which conflicts with the 1996 Act being described as criminalising sex work, so 'grey area' is a fair summary of the source."
