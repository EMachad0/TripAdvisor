issues:
  - severity: nit
    field: blocks[1].items[2].text
    problem: The page says the viewpoint is a 20–25 minute climb. The source gives 20–25 minutes to reach the top, then about 10 more minutes to the viewpoint.
    evidence: https://en.wikivoyage.org/wiki/Rai_Leh — "The climb to the top takes about 20-25 minutes and to the viewpoint another 10 minutes."
    fix: Say about 30–35 minutes to the viewpoint.
  - severity: nit
    field: getting_there
    problem: The ฿715 night bus leaves from Bangkok's Southern Terminal and arrives at Krabi's bus station at 05:40, not in Ao Nang. The page names neither, so the traveler cannot see that an early-morning transfer is still needed.
    evidence: https://www.visitthailandtoday.com/guides/bangkok-to-krabi — "Lignite Tour's 18:40 from the Southern Terminal lands at Krabi's bus station at 05:40"
    fix: Add 'Lignite Tour, from the Southern Terminal (Sai Tai Mai) to Krabi bus station, then a songthaew to Ao Nang'.
  - severity: nit
    field: blocks[1].items[1].text, blocks[1].items[2].text, getting_around
    problem: No listed source says the shrine is in a 'cave', that the path is 'roped', or that 'everything is a 5–10 min walk'. Wikivoyage only says the shrine is at the north end of Phra Nang and that the path has slippery red clay.
    evidence: https://en.wikivoyage.org/wiki/Rai_Leh
    fix: Remove these details or cite a source for them.
  - severity: nit
    field: confidence_note
    problem: The note mentions 'the kayak prices', but the page gives no kayak prices.
    evidence: https://en.wikivoyage.org/wiki/Rai_Leh — "around 600 baht/half-day, 1,000 baht/full-day"
    fix: Either add the ฿600 half-day / ฿1,000 full-day kayak rental as a budget line, or remove the kayak mention from the note.
  - severity: nit
    field: blocks[0].focus
    problem: On the phone, the 75% 70% crop shows mostly overcast sky with a sliver of cliff, and the longtails from the caption are barely visible.
    evidence: ./atr shot krabi-railay --area --only phone --theme light (s01)
    fix: Move the focus lower (for example 80% 85%) so the boats and cliffs fill the phone hero.
summary: "Getting there, the longtail fare, the climate figures (Krabi January 21.6/32.9 °C, 1981–2010 normals) and the Nov–May dry season all match the listed sources. The page is honest that Krabi fits only with extra days or a laptop week. There are only nits: the viewpoint climb takes about 10 minutes longer than stated, the night bus needs its terminals named, and a few small details have no source."
