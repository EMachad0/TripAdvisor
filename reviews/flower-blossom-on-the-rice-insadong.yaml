    evidence: why now says 'Bib Gourmand 2018–2025'. ./atr render of https://guide.michelin.com/kr/en/seoul-capital-area/seoul/restaurant/a-flower-blossom-on-the-rice shows "Restaurant not found … Restaurant details are not available in the MICHELIN Guide South Korea", which matches the new highlight line.
