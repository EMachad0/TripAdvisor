  - field: why
    problem: "`why` calls Harbour City \"Hong Kong's biggest mall\", but the Tourism Board source only says \"one of the largest\", and the page's own highlight says the same."
    evidence: "`why` now reads \"One of Hong Kong's largest malls\". This matches https://www.discoverhongkong.com/eng/place-to-go/travel.guide-harbour-city.html (\"one of the largest shopping malls in Hong Kong\") and the page's own highlight."
  - field: best_time
    problem: The 18:15 sunset drives `best_time` and both the highlight and the insider tip for Feb 4–9, but no listed source gives a sunset time.
    evidence: The Hong Kong Observatory open-data CSV for Feb 2027 is now cited. It gives sunset times of 18:14 (Feb 4–5), 18:15 (Feb 6–7), 18:16 (Feb 8) and 18:17 (Feb 9), so "about 18:15" in best_time, the highlight and the insider tip holds.
  - field: blocks[7].items[1].label
    problem: The fare line is labelled "weekend/holiday", but the cited article gives only weekday (HK$6) and weekend (HK$8.30) fares. Feb 8–9 are Monday–Tuesday public holidays, so the fare on those days is unproven.
    evidence: "The label is now \"weekend fare, from Jan 25\" at HK$8.30. The pitfall tip gives HK$6 on weekdays and HK$8.30 at weekends, and says the Feb 8–9 holiday fare isn't stated. Both figures match The Star article: \"weekday fares will be capped at HK$6 ... and weekend fares at HK$8.30\"."
