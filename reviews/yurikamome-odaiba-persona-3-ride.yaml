summary: "All five earlier findings are fixed and backed by sources: the address, the bridge claim, the two-ride fare of ¥590 (Jorudan ticket fares, and the operator charges taps at the ticket fare), the same-card-same-device cap rule, and the JMA January normals. The walkway hours and the 3rd-Monday closure match the Port Bureau. Only a nit is left in confidence_note."
