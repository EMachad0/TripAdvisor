    problem: The weather block gives -7 °C / 6 °C as the typical Dec–Jan low/high for Fujiyoshida, but no listed source gives these numbers. The traveler will pack for this trip based on them.
    evidence: "https://www.data.jma.go.jp/obd/stats/etrn/view/nml_sfc_ym.php?prec_no=49&block_no=47640 is now listed in sources. It gives Kawaguchiko January normals for 1991–2020: daily minimum -5.7 °C, daily maximum 5.5 °C, sunshine 212.3 h. The page's -6 / 6 °C are these values rounded, and its note quotes -5.7 / 5.5 °C and about 210 h."
