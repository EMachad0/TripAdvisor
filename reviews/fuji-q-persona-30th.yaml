summary: "The weather finding is resolved. The page now cites JMA's 1991–2020 normals for Kawaguchiko, and the -6 / 6 °C low and high plus the note's -5.7 / 5.5 °C and about 210 sunshine hours match that source. The new line in hours.winter, \"Fuji-Q says ride hours can change with the weather\", is backed by the Fuji-Q ticket page: \"Attraction operating hours may change depending on weather etc.\" The rechecked schedule facts (10:00–17:00, closed 20/21/27/28 Jan, Takabisha closed 22 Jan, Ferris wheel closed to 31 Jan) still match Fuji-Q's January 2027 calendar. No blockers or shoulds remain."
