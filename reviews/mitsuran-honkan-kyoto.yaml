    problem: Japanese prices are given as "from ¥10,000 for 45 min", but on fujoho that is the early-morning (6–9h) price. The standard 45 min price is ¥12,500. The page also gives no cheaper way in, although ¥35,000 is 736% of the daily budget and the traveler asked for "no crazy spending on a single thing".
    evidence: 'https://fujoho.jp/index.php?p=shop&id=6569: 回転コース 基本55分 "13,000円 | 15,000円 | 13,000円" (早朝 | 通常 | ご新規様), お試し45分 通常 12,500円, "3回転＋ヘルス40分". The page now gives ¥15,000 regular (¥13,000 for new customers or 06:00–09:00) and the 45 min trial at ¥12,500. It drops the early-morning-only ¥10,000 figure, and its budget angle is the 50 min ¥30,000 English course, with the cheaper Japanese route flagged as not proven for foreigners.'
