resolved:
  - field: blocks[4].steps[0].text
    problem: The booking step tells the traveler to pick Dinner → Counter seats → 'All Omakase (with drink)' ¥13,200. TableCheck has no 'Dinner' category and no listing with that name. The two ¥13,200 listings are 'Full Omakase Course' (the drinks course, すべておまかせ) and 'Special Assigned Selection' (the lobster course, 特選おまかせ, no drinks), so the traveler can easily book the wrong one.
    evidence: https://www.tablecheck.com/en/shops/sushitokyo-ten-shibuya/reserve lists the category selector as "Counter seats" / "Table seats" (there is no Dinner category). It lists "Full Omakase Course" ¥13,200 (すべておまかせコース) and "Special Assigned Selection" ¥13,200 (特選おまかせ). The venue message says Premium/特選 is the course that "includes lobster", and only the 'All' courses are marked お飲み物付き. blocks[4].steps[0] and book_ahead.links[0].note now name 'Full Omakase Course' and warn against 'Special Assigned Selection'.
  - field: why
    problem: The page says 'all your drinks', 'all drinks included, so the bill can't creep up' and calls it 'the honest all-in price'. TableCheck only says the course comes with 'your choice of drinks' (お飲み物付き), not all-you-can-drink (飲み放題), and no source says how many drinks it covers.
    evidence: https://tabelog.com/en/tokyo/A1303/A130301/13225919/party/ lists "All Omakase (with Drinks, All-Inclusive)" at JPY 13,200 with the tag "All you can drink" and the rule "*Last orders for drinks will be taken 30 minutes before the end of your dining time." The page now credits this to Tabelog and drops 'can't creep up' and 'honest all-in price'. The free-flowing claim rests on Tabelog's auto-translated English page; the Japanese page returned 403.
