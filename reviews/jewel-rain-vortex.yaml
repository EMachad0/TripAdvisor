resolved:
  - field: prose (Your Sunday, airport-only) / tips[pitfalls]
    problem: The plan says to collect the bag and check in after the 22:00 show. But config/trip.yaml has the red-eye leaving at about 22:30–03:00, and Scoot's counters close 60 min before departure. If the flight leaves before about 23:30–00:00, the 22:00 show (and possibly the 21:00 one) cannot fit, and the page never says so.
    evidence: Prose block 'Your Sunday, airport-only' now says the 22:00 show fits a departure at 00:00 or later and the 21:00 show one at 23:00 or later, and that earlier flights should use Jewel Early Check-in or online check-in before the shows. This matches Scoot's 60 min counter close and 15 min boarding close (https://www.flyscoot.com/en/manage/get-ready-to-fly/check-in-guide, read in the first review) and the Early Check-in window on the page's own Changi source. The pitfall line still says 'After the 22:00 show', but the new paragraph puts it in context.
