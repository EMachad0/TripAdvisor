resolved:
  - field: blocks[8].items[1]
    problem: "The new 'Chureito Pagoda is 15 min and ¥310 away by Fujikyu train' is not backed by any listed source. The ¥310 fare matches the official Fujikyu Railway fare table (https://www.fujikyu-railway.jp/en/fare/: Shimoyoshida–Kawaguchiko ¥310, 5.5 km), but that page is not cited. The 15 min ride time appears on no page checked, and Japan Travel Kit gives no fare or time for this leg."
    evidence: "https://www.fujikyu-railway.jp/en/fare/ is now in sources, and its fare matrix gives Shimoyoshida–Kawaguchiko 310 yen (adult). The unsourced '15 min' is gone: the line now reads 'a ¥310 local-train ride away', so the express surcharge doesn't apply to the trip as written."
