    problem: "'Locals point to 7-Eleven Kawaguchiko Higashi-Koiji' rests only on an All About page that returns HTTP 403. The curator admits seeing it only in search results, so no source we could open supports it. The quick fact '7-Eleven? … in Kawaguchiko' (blocks[1].extra[2].detail) depends on the same claim."
