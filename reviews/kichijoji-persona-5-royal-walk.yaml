resolved:
  - field: hours.winter
    problem: The page says boat hours are shorter in winter but that 'no exact times' are published. The official park page does publish them, and the Wednesday closure it cites comes only from a search snippet, not from any listed source.
    evidence: https://www.tokyo-park.or.jp/park/inokashira/facility/ (now listed in sources) — "11月～2月 9:30～16:50 （受付は15：50まで）", "定休日 12～2月の水曜日". hours.winter, the pitfalls tip and the weather note now give these exact times and the Wednesday closure.
  - field: hours.summary
    problem: The 10:30 start for menchi-katsu sales comes only from the 2019 Time Out page, the same page whose price is out of date. The 2026 Bring-You page gives 10:00–19:00 with irregular closing days (不定休), and the page leaves the irregular closures out.
    evidence: https://www.gltjp.com/ja/directory/item/18540/ — "掲載施設による公式確認を経た情報です", updated 2026年01月14日, "営業時間 10:00〜19:00（メンチカツの販売は10:30〜）", "定休日 年始のみ". A current shop-checked listing now supports the 10:30 start. hours.summary mentions the blog's irregular closing days, and confidence_note says the two sources disagree.
