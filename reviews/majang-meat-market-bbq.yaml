  - field: blocks[5].items[5]
    problem: The Daegu-jip line (500 g mixed hanwoo platter, ₩80,000, 'in a 2024 review') has no listed source. Esquire (2023) describes Daegu-jip but gives no price, and no 2024 review is cited. Daegu-jip is in the meokja-golmok food alley, which ZenKimchi says was razed, so it may have moved, and the page gives no location.
    evidence: The Daegu-jip menu item (₩80,000 platter) is gone from blocks[5]. No other line on the page mentions Daegu-jip or the 2024 review.
  - field: cost.local
    problem: The ₩30,000 headline rests on one undated iVisitKorea line ('KRW 12,000 or $10 per 100g'). ZenKimchi, in the same source list, says ₩30,000–60,000 per person for premium hanwoo before the table fee, so the page's total sits below that range.
    evidence: "cost.local is now ₩36,000 (₩30,000 meat + ₩6,000 fee). That puts the meat at the low end of https://zenkimchi.com/tour-tips/majang-meat-market-hanwoo-beef-guide/: \"Expect to pay ₩30,000–₩60,000 per person for premium Hanwoo cuts\". The note and cost_breakdown label give ZenKimchi's range and say that iVisitKorea's prices suggest less."
