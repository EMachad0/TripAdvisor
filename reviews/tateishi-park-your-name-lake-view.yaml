summary: The one earlier finding is fixed. The page now credits Shinkai's own image of Koumi's Matsubara and Otsuki lakes and calls Lake Suwa a lake fans compare to Itomori. Every new claim is backed by ciatr or Go Nagano (Shinkai's lake image, his Koumi origin, the park's popularity from the resemblance, the Hida town scenes). Moving the sunset times from hours.winter into quick facts added no unsupported fact, and no open blocker or should remains.
