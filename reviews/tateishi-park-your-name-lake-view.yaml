    problem: The page says the Your Name lake is Lake Suwa and that the makers never named a model lake. A listed source says Shinkai named Matsubara Lake and Ōtsuki Lake in Koumi, Nagano, as his image for Itomori Lake, and that Lake Suwa only resembles it more closely.
    evidence: "`why`, the hook, quick_facts.extra[0] and the prose now say fans compare the view to Itomori Lake and that Shinkai named Koumi's Matsubara and Otsuki lakes. 'Never named it officially' is gone. https://ciatr.jp/topics/323228 says: \"長野県南佐久郡小海町出身である新海誠監督は…「糸守湖のイメージは長野県小海町の松原湖と大月湖」\" and 糸守湖 \"諏訪湖によく似ています\". https://www.go-nagano.net/en/trip-idea/id16505 says: \"It grew even more popular due to its striking resemblance to the scenery found in the animated film 'Your Name'\". The phone render (s01, s04) shows the new text with nothing cut off."
