    fix: Set the method to the booking-site value, or link the hostel's own channel.
summary: "The core numbers check out: the Hostelworld score and dorm prices for every night, the Booking.com week price, cash-only payment, the ¥100 deposit, distances and the address, plus the fallback hostels' prices and scores. Fix the unsupported Hostelworld deposit and cancellation terms, the conditions on the ¥107 Merica rate, the card and late-arrival rules at check-in, and the unsourced Exit 9."
