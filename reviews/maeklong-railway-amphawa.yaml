    problem: Sat Jan 2 is offered as a day-trip date, but the traveler is in China until Jan 2, so Jan 2 is their travel day into Bangkok. That leaves Sun Jan 3 and Sat Jan 9 as the only realistic weekend days.
    evidence: "config/trip.yaml has china to 2027-01-02 and thailand from 2027-01-02 (Fri Jan 8 is a work night: 'night shifts 19:00–04:00, Mon Jan 4 – Fri Jan 8'). The page now has when.dates from 2027-01-03, best_time 'Sun Jan 3', the Fits your week detail 'Sun Jan 3 best, Sat Jan 9 backup', and prose and hours.winter that rule out Jan 2. Jan 9, 2027 is the second Saturday of January, which matches the cited Wikipedia holiday rule."
