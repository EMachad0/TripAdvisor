    problem: The 8:30/11:10/14:30/17:40 arrival times shown in quick_facts come from one third-party blog table labelled 2025. No SRT or station source confirms them for January 2027, yet the whole day is planned around the 11:10 and 14:30 trains. I found no SRT suspension notice, but a recent guide says Mueang Samut Songkhram was still listed as flood-affected in October 2026.
    evidence: 'quick_facts detail now reads "Arrivals. 2025 table, unconfirmed for 2027: check at the station", and the prose says "These times come from a 2025 table, not a current SRT timetable, so check them at Maeklong station (or ask your hostel to call the station) the day before, and on arrival". Both appear in the phone render (s02, s04). The fix says the station rather than the SRT 1690 hotline, which is still an actionable check.'
