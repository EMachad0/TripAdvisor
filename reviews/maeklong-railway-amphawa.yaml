    problem: The plan ends at Amphawa after dark, with an optional firefly boat from about 18:00, but no source gives the last van or bus from Amphawa or Maeklong back to Bangkok. Van service from Amphawa is also unsourced. A solo traveler could end up stranded about 70 km from base.
