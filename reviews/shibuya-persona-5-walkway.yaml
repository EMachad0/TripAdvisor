    field: blocks[11].conditions
    problem: No listed source says 'Mostly clear, dry'. The JMA normals page the curator added gives only temperatures (Jan 9.8 / 1.2 °C).
    evidence: https://www.data.jma.go.jp/stats/etrn/view/nml_sfc_ym.php?prec_no=44&block_no=47662 — temperature table only
