  - field: location.address
    problem: The page puts the shop in the basement (B1F) in the address, the map note and the hero caption ("basement entrance"). The official site and Time Out both give the ground floor (1F). Only Tabelog says B1F.
    evidence: https://fu-unji.com/ — "東京都渋谷区代々木2-14-3 北斗第一ビル 1F". location.address and address_local now say 1F, blocks[0].caption no longer says basement, blocks[7].note says the queue forms outside on the street, and confidence_note records that Tabelog says B1F.
  - field: blocks[4].items[5].price_local
    problem: Extra noodles are listed as 替え玉 at ¥150, and blocks[3].text repeats that price. The official menu has no 替え玉. Its only extra-noodle item is 麺特盛 at ¥200.
    evidence: https://fu-unji.com/ おしながき — "麺特盛 ¥200", and 替え玉 is not on the page. blocks[4].items[5] is now 麺特盛 ¥200 (R$7.03 = 200 × 0.03517), and blocks[3].text says ¥200 more on the official menu.
  - field: why
    problem: The address was moved to 1F, but `why` still calls the shop "a basement counter", and the weather note sends the queue onto "stairs". Both contradict the official 1F address.
    evidence: '`why` now says "a ground-floor counter of 15 seats" and blocks[9].note now says "outdoors on the street" with no mention of stairs. Both match the official address "北斗第一ビル 1F".'
