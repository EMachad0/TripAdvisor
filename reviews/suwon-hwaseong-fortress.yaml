    problem: The ₩1,650 Line 1 fare (and the ₩3,300 round trip in cost_breakdown) comes from a guide dated 6 Jun 2026. The base fare for Seoul-area trains went up by ₩150, from ₩1,400 to ₩1,550, on 28 Jul 2026. A ~41 km trip also pays a distance surcharge on top, so ₩1,650 is very likely too low for Jan 2027.
    evidence: "The fare is now ₩2,250 each way (₩4,500 both ways, flagged as an estimate). That matches the fare rule in Korean Wikipedia's 수도권 전철 article (raw text): \"기본 운임은 1550원 ... 10km에서 50km 범위 이내에서 5km당 100원\". It also matches 수원역 (Korean Wikipedia): \"경부선 서울 기점 41.5 km\". So ₩1,550 plus 7 bands × ₩100 = ₩2,250. Kyunghyang (15 Jun 2026) confirms \"기본운임(1550원)\". The confidence_note says plainly that the fare is calculated, not quoted. The MileAsia source title no longer claims ₩1,650."
