resolved:
  - field: blocks[2].items[0].title
    problem: The title 'Where Japanese striptease began' and the prose line 'this is the theater that started the art form' are wrong. Japanese striptease began at Teito-za in Shinjuku in January 1947, and the first dance-based strip show was at Tokiwa-za. Rock-za is only the oldest theater still running.
    evidence: "blocks[2].items[0].title is now 'The oldest strip theater still running', and blocks[3] now says 'this is the oldest strip theater still open'. Both match https://ja.wikipedia.org/wiki/浅草ロック座: \"現存するストリップ劇場では最大手にして最古である\"."
