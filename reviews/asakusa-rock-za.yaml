summary: The earlier finding is fixed. The new contact-page source supports the 'strip club in a foreign movie' line and the dance styles. The Dana Yao review supports the AV-actress line and the ¥4,000 student rate with ID, and the official note 'Seniors and student need proof upon entry' backs up the student row. The only open point is the unsourced '5 min' walk, a nit, so the page passes.
