    problem: The new text says the renovation runs 'through 2026' and the map note says fencing may close parts of the gate 'in 2026', but the traveler is in Thailand 2–10 Jan 2027. Portail Asie gives no end date; it only calls the work the '2026 revitalization', and its completion targets (May 2026, early 2026) have already passed. A January 2027 reader may wrongly conclude the fencing no longer applies.
    evidence: hours.winter now reads 'A renovation was reported under way in late 2026 with no end date announced … fencing … may still be up in January 2027', and blocks[7].note was changed the same way. https://portail-asie.com/en/lumphini-park-bangkok/ says 'Last updated on October 26, 2026', 'Currently undergoing major renovations for its 2026 revitalization, Lumphini Park remains open' and 'Some areas may be temporarily fenced off'. It gives no newer completion date than the passed May 2026 and early 2026 targets.
