    problem: The page has no budget angle beyond the gap between the refundable and non-refundable rates. It does not say whether ฿671 is cheap or dear for a Chiang Mai dorm, and it does not mention that Hostelworld says booking direct gives free nights and loyalty perks.
    evidence: "`why` now says '฿671 a bed, upper end for Chiang Mai dorms'. A new tip, blocks[7].items[2], covers booking direct. The Hostelworld detail page (https://www.hostelworld.com/pwa/hosteldetails.php/Mad-Monkey-Chiang-Mai/Chiang-Mai/318111?from=2027-01-09&to=2027-01-10&guests=1&currency=THB) still says: \"Remember if you book directly, you get additional free nights and loyalty perks.\""
