    problem: The cheapest-way-in tip says Hostelworld's Chiang Mai list shows dorms 'from about €5 (R$33)'. The cited page now shows dorms from €1.54. These are also undated 'from' prices, so they cannot be compared directly with the ฿671 rate for Sat 9 Jan. The same list shows Mad Monkey itself at 'Dorms From €17.54'.
    evidence: "blocks[7].items[1] now gives the list's undated 'from' prices: dorms from under €2 and Mad Monkey at €17.54. It says a dated 9 Jan search returned nothing, so the traveler should compare live. sources[3] has a new title to match. Page 1 of https://www.hostelworld.com/hostels/asia/thailand/chiang-mai/ shows Rimnim Hostel Chiangmai at \"Dorms From €1.54\" and Mad Monkey Chiang Mai at \"Dorms From €17.54\"."
