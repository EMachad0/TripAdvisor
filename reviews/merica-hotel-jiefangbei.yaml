    problem: "'¥130 to pay at the hotel' does not match Booking.com. The ¥130 rate says 'Pay nothing until December 26, 2026', so it is charged before arrival, on top of the required bank transfer. It is not paid at the desk."
    evidence: "cost.note no longer says 'to pay at the hotel'. Booking.com 28–29 Dec: \"Standard Queen Room - No Window … Current price CNY 130\". 28–31 Dec: \"Current price CNY 389 … Pay nothing until December 26, 2026\"."
