    problem: The museum card rests on "You asked for bullet trains", but neither ./atr taste nor anything in feedback/ (swipes, questions, notes) records a request for bullet trains or the Shinkansen. With museum scored 0 ("only a Louvre-level, must-go museum"), the page's case for clearing that bar depends on a traveler request that has no record.
    evidence: "blocks[3].text now leads with what can be shown: no extra sightseeing day and ¥3,670 (R$129.92). That total matches cost_breakdown (¥1,200 entry + ¥720 Aonami + ¥1,750 stopover), and 3,670 × 0.0354 = 129.92. The bullet-train line is now a secondary point attributed to the planner, and confidence_note says the request came through the planner on 14 Nov, not the game. feedback/ still has no record of that request, so it remains unverified, but the case for clearing the museum=0 bar no longer depends on it."
  - field: best_time
    problem: The whole plan is built on Fri 29 Jan as the Tokyo→Osaka move, but config/trip.yaml says the Tokyo stay "may become 10 if the Daikoku retry moves to Fri Jan 29". If that happens, the 07:30 Nozomi and the 10:00 museum opening clash with a Daikoku night and a later departure. The page never mentions this.
    evidence: "blocks[8].items[3] adds the Daikoku conflict and the Sat 30 Jan fallback (Ado weekend: stop only if the show time leaves the afternoon free). This matches config/trip.yaml (Daikoku retry may move to Jan 29; 'Ado live in Osaka Jan 30–31'). Official calendar https://museum.jr-central.co.jp/en/facilities/_pdf/calendar_en_2026.pdf, January 2027: closed only on 1, 5, 12, 19 and 26 Jan, so Fri 29 and Sat 30 are open; 2 Feb is closed."
