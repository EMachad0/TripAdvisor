    evidence: "https://www.visitthailandtoday.com/temples-culture/bangkok/golden-mount-wat-saket: \"344 Thanon Chakkraphatdi Phong, Khwaeng Ban Bat, Khet Pom Prap Sattru Phai, Krung Thep Maha Nakhon 10100\". location.address now reads '344 Chakkraphatdi Phong Rd, Ban Bat, Pom Prap Sattru Phai, Bangkok 10100', and address_local gives the same street in Thai (ถนนจักรพรรดิพงษ์)."
