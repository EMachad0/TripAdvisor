summary: "The money and timing facts all check out against the official tower, cable car and bus pages, plus the guide: observatory ₩29,000 and its hours, bus ₩1,500 by card from 06:30 to 23:00, cable car ₩15,000 return / ₩12,000 one way from 10:00 to 23:00, Oreumi hours, and the address and pin. Naksan is a useful free alternative for this budget. One should remains: the page gives the December sunset when the traveler is there in January, and the listed source has the January time (about 17:35)."
