    problem: The notes say flatly that you can 'try the desk for foreign visitors at its south-east corner' without a booking. The only source is a May 2025 forum reply written before the 2026 closure, and the official notice does not mention any foreigner desk or same-day entry. The tips block caveats this, but the booking card the traveler acts on does not.
    evidence: "book_ahead.notes now reads 'Book the mausoleum online too; a walk-in desk for foreigners is a 2025 report, unconfirmed since the reopening.' This matches the forum reply dated 24/05/2025 (https://ruqintravel.com/community/china-travel-forum-3-beijing-travel-forum/how-to-book-visits-to-mao-memorial-hall/). The official notice lists only online channels: https://cpc.people.com.cn/GB/143527/143528/index.html — \"请提前1-6天登录毛主席纪念堂微信公众号、毛主席纪念堂预约微信小程序、人民网毛主席纪念堂专题网页进行预约\""
