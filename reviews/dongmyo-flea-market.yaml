issues:
  - severity: should
    field: hours.summary
    problem: "The summary gives no times or closed days, but one listed source does: Time Out says weekday stalls open at 14:00 and the market closes on the 2nd and 4th Tuesdays. That would mean Tue 12 Jan 2027 and stalls not open on weekday mornings. Seoul city's 2020 piece says 연중무휴 (open all year). The traveler's only free Seoul weekend day is Sun 10 Jan, so a weekday visit is likely, and these times matter for it. The conflict appears only in confidence_note, which the page does not display."
    evidence: 'https://www.timeout.com/seoul/things-to-do/dongmyo-flea-market — "Mon-Fri 14:00-20:00, Sat-Sun 10:00-21:00 (Closed on Every 2nd and 4th Tuesday)"; https://mediahub.seoul.go.kr/archives/1284376 — "운영시간 : 연중무휴"'
    fix: Add to hours.summary or hours.closed that weekday stalls may not open until about 14:00 and that the market may close on the 2nd and 4th Tuesdays (Time Out 2016, unconfirmed), and suggest the afternoon of a day other than Tue 12 Jan.
  - severity: nit
    field: blocks[3].items[1].text
    problem: '"Rare albums bought here for ₩5,000" joins two separate claims. The Seoul source says rare albums sell cheaply and, separately, that a ₩1,000,000 item can sell for ₩5,000. No source gives ₩5,000 as an album price.'
    evidence: https://mediahub.seoul.go.kr/archives/2010202 — "희귀음반을 동묘시장에서 저렴한 가격에 구입" / "100만 원 상당의 가치 있는 물품을 5,000원에 살 수도 있는 곳"
    fix: Say "rare albums bought cheap", or say ₩5,000 finds without tying the price to albums.
  - severity: nit
    field: hours.winter
    problem: The only evidence that the market runs in January is a Commons photo, and no listed text source says it does. The page says this honestly, so it stays unsupported.
    evidence: https://commons.wikimedia.org/wiki/File:Dongmyo_Flea_Market_Jan_2024_03.jpg
    fix: Keep the caveat. Cite a written winter source if one turns up.
summary: "Prices (₩1,000 clothes and drinks, ₩6,000 dongtae-jjigae), the address and Exit 3, the 750 m walk to Pungmul Market and its Tuesday closure, the crowds, cash-only stalls and the Guan Yu shrine are all backed by the Korea Herald and Seoul city sources. Fame and the budget angle suit this traveler. One should remains: the hours give the traveler nothing to plan with, even though Time Out lists 14:00 weekday openings and closures on the 2nd and 4th Tuesdays (Jan 12 falls in the trip)."
