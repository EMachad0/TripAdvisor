getting_there: "Highway bus from Busta Shinjuku: ¥2,000 online, about 1 h 45 to Kawaguchiko Station (Shimoyoshida stop about 1 h 30). Or JR to Otsuki, then Fujikyu Railway (¥1,170 + ¥400 express)."
getting_around: "Fujikyu Railway between Shimoyoshida and Kawaguchiko; around the lake, the Red, Green and Blue Line sightseeing buses (day pass ¥1,500, single rides from ¥180)."
winter_note: "January normals at Kawaguchiko (JMA): -5.7 °C low, 5.5 °C high. Dry and sunny: isfujivisible rated Fuji clear on every January 2026 day. Mornings are well below freezing."
