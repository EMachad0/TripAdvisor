blocks:
  - type: hero
    focus: "35% 50%"
    hook: "Snow-capped Fuji over a red pagoda, a lake and a convenience store, two hours from Shinjuku."
  - type: highlights
    items:
      - title: Chureito Pagoda
        text: "The postcard view from Arakurayama Sengen Park in Fujiyoshida, 398 steps above Shimoyoshida station. Free and open around the clock."
      - title: Konbini Fuji shots
        text: "Fuji above a convenience store's roof: the viral Lawson by Kawaguchiko Station (the 2024 screen is gone) and several 7-Elevens, one by Gekkoji Station."
      - title: Lake Kawaguchi
        text: "The Red Line bus runs along the north shore to Oishi Park, with Fuji across the water."
      - title: Fuji-Q Highland
        text: "Coasters under Fuji, and a Persona 30th collab until 31 January 2027."
  - type: prose
    title: How to spend the day
    text: |-
      It's one long day out of Tokyo. Take the earliest bus from Busta Shinjuku, get off at Shimoyoshida for the pagoda and Honcho Street, ride the Fujikyu train a few stops to Kawaguchiko for the Lawson and the lake, and catch a late-afternoon bus back. Bus fares come to about ¥4,000 return, plus ¥1,500 if you use the lake buses.
  - type: gallery
    images:
      - { file: fuji-lake-kawaguchi, caption: "Lake Kawaguchi and Fuji at first light" }
  - type: tips
    variant: insider
    items:
      - "Check the Fuji forecast on isfujivisible.com the night before, and move the day if clouds are due."
      - "Book the bus a few days ahead. Since 1 Oct 2026 Fujikyu-run buses sell on Fujiyama Connect and Keio-run ones on Highwaybus.com."
