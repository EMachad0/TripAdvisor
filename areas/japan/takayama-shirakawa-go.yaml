blocks:
  - type: hero
    hook: "Thatched roofs under deep snow, lit up after dark on just four winter nights."
    caption: "Shirakawa-go farmhouses lit at night in winter"
  - type: highlights
    items:
      - title: Hinamizawa in the snow
        text: "**Ogimachi**, Shirakawa-go's largest village, is a UNESCO site of steep thatched gassho-zukuri farmhouses built for heavy snow. Wikipedia calls Shirakawa village the basis for **Hinamizawa** in Higurashi."
      - title: The light-up, Jan 11 or 17
        text: "On four winter evenings the village is lit from **17:30 to 19:30**. Two fall in your dates: Mon **Jan 11** (a holiday) and Sun **Jan 17**. Entry is by reservation only."
      - title: Takayama's old town
        text: "A beautifully preserved old town of wooden streets, the former government office at **Takayama Jinya**, and morning markets held daily in two places."
      - title: Cold you came for
        text: "Takayama averages **117 cm** of snowfall in January and stays below freezing at night. No skiing needed: the snow is the sight."
  - type: prose
    title: Why this one
    text: |-
      This is the wildcard for Japan, picked over Kanazawa, the Nagano snow monkeys and Hiroshima. It is the one with **real snow** you can walk through (Osaka, Kyoto and Tokyo barely get any), it is very photogenic, it has the Higurashi village you may know from anime, and it sits between Kyoto and Tokyo, so it costs a detour of a day or two rather than a separate trip.

      A natural route: **Kyoto → Takayama** (Shinkansen to Nagoya, then the Hida limited express), a day trip or one night in **Shirakawa-go**, then **Takayama → Tokyo** by the highway bus to Shinjuku.
  - type: prose
    title: Where to base yourself
    text: |-
      **Takayama** is the base: the Nohi bus centre is beside the JR station, and japan-guide's suggested day in town is done on foot. No hostel cards have been written for Takayama yet. Expect a quieter, smaller-town night than Osaka or Tokyo; this is a stop for snow and photos, not clubs.

      Japan-guide says the best way to experience Shirakawa-go is a night in one of its farmhouses, many of which now run as minshuku (guesthouses). On light-up nights, though, village beds were allocated by a lottery that closed on Oct 31, 2026.
  - type: prose
    title: Getting there and away
    text: |-
      **From Kyoto**: Shinkansen to Nagoya (about 35 min), then the JR Hida limited express (about 2 h 20–30 min); about 3.5–4 h and roughly ¥9,500 in total (R$333.45). The Nohi highway bus from Kyoto Station is cheaper, about ¥4,500–5,000 and 5 hours. **From Osaka**: about 4–4.5 h by Shinkansen + Hida (¥10,000–11,000), or 5.5–6 h by Nohi bus (¥5,000–6,000).

      **Takayama ↔ Shirakawa-go**: Nohi bus, about 50 minutes, **¥2,900** one way or ¥5,800 return from Dec 1, 2026 (R$101.79 one way). Services marked R need a reservation, released about a month ahead.

      **On to Tokyo**: highway bus from Takayama to Busta Shinjuku, about 5.5 h for ¥8,000 (R$280.80), or by train via Nagoya, about 4.5 h for ¥16,000.
  - type: prose
    title: The light-up, practically
    text: |-
      **You can't just take the bus in.** From **15:30** a gate lets in only ticket holders, and the last route bus out of Shirakawa-go leaves between **16:00 and 17:00**, before the lights come on. You need a village bed, a reserved car park, or a tour bus.

      **The tour from Takayama**: Nohi Bus's Course B costs **¥16,000** (R$561.60), about three days of your budget. It leaves Takayama at 15:10, includes the observation-deck ticket, and is back at 20:45. Seats went on sale Oct 13 (for Jan 11) and Oct 19 (for Jan 17), so they may be gone.

      **On a normal day** no reservation is needed: take the Nohi bus and walk the village by daylight. An Oct 2026 guide gives the last buses back to Takayama at about 17:25–17:30; check the winter timetable.
