blocks:
  - type: hero
    hook: "The scramble crossing, Kabukicho after dark and a different neighbourhood every subway stop."
  - type: highlights
    items:
      - title: Shibuya, day and night
        text: "The crossing where people walk in every direction at once, **Center Gai** with its arcades and music shops, and Shibuya's clubs: Wikivoyage counts Womb among Tokyo's largest. Shibuya and its crossing are on your list and get their own cards."
      - title: Shinjuku's neon
        text: "Wikivoyage calls **Kabukicho** Tokyo's wildest nightlife and red-light district. It appears in the Yakuza and Judgment games as Kamurocho."
      - title: Arcades and anime
        text: "**Akihabara** is Tokyo's electronics mecca and the centre of otaku culture. The Your Name stairs at Suga Shrine in Yotsuya have their own card."
      - title: Cars by the bay
        text: "The **Daikoku PA** car meet is in Yokohama, next door. It has its own card."
  - type: prose
    title: Where to base yourself
    text: |-
      For going out, sleep in **Shinjuku** or **Shibuya**. Shinjuku has Kabukicho and the Busta Shinjuku bus terminal, where the highway buses to Takayama leave; Shibuya has the crossing, Center Gai and the clubs Wikivoyage lists. **Roppongi**, which Wikivoyage calls Tokyo's nightclub district and where bar crawls run, is the third option. The hostel and capsule cards for Tokyo are written separately, including the capsule on your list in Shinjuku.

      Tokyo is where the trip to Japan ends: you leave for Bangkok on Fri **Jan 22**. With the dates now Jan 4–22, there is time for five to seven days here after Osaka and Kyoto.
  - type: prose
    title: Getting here
    text: |-
      **From Kyoto or Osaka by Shinkansen**: the Nozomi from Kyoto takes about 2 h 15 min, ¥13,320 unreserved (R$467.53) or ¥14,170 reserved; from Shin-Osaka about 2 h 22 min, ¥13,870 unreserved (R$486.84) or ¥14,720 reserved.

      **By night bus**: Osaka to Tokyo takes 8–9 hours and arrives around 5–7 AM. Starting fares on Kosoku Bus go from ¥2,000 (WILLER) to ¥5,800 (R$70.20–203.58), depending on operator and date. It saves both the train fare and a night's bed.

      **From the airports**, if you fly in or out: Haneda to Shinjuku by Keikyu and the JR Yamanote line, about 40 min for ¥540 (R$18.95), or to Shibuya about 35 min for ¥510. From Narita the Keisei **Skyliner** reaches Ueno in about 41 min for ¥2,580 (R$90.56); the slower Keisei main line costs less.
