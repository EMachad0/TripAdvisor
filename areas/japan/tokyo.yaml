  - type: tips
    variant: insider
    items:
      - "Three busy days? The 72-hour **Tokyo Subway Ticket** is ¥2,000 (R$70.20); single metro rides are ¥180–330."
      - "The Skyliner costs ¥2,580 to Ueno; Keisei's main-line trains are slower but cheaper, and Haneda is far closer to the city than Narita."
  - type: tips
    variant: pitfalls
    items:
      - "Heavy snow is rare in Tokyo, but Wikivoyage warns it can halt much of the train network. Leave slack before the Bangkok flight on Jan 22."
      - "Mon **Jan 11** is Coming-of-Age Day, a public holiday: expect weekend crowds."
