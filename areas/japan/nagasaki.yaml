getting_there: "From Shin-Osaka: Shinkansen to Hakata, Relay Kamome to Takeo-Onsen, Kamome Shinkansen to Nagasaki. ~4.5 h, ¥19,900 reserved, ¥15,850 Super Hayatoku if bought 2+ weeks ahead."
getting_around: "Trams cover almost everything: ¥150 flat fare, ¥600 day pass, every 5–8 min, 06:00–23:00. Suica and ICOCA work. Mt Inasa by bus plus ropeway."
winter_note: "Mild for Japan: January averages 4.0–10.7 °C, February 4.5–12.0 °C, about 10 rainy days a month. The catch is the sea: winter wind and swell cancel many Gunkanjima landings, so stay two nights. The Lantern Festival (Feb 5–21, 2027) starts the day after you leave Japan (Feb 4), so it's not on your route."
