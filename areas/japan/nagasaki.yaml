  - type: tips
    variant: insider
    items:
      - "The **¥600 tram day pass** pays off after four rides; a single ride is ¥150 anywhere."
      - "Do Mt Inasa on a clear night; the ropeway's last car is at 22:00."
      - "Arriving by plane? The airport bus to Nagasaki Station is 45 min and ¥1,200."
  - type: tips
    variant: pitfalls
    items:
      - "Don't plan Gunkanjima on your last morning. If the landing is cancelled you want a second day."
      - "The Atomic Bomb Museum closes **Dec 29–31**; not an issue in January."
