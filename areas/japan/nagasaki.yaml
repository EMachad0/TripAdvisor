blocks:
  - type: hero
    hook: "A harbour city of hills and trams, the Gunkanjima boats, and the atomic bombing of 9 August 1945."
    caption: "Nagasaki harbour at dusk from Mt Inasa"
  - type: highlights
    items:
      - title: Gunkanjima, the ghost town
        text: "Yamasa Kaiun's boats leave Nagasaki port twice a day and land you on **Hashima**, the abandoned coal-mine island, for 40–50 minutes. Roughly a third to half of winter sailings don't land, so make it a two-night stop."
      - title: Peace Park and the A-bomb museum
        text: "The hypocentre park, the Peace Statue and the **Atomic Bomb Museum** (¥200) in Urakami, ten minutes north of the station by tram. A museum, which you'd normally skip, but here you see the bombing's story where it happened."
      - title: Mt Inasa after dark
        text: "japan-guide ranks the view from **Mt Inasa** among Japan's three best night views, with Hakodate and Mt Rokko. The ropeway costs ¥1,900 return and runs until 22:00; a bus to the foot of the ropeway is cheap."
      - title: Dejima, Glover Garden, Chinatown
        text: "**Dejima** (¥1,100, open until 21:00) is the rebuilt trading post, finished in 1636, with stone warehouses and Meiji-era buildings. **Glover Garden** (¥1,300) has Meiji-era Western houses above the harbour. **Shinchi Chinatown** is where you eat dinner."
  - type: prose
    title: Is the detour worth it?
    text: |-
      Nagasaki is on the far side of Kyushu: about **4.5 hours each way from Shin-Osaka** with two changes (Hakata, then Takeo-Onsen), at ¥19,900 reserved (R$699.88) or ¥15,850 (R$557.44) with a Super Hayatoku ticket bought 2 weeks to a month ahead. A return trip by train is roughly R$1,100–1,400. Budget flights from Kansai and night buses exist and can be far cheaper; check them for your dates.

      What you get for it: the one famous Japanese ghost town you can actually walk on, plus a city with a history unlike Tokyo, Kyoto or Osaka's. Plan **two nights**. Day one: an early Gunkanjima sailing, then Dejima and Chinatown, and Mt Inasa at night. Day two is the backup landing day, plus the Peace Park and Glover Garden. Base yourself near **Nagasaki Station or the port**: the Yamasa boats leave from the port terminal, a 10-minute walk from the station.

      **Other famous abandoned places don't fit this trip.** The Matsuo mine ruins are in Iwate's Hachimantai mountains, where the main mountain road (the Aspite Line) is closed by snow from early November to mid-April. Nagoro, the scarecrow village, is in a remote mountain corner of Shikoku's Iya Valley, far off the Tokyo–Kyoto–Osaka line. Nagasaki is the ghost-town detour that works in January.
