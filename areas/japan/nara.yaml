blocks:
  - type: hero
    hook: "A day out from Osaka or Kyoto: wild deer, a giant bronze Buddha and a shrine lined with lanterns."
  - type: highlights
    items:
      - title: The deer
        text: "The 2026 count found **1,687** wild sika deer in and around Nara Park. They're a national natural monument, and they bow for crackers (about ¥200 a bundle)."
      - title: The Great Buddha
        text: "Todai-ji's Great Buddha Hall, ¥800, open 08:00–17:00 in winter. Nigatsudo up the hill is free, with a view over the city."
      - title: Kasuga's lanterns
        text: "About 3,000 stone and hanging lanterns line Kasuga Taisha. On Setsubun, **Wed Feb 3, 2027**, the shrine lights them all from about 18:00; the inner corridor is ¥700. A guided ¥3,000 tour at 19:30 is optional."
      - title: A hill on fire
        text: "**Sat Jan 23, 2027**: Wakakusa Yamayaki. Fireworks at 18:15, then the grass on Mt. Wakakusa is set alight at 18:30. Paid standing tickets (from ¥2,000 early-bird, on sale from Nov 20, 2026) are optional; there are places to watch outside the paid areas."
  - type: prose
    title: A day trip, not a base
    text: |-
      Nara was Japan's capital from 710 for 74 years, the prefecture says. Today the sights a first-timer comes for sit in one walkable park east of **Kintetsu-Nara** station. Most people come for the day and sleep in Osaka or Kyoto, and that's the plan here too.

      **From Osaka** it's closest: the Kintetsu rapid express from **Namba** takes about 37 minutes for ¥680. **From Kyoto** the Kintetsu express takes about 48 minutes for ¥760. Both end at Kintetsu-Nara, a 5-minute walk from the park. JR goes to JR Nara station, about 20 minutes' walk from the park. It can be the cheapest: from **JR Namba** the Yamatoji line is ¥580, a 41-minute ride in Jorudan's search, against ¥680 on Kintetsu. You pay for it with the longer walk.

      A full day costs about **¥3,060** (R$108): Kintetsu return from Namba ¥1,360, Great Buddha Hall ¥800, Kasuga inner area ¥700 and a bundle of deer crackers (about ¥200). The details are on the Nara Park card.
