  - type: tips
    variant: insider
    items:
      - "Get off at **Kintetsu-Nara**, not JR Nara: it's 5 minutes from the deer instead of 20."
      - "Pick your day by the calendar: **Jan 23** (hill burning, evening), **Jan 31** (deer calling, 10:00) or **Feb 3** (lanterns, evening)."
