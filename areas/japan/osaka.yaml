blocks:
  - type: hero
    hook: "The Glico runner, giant billboards and canal-side lanterns: Osaka's neon food strip, first stop off the plane."
  - type: highlights
    items:
      - title: Dotonbori at night
        text: "Wikivoyage calls **Dotonbori** the centre of Osaka nightlife, all restaurants, bars and neon over the canal. It is also the most touristy spot in town: look, eat, then go elsewhere to drink."
      - title: Amerikamura for going out
        text: "Part of Shinsaibashi, **Amerikamura** is where young Osaka shops and drinks, with bars from hip-hop to reggae. Club cards for Osaka come separately."
      - title: Cheap, famous food
        text: "Takoyaki from street carts around nightfall, okonomiyaki in hole-in-the-wall places, and **kushikatsu** in Shinsekai, which Wikivoyage names the best place for it."
      - title: Kyoto as a day trip
        text: "JR Special Rapid to Kyoto takes about 29 minutes for ¥580, and Hankyu runs Umeda to Kawaramachi for ¥410. You could see Kyoto without moving hostels."
  - type: prose
    title: Where to base yourself
    text: |-
      **Namba and Shinsaibashi** (Minami) are the base for this trip. The Nankai trains from Kansai airport run to Namba, Dotonbori is the food and neon strip, and Amerikamura is part of the Shinsaibashi area. For a solo traveler who wants to go out with people from the hostel, this is the part of town to sleep in; the hostel cards for Osaka are written separately.

      **Umeda** (Kita) is the other centre, around JR Osaka station, with department stores and the Hankyu and JR trains to Kyoto. Wikivoyage calls nearby Kitashinchi the most famous nightclub district in Osaka, but it is bars and small restaurants more than dance clubs.

      With the Japan dates now **Jan 4–22**, Osaka is the likely base for the remote-work week (Jan 4–8): you land here, the evenings are free for Dotonbori and Amerikamura, and the weekend of Jan 9–10 is open for a first trip to Kyoto.
  - type: prose
    title: Getting in, and on to Kyoto and Tokyo
    text: |-
      **From Seoul**: the cheapest flights for Jan 4–5 land at Kansai airport (KIX). The Nankai **Airport Express** to Namba costs ¥970 (R$34.05) and takes about 45–50 minutes. The **rapi:t** is faster, 34–39 minutes, but adds a ¥700 seat charge since April 2026, about ¥1,670 (R$58.62) in total; the charge is ¥150 less through Nankai's ticketless service and ¥300 more if bought on board.

      **To Kyoto**: JR Special Rapid from Osaka station, about 29 minutes for ¥580 (R$20.36). Hankyu from Umeda to Kyoto-Kawaramachi, about 43–46 minutes for ¥410 (R$14.39). The Shinkansen from Shin-Osaka takes about 14 minutes for ¥1,440–1,490 unreserved.

      **To Tokyo**: Nozomi Shinkansen from Shin-Osaka, about 2 h 22 min, ¥13,870 unreserved (R$486.84) or ¥14,720 reserved. Night buses take 8–9 hours and arrive early morning; starting fares on Kosoku Bus run from ¥2,000 (WILLER) to ¥5,800 (R$70.20–203.58), depending on operator and date.
