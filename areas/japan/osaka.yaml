  - type: tips
    variant: insider
    items:
      - "Buy an **ICOCA** card (¥2,000 including a ¥500 deposit). It works on most Kansai trains, subways and buses, and a Suica from Tokyo works here too."
      - "Heavy metro day? The **Enjoy Eco Card** is ¥820 for unlimited subways and buses."
      - "Buy the rapi:t seat in advance: the on-board surcharge is ¥300."
  - type: tips
    variant: pitfalls
    items:
      - "Wikivoyage warns that some seafood and wagyu stalls in **Kuromon Market** charge very high prices."
      - "Most businesses close **Jan 1–3**. Arriving Jan 4–5 you miss that, but Mon **Jan 11** is a public holiday (Coming-of-Age Day): expect weekend crowds."
