  - type: tips
    variant: insider
    items:
      - "Buses are a flat **¥230**. If you will ride more than four times, the bus + subway day pass is ¥1,100; the cheaper bus-only pass no longer exists."
      - "Hankyu ends downtown at Kawaramachi; JR ends at Kyoto Station. Pick the line by where your hostel is."
