blocks:
  - type: hero
    hook: "A tunnel of orange gates, a gilded pavilion and old Gion lanes, with a 29-minute train back to Osaka."
  - type: highlights
    items:
      - title: The torii tunnel
        text: "**Fushimi Inari-taisha**'s Senbon Torii is the tunnel of orange gates everyone knows from photos. It is the obvious answer to the \"Japanese temple\" on your list."
      - title: Gold and wood
        text: "The gilded pavilion of **Kinkaku-ji** in the north, and **Kiyomizu-dera** with its famous large veranda in Higashiyama."
      - title: Gion's old streets
        text: "**Gion**, in Higashiyama, is Kyoto's famous geisha district. Wikivoyage warns that tacky souvenir shops are part of it too."
      - title: A drink after dark
        text: "Most bars are around **Kiyamachi**, between Shijo and Sanjo. Kyoto is not known for dance clubs: Wikivoyage sends you to Osaka for that."
  - type: prose
    title: Where to base yourself
    text: |-
      Wikivoyage says places to stay cluster **around Kyoto Station** and **downtown near Karasuma-Oike**. Kyoto Station is easiest if you arrive by Shinkansen or plan an early train to Tokyo. Downtown, near **Kawaramachi**, puts you a short walk from the Kiyamachi bars and Gion and at the end of the cheap Hankyu line from Osaka; for a traveler who wants to go out with people from the hostel, that is the better pick. The hostel cards are written separately.

      You could also skip moving: from a hostel in Osaka, Kyoto is a ¥410–580 train ride each way.
  - type: prose
    title: Getting here and on to Tokyo
    text: |-
      **From Osaka**: JR Special Rapid from Osaka station, about 29 minutes for ¥580 (R$20.36); Hankyu from Umeda to Kyoto-Kawaramachi, about 43–46 minutes for ¥410 (R$14.39); Keihan from Yodoyabashi to Gion-Shijo and Sanjo, about 50–55 minutes for about ¥430–490. The Shinkansen from Shin-Osaka takes about 14 minutes for ¥1,440–1,490 unreserved.

      **To Tokyo**: the Nozomi takes about 2 h 15 min, **¥13,320** unreserved (R$467.53) or **¥14,170** reserved (R$497.37). Nozomi trains usually have two unreserved cars, but japan-guide says they become fully reserved over the New Year holiday. The cheap alternative is a night bus from Osaka (see the Osaka page) or a stop in the Japanese Alps on the way (see Takayama & Shirakawa-go).
