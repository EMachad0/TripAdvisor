  - type: quote
    variant: vibe
    text: Blue sky, red walls, frozen lakes, and your breath in the air on the way to dinner.
  - type: tips
    variant: insider
    items:
      - "Plan the week around the **Monday closure** of the Forbidden City, and book it before anything else: tickets are online only, tied to your passport number."
      - "Cheapest Mutianyu day: the **916 Express** from Dongzhimen (¥16) to Huairou Beidajie, then bus H23, H24, H35 or H36, 2–2.5 h in all. Simpler: the tourist coach from Dongzhimen at 09:10, **¥80 return** (R$66), back between 13:00 and 16:00."
      - "Walk up from the south gate to tower 6 or 8 and skip the lifts: with the coach, entry and shuttle the day costs about ¥135–140 (R$112–116). The cable car adds ¥140 return (R$116)."
      - "Mutianyu tickets are real-name, one per passport per day, and open up to **15 days ahead**. Bring the same passport."
      - "The Airport Express from Capital Airport costs ¥25 (R$21) and takes about 25 minutes; from Daxing it is ¥35 (R$29)."
  - type: tips
    variant: pitfalls
    items:
      - "The subway stops at about **22:45**. A late night in Sanlitun ends in a taxi."
      - "The Mutianyu toboggan and lifts depend on the weather, and the steps get slippery with snow or ice. Keep a plan for walking down."
      - "Check the air-quality (AQI) and wind forecast before the Wall day, and keep that day flexible so you can move it."
      - "Don't count on lake skating. Opening depends on the ice each year: in 2025–26 Houhai and the Summer Palace's Kunming Lake opened on 20 January and Peking University's Weiming Lake on 17 January, all after this trip's China dates. Check the 2026–27 dates in December."
  - type: weather
    temp_low_c: -7
    temp_high_c: 4
    conditions: Dry, sunny and below freezing; snow about 3 days a month
    note: "Cold but easy to plan around: over 60% of possible sunshine in both months and almost no rain. Central heating runs from about 15 November to 15 March. The Wall is exposed, and wind, snow and ice make the stone steps hard going, so it is the one day that depends on the forecast."
    wear: Down jacket, thermal layers, gloves, hat, shoes with grip; lip balm for the dry air
