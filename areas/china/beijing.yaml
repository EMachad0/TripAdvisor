blocks:
  - type: hero
    hook: Six centuries of palace roofs under snow, seen from the hill the emperors built behind it.
    caption: The Forbidden City after snow, January 2020
    focus: "50% 55%"
  - type: highlights
    title: What earns the days
    items:
      - title: The Forbidden City for R$33
        text: "Low-season entry (Nov–Mar) is **¥40**, with two side galleries at ¥10 each. Open 08:30–16:30, last entry 15:30, **closed Mondays**. There are no same-day tickets: book online with your passport number. The cap is 40,000 visitors a day."
      - title: The Great Wall at Mutianyu
        text: "A restored **2,250 m** stretch with 22 watchtowers, 70 km out. Entry is **¥40–45** (R$33–37) plus a ¥15 shuttle. Walking up takes 30–40 minutes and is free; the cable car is ¥100 one way (R$83). Winter hours are 08:00–17:30, last entry 17:00."
      - title: Hutong life around Gulou
        text: "The alleys between courtyard houses are what is left of old Beijing, and whole blocks keep disappearing under high-rises. The Drum Tower, Nanluoguxiang and the Shichahai lakes are the area to walk."
      - title: Peking duck at the source
        text: "The dish was developed here: crisp skin carved at the table and rolled in pancakes with spring onion, cucumber and sweet bean sauce. **Bianyifang** dates from 1416 and **Quanjude** from 1864."
      - title: Eight UNESCO sites
        text: "Beyond the palace: the Temple of Heaven, the Summer Palace, the Ming Tombs, the Central Axis, and stretches of the Great Wall and the Grand Canal. Three or four days cover the main ones."
      - title: Sanlitun after dark
        text: "The city's best-known nightlife district, with its highest concentration of bars and international restaurants. It is in Chaoyang, east of the old centre, on Subway Line 17."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Beijing in December is cold, hard and clear. The air is dry, the sky is blue more often than not, and the big imperial sites are built for that light: red walls, yellow tiles, bare trees. When it does snow, about three days a month, the Forbidden City photo everyone wants is on offer.

      It is the stop on the China route with the most history per day. Give the palace a morning, the Wall a full day, and the hutongs an afternoon on foot with duck for dinner. The Temple of Heaven and the Summer Palace fill a fourth day.

      **Where to base.** For budget and atmosphere, the hutongs around **Gulou** in Dongcheng. Know what you are booking: old courtyard buildings are poorly insulated and cold in winter, many cheap guesthouses have no private bathroom, and taxis drop you on the main road. **Wangfujing** is the easy option, on Line 1 and walking distance from the Forbidden City. **Sanlitun** is for nights out. Confirm that the place registers foreign passports before paying for a non-refundable bed.

      Beijing sits between the other northern stops: a fast train from Shanghai on one side and from Harbin on the other.
