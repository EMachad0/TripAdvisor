  - type: quote
    variant: vibe
    text: Lamb steam in the lanes, a lit tower on the roundabout, a cold bike ride on top of the wall.
  - type: tips
    variant: insider
    items:
      - "Overnight D-train sleepers from Beijing leave around 20:30 and arrive about 08:30: a free night's bed and a full first day."
      - "Book the Terracotta Army online before you arrive: entry is real-name, with your passport number."
      - "Wikivoyage warns that Muslim Quarter prices can be double elsewhere: look for the long queues, or walk west to Sajinqiao."
  - type: tips
    variant: pitfalls
    items:
      - "Taxi drivers at the railway station can charge many times the normal fare (Wikivoyage): take the metro."
      - "By the old railway station, anyone in a lanyard selling bus \"tickets\" on the sidewalk is a scammer; the ride ends at a fake museum (Wander in China)."
  - type: weather
    temp_low_c: -3
    temp_high_c: 7
    conditions: Cold, dry, often grey; haze on some days
    note: "Below freezing at night. The wall and the Terracotta pits are cold, so plan indoor breaks. Check the air quality before an outdoor day; on a hazy one, save the wall and the views for later."
    wear: "Down jacket, gloves, scarf; a mask for haze days"
