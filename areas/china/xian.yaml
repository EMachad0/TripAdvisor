getting_there: "Night trains from Beijing (about 12 h; D-train sleeper ¥350–435) or Shanghai (11–16 h; ¥430–438). Leave on a G-train to Chengdu East: 3–4 h, ¥263–300."
getting_around: "Metro from ¥2, most central rides ¥2–5, about 06:00–23:00. Line 2 links Xi'an North station and the Bell Tower; Line 4 serves the old Xi'an station. The walled centre is flat and walkable."
winter_note: "Cold and dry: December averages −3 to 7 °C with about 6 mm of rain, and city snow is rare. Winter is heating season and haze is a real risk: a 2018 winter study measured PM2.5 averaging 68 µg/m³, with frequent days over 100. Low season means fewer crowds; the Terracotta Army closes at 18:00 and the wall's bike rental stops when rain is likely."
