blocks:
  - type: hero
    hook: "Capital of the Qin, Han and Tang, now a city of night-lit gates, wall-top bikes and lamb steam."
    caption: The Bell Tower lit up at night, in the middle of the walled city
  - type: highlights
    title: Why stop here
    items:
      - title: The Terracotta Army
        text: "Thousands of clay soldiers in Lintong, an hour out by bus. **¥120**, booked online with your passport. It has its own card below."
      - title: A bike ride on the wall
        text: "The Ming wall is **13.7 km** around and 15 m wide on top. Wikivoyage lists bike hire at **¥40 for 2 hours** on top of the ¥54 ticket."
      - title: Hui Muslim street food
        text: "Wikivoyage puts the best **roujiamo** and **yangrou paomo** in the Hui Muslim Quarter by the Drum Tower. Sajinqiao, on its western edge, has its own card."
      - title: The Bell Tower after dark
        text: "The lit Bell Tower sits on a roundabout in the middle of the walled city, on Metro Lines 2 and 6."
      - title: Bars south of the wall
        text: "Wikivoyage points to **Defu Xiang** bar street and the clubs along Nandajie, just inside the south gate."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Xi'an was the capital of the Zhou, Qin, Han, Sui and Tang dynasties, and the walled centre still feels like it. A 1370 Ming wall rings a flat grid of streets, with the Bell Tower in the middle and the Hui Muslim Quarter right behind the Drum Tower. Three nights work well: one day for the Terracotta Army, one on the wall and in the food streets, one spare for the Big Wild Goose Pagoda or a bar night.

      **Base yourself inside the wall, near the Bell Tower.** A 2026 neighbourhood guide calls it the default for first-timers: Metro Line 2 runs straight from Xi'an North station. Rooms on the main streets are noisy, and some of the smallest Muslim Quarter guesthouses can't register foreign guests, so check before you book.

      It sits neatly on the route. Arrive on a night train from Beijing or Shanghai, then ride the G-train to Chengdu in about three hours.
