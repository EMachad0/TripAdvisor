  - type: quote
    variant: vibe
    text: Bamboo chairs, a refilled gaiwan, and nowhere to be until the hotpot.
  - type: tips
    variant: insider
    items:
      - "Pick a train into **Chongqing North** rather than Chongqing West, which is about 15 km further across town (China for Travelers)."
      - "Do the pandas on a weekday morning and keep the afternoon for tea: the base and People's Park are both on the metro."
      - "Xi'an to Chengdu: sit by a window on a daytime train for the Qinling mountain crossing, about an hour out of Xi'an."
  - type: tips
    variant: pitfalls
    items:
      - "Around Chunxi Road, ignore \"art students\" and tea-house invitations from strangers: a known scam script."
      - "Metro ride codes in Alipay need a linked foreign card; set it up before you arrive."
