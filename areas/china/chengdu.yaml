getting_there: "From Xi'an North: G-train to Chengdu East, 3–4 h, ¥263–300 in 2nd class, ~80 a day. On to Chongqing: from 1 h 02, ¥85–191, about 143 trains a day."
getting_around: "Metro from ¥2, most central rides ¥2–5, about 06:20–23:00. Line 2 links Chengdu East, Chunxi Road and People's Park; Line 3 goes to the pandas. Taxis start at ¥9."
winter_note: "Mild for a China winter: December averages 5–11 °C, snow is rare, and it barely rains (about 7 mm in the month). But it is grey: December gets only 15% of possible sunshine and humidity sits around 82%, so the cold feels damp, and teahouses are open-air. The Panda Base runs winter hours (08:00 opening). No 2026 Christmas programme announced."
