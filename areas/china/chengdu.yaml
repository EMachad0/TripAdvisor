    conditions: Grey, humid, cool; very little rain and very little sun
    note: "Not freezing, but damp. Outdoor teahouses and the early panda start are the cold parts of the day. Indoor plans: the Dujiangyan bookstore."
    wear: Warm jacket, a layer to sit in, closed shoes
