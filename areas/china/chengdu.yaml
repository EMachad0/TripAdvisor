blocks:
  - type: hero
    hook: "The city that sits down: tea in bamboo chairs, hotpot steam and pandas eating breakfast."
    caption: Anshun Bridge lit up over the Jin River
  - type: highlights
    title: Why stop here
    items:
      - title: Pandas at opening time
        text: "The Panda Base opens at **08:00** in winter, ¥55 with a passport booking. The pandas are busiest at morning feeding."
      - title: Teahouse afternoons
        text: "At **Heming Teahouse** in People's Park, one bowl of tea with free refills buys you the afternoon; ear-cleaners work the tables."
      - title: Sichuan food at the source
        text: "Hotpot, mapo tofu and dan dan noodles in the capital of Sichuan cooking, from hostel hotpot parties to street snacks in **Jinli**."
      - title: Christmas in a mall around a temple
        text: "**Taikoo Li** wraps an open-air shopping district around the old Daci Temple. It has its own Christmas card below."
      - title: A staircase out of town
        text: "The Dujiangyan Zhongshuge bookstore, with its mirrored spiral stairs, is your **infinity staircase**, as a day trip."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Chengdu is a huge city, over 15 million in the urban area, that Wikivoyage describes as built around culture and relaxation, with parks, teahouses and green spaces everywhere. The days run slowly. Pandas first thing, tea in the afternoon, hotpot at night, then a bar.

      **Base yourself at Chunxi Road / Taikoo Li** (Jinjiang). A 2026 neighbourhood guide calls it the default for first-timers: Line 2 reaches Chengdu East station in 22 minutes, Line 3 runs to the Panda Base, and the food is walkable. The social Flipflop hostel is a minute from Taikoo Li. The same guide warns that Chunxi Road itself is touristy and has tea-house and "art student" touts. Kuanzhai Alley is the pick if you want old-Chengdu lanes instead.

      It fits the route neatly. Come down from Xi'an through the Qinling mountains (3–4 h by G-train), and leave for Chongqing on trains that run roughly every 15 minutes. With Christmas Eve and Day here, the Dec 26 train to Chongqing takes about an hour.
