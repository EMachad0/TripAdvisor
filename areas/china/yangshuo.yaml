getting_there: "Chengdu East to Yangshuo: 3 D-trains a day, 6h30–8h21, ¥443–479. On to Chongqing West: about 10 direct trains, 4h26–5h42, ¥329–497. The station is 34 km from town."
getting_around: "Bus from Yangshuo station to town ¥20, about 1 h. In the valley: bikes ¥20–50 a day, electric scooters, minibuses ¥1 a ride; Xingping minibus ¥5.5, 45 min. Agree taxi fares first."
winter_note: "Mild but grey: December highs 10–18 °C, nights 2–3 °C, 6–8 drizzly days. It is the dry season: Li River boats often start partway down from Guilin, and in deep winter (most often Jan–Mar) the big boats can be replaced by the Yangdi–Xingping raft. One guide calls rafting unsuitable in December. Impression Liu Sanjie closes in January or February."
