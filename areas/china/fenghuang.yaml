blocks:
  - type: hero
    hook: Stilt houses doubled in black water, a lit bridge, and the bar street humming until midnight.
    caption: Fenghuang's riverfront at night
  - type: highlights
    title: What justifies the stop
    items:
      - title: A free town on a river
        text: "Entering Fenghuang costs nothing: the lanes, both bridges, the stepping stones and the night lights are free. A **¥128** (R$106) ticket, valid 3 days, covers nine courtyard sights; you can skip it."
      - title: The night and the dawn
        text: "The riverside lights come on around **19:30**. China for Travelers rates the **06:30–08:00** river mist, with empty lanes, as the better hour. One night gets you both."
      - title: Furong on the way
        text: "Furong (芙蓉镇) is a Tujia town built over a 60 m waterfall, **23 minutes** from Zhangjiajie West on the same line. It is gated, **¥108** (R$89) for 3 days, and in December the falls are reported as a trickle."
      - title: It sits on the way to Chongqing
        text: "**G3376** leaves Fenghuang Gucheng at 16:38 and reaches Chongqing East at 20:25 for **¥314** (R$260). Or go back to Zhangjiajie West, which has 14 trains a day to Chongqing East."
  - type: prose
    title: What a night or two here is like in late December
    dropcap: true
    text: |-
      Take a morning train from Zhangjiajie West (G6061 07:05, or anything up to 19:20), a ¥7 shuttle or a ~¥25–30 taxi into town, drop the bag and walk the river in the afternoon. In December the CMA normals give **4–11 °C** and about 11 wet days in the month, so expect a damp, grey chill rather than frost; snow falls on about two days. The town's stone lanes and timber houses are unheated, so evenings by the river are cold.

      After dark the riverfront lights up around 19:30. The stretch between **Nanhua Bridge and Hongqiao** is the bar strip, with posted quiet hours of 23:30, though China for Travelers says the noise runs nearer 1 am. Sleep up- or downstream of it if you want sleep. The ticketed courtyards open roughly 08:30–17:30; one of them, Chongde Hall, is reported closed through 2026. No winter closures of the town or the lights were found.

      **One night** is what both English guides recommend; a second night gives you a slow morning and a day trip. For Chongqing on Dec 26, the cleanest move is a morning in town and the **16:38 G3376**.
  - type: prose
    title: The legs, in time and money
    text: |-
      All times and fares are 12306 results for 24 Nov 2026 (2nd class); December timetables are assumed the same.

      - **Zhangjiajie West → Fenghuang Gucheng:** 18 trains, 07:05–19:20, 51–66 min, **¥75–93** (R$62–77). E.g. G6061 07:05 → 07:56 ¥84, G6151 09:42 → 10:34 ¥93.
      - **With a Furong stop:** Zhangjiajie West → Furongzhen 23 min, ¥32–40 (11 trains, e.g. G6151 09:42 → 10:05); Furongzhen → Fenghuang Gucheng 27–40 min, ¥43–53 (e.g. G6097 17:23 → 17:56). Furong's station is ~2.5 km from the gate (~¥3 shuttle).
      - **Fenghuang → Chongqing, direct:** only **G3376** 16:38 → Chongqing East 20:25, 3h47, **¥314** (R$260).
      - **Back via Zhangjiajie West:** e.g. G6174 12:43 → 13:42 (¥93), then G2434 14:32 → Chongqing East 17:25 (¥215): **¥308** in all. Zhangjiajie West has 14 trains to Chongqing East from 07:30 to 19:47, 2h05–2h53, ¥197–222.
      - **Via Huaihua South:** 25–35 min, ¥34–42 from Fenghuang, then G-trains 3h31–5h06 to Chongqing for ¥290–393, or the overnight **K1172** 23:09 → Chongqing East 08:01, hard sleeper ¥144: with G6433 (20:27 → 20:54, ¥38) that is ¥182 and saves a bed.
      - **The detour:** going straight from Zhangjiajie West to Chongqing East costs ¥197–222. Going via Fenghuang (¥93 in, ¥314 out) costs about **¥185–210 more** (my sum) plus a night's bed; with the Huaihua sleeper out, only about ¥55–80 more and no extra bed.
  - type: prose
    title: Fenghuang or Hongcun as "the one old village"?
    text: |-
      They are different things. **Hongcun** is a small, ticketed (¥104) Ming-Qing village of white walls around a lake, best for 3–4 hours in the morning, and it costs a detour on the Shanghai–Beijing leg. **Fenghuang** is a free river *town*: bigger, more commercial and lit up at night, with bars, costume-photo studios and souvenir lanes, and it sits on the line from Zhangjiajie to Chongqing.

      In December, Hongcun's guides describe a cold (0–10 °C), quiet village with a chance of snow on the black roofs; Fenghuang is a little milder (4–11 °C) and its draw, the lit river, does not depend on the season. If you want stillness and architecture, Hongcun is closer; if you want an evening with other people on a river, Fenghuang. Both is possible, but if Huangshan is dropped, Fenghuang is the cheaper old town to add because it is already on your way.
