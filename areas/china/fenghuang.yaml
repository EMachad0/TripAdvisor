      - { file: furong-panorama, caption: "Furong, the town over the waterfall (photo from 2012)" }
  - type: quote
    variant: vibe
    text: Cold stone steps, a lantern on every eave, and a bar band drifting across the water.
  - type: tips
    variant: insider
    items:
      - "From Fenghuang Gucheng, the **Line 1** shuttle goes to Qifeng Square near Hongqiao, **Line 2** to Nanhuali at the upstream end (¥7, roughly 07:00–22:00)."
      - "On a day stop, the Nanhuali visitor centre has free left luggage, open to about 21:30 (China for Travelers)."
      - "Train sales open about **15 days** ahead: the one direct Fenghuang–Chongqing train is the one to book first."
  - type: tips
    variant: pitfalls
    items:
      - "Touts at the stations steer you to commission-paying inns and cheap **Miao-village tours** that end in a silver and medicine shop; book your bed ahead."
      - "Riverbank boatmen offering \"¥50 and I'll take you out\" are not the licensed service."
      - "Ride-hailing apps don't work in Fenghuang (Unusual Nomad): use the shuttle or a metered taxi."
  - type: weather
    temp_low_c: 4
    temp_high_c: 11
    conditions: Cool, damp and grey; about 11 wet days and 2 snowy days in December
    note: "CMA normals at 350 m: 4.4–11.0 °C in December, 37 mm of rain, 70.7 h of sun in the month. Fine for walking; cold by the river at night. Furong, 1 h away, should be similar (no figures found)."
    wear: Warm jacket, a rain layer, shoes with grip for wet stone steps
