blocks:
  - type: hero
    hook: Dry winter sun at 2,000 m, a lake to ride around, and grey-tile lanes that turn into bar streets after dark.
    caption: Erhai lake and the Cangshan range
  - type: highlights
    title: What justifies the detour
    items:
      - title: Real winter sun
        text: "December averages **72%** of possible sunshine, 233 hours, and about 11 mm of rain over 2–3 days."
      - title: A free old town
        text: "Travel China With Me (Sept 2026): the old town has no ticket, and the **Three Pagodas** just north of the walls cost ¥75 (R$62)."
      - title: Erhai by e-bike
        text: "About **¥50** (R$41) a day. Wikivoyage's lakeside route runs east to Caicun and north along the shore, past 17 villages and 3 Qing bridges."
      - title: Xizhou
        text: "About 20 km north, with almost 200 heritage-listed Qing houses (Wikivoyage) and **baba**, the local flatbread."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Dali is the slow, sunny break in a grey December. Sleep **inside the old town walls**, where everything is on foot. Mornings are cold, around 3 °C, but by midday it is near 16 °C, bright and dry: lake weather. Ride an e-bike along Erhai one day, go to Xizhou and the Three Pagodas another, and spend the evenings on Renmin Road, where Wikivoyage lists most of the bars.

      The old town was the capital of the Nanzhao and Dali kingdoms, and the plain between the Cangshan range and Erhai is Bai country. Wikivoyage lists **rushan**, a fried cheese often wound around bamboo skewers, as the snack to try.

      The reason to think twice is distance. Three nights is the minimum that makes the flights worth it; four leaves room for a Cangshan day if the sky is clear.
  - type: prose
    title: The detour in time and money
    text: |-
      Dali is far west of the main line. The natural loop is **Chengdu → Dali → Chongqing**, replacing the 1-hour Chengdu–Chongqing train:

      - **Chengdu → Dali by air:** 1h20–1h45, Trip.com's Dec 8–22 calendar mostly at **¥490** (R$405), ¥532 on Dec 15 (Lucky Air 06:40 from Tianfu, arrives 08:20).
      - **Chengdu East → Dali by train:** 2 a day, **8h09–8h16**, ¥661.5–695.5 (R$547–575). G2837 leaves 07:30, arrives 15:39.
      - **Dali → Chongqing by air:** about 1h25–1h40, **¥520–562** (R$430–465) for Dec 11–25. West Air 12:25 → 13:50 on Dec 18.
      - **Dali → Chongqing West by train:** 2 a day, **7h13**, ¥530.5 (R$439). G2850 leaves 09:56, arrives 17:10.
      - **Compared with going straight:** Chengdu → Chongqing starts at ¥85. Flying both ways costs about **¥1,010** plus airport transfers, or about **¥1,190** by train: roughly **¥930–1,110 extra** (R$765–915), by my sums.
      - **Transfers:** Dali station is in Xiaguan, 45–60 min on bus 8. The airport shuttle is ¥25–30.
