  - type: quote
    variant: vibe
    text: Sun on your face at noon, a down jacket at night, and a lake road with nobody on it.
  - type: tips
    variant: insider
    items:
      - "Flights beat trains here on time and often on price. Trip.com showed Chengdu–Dali fares from ¥490 on most December days."
      - "Rent e-bikes only through **Meituan or Qingju**; Travel China With Me warns about Youzi Huixing's ¥30 minimum and confusing top-ups."
      - "Train tickets go on sale 15 days before departure, and there are only two direct trains a day each way, so buy early."
  - type: tips
    variant: pitfalls
    items:
      - "Dali station is **not** at the old town; allow 1.5 h by bus for a departing train, or about 30 min by taxi."
      - "Travel China With Me advises skipping the restaurants right on Renmin Road and Fuxing Road."
      - "Wikivoyage's Cangshan cable car fares (¥80 return to Gantong Temple) are undated: check the current price on site."
