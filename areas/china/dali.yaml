getting_there: "Chengdu to Dali: flights 1h20–1h45 from ¥490 (mid-Dec search) or 2 trains, 8h09–8h16, ¥661.5–695.5. On to Chongqing: flights from ¥520, or 2 trains, 7h13, ¥530.5."
getting_around: "Old town on foot. E-bike about ¥50 a day (Meituan or Qingju). Bus 8 to Dali station in Xiaguan ¥2–3, 45–60 min; taxi ¥40–50. Airport shuttle ¥25–30, taxi ¥80–120."
winter_note: "The sunniest stop in a China December: 1991–2020 normals give 16.5 °C days, 3.5 °C nights, 11 mm of rain over about 2.6 days and 72% of possible sunshine. It is windy, so bring a windbreaker. A 2026 guide calls winter fine for the old town and less ideal for Cangshan hikes. No Christmas programme announced."
