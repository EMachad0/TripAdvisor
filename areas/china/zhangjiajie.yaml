getting_there: "Shanghai Hongqiao to Zhangjiajie West: 3 direct G-trains a day, 7h15–9h11, ¥786–826 in 2nd class. On to Chongqing East: from 2h21, 13 departures a day, about ¥191–261."
getting_around: "Coach from Zhangjiajie West to Wulingyuan ¥13, 30–70 min. City bus station to Wulingyuan ¥12, about 40 min. Park eco-buses are in the ticket. Taxi from city hotels to the Tianmen station ¥15–30."
winter_note: "City normals (219 m): Dec 4.9–12.2 °C, 8.6 wet days, only 23% of possible sunshine; the plateaus run 4–8 °C colder. Fog is frequent and can sit until 10–11 am. Snow is rare before late December: the first fall came on Dec 31 in both 2024 and 2025. Ice can shut lifts and glass walkways. Tianmen's city cableway is closed for rebuilding since 13 Oct 2026 (Line C only)."
