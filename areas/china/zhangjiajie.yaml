    images:
      - { file: tianzi-snow, caption: "A snowy viewpoint at Tianzi Mountain, winter 2026: the lucky version" }
      - { file: tianzi-cable-car, caption: "Tianzi Mountain and its cable car on a clear day with bare trees, 2026" }
      - { file: tianmen-cave-haze, caption: "Tianmen cave through haze" }
      - { file: city-from-tianmen, caption: "Zhangjiajie city and the 99-bend road from Tianmen's summit" }
  - type: quote
    variant: vibe
    text: Stone towers coming and going in the cloud, frost on the railings, and almost nobody else on the path.
  - type: tips
    variant: insider
    items:
      - "Keep the order loose. Do the park on the first clear morning, and move Tianmen to whichever day the forecast looks best: its ticket is tied to one date."
      - "A guide puts the clearest winter window at **10:00–14:00**, after the morning fog lifts."
      - "Book both tickets on **Trip.com** with your passport number. The official WeChat mini-program (张家界一机游) often fails to open for foreigners."
      - "Eat in town. Wikivoyage lists noodle shops in the city at ¥10–20 and warns that food inside the scenic areas is heavily overpriced."
  - type: tips
    variant: pitfalls
    items:
      - "Touts at Zhangjiajie West say the official coach has stopped and push cheap charters or tours that end at shops. The coach leaves from the bus depot to the right of the exit."
      - "Tianmen Mountain's city cableway is **not running** in December 2026. Older guides and photos still show it as the main way up."
      - "The big **glass bridge** is in the Grand Canyon, and the viral iron **sky ladder** is a via ferrata on Qixing Mountain: two separate sites with their own tickets and cards, not part of Tianmen."
      - "Airport taxis sometimes refuse the meter (Wikivoyage: the fare to the city should be ¥20–40)."
  - type: weather
    temp_low_c: 3
    temp_high_c: 12
    conditions: Cold, damp and often foggy; little sun; snow rare before late December
    note: "City figures: Dec 4.9–12.2 °C, Jan 2.9–9.5 °C, with 1.7 snowy days in December and 5 in January. The viewpoints sit around 1,000 m and run 4–8 °C colder, below freezing after sunset. For 9–22 December expect cold rain or fog more often than snow: one local guide says early December has 'little scenic value' on such days. A clear day after rain or snow is the prize."
    wear: Down jacket, thermal base layer, hat and gloves, grippy waterproof shoes, a poncho
