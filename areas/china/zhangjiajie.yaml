blocks:
  - type: hero
    hook: A forest of stone towers and a cave you climb 999 steps to reach, if the cloud lets you see them.
    caption: Tianzi Mountain, Wulingyuan, on a misty day
  - type: highlights
    title: What justifies the detour
    items:
      - title: The Avatar pillars
        text: "At **Yuanjiajie**, cliff-edge paths look across at free-standing sandstone towers. One of them, the Southern Sky Column, was renamed Avatar Hallelujah Mountain in January 2010."
      - title: Tianzi Mountain
        text: "A wide panorama over the pillar forest. A local guide ranks it the most reliable winter viewpoint because it sits above the cloud line more often than the others."
      - title: A 326 m lift on a cliff face
        text: "The **Bailong Elevator** (2002) climbs the cliff in under two minutes for **¥65** (R$54). The stairs beside it are free: about 2,000 steps, 1.5–2 hours."
      - title: Golden Whip Stream
        text: "A flat **7.5 km** walk along the valley floor between the towers, 2.5–3 hours end to end. The same guide calls it the underrated winter pick."
      - title: Tianmen Mountain
        text: "A **131.5 m** natural arch near the top of a 1,518 m mountain, with 999 steps up to it and glass walkways on the cliff. It has its own ticket (**¥288**, R$238) and its own card below."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Zhangjiajie is two separate mountain days. **Wulingyuan** is the pillar forest: you take a lift, a cable car or a long staircase up to a plateau, walk between viewpoints, and come down into a stream valley. **Tianmen Mountain** stands over the city itself, about 30 minutes by road from the park, and is a 5–7 hour trip up to cliff paths and a cave.

      Guides agree on **two days for the park**; one calls a single day "a rushed dash". Tianmen takes most of a third day. In December a fourth day is insurance, because the views depend on cloud and the park ticket is valid for four days.

      **Where to sleep.** Wulingyuan town is about five minutes from the park's east gate and is the base the guides recommend for the park. Zhangjiajie city is about 30 minutes from the park, and it is where Tianmen Mountain, the bus station and the airport are. A workable split: arrive, go straight to Wulingyuan for two nights, then one night in the city for Tianmen and the train out.

      December is the quietest season, so there are no queues to speak of. What you pay for that is light: daylight runs from about 07:15 to 17:45, and the sun shows for less than a quarter of it.
  - type: prose
    title: Getting in and out
    text: |-
      Fast trains use **Zhangjiajie West** (张家界西站), about 26 km from Wulingyuan. There is no station at the park.

      - **From Shanghai:** three direct G-trains a day. G219 leaves Hongqiao at 07:04 and arrives 14:19 (7h15). The others leave Shanghai South at 12:12 (8h34) and Hongqiao at 12:44 (9h11). Second class **¥786–826** (R$650–683). An overnight K-train from Songjiang takes 19h24 to the old Zhangjiajie station. Flights to Hehua airport take 2h10–2h25; the guide lists them at US$112–406.
      - **On to Chongqing:** 13 departures a day. The 07:30 G2452 reaches **Chongqing East** at 09:51 (2h21). The same trains continue to Chongqing West in about 3h20–3h28. Second class about **¥191–261** (R$158–216).
      - **Chengdu East:** 3h58–5h28, seven direct trains a day, **¥398–416** (R$329–344). The fastest stops at Chongqing East.
      - **Xi'an North:** one direct train, G3763, 9h33, **¥683** (R$565). Flights take about 1h25–1h30.

      From Zhangjiajie West, the coach to Wulingyuan costs **¥13** (R$11) and takes 30–70 minutes; the last one leaves around 19:00–19:20. A taxi or DiDi is about ¥55–80. To the city centre a taxi is about ¥15–35, or bus 6 for ¥1–2 in about 50 minutes.
