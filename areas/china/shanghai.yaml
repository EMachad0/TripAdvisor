blocks:
  - type: hero
    hook: "Art Deco banks on one side of the river, a 632 m tower on the other, and a ¥2 ferry in between."
    caption: The Bund at blue hour, seen from the Shanghai World Financial Center
  - type: highlights
    title: Why start here
    items:
      - title: The skyline, for free
        text: "The Bund promenade runs **1.6 km** along the river, facing Lujiazui and the **632 m Shanghai Tower**. Walking it costs nothing, and the river lights come on around 18:00."
      - title: Breakfast since 1932
        text: "**Da Hu Chun** has been frying shengjian, crisp-bottomed pork buns, since 1932. Four buns cost ¥11 (about R$9)."
      - title: A whole building of clubs
        text: "**INS Land** by Fuxing Park stacks clubs on several floors: hip hop, trap, house and K-pop under one ticket. It's one of the famous clubs on your list."
      - title: Old Shanghai on foot
        text: "Yu Garden's Ming rockeries, then the old French Concession (Wukang Road runs through it), which Wikivoyage says holds much of the city's shopping and nightlife."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Shanghai is where you land, so the first day is about getting into town. A **05:10 arrival at Pudong** beats the trains: Line 2 starts around 06:00 and the Maglev around 07:00. China for Travelers lists a night bus that runs until the last flight lands (about 05:30), plus a 24-hour taxi rank. The cheap plan: wait for the first Line 2 train (about ¥8, 70–90 minutes into town).

      **Base yourself in Jing'an or Huangpu.** The Desti hostel in Jing'an has its own card below. From there the Bund, People's Square and the French Concession are all a few metro stops away. Wikivoyage notes budget travellers spend more time in the older downtown than in Pudong.

      **Two to four days** covers it: one evening on the Bund and the ferry, one morning at Yu Garden and the old city, one day in the French Concession, and one night at INS (its all-pass is ¥168 Sunday–Thursday, ¥288 at weekends). If you come back for **Christmas**, the Bund's Christmas markets have their own card. Chongqing on Dec 26 is about a 3-hour flight; the high-speed train takes 10.5–13 hours.
  - type: gallery
    images:
      - { file: shanghai-nanjing-road-night, caption: "East Nanjing Road at night, the walk down to the Bund" }
      - { file: shanghai-wukang-mansion, caption: "Wukang Mansion, on a corner of the old French Concession" }
      - { file: shanghai-dahuchun-shopfront, caption: "Da Hu Chun on South Yunnan Road (\"since 1932\" on the sign)" }
  - type: quote
    variant: vibe
    text: Crisp buns at breakfast, gold-lit banks at dusk, bass on the fourth floor at 01:00.
  - type: tips
    variant: insider
    items:
      - "Set up **Alipay with your card** (or check your card does contactless) before you fly: the metro, ferries and DiDi all run on it."
      - "The ¥2 public ferry from Jinling East Road to Pudong is the cheapest river view in town. Its last sailing is in the early evening (see the Bund card)."
      - "Do the Bund at **dusk** (around 17:00 in December): blue sky, lights coming on, then dinner."
  - type: tips
    variant: pitfalls
    items:
      - "Metro last trains are about 22:30–23:00. Club nights end long after that, so budget a DiDi or taxi home."
      - "Don't plan the Maglev for a 05:10 landing: it doesn't run until about 07:00."
  - type: weather
    temp_low_c: 5
    temp_high_c: 11
    conditions: Cool, damp and often grey; about 8 rainy days in December; snow is rare
    note: "Not freezing, but the damp cold gets in, and many older buildings and shops have no heating. Dusk is just before 17:00. On a hazy day, skip the paid observation deck and watch from the riverside instead."
    wear: Warm jacket, a layer for unheated rooms, shoes that handle rain
