getting_there: "You land at Pudong (PVG). Metro Line 2 runs from about 06:00, ~¥8, 70–90 min downtown; the Maglev starts ~07:00 (¥50, 8 min, then change). Taxi ¥140–260."
getting_around: "Metro ¥3–5 for most central rides, about 05:30 to 22:30–23:00. Pay with a contactless card, Alipay ride-code or a transport card. After the last train: DiDi or taxi."
winter_note: "Cool and damp, not freezing: December averages 5–11 °C, about 8 rainy days and 69% humidity, and snow is rare. Many older buildings are unheated. The sun sets around 16:50–17:00, so the skyline lights are on by the time you've had dinner. Winter is the smoggy season: check the AQI before paying for a tower deck."
