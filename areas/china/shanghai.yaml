why: "Your first China stop: the Bund facing Lujiazui's towers (free to walk), a ¥2 river ferry, shengjian buns fried since 1932, and INS, a building full of clubs. Grey and damp in December, rarely snowy."
best_for: [views, food, nightlife, culture]
