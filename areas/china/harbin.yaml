lng: 126.6107
getting_there: "Fly Shanghai PVG–Harbin nonstop, from ¥672 (Dec 8 fare, searched Nov 10), or G-train from Beijing Chaoyang, from 4h33. Out: Harbin–Chongqing nonstop from ¥1,137 on Dec 25."
getting_around: "Metro Line 2 links Central Street with Ice and Snow World on the north bank. The old centre is walkable; taxis are hard to find in winter and often don't use the meter."
winter_note: "December normals are −19 °C at night and −10 °C by day (CMA 1991–2020), with snow on about 10 days. That cold is what builds the ice city. Ice and Snow World's 2026–27 opening date isn't announced (as of Nov 10); it opened Dec 18, 2023, Dec 21, 2024 and Dec 17, 2025. Before it opens, Harbin is still cold and pretty, but the main reason to come is missing."
