    wear: "Down parka with hood, thermal base layers, warm trousers, snow boots, hat, gloves, face cover"
  - type: tips
    variant: insider
    items:
      - "Don't book a non-refundable flight in before the ice city's date is announced. Last year that came about two days before opening."
      - "Brazilian wardrobe? Buy or rent the parka, trousers and boots **in Harbin** rather than hauling them around the rest of China."
      - "Book the Beijing–Harbin train on the first sale day: tickets open **15 days ahead** and the fastest trains sell out (Trip.com)."
  - type: tips
    variant: pitfalls
    items:
      - "Taxis are hard to find in winter, often don't use the meter, and pick up other riders. Use Line 2."
      - "Fares here are from one Nov 10 search. Christmas-week prices can rise, so check again before booking."
  - type: faq
    items:
      - q: This sounds nice but is far from Shanghai. How do I reach it?
        a: "**Fly.** A Trip.com search on Nov 10 for Dec 8 showed Shanghai Pudong–Harbin nonstop from **¥672 (R$556)**, about 2h45. The game's \"under ¥600\" was not on offer that day. From Beijing, G-trains run Beijing Chaoyang–Harbin West in **4h33** at the fastest (Trip.com). I couldn't confirm an overnight sleeper fare from Shanghai, so I've left it out."
        asked: 2026-11-10
        correction: true
