blocks:
  - type: hero
    hook: Ice castles lit in neon, onion domes under snow, and air so cold your eyelashes frost.
  - type: highlights
    items:
      - title: Ice and Snow World
        text: "The reason to come: a park of lit ice buildings on the north bank, **1.25 million m²** this season (plan). Opens in mid-to-late December; the date isn't out yet."
      - title: Central Street and Saint Sophia
        text: "Russian-built old quarter: the 1.4 km cobbled, pedestrian Central Street is free, and St. Sophia is the city's main landmark. Walk out onto the frozen river in winter."
      - title: Tigers on snow
        text: "Siberian Tiger Park: several hundred Amur tigers seen from a caged coach, ¥90, from 08:30 in winter. It doesn't depend on the ice city opening."
      - title: Cheap beds by the metro
        text: "Hostel dorm beds by Central Street were **¥58–98** a night for Christmas week when searched (Hostelworld)."
  - type: prose
    title: How Harbin fits the route
    dropcap: true
    text: |-
      Harbin is a long way north: about 2h45 by air from Shanghai, more than four hours by the fastest train from Beijing. It only pays off once **Ice and Snow World** is open. The last three seasons opened on **Dec 18, Dec 21 and Dec 17**, and last year's date was announced only about two days before. So the safe slot is the end of your China dates: arrive around **Dec 21–22**, give it 3 nights, and fly out to Chongqing.

      **Leaving for Chongqing**: on Fri **Dec 25** an Air China nonstop flies 11:55–16:25 for ¥1,137 (R$940). On Sat **Dec 26** the earliest arrival in that search was a 07:00 one-stop via Yulin, landing 12:20 (¥1,107); nonstops landed 15:55 or later (from ¥1,404). Both fares are from a Nov 10 search for those dates.

      Base yourself near **Central Street metro** (Line 2): the old street is on foot, and the same line crosses the river to the ice city.
