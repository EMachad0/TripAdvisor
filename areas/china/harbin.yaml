why: "China's ice city: a park of lit ice castles across the frozen Songhua, Russian-era Central Street, and Siberian tigers on snow. Worth it only once Ice and Snow World opens (Dec 17–21 in past years), with −19 °C nights."
best_for: [views, nature, culture]
highlights: ["Harbin Ice and Snow World", "Central Street at Christmas", "Saint Sophia Cathedral", "Siberian Tiger Park", "The frozen Songhua River"]
days_suggested: { min: 2, max: 4 }
cost_level: medium
