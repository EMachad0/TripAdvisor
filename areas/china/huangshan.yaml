blocks:
  - type: hero
    hook: Granite needles in frost, a sunrise above the cloud, and a whitewashed village reflected in a lake below.
    caption: Huangshan at sunrise in winter
  - type: highlights
    title: What justifies the detour
    items:
      - title: The mountain in winter
        text: "Wikipedia gives **6.5 snowy days** in an average December at the 1,840 m station. China Highlights says the **sea of clouds** shows more often in winter, and snow lingers on the peaks."
      - title: Walk up, ride down
        text: "Wikivoyage says the **Eastern Steps** can be climbed in 2–3 hours; the Western Steps take 6–7. Cable cars cost **¥80** (Yungu, Taiping) or **¥90** (Yuping) one way until Dec 19, 2026."
      - title: One ticket, three days
        text: "The 2026 policy makes the **¥190** (R$157) ticket valid for three days with re-entry, if you book the first day on the official mini-program and check in at the gate that day."
      - title: Hongcun on its lake
        text: "A Hui village of white walls around **South Lake**, 1–1.5 h by bus from the mountain or the station. Travel China With Me suggests sleeping there to see it at dawn without day-trippers."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      This is a cold-mountain stop on the way north. Take a morning train from Shanghai, sleep in **Tangkou**, the town at the south gate that Wikivoyage calls walkable and cheap (hotels around ¥80), and go up early the next day. A summit night is possible but costly: Wikivoyage lists mountain dorms at ¥100–300 and says some hotels close in winter.

      On top it is close to freezing all day in December, and you may walk in fog for hours. The prize is a clear morning after snow, with rime on the pines. Hours are short (07:30–16:40 in December 2024) and trail gates close to new hikers at 15:00, so start early.

      Day three is **Hongcun** (or Xidi on the same bus line), then back to Huangshan North for a train to Beijing South: five to eight hours, so a morning train arrives the same evening.
  - type: prose
    title: The detour in time and money
    text: |-
      - **Shanghai → Huangshan North:** about 58 trains a day on the 12 Nov timetable. The fast ones take **2h22–3h** from Hongqiao or Shanghai South, 2nd class **¥183–237** (R$151–196). G997 leaves Shanghai South at 07:30 and arrives 09:52.
      - **Huangshan North → Beijing South:** 11 trains a day, **5h05–8h20**, **¥546–686** (R$451–567). G88 leaves 17:36, arrives 22:41. A slow K1110 from the old Huangshan station takes 19h40, hard sleeper ¥304.5.
      - **Compared with going straight:** Shanghai → Beijing G-trains take 4h24–7h24 for ¥498–697. Going via Huangshan adds roughly **¥200–300** and half a day of train (my estimate from these fares), plus buses of ¥20–30 each way at the Huangshan end.
      - **The mountain day:** ticket ¥190 plus one cable car (¥80–90) and the shuttle both ways (¥19 each) is about **¥310–320** (R$255–263), well over the R$170 daily budget. Walking both ways saves the cable car.
  - type: gallery
    images:
      - { file: huangshan-icy-steps, caption: "Rime on the trees along a summit staircase, in fog: a common winter day" }
  - type: quote
    variant: vibe
    text: Frost on the railings, a steaming cup of noodles, and the peaks showing for ten minutes between clouds.
  - type: tips
    variant: insider
    items:
      - "Book the mountain ticket on the **黄山旅游官方平台** mini-program with your passport, and get it checked at the gate on day one. Without that check the three-day re-entry is not activated."
      - "Train sales open **15 days** before departure on Trip.com. Shanghai to Huangshan has plenty of trains; the Beijing leg has only about 11."
      - "Buy food at the bottom: Wikivoyage says mountain-top prices are about double."
      - "Vendors on the mountain sell **snow spikes** for your shoes (Wikivoyage); China Highlights says crampons can be rented at the base."
  - type: tips
    variant: pitfalls
    items:
      - "Check the official notices in late November. A cable car can be shut for maintenance, and in 2024 Tiandu Peak and the Xihai Grand Canyon closed for the whole winter."
      - "Prices change on **Dec 20**. In the 2025–26 winter the ticket dropped to ¥150 from Dec 20. The 2026–27 winter rate has not been announced."
      - "China Highlights advises avoiding Fridays and Saturdays, when the weekend crowds come."
  - type: weather
    temp_low_c: -3
    temp_high_c: 3
    conditions: Freezing on the peaks, often cloud or fog, some snow; milder in the villages
    note: "Summit-station normals for December: −3.1 to 3.4 °C, 68 mm over 10.8 days, 6.5 snowy days, 52% of possible sunshine. Down in Hongcun a guide gives 0–10 °C. Fog can hide everything for a day, so keep a spare day if the views are the point."
    wear: Down jacket, thermals, hat and gloves, waterproof boots with grip, snow spikes
