  - type: quote
    variant: vibe
    text: Neon in the fog, a train sliding out of a wall, and chilli oil on the air.
  - type: tips
    variant: insider
    items:
      - "Do the night sights on a **weekday**: Hongyadong is quietest on winter weeknights, and the cableway queue is 10–15 minutes or less on an ordinary weekday against an hour or more on weekend evenings."
      - "Ride the cableway **one way** and come back by metro. A guide warns that the return leg needs a new queue number at the far station."
      - "For Hongyadong, take Line 1 or 6 to **Xiaoshizi** and walk 8–12 minutes to the top level, then work down through the building to the river."
      - "Arriving from Chengdu, pick a train into **Chongqing North**: it is about 8 km and 20–35 minutes by metro from Jiefangbei."
  - type: tips
    variant: pitfalls
    items:
      - "The metro stops at about **22:30**. Plan a taxi after a late night (flag fall ¥8, per Wikivoyage)."
      - "Metro QR codes in Alipay or WeChat usually need a Chinese phone number. Single tickets from the machines work without one."
      - "Wikivoyage warns that some bars pressure customers into large extra charges on the way out. Ask for prices before ordering."
      - "On major holidays Hongyadong may ask for a free timed reservation on its official WeChat account. New Year's Day is the one that falls in this trip."
  - type: weather
    temp_low_c: 6
    temp_high_c: 12
    conditions: Damp, grey and often foggy, almost no sun
    note: "The mildest big stop on the China route: no ice, and snow is rare. But January gets only about 5% of its possible sunshine and it rains lightly on about 10 days a month, so daytime views are flat and hazy. The night sights lose nothing, and the fog suits them."
    wear: Mid-weight jacket, a rain layer, shoes with grip for wet stairs
