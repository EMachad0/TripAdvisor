getting_there: "From Chengdu East: 1–2 h by G-train, ¥85–191 in 2nd class, about 143 trains a day into Chongqing North (20–35 min by metro to Jiefangbei). From Shanghai: 10.5–13 h by rail, or a domestic flight."
getting_around: "Metro and monorail: ¥2–10 a ride, ¥18 for a 24 h pass, about 06:00–22:30. Yuzhong's sights are close together but stacked: expect stairs, lifts and bridges between street levels."
winter_note: "Mild for a China winter: daily lows about 6–8 °C and highs about 10–12 °C in Dec–Jan, but damp, grey and often foggy, with very little sun. Snow is rare. Christmas lights go up around Jiefangbei, and winter is peak hotpot season. Crowds are light outside New Year's Day. Trip.com advises against Wulong mountain hikes in January because of poor visibility."
