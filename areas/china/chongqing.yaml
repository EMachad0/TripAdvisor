blocks:
  - type: hero
    hook: A city built in layers, where the ground floor of one street is the rooftop of the next.
    caption: Hongyadong, eleven storeys of stilt houses lit up above the Jialing River
  - type: highlights
    title: The cyberpunk city, piece by piece
    items:
      - title: Hongyadong after dark
        text: "Eleven storeys of stilt-house facades climb about **75 m** of cliff above the Jialing. Entry is **free**, and in winter the lights come on around **18:30** and go off at 23:00. The classic full view is from the Qiansimen Bridge walkway."
      - title: The train through the building
        text: "At **Liziba**, a Line 2 monorail runs into a 19-storey apartment block and stops on floors 6–8. Watching from the street is free."
      - title: A cable car as public transport
        text: "The **Yangtze River Cableway** has crossed 1,166 m of river since 1987 in under four minutes. One way costs **¥20–30** (R$17–25; sources disagree). Winter hours are 08:00–21:00, and the window accepts a passport."
      - title: Raffles City at the river confluence
        text: "Eight towers by Moshe Safdie, the tallest **354.5 m**, with a 300 m glass skybridge laid across four of them. The view of it from the riverbank is free. Guides put the deck at about ¥100–180 (R$83–149)."
      - title: Streets on the 22nd floor
        text: "The hills stack the city so that a bridge can land on an upper floor. One guide sends you to **Kuixinglou**, an apartment block with a viewpoint on its 22nd floor, for early evening."
      - title: Hotpot in its home town
        text: "Winter is hotpot season. A sit-down hotpot at a well-known downtown restaurant runs about **¥80–120** a head (R$66–99), and a bowl of plain **xiaomian** noodles is listed at ¥7 (R$6)."
  - type: prose
    title: What a few days here feel like
    dropcap: true
    text: |-
      Chongqing sits on a steep peninsula where the Jialing runs into the Yangtze, and it grew upward and sideways at once. Monorails pass over your head and under your feet. You take a lift to cross a road. Fog softens the neon on most winter evenings, which is a large part of why photos of it look like a film set.

      The days are for walking the levels: Liziba, the cableway, the riverbank below Raffles City. The city is at its best at night, and most of that is free. Hongyadong lights up at dusk, the skyline across both rivers follows, and on Saturdays there is a free drone show over the confluence (it has its own card below).

      **Base yourself in Jiefangbei**, in Yuzhong district. Trip.com's area guide calls it the best overall for first-timers: Hongyadong, Raffles City and the cableway are all within walking distance, and the metro connects to the airport and the main stations. Weekends are crowded and the hotpot streets are loud late. Nan'an, across the Yangtze, is cheaper and quieter but 20–30 minutes away and hilly.

      Chengdu is an hour or two away by train, so the two cities fit into one loop.
