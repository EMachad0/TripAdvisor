  - type: tips
    variant: insider
    items:
      - "Ayutthaya station is on the **east bank**, not on the island: take the ฿5 ferry across, a tuk-tuk from the station should be no more than ฿100 for two."
      - "The ฿300 multi-site ticket is valid for **seven days**, so it also covers an overnight. Some temples, like Wat Thammikarat, are not on it."
      - "Tuk-tuks quote about ฿300 an hour; a bicycle at ฿40 a day is the budget way round."
