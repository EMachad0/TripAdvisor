blocks:
  - type: hero
    hook: "Brick towers of the old Siamese capital, reached on a ฿15 train and explored by bicycle."
    caption: "Wat Chaiwatthanaram at dusk"
  - type: highlights
    items:
      - title: The Buddha head in the roots
        text: "At **Wat Mahathat** a stone Buddha head is grown into the roots of a fig tree, the image everyone knows from Ayutthaya."
      - title: A capital in ruins
        text: "The historical park has been a **UNESCO World Heritage Site since 1991**: royal temples like Wat Phra Si Sanphet stand in open lawns."
      - title: Cheap to reach, cheap to see
        text: "A third-class train costs about **฿15–20 (R$2.47–3.30)**, a bicycle about ฿40 a day, and one **฿300 (R$49.47)** ticket covers seven monuments for seven days."
      - title: Sunset at Chaiwatthanaram
        text: "**Wat Chaiwatthanaram**, in the park's buffer zone off the island, is open 08:30–18:30 (no tickets after 18:30, but you may stay a while after). Staying overnight lets you catch sunset there without chasing the last train."
  - type: prose
    title: Day trip or overnight?
    text: |-
      **A day trip** is what most visitors do, and it works well. Catch a morning train north, cross on the ฿5 ferry, rent a bicycle and loop the main temples on the island, such as Wat Mahathat and Wat Phra Si Sanphet. Head back to Bangkok in the late afternoon. Expected spend, without food: about ฿40 in train fares, ฿40 for the bike and ฿300 for the multi-site ticket, so about **฿380 (R$62.66)**, well under the R$100 daily budget.

      **An overnight** buys the two ends of the day: the ruins in the cool of early morning before the day-trippers arrive, and **Wat Chaiwatthanaram** at sunset without racing for the last train. It also leaves time for the sites further out. Wikivoyage lists plenty of places to sleep, though the town is quiet at night compared with Bangkok.

      **Getting there.** The cheapest is an ordinary third-class train from **Hua Lamphong**, about ฿15, 80 minutes to 2 hours. Faster rapid and express trains leave from **Krung Thep Aphiwat** (Bang Sue): about ฿20 in third class, up to ฿345 for air-con special express. The newer **SRT Bangkok Connex** commuter train runs via Don Mueang for ฿50, about 1 h 15 min, unreserved. Minivans and first-class buses also leave from the Northern Bus Terminal (Mo Chit), taking from about an hour to over two hours depending on traffic.
