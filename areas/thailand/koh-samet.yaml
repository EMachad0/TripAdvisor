  - type: tips
    variant: insider
    items:
      - "**Fits your week:** Sun Jan 3 → Mon Jan 4, back on Monday's 12:00 bus from Ban Phe (Ekkamai around 15:00–16:00, before your 19:00 shift)."
      - "Buy a **one-way** ferry ticket: the return gives no discount, and you can come back from either Ban Phe pier."
      - "Bring cash: the island has **one ATM** (opposite the Hat Sai Kaew tourist centre), and the park fee is cash only. ATMs at Ban Phe pier charge high fees."
  - type: tips
    variant: pitfalls
    items:
      - "Ticket sellers at the pier may say you must buy the park ticket from them; you can pay at the gate."
      - "Hat Sai Kaew is noisy with jet skis and crowded on weekends; walk south for calmer water."
      - "Scooter rentals are everywhere, but inside the park the roads are in poor shape: only for experienced riders."
