blocks:
  - type: hero
    hook: "Crystal sand a morning's bus ride from Ekkamai, fire twirlers after dark, and the noon bus back on Monday."
    caption: "Food vendors' baskets on a Ko Samet beach"
  - type: highlights
    items:
      - title: The nearest real beach
        text: "Hat Sai Kaew, \"crystal sand beach\", is 1 km of white sand near the main pier, and the busiest. Further south, coves like **Ao Wong Duean** and **Ao Nuan** get quieter."
      - title: Fire shows on the sand
        text: "Fire twirlers work their way along **Hat Sai Kaew and Ao Hin Khok** between 18:00 and 22:30; a donation is appreciated."
      - title: A backpacker night out
        text: "**Ao Phai** is where the party crowd ends up: flyers for drink specials on the beach by day, and **Silversand Bar**'s dance floor at the end of the night."
      - title: Seafood on the beach
        text: "Restaurants set tables on the sand at night with seafood barbecues; roti stands pop up everywhere from ฿40."
  - type: prose
    title: What a weekend here buys
    text: |-
      **Versus staying in Bangkok:** Bangkok has no beach. Samet is the closest real one, a national-park island with white-sand beaches, and its Saturday night out is a beach-bar crowd of backpackers and Bangkok weekenders. You give up a Bangkok night and spend about 7–10 hours in transit over the two days.

      **How it fits your week.** The best fit is **Sun Jan 3 → Mon Jan 4**: the **09:00 or 11:00 bus** from Ekkamai on Sunday, a night on Ao Phai, then a late-morning ferry to Ban Phe for the **12:00 Cherdchai bus** back on Monday. At 3–4 hours on the road that puts you in Ekkamai around 15:00–16:00, about three hours before your 19:00 shift; the 14:00 bus (in around 17:00–18:00) is too tight. **Sat Jan 2** is your flight day from China, so a Saturday start only works if you land the night before or very early. Jan 9–10 doesn't work: you fly to Korea on Sun Jan 10 and the buses back leave only at noon and 14:00.

      **What it costs.** Bus about ฿190 each way, ferry ฿50–70 each way, the ฿200 park fee and two songthaew rides at ฿20–60: roughly **฿720–840 (R$119–139)** before food and drinks, well inside two days of your R$100 budget. The bed is separate: a dorm around ฿500–600 (R$82–99) at the Cocoon Hostel near the pier.

      **Where to base.** **Ao Phai** for nights out; **Hat Sai Kaew** is close to the pier and busy; the Cocoon Hostel is a 400 m walk from Na Dan pier.
