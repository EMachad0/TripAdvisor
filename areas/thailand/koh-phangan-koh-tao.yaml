blocks:
  - type: hero
    hook: "Halfmoon raves and Haad Rin bar nights on Phangan, snorkel bays on Tao. The Full Moon Party misses your dates."
    caption: "Koh Nang Yuan's sandbar from the viewpoint, off Koh Tao's north-west coast"
  - type: highlights
    items:
      - title: Parties that can fit early January
        text: "**Halfmoon Festival** runs two-night editions about a week either side of each full moon near Ban Tai, the **Black Moon Party** falls around the new moon, and jungle parties run their own calendars. Their January 2027 dates weren't out when checked."
      - title: Dive school island, at a price
        text: "An **Open Water course** on Tao runs around ฿9,000–9,800 (R$1,480–1,620) per Wikivoyage: about **15 days of your R$100 budget**, so only if diving is the point of the trip. The cheap taste is snorkelling (below)."
      - title: Snorkel bays
        text: "Small black-tip reef sharks at **Shark Bay**, boulders and clear water at **Mango Bay**, and the islet of **Ko Nang Yuan**, by road or longtail. Snorkel gear rents for about ฿100 a day."
      - title: The Full Moon Party (not on your dates)
        text: "An all-night party on **Haad Rin's Sunrise Beach** since the mid-1980s, ฿200 at the gate. **Not on your dates:** 24 and 31 Dec fall in China, 22 Jan in Korea."
  - type: prose
    title: Does the Full Moon Party fit this trip?
    text: |-
      **Not on the current dates.** The party follows the moon: the last two of 2026 are on **24 December** and a New Year's countdown on **31 December** (you are in China), and the first of 2027 is **Friday 22 January**, when you will be in Korea. Seeing it means moving Thailand by about two weeks, or flying back from Korea for a weekend, which is far more than it is worth.

      **What is left in early January** is the island's other party calendar. Halfmoon stages two-night editions roughly a week before and after each full moon, so one edition should land in the gap between 24 December and 22 January, but its 2027 dates were not out when we checked. Haad Rin's bars also run most high-season nights anyway.

      **How it fits the work week.** Both islands are a full night or day away from Bangkok, so a weekend alone is not enough: Saturday night on the bus, Sunday on the island, and you are back on Monday night only if every boat is on time. This only works with extra days, or with the laptop: Phangan's quiet yoga village of **Srithanu** or value-priced **Thong Sala** suit working 19:00–04:00, and Tao fills your afternoons with dives. Rough seas can stop the boats for a day or two in the rainy season, so leave a spare day before a flight out.
