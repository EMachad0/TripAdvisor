winter_note: "The Gulf's rainy season runs October–December and rough seas can stop the boats for a day or two; January is the tail of it: about 24–29 °C and roughly 127 mm of rain on Samui (1991–2020). The Dec 24 and Dec 31 parties fall while you are in China, and the next one, Fri 22 Jan 2027, is after you have left for Korea."
