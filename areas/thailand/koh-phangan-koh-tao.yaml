  - type: tips
    variant: insider
    items:
      - "**Slot: needs extra days, or a weekend + laptop.** Too far for a Saturday-night-only trip."
      - "Cheapest way down: Lomprayah's **21:30** bus + ferry from Bangkok (pickup at Khao San or Pinklao: confirm which when booking; ฿850 to Tao, ฿1,150 to Phangan, changing to the catamaran at Tao). The 22:00 bus + catamaran costs ฿200–400 more."
      - "For a party night, don't sleep in Haad Rin: Ban Tai and Thong Sala have normal prices and songthaews run the party route all night."
  - type: tips
    variant: pitfalls
    items:
      - "Wear shoes on the party beach (broken glass), stay out of the sea after dark and watch your bucket being poured: organisers warn some contain methanol."
      - "On Koh Tao, photograph every scratch on a rental scooter: some shops hold your passport and charge for damage that was already there."
