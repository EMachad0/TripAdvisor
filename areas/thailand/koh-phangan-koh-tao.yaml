getting_there: "No airport. Lomprayah from Bangkok (Khao San or Pinklao pickup): 21:30 bus+ferry, Tao 08:15 ฿850, Phangan 10:30 ฿1,150; 22:00 catamaran ฿1,250/1,350. Or fly Surat Thani ~฿1,300 + ฿600–950 bus+ferry."
