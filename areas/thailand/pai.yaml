getting_there: "Van from Chiang Mai only (no train, no flights): Prempracha from Arcade terminal hourly 06:30–17:30, about ฿150–355 (R$25–59), 3.5–4 h on Route 1095. aYa vans ฿250 with hotel pickup."
getting_around: "The centre is walkable. Everything else needs wheels: scooters about ฿100–300 a day (deposit or passport), bicycles ฿40–100, plus motorbike and 4WD taxis."
