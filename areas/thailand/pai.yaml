  - type: hero
    hook: "Red sandstone ridges, valley mist at dawn and reggae bars by the river, a morning of hairpins from Chiang Mai."
    caption: "Pai Canyon at sunset"
    focus: "85% 70%"
  - type: highlights
    items:
      - title: Pai Canyon at sunset
        text: "Narrow red ridges with 50 m drops on both sides, about 8 km from town. Free, and the classic sunset spot. Paths are narrow, so stick to the steps if you're unsure."
      - title: Mist from Yun Lai
        text: "Above the Yunnanese **Santichon** village, the Yun Lai viewpoint (฿20) looks over the valley, best on cool-season mornings when mist fills it."
      - title: Hot springs on a cold evening
        text: "**Tha Pai Hot Springs** (฿300 for foreigners) mixes 80 °C sulphur water with a stream. Resort pools nearby charge about ฿80 and stay open after dark."
      - title: The backpacker scene
        text: "The **Walking Street** comes alive in the evenings in peak season, with live music and reggae bars in town and late-night bars across the bridge on the eastern edge."
  - type: prose
    title: What a few days here buy you
    text: |-
      Pai is the opposite of Bangkok: one main street, rice paddies and mountains all around, and days that run on a scooter. Two nights give you one sunrise, one sunset at the canyon and one night out; three or four let you add the hot springs, the 815-metre **bamboo bridge** across the paddies (฿30) and the **White Buddha** above town, reached by 353 steps. The town itself has few sights; people come for the valley and the mood. In return you get mountain air, cold nights and a backpacker town you can walk end to end.

      **Does it fit your dates?** Only if you work your night shifts from up north. Your free nights are Sat 2, Sun 3 and Sat 9 Jan, with 19:00–04:00 shifts Mon 4 – Fri 8 Jan. The plan: the **18:40 sleeper No. 9 from Krung Thep Aphiwat** (Bang Sue, not Hua Lamphong) on Sat 2 Jan, arriving Chiang Mai about 07:15; the van to Pai on Sun 3 Jan; **two to four shift nights from Pai** (or split them with Chiang Mai); then back down the road to fly Chiang Mai–Bangkok (about 1h10–1h25 in the air, ฿700–1,500 if booked 2–4 weeks ahead, more if left late, so book it with the train) before Sun 10 Jan. That assumes your Seoul flight leaves from Bangkok; it isn't booked yet. Test the Wi-Fi the first afternoon. If you won't work from the mountains, skip Pai.

      **Book the train now.** Lower berths on No. 9 sell out first, earliest for November–February. SRT sells seats 90 days ahead on its D-Ticket site (dticket.railway.co.th), so 2 Jan is already bookable: upper ฿941, lower ฿1,041.

      **What the detour costs.** Sleeper ฿941–1,041 + two vans ฿150–355 each + the flight back ฿700–1,500 comes to about **฿1,940–3,250 (R$320–536)** in transport if the flight is booked early (a late flight costs more), before beds and food. That is three to five days of the R$100 daily budget, spread over a week you'd be working anyway.

      **Getting here.** Pai only makes sense as an add-on to **Chiang Mai**. Prempracha vans leave Arcade bus terminal (Terminal 2) every hour on the half hour from 06:30 to 17:30, and aYa Service runs seven vans a day from 08:30 to 14:30 with pickup at your hotel. Expect 3.5–4 hours with one rest stop halfway at Mae Sae. Route 1095 is a steep mountain road: take a motion-sickness pill if you need one. Big bags go on the roof, 15 kg a person.

      **Where to stay.** In or near the centre, so you can walk back from the bars. Wikivoyage warns that packs of territorial dogs roam the empty streets at night beyond the two main bar streets.
