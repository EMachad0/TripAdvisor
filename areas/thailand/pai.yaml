      - "Sit near the front of the van and eat a light breakfast before the curves."
      - "Bring a warm layer for sunrise at Yun Lai and for scooter rides after dark."
  - type: tips
    variant: pitfalls
    items:
      - "Police report an average of **two accidents a day** on the Chiang Mai–Pai road. Ride a scooter up only if you are already a confident rider."
      - "Scooter rentals keep your passport or a ฿2,000–3,000 cash deposit; read the insurance terms first."
      - "No shared van leaves Chiang Mai airport for Pai: go to Arcade or your hotel's pickup first."
