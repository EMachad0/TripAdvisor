getting_there: "Sleeper No. 9 from Krung Thep Aphiwat, 18:40 → ~07:15, berth ฿941–1,041 (R$155–172). Or fly from DMK/BKK, 1h10–1h20, about ฿700–1,500 (R$115–247) before bags. Laptop trip only (see below)."
getting_around: "Walk the 1.6 km-a-side old town. Red songthaews: ฿30–40 inside the walls (more in high season), more outside (agree first). Grab around ฿60–80 for a few km; a scooter for Doi Suthep and the hills."
winter_note: "January is the cool, dry season: about 16 °C at night and 30 °C by day (1991–2020 normals). Northern crop burning runs roughly December–April and peaks in March; in 2025 haze already hid the Doi Suthep view by 11 January, so late January can be smoky. Check the air quality before a view day."
