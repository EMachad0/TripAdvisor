  - type: tips
    variant: insider
    items:
      - "Book the **No. 9** sleeper as soon as your dates are fixed: lower berths go first in high season. If it is full, No. 13 (20:05, ฿771–841) still arrives at a sensible hour."
      - "Use **Grab or Bolt** rather than tuk-tuks: Wikivoyage says Grab is usually cheaper than a haggled tuk-tuk, and Bolt is often 10–20% cheaper again."
      - "Go up Doi Suthep early on a clear morning; on a hazy day the famous view is grey."
  - type: tips
    variant: pitfalls
    items:
      - "Drinking and smoking are banned on the Sunday Walking Street, with fines up to ฿4,000."
      - "Drivers at the bus terminal may show a 'fixed' price list of ฿100–200 into town; Wikivoyage puts a fair tuk-tuk fare at about ฿50–60."
