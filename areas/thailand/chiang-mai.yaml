blocks:
  - type: hero
    hook: "Gold chedis above a moated old town, a mountain temple at the city's edge and cool mornings."
    caption: "The gold chedi of Wat Phrathat Doi Suthep, on the mountain above the city"
    focus: "50% 45%"
  - type: highlights
    items:
      - title: The temple on the mountain
        text: "**Wat Phrathat Doi Suthep** sits at 1,073 m, 18 km from town, up 200-plus Naga-lined steps (or a ฿20 cable car). Open 07:00–17:00. Shared red songthaews go up from the zoo for about **฿50** one way (≤฿80 from Chang Phuak Gate); entry fee not on our sources."
      - title: Sunday Walking Street
        text: "Every Sunday from about 16:00 to 23:00, Ratchadamnoen Road from **Tha Phae Gate** to Wat Phra Singh closes to cars and fills with craft and food stalls. A smaller one runs on Saturdays on Wualai Road."
      - title: Temples on foot
        text: "More than **30 temples** inside the old walls, among them the earthquake-broken giant chedi of **Wat Chedi Luang** and the Lanna murals of **Wat Phra Singh**."
      - title: Northern food
        text: "**Khao soi** (curry noodle soup), *sai ua* sausage and *hang lay* pork curry. Wikivoyage rates the food here second only to Bangkok."
  - type: prose
    title: What a few days here buy you
    text: |-
      Bangkok gives you the big-city version of Thailand; Chiang Mai is the slower, older one. Three days cover the essentials: one for the old-town temples on foot, one for **Doi Suthep**, ideally in the morning, and one for food, a market and a night out. Pai is a further detour from here (see its card).

      **Does it fit your dates?** Only as a laptop trip. Your free nights are Sat 2, Sun 3 and Sat 9 Jan, and you work 19:00–04:00 Mon 4 – Fri 8 Jan. The one plan that works: take the **18:40 sleeper on Sat 2 Jan**, arrive Sun 3 Jan for the **Sunday Walking Street** that evening, work your shifts from a Chiang Mai hostel, and see the city in the afternoons. Then fly back to Bangkok on Sat 9 Jan, because you leave for Seoul on Sun 10 Jan. A weekend-only trip doesn't work: a Sat 9 Jan sleeper would arrive the morning of your flight.

      **Where to base yourself.** The **east half of the old city**, around Tha Phae Gate, has the most guesthouses, restaurants and scooter rentals, and you can walk to the Sunday market and most temples. **Nimmanhaemin**, near the university, is where young Thais go out, with bars that sit between pub and club; it suits nights more than sightseeing.

      **Getting here.** The overnight **No. 9 sleeper** from Krung Thep Aphiwat (18:40, arriving around 07:15) costs ฿941 for an upper berth and ฿1,041 for a lower one in second class. It saves a night's bed and is the classic way north. One 2026 guide says SRT sells seats 90 days ahead, so January is already bookable, and lower berths sell out first in November–February. Flying takes 1h10–1h20 from either Bangkok airport and is often cheaper with carry-on only.
