  - type: tips
    variant: insider
    items:
      - "**Grab** is the main ride-hailing app here and can also book metered taxis, which saves haggling late at night."
      - "Do the temples by **river boat** from Banglamphu instead of a taxi through traffic."
      - "Plan outdoor sights for the morning: even in January, afternoons reach the low 30s."
  - type: tips
    variant: pitfalls
    items:
      - "The Airport Rail Link ran every 30 minutes during a single-track fault in July 2026. If you have a tight connection, check the service before relying on it."
      - "Boat fares follow diesel prices and changed several times in 2026, so expect a baht or two either way."
