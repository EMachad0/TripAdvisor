blocks:
  - type: hero
    hook: "Neon Chinatown, a river full of boats and a skyline of rooftop bars, in the one month the heat lets up."
    caption: "The Chao Phraya at night, seen from State Tower"
  - type: highlights
    items:
      - title: Eat your way through it
        text: "**Yaowarat** (Chinatown) after dark is one long street-food queue. A cheap meal in Thailand costs about **R$10**, so food is where Bangkok spoils a budget traveler."
      - title: Views at every price
        text: "From the paid **Mahanakhon Skywalk** and rooftop bars to a free sunset from a river pier, the skyline is part of every day."
      - title: Temples by boat
        text: "The **orange-flag express boat** runs past the Grand Palace, Wat Pho and Wat Arun for **฿19 (R$3.13)** a ride (since 5 Oct 2026)."
      - title: Go out with people
        text: "**Khao San Road** is the backpacker party street; **Silom** is, as Wikivoyage puts it, the city's primary party district by night; RCA has the big clubs."
  - type: prose
    title: What eight days here feel like
    text: |-
      Bangkok is big enough that eight days never repeat. A typical day mixes one sight in the morning, before the midday heat, with food in the afternoon and a night out: temples and the river in the old town, markets and malls in the centre, Chinatown or a rooftop after dark. It also works as a base for **Ayutthaya** and **Kanchanaburi**, both reachable by cheap train.

      **Where to base yourself.** For a solo backpacker who wants to meet people, **Khao San Road and Banglamphu** are the obvious pick: Wikivoyage calls it the backpacker mecca, and the hostels, bars and the boat piers to the temples are all on foot. The catch is that there is no BTS or MRT station, so trips to the modern city mean a boat, a bus or a Grab. **Sukhumvit** is on the BTS line and has the nightlife of the expat city, but it is pricier and less of a hostel scene. **Silom** and **Chinatown** sit in between: Silom for nights out, Chinatown for street food, both on the MRT.

      **Arriving.** From Suvarnabhumi (BKK), the Airport Rail Link takes you to Phaya Thai for **฿45 (R$7.42)** in about 26 minutes, then change to the BTS. From Don Mueang (DMK), where many budget flights land, bus **A4** goes to Sanam Luang, a short walk from Khao San, for **฿50 (R$8.25)**; **A1** goes to Mo Chit 2 bus terminal for ฿30 and passes **BTS Mo Chit** and **MRT Chatuchak Park** on the way (Nation): get off there for the trains, and the SRT Red Line runs to Krung Thep Aphiwat at a distance-based fare.
