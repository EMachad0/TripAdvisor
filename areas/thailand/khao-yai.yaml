  - type: tips
    variant: insider
    items:
      - "**Fits your week:** weekend + Monday morning only: Sat Jan 2 evening train out (if your flight lands in time), park Sun Jan 3, Express 72 back Mon Jan 4 late morning."
      - "Greenleaf picks you up free at Pak Chong train or bus station if you take the full-day tour; they take cash only and never ask for payment in advance."
      - "Bring long trousers, closed shoes and a jacket. Tours hand out leech socks."
  - type: tips
    variant: pitfalls
    items:
      - "Nov–Mar is high season: Greenleaf groups can reach 14 on the full day and 20+ on the half day."
      - "The park is very busy on weekends and extremely busy on long holidays; the New Year weekend counts."
