blocks:
  - type: hero
    caption: "Haew Suwat waterfall in Khao Yai"
    hook: "Gibbons whooping at dawn, elephants on the road at dusk, and the first cool night since you landed."
  - type: highlights
    items:
      - title: Real wild elephants
        text: "Khao Yai is one of the easiest parks in Thailand to run into **wild elephants** with a bit of luck, often on the road or at salt licks late in the day."
      - title: A jungle with a dawn chorus
        text: "Gibbons are most active in the early morning, and over 320 bird species include **great hornbills**. Guides carry telescopes and photograph sightings through them for you."
      - title: Bats at sunset
        text: "Just outside the north gate, **millions of wrinkle-lipped bats** pour out of a cave at about 17:30, a ribbon across the sky. Greenleaf's ฿500 half-day tour ends there."
      - title: Haew Suwat falls
        text: "A 20 m curtain of water into a big pool, on the full-day tour. No swimming allowed at the park's falls."
  - type: prose
    title: What a weekend here buys
    text: |-
      **Versus staying in Bangkok:** two days in Bangkok buy you markets, temples and a night out. Khao Yai buys the thing Bangkok can't: a real jungle with wild elephants, gibbons and hornbills, and nights cool enough for a sweater. It costs more than a Bangkok weekend, and your Saturday night is spent in Pak Chong, a small town that is mostly a base for the park, not at a Bangkok bar.

      **How it fits your week.** Only the first weekend works, and it depends on your flight from China on **Sat Jan 2**. If you land in Bangkok by mid-afternoon, take **Rapid 139** from Krung Thep Aphiwat at about **19:25–19:40** (Pak Chong about 22:35–22:55; confirm on D-Ticket) and sleep in Pak Chong. **Sun Jan 3** is the full-day park tour (08:00–18:30); sleep a second night. On **Mon Jan 4** take **Express 72** at about **11:20–12:10**, in Bangkok by about 14:10–15:00, well before your 19:00 shift. Only if you land very early can **Express 71** (10:35, Pak Chong 13:17) get you there for Saturday's 15:00 bat-cave half day. Jan 9–10 doesn't work: you fly to Korea on Sun Jan 10.

      **What it costs.** Trains ฿85 out on Rapid 139 and ฿185 back on Express 72 (Baolau's fares), the full-day tour ฿1,500 including the ฿400 park fee, and a hostel dorm about ฿300 a night. Without beds that is roughly **฿1,770 (R$292)**, close to three days of your R$100 budget; two dorm nights add about ฿600 (R$99). The ฿500 half-day bat tour (฿1,800 for both tours) only fits if you arrive Saturday afternoon.

      **Can you do it without a tour?** Barely. A ฿50 local bus goes from Pak Chong to the north gate, but the visitor centre is 14 km further in, you aren't allowed to walk in from the checkpoint, and only two short trails may be walked without a guide.
