    items:
      - "Get to **Erawan** early: no entry after 15:30, and the last bus back to town leaves at 16:30."
      - "Return trains to Bangkok leave Kanchanaburi station at about 07:25 and 14:48; buses run all day."
      - "Bicycles (about ฿50 a day) are enough for the bridge, the cemetery and town; rent a motorbike (฿150–200) only if you ride already."
