blocks:
  - type: hero
    hook: "A wartime railway along the river, a famous black-iron bridge and turquoise jungle pools."
    caption: "The Bridge over the River Kwai at sunset"
    focus: bottom
  - type: highlights
    items:
      - title: The bridge and the history
        text: "The **Bridge over the River Kwai** is 3 km north of town. Some 16,000 prisoners of war and 90,000 Asian labourers died building the railway in 1942–43."
      - title: Ride the Death Railway
        text: "The ordinary train continues past the bridge to **Nam Tok**, crossing wooden viaducts along the river at Wang Pho. Foreigners pay ฿100 a leg."
      - title: Seven tiers of waterfall
        text: "**Erawan Falls** climbs seven tiers along a 1.5 km trail in a national park 50 km from town: ฿300 (R$49.47) entry, ฿80 by local bus."
      - title: Hellfire Pass
        text: "A cutting hacked through rock by prisoners, with a museum renovated in 2018, beyond the end of the line."
  - type: prose
    title: Day trip or overnight?
    text: |-
      **A day trip** from Bangkok buys the town itself: the early train from Thonburi arrives mid-morning, leaving time for the **bridge**, the **war cemetery** (free, Wikivoyage lists it as open in the morning and early afternoon) and the museums, then the afternoon train or a bus back. Expect about ฿200 in train fares plus a songthaew or two, roughly **R$35**.

      **An overnight (or two)** is what makes Kanchanaburi worth it, because the best parts are further out. Erawan Falls is 1.5 hours away by bus and stops letting people in at **15:30**, the last bus back leaves at 16:30. The Death Railway to Nam Tok and **Hellfire Pass** fill another day. Two nights let you do one of each without rushing.

      **Getting there.** Ordinary trains leave Bangkok's **Thonburi** station (on the west bank, not Hua Lamphong) at about **07:45–07:50** and **13:45–13:55** (timetables differ by a few minutes; confirm at Thonburi), arriving around 10:20–10:35 and 16:25–16:35; foreigners pay a flat **฿100**, and tickets are sold at the station on the day. Faster and more frequent: first-class **BKS buses from the Southern Bus Terminal** every 15 minutes from 05:00 to 22:30, **฿110 (R$18.14)**, about two hours.
