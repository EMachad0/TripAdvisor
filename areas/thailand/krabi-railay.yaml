blocks:
  - type: hero
    hook: "Sheer limestone walls, longtail boats parked on the sand and no roads in: a beach you can only reach by sea."
    caption: "Longtail boats on Railay West"
    focus: "75% 70%"
  - type: highlights
    items:
      - title: A beach cut off by cliffs
        text: "Railay sits on the tip of a peninsula walled in by **Khao Nang mountain**, so there are no cars: you wade out to a longtail at Ao Nang and are there in about 10 minutes."
      - title: Phra Nang beach
        text: "A broad strip of white sand with massive cliffs at each end, on the peninsula's southern tip, with the small cave shrine to the drowned princess at its north end."
      - title: Viewpoint and lagoon
        text: "A 20–25 minute climb on a muddy, roped path to a viewpoint over Railay and Ton Sai, then a steep scramble down to a hidden lagoon. Not in flip-flops."
      - title: World-class climbing
        text: "**More than 700 bolted routes** on the limestone above the sea. Climbing shops on Railay East and Ton Sai run beginner courses and rent gear."
  - type: prose
    title: What extra days down south buy you
    text: |-
      Bangkok and one region is the usual shape of a week in Thailand. Krabi is the south's answer to Chiang Mai: instead of temples and cool mornings you get the **Andaman coast**, warm water, and the cliffs that end up on every Thailand poster. Three days is the minimum worth the flight: one arriving and settling into Ao Nang, one on Railay (beach, viewpoint, a kayak or a climb), and one for a longtail out to the islands off Railay, such as Ko Poda, or simply a beach day.

      **Where to base yourself.** **Ao Nang** is the practical base: the ฿150 airport shuttle goes there and the longtails to Railay leave from its beach. **Railay** itself has budget to mid-range places on the mangrove-lined east side, and **Ton Sai**, round the corner, is where climbers and backpackers stay cheaply.

      **How it fits this trip.** It does not fit a normal weekend: you land from China on Saturday 2 January and work 19:00–04:00 Monday to Friday. Krabi works only if you add days to Thailand, or if you take the laptop and work from Ao Nang during the week, sleeping late and spending afternoons on the beach. In that case pick a bed with reliable Wi-Fi, and keep the flight back off the last day in case of delays.
