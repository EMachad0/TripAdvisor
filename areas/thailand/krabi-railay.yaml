getting_there: "Fly Bangkok (DMK or BKK) → Krabi, 1h25, about ฿900–2,000 one way (R$148–330), more in Dec–Jan. Airport shuttle to Ao Nang ฿150. Or the 18:40 night bus, ฿715, arriving 05:40."
getting_around: "Railay has no road access: longtail from Ao Nang beach, about 10 min, ฿100 a person once 8 people board. On Railay everything is a 5–10 min walk, except Ton Sai, a jungle path away."
winter_note: "January is the Andaman dry season (Nov–May): about 22 °C at night and 33 °C by day (1981–2010 normals), calm seas and the most boats running. It is also peak season: cheap flights for mid-Dec to January sell out first, so book early."
