blocks:
  - type: hero
    hook: "Royal burial mounds between the shops, a thousand-year-old temple on the hill, and a palace pond lit at night."
    caption: "The stone stairways and gate of Bulguksa"
    focus: center
  - type: highlights
    items:
      - title: Bulguksa and Seokguram, for free
        text: "Korea's first **UNESCO** site: the 8th-century temple with the Dabotap and Seokgatap pagodas, and a granite Buddha in a grotto up the mountain facing the East Sea. Entry to both has been free since **May 2023**."
      - title: Tombs in the middle of town
        text: "**Daereungwon** is a park of grassy Silla burial mounds downtown; you can walk inside one, the Heavenly Horse Tomb. Open 09:00–22:00 all year."
      - title: The palace pond at night
        text: "**Donggung Palace and Wolji Pond**, built in the 670s, is lit until 22:00, with the pavilions reflected in the water. This is the reason to stay the night."
      - title: Hwangnidan-gil
        text: "Old hanok houses turned into cafés, bakeries and shops next to the tombs. Try **Hwangnam-ppang** (red-bean pastry, invented here in 1939) or the viral cheese-filled **10-won bread** (₩3,500)."
  - type: prose
    title: Day trip or a night?
    text: |-
      Gyeongju is Korea's open-air history museum: modern streets with no high-rises, interrupted by huge green burial mounds. Wikivoyage notes that most visitors are Korean or from elsewhere in East Asia; few Westerners make it here.

      A day trip from Seoul is possible but tight. The train is about two hours, the KTX station is 15 minutes out of town, and Bulguksa is another 45 minutes by bus, with Seokguram above that on a bus that runs once an hour. **Better: one night.** Do Bulguksa and Seokguram in the morning, the tombs and Hwangnidan-gil in the afternoon, and Wolji Pond after dark.

      **Money.** A return SRT ticket is about ₩85,200 (R$354.09), more than two days of your R$140 budget, but the big sights are free or cheap once you're there. The express bus costs a little over half the SRT fare (about ₩15,000–18,000 less each way) and takes almost twice as long.

      **Time.** It needs one of your free days (Sat–Sun 16–17 Jan), the same ones Hwacheon wants. Since your job is remote, you could also sleep a night near Hwangnidan-gil and work the shift there.
