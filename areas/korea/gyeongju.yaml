getting_there: "SRT from Suseo 2 h 05, ₩42,600; KTX from Seoul Station about 2 h 15, ₩49,300, to Gyeongju Station (ex-Singyeongju), 15 min by bus from town. Express bus 3 h 30–4 h, ₩24,000–28,000."
getting_around: "Downtown (tombs, Cheomseongdae, Wolji Pond, Hwangnidan-gil) is walkable or ₩7,000/day by bike. Buses ₩1,450 by card; 10 and 11 reach Bulguksa in about 45 min, bus 12 goes up to Seokguram hourly."
winter_note: "January runs about −5 °C at night to 6 °C by day, with ~32 mm of rain or snow: dry and mostly clear. Bulguksa and Seokguram: last entry 17:00 from November to January, every day including weekends, so do the mountain temples first. The tombs park stays open until 22:00 all year; Wolji Pond is lit until 22:00."
