  - type: tips
    variant: insider
    items:
      - "Book trains to **Gyeongju Station**: Singyeongju was renamed in December 2023, and the old downtown Gyeongju station closed in 2021."
      - "The **SRT from Suseo** (Gangnam side) is ₩6,700 cheaper and a little faster than the KTX from Seoul Station."
      - "Missed bus 12 up to Seokguram? A taxi from Bulguksa takes about 20 min and costs about ₩12,000."
  - type: tips
    variant: pitfalls
    items:
      - "Bus stops have no timetables and waits can be long; plan Bulguksa around the bus, or share a taxi."
      - "Restaurant owners by Bulguksa's bus stop tout hard; prices are standard, so pick freely."
      - "No photos inside Seokguram: the Buddha sits behind glass and photography is forbidden."
  - type: weather
    temp_low_c: -5
    temp_high_c: 6
    conditions: Cold, dry, mostly clear
    note: "A few degrees milder than Seoul by day (6 °C vs 2.1 °C), with clear skies for the mountain views. The temples and tombs are all outdoors, and Seokguram is higher up the mountain."
    wear: Padded jacket, gloves, shoes for stone steps and a hill
