blocks:
  - type: hero
    hook: "Seafood at the harbour, hot baths in a department store and the Gwangan Bridge lit up over the water."
  - type: highlights
    items:
      - title: Eat what you pick
        text: "At **Jagalchi**, Korea's largest fish market, you choose live seafood downstairs and a restaurant upstairs cooks it."
      - title: A bathhouse in a department store
        text: "**Spa Land** in Shinsegae Centum City: hot-spring baths and themed sauna rooms, ₩26,000 for up to four hours, then ₩5,000 for each extra hour. Open 09:00–22:00."
      - title: Two beaches, two moods
        text: "**Haeundae** is the famous beach with the big hotels; **Gwangalli** has cafés, bars and restaurants facing the Gwangan Bridge."
      - title: Milder than Seoul
        text: "January days average about **8 °C**, against about 2 °C in Seoul, and snow is rare."
  - type: prose
    title: What two or three days feel like
    text: |-
      Busan is a harbour city spread along the coast, so a day here tends to be one district: the old downtown of **Nampo-dong** with Jagalchi, the shopping and nightlife of **Seomyeon**, or the beaches of **Gwangalli** and **Haeundae** in the east, with Centum City between them.

      Where to sleep depends on that plan. Seomyeon sits where Metro Lines 1 and 2 cross, in the middle. Haeundae, in the east, puts you by the beach and closer to Spa Land.

      The trip from Seoul is short. The KTX takes about two and a half hours and costs **₩54,400 (R$222.82)** since the KTX and SRT merged in September 2026. That is the fare reported when the merger took effect; one later report gives ₩53,900 at weekends, so check Korail+ for your date. The SRT leaves from Suseo in southern Seoul. On a budget, the Mugunghwa costs ₩28,600 and an express bus starts at ₩25,000, from about four hours.
