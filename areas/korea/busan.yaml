  - type: tips
    variant: insider
    items:
      - "**Flying on to Japan?** Busan's Gimhae airport (PUS) lists direct flights to Fukuoka, Osaka–Kansai, Tokyo–Narita, Nagoya and Sapporo, among others, and a light-rail station at the airport."
      - "There is also a **ferry to Fukuoka**, about six hours."
      - "Book KTX and SRT seats on the **Korail+** app, which replaced the separate apps after the merger. Tickets go on sale a month before departure."
      - "A ₩5,000 metro day pass pays for itself after four rides."
