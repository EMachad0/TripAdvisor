blocks:
  - type: hero
    hook: "Pine-lined beaches, a street of coffee roasters and snowy mountain passes behind them."
    caption: "The pine-lined boardwalk along Gyeongpo Beach (May)"
  - type: highlights
    items:
      - title: Korea's coffee city
        text: "Well-known baristas settled along **Anmok Beach**, and the strip became Gangneung Coffee Street, with cafés facing the East Sea."
      - title: A station on the beach
        text: "**Jeongdongjin** is the railway station closest to the sea in Korea, famous for sunrise trips since the 1995 drama *Sandglass* (*The Hourglass*). Sandglass Park next to it has a giant hourglass."
      - title: Snow country inland
        text: "The **Daegwallyeong** pass, between Gangneung and Pyeongchang, averages −12 °C on January nights and gets snow on about 13 days a month. The sheep ranch sits up there."
      - title: Fish market and lake
        text: "**Jumunjin Fish Market** (07:00–22:00) sells raw fish just off the boats; **Gyeongpo Lake** has a 4.3 km shore path next to the beach."
  - type: prose
    title: Is it worth a day?
    text: |-
      Gangneung is the easiest way to see Korea's east coast: the KTX-Eum takes about two hours from Seoul station, a bit less from Cheongnyangni. A day here is beaches, coffee and seafood: Anmok Coffee Street, the pine path along Gyeongpo Beach, and maybe Jeongdongjin down the coast.

      **Be honest about the cost.** A return KTX ticket is about ₩55,200 (R$229.41), more than a day and a half of your R$140 budget, before anything else. The bus is cheaper but longer.

      **Be honest about the time, too.** Four hours of trains doesn't fit before a 21:00 shift, so this needs one of your free days, the same ones the Hwacheon ice festival wants. Pick Gangneung if a coastline and a calm café day appeal more than ice fishing. If you want both, sleep a night here so the sea at dawn is right outside.

      Pyeongchang's snow country (Daegwallyeong, the sheep ranch, the 2018 Olympic mountains) lies inland between Seoul and the coast. The KTX passes through Pyeongchang on the way.
