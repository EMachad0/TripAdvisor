  - type: tips
    variant: insider
    items:
      - "Trains leave from both **Seoul station** and **Cheongnyangni**; Cheongnyangni is shorter and ₩1,600 cheaper."
      - "Tickets go on sale a month ahead in the **Korail** app or at the station. Mileasia warns that trains can sell out and are hard to change at the last minute, so book once your day is fixed."
      - "Gangneung was the venue for the ice sports at the **2018 Winter Olympics**; the skating and curling venues are in the city."
  - type: tips
    variant: pitfalls
    items:
      - "Avoid the **bus on Sundays**: there is one expressway from Seoul, and Wikivoyage warns traffic is heavy into Gangneung on Fridays and back on Sundays."
      - "The sheep ranch's [fare page](http://www.yangtte.co.kr/fareinformation) lists **₩9,000** for adults and ticket sales **09:00–16:00**, but no separate winter hours. Call **033-335-1966** or check Naver Map before you go up in January."
  - type: weather
    temp_low_c: -3
    temp_high_c: 5
    conditions: Fairly dry on the coast; snow on about 13 days a month up on the pass
    note: "The beaches are about 3 °C milder than Seoul by day (5.3 °C vs 2.1 °C). The Daegwallyeong pass, at 832 m, averages −12.2 °C on January nights."
    wear: Windproof jacket, warm layers; snow boots if you go up to Daegwallyeong
