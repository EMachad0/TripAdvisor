blocks:
  - type: hero
    hook: "Hundreds of tile roofs inside a modern city, bibimbap in brass bowls, makgeolli poured from a kettle."
    caption: "Jeonju Hanok Village from above"
    focus: bottom
  - type: highlights
    items:
      - title: The biggest hanok village in Korea
        text: "About **700 hanok** houses, many from the Joseon period, around Gyeonggijeon, the shrine to the dynasty's founder (₩3,000, 09:00–18:00). Wander the lanes for free."
      - title: Bibimbap at the source
        text: "Jeonju's version comes in a brass bowl with beef tartare, mung-bean jelly and a raw yolk, for about **₩13,000–15,000** at famous places like Hankookkwan; Wikivoyage's older ₩10,000 may still hold at plainer spots. Breakfast is **kongnamul gukbap**, the bean-sprout hangover soup."
      - title: A Friday and Saturday night market
        text: "Nambu Market, a short walk from the hanok village, turns into a night market of torch-grilled snacks on **Fridays and Saturdays** only, which fits your free Saturday, 16 Jan."
      - title: Makgeolli with free food
        text: "In the **Samcheon-dong** makgeolli street each kettle you order brings a tray of side dishes, and the more kettles, the better the food. Best with a group."
  - type: prose
    title: Is it worth a day?
    text: |-
      Jeonju is the easiest trip out of Seoul that is really about **food**, your top interest. The KTX from Yongsan takes about an hour and three quarters, so a day trip works for the hanok lanes, bibimbap at lunch and Jeondong Cathedral at dusk. The night market runs until 23:00, so to see it properly, plan to sleep in Jeonju; check the last train back on Korail before deciding on a day trip.

      **The catch is the money.** A KTX return is about ₩68,800 (R$285.93), two days of your R$140 budget. The express bus from Central City Terminal halves that but takes about 2 h 40 each way.

      **The catch is also the calendar.** The night market only runs on Fridays and Saturdays, and your only free Saturday is 16 Jan, which you were saving for Hwacheon. Since your job is remote, another way in is one night in a Jeonju guesthouse: arrive on a work-day afternoon, eat, work the night shift there with good Wi-Fi, and see the hanok village the next morning before the train back.

      Base yourself in or next to the **hanok village**: the cathedral, Gyeonggijeon and Nambu Market are all within a few minutes' walk.
