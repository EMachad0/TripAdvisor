  - type: tips
    variant: insider
    items:
      - "Take the train from **Yongsan**, not Seoul Station: Yongsan has about 20 KTX a day to Jeonju, Seoul Station only 5–8."
      - "The cheap train is the **Mugunghwa** from Yongsan: ₩17,600 and about 3 h 30 to 3 h 50."
      - "Makgeolli kettles are made for sharing; go with people from a guesthouse rather than alone."
  - type: tips
    variant: pitfalls
    items:
      - "Jeonju Station is far from the sights: take line **1000** or a taxi (~₩7,600) to the hanok village. The bus terminals are closer."
      - "Don't plan Jeonju for a Sunday night if the night market is the point: it opens on public holidays too, but otherwise only Fri–Sat."
