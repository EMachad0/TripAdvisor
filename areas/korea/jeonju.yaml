    conditions: Cold, dry, the odd snow shower
    note: "About 3 °C milder than Seoul by day, and only ~27 mm of precipitation in January. The hanok lanes are outdoors; cafés and restaurants are the warm-up stops."
    wear: Padded jacket, hat and gloves for the night market
