getting_there: "ITX from Cheongnyangni: 55 min to Namchuncheon, ₩8,300. Hwacheon: bus from Dong Seoul 2 h 55 (first bus 06:45, last 18:10), back 2 h 35 (last bus 21:00), ₩14,400 each way (2026 timetable)."
