  - type: tips
    variant: insider
    items:
      - "Going to Hwacheon by train? The festival organisers say buses from **Chuncheon station** are often full during the festival. Get off at **Namchuncheon** and board at the Chuncheon intercity bus terminal nearby."
      - "Check the **last bus back** from Hwacheon before you start fishing. In 2026 the last one to Dong Seoul left at 21:00."
      - "Nami Island sells cheaper tickets early and late: the official page lists a lower rate for tickets bought before 08:00, and in Dec–Mar after 18:01. It is unclear whether adults qualify, so check the price at the ferry wharf."
  - type: tips
    variant: pitfalls
    items:
      - "Chuncheon's city buses often run without a timetable, and Wikivoyage reports waits of five minutes to an hour. Check **Naver Map** or take a taxi."
      - "The Soyang Skywalk takes **cards only** and is closed on Tuesdays."
  - type: weather
    temp_low_c: -9
    temp_high_c: 2
    conditions: Dry, very cold mornings, snow on about 9 days a month
    note: "Chuncheon is about 4 °C colder than Seoul at night, and Hwacheon, further north in the mountains, is colder still. You stand or sit on open river ice at the festival, so dress for hours outdoors."
    wear: Thermal base layer, down jacket, insulated boots, warm gloves and a hat
