blocks:
  - type: hero
    hook: "Fish for trout through river ice, then eat spicy chicken off a hot plate in Chuncheon, an hour from Seoul."
    caption: "Ice fishing at the Hwacheon Sancheoneo Ice Festival, 2023"
  - type: highlights
    items:
      - title: Ice fishing on a frozen river
        text: "The **Hwacheon Sancheoneo Ice Festival** runs 9–31 Jan 2027, all through your Korea dates. You fish for mountain trout through a hole in the ice and have them grilled on site."
      - title: Dakgalbi where it comes from
        text: "Chuncheon's **Dakgalbi Street** is lined with restaurants cooking the spicy chicken, rice cakes and vegetables on a skillet at your table."
      - title: Nami Island
        text: "The tree-lined river island from the drama *Winter Sonata*. **₩19,000** with the round-trip ferry, open all year, and pretty bare and snowy in winter."
      - title: A glass walkway over the river
        text: "The **Soyang River Skywalk** is a 174 m glass-floored walkway over the river, ₩2,000 (card only), roughly 10:00–17:30, closed on Tuesdays. These details come from Wikivoyage only; check before you go."
  - type: prose
    title: Day trip or sleep there?
    text: |-
      **Day-trip it.** Chuncheon is about an hour from Seoul on the ITX-Cheongchun train or the Gyeongchun metro line, so there is little reason to move your bags. On a work day you could go after you wake up, eat dakgalbi, walk the river, and be back in Seoul well before a 21:00 shift.

      **Hwacheon is a long day.** The direct bus from Dong Seoul took close to three hours each way in the 2026 timetable, so go on a free day: Sat 16 or Sun 17 Jan. Sunday is the better fit if you go clubbing in Hongdae on Saturday night. The other way in is the ITX to Chuncheon and a local bus to Hwacheon, which lets you add a dakgalbi stop on the way back.

      Sleeping in Chuncheon only makes sense if you want both on one weekend: dakgalbi and the river on Saturday, then the first bus to Hwacheon on Sunday.

      **Nami Island** belongs to Chuncheon but you reach it from **Gapyeong**, on the same rail line, so it fits on the way to Chuncheon or on a day of its own.
