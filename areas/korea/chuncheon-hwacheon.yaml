winter_note: "Colder than Seoul. Chuncheon's January normals run from −9.3 °C at night to 1.9 °C by day, with about 9 snowy days. The Hwacheon Sancheoneo Ice Festival runs Sat 9 – Sun 31 Jan 2027, so it covers all your Korea days (10–20 Jan). Nami Island is open all year."
