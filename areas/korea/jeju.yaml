getting_there: "Fly Gimpo → Jeju, about 1 h 15. Kayak's cheapest recent one-way was US$25 (R$140.43); typical one-way US$37–83. Ferries from Busan, Incheon and Mokpo stopped in 2024."
getting_around: "Island-wide buses ₩1,000–3,000 a ride, with routes in Naver Map, Kakao Map and Google Maps; timetables thin out away from the cities. Many visitors rent a car (International Driving Permit needed)."
winter_note: "The mildest place in Korea in January: Jeju City averages 3.7 °C at night and 8.6 °C by day. It is also windy, rains or snows on about 12 days that month, and Hallasan above is snow-covered. Hikers need strap-on crampons, and the last buses from the trailheads can leave around 17:00."
