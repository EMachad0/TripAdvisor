why: "A volcanic island an hour's flight from Gimpo: snow on Hallasan, tangerines still on the trees until mid-January, crater peaks and lava tubes. Beautiful, but it needs 2+ free days and a car or patience with buses."
best_for: [nature, views, food]
highlights: ["Hallasan in snow", "Seongsan Ilchulbong (Sunrise Peak)", "Lava tubes (UNESCO)", "Jeju Olle coastal trails", "Tangerine and hallabong farms", "Haenyeo women divers"]
