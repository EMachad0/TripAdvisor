blocks:
  - type: hero
    hook: "Black lava rock, a snowy volcano in the middle and tangerines on the trees in January."
    caption: "Seongsan Ilchulbong, the tuff cone on Jeju's east tip, from the air"
  - type: highlights
    items:
      - title: Hallasan in snow
        text: "South Korea's highest mountain is snow-covered in winter. The two summit trails need a **free online permit**; the gentler Yeongsil and Eorimok trails need no booking (per 2026 guides; the official reservation guide could not be read from here)."
      - title: Volcanic sights
        text: "**Seongsan Ilchulbong**, a tuff cone rising from the sea, the lava tubes of **Geomunoreum** and Hallasan itself are the three parts of the UNESCO World Heritage site *Jeju Volcanic Island and Lava Tubes*."
      - title: Tangerine season
        text: "Mandarins and **hallabong** are Jeju's specialities. Farm picking runs into January; one Seogwipo farm lists it until about 20 Jan, if the fruit lasts."
      - title: The island of wind, rocks and women
        text: "Jeju calls itself *samdado*: wind, black basalt walls everywhere, and the **haenyeo**, women who still dive for seafood all year."
  - type: prose
    title: Does Jeju earn the days?
    text: |-
      **Probably not on this trip.** Jeju is lovely, but it is spread out: the sights are around the coast and on the mountain, the buses get sparse outside Jeju City and Seogwipo, and in winter the light goes early. To see it properly you need two or three **daytime** days in a row, and your only free days in Korea are Sun 10 (arrival), Sat–Sun 16–17 (already wanted for the Hwacheon ice festival) and Wed 20 (flight out).

      It could work as a **workcation**: fly down on a weekend, work your night shifts from Jeju, and see one area each afternoon before the light goes. That trades Seoul afternoons (T1 Base Camp, Gyeongbokgung, markets) for island ones, and adds about R$415–930 for a return flight at Kayak's typical one-way fares (US$37–83 each way).

      If you'd rather keep more days for Japan, skip it. If you do go, stay in **Jeju City** for the airport and the bus hub, or **Seogwipo** on the south coast, close to Jungmun and many of the Olle trails.
  - type: gallery
    images:
      - { file: hallasan-summit-snow, caption: "Rime ice near Hallasan's summit in winter" }
      - { file: hallasan-winter-trail, caption: "Snow and bare trees on Hallasan in winter" }
      - { file: seongsan-blue-hour, caption: "Seongsan-ri at blue hour, seen from Seongsan Ilchulbong" }
  - type: tips
    variant: insider
    items:
      - "Book the free Hallasan summit permit on visithalla.jeju.go.kr and bring the **passport** you registered with. You get a time slot; a no-show without cancelling blocks you from booking for three months."
      - "For winter 2026–27 (1 Oct – 31 Mar) the park office set entry from 05:00, closing at **11:30** on the summit trails and at noon on Eorimok and Yeongsil. Check the current notice on [visithalla.jeju.go.kr](https://visithalla.jeju.go.kr/main/main.do) and start on the first bus."
      - "No crampons? Wikivoyage says the shop at the start of the Yeongsil trail sells them for about **₩20,000**."
      - "Flightsfrom.com lists non-stop flights from Jeju to **Fukuoka, Osaka–Kansai and Tokyo–Narita**, some only a few times a week. Check whether one fits 20 Jan before you book a return to Seoul."
  - type: tips
    variant: pitfalls
    items:
      - "**Winter buses back from the trailheads can leave around 17:00.** Miss it and you need a taxi."
      - "Trails sometimes close around midday in winter, and wind or snow can shut the summit. Have a plan B day."
