blocks:
  - type: hero
    hook: "Palace roofs under snow by day, hip-hop basements in Hongdae by night, and the subway between them for ₩1,550."
  - type: highlights
    items:
      - title: The famous clubs
        text: "**Hongdae**, ringed by universities, has some of Seoul's most active nightlife. Covers are roughly ₩10,000–20,000, often with a drink, and clubs run until about 5–6 AM (approximate: check at the door)."
      - title: Palaces and the old core
        text: "**Jongno** is the Joseon-era heart of the city around Gyeongbokgung, which runs free English tours at 11:00, 13:30 and 15:30 and closes on Tuesdays."
      - title: Esports at the source
        text: "LoL Park and T1 Base Camp have their own cards: see the places listed below."
      - title: Social hostels from about R$120 a night
        text: "Dorm beds on Mon 11 Jan 2027: **₩29,412** at Time Travelers Relax in Hongdae, **₩29,241** at G Guesthouse in Itaewon (Hostelworld, seen 12 Nov)."
  - type: prose
    title: Where to base yourself
    text: |-
      For a solo traveler who wants to go out with people from the hostel, **Hongdae** is the base. It is where the clubs are, it has hostels built around rooftops and group dinners, and it is a stop on the airport train: the all-stop AREX gets there in under an hour from Terminal 1 (about 60 minutes to Seoul Station, two stops further), for ₩4,650 on a transport card.

      **Itaewon**, in Yongsan, is the other option. Wikivoyage calls it Seoul's international district, with Western-style places to eat and drink, and on Mon 11 Jan G Guesthouse there (₩29,241) cost about the same as the cheapest Hongdae dorm found (₩29,412). From Itaewon the Hongdae clubs are a subway ride away.

      Fri 15 and Sat 16 Jan cost much more. On 12 Nov, a Lazy Cube capsule in Hongdae was ₩45,000 on weeknights and ₩81,900 on those two nights; G Guesthouse's dorm went from ₩29,241 to ₩42,349–45,374. Some Hongdae hostels (Jin's Paradise) had no beds on sale for 10–19 Jan yet.
  - type: gallery
    images:
      - { file: seoul-palace-snow, caption: "Snow on the roofs of Gyeongbokgung" }
      - { file: seoul-hongdae-street, caption: "A Hongdae shopping street at night" }
  - type: tips
    variant: insider
    items:
      - "Buy a **T-money** card (₩5,000) at the airport and pay the AREX with it: a single-journey ticket adds ₩100 plus a ₩500 deposit."
      - "Last all-stop trains from the airport to Seoul Station: **23:38** from T1, **23:32** from T2. Later ones stop at Digital Media City."
      - "A 7-day **Climate Card** costs ₩20,000; at ₩1,550 a ride it pays off after 13 rides. It does not cover airport buses or the Sinbundang Line."
      - "Missed the last subway after the clubs? Owl N-buses run late at night for ₩2,500, and the first trains leave at roughly 5:30 (approximate: check the timetable)."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry, sharp cold, some snow
    note: "About 7 snowy days in January and only 16.8 mm of precipitation. Days are mostly dry and cold; nights out mean walking home below −5 °C."
    wear: Padded jacket, hat, gloves, warm shoes
