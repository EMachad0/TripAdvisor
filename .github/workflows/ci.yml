# Merge gate (plan section 9). Actions are pinned by commit SHA; the tag is in the comment.
#
# Wall time is the slowest job, so every job is sized to finish in under 3 minutes on a 2-core runner: lint and the
# unit tests run beside each other, and e2e runs as time-balanced shards, each on its own runner with its own
# backend (docs/migration/DEV.md, "CI").
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint, test and e2e skip PRs that only touch content (answer cards, curator work); a job skipped by `if:` reports
  # "skipped", which satisfies a required check.
  changes:
    runs-on: ubuntu-24.04
    # paths-filter lists a pull request's files through the API, which needs this scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A pull request's file list comes from the API; only a push diffs commits, which needs the history but no
      # file contents (sparse checkout implies a blobless clone).
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!answers/**'
              - '!places/**'
              - '!areas/**'
              - '!config/**'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Without the place and area photos (362 of the 369 MB): no check reads them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/places/*/*/*/media/
            !/areas/*/media/
      # The pnpm store cache: restored by every job, saved only here, on pushes to main (each save is a new 143 MB
      # entry, and 14 jobs per run would push the browser and .deb caches out of the repository's 10 GB).
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.event_name == 'push' }}
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/places/*/*/*/media/
            !/areas/*/media/
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: false
          require-lockfile: true
      # every workspace package's tests: packages/*, apps/web and platform (node --test)
      - run: pnpm test

  # The Playwright suite (Desktop Chrome) runs as shards of whole spec files, balanced by the seconds each file took
  # on CI (apps/web/e2e/shards.ts, e2e/durations.json). Every shard has its own runner and backend: the specs share
  # backend state (serial describes), so a shard keeps one worker, and `setup` runs in every shard as the project's
  # dependency. To resize, add or remove shard numbers; each shard should stay near 90 s of tests.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      # The e2e content is packages/migrate/fixtures/e2e; the real place and area photos are never read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/places/*/*/*/media/
            !/areas/*/media/
      # Start pulling the pinned backend image now; scripts/e2e-prepare.sh's `up` joins the pull if it is not done.
      - name: Pull the Convex backend image (background)
        run: |
          image="$(sed -n 's/^ *image: \(ghcr\.io\/convex\/convex-backend:[0-9a-f]*\)$/\1/p' deploy/convex-local/compose.yaml)"
          echo "pulling ${image:?no backend image in deploy/convex-local/compose.yaml}"
          nohup docker pull --quiet "$image" >/dev/null 2>&1 &
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: false
          require-lockfile: true
      - id: playwright
        run: echo "version=$(pnpm --filter @atr/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      # Chromium only; its system libraries are already on the runner image.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # Backend (up, deploy, env, accounts, data set), app build and browser at once; see the script.
      - run: scripts/e2e-prepare.sh
        timeout-minutes: 5
      - timeout-minutes: 8
        env:
          ATR_E2E_PREPARED: '1'
        run: |
          files="$(node apps/web/e2e/shards.ts desktop ${{ matrix.shard }} ${{ strategy.job-total }})"
          echo "$files"
          # one spec path per line: the word splitting is the point
          # shellcheck disable=SC2086
          pnpm e2e --project=desktop $files
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7
      # Per-file durations for e2e/shards.ts update.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-durations-${{ matrix.shard }}
          path: apps/web/test-results/results.json
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: scripts/convex-local.sh reset
