  - type: tips
    variant: insider
    items:
      - "**Slot: weekday afternoon** in Bangkok (Tue 5 or Wed 6 – Fri 8 Jan, 13:00–18:00) or the free night of **Sat 9 Jan**, until 01:30. Jan 2–4 you are in Chiang Mai."
      - "The home page shows who's working today, so you can check from the hostel before you walk over."
      - "Reception speaks English and Korean; a few staff speak Chinese, the venue says."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** prostitution is illegal under the 1996 Prevention and Suppression of Prostitution Act, but buying isn't punished (Wikipedia). A draft repeal bill (proposed May 2026) still needed the PM's endorsement in Aug 2026 before it could go to Parliament; it is not law (Pattaya Mail)."
      - "Pay the menu price at the desk and keep it that way: the venue's own promise is no extra charge, so don't agree to one in the room."
      - "Ask what the session includes, and what \"2S\" means, at reception **before** you pay; the site doesn't say."
      - "Tipping is expected at nuru houses: ฿500–1,000 to the masseuse, per one analysis quoted by Tokyo Reporter (2026). Decide yours beforehand."
