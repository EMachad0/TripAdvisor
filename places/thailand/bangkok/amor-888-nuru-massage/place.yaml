  - type: highlights
    items:
      - title: The menu price is what you pay
        text: "The site says every price on its board is **the full price**, the same as at the desk, and that changing your pick from the lineup doesn't change it. You pay at the desk, by card or cash."
      - title: Walk in, no booking
        text: "Open **11:30–01:30 every day**. Walk in, see who's working, choose. If you have someone in mind, the venue answers on LINE or Telegram in English and Korean."
      - title: Your own bathroom
        text: "Every session is in a private room with **its own shower and toilet**; the nuru rooms have a nuru mattress and warm gel."
      - title: Well reviewed for its size
        text: "**4.7 on Google from 505 reviews**, more than most nuru houses we checked. Reviews the venue shows on its site (May–Aug 2026) mention a clean shop and welcoming reception."
  - type: prose
    title: What you give up for the lower price
    dropcap: true
    text: |-
      At **฿3,500 for 60 min** this is the dearest of the value picks, ฿600 more than Boss Massage, and still below the ฿4,500+ Tokyo Reporter gives for premium Bangkok nuru. What the extra buys over the cheaper shops is certainty: a dated online menu, the promise that it's the full price, card payment, and walk-in without a chat first.

      What you don't get is a show room: no Jacuzzi room is priced on the menu (the gallery shows one whirlpool bath; ask at reception), and the rooms are plain rather than themed. The site also never says what the session includes beyond the massage, and its **"2S" packages** (90 min, ฿5,100 for nuru) are explained only at reception. Ask before you pay.

      One hour is about **six days of your R$100 "everything else" budget**.
