blocks:
  - type: hero
    image: rca-plaza
    caption: "RCA Plaza by day; no free photo of the club itself"
    hook: "Laser shows, a main stage ringed by a second-floor balcony, and EDM until four in the morning."
  - type: quick_facts
    time_needed: 3–4 h
    best_time: "Saturday, late"
    extra:
      - { label: Slot, value: Weekend night, detail: "Sat 2 or Sat 9 Jan; it doesn't close until 04:00" }
      - { label: Bring, value: "Passport", detail: "ID is checked at the ticket booth; a phone photo usually works" }
  - type: highlights
    items:
      - title: A proper EDM club
        text: "High ceilings, two floors, a main stage with standing tables in the middle and VIP sofas around it. The 2026 reviewer called it the closest thing to a real EDM club on RCA."
      - title: The upstairs balcony
        text: "Stairs take you to a second floor that wraps around the main room. Anyone can go up except into the VIP zones."
      - title: International crowd
        text: "Mostly Western visitors plus tourists from Hong Kong and China, according to the reviewer, who ended up partying with a group she met inside."
      - title: Route 66 next door
        text: "RCA's other mega-club is a few steps away: ฿200 with a drink, cash only, hip-hop main room. The same reviewer preferred Onyx."
  - type: menu
    title: Getting in
    items:
      - { name: "Onyx general entry + 1 drink", price_local: 400, price_brl: 65.96, note: "Pay at the cinema-style booth; cards OK", tag: signature }
      - { name: "Route 66 entry + 1 drink (next door)", price_local: 200, price_brl: 32.98, note: "Cash only", tag: cheap }
    note: "Staff will offer a table; say general admission. Drink prices inside weren't published in any source we found."
  - type: cost_breakdown
    items:
      - { label: "Entry with one drink", local: 400, brl: 65.96 }
  - type: map
    note: "Ask the driver to drop you at the **RCA entrance** on the Rama 9 side and walk in; driving down the strip can mean a toll."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night.** Sat 2 or Sat 9 Jan only: it runs till 04:00 and Sun 3 Jan is followed by a work week."
      - "Cheapest way there: **MRT to Phra Ram 9 or Phetchaburi**, then a short taxi to the RCA entrance. For the ride home at 04:00, split a Grab with people from your hostel."
  - type: tips
    variant: pitfalls
    items:
      - "Bring the passport or a clear photo of it; you won't get in without ID."
      - "Bring cash if you also want to try Route 66; its door is cash only."
  - type: weather
    temp_low_c: 23
    temp_high_c: 33
    conditions: "Dry season: warm nights"
    note: "Indoors, so the weather only matters on the way in; January nights are the mildest of the year."
    wear: "Light clothes and closed shoes; no source lists a strict dress code"
