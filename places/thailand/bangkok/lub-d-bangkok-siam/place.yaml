      atmosphere: 8.4
      checked: 2026-11-12
    social:
      - "**Moo Kra Ta (Thai BBQ) Night Gathering every day, 18:00–21:00, free entry**, per the official page."
      - "**Nightlife Shuttle every day at 21:00, ฿100** per person; Hostelworld also listed a river trip and quad games for 5 Jan."
      - "A hostel bar with cheap beer and a \"Rip shot\" challenge to represent your country, say reviews on the official page."
      - "Hostelworld's review summary (5 Jan search): \"some find it **less social than expected**\". A calm base, not a party hostel."
      - "**Your dates**: BBQ and shuttle fit Sat 2, Sun 3 and Sat 9 Jan only; on 4–8 Jan your 19:00 shift cuts the BBQ short and misses the shuttle."
    good_to_know:
      - "Dorms are 4-bed and air-conditioned; there is a **female-only 4-bed dorm**. Lift to every floor."
      - "24-hour reception, free luggage storage, laundry (one free load per stay, official page), coworking space."
      - "**Work week**: free Wi-Fi and a coworking space; overnight access isn't stated, so ask. One review calls the dorms \"clean and calm\"."
      - "**Day sleep risk**: after a 04:00 finish you'd sleep while roommates pack up for the 12:00 check-out. The cheapest private room was ฿1,700 on Tue 5 Jan."
      - "Minimum check-in age 18. Free cancellation rates can be cancelled until 1 day before; later, or a no-show, is charged in full."
      - "Smoking only in designated areas; no curfew."
  - type: highlights
    items:
      - title: The BTS at the door
        text: "National Stadium station is steps away, so Sukhumvit bars, Silom and Chatuchak are a train ride, not a taxi haggle."
      - title: A free dinner to meet people
        text: "The daily **Moo Kra Ta** barbecue gathering (18:00–21:00) is free to join, then the ฿100 shuttle heads out at 21:00."
      - title: Sleep well, work well
        text: "**9.9 for security**, 9.3 for cleanliness, 4-bed dorms and a coworking space: the best of the three for the 4–8 Jan work week."
      - title: Central Bangkok on foot
        text: "MBK in 5 minutes, Siam Square and BACC in 6–7, Jim Thompson House in about 15."
  - type: cost_breakdown
    items:
      - { label: "4-bed dorm bed, Tue 5 or Sat 9 Jan (non-refundable)", local: 599.03, brl: 98.78 }
      - { label: "Nightlife Shuttle at 21:00", local: 100, brl: 16.49, optional: true }
  - type: map
    note: "Come up from **BTS National Stadium**; the hostel is on Rama I Road opposite MBK Center."
  - type: tips
    variant: insider
    items:
      - "Join the **Moo Kra Ta night** on Sat 2 or Sun 3 Jan: it is free and the Nightlife Shuttle leaves right after, at 21:00."
      - "If you want Khao San's party nights, stay here for the BTS and take a taxi to Banglamphu for a night, or split your stay with Mad Monkey or NapPark."
  - type: tips
    variant: pitfalls
    items:
      - "The non-refundable rate is ฿66 cheaper (฿106 on 2 Jan) but can't be cancelled; with dates still moving, the free-cancellation rate is safer."
      - "The arrival night is the dearest: ฿950 on Sat 2 Jan against ฿599 on 5 or 9 Jan."
      - "For 4–8 Jan, weigh a 4-bed dorm (฿599, people moving around while you sleep 05:00–13:00) against the private 4-bed room (฿1,700, quiet). Five nights: **฿3,000 (R$494) dorm vs ฿8,500 (R$1,401) private**, a gap of nine days of the R$100 budget. Middle way: private only after the hardest shifts."
      - "Breakfast costs about ฿240 a night extra on Hostelworld; street food around Siam is cheaper."
