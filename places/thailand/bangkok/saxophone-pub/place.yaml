  - type: highlights
    items:
      - title: Live music every night since 1987
        text: "Three sets a night: an acoustic opener at **19:30**, the main band **21:00–23:30**, and a late band **00:00–01:30**."
      - title: Rotating styles
        text: "Jazz, big band, blues and Latin for the main set; soul, funk or reggae late. Check the week's line-up on the official schedule."
      - title: Not a hushed jazz club
        text: "You can still talk across the table, and the room loosens up as the night goes on until people sing along and dance."
      - title: Two floors of character
        text: "A wooden two-storey building packed with vintage collectibles. Upstairs has floor seating and a pool table."
