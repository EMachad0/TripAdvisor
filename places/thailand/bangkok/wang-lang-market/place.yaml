  - type: highlights
    items:
      - title: Sushi for a few baht
        text: "**Sushi Wang Lang by Orathai** (ซูชิวังหลัง บาย อรทัย) sells fresh nigiri at about **฿6 a piece**, daily 09:30–18:30. There is always a queue, and it moves."
      - title: Lunch with the hospital
        text: "The market sits next to **Siriraj Hospital**, with Thammasat University nearby, so at lunch you eat among nurses' uniforms and students. Weekdays are more local, weekends more food tourists."
      - title: Local prices
        text: "Most dishes cost **฿30–60**. Som tam and Isaan dishes at Som Tam Sida run about ฿40–50."
      - title: The river commute
        text: "The cross-river ferry from **Tha Chang**, beside the Grand Palace, takes a couple of minutes, so it fits between a morning at the temples and the afternoon."
  - type: prose
    title: How to eat it
    dropcap: true
    text: |-
      Wang Lang is not one hall but a few lanes of shophouses, carts and small canteens between the river piers and Siriraj Hospital. It is a daytime market: breakfast stalls open early, the full spread is there from late morning, and some vendors pack up from mid-afternoon.

      Graze. Five pieces of sushi from Orathai, a plate of som tam, a bag of crispy kanom bueng, then a bowl of **tub tim krob** to cool down. That is about ฿120 before dessert. For a sit-down dish, some side-lane restaurants are packed with hospital staff at lunch, which is a good sign.
