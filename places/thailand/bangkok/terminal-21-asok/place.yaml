      - { label: Good in heat, value: "Yes", detail: "Fully indoor, linked to the BTS and MRT" }
  - type: highlights
    items:
      - title: A different city on every floor
        text: "Caribbean on LG, then **Rome, Paris, Tokyo, London, Istanbul**, San Francisco on 4 and 5, and Hollywood with the cinema on 6. London has red phone boxes; San Francisco has a Golden Gate span overhead."
      - title: Pier 21, the cheap food court
        text: "About thirty stalls on the 5th floor. Travjoy (2026) puts most plates at **฿40–90**, close to street-food prices, in air-conditioning."
      - title: An airport, mostly as a joke
        text: "Departure boards in the atrium and escalators signed as gates. The toilets are themed for their floor's city too, so peek in on each level."
      - title: A 36-metre escalator
        text: "Wikipedia lists Terminal 21's escalators, up to **36 m**, as the longest in Thailand. Travjoy says the long one runs from M straight up to Istanbul on 3."
  - type: prose
    title: Lunch before your shift
    dropcap: true
    text: |-
      Terminal 21 opened in 2011 on the corner of Sukhumvit and Asok, and it's one of Bangkok's most useful malls for a backpacker. It sits on top of both BTS Asok and MRT Sukhumvit, it's free and air-conditioned, and the food court is cheap.

      You don't need to buy anything. The reason to go is the decor. Ride the escalators up through the cities and take photos on each floor, then eat on the 5th floor. On a weekday, come for lunch: it's on the same BTS line as Siam, and it fits easily before a 19:00 shift.
