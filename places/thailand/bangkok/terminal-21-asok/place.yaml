  - type: tips
    variant: insider
    items:
      - "**Pier 21 card**: load it at the counter at the food-court entrance (from ฿100 per Travjoy), tap it at the stalls, and hand it back on the way out for your change. Stalls don't take cash."
      - "Soi Cowboy is just off Asok too, if you come back on a free night."
  - type: tips
    variant: pitfalls
    items:
      - "Unused credit on the food card is refunded only **on the same day** at the mall (Travjoy). Cash it in before you leave."
