  - type: hero
    image: reception
    caption: "Hakumi's reception: a wood-slatted desk, orchids and potted plants"
    hook: "A Japanese-style nuru house in a Phrom Phong side alley, where the upgrade is a room with its own Jacuzzi."
  - type: quick_facts
    time_needed: "60–90 min session"
    best_time: "Weekday 13:00–18:00"
    extra:
      - { label: Slot, value: "Weekday afternoon", detail: "Opens 10:00: Wed 6 – Fri 8 Jan before work, or Sat 9 Jan until midnight" }
      - { label: vs value houses, value: "+฿500–1,500", detail: "Typical 60-min nuru: ฿2,500–3,500 (Tokyo Reporter, 2026)" }
      - { label: Payment, value: "Cash or Thai QR only", detail: "No cards, per the venue's site" }
  - type: highlights
    items:
      - title: The Jacuzzi room is the point
        text: "The 60- and 90-min packages come in two room types. The **VIP Jacuzzi** room (฿4,000 for 60 min, ฿5,000 for 90) is the one the venue calls \"luxurious\"; it says its rooms are more spacious than other spas'."
      - title: Everything in one written price
        text: "The menu says **every package is full service**, on a proper nuru mattress, with imported Japanese gel. No ladder of add-ons to negotiate in the room."
      - title: Strong recent reviews
        text: "**4.8 from 181 Google reviews**, the newest a week old (Nov 2026). Google reviewers mention smooth LINE booking, a receptionist who guided them through choosing, and clean rooms (Gurulist: 4.8 from 161)."
      - title: Easy between lunch and work
        text: "**5 minutes from BTS Phrom Phong Exit 5**, opposite EmSphere mall. Open from 10:00 every day, so a 14:00 booking leaves hours before a 19:00 shift."
  - type: prose
    title: What the premium buys, and what it doesn't
    dropcap: true
    text: |-
      Tokyo Reporter (Aug 2026) puts a typical 60-minute nuru in Bangkok at **฿2,500–3,500**, with premium sessions at ฿4,500 or more. Hakumi's cheapest 60 minutes (shower room, ฿3,500) sits at the top of that normal range; what makes it a premium booking is the **Jacuzzi room**, ฿500 more, or 90 minutes in it for ฿5,000.

      What you get for that, going by the venue and its reviewers: a bigger private room with its own tub, a menu where "full service" is written into every price, and a "step by step process" the venue pitches at first-timers. What it can't promise is a particular person: the masseuse you pick from the daily lineup matters more than the room, which is why the venue tells you to book.

      Sixty minutes in the Jacuzzi room is about **R$673, nearly seven days of your R$100 "everything else" budget**, before any tip. Do it once if you do it at all.
