  - type: tips
    variant: insider
    items:
      - "The 90-min shower room (฿4,000) costs the same as 60 min with the Jacuzzi: decide whether you want more time or the better room."
      - "Taxi drivers: say **\"UBC 2 office, Sukhumvit Soi 33\"** (the venue's tip)."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** a grey area under the 1996 Prostitution Act. Clients are rarely charged, but foreign clients have been caught in raids (Wikipedia). An NGO gave the House a draft bill to repeal the Act on 28 May 2026; it is not law (Khaosod)."
      - "Book only via the LINE, Telegram or number on **hakumimassage.com** (+66 64 576 4265). The venue itself warns its WhatsApp is unreliable."
      - "**Cash or Thai QR only**: no cards. Get baht before you go."
      - "The tip isn't on the menu. Tokyo Reporter (2026) says ฿500–1,000 to the masseuse is customary at nuru houses; decide yours beforehand."
