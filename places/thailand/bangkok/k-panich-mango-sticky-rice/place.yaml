  - type: highlights
    items:
      - title: The reference version
        text: "Founded in **1932** by Kab and Sarapee Chiabchalard on Tanao Road, per Wikipedia. Michelin keeps it on its **Bib Gourmand** list in the 2027 guide."
      - title: Ingredients with an address
        text: "Wikipedia says the sticky rice comes from **Chiang Rai**, the coconuts from Chumphon, and the mangoes are **Nam Dok Mai** and Ok Rong."
      - title: A cheap Michelin dessert
        text: "**฿140** (about R$25) for a box of mango sticky rice in Sep 2026. It is a snack stop, not a meal, so it fits between temples."
      - title: Fits a work day
        text: "It closes at 18:00 UTC+7, so it is a lunch or afternoon stop. Phuket101 found no crowd at 13:00 on a weekday, with people walking in all the time."
  - type: prose
    title: How it works
    text: |-
      K. Panich is a counter, not a restaurant. You point at what you want, pay cash and take a box. Phuket101 found a few wooden stools on the pavement for eating on the spot; most people take it away.

      A Wongnai reviewer (May 2025) says foreign visitors can carry their box across the road and eat it at the noodle shop opposite. Sticky rice is also sold by the bag, so you can try the custard topping or the plain coconut rice for later.
