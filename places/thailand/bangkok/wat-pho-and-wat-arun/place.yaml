  - type: map
    note: "Wat Pho's riverside entrance is a 3–5 minute walk from **Tha Tien pier**, where the ferry to Wat Arun leaves. Pay the ferry in cash."
  - type: tips
    variant: insider
    items:
      - "**Slot:** weekday afternoon. Start at Wat Pho by 13:00 so Wat Arun's 17:30 last entry is never tight."
      - "Do the Grand Palace first on a day when you can arrive early; it's 10 min north, but its ticket desk closes at 15:30."
      - "If the ferry is loading when you arrive it is full: the next one comes within a few minutes."
  - type: tips
    variant: pitfalls
    items:
      - "Anyone outside saying Wat Pho is \"closed for a ceremony\" is steering you to a shop or tour. Walk on."
      - "Don't climb Wat Arun's prang in flip-flops: closed shoes or sandals with a heel strap."
      - "Shorts above the knee, tank tops and see-through clothes are turned back at both temples."
