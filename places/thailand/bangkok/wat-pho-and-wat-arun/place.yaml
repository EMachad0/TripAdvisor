      - { label: Dress code, value: Shoulders + knees covered, detail: "Wat Arun rents sarongs: ฿20 + ฿100 deposit" }
  - type: highlights
    items:
      - title: The 46 m reclining Buddha
        text: "Wat Pho is Bangkok's oldest and largest temple. Its gold Buddha fills the hall; along the wall, **108 bronze bowls** take a coin each for merit, so bring small coins."
      - title: Massage at the original school
        text: "The temple's **Thai Traditional Medical School** runs massages inside the grounds: ฿340 for 30 min, ฿520 for an hour."
      - title: The porcelain prang
        text: "Wat Arun's central tower is covered in Chinese porcelain and shells. You can climb part of it; the steps are **steep, almost vertical**, with rope rails."
      - title: The river in between
        text: "The small cross-river ferry from Tha Tien (about ฿5) is the cheapest way over: a couple of minutes on the water."
  - type: prose
    title: One afternoon, two icons
    dropcap: true
    text: |-
      This is the afternoon plan for a work week. Get off the MRT at **Sanam Chai** around 13:00, see the reclining Buddha and the quiet courtyards of Wat Pho, and if your back hurts from the laptop, take the hour-long massage at the temple school.

      Then walk 3–5 minutes to **Tha Tien pier**, cross for ฿5 and reach Wat Arun before last entry at **17:30**. The ferry runs on roughly Wat Arun's hours, so on a workday cross back with the light still on and you will be at your desk by 19:00. On a free evening, stay on the Tha Tien side: the famous photo of Wat Arun is taken from the east bank, and the temple is lit after dark.
