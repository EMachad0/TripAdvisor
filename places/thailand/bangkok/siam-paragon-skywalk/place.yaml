  - type: highlights
    items:
      - title: The supercar kerb
        text: "Parking at the **main entrance canopy on Rama I Road** is kept for luxury cars. Renndriver says Saturday and Sunday evenings, roughly 17:00–22:00, bring the most Ferraris, Lamborghinis and Rolls-Royces."
      - title: Cars inside, too (check first)
        text: "Rolls-Royce announced a 'Galleria' showroom on the **2nd floor** in Aug 2024, and Inside Retail listed it among new openings in Mar 2025. I found nothing newer, so check the mall directory before you count on it."
      - title: Gourmet Eats, the food hall
        text: "Ground-floor street-food stalls. Thairath (Aug 2026) puts a meal at roughly **฿100–300 a person**; desserts start lower, like lod chong at ฿50."
      - title: The skywalk
        text: "The free, 24-hour **OneSiam Skywalk** joins Paragon, Siam Center and Siam Discovery above the traffic. Another skywalk runs from near Paragon to CentralWorld, Gaysorn and Platinum."
  - type: prose
    title: Bangkok's mall district, from above
    dropcap: true
    text: |-
      Siam Paragon opened in 2005, cost about ฿15 billion and has around 400,000 m² of shops, a 16-screen cinema and the Sea Life aquarium in the basement. Most of it is luxury brands you won't buy. It's still worth a card because of what's around them: a kerb of supercars on weekend nights and a ground-floor food hall of street-food stalls.

      Use it as the start of a walk. Come out of BTS Siam, go through Paragon, cross on the OneSiam Skywalk to Siam Center and Siam Discovery, and follow the walkways toward CentralWorld. If you stay at Lub d Siam, MBK and all of this are a short walk away.
