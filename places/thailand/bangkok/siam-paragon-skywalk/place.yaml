  - type: map
    note: "From **BTS Siam, Exit 3** you're in Paragon. The supercars park at the **main entrance on Rama I Road**."
  - type: tips
    variant: insider
    items:
      - "**Supercars**: Renndriver's own tip is Saturday or Sunday, roughly 18:00–21:00, at the Rama I entrance canopy. Weekday afternoons are quieter, which is better for clean photos."
      - "Eat at **Gourmet Eats** on the ground floor, not the sit-down restaurants upstairs."
  - type: tips
    variant: pitfalls
    items:
      - "The Sea Life aquarium in the basement is a paid attraction; seeing the mall costs nothing."
      - "The supercar parking is informal: no schedule, so some evenings there's little to see."
