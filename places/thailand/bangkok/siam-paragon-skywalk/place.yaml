  - type: hero
    image: paragon-facade
    hook: "Ferraris at the kerb, a food hall downstairs, and an elevated walkway over the busiest junction in town."
    caption: "Siam Paragon's glass front and forecourt fountains on Rama I Road"
  - type: quick_facts
