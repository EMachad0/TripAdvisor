      - { label: Dress code, value: Shoulders + knees covered, detail: Shoes off inside the pagoda }
  - type: highlights
    items:
      - title: The glass stupa
        text: "On the pagoda's **fifth and top floor**, a stupa of emerald-green glass about 8 m tall stands under a ceiling painted with blue and violet galaxies and lotus patterns."
      - title: A 69-metre Buddha
        text: "**Phra Buddha Dhammakaya Thep Mongkhon**, finished in 2021, is 69 m of bronze. You see it from rooftops and the BTS across this part of Thonburi."
      - title: A museum on the way up
        text: "The lower floors of the 80 m **Maharatchamongkhon** pagoda hold Buddhist artefacts, old ceramics and even vintage cars given to the temple."
      - title: A working temple, not a coach stop
        text: "Founded in **1610**, it is still a busy local temple, with worshippers, monks and thinner crowds than the riverside icons."
  - type: prose
    title: Off the river circuit
    dropcap: true
    text: |-
      Most visitors do the three river temples and stop. This one is a few MRT stops past them on the Thonburi side, free, and the room at the top of the pagoda is one of the strangest in Bangkok: a green-glass stupa in a dark hall painted as the cosmos. Photographs undersell it.

      The giant Buddha outside, finished in 2021, gets people through the gate. Come in the afternoon, look round the museum floors on the way up, and keep the top floor for last. Guides say the stupa lift gets queues and school groups mid-morning, which is one more reason to come later in the day.
