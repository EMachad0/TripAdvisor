  - type: map
    note: "From **MRT Bang Phai, Exit 1**, walk 10–15 min through residential lanes, or take a motorbike taxi. A Grab from central Bangkok is about ฿100–200; show the driver the map, the name doesn't always land."
  - type: tips
    variant: insider
    items:
      - "**Slot:** weekday afternoon. Be inside the pagoda by 17:00 so you have time for the lift and the top floor."
      - "Late-afternoon light on the bronze Buddha is the best photo; the statue's colour deepens from gold to copper at sunset."
      - "No public ferry stops nearby; coming by water means a longtail canal tour."
  - type: tips
    variant: pitfalls
    items:
      - "Floors get slippery after rain; you walk barefoot inside the pagoda."
      - "Some interior halls ban photos: look for signs, and never pose irreverently with a Buddha image."
