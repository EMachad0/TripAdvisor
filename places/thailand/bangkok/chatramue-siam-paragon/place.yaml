  - type: map
    note: "From BTS Siam, follow the signs into Siam Paragon and go down to the **G-floor food hall**. Wongnai puts the counter next to Potato Corner. Not there? The brand lists a 3rd-floor Paragon branch."
  - type: tips
    variant: insider
    items:
      - "Thai tea comes **very sweet**. Ask for **หวานน้อย** (*waan noi*, less sweet) or a percentage: Thairath calls **50%** the safe pick. For no sugar at all, order the **1 ศูนย์ 2 ต่ำ** version."
      - "The menu card has photos and prices, so you can point. Say **ใส่ไข่มุก** (*sai khai muk*) to add pearls."
      - "Wongnai lists **credit cards** as accepted. Counters also show a Thai QR code (photo below); whether foreign wallet apps can pay it is unverified, so carry a little cash too."
  - type: tips
    variant: locals
    items:
      - "Want brown-sugar boba instead? Grab's Sep 2026 list picks **Bearhouse** in Siam Square (brown-sugar milk tea is its signature) and **Xing Fu Tang**."
      - "For Thai tea with pearls from a smaller local shop, the same list recommends **Nom Jo (นมโจ)** and its ชาไทยไข่มุก."
