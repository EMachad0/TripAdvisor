  - type: hero
    image: mega-bangna-counter
    caption: "A ChaTraMue counter at Mega Bangna; no free photo of the Paragon one, which looks alike"
    hook: "Bangkok's own Thai-tea brand: orange milk tea, rose tea and Thai-tea soft serve, poured since 1945."
  - type: quick_facts
    time_needed: "15–30 min"
    best_time: "Weekday afternoon"
    extra:
      - { label: Pearls, value: "Yes, +฿10", detail: "Emerald, brown-sugar or konjac pearls as a topping" }
      - { label: Fits, value: "Weekday afternoon", detail: "Open 10:00–21:30 (UTC+7) every day" }
  - type: highlights
    items:
      - title: The original orange tea
        text: "ChaTraMue (\"Number One Brand\") started as a tea shop on Yaowarat Road in 1925 and took the name in **1945**. Its orange **ชาไทย** is the signature drink."
      - title: Bubble tea, Thai style
        text: "Add **pearls** to any drink for about **฿10**, or order the ready-made **Assam milk tea with pearls and brown-sugar jelly** (฿55)."
      - title: Thai-tea soft serve
        text: "The **ซอฟต์เสิร์ฟชาไทย** is on the brand's dessert menu: the same tea frozen. A 2017 review paid **฿45**; expect a little more now."
      - title: Pocket money prices
        text: "A Thai tea is **฿45 (R$ 7.78)**; rose milk tea and the Thai tea latte are ฿55 (R$ 9.51)."
  - type: prose
    title: Why this branch
    text: |-
      ChaTraMue has dozens of counters around Bangkok. The one in **Siam Paragon's G-floor food hall** is the easiest: it is a short walk from BTS Siam, it opens every day from 10:00 to 21:30 (UTC+7), and you pass it anyway if you visit Paragon or Siam Square. The brand's own branch list names a Paragon counter on the **3rd floor** instead, so if the G-floor one has moved, try upstairs. The brand also lists a counter on **MBK's 7th floor**, one BTS stop west at National Stadium.

      You will see it again further north: the brand lists Chiang Mai counters at **Nimman Soi 9**, **Warorot Market**, **Maya (B1)** and **Central Chiang Mai Airport** (a mall near the airport, not inside the terminal), so you can try it there first.
