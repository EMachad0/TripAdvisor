  - type: hero
    image: facade
    hook: "A drum-and-pipe orchestra, a betting pit roaring every exchange, and elbows thrown under a 1950s roof."
    focus: "50% 55%"
  - type: quick_facts
    time_needed: 3–3.5 h
    best_time: "Sat 2 or 9 Jan, 19:00"
    extra:
      - { label: Slot, value: Weekend night, detail: "Sat 2, Sun 3 or Sat 9 Jan; not on work nights" }
      - { label: Cheapest seat, value: "฿1,200 (Sat)", detail: "Online price, RWS card; Sunday ฿1,500 cheapest online" }
  - type: highlights
    items:
      - title: The oldest ring in Thailand
        text: "Its first fight was on **23 December 1945**, after World War II delayed the building work begun in the early 1940s. The roof came in 1951."
      - title: Two kinds of night
        text: "**Saturday RWS** is short, punchy 3-round fights built for TV and tourists. **Sunday Kiatpetch** mixes in traditional 5-round bouts with a bigger local betting crowd."
      - title: The cheap seats are the good seats
        text: "Third Class is free seating at the top of the bowl with a **360° view** of the ring. You see the walk-outs and the gamblers below as well as the fight."
      - title: The bell
        text: "The ringside bell is a stadium legend: the story goes it can be heard **two kilometres** away."
  - type: prose
    title: Rajadamnern or Lumpinee?
    dropcap: true
    text: |-
      Bangkok has two famous stadiums, Rajadamnern and Lumpinee. Rajadamnern wins for this trip on two counts: it's in the Old Town near Khao San, and it has a card every night of the week, including both of your free Saturdays and the Sunday in between.

      Seat prices only buy comfort and closeness. Ringside (฿2,500–3,500) puts you at the ropes; the VIP balconies add free drinks. For a budget traveller the Third Class bench is the honest choice. It costs about **twice** your daily R$100 budget (198%), so the budget bar below shows it maxed out. Make it your one splurge in Bangkok, then keep the rest of that weekend free, with Channel 7's Sunday fights at no cost.
  - type: gallery
    images:
      - file: fight
        caption: "A bout at Rajadamnern (2007 photo; the hall has been renovated since)"
      - file: ringside-crowd
        caption: "Spectators at the ringside rail, Rajadamnern, 2007"
  - type: book_ahead
    steps:
      - days_before: 3
        text: "Open the Ticketmelon page for your date, pick **Third Class** (Sat) or **Leo Section** (Sun), and pay by card. The QR e-ticket comes by email."
      - days_before: 0
        text: "Arrive when the doors open (18:00 Sat, 17:00 Sun) and show the QR at the gate. Bags go through an X-ray."
  - type: cost_breakdown
    items:
      - { label: "Third Class, Saturday RWS", local: 1200, brl: 197.88 }
      - { label: "Taxi from MRT Sam Yot (guide's figure)", local: 70, brl: 11.54, optional: true, estimate: true }
  - type: map
    note: "The stadium is on Ratchadamnoen Nok Road, east of Democracy Monument. No metro stop is close: walk 20 min or take a short taxi from MRT Sam Yot."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night.** Sat 2 Jan (arrival day), Sun 3 Jan or Sat 9 Jan. Every other night that week you're working from 19:00."
      - "Eat before you go: the Muay Thai Stadiums guide recommends **Likit Gai Yang**, a grilled-chicken restaurant just around the corner."
  - type: tips
    variant: pitfalls
    items:
      - "Buy only on rajadamnern.com / Ticketmelon or at the stadium. Agents and resellers mark the same seats up."
      - "One guide lists Third Class at about **฿1,000 at the door** (not sold in advance). Unconfirmed by the stadium, and risky on a busy Saturday: book online if the night matters."
      - "Don't put your feet on rails or seats, and don't touch a fighter's head in photos."
