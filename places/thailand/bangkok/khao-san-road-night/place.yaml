    note: "Many places add 7% VAT and sometimes 10% service. Street stands are cash only."
  - type: map
    note: "No metro stop next to it. The Chao Phraya Express flag boats to **Phra Arthit pier** run **Mon–Fri only**, so on your weekend nights take the MRT to **Sam Yot** (about 1.5 km away) and a short taxi or Grab, or a Grab all the way."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night.** Sat 2 Jan, Sun 3 Jan or Sat 9 Jan. Mon–Fri you work from 19:00."
      - "Happy hours (often 17:00–20:00) can bring a small local beer down to ฿90–120: drink early on Rambuttri, then move to the strip."
      - "Shops like 7-Eleven sell alcohol **11:00–24:00** (the old 14:00–17:00 ban ended in 2026); nothing from midnight to 11:00."
  - type: tips
    variant: pitfalls
    items:
      - "Buckets are bottom-shelf spirit plus Thai energy drink; two hit much harder than you expect."
      - "Pickpockets work the crowd after 21:00: front pockets, no phone left on the table."
      - "Don't book buses or minivans from the travel agents on the strip; the guide warns of luggage theft and downgrades. Use 12go.asia or the bus terminals."
  - type: weather
    temp_low_c: 23
    temp_high_c: 33
    conditions: "Dry season: warm, clear evenings"
    note: "January nights are the most comfortable of the year, around the mid-20s °C. Rain is rare."
    wear: "Shorts, T-shirt, sandals; no dress code anywhere on the strip"
