blocks:
  - type: hero
    image: khao-san-night
    hook: "Neon signs, grilled-meat smoke, Bob Marley mixed into Thai club beats, and a bucket on every table."
  - type: quick_facts
    time_needed: 2–4 h
    best_time: "Sat/Sun, from 20:00"
    extra:
      - { label: Slot, value: Weekend night, detail: "Sat 2, Sun 3 or Sat 9 Jan; on work nights you start at 19:00" }
      - { label: Cheaper one street over, value: "Soi Rambuttri", detail: "Small beer ฿100–150 vs ฿120–180 on the strip" }
  - type: highlights
    items:
      - title: The backpacker crossroads
        text: "A former rice market (*khao san* = milled rice) that became Southeast Asia's backpacker hub in the 1980s. *The Beach* opens here."
      - title: The street changes by the hour
        text: "Shuttered before 17:00, tables in the road by early evening, speakers on at **20:00**, peak around **22:00**, hoses out at 02:00."
      - title: Soi Rambuttri, the calmer twin
        text: "One block north: tree-lined, lanterns, sit-down bars and **cheaper beer**. Better for a conversation with the people from your hostel."
      - title: Sunset on the old city wall
        text: "**Santichai Prakan Park** at the river end has a stretch of the 18th-century wall and a breeze off the Chao Phraya. Five minutes from the noise."
  - type: prose
    title: How to do it on R$50
    dropcap: true
    text: |-
      The strip is about the people, not the drinks. Start with dinner from a cart at the edge of the street between 18:00 and 19:30, when it's still quiet, then walk the length of Khao San once to take it in.

      For the actual drinking, Soi Rambuttri or Phra Athit Road are a notch cheaper and you can hear each other. Come back to the main strip after 22:00 when it's at full volume. It's the classic hostel group night: NapPark (5 Tani Road) is one street north, about 200 m as the crow flies, and Mad Monkey (55 Phra Sumen Road) about 500 m north.
