blocks:
  - type: hero
    image: orange-line
    hook: "The cheapest river cruise in Bangkok is a commuter boat with a flag on the back."
    caption: "An Orange Flag boat docking at Phra Arthit pier, Banglamphu"
  - type: quick_facts
    time_needed: 1–2 h with stops
    best_time: Weekday, from 15:40
    extra:
      - { label: Your slot, value: Weekday afternoon, detail: "Ride 15:40–18:00, back before the 19:00 shift" }
      - { label: Tickets, value: At the pier desk, detail: "Or a Rabbit card, also good on the BTS" }
      - { label: Wat Arun, value: No stop, detail: "Get off at Tha Tien (N8), take the cross-river ferry" }
  - type: highlights
    items:
      - title: A river tour at bus prices
        text: "The Yellow Flag costs **฿24** and the Orange Flag **฿19**, flat rate. The Blue Flag tourist boat on the same stretch costs ฿150 for a day pass."
      - title: The sights from the water
        text: "Between **Sathorn** and **Phra Arthit** you pass Chinatown (Ratchawong, N5), Wat Pho (Tha Tien, N8), the Grand Palace (Tha Chang, N9) and Wang Lang market (N10)."
      - title: Your hostel's pier
        text: "**Phra Arthit (N13)** is the stop for Khao San Road. Ride south to Sathorn and the BTS, and the boat beats the traffic."
      - title: Ride it with the commuters
        text: "The Orange Flag runs only at rush hour on weekdays. The first afternoon boat leaves **Wat Rajsingkorn (S3) at 15:40** (Nonthaburi 16:00), so you ride the commuter boat in the late-afternoon light."
  - type: prose
    title: Which flag to catch
    dropcap: true
    text: |-
      The flag on the stern tells you the line. The **Orange Flag** stops almost everywhere between Nonthaburi (N30) and Wat Rajsingkorn (S3), but since 2026 it only runs on weekday mornings and late afternoons. In between (08:10–15:40 on weekdays) and all day on weekends and holidays, a **Yellow Flag** boat takes over the route with about 24 stops, for ฿24. The Yellow boats that run at weekday rush hour use the **original short route**, which skips Phra Arthit (N13) and Tha Tien (N8).

      For a weekday afternoon, take the Yellow Flag after lunch, hop off for a temple or Wang Lang market, then ride an Orange Flag boat back in the late afternoon. Buy a ticket at the pier desk.
