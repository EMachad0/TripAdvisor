    images:
      - { file: on-board, caption: "An express boat throwing spray past the riverside buildings" }
      - { file: inside-cabin, caption: "Inside an Orange Flag boat: bench seats, open sides, standing room at rush hour" }
      - { file: river-bus, caption: "A packed express boat pulling away from a pier" }
  - type: cost_breakdown
    items:
      - { label: "Yellow Flag, Phra Arthit to Sathorn (long route)", local: 24, brl: 3.96 }
      - { label: "Yellow Flag, back up the river", local: 24, brl: 3.96 }
  - type: map
    note: "The pin is **Sathorn (Central) Pier**, the hub, next to BTS Saphan Taksin. From Khao San, start at **Phra Arthit (N13)** instead."
  - type: tips
    variant: insider
    items:
      - "**Your slot: weekday afternoon.** Ride the long-route Yellow Flag after lunch, then an Orange Flag back (first one 15:40 from Wat Rajsingkorn, a few minutes later at Sathorn), and be on land well before your 19:00 shift."
      - "Get a **Rabbit card**: it works on the express boat, the BTS and some MRT lines, so you skip the ticket desk."
      - "The Blue Flag tourist boat (฿150 day pass) stops at Wat Arun. Worth it only if you hop on and off a lot."
  - type: tips
    variant: pitfalls
    items:
      - "On weekends there is **no Orange Flag**. Look for the yellow flag and pay ฿24."
      - "Rush-hour Yellow boats (Mon–Fri 06:00–08:05 from Nonthaburi, 17:15–19:05 from Sathorn) run the short route and **skip Phra Arthit and Tha Tien**; the ฿24 Phra Arthit–Sathorn ride needs the long-route Yellow (weekdays 08:10–15:40, or weekends). Oriental Pier (N1) is closed."
  - type: weather
    temp_low_c: 23
    temp_high_c: 33
    conditions: Dry and sunny; the cool season
    note: "Boats are open-sided, so you get the heat and the breeze. A late-afternoon ride avoids the worst of the midday sun."
    wear: Light clothes; sunglasses for the water glare
