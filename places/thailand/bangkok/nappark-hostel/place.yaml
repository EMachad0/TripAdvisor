    variant: insider
    items:
      - "Ask at reception which night has the **pub crawl** and which the **family dinner**, and plan your first two nights around them."
      - "**Work week (4–8 Jan)**: the listing has a coworking space and Wi-Fi in the whole building; ask at the 24-hour desk if it stays open for a 19:00–04:00 shift."
  - type: tips
    variant: pitfalls
    items:
      - "Pick a **Standard** bed over an Economy one if you sleep lightly: same style, less foot traffic. Sleeping by day, pay for the 6-bed deluxe with partitions."
      - "Air-conditioning in the big dorms is not stated on the listing; check the room photos or ask before booking if you need it."
