    social:
      - "**Daily activities every night of the week**: a pub crawl hosted by \"Baby\", pub quiz nights, music bingo, family dinners and social games."
      - "Hostelworld HOSCARs including **Best Solo Hostel in Asia** and Best Hostel in Asia (2024)."
      - "A garden around a 150-year-old tamarind tree, Thai cushions and chill-out areas: easy to start a conversation."
      - "Nov 2026 review: \"Lots of hostel activities every night.\""
      - "**Your dates**: evening events fit Sat 2, Sun 3 and Sat 9 Jan only; on 4–8 Jan your shift starts at 19:00."
    good_to_know:
      - "Every bed is a \"NapSpace\" with reading lamp, sockets and a mirror. **Economy** beds sit where people walk past more, so they are noisier."
      - "Free lockers, linen, towels, duvets and luggage storage; 24-hour English-speaking reception."
      - "Shared bathrooms off the hallways; the 22-bed room is the cheapest but also the busiest."
      - "Bike hire, board games, a coworking space and computers. No smoking, no curfew."
      - "**Work week**: Wi-Fi throughout and a coworking space; overnight use isn't stated, so ask. For day sleep, the 6-bed has partitions."
  - type: highlights
    items:
      - title: The cheapest good bed
        text: "**฿350 (R$58)** a weeknight (฿500 on Sat 2 Jan), with free cancellation on every rate."
      - title: Social, but you can sleep
        text: "Pub crawl, quiz and family dinners for the evenings; no pool parties or foam, so the building calms down."
      - title: Awards for solo travellers
        text: "**9.5 from 9,773 Hostelworld reviews** and Best Solo Hostel in Asia at the 2024 HOSCARs."
      - title: Walk to the old city
        text: "Two streets from Khao San Road, and in walking distance of the Grand Palace and Wat Pho, says Hostelworld."
