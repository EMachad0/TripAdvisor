  - type: highlights
    items:
      - title: A story, not a menu
        text: "The venue sells it as **role-play first**: you pick a scenario, the actress guides you into it from the moment you walk in, and the session escalates step by step to an intimate finish. Its own FAQ says the difference from a massage parlour is the plot and the interaction."
      - title: Six sets to choose from
        text: "**Hospital** (nurse), **gym** (personal trainer), **classroom** (teacher plus classmate, a two-actress plot), **female dorm**, **first-class cabin** (flight attendant) and **prison** (guard, light bondage with handcuffs)."
      - title: Clear prices on the site
        text: "Actresses are graded **S, A and B**. One actress for 70 min costs ฿7,000 / ฿5,800 / ฿4,800; two actresses for 100 min cost ฿7,000–11,000 by pairing. That beats guessing at a counter."
      - title: Next to the club strip
        text: "It sits on **RCA**, Bangkok's club street, in the building opposite the Route 66 club; Onyx is on the same strip. On a free Saturday you can do both in one taxi ride."
