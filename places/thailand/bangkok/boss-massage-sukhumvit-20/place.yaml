      - { label: Second branch, value: "Soi 33/4", detail: "Same menu on the site; BTS Phrom Phong, about 8 min" }
  - type: highlights
    items:
      - title: The price is on the website
        text: "Nuru gel on an air mattress, in a room with its own shower: **฿2,900 for 60 min, ฿3,300 for 90 min**, published on the venue's site. Tokyo Reporter puts a normal 60-min nuru in Bangkok at ฿2,500–3,500 in 2026, so this sits at the lower end."
      - title: Easy from the Skytrain
        text: "**BTS Asok Exit 6**, then about 5 minutes on foot into Soi 20. You can go between lunch and a 19:00 shift without a taxi."
      - title: Reviewers mention value
        text: "The sister branch on Soi 33/4 has **4.7 from 110 ratings** on Gurulist, where 2025–2026 reviewers call it good value, worth the price, with reasonable prices and attentive staff."
      - title: An upgrade if you want one
        text: "A **Jacuzzi + mattress VIP room** is ฿3,300 for 60 min or ฿3,700 for 90 min: still under what the premium houses charge for a basic session."
  - type: prose
    title: What you give up for the lower price
    dropcap: true
    text: |-
      The ฿2,900 session is the **standard shower room**, not a suite: the Jacuzzi room is a ฿400 upgrade. The site is a menu, a staff gallery and a phone number, with none of the hotel-style finish or long reviews of the top-end houses. A 2026 reviewer of the Soi 33 branch liked it but said **60 minutes feels short** and recommends booking 90 (฿3,300).

      What the menu doesn't say matters too: it lists a +฿1,000 anal add-on under most packages, but not what the base session includes. Ask on LINE before you go, get the total in writing, and pay that at the desk.

      In money terms it is still about **five days of your R$100 "everything else" budget** for one hour. It is the cheapest proper nuru menu we could verify, not a bargain-bin parlour.
