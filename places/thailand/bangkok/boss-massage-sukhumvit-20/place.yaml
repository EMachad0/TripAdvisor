      - { days_before: 0, text: "Message an hour or two ahead to hold a time. Walk-ins aren't ruled out, but the site only gives chat and phone booking." }
      - { days_before: 0, text: "Pay the agreed price at reception; the tip goes to the masseuse at the end." }
