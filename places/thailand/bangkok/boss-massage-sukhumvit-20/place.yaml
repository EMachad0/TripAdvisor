  - type: hero
    image: storefront
    caption: "The Boss Massage 20 shopfront on Sukhumvit Soi 20: frosted glass under a blue sign"
    hook: "Nuru without the hotel-lobby décor: a published ฿2,900 price, a private shower room, the Skytrain round the corner."
  - type: quick_facts
    time_needed: "60–90 min session"
    best_time: "Weekday 13:00–18:00"
    extra:
      - { label: Slot, value: "Weekday afternoon", detail: "Opens 10:00: Tue 5/Wed 6 – Fri 8 Jan before work, or the free Sat 9 Jan" }
