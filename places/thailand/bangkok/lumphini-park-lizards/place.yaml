  - type: highlights
    items:
      - title: The lizards
        text: "Asian water monitors roam the paths and slide into the lake as if they own it. They're shy and used to people, but they're wild: keep your distance."
      - title: Free swan boats
        text: "Swan-shaped pedal boats and canoes on the lake, daily 09:00–16:00, were **free** as of Dec 2025 (one 2026 guide says rental). Ask at the boathouse."
      - title: Free aerobics, if you're lucky
        text: "Sound systems often go up around **17:00** and dozens of people dance along; anyone can join. Not guaranteed: one 2026 guide says classes are occasional, mostly weekends."
      - title: A 1925 park
        text: "Created under King Rama VI on crown land, with his statue at the main gate, a 1925 library and a Chinese-style clock tower."
  - type: prose
    title: Central Park with dinosaurs
    dropcap: true
    text: |-
      Lumphini is Bangkok's big central park: a lake, shaded paths and open lawns, with towers rising on every side. Joggers and tai chi groups take it over at the 04:30 opening. Later in the day it belongs to musicians, stray cats and the monitor lizards, which are the reason most visitors remember it.

      For a work-week traveler it fits the empty hours well. It's free, it's on the MRT, and you can come after lunch, take a pedal boat out before 16:00, watch the lizards along the water, and maybe catch the 17:00 aerobics before heading back to start your shift.
