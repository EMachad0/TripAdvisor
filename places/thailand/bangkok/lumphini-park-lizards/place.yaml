  - type: tips
    variant: insider
    items:
      - "**Your slot: weekday afternoon.** Come after lunch, take a boat before 16:00, stay for the aerobics if they're on, and you're home well before 19:00."
      - "A greenway path links Lumphini to **Benjakitti Park** if you want a longer walk."
  - type: tips
    variant: pitfalls
    items:
