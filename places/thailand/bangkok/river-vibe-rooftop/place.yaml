blocks:
  - type: hero
    image: terrace-sunset
    caption: "Sunset over the Chao Phraya from River Vibe's open roof terrace"
    hook: "Barges sliding past below, the river bending downstream towards Taksin Bridge, and a cold Chang on a hotel roof."
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: "17:30, for sunset"
    extra:
      - { label: Slot, value: "Weekend evening", detail: "Or a weekday sunset if you can be back at your desk by 19:00" }
      - { label: Dress code, value: "None", detail: "No minimum spend" }
  - type: highlights
    items:
      - title: The river right below you
        text: "Eight floors up on the bend of the **Chao Phraya**, with views downriver towards Taksin Bridge (Time Out, 2018). A 2026 guide picks it for best sunset and best photos."
      - title: Rooftop prices without the rooftop markup
        text: "About **฿110 a beer** where the famous sky bars charge several times that. No dress code, no minimum spend."
      - title: A hidden one
        text: "It sits on top of **River View Residence**, a small Talat Noi hotel, and barely advertises on social media, so the crowd is local couples and travelers in the know."
      - title: Talat Noi on the way
        text: "Getting there means a walk through the alleys of Talat Noi, the riverside end of Chinatown. River View was the first hotel in the neighbourhood."
