    note: "Walk in from Song Wat Road along **Trok Vanich 2** (Soi Wanit 2); the bar tops **River View Residence** (ex-River View Guest House). Weekdays only: Orange-flag express boat (**Mon–Fri**) to **Ratchawong pier (N5)**, then a 10-min walk. Lost? Call the hotel: (+66) 99 352 2078."
