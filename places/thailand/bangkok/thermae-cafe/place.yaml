  - type: highlights
    items:
      - title: The other side of Sukhumvit nightlife
        text: "Soi Cowboy and Nana Plaza are go-go bars run by the bar. Thermae is just a **basement bar**: the women are freelancers who work for themselves, sit around the room and wait to be approached (Guest Friendly Hotels Thailand)."
      - title: Cheap, by strip standards
        text: "Beer runs **฿100–150** (Nightdiveer, May 2026; one Google review in Oct 2026 paid ฿130). No cover charge and no stage show."
      - title: An old fixture that's still there
        text: "It still has **4.0 from 1,475 Google reviews**, and one reviewer who says he was a regular 30 years ago wrote in 2026 that it \"hasn't changed a bit\"."
      - title: Easy to fold into a Sukhumvit night
        text: "On Sukhumvit Road at Soi 15, about 5 minutes on foot from BTS Asok or Nana, so it sits between **Soi Cowboy** and **Nana Plaza**."
  - type: prose
    title: What it actually is
    dropcap: true
    text: |-
      Thermae is not a show. You walk down a staircase beside the Ruamchitt Plaza Hotel sign into a basement, buy a drink, and that drink is effectively your entry (Nightdiveer: staying without ordering "is generally not okay"). Reviewers describe a dated room with **no music**, more women than seats, and men doing slow laps around the room. One called the atmosphere "very awkward".

      It works differently from the go-go strips. At **Nana Plaza** or **Soi Cowboy** the women work for the bar: you buy them lady drinks and, to leave with one, pay the bar a **bar fine** (at Nana Plaza: lady drinks ฿150–200, bar fines ฿600–800, per Theo Courant). At Thermae there is neither: the women are freelancers, you approach them and agree everything directly, usually in English. Nightdiveer gives ฿2,000–3,000 for a short stay and ฿5,000–8,000 overnight. Ladyboys tend to wait outside the entrance rather than inside.

      **Legal status:** Wikipedia says selling sex is not itself a crime in Thailand, but the 1996 Prevention and Suppression of Prostitution Act makes public soliciting and running a venue offences; buying sex for yourself isn't punished, and the law is rarely enforced in private places. A bill to repeal the Act still needed the Prime Minister's endorsement in Aug 2026 before it could reach Parliament, so it is **not law** (Pattaya Mail).

      Honest verdict for a watcher: Soi Cowboy is the better sight. Thermae is worth one beer only if you're curious how the freelance side works, and there's nothing to watch except people deciding.
