  - type: tips
    variant: insider
    items:
      - "**Slot: Sat 9 Jan.** It closes at **02:00** (Google Maps), so dropping in after the Fri 8 Jan shift (which ends at 04:00) doesn't work. It's not a fit for Sat 2 or Sun 3 Jan either: you're in Chiang Mai."
      - "Go **22:00–00:00** for the busiest room (Nightdiveer); before 21:00 it's still filling up."
      - "Combine it: Soi Cowboy first for the neon, Thermae for one beer, then Nana Plaza, all on foot along Sukhumvit."
      - "No photos or video inside: reviewers ask for privacy."
  - type: tips
    variant: pitfalls
    items:
      - "**Agree the price and what it covers before you leave the bar** (Guest Friendly Hotels Thailand). Prices vary by person and hour."
      - "**Hostel reality:** the advice is to go to *your own* room, not hers, and some hotels charge a **joiner fee** for a visitor. A dorm bed is not a room, so ask your hostel's rules first."
      - "**Drink spiking** happens in Thai tourist areas, with male and female victims (UK FCDO): don't leave your drink or accept one from a stranger. Comments on the Guest Friendly guide warn of drugged drinks and robbery, so keep your passport and cash locked away."
      - "A ladyboy may approach you outside; Nightdiveer suggests simply asking, and walking off if the answer dodges."
      - "Trouble with a bill or theft? **Tourist Police 1155** (24 h, English)."
