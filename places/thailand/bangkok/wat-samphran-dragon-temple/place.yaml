  - type: highlights
    items:
      - title: Inside the dragon
        text: "The way to the top is a **sweaty concrete tunnel** inside the dragon's body, climbing 16 storeys. There is also a working **lift (฿10)** to the upper floors (The Restless Beans, 2025)."
      - title: A tower nobody explains
        text: "**80 metres** tall and 16 storeys (one guide counts 17). Even its origin is hazy: Bookaway writes that no one seems to know when, by whom or why it was built."
      - title: The strange gardens
        text: "Paths paved with footprints, a giant golden Buddha on a pavilion roof, a house-sized stone **turtle you can walk inside**, and odd statues in the undergrowth."
      - title: Almost no crowds
        text: "Visitors in 2025 found it nearly empty on a weekday afternoon in peak season. Rare for a temple this photogenic."
  - type: prose
    title: Worth the ride?
    dropcap: true
    text: |-
      Wat Samphran is a working temple in flat suburbs 40 km west of Bangkok. The tower is the reason to go: dusty pink in most photos (a 2026 reader comment on The Restless Beans says a 2025 renovation repainted it **bright red**), 80 metres tall, with a green Phaya Naga dragon spiralling from the ground to the roof. Inside, you climb through the dragon itself. The view from the top is of housing and factories; the gardens below are the better surprise.

      The hard part is getting there. There is no direct bus or train. Grab costs about ฿700 each way in 2026, so the day comes to about **244%** of your daily budget. The cheap route (MRT to Lak Song, bus 84, then a 50-minute walk) costs under ฿100 each way but takes up to three hours. Go only if the dragon really grabs you, or split the Grab with someone from the hostel.
