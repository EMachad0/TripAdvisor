  - type: tips
    variant: insider
    items:
      - "**Your slot: weekend day** (Sat Jan 2, Sun Jan 3 or Sat Jan 9), when it's open 06:00–18:00. A weekday works too: leave Bangkok by 11:00 and you're back well before your 19:00 shift."
      - "Find a hostel mate to split the Grab: at two people it drops to about ฿780 (R$129) each, donation included."
      - "For a full shot of the tower without a drone, stand on the raised area of the Big Buddha pavilion next to it."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect a jungle view from the top: the view is flat suburbs, factories and a Tesco."
      - "An unverified report says the upper floors can be **locked on weekdays**. If the top matters to you, go on a weekend."
      - "The public-transport route takes up to three hours each way and ends with a long walk. Only for the very patient."
