  - type: highlights
    items:
      - title: The volcano ribs
        text: "**Leng saap** is a heap of pork spine stacked high in a spicy, lime-sour broth. A medium is ฿180, large ฿250, extra large ฿350, so bring friends to share. Ask for *phet nit noi* if you want it milder."
      - title: Cheap grazing
        text: "Pork skewers and grilled meats run **฿15–40** each and mango sticky rice starts at **฿60**, so a solo dinner of small bites stays near ฿150."
      - title: A market built for drinking
        text: "Beer and cocktails are sold alongside the food, so it works as a first stop before a night out with people from the hostel."
      - title: The easiest night market to reach
        text: "It sits about **100 m from Exit 4** of Thailand Cultural Centre MRT, on level pavement. No taxi needed to get there."
  - type: prose
    title: Which night market?
    dropcap: true
    text: |-
      Jodd Fairs is run by the team behind the old Rod Fai (Train) Night Market. It ran behind Central Rama 9 until the lease ended, then moved up Ratchadaphisek Road: the new site opened in November 2024 and Rama 9 shut for good in January 2025. If a guide or map still sends you to Rama 9, ignore it. There is only one Jodd Fairs now.

      Compared with Yaowarat, Chinatown's old street-food road, this is a purpose-built market with around 800 stalls, food and drinks side by side. Food is priced for visitors, a bit above ordinary street food. Go to Yaowarat for the eating, and to Jodd Fairs for an easy evening with a beer and a crowd.
