    note: "Take **Exit 4** at Thailand Cultural Centre MRT and walk about 100 m. The market is right next to **Big C** on Ratchadaphisek Road."
  - type: tips
    variant: insider
    items:
      - "**Your slot: a weekend night** (Sat 2, Sun 3 or Sat 9 Jan). Arrive at **17:00–18:00**, when stalls open and tables are free; Friday and Saturday peak 20:00–23:00."
      - "On a work day (Mon 4 – Fri 8 Jan, shift from 19:00) it only fits as a short 17:00 early dinner before the shift."
  - type: tips
    variant: pitfalls
    items:
      - "Bring **cash**: Thai QR payment needs a Thai bank account, and Thai ATMs charge foreign cards a fee per withdrawal, so take out enough at once."
      - "The MRT stops around midnight. After that, a Grab or Bolt home is typically ฿150–300."
      - "Crowded lanes attract **pickpockets**: keep your phone in a front pocket."
