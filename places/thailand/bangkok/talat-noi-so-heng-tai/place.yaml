  - type: tips
    variant: insider
    items:
      - "**Your slot: weekday, from late morning** (Tue–Fri). Start around 11:00, finish on Song Wat Road or in Yaowarat, and you're home before 19:00."
      - "If you're in Bangkok on **Sat Jan 2 or Sun Jan 3**, the Talakkia craft market should be on the riverside lawn at Phanurangsi Pier (10:00–18:00)."
  - type: tips
    variant: pitfalls
    items:
      - "**Monday** is the wrong day: So Heng Tai and the best-known café, Hong Sieng Kong, are both closed."
      - "The workshops are real businesses. Don't step inside or stand in their doors for a photo, and keep to the edge of the lanes: motorbikes use them."
