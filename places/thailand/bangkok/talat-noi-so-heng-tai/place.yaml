    extra:
      - { label: Your slot, value: "Weekday, from late morning", detail: "Tue–Fri; done by mid-afternoon, before cafés close" }
      - { label: Respect, value: People live and work here, detail: "Don't block workshop doors; cover shoulders at church" }
  - type: highlights
    items:
      - title: So Heng Tai
        text: "A Hokkien courtyard house over 200 years old, still owned by the same family. In 2004 they put a **scuba-diving pool** in the courtyard. Visit by buying a drink at the café."
      - title: Murals and car parts
        text: "Walls painted since the **2016 Bukruk festival**, around Soi Charoen Krung 22 and the alley to the Rong Kueak shrine, between yards stacked with second-hand engine parts."
      - title: Scrap-metal Transformers
        text: "Hia Seng, who has traded car parts here since he was 14, welds leftovers into life-size robots: **Bumblebee, Optimus Prime and Megatron** stand on nearby corners."
      - title: Shrines, a church and a bank
        text: "The Chow Sue Kong shrine (1804), the Gothic **Holy Rosary Church** (1891–97) and the riverside Siam Commercial Bank branch, Thailand's oldest, opened in 1908."
  - type: prose
    title: The other Chinatown
    dropcap: true
    text: |-
      Talat Noi means "small market", but there's no real market here. It's a few riverside lanes just south of Yaowarat where Chinese craftsmen settled. For about 70 years the area has been Bangkok's centre for refurbishing second-hand car parts, and the workshops are still running. Coffee bars have opened in between: one, Mother Roaster, sits up a staircase above a junkyard of engine parts.

      It's free, small and flat, and two or three hours are enough. That makes it an easy weekday outing before your 19:00 shift. Walk in from Hua Lamphong MRT or arrive by express boat, go round the lanes, then walk north to Yaowarat as the street food comes out.
