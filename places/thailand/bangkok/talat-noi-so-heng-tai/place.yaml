    image: rong-kueak-shrine
    hook: "Old Bangkok that never got polished: engine blocks on the pavement, murals overhead, shrines on the river."
    caption: "The Rong Kueak shrine on the river, Talat Noi"
  - type: quick_facts
    time_needed: 2–3 h
