blocks:
  - type: hero
    hook: "No ticket, no tourists' section: just a TV studio packed to the ceiling and a crowd betting on every round."
  - type: quick_facts
    time_needed: 2.5–3 h
    best_time: "Sun 3 Jan, by 13:30"
    extra:
      - { label: Slot, value: Weekend day, detail: "Sun 3 Jan afternoon; you're free again by 17:00" }
      - { label: Dress code, value: "Collared shirt", detail: "Long trousers, closed shoes; no T-shirts, shorts, sandals" }
  - type: highlights
    items:
      - title: Free, and it's the real thing
        text: "This is the studio for **Suek Muay Thai 7 Si**, a live TV fight show that a 2026 guide says still holds a **top-10 spot** in Thai TV ratings, and entry costs nothing."
      - title: Traditional five-round fights
        text: "Channel 7 has stuck to **five-round** traditional Muay Thai: the wai kru dance, the live music and the betting, not the three-round tourist format."
      - title: Ringside if you're early
        text: "Foreigners who arrive early enough can sit **ringside**, in shot of the live broadcast. Latecomers stand in the bleachers among the gamblers."
      - title: Pairs with Chatuchak
        text: "The stadium is about **1.2 km** from Chatuchak Weekend Market, which is open the same Sunday."
  - type: prose
    title: How it works
    dropcap: true
    text: |-
      It's more of a studio than a stadium. The show goes out live on Thai TV every Sunday afternoon. Because entry is free, it fills up fast with Thai fans and gamblers, and it feels, as one guide puts it, like it "breaks every fire code".

      Only the **first 500** people get in. Arriving **30 minutes early** should get you in; about **an hour early** gets you a ringside seat. Once you're in the standing bleachers you're pinned shoulder to shoulder until the show ends, so use the bathroom first. Bring nothing in a plastic or glass bottle: security holds them until the end.
  - type: quote
    variant: vibe
    text: "Two hours of shouting odds, drumming and elbows, and it costs nothing."
  - type: map
    note: "From **BTS Mo Chit** it's about 700 m, a 15-minute walk. Food stalls line the road outside, and there's little to eat inside."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend day.** Sunday 3 Jan is your only free Sunday. Morning at Chatuchak, fights at 14:30, and you're done before dark."
      - "Fill up at the street stalls outside first. Inside there is water but little food."
  - type: tips
    variant: pitfalls
    items:
      - "**Dress code:** a **collared shirt** (no T-shirts), long trousers and closed shoes. Both fight guides say you can be turned away otherwise; pack a polo."
      - "Never rest your feet on chairs or railings, and don't throw anything towards the ring."
  - type: weather
    temp_low_c: 23
    temp_high_c: 33
    conditions: "Dry season: sunny, hot early afternoon"
    note: "The walk from the BTS is at the hottest time of day, and long trousers make it warmer. Inside, the packed studio is hot."
    wear: "Collared shirt (polo is fine), light long trousers, closed shoes"
