  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** a grey area under the 1996 Prostitution Act. Clients are rarely charged, but foreign clients have been caught in raids (Wikipedia). An NGO gave the House a draft bill to repeal the Act on 28 May 2026; it is not law (Khaosod)."
      - "Book only via the LINE, WhatsApp or number on **sentobkk.com** (+66 64 253 7196)."
      - "Recording is banned, and the masseuse can end the session with no refund if you push for anything off the list (guidelines and terms)."
      - "The tip isn't on the menu. Tokyo Reporter (2026) says ฿500–1,000 to the masseuse is customary at nuru houses; decide yours beforehand."
