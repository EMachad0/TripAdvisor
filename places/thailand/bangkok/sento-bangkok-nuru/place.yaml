  - type: hero
    image: ekkamai-corner
    caption: "Ekkamai Road at Sukhumvit, about 2 km south of the spa; no free photo of the venue"
    hook: "Sento is Japanese for public bathhouse; this one is private rooms only, a taxi ride up a quiet Ekkamai Road."
