      - { label: Shortest session, value: "80 min", detail: "Typical Bangkok sessions are 60 min (Tokyo Reporter)" }
      - { label: Included, value: "Shower, towels, tea", detail: "Room upgrades extra: deluxe +฿500, Jacuzzi +฿1,000" }
  - type: highlights
    items:
      - title: Longer sessions by default
        text: "Every treatment is **80 or 120 minutes**, with shower, towels, tea and \"unhurried preparation time\" before and after, per the menu. Tokyo Reporter prices a typical Bangkok session at 60 minutes."
      - title: Three room types
        text: "A standard room with an air mattress and queen bed, a **deluxe room with its own soaking tub** (+฿500) and a **VIP room with a private Jacuzzi** (+฿1,000)."
      - title: Few guests at a time
        text: "The FAQ says it keeps only **a few appointments a day** so no two guests overlap, with separate entrances, and claims every masseuse has **regular medical blood tests**."
      - title: Reviewed as a step up
        text: "**4.9 from 148 Google reviews**, the newest weeks old (Nov 2026). Among the reviews the site quotes, a Japanese guest compared it with Tokyo at about a quarter of the price; one guest says it made places he'd tried before feel poor."
  - type: prose
    title: What the premium buys, and what to check
    dropcap: true
    text: |-
      Tokyo Reporter (Aug 2026) puts a typical 60-minute nuru in Bangkok at **฿2,500–3,500**. SENTO's cheapest booking is ฿3,500, but for **80 minutes**, and its popular tier is ฿4,500. You are paying for time, a quieter address away from the Sukhumvit strips, and a house that limits how many guests it sees.

      The site is vaguer than the price list suggests. It names three tiers (Whisper, Soft Touch, Imperial Touch) with one-line descriptions, but doesn't say concretely what changes between them, so **ask on LINE what each includes** before choosing. Its guidelines page lists the services offered, and some are done **without a condom**: an STI risk to weigh, and a reason to ask.

      Eighty minutes at ฿4,500 is about **R$757, more than seven days of your R$100 "everything else" budget**, plus a taxi each way. Worth it only as a one-off.
