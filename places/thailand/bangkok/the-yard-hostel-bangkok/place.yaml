  - type: prose
    title: Why this one for the work week
    text: |-
      I compared three hostels outside Khao San for working São Paulo hours (19:00–04:00 in Bangkok). **Luk Hostel** in Chinatown has a dedicated air-conditioned coworking space and a great location, but its reception closes from midnight to 06:00 and recent reviews say plainly it is *not* a social hostel (atmosphere 7.6). **Kinnon Deluxe Hostel Coworking Cafe** on Silom Soi 6 is built around a coworking café and Booking guests rate its Wi-Fi "superb", but it has fewer reviews and I found no social events listed for it.

      **The Yard** wins on what the rest of the week needs: you sleep through the morning in a curtained bunk, eat a free breakfast, and spend the afternoon with people who are actually there to meet others, in **Ari**, which the owners describe as peaceful, creative and full of local life, rather than a backpacker strip. The trade-off: no coworking room is listed, so check with the hostel where you can sit with a laptop at night. If the answer is "nowhere quiet", Kinnon is the Plan B.
