  - type: highlights
    items:
      - title: Bigger and denser than Soi Cowboy
        text: "Soi Cowboy is one open 150 m lane. Nana is a **closed, U-shaped building** with about 30 go-go bars on three floors round a courtyard of beer bars, so the bars are stacked, not lined up."
      - title: The most varied of the three strips
        text: "Ground-floor beer bars, go-go bars upstairs, a rooftop bar (Billboard), and the city's **biggest choice of ladyboy bars**. A new ladyboy go-go (Rainbow 2) is due to reopen in late November 2026."
      - title: Watch from the courtyard
        text: "The ground-floor beer bars are where the pressure is lowest: sit with one drink and look up at three floors of neon. You don't need to climb the stairs at all."
      - title: Changing as you read
        text: "A November 2026 report has bars changing hands, two bars being knocked into one, and a rename (Mandarin is now Red Dragon). It started as a shopping centre in 1983."
  - type: prose
    title: Nana or Soi Cowboy?
    dropcap: true
    text: |-
      You have **one free night in Bangkok, Saturday 9 January**: you arrive around Tue 5 or Wed 6 Jan, every weeknight is a work night from 19:00 to 04:00, and the weekend of 2–3 January is in Chiang Mai. So this is a one-shot plan.

      If you only do one, the 2026 guides point to **Soi Cowboy**: Southeast Asia Simplified calls it "smaller and easier", the gentler first look, while khaosanroad.com sums up Nana as "people-watching on hard mode". Soi Cowboy is an open street you can walk through and leave. At Nana, hostesses work the stairwells between floors and the enclosed courtyard makes the drink pitch harder to avoid. Pick Nana instead if you are going with people from your hostel and want the bigger, more varied version, ladyboy bars included.

      You don't have to choose: they are **one BTS stop apart** (Nana to Asok). Do Nana first at happy hour, around 20:30, then ride one stop to Soi Cowboy before 22:00. Your flight to Singapore is the next afternoon.

      Inside a go-go bar, staff will suggest a **lady drink**, a drink you buy for a hostess. It is optional and saying no is normal. You will also see **bar fines** on price boards: a fee paid to the bar (from about ฿600, sometimes over ฿1,000) so a staff member can leave work early with a customer. A watcher never pays one.
