  - type: tips
    variant: insider
    items:
      - "**Slot: Sat 9 Jan**, your only free night in Bangkok."
      - "Go at **20:30**: happy-hour beers (฿99–110 at some bars until 23:00) and room to sit before the 22:00 crowd."
      - "Not Soi Nana in Chinatown: tell drivers **Nana Plaza, Sukhumvit Soi 4**."
  - type: tips
    variant: pitfalls
    items:
      - "**No photos or video anywhere in the plaza**, not just inside the bars. Signs are posted and bags have been checked at the gate; one 2026 guide says trying will cause \"a direct confrontation\". Take your photo of the entrance sign from Soi 4."
      - "Anyone outside offering **\"free drinks\" or a \"special show\"** is running a scam; Thai Holiday Guide reports bills of **฿5,000–20,000**. Don't follow anyone \"somewhere better\"."
      - "Soi 4 outside the plaza has street sex work and police sweeps (e.g. 15 detained on 28 May 2025). Say no firmly and keep walking."
      - "Trouble with a bill? Call the **Tourist Police on 1155** (24 h, English)."
