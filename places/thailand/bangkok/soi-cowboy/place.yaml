  - type: highlights
    items:
      - title: The photogenic one
        text: "Of Bangkok's three foreigner-oriented bar strips (with Patpong and Nana), Soi Cowboy is the **short, neon-lit** one: a 150 m lane you can walk end to end in a few minutes."
      - title: Easy to reach, easy to leave
        text: "**2 minutes from BTS Asok and MRT Sukhumvit**, so you can drop in for an hour and be back on the train before midnight."
      - title: Watch from an open bar
        text: "The open-front beer bars let you sit with one drink and watch the street, with full view and an easy exit. No need to go inside a go-go bar at all."
      - title: Named after a man in a hat
        text: "A retired US airman, T. G. \"Cowboy\" Edwards, opened one of the first bars here in **1977**. Bridget Jones 2 and *Bangkok Dangerous* filmed scenes on the street."
  - type: prose
    title: How to do it as a watcher
    dropcap: true
    text: |-
      Go with people from your hostel. Walk the lane once from the Asok Montri end to Soi 23 and back. Then pick an **open-front bar with a price board outside** and have one beer at a table facing the street. That's the whole experience, and it costs about R$33.

      Inside a go-go bar, staff will sit next to you and suggest a **lady drink**: a drink you buy for a hostess, priced above your own. Saying no is normal. One 2026 guide calls Soi Cowboy fairly straightforward, with staff who rarely push. The "free drinks, special show" bill scams are reported around Patpong and Nana Plaza, a three-floor plaza where you should expect the lady-drink pitch.

      Treat it as a nightlife sight, not a show put on for you: the people working here are not part of the décor, so don't point your phone at them.
