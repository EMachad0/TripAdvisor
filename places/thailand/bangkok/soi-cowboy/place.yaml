  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night.** Sat 2, Sun 3 or Sat 9 Jan."
      - "Happy hour (around 19:00–20:30 at some bars) is the cheapest time to sit down, before the street fills."
      - "Shorts are fine, but some bars frown on singlets and flip-flops."
  - type: tips
    variant: pitfalls
    items:
      - "Anyone outside offering **\"free drinks\" or a \"special show\"** is running a scam; Thai Holiday Guide reports bills of **฿5,000–20,000**."
      - "Confirm drink prices before ordering and check the bill: a cover charge or extra lady drinks can appear on it."
      - "Photography inside bars is often not allowed; take your neon photos from the street."
      - "Trouble with a bill? Call the **Tourist Police on 1155** (24 h, English)."
