  - type: map
    note: "No train station is close. Take a taxi or Grab to **Nang Loeng Market, Nakhon Sawan Road**, or ride the Saen Saep canal boat to **Phan Fa Bridge** and walk 10–15 minutes."
  - type: tips
    variant: insider
    items:
      - "Come **Monday to Saturday**: several of the best stalls (Monta's, Mae Lek's) don't open on Sundays."
      - "Mae Lek's pla naem is only sold **10:30–14:30**, so plan your arrival around it."
      - "Most stalls sell by the box, so you can take sweets away for later."
  - type: tips
    variant: pitfalls
    items:
      - "Don't come late afternoon: many vendors close after lunch, well before the official 15:00."
      - "Hours can change on Thai public holidays, so don't plan your only visit for one."
