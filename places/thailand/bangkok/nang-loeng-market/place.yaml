    image: market-hall
    caption: "Under Nang Loeng's tin roof: snacks laid out in trays and fruit stacked along the aisle"
    hook: "Grandmother recipes under a tin roof: curries ladled from trays, sweets steamed in tiny cups, lunch over by three."
  - type: quick_facts
    time_needed: 1–2 h
    best_time: Mon–Sat, late morning
    extra:
      - { label: Entry, value: Free, detail: You pay only for what you eat }
      - { label: Opened, value: 29 March 1900, detail: "By King Rama V, as Thailand's first land market" }
  - type: highlights
    items:
      - title: The first market on land
        text: "King Rama V opened Nang Loeng in **1900** as Thailand's first market built on land rather than on the water. The neighbourhood around it is even older."
      - title: Twenty curries on one corner
        text: "**Khao Gaeng Rattana** lays out 20 to 30 curries over rice. Try the roasted eggplant salad or the mackerel and lotus-stem curry."
      - title: Old-style sweets for ฿12–45
        text: "Monta's coconut cups (**฿35 a box**, over 1,000 cups a day), shrimp-filled toa paeb (฿45) and khanom tian (฿12 a piece)."
      - title: A 70-year-old stall
        text: "Mae Lek has sold **pla naem** sets at the market for more than 70 years: ฿50 a set, late morning to early afternoon only."
  - type: prose
    title: Lunch, not dinner
    dropcap: true
    text: |-
      Most visitors to Bangkok eat at night markets. Nang Loeng works the other way round: it is a daytime market, best before noon. Arrive mid-morning, graze for an hour, and you are out before the stalls pack up after lunch.

      The neighbourhood has history beyond the food. The community here goes back more than 200 years, and the market's old **Sala Chaloem Thani** cinema was built in 1918 and closed in 1993. It is about a 10-minute walk from Democracy Monument, so it fits easily into an old-town morning.

      It is also very cheap. Almost everything sells by the box or the set for ฿12–50, so ฿100–150 buys a proper tasting lunch.
