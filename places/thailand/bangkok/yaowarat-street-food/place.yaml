    note: "From **Wat Mangkon MRT, Exit 1**, you are on Yaowarat Road in about two minutes. Hua Lamphong MRT is about a 15-minute walk away."
  - type: tips
    variant: insider
    items:
      - "Do Jek Pui's curry rice at around **17:00**, then walk the main road as the night stalls open. That's two meals for under ฿100."
      - "Soi Texas and the Phadung Dao corner are where the most stalls are packed together."
      - "Famous stalls start running out of ingredients by about 23:00, so don't leave it late."
  - type: tips
    variant: pitfalls
    items:
      - "**Monday** is the wrong night: many stalls, Pa Tong Go and Ouan Pochana among them, are closed."
      - "Bird's nest soup runs ฿200–500 a bowl. It is a splurge, not the street food you came for."
