  - type: highlights
    items:
      - title: Rolled-noodle soup since 1960
        text: "**Nai Ek Roll Noodles** has served guay jub, rolled rice noodles in a peppery pork broth, since 1960. Three bowl sizes run ฿50, ฿80 and ฿100."
      - title: Charcoal doughnuts
        text: "**Pa Tong Go Savoey** (since 1968) fries Chinese doughnuts in the evening, about ฿50 for five pieces. It closes on Mondays."
      - title: The seafood corner
        text: "**T&K Seafood**, at the Phadung Dao corner, grills river prawns and fries crab in yellow curry. Staff wear green shirts, and most dishes are ฿200–350 a person."
      - title: Cheap curry before dark
        text: "**Jek Pui** serves curry over rice from mid-afternoon to early evening. A plate costs ฿40, or ฿60 for a big one. Get there before the night stalls even open."
  - type: prose
    title: How to eat it
    dropcap: true
    text: |-
      Yaowarat Road is Bangkok's Chinatown, and from about 17:00 the pavements fill with carts and folding tables. The best stalls are spread along the main road and its side sois (Phadung Dao, Soi Texas), so think of it as a walk with five or six small stops, not one big meal.

      The cheap way is to share nothing and order small: a ฿50 bowl here, a ฿50 bag of doughnuts there, a pomegranate juice from a cart. That fills you for under ฿200. Seafood tables are the splurge, and still cost less than a hotel bar.

      About the Michelin stickers: several stalls here are or were in the Bib Gourmand list, but the list changes every year. Nai Ek had the award in 2018 and 2019. Ouan Pochana had it in earlier editions but is not on the 2026 or 2027 lists. Treat the sticker as history, not a guarantee.
