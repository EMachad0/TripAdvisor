blocks:
  - type: hero
    image: view-temple-roof
    focus: "50% 50%"
    caption: "Wat Saket's halls seen from the top of the Golden Mount"
    hook: "Bangkok's only hill is man-made, and from its golden top the old town spreads out in tiled roofs."
  - type: quick_facts
    time_needed: 1–1.5 h
    best_time: Late afternoon, up before sunset
    extra:
      - { label: Your slot, value: Weekday afternoon, detail: "Closes 19:00; Khao San is a 20 min walk back" }
      - { label: The climb, value: "344 steps, 10–20 min", detail: "No lift; shaded rest spots on the way" }
      - { label: Dress code, value: Shoulders + knees covered }
  - type: highlights
    items:
      - title: The spiral climb
        text: "**344 steps** wind up the 77 m hill past hanging bells, gongs and small shrines. It takes 10–20 minutes at an easy pace."
      - title: The old town from above
        text: "The terrace around the gold chedi gives the widest view over **old Bangkok** and its temple roofs, often with a cool breeze."
      - title: A hill from a failed chedi
        text: "The hill is what was left when a great chedi begun under **Rama III** collapsed on the soft ground. Locals still come to pray at the top."
      - title: Cheap and close
        text: "At ฿100 it costs a tenth of a skyscraper deck ticket, and it is 20 minutes on foot from **Khao San Road**."
  - type: prose
    title: The budget skyline
    dropcap: true
    text: |-
      Bangkok's towers charge ฿1,000 and more to look down on the city. This hill costs ฿100 and shows the part of Bangkok you came for: the gold and orange roofs of the old town. Go in the **late afternoon**, when the heat drops and the light turns, and watch the temple lights come on as you walk down.

      It fits a work week well. The gate is open until 19:00 and Khao San is a 20-minute walk away, so you can catch the light at the top and still be at a laptop for a 19:00 start if you leave promptly.
