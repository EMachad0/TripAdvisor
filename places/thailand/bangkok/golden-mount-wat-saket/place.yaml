  - type: map
    note: "The canal boat ends at **Panfa Leelard pier** behind Mahakan Fort, 5–10 min away. MRT Sam Yot is about 15 min on foot."
  - type: tips
    variant: insider
    items:
      - "**Slot:** weekday afternoon. Arrive around 16:30 for the softer light; the gate shuts at 19:00."
      - "Bring small notes: the ticket desk at the foot of the stairs takes cash."
      - "The Saen Saep canal boat (฿15–25 by distance) is a fast, local way here from the east of the city."
  - type: tips
    variant: pitfalls
    items:
      - "No lift and no shortcut: 344 steps up and down. Not for bad knees."
      - "It is an active temple: cover shoulders and knees, and keep your voice down at the chedi."
