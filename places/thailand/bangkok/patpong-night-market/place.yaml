  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night.** Sat 2, Sun 3 or Sat 9 Jan."
      - "Haggle at the stalls; Thaiest says it's souvenirs you can find anywhere, so don't pay first prices."
      - "Foodland supermarket on Patpong has cheap drinks and snacks."
      - "The **Patpong Museum** that older blogs recommend **closed in 2023**."
  - type: tips
    variant: pitfalls
    items:
      - "**Ignore anyone whispering \"ping pong show\"** or offering free drinks; it's the classic scam here."
      - "Ask the price before you sit, pay per round, and refuse any charge that wasn't on a posted board."
      - "If a bar won't let you leave over a bill, call the **Tourist Police on 1155** (24 h, English)."
