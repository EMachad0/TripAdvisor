  - type: highlights
    items:
      - title: Where Bangkok's bar scene began
        text: "Patpong's first go-go bar, the **Grand Prix**, opened in **1967**; the strip became an R&R stop for US officers during the Vietnam War, and *The Deer Hunter* used it to stand in for Saigon."
      - title: A market down the middle
        text: "Since the early 1990s the owning family has rented the pavement to **souvenir stalls**, so you walk between T-shirts and knock-off bags with bar doors on both sides. It's the easiest strip to see if Soi Cowboy feels like too much."
      - title: Private streets, a family name
        text: "The Patpongpanich family, Hainanese immigrants, bought the plot (a canal and a teak house) in **1946** and built the roads. Patpong 1 and 2 are still private."
      - title: Three scenes in one block
        text: "Patpong 1 and 2 for go-go bars, **Silom Soi 4** next door for open terraces and the gay scene (DJ Station is nearby), and Thaniya for Japanese hostess bars."
  - type: prose
    title: The ping-pong menu, decoded
    dropcap: true
    text: |-
      On both Patpong lanes a tout will hold up a small laminated menu: a list of "shows" with cheap drink prices. The prices are there to lure you in (Théo Courant, 2024). Thai Holiday Guide warns that "free drinks" and "special shows" offered outside Patpong end in bills of **฿5,000–20,000** (R$835–3,340). A 2012 first-hand account has three Diet Cokes, quoted at ฿100 each, billed at ฿1,800 because of a ฿600-a-head **"entertainment" charge** nobody mentioned.

      So the rule is simple: **don't follow a tout anywhere**, and only sit where you can see a price board. At an ordinary bar on the strip a beer is about ฿150–200.

      Done properly, Patpong is an hour of browsing the market, a look down the lanes, a drink at a street-level bar or on Silom Soi 4, and street food on Silom Road on the way back to the BTS.
