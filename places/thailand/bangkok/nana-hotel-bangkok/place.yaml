  - type: tips
    variant: insider
    items:
      - "Compare on Google Hotels before booking: for 6 Jan the same room ran from ฿1,540 (Klook) to ฿1,878 (Trip.com)."
      - "If the official 14:00 check-out holds (one Agoda guest in Feb 2025 got it), a 04:00 shift finish leaves you a full morning's sleep. Confirm it at check-in; Agoda and Trip.com say 12:00."
      - "Nana Plaza is opposite the door: see its own page for the walk-through and its scam warnings."
  - type: tips
    variant: pitfalls
    items:
      - "**Smoking rooms everywhere.** Agoda lists no non-smoking rooms or floors. Smell the room at check-in and ask to move if needed."
      - "Nightlife noise is the complaint Trip.com's review summary names first (42 reviews). Ask for a high floor."
      - "Don't expect hostel company: if you want people to go out with on Sat 9 Jan, a hostel night is the better bet."
