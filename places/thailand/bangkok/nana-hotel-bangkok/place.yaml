    social:
      - "**Not social.** A big old hotel (334 rooms on Agoda) with no hostel bar or events. You meet people at the pool bar or across the street, not through the hotel."
      - "Agoda's review summary: nightlife around Nana Plaza \"suits guests who want bars and adult entertainment\" (105 mentions, 96% positive)."
    good_to_know:
      - "**Guests:** Tripadvisor travellers say no joiner fee; a visitor leaves ID at the security desk by the lifts. Not a hotel statement, and over a year old."
      - "**Smoking:** Agoda says every room allows smoking and there are no non-smoking floors. A Google reviewer's room smelled of smoke; they changed rooms on request."
      - "**Noise:** Trip.com's summary counts 42 reviews on nightlife noise; Agoda's says renovated rooms feel quiet. A 2025 guest: it \"stays lively until morning\"."
      - "**No deposit** required (Trip.com). Main guest 18+. In-room safe, fridge and daily bottled water (official site)."
      - "**Dated:** Agoda room comfort 6.5/10; a Trip.com review (Jul 2026) calls it \"a little dated\". A 2025 Agoda guest praised a renovated 11th-floor room."
      - "**Hold rule:** give your arrival time when booking; without it the official site holds the room only until 18:00–19:00."
  - type: highlights
    items:
      - title: A real pool, big for Sukhumvit
        text: "The official site lists a **126 m² outdoor pool** with a waterfall, a jacuzzi garden and a pool bar. Agoda's review summary praises its size, sunbeds and shade; 92% of 159 pool mentions are positive."
      - title: Breakfast in the price
        text: "The official rates include a **buffet breakfast** for internet bookings, and Agoda's and Trip.com's offers for your dates include it. Bought alone it is ฿250 (Agoda)."
      - title: Five minutes to the BTS
        text: "**BTS Nana is 300 m** away (Agoda). One stop east is Asok for Terminal 21 and Soi Cowboy; one stop west is Phloen Chit (Wikipedia)."
      - title: Nana Plaza across the road
        text: "Agoda puts Nana Plaza **across the street**; Trip.com says 40 m. Your red-light-district walk is a crossing, and the walk home is too."
  - type: prose
    title: Why a hotel, and why this one
    text: |-
      This is not what the traveler usually wants: no dorms, no family dinner, no pub crawl. It is on the list for one reason, your **work week** (19:00–04:00 shifts, Mon 4 – Fri 8 Jan). After a shift you sleep through the morning, and in a dorm that is when roommates pack up for check-out. Here you get a private room, a pool for the afternoon and breakfast included.

      It costs about **two and a half times a hostel bed**: ฿1,538–1,614 a night for 6–9 Jan against ฿599 for a dorm bed at Lub d Siam (Hostelworld, same dates). Four nights, Wed 6 to Sun 10 Jan, come to ฿6,288 (about R$1,064) at the cheapest offers. Lub d's own private room was ฿1,571 on Sat 9 Jan, about the same price, but with a shared bathroom and no pool. Agoda and Trip.com score it 7.9 and 8.3, both good for location and weak on room comfort. It opened in **1963** (official site) and still looks it in places.

      The hotel's fame comes from its street. The photographer of the Commons photos on this page captions it "maybe the most well-known prostitution hotel in the world", and Tripadvisor answers say a visitor just leaves ID at the lift. If that is not your plan, it is still a pool hotel 5 minutes from the BTS.
