      - { label: Bring, value: "Passport, 21+", detail: "A photo of your ID is accepted (official FAQ)" }
  - type: highlights
    items:
      - title: A club, not a bar strip
        text: "One big venue with a **Live Zone** stage (bands nightly 22:00–03:00, DJs Fri–Sat), VIP sofas, private rooms with karaoke and a pool zone. It has run since **2011** and moved to Pracha Uthit Road in 2012."
      - title: You pay for time, not lady drinks
        text: "The official site says hostesses share your bottle instead of ordering lady drinks: you pay for **her time**. A PR girl is ฿2,000 for the 1st hour, a dancer, bikini model or \"PIMP Cat\" ฿3,000, then ฿1,000 per extra hour each."
      - title: Over 200 women a night
        text: "The venue claims **200+** party models nightly in four types, assigned by a **VIP host** who asks what you like. Its lingerie-clad \"PIMP Cats\" do the stage shows."
      - title: Solo packages
        text: "Solo guests are welcome. The cheapest package, **HUSTLER**, is ฿8,250 for 3 hours with one model and 3 litres of Heineken draft; **TRIGGER** swaps the beer for a bottle at ฿12,000."
  - type: gallery
    images:
      - { file: stage-show, caption: "A singer and costumed dancers on the Live Zone stage (venue photo)" }
      - { file: party-room, caption: "One of the private party rooms with sofas and a stage (venue photo)" }
  - type: prose
    title: How it compares to Nana Plaza and Soi Cowboy
    dropcap: true
    text: |-
      At **Nana Plaza** or **Soi Cowboy** you walk in free, a beer is about ฿150–200 and a lady drink about the same (2026 prices), so an hour of watching costs a few hundred baht. The Pimp works the other way round: there's no door fee, but sitting down at all means a **฿3,000 minimum spend** per person, and the company is billed by the hour. It's a private-party club for groups with a budget, far from Sukhumvit, not a strip you wander through.

      The official site says it is **not a brothel** and doesn't send models out; after closing you can invite one to carry on the party, and whether she comes is up to her. No bar fine or off fee is published. Wikipedia notes that the 1996 Prostitution Act makes soliciting and running sex work illegal, which is why venues word it this way.

      For your budget this is a hard sell. ฿3,000 (about R$508) is five days of your "everything else" money in Thailand, and a realistic night with one hostess is ฿8,000–11,000 (R$1,400–1,900). Go only if a Thai hostess club is the one splurge you want; Nana Plaza and Soi Cowboy show you Bangkok's adult nightlife for a small fraction of that.
