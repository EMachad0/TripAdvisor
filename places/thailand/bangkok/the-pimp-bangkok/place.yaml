    image: live-zone
    caption: "The Live Zone on a band night: the PIMP sign over the stage, tables packed below (venue photo)"
    hook: "Live bands under gold and black, a VIP host who brings the women to your table, and a meter that runs by the hour."
  - type: quick_facts
