  - type: tips
    variant: insider
    items:
      - "**Slot: Sat 9 Jan**, your only free Bangkok night. The bands start at 22:00."
      - "From the Nana area it is about 6 km in a straight line (our measurement); the venue says 12 minutes from upper Sukhumvit. Check the fare in the Grab app before you book it."
      - "Solo, the **HUSTLER** package (฿8,250) is the cheapest way to have company; it fixes the price for 3 hours."
      - "Dress code is casual per the FAQ, and women are welcome too, so a mixed hostel group can go."
  - type: tips
    variant: pitfalls
    items:
      - "**The meter runs per woman, per hour.** Every hostess you invite adds ฿2,000–3,000 for the first hour and ฿1,000 each hour after. Agree who sits with you and for how long before they sit down."
      - "Anything not in your package is **added to the bill** (official). The FAQ even recommends that non-drinkers \"open a bottle for the girls\"."
      - "Check the bill line by line: the venue's own worked example lists items adding to ฿11,000 but prints ฿10,500. Card charges show as **PBK**."
      - "No independent recent review was found: Google's 4.4 (408 reviews; Visit Thailand Today shows the same) shows short, glowing posts with owner replies. The site's \"Top Gentlemen's Club in Thailand\" award is its own claim."
