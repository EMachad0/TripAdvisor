  - type: map
    note: "Take the MRT Blue Line to **Kamphaeng Phet** for the western sections, or **Chatuchak Park** / BTS **Mo Chit** for the southern corner. Skip the taxi."
  - type: tips
    variant: insider
    items:
      - "**Your slot: weekend day.** Sun Jan 3 is the easy pick. On Sat Jan 9 (expected Children's Day) more families will be out across the city."
      - "Pair it with **Or Tor Kor** across the road for lunch, and **Jodd Fairs** on the same MRT line in the evening."
      - "Lost? Head for the **clock tower** in the centre; it's visible from most lanes."
  - type: tips
    variant: pitfalls
    items:
      - "Don't come Monday–Friday daytime expecting the full market: only plants trade Wed–Thu, and Friday night is wholesale."
      - "Noon under the tin roofs is the hardest part of the day. Shop early, then go somewhere air-conditioned."
