  - type: highlights
    items:
      - title: Too big to finish
        text: "More than **15,000 stalls** on about 35 hectares, and some 200,000 visitors every weekend. Here since 1982, after starting at Sanam Luang in 1942."
      - title: Sections, not chaos
        text: "27 numbered sections: antiques and art in 1, 7 and 26, handicrafts in 8–11, books in 1 and 27, food in 2–4 and 23–27. There's a map near the entrance."
      - title: Plants, and air-con next door
        text: "Sections 3–4 are **Bangkok's largest flower market**, orchids to bonsai. When the heat wins, **JJ Mall** next door has air-con, home goods, fabrics and a food court."
      - title: Street food as you go
        text: "Grilled skewers, fresh fruit and soft-serve between the stalls. A big pan of paella at Viva 8 costs about **฿160**."
  - type: prose
    title: How to do it on a budget
    dropcap: true
    text: |-
      Chatuchak is free to enter, so the only cost is what you carry out. It's a good place to buy the things a backpacker needs anyway: elephant pants, a rattan bag, small gifts to take home. Haggling is normal.

      It's also tiring. The lanes are covered with corrugated roofs, and by noon the heat under them is draining. Come at opening, do three hours, eat, and go. On Wednesday and Thursday only the plant section opens, and on Friday night only wholesalers trade, a much smaller market than people expect. On a weekday afternoon, go to Or Tor Kor across the road instead.
