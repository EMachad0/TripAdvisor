  - type: tips
    variant: insider
    items:
      - "Eat in the food court, then buy **one** sealed durian tray to try. That's the cheap way to taste the premium fruit."
      - "Weekends get crowded. Come on a weekday morning to look around in peace."
  - type: tips
    variant: pitfalls
    items:
      - "Fruit here costs much more than at an ordinary market. Don't buy your daily fruit here, buy it on the street."
      - "Each stall keeps its own hours, so a late-afternoon visit can find some already shut. Come for lunch."
