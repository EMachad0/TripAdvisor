  - type: highlights
    items:
      - title: The food court
        text: "The cooked-food hall sells curries, rice dishes, soups and grilled chicken. Roast duck on rice costs **฿60**, or ฿80 for a large plate."
      - title: Fruit on display
        text: "The fruit is the main attraction, and durian (main season is April–August, so less of it in January) comes **pre-portioned in sealed trays**, so you can try it without buying a whole fruit."
      - title: A ranked market
        text: "In 2017 CNN listed it among the **world's top 10 fresh markets**. It is a clean, orderly hall, not a muddy wet market."
      - title: One stop on the MRT
        text: "Exit 3 of Kamphaeng Phet station comes up beside the market. Pair it with a Chatuchak weekend morning."
