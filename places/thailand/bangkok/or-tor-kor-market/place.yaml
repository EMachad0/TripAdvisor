  - type: prose
    title: Why a market earns a day
    dropcap: true
    text: |-
      Or Tor Kor is a showcase for Thai produce: fruit and fresh ingredients sorted, labelled and priced. It is run by the Marketing Organization for Farmers, a state agency, and has traded here since 1974.

      The budget trick is to eat lunch, not shop. Food court plates cost about what you'd pay anywhere in the city, a little more than a street stall. The fruit is the premium part: a 2017 comparison found mangosteen here at about ฿250 a kilo against ฿100 at an ordinary market. Buy one portion to taste, not a bag.
