    items:
      - "Go after **15:00**: the official FAQ says the 3rd-floor Modeling Lobby opens then, the 2nd-floor \"Venus Showcase\" at 13:00."
      - "Walk in and tell the door staff you've come for the spa; they take you up to the 3rd-floor lobby (May 2026 visitor). No booking needed."
