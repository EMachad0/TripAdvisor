  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the 1996 Prostitution Act targets public soliciting and running or profiting from sex work; Wikipedia says buying it for yourself isn't punished, and foreign clients are rarely charged (mostly Pattaya raids). A decriminalisation bill went to parliament in May 2026."
      - "Mixed reviews: 3.7 on Google (291) and SwanPass (305), with 1-star reviews in Aug and Oct 2026 and a \"rushed\" one in Jun 2026."
