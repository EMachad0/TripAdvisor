  - type: highlights
    items:
      - title: The Ratchada original
        text: "Wikipedia names the **Ratchadaphisek strip** as the home of Bangkok's big \"bathing and massage\" houses. Poseidon Entertainment Complex has run here since **1999**, in an 11-storey building with a restaurant and karaoke as well."
      - title: Themed suites, no script
        text: "The rooms on the upper floors are decorated as **Palace, Arabian, Egypt, Africa, Greece, Thai, Victorian** and Modern (official site). It's the décor half of Psyche Dream Spa's idea, without the role-play."
      - title: You choose in person
        text: "On the 3rd floor a hotel-style lobby with **live piano, double bass and violin** (official site) is where you meet the women and pick (from 15:00, per the FAQ). A May 2026 visitor says the old ground-floor fishbowl is closed; staff now bring a few women to your sofa."
      - title: Posted tiers, card OK
        text: "SwanPass lists 11 prices for 90 min, from **฿2,900** (women numbered 300–399) to **฿8,800**, and says cards are accepted. The May 2026 visitor was offered women at ฿4,000."
