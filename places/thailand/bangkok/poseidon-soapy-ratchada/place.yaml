  - type: prose
    title: How it differs from nuru and from Psyche Dream Spa
    dropcap: true
    text: |-
      Wikipedia describes soapy houses (*ap op nuat*, "bathe, steam, massage") as Thailand's version of the Japanese soapland: a **bath with a lot of foam**, a body wash and a body massage, with sexual services included. A **nuru** shop uses a slippery gel on an air mattress, usually in a small shophouse on Sukhumvit. **Psyche Dream Spa** sells a scripted scene in a costume. Here the attraction is the scale and the ritual: a tower, a lobby, a big tub.

      It's cheaper than Psyche (฿3,800, about R$640, versus ฿4,800 for less time) and you see who you get before paying. What you give up: honest reviews say its best years are behind it. A Nov 2026 reviewer calls it a reminder of "another era" and steep for what you get; a Jun 2026 one found it rushed. Go for the institution, with modest expectations.
