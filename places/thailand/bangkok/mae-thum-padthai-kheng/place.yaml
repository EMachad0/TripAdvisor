  - type: highlights
    items:
      - title: New on the 2027 list
        text: "One of **nine newcomers in Bangkok and the surrounding provinces** on the Bib Gourmand list in the 2027 MICHELIN Guide Thailand (announced 3 Nov 2026)."
      - title: Just six dishes
        text: "Michelin and Thairath both say the menu is **six pad thais**, each aromatic and well balanced."
      - title: Order the crispy one
        text: "The inspectors' pick is the **crispy version**: deep-fried egg noodles in the pad thai sauce with a squeeze of lime."
      - title: Price, unconfirmed
        text: "The only price found: one diner paid **฿120** for a shrimp pad thai (about R$21) and thought it poor value (tiny shrimp, greasy noodles). Why Bangkok puts a meal under ฿200 a person."
  - type: prose
    title: A small room with a short menu
    text: |-
      Mae Thum is a small, calm room with about 20 seats (Wanderlog review, May 2026), and Michelin only added it to the Bib Gourmand list in November 2026, so it is not yet on the usual tourist pad thai lists.

      Visit Thailand Today says the room fills at lunch and mid-afternoon is easier. It also says the pad thai runs sweet; you can ask for less. Say *mai pet* for no chilli or *pet nit noi* for a little.
  - type: quote
    variant: vibe
    text: Wok noise, a fan turning overhead, and a lime wedge on the side.
