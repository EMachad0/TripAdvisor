blocks:
  - type: hero
    image: sooksiam-boats
    hook: "Arrive by boat, eat your way through a fake floating market, stay for the river at dusk."
    caption: "SookSiam's lantern-lit canal hall, ground floor"
  - type: quick_facts
    time_needed: 3–4 h
    best_time: "Free day, 16:00 into the evening"
    extra:
      - { label: Your slot, value: "Sat Jan 2 or 9, Sun Jan 3", detail: "Free evenings: river at sunset, then the fountain show" }
      - { label: Weekday option, value: "Mon–Fri, 11:00–17:00", detail: "SookSiam and the terraces; leave by 18:00 for your 19:00 shift" }
      - { label: Good in heat, value: "Yes", detail: "All indoor and air-conditioned, apart from the river park" }
  - type: highlights
    items:
      - title: SookSiam, the indoor floating market
        text: "The whole ground floor is built as a canal village: wooden stalls, **boats loaded with fruit** on an indoor waterway and lanterns overhead. Food and crafts are laid out by region of Thailand."
      - title: The river side
        text: "**River Park**, over 10,000 m² of open space on the Chao Phraya, and a planted park on the 2nd floor look straight across the water at the old town bank."
      - title: A fountain show on the river
        text: "ICONSIAM calls its multimedia water feature **Southeast Asia's longest dancing fountain**, with jets up to 35 m, on the riverfront in the evening. Free to watch."
      - title: Sheer scale
        text: "Opened in 2018 for about ฿54 billion, with 525,000 m² of floor space. The 318 m **Magnolias Waterfront Residences** in the complex is listed by Wikipedia as Thailand's tallest building."
  - type: prose
    title: More than a mall
    dropcap: true
    text: |-
      You can skip every shop in ICONSIAM and still have a good afternoon. The trip is part of it: from BTS Saphan Taksin you walk down to Sathorn Pier and cross the river on the mall's shuttle boat, which costs ฿12 now that the free boat has gone. Or take the Gold Line, a small elevated train that stops at the mall's own station.

      Downstairs is SookSiam, a market built indoors to look like a canal village, with regional Thai food at mall prices (more than on the street, but you eat in air-conditioning). Upstairs, the 6th- and 7th-floor terraces look down the Chao Phraya. On a free evening, stay for sunset and the fountain show on the riverfront.
