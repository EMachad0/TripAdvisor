  - type: map
    note: "From **BTS Saphan Taksin, Exit 2**, walk down to Sathorn Pier and look for the ICONSIAM shuttle. Or change at **Krung Thon Buri, Exit 3** for the Gold Line to Charoen Nakhon."
  - type: tips
    variant: insider
    items:
      - "**Best slot: a free evening** (Sat Jan 2, Sun Jan 3 or Sat Jan 9). Come around 16:00, eat in SookSiam, watch the sunset from a terrace, then the fountain show. Check the show times at River Park on the day."
      - "Mind the **last shuttle**: Travjoy gives 22:50 from Sathorn and 22:30 from Si Phraya, earlier than the official 23:00. After the last show, take the boat promptly or use the Gold Line."
      - "On a weekday, come at lunch: Travjoy says weekday mornings are calm and weekend evenings are 'shoulder to shoulder'."
      - "Pair it with **Wat Arun** or **Talat Noi**: Si Phraya Pier, near Talat Noi, has its own shuttle."
  - type: tips
    variant: pitfalls
    items:
      - "Older blogs say the shuttle boat is free. It isn't: the official site says 'fare applies', and Travjoy dates the end of the free boat to May 2023."
      - "The Gold Line is a separate ticket from the main BTS lines, and Travjoy says the BTS One-Day Pass doesn't cover it."
      - "Some SookSiam stalls take cash only (Travjoy), so carry small notes."
