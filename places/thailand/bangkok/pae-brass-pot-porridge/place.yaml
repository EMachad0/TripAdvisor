blocks:
  - type: hero
    hook: Congee stock boiled again for every bowl in its own brass pot, so it stays piping hot to the last spoonful.
  - type: quick_facts
    time_needed: 30–45 min
    best_time: "Late lunch, or 17:00 UTC+7"
    extra:
      - { label: Solo diner, value: "Yes", detail: "Michelin tags it 'Good for: Solo dining'" }
      - { label: Payment, value: Cash or card, detail: "Wongnai lists credit cards; QR not confirmed" }
      - { label: Before a 19:00 shift?, value: "Yes", detail: "Open until 21:00 UTC+7, every day" }
  - type: highlights
    items:
      - title: A 1962 congee cart, now a shophouse
        text: "Michelin's 2021 *Behind the Bib* article: the grandfather sold Teochew congee from a cart outside Bang Pho market; the family now runs it in the **third generation**."
      - title: One pot per bowl
        text: "Each order is boiled again with fresh stock in a **brass pot**, which Michelin says keeps it from sticking and keeps it 'piping hot until the last bite'."
      - title: Pork they mince themselves
        text: "The family buys pork loin in slices and grinds it in-house. The congee base is jasmine rice soaked 4–5 hours and cooked in bone broth (Michelin)."
      - title: Michelin says solo is fine
        text: "Its Michelin page lists it as good for **solo dining**, and a bowl with egg was **฿60** (about R$11) in March 2026."
  - type: prose
    title: What the name means
    text: |-
      The "38" is not the shop's age. Michelin's inspectors say it was the founder's lucky number; the business dates from **1962**. Pae is the father's name, and the grandfather's first pots were made from scrap warship propellers before the family switched to brass (Michelin, 2021).

      The menu has grown beyond pork congee: seafood congee, rice porridge with white snapper, fish maw soup, and wide rice noodles stir-fried crisp with chicken and squid. A Wongnai review from July 2026 says there are only a few seats and many people take their order away.
  - type: quote
    variant: vibe
    text: Steam off a brass pot, white pepper, and a crisp patongko to dip.
