  - type: map
    note: "From Suvarnabhumi take the **S1 bus** (Level 1, Gate 7, ฿60, 06:00–20:00) to Khao San and walk the last stretch along Phra Sumen Road."
  - type: tips
    variant: insider
    items:
      - "Be at the bar at **19:00** on your first night: The Meet Up is free and it is how the pub-crawl crew forms."
      - "**Sun 3 Jan** is the one free night with the big crawl (club entry included); Wednesday's falls on a work night."
  - type: tips
    variant: pitfalls
    items:
      - "The arrival night is the dearest: ฿1,327 on Sat 2 Jan against ฿982 on Tue 5 Jan and ฿900 on Sat 9 Jan (searched 12 Nov)."
      - "Sleeping here through the 4–8 Jan work week means daytime sleep in a loud 4-bed dorm. Split the stay."
      - "The cheapest rate is non-refundable. If your Thailand dates may still move, pay the extra ~฿70–100 for free cancellation."
