    social:
      - "**The Meet Up, every night at 19:00**: 30 minutes of free-flow spirits and mixers at the bar."
      - "**Pub crawl every night at 23:00**; on Wednesdays and Sundays it is \"Khaosan's Biggest Pub Crawl\" with a singlet, cocktail, shot and entry to 3 bars and 1 club."
      - "Weekly fixtures: Beats & Bingo (Tue), beer pong (Thu), foam party (Sat). Hostel-run canal, tuk-tuk and Chinatown tours leave the bar at 14:30."
      - "Nov 2026 review: \"Such an awesome place to meet people!\""
      - "**Your dates**: the Meet Up and crawl fit only Sat 2, Sun 3 (big crawl) and Sat 9 Jan (foam party). Your 4–8 Jan shifts (19:00–04:00) miss both."
    good_to_know:
      - "Dorms are **4-bed, air-conditioned and ensuite**, with privacy curtains, a reading light and socket per bunk, and a locker. There is a female-only 4-bed dorm."
      - "Free security lockers, luggage storage, WiFi and towel."
      - "Pool and an outdoor gym on site; bar and restaurant."
      - "No children, no smoking, no curfew. It is loud by design: light sleepers should look at NapPark instead."
      - "**Work week**: only \"Free WiFi\" is listed (no cowork space), and you'd sleep by day in a party dorm. Stay here for weekends only."
  - type: highlights
    items:
      - title: Built for meeting people
        text: "**9.7 overall and 9.7 for atmosphere** from 6,887 Hostelworld reviews, and an organised night out every single night."
      - title: A pool on Khao San
        text: "A pool and sunbeds, which the hostel calls a rare find on Khao San, for the slow afternoon after a crawl."
      - title: Small dorms
        text: "Only 4-bed rooms, each with its own bathroom, so a party hostel still sleeps better than a 20-bed hall."
      - title: Old Bangkok on foot
        text: "On Phra Sumen Road by the river and the fort, a walk from Khao San Road and the old-city temples."
  - type: cost_breakdown
    items:
