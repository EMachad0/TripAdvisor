  - type: tips
    variant: insider
    items:
      - "**Slot:** weekday afternoon. Arrive by about 14:30 so you are in before the 15:30 price change."
      - "Sunset is the busiest and dearest slot; a daytime visit avoids both."
      - "Phones are not allowed on the glass floor itself: staff outside take photos for you, and you wear shoe covers."
      - "Before paying ฿1,000 at the counter, compare the [official online booking](https://kpmn.welovebooking.net/book/kpmn/home) and Klook the day before: guides say online is often a little cheaper."
      - "Check the weather before going: in high wind or rain the glass floor can close for a while."
  - type: tips
    variant: pitfalls
    items:
      - "The ticket price jumps ฿200 at 15:30. Don't drift in at 15:35."
      - "Over budget? The ฿100 Golden Mount is the cheap high view, and it fits the same weekday-afternoon slot."
