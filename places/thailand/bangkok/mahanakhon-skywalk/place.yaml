  - type: highlights
    items:
      - title: The glass floor
        text: "A **63 m² glass tray** on the 78th-floor roof, 310 m above the street. You stand on transparent panels over the edge of the building."
      - title: Two decks in one ticket
        text: "An indoor 360° deck on the **74th floor** with binoculars and screens naming the landmarks, then the open-air rooftop and **The Peak** at 314 m."
      - title: Fast lift, odd postbox
        text: "Video-themed lifts reach the 74th floor in **under 50 seconds**, and Bangkok's highest postbox is up there for a postcard home."
      - title: Daylight beats sunset here
        text: "One 2026 reviewer found the glass floor **more striking by day**, and sunset so crowded that a standing spot with a view was hard to find."
  - type: prose
    title: Why pay ฿1,000 for a view
    dropcap: true
    text: |-
      We compared three ways to see Bangkok from above. The **Golden Mount** costs ฿100 and shows the old town, but it is a 77 m hill. Rooftop bars charge no entry but need an evening, and the traveler has only three free nights. The SkyWalk is the only true skyscraper view that fits a **weekday afternoon**, it is Thailand's highest 360° observation deck, and the glass floor is the reason people come.

      The cost is R$165, over the R$100 daily budget, which is why it is the one paid skyline on the plan. Use the **10:00–15:30 ticket**: it is ฿200 cheaper than the 15:30–19:00 sunset tier, and the views are just as clear. The sunset tier would also push you past a 19:00 work start, so keep it for a weekend if you want golden hour.
