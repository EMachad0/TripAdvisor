  - type: map
    note: "From **BTS Phrom Phong**, walk into **Sukhumvit Soi 39**; the venue says about 3 minutes. Google Maps lists it as \"Bkkvice Nuru Massage\"."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekday afternoon** in Bangkok (Tue 5 or Wed 6 – Fri 8 Jan, 13:00–18:00) or the free night of **Sat 9 Jan**, until 00:00. Jan 2–4 you are in Chiang Mai."
      - "For a first visit the venue suggests 90 min, but that is ฿4,500: stick to 60 min in the deluxe room for the value price."
      - "The site takes couples bookings (one or two masseuses, in a Jacuzzi room)."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** prostitution is illegal under the 1996 Prevention and Suppression of Prostitution Act, but buying isn't punished (Wikipedia). A draft repeal bill (proposed May 2026) still needed the PM's endorsement in Aug 2026 before it could go to Parliament; it is not law (Pattaya Mail)."
      - "Book only via **LINE @bkkvice** or the numbers on bkkvice.com. The site lists two WhatsApp numbers (+66 85 571 6242 and +66 62 896 1328)."
      - "Agree the length and what's included **in writing** before you go in; a guest who didn't got a shorter, less complete second session at the same price."
      - "Tipping is expected at nuru houses: ฿500–1,000 to the masseuse, per one analysis quoted by Tokyo Reporter (2026). Decide yours beforehand."
