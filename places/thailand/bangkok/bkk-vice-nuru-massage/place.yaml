blocks:
  - type: hero
    image: phrom-phong-night
    caption: "BTS Phrom Phong, 3 min from the shop; no free photo of the shop"
    hook: "฿3,000 for an hour in a deluxe room, where premium sessions can reach ฿4,500 or more."
  - type: quick_facts
    time_needed: "60–90 min session"
    best_time: "Weekday 13:00–18:00"
    extra:
      - { label: Slot, value: "Weekday afternoon", detail: "Opens 11:00: Tue 5/Wed 6 – Fri 8 Jan before work, or the free Sat 9 Jan" }
      - { label: vs premium, value: "About ฿1,500 less", detail: "Premium Bangkok nuru is ฿4,500+ (Tokyo Reporter, 2026)" }
      - { label: Payment, value: "Cash, card, Thai QR", detail: "Tip in cash to the masseuse at the end (venue FAQ)" }
  - type: highlights
    items:
      - title: A theme, not just a room
        text: "The venue's pitch is a **Grand Theft Auto: Vice City** décor: soft neon, 80s Miami, Scarface. Even its one critical Google review says the place looks cool, modern and clean, \"one of the best I've seen in Bangkok\"."
      - title: Mid-market price, written down
        text: "**฿3,000 for 60 min** nuru in a deluxe room, ฿4,000 in a room with a private Jacuzzi, on the venue's own menu. That is the middle of the ฿2,500–3,500 range Tokyo Reporter gives for a 60-min nuru in Bangkok (2026)."
      - title: Clear house rules
        text: "The FAQ answers what most places leave to the counter: walk in or book on LINE, pay by **cash, card or Thai QR**, and a tip is customary but not required."
      - title: 3 minutes from the Skytrain
        text: "**BTS Phrom Phong**, then a short walk into Soi 39, so it fits between lunch and a 19:00 shift."
  - type: prose
    title: What you give up for the lower price
    dropcap: true
    text: |-
      The ฿3,000 session is in a **deluxe room**; the Jacuzzi rooms the site shows off cost ฿1,000 more for nuru (฿4,000), which puts them in premium territory. The 90-min nuru (฿4,500) is a premium price too, so the value here is the 60-min deluxe booking.

      Consistency is the other trade-off. Two of the reviews the venue itself displays are honest about it: one guest found the masseuse \"mechanical\" next to the beautiful interior, and a couple who came twice say the second session ended about **20 minutes early** and wasn't as complete, at the same price. Their advice: **confirm what's included when you book**.

      One hour costs about **five days of your R$100 "everything else" budget**. It's cheaper than the top end, not cheap.
