      - { label: Express boat to Tha Chang, local: 20, brl: 3.3, estimate: true, optional: true }
      - { label: "Official audio guide (8 languages)", local: 200, brl: 32.98, optional: true }
  - type: map
    note: "Visitors enter through **Mani Noppharat Gate on Na Phra Lan Road** (the entrance since 10 Jan 2024), not the side where tuk-tuks wait. From Khao San Road it is a 15–20 min walk across Sanam Luang."
  - type: tips
    variant: pitfalls
    items:
      - "\"It's closed today\" is the classic scam. Ignore anyone outside who offers a ride or a different temple."
      - "Anyone selling tickets **outside** the gate is not the palace."
      - "Underdressed? A booth by the entrance lends cover-up clothes against a refundable deposit, but the queue can cost **20 minutes** on a busy morning."
  - type: tips
    variant: insider
    items:
      - "**Slot:** weekday afternoon only if you arrive by early afternoon. The best weekend morning is **Sun Jan 3**: Sat Jan 2 is your arrival day, Sat Jan 9 starts a few hours after your last night shift ends, and Sun Jan 10 you fly to Seoul."
      - "**Free option:** the gold spires show over the white walls from **Sanam Luang**, the open field to the north. You can see them free on the way past."
      - "Go straight to Wat Phra Kaew first; the palace buildings and the textile museum can wait."
      - "Pair it with Wat Pho, 10 min south on foot. It has separate tickets and stays open until the evening."
  - type: weather
    temp_low_c: 23
    temp_high_c: 33
    conditions: "Dry and sunny; Dec–Jan are the coolest, driest months"
    note: "Almost everything is outdoors on white stone, so midday is hot even in January. Covered shoulders and knees are compulsory anyway, so pick thin, loose fabric."
    wear: Light long trousers or a long skirt, a T-shirt with sleeves, sandals with a back strap, water
