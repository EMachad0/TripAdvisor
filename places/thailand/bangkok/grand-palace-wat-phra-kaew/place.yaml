blocks:
  - type: hero
    image: monk-reflection
    focus: "50% 45%"
    hook: "Gilded spires behind a white wall, and the Emerald Buddha in the hall at their centre."
  - type: quick_facts
    time_needed: 2–3 h
    best_time: Weekend at 08:30, or a weekday by 13:00
    extra:
      - { label: Your slot, value: Weekday afternoon (early), detail: "Be at the gate by 13:00–14:00; ticket desk shuts at 15:30" }
      - { label: Dress code, value: Shoulders + knees covered, detail: "No shorts, sleeveless tops or backless sandals" }
      - { label: Audio guide, value: ฿200 (R$33), detail: "Rent at the gate; passport or credit card held as deposit" }
  - type: highlights
    items:
      - title: The Emerald Buddha
        text: "Wat Phra Kaew holds the revered **Emerald Buddha**. Shoes and hats come off in the ordination hall, and photos stop at the door."
      - title: Demon guardians and gold chedis
        text: "Mosaic **yaksha** figures hold up the two golden chedis, and the walls carry **Ramakien** murals. The official **audio guide (฿200)** explains them for far less than a licensed guide."
      - title: A palace with a European body
        text: "The **Chakri Maha Prasat** hall is an Italian Renaissance building wearing a Thai tiered roof. You see it from outside; the interior is closed to visitors."
      - title: Textile museum included
        text: "The same ticket opens the air-conditioned **Queen Sirikit Museum of Textiles**: 30–45 minutes out of the midday sun."
  - type: prose
    title: The palace is not closed today
    dropcap: true
    text: |-
      This is Bangkok's number-one sight and the place its oldest scam happens. Near the gates, a tuk-tuk driver or a well-dressed "official" says the palace is **closed for a ceremony** and offers a cheap ride to another temple, which ends at a gem shop. Guides agree: walk straight to the entrance on Na Phra Lan Road and buy your ticket **only at the booth inside the gate**. If there really is a closure, uniformed palace staff at the entrance will tell you.

      For the work week the clock is the problem. You sleep until late morning on Mon–Fri, and the ticket desk shuts at **15:30**, with the grounds closing at 16:30. A weekday works if you are at the gate by early afternoon. The calmer option is **Sun Jan 3 at 08:30**, before the tour buses arrive around 09:30.
