      - { label: Karts, value: "35 or 55 km/h", detail: "Regular 12+ (135 cm) · Fast 15+ (150 cm), 200 cc" }
      - { label: Good in rain, value: "Yes, fully indoors" }
  - type: highlights
    items:
      - title: You drive, not watch
        text: "You're the one in the seat. **Regular karts** top out at 35 km/h; **fast karts** (200 cc) reach 55 km/h on the advanced track."
      - title: Lap times and a podium
        text: "Every lap is timed and shown live; the fastest of each heat gets the **podium**, and there's a monthly leaderboard to try to break."
      - title: A race every 10 minutes
        text: "Open-time tickets, at the counter or online, and **races start every 10 minutes** (call ahead to check the track is open to the public). A safety briefing comes first; full-face helmets are provided."
      - title: Pool table while you wait
        text: "A trackside lounge with drinks, snacks, a **free pool table** and foosball, with a view of the circuit."
  - type: prose
    title: What it is, and what it isn't
    text: |-
      Motor karts on a flat indoor track, in the middle of Bangkok, open from 13:00: a race you drive yourself that fits a work-day afternoon. It is **not** a gravity kart. For a no-motor luge cart down a mountain, see Thongsomboon Club near Khao Yai (a weekend day trip) or Skyline Jungle Luge near Chiang Mai (a weekend up north).

      **Is it worth R$117, more than a whole day's budget?** It's an 8-minute race. Do it once, in the regular kart, as the day's one thing, and keep the rest of the day to free sights. If the first race hooks you, the 3-race pack (with a T-shirt) works out cheaper per race than buying them one at a time.
  - type: cost_breakdown
    items:
      - { label: "1 race, regular kart (8 min)", local: 699, brl: 116.73 }
      - { label: "Fast kart instead: 2 races (8 min each)", local: 1499, brl: 250.33, optional: true }
      - { label: "3 races + T-shirt (regular or fast)", local: 1999, brl: 333.83, optional: true }
  - type: map
    note: "Track is on the **2nd floor of RCA Plaza**. RCA is Bangkok's club strip, which is busy after dark and quiet in the afternoon."
  - type: tips
    variant: insider
    items:
      - "**Closed-toe shoes are mandatory**. Bring sneakers, not flip-flops (a 2017 review says they rent shoes, but don't count on it)."
      - "Racing suits are free to borrow if you want the photo."
      - "Before you go, **phone +66 2 641 4252** or check the Bangkok slot schedule: the FAQ recommends confirming a Bangkok visit first."
  - type: tips
    variant: pitfalls
    items:
      - "Weekday hours end at **21:00**, but with your 19:00 start, aim to be done by 17:00."
      - "Reckless driving isn't allowed: marshals can **slow or stop any kart by remote**."
