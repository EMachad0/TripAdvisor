blocks:
  - type: hero
    image: jungle-path
    hook: "Five minutes by boat from the docks, and you're cycling under trees with no traffic."
    caption: "Cycling a raised path through the nipa palms of Bang Krachao"
  - type: quick_facts
    time_needed: 4–5 h
    best_time: Weekend, start by 09:00
    extra:
      - { label: Your slot, value: "Weekend day, or a weekday", detail: "Weekday works if you start by 11:00 and skip the market" }
      - { label: Terrain, value: "Flat, mostly paved", detail: Some gravel loops around the lake }
      - { label: Bring, value: Passport or ID, detail: Bike shops may hold it until you return }
  - type: highlights
    items:
      - title: The ferry crossing
        text: "From **Wat Khlong Toei Nok Pier** a small boat costs **฿10** (big boat ฿20) and crosses in about five minutes. The sign at the kiosk shows the real price in Thai."
      - title: Sri Nakhon Khuean Khan Park
        text: "The heart of the peninsula: shaded paths, pavilions, a bridge over the water and more than **100 bird species**. Free to enter."
      - title: The bird-watching tower
        text: "The paved path ends at a tower that rises above the tree line. Climb it for the view over the canopy."
      - title: Bang Nam Phueng floating market
        text: "**Sat–Sun 08:00–16:00** only: a canal lined with covered stalls of street food and crafts, small and still local. Lunch here before the boat back."
  - type: prose
    title: Bangkok's green lung
    dropcap: true
    text: |-
      Bang Krachao is a loop of land in a bend of the Chao Phraya, protected from development and covered in trees, canals and small temples. On a map it looks like a green fist pushed into the city. From the Khlong Toei side you can see it across the water; most visitors to Bangkok never cross.

      The day is cheap and simple. MRT to Khlong Toei, a taxi or a 30-minute walk to the pier, a ฿10 boat, a bike. Bike shops at the pier start at about ฿80 a day; walk to the park gate and one shop there rented for ฿40 at the last report. Then ride the shaded paths at your own pace.
