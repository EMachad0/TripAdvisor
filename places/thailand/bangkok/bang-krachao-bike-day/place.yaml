  - type: map
    note: "The pin is the park. Your boat leaves from **Wat Khlong Toei Nok Pier** on the Bangkok side and lands at **Kamnan Khao Pier**, where the bike shops are."
  - type: tips
    variant: insider
    items:
      - "**Your slot: weekend day**, best **Sun Jan 3**, to get the floating market (Sat Jan 2 is arrival day; Sat Jan 9 follows a night shift). On a weekday afternoon it still works: start by 11:00 and be back across the river before dark."
      - "Ride back the same way from the bird tower: the gravel loop around the lake is hard going and there isn't much to see."
  - type: tips
    variant: pitfalls
    items:
      - "The pier kiosk has overcharged visitors before. Pay ฿10 (small boat) or ฿20 (big boat) and no more."
      - "Ferries run less often after dark, especially on weekdays. Don't leave the crossing to the last minute."
