  - type: tips
    variant: insider
    items:
      - "Be at the tracks **10–15 minutes** before the train and pick your spot early: when it comes, the crowd bunches up and blocks every shot."
      - "Samut Songkhram's famous **pla tu** (mackerel) is sold all over both markets, packed head-down in little bamboo baskets."
      - "Bring cash: most food boats and small stalls don't take cards."
      - "**Fits your week:** a weekend day trip, best on Sun Jan 3. Not a weekday, and not Sat Jan 2 (your flight day)."
  - type: tips
    variant: pitfalls
    items:
      - "Turning up at Amphawa Mon–Thu means a near-empty canal and shuttered stalls."
      - "Skip Amphawa between **13:00 and 16:00**, when the day-tour buses fill the walkways."
      - "Weekend rooms in Amphawa sell out; if you want to stay over, book a week ahead. Otherwise you sleep in Bangkok."
