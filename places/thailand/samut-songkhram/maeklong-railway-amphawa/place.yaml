  - type: highlights
    items:
      - title: The umbrella-pulldown market
        text: "**Talat Rom Hup** means the \"umbrella pulldown market\": more than 300 stalls line 500 m of track, and a siren gives vendors seconds to fold awnings before the train inches through."
      - title: Twice in one visit
        text: "The same train arrives and then leaves again, so one wait often gets you two passes. You may climb aboard at the station for photos."
      - title: Dinner on the water
        text: "At **Amphawa**, cooks in small wooden boats grill river prawns, ladle boat noodles and fry oyster omelettes, selling straight up to the canal walkways."
      - title: Fireflies after dark
        text: "Shared firefly boats leave from about **18:00** for ฿60–80 (R$10–13), into the mangroves along the Mae Klong. Fewer in January than in the rainy season."
  - type: prose
    title: How the day works
    text: |-
      **Go on Sunday Jan 3.** Amphawa only runs Friday to Sunday. A Friday doesn't work for you (work night from 19:00, and the ride back takes about 2 hours), and Sat Jan 2 is the day you fly in from China. That leaves **Sun Jan 3** (no holiday that day) or, as a backup, **Sat Jan 9**, which is Thai Children's Day, so expect more families.

      **Morning: Maeklong.** The easy way is a van from the **Southern Bus Terminal (Sai Tai Mai)**, or from the Mochit van terminal, about ฿100 and 2 hours to Maeklong town. Aim for the **11:10** arrival or **14:30** train. These times come from a 2025 table, not a current SRT timetable, so check them at Maeklong station (or ask your hostel to call the station) the day before, and on arrival. The slow, fun way is three legs by rail: Wongwian Yai to Maha Chai (฿10, about 1 h), a ฿3 ferry across the river, then Ban Laem to Maeklong (฿10, about 1 h), only worth it if you time the connections.

      **Afternoon and evening: Amphawa.** A songthaew from Maeklong town takes about 10–15 minutes. Arrive **after 16:00**, when the day-tour buses thin out and the food boats are in full swing; stay for sunset.

      **Getting back.** No source I could find gives the last van or bus from Amphawa or Maeklong back to Bangkok, and service thins out in the evening. So **buy or confirm your return at the van office as soon as you reach Amphawa**, and plan to leave by **19:00** unless they confirm a later departure. The firefly boats (from about 18:00) only fit if they do. Missing the last van leaves you about 70 km from your bed.
