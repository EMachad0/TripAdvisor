      - { label: Limits, value: "Ages 4+, max 110 kg", detail: "Official limit; a 2025 guide also gives an upper age of 65" }
  - type: highlights
    items:
      - title: The thing you asked for
        text: "A small kart with no motor that rolls **2,100 m** down a jungle hill on gravity alone. You steer it and you work the brake, so the speed is yours."
      - title: Ziplines on the way down
        text: "The luge comes at the end of a zipline course. The Extreme package has **21 ziplines** on 38 platforms (the longest is **900 m**), two abseils and a giant swing; the cheaper Exciting one has 9."
      - title: Picked up, fed, dropped off
        text: "Every package includes the **van from your Chiang Mai hotel** and back, plus a Thai buffet with tea and coffee. No need to find your own way up into the hills."
      - title: Cool, dry January
        text: "The north's cool season: Chiang Mai averages about **16 °C** at dawn and **30 °C** in the afternoon in January, with almost no rain."
  - type: prose
    title: Will it fit your week?
    dropcap: true
    text: |-
      **Sat 2–Sun 3 Jan (the one that works).** Take sleeper **No. 13** from Krung Thep Aphiwat on Saturday at **20:05**. It reaches Chiang Mai around **08:45** on Sunday, but trains run 30–60 min late, so book the **Extreme** package with an **11:00 or 12:00 pickup**. The cheaper Exciting package has only a 10:00 van, which a late train can make you miss. You're back in town by mid-afternoon. Get the night train back, or a 1h10 flight on Sunday evening, and you're in Bangkok long before Monday's 19:00 shift. This only works if your flight from China lands in Bangkok by Saturday evening. Otherwise fly from China straight to Chiang Mai and do the luge on Sunday.

      **Sat 9 Jan (possible, but brutal).** Your shift ends at 04:00. You'd catch an early flight north, take a late-morning pickup, fly back that evening and fly to Seoul on Sunday. That's a 1h10 flight each way, a luge run and no sleep. Children's Day is that Saturday too.

      **Is it worth about R$670, nearly seven days' budget?** It's the exact ride you named, and nothing like it exists near Bangkok except a much shorter run at Thongsomboon Club near Khao Yai (see its page). But the luge itself is about 15 minutes. You're really paying for a zipline morning with a gravity kart at the end. The reseller's ฿370 luge-only ticket looks cheap, but it has no transfer, so a round trip into the hills could cost you more than you save. Flights are an alternative to the train (฿700–1,500 each way when booked 2–4 weeks out), but the New Year weeks can triple fares, so book early either way.
