    note: "The park is in **Ban Pa Pan**, about an hour east of Chiang Mai. The package van picks you up; driving yourself means narrow, steep roads."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend + trip north.** Sun Jan 3 is the realistic day."
      - "Only want the luge? Ask the park on **WhatsApp (+66 98 748 3778)** whether they sell a luge-only run with the van before you buy the reseller's ฿370 ticket."
      - "The **Express** package (also ฿2,250) has **no luge**: pick **Exciting** or **Extreme**."
  - type: tips
    variant: pitfalls
    items:
      - "Free pickup only covers Chiang Mai city and up to 5 km out. Further out, it costs **฿500–1,800 each way**, so stay in town."
      - "Overnight trains often run 30–60 minutes late. Off the train, don't book Exciting's **only pickup at 10:00**: take Extreme at 11:00 or 12:00."
