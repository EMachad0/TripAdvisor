blocks:
  - type: hero
    image: entrance-night
    caption: "The wooden Lanna house lit up for dinner"
    hook: Grilled chilli dips, herb-packed sausage and pork-belly curry, served fast in a wooden Lanna house.
  - type: quick_facts
    time_needed: 45 min–1 h
    best_time: "11:00 UTC+7, at opening"
    extra:
      - { label: Tables, value: Mostly walk-in, detail: "Michelin says phone; number from Wongnai" }
      - { label: Solo diner, value: "Yes, order 2 dishes", detail: "Sharing plates; khao soi works as a solo main" }
      - { label: Before a 19:00 shift?, value: "Yes, at lunch", detail: "Lunch sitting 11:00–15:00 UTC+7" }
  - type: highlights
    items:
      - title: The northern classics on one menu
        text: "**Sai ua** (herb sausage), **nam prik num** (green chilli dip), **gaeng hang lay** (pork-belly curry) and khao soi on one menu."
      - title: A TV chef's kitchen
        text: "Time Out says it is run by former TV chef **Charan Thipeung** and has served northern food for over a decade, in a traditional **Lanna-style** wooden house."
      - title: Bib Gourmand, still
        text: "On Michelin's **Bib Gourmand** list for Chiang Mai in the current guide, at the ฿฿ level."
      - title: Fast once you sit
        text: "A March 2026 Wongnai reviewer says the food comes out very quickly. The wait, if any, is for a table: a 2026 reviewer says it is **walk-in only**, though Michelin says to phone the restaurant."
  - type: prose
    title: Eating it alone
    text: |-
      Much of this menu is plates to share, which is awkward at a table for one. Keep it to two plates: a **khao soi gai** (฿90) as your main and a **sai ua** (฿115) to pick at, with sticky rice. That is about ฿205.

      Groups order the **ออเดิร์ฟเมือง** (northern hors d'oeuvres, ฿305), a platter of dips, sausage, pork crackling and curry. Wongnai reviewers name it the dish to get, but it is a lot for one.
