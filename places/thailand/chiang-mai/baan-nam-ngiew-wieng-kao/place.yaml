  - type: highlights
    items:
      - title: New Bib Gourmand for 2027
        text: "One of only **three Chiang Mai newcomers** on Michelin's 2027 Bib Gourmand list, announced 3 Nov 2026."
      - title: The other northern noodle soup
        text: "Everyone eats khao soi. **Nam ngiao** is the tangy, tomato-red one. Thairath says this shop cooks it Chiang Rai style, with dried kapok flowers (**dok ngiu**) in a thick broth."
      - title: Pork or beef, ฿45 a bowl
        text: "Choose pork or beef (Michelin). A Wongnai reviewer paid **฿45** for the pork bowl with minced pork and blood in August 2025."
      - title: A shady garden
        text: "A 2024 Wongnai reviewer describes a garden under trees and a friendly owner who explains the dishes."
  - type: prose
    title: What to order
    text: |-
      Michelin describes generous bowls of rich, tangy broth with pork or beef, tomato and herbs, also available with sides and vegetables. On Wongnai, reviewers order **khanom jeen nam ngiao** (with rice noodles) or **kao lao nam ngiao** (the soup without noodles) with a side of **khao kan jin**, northern rice steamed with blood, and pork crackling to drop into the bowl.

      The shop also sells som tam. A 2025 reviewer noted a sign listing the steps to follow when you order.
