  - type: tips
    variant: insider
    items:
      - "**Watch for the announcement** from mid-December: search Facebook for *World Formula Hmong Racing* and *เทศบาลตำบลแม่แรม* (Mae Raem municipality), or *ฟอร์มูล่าม้ง 2570*."
      - "Up at Mon Jam, the flower gardens and photo spots charge about **฿50 each**: pick two or three."
      - "A jungle coaster and zipline park is **2.1 km** from Mon Jam, if you want to ride something downhill yourself the same day."
  - type: tips
    variant: pitfalls
    items:
      - "Plan the ride **back down** before you go up: there are only 3 vans a day, so note the last one or agree a return with a hired songthaew."
      - "Don't book flights until a date is out. If you fly up on spec, the rest of Mon Jam (gardens, cool air, viewpoints) is the consolation prize."
