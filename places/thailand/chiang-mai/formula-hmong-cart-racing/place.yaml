  - type: highlights
    items:
      - title: The cart was a farm truck
        text: "The wooden cart is how Hmong families once rolled crops **down from the high fields** to the lowland towns. Motor vehicles replaced it, so now it's raced for fun at New Year."
      - title: Knockout racing on a mountain
        text: "Two carts at a time down a **400 m** track, best of three, losers out, over two or three days, for cash prizes (nearly ฿10,000 in 2024)."
      - title: A whole Hmong New Year around it
        text: "Cloth-ball tossing (*lukchuang*, a courting game), spinning-top and crossbow contests, dancers and the embroidered New Year dress. The 12 Hmong villages of Chiang Mai take turns hosting."
      - title: Tourists can have a go
        text: "The 2025 Mon Jam edition had a separate **amateur class for tourists** next to the pros, and in 2024 international visitors joined test runs. Not guaranteed for 2027."
  - type: prose
    title: Will it fit your week?
    dropcap: true
    text: |-
      Honestly, maybe not. The races ride on the Hmong New Year, which Chiang Mai's 12 Hmong villages celebrate in turns, and dates surface late: in 2025 the English announcement came out on 9 January, two days before the race, pointing to a Facebook page. The big Mon Jam race fell on **11–12 January** in 2025 and **26–28 January** in 2024; a village race in Hang Dong ran on **20 December 2025**. So a race on one of your two free weekends is plausible but nowhere near certain.

      **Sat 2–Sun 3 Jan (the better fit):** you arrive in Thailand on the 2nd and have no shift until Monday night, so you get both race days. Instead of landing in Bangkok you could fly from China straight to Chiang Mai if a route fits (check flights), van up to Mon Jam (~1 h), and fly down to Bangkok on Sunday evening or Monday.

      **Sat 9 Jan (heats only):** you finish work at 04:00 Saturday, fly Bangkok → Chiang Mai that morning (70–80 min) and catch the Saturday heats. Sunday's finals are out, because you leave for Seoul on the 10th. The other option is to carry the laptop and work your night shifts from Chiang Mai that week.

      **Is it worth ฿1,800–3,400 (R$300–570), three to six days' budget?** Since the date comes out days before the race, expect last-minute fares of about ฿1,500 each way (R$570 in all), and New Year weeks can cost even more. It's only worth it if a race is confirmed: it happens nowhere else, and almost no foreign visitors see it. Without a date, don't spend the money.

      This is a race you **watch** (and maybe try in an amateur class). To ride a gravity kart down a mountain yourself, see Skyline Jungle Luge near Chiang Mai and Thongsomboon Club near Khao Yai.
