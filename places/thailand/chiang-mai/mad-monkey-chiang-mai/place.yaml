    note: "Down **Soi 2 off Kamphaeng Din Road**, south-east of the old city moat; drivers may know it by its old name, **Brick House Hostel**."
  - type: tips
    variant: insider
    items:
      - "**Slot: weekend night, Sat 9 Jan.** That night Hostelworld lists the 19:00 **Meet Up and Music Trivia**, no crawl. The Sunday crawl falls on Sun 10 Jan, the day you fly to Seoul, and Fri 8 Jan is a work night."
      - "**Cheapest way in:** Hostelworld's Chiang Mai list (undated 'from' prices, read 12 Nov) starts under **€2 (about R$10)** a dorm bed and puts Mad Monkey at €17.54 (R$109), near the top: you pay for the social scene. A dated 9 Jan search returned nothing, so compare live."
      - "**Book direct?** Hostelworld itself says booking on Mad Monkey's own site gives extra free nights and loyalty perks; compare before paying."
      - "The non-refundable rate is about ฿52 cheaper a night; pay the extra for free cancellation while your dates can still move."
  - type: tips
    variant: pitfalls
    items:
      - "It is built for nights out: with work from 19:00 to 04:00, the bar's busiest hours are your working hours. Test the co-working space and Wi-Fi on arrival."
      - "Some apps still show it as Brick House Hostel. Search both names before you tell a Grab driver."
