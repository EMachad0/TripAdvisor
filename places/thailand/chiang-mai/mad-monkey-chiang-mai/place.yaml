    social:
      - "**The Meet Up**: every day at 19:00 at the bar, with 50% off beers."
      - "**Pub crawls every Tuesday, Friday and Sunday**, plus Music Bingo on Tuesdays and Karaoke on Thursdays."
      - "A **saltwater pool** and an air-conditioned bar and restaurant; a tour desk books Sticky Waterfall, sanctuary and zipline days."
      - "November 2026 reviews: \"Made the best friends\", \"Where the party is at\". Hostelworld's summary calls it highly social."
    good_to_know:
      - "Air-con dorms with **360° privacy curtains**, a reading light and a socket at each bed; female dorms available."
      - "Free lock boxes, luggage storage and towels; a **co-working space** and a gym on site."
      - "Adults only, no smoking, no curfew. Booking.com asks for photo ID and a credit card at check-in."
      - "Bring **฿500 cash** for the refundable damage deposit, collected on arrival and returned at check-out (Booking.com)."
  - type: highlights
    items:
      - title: Instant crew
        text: "A 19:00 meet-up every night and three pub crawls a week (Tue, Fri, Sun): the easiest way to go out in Chiang Mai alone."
      - title: Pool in the cool season
        text: "A saltwater pool for the warm January afternoons (about 30 °C), before the evenings drop to 16 °C."
      - title: Old City on foot
        text: "Tha Phae Gate (about 500 m), the Night Bazaar and Wat Chedi Luang are listed as nearby: the old city is a walk, not a ride."
      - title: Work if you must
        text: "A co-working space on site makes it a workable base if you bring the laptop for the Mon–Fri nights."
