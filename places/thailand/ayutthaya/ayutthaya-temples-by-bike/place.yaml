  - type: tips
    variant: insider
    items:
      - "**Fits your week:** a weekend day trip, best **Sun Jan 3**. Sat Jan 2 is arrival day; Sat Jan 9 follows the night shift that ends at 04:00. On a weekday you'd need to be on the island by about 11:00 and on the 15:00 Connex back, so only 3–4 hours there."
      - "Check the bike before you ride off: tyres firm, seat at your height, handlebars tight. Good shops add a lock."
      - "Ask for a ticket when you pay. Wikivoyage reports sellers who pocket the cash without issuing one."
  - type: tips
    variant: pitfalls
    items:
      - "Don't take the ฿2,000 tuk-tuk tours offered when a minibus drops you off; official tuk-tuks quote about ฿300 an hour."
      - "Not every temple takes the 7-site ticket: Wat Thammikarat charges ฿20 separately."
