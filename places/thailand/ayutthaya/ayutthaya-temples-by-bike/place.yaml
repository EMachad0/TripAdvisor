blocks:
  - type: hero
    image: ratchaburana-lawn
    hook: "Pedal between the brick prangs of Siam's old royal capital, stopping wherever a ruin looks good."
    caption: "Wat Ratchaburana's prang above the lawns"
  - type: quick_facts
    time_needed: "Full day"
    best_time: "Weekend; out by 09:05, back on the 15:00"
    extra:
      - { label: Fits your week, value: Weekend day trip, detail: "Best Sun Jan 3; Jan 2 is arrival day, Jan 9 follows a night shift" }
      - { label: Train out, value: "Connex 09:05 → 10:20", detail: "Weekends, from Krung Thep Aphiwat; ฿50, unreserved" }
  - type: highlights
    items:
      - title: The Buddha head in the roots
        text: "At **Wat Mahathat** a stone Buddha head sits wrapped in fig-tree roots. Kneel for your photo: Thais treat it as holy."
      - title: Seven temples, one ticket
        text: "The **฿300 (R$49.47)** Fine Arts ticket covers seven monuments for seven days; each one alone is ฿80, so it pays off from the fourth."
      - title: Flat, short and paved
        text: "Most ruins sit in the island's northwest corner on paved paths with short distances. You don't need to be fit to see them all by bike."
      - title: Into a prang, maybe
        text: "**Wat Ratchaburana**'s prang has stairs up to a view and painted crypts, but they were reported closed in 2020 with no reopening date. Ask at the gate."
  - type: prose
    title: The day, step by step
    text: |-
      **Out.** On a weekend, take the air-conditioned **SRT Bangkok Connex** from **Krung Thep Aphiwat** (Bang Sue) at **09:05**, arriving 10:20, ฿50, seats unreserved, tickets at the station. Cheaper and slower: ordinary third-class trains from **Hua Lamphong** for about ฿15, 80 minutes to 2 hours; or about ฿20 third class on a rapid from Krung Thep Aphiwat.

      **On the island.** The station is on the east bank. Walk across the main road to the pier and take the ferry (฿10, or ฿20 if you bring a bike across); there is a bike shop right opposite the station if you'd rather ride round by the bridge. A good loop: **Wat Mahathat**, **Wat Ratchaburana** across the road, **Wat Phra Ram**, then the three chedis of **Wat Phra Si Sanphet**. With time left, ride off the island to **Wat Chaiwatthanaram**.

      **Back.** The **15:00 Connex** (about 75 minutes, ฿50) gets you to Krung Thep Aphiwat by early evening; later Connex trains leave at **17:55** and **19:50**. Third class on a long-distance train is about ฿20 (15:39, 16:04, 16:41 or No. 102 at 18:59); No. 8 at 16:48 is second-class air-con only and costs more. Ferries stop around **17:30**; after that a tuk-tuk round by the bridge costs about ฿150.
