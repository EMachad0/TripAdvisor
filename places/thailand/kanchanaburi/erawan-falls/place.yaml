  - type: tips
    variant: insider
    items:
      - "**Fits your week:** a weekend. Best as Sat night in Kanchanaburi + Erawan on Sunday; a same-day trip from Bangkok works but costs 14 hours."
      - "Bus 8170 can also be flagged down on Highway 323 before the River Kwai bridge, handy if you sleep near the bridge."
      - "Over budget at R$112 from Bangkok? The park fee is most of it; staying in Kanchanaburi turns the bus legs into a separate travel day."
  - type: tips
    variant: pitfalls
    items:
      - "**No food beyond the second tier**, and every drink bottle carries a ฿20 deposit, refunded when you bring it back."
      - "Bring **cash** for the ฿300 fee. Erawan was in a 2023 pilot of **QueQ** app e-tickets (card or Thai QR); whether that still works for foreigners is unconfirmed."
      - "Weekends are busy. If you take the last bus up, you might reach the gate after the 15:30 cut-off."
