  - type: hero
    image: limestone-tier
    hook: "Water pours over mossy limestone into pools the colour of jade; fish nibble your feet while you swim."
    caption: "One of the seven tiers of Erawan Falls"
  - type: quick_facts
    time_needed: "3–4 h in the park"
    best_time: "Sunday; first bus from town"
    extra:
      - { label: Fits your week, value: "Weekend, best with 1 night", detail: "Sat Jan 2 → Kanchanaburi, Sun Jan 3 Erawan; or one very long Saturday" }
      - { label: Last entry, value: "15:30", detail: "Park closes about 16:30; last bus to town 16:30" }
  - type: highlights
    items:
      - title: Seven tiers, one trail
        text: "A wide, signposted path climbs **1.5 km** past all seven tiers. The top one is said to look like the three-headed elephant Erawan."
      - title: Swim in the pools
        text: "Several tiers have pools you can swim in. Changing rooms are near the first two; the **doctor fish** go for your toes."
      - title: Monkeys and monitor lizards
        text: "Crab-eating macaques are common, and water monitors up to 1.5 m laze by the streams. Harmless, but keep a couple of metres away."
      - title: A cheap local bus
        text: "Bus **8170** from Kanchanaburi costs ฿80 (R$13.19) and runs right to the park in about 1.5 hours."
  - type: prose
    title: Long day or overnight?
    text: |-
      **Overnight (recommended).** Take a bus to Kanchanaburi on **Saturday** afternoon, see the River Kwai bridge, sleep there, and catch the **08:00** bus 8170 to the falls on Sunday. You're on the trail by about 09:30, with time for every tier. Back on the **14:30** or **16:30** bus, then a bus to Bangkok in the evening. With your weekday night shifts it only fits a weekend: Jan 2–3, or Jan 9–10 if you're still in Thailand.

      **As one long day.** Possible, but tiring: a first-class bus from Bangkok's **Southern Bus Terminal** at about 05:00 (about 2 h, ฿110), the 08:00 bus 8170 to the park, a few hours at the falls and the 14:30 bus back to town, then a bus to Bangkok, home around 19:00 or later. That's about 14 hours, 7 of them on buses.

      **Not on a weekday.** You work until 04:00 on weekday nights, and the park lets nobody in after 15:30.
