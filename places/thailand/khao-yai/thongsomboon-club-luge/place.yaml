  - type: highlights
    items:
      - title: A real gravity kart
        text: "No motor: the kart rolls down a sloping track on gravity, and **you steer and brake** it yourself. Trip.com and Lovethailand both call it one of the park's most popular rides."
      - title: Chairlift back up
        text: "At the bottom you ride the **chairlift** back up the hill for the next run, over the track."
      - title: The rest of the ranch
        text: "A Wild West theme park in the Khao Yai foothills: ATVs, a flying fox, horses, a giant rolling ball, a dry sledge and BB guns, some in the same wristband."
      - title: A day trip, not a flight
        text: "**Rapid 135** leaves Bangkok at 07:10 for ฿85 and reaches Pak Chong at 10:43. Compare that with a ฿4,000 weekend in Chiang Mai for the long luge."
  - type: prose
    title: How it compares, and when to go
    dropcap: true
    text: |-
      **This is the short one.** Skyline Jungle Luge near Chiang Mai has a **2.1 km** run through the jungle and costs about R$670 with the trip north. Thongsomboon's luge is a hillside track with a chairlift, at a family ranch park, for under a third of the price and no overnight. Nobody publishes its length, and a July 2026 Google review found the karts worn and the helmets dirty. Come for the ride and a fun day out, not for a world-class track.

      **Sun Jan 3 is the day.** Take Rapid 135 at 07:10 from Krung Thep Aphiwat, then a taxi or Grab for the 4 km from Pak Chong station. You'll be there around 11:15: do the luge first, before the queues build. Want an earlier start? Special Express 21 leaves at 06:10 (Pak Chong 08:43, ฿310). Head back on Special Express 22 at 19:48 (Bangkok 22:15, ฿310) or the cheap Rapid 136 (฿85; 13:51 or 14:32 depending on the source, so check SRT). **Sat Jan 9** also works on paper, but you'd board at 07:10 straight after a shift that ends at 04:00, and it's Children's Day, with families and queues at a family park. A weekday doesn't fit: the only train that gets you back well before your 19:00 shift is Express 72 (11:18 or 12:08 depending on the source), about an hour after you'd reach the park, and you'd get no sleep after your 04:00 shift end.

      **Make it a weekend?** Pak Chong is the base town for Khao Yai National Park, so the luge can fit into a Khao Yai weekend (see the Khao Yai area card).

      **What ฿399 buys is unclear.** In 2024 the ฿399 ticket covered one ride plus free activities, and single rides cost ฿150–200. A March 2026 guide says ฿399 is a 3-hour unlimited wristband covering 13 activities. Neither says if the luge is in it. Ask at the counter. The other current tiers are ฿499 (with an ATV ride) and ฿999 (17 activities, 4 hours); a March 2026 visitor saw ฿339/559/999 boards.
