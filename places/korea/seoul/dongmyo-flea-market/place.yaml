blocks:
  - type: hero
    image: market-street
    hook: "A street market where you crouch over heaps of clothes, and a find can still cost ₩1,000."
  - type: quick_facts
    time_needed: 2–3 h
    best_time: "Sun 10 Jan midday, or a weekday afternoon (not Tue 12 Jan)"
    extra:
      - label: Bring
        value: Cash, ₩1,000 notes
        detail: Older stalls rarely take cards
      - label: Pile prices
        value: "From ₩1,000"
        detail: "Most pile clothes ₩1,000–5,000"
      - label: Good in cold
        value: Outdoors
        detail: Street stalls; duck into the bookshops and vintage stores
  - type: highlights
    items:
      - title: The clothes piles
        text: "Vendors dump clothes on the street and you dig, bent over, for a find. Prices **start at ₩1,000** a piece; one shop even sells clothes by weight."
      - title: Everything else
        text: "Watches, cameras, laptops, **vinyl and CDs**, razors, snacks near their sell-by date, military gear. Locals swap stories of rare albums bought here cheap."
      - title: Curated vintage too
        text: "If digging isn't your thing, shops like **Sold Out** (replica football kits) and **Vintory** hang the vintage on racks."
      - title: A shrine to Guan Yu in the middle
        text: "The market is named after **Dongmyo**, a Joseon-era shrine to the Chinese general Guan Yu from *Romance of the Three Kingdoms*, behind stone walls on the main street."
  - type: prose
    title: Seoul's own Seongsu, for grandparents
    dropcap: true
    text: |-
      The Korea Herald calls Dongmyo the baby boomers' answer to Seongsu-dong: a whole neighbourhood of secondhand clothes, antiques and junk that has turned cool again with the 1980s–90s revival. A SHINee member browsing it on the reality show *I Live Alone* brought the younger crowd.

      From Dongmyo Station's Exit 3 the main street starts right away, and side alleys branch off it. Shoppers range from their 20s to their 80s. A 750 m alley of stalls continues to the covered **Seoul Pungmul Market**, so you can walk from one to the other.

      Most foreign visitors never hear of it, and it is not polished. That's the point.
