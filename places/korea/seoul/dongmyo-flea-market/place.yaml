  - type: map
    zoom: 16
    note: "Come out of **Dongmyo Station Exit 3** and the market starts at once. The shrine walls are on the main street."
  - type: tips
    variant: insider
    items:
      - "Bring **cash** and small notes; older stalls are cash-first, and ₩1,000 notes make haggling easy."
      - "Bring a tote or a small bag on wheels: the black plastic bags tear when you buy too much."
      - "Seoul city's reporter says good stock arrives on **Saturday afternoon**."
  - type: tips
    variant: pitfalls
    items:
      - "Condition is random: check seams, zips and stains before you pay."
      - "Weekends and holidays get so crowded that bikes can't get through. Go early on a weekend, or accept a thinner, quieter weekday."
      - "The covered Seoul Pungmul Market next door is closed on **Tuesdays**."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry and freezing
    note: "Seoul's January averages are about 2 °C by day and −5.5 °C at night. You stand still a lot while digging through piles, which makes it feel colder. The bookshops and vintage stores are the warm stops."
    wear: Padded jacket, gloves you can take off quickly, comfortable shoes
