        detail: Big open courtyards, little shelter
  - type: highlights
    items:
      - title: The guard change
        text: "The Changing of the Royal Guard runs at **10:00 and 14:00** in front of Gwanghwamun, the main gate. A shorter gate-guard ceremony follows at 11:00 and 13:00."
      - title: Geunjeongjeon, the throne hall
        text: "The main hall, rebuilt in **1867**, is the largest main hall of any Joseon palace."
      - title: Gyeonghoeru on its pond
        text: "A banquet hall raised on an artificial island, first completed in **1412** and used to host dignitaries."
      - title: A palace still being rebuilt
        text: "About 500 buildings were sold off after 1910 and only 40 were left by 1945. Restoration has run since 1990 and is planned until **2045**."
  - type: prose
    title: Six centuries, burned down and rebuilt
    dropcap: true
    text: |-
      Gyeongbokgung was founded in **1395** as the first royal palace of the Joseon dynasty. It burned down completely in 1592 during the Imjin War. Reconstruction was ordered in 1865, and King Gojong moved in three years later.

      Under Japanese rule, from 1910, the palace's property was auctioned and almost all of its roughly 500 structures were sold and moved away. What you walk through today is partly original and partly a restoration that started in 1990. **Gwanghwamun**, the south gate, was put back in its pre-colonial state between 2006 and 2010.

      For a budget traveler it is hard to beat: **₩3,000**, no booking, and free guided tours in English.
