        local: 3000
        brl: 12.29
    note: "Free for visitors in **hanbok** (full outfit: top and bottom), on **Culture Day** (the last Wednesday of each month), and for ages 18 and under or 65 and over."
  - type: map
    zoom: 16
    note: "**Gyeongbokgung Station (Line 3), Exit 5** is signed for the palace and Gwanghwamun. The free tours start at the information center inside **Heungnyemun Gate**."
  - type: tips
    variant: insider
    items:
      - "**Free English tours**: a 2026 guide lists 11:00, 13:30 and 15:00 (an older one says 15:30), 60 to 90 minutes, no reservation under 10 people, meeting inside Heungnyemun Gate. Not on an official page I could read: confirm at the information center."
      - "Hanbok gets you in free, but the ticket is only ₩3,000. A coat alone doesn't count: the rules ask for a top **and** a bottom, worn properly."
      - "Culture Day, the last Wednesday of the month, is free. In January 2027 that is the **27th**, a week after you fly to Japan, so it doesn't help this trip."
  - type: tips
    variant: pitfalls
    items:
      - "**Tuesday is the closed day**, and the guard ceremony stops too. In your Korea days that means **12 and 19 January**."
      - "Last admission is **16:00** in January. On a work day (you sleep in the morning after the night shift), arrive by **13:30**: the English tour, the 14:00 guard change and the halls fit before closing."
      - "In heavy rain or snow the guard change may be cancelled. Gate duty then moves to Heungnyemun Gate, further inside."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry, freezing, about 7 snowy days in January
    note: "Seoul's January averages are 2.1 °C by day and −5.5 °C at night, and it sometimes drops below −10 °C. The whole visit is outdoors on open stone courtyards. On days of −10 °C or colder the guard change still runs in full, but fewer guards may stand watch. The palace closes at 17:00, so there is no evening visit in winter."
    wear: Padded jacket, hat, gloves, warm socks. You stand still for the ceremony
