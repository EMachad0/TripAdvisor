blocks:
  - type: hero
    image: round-table-room
    caption: "A Korea House dining room, ringed by lattice windows"
    hook: Nine courses from the Joseon palace kitchen, eaten in a hanok at a quiet midday table, with no stage in sight.
  - type: quick_facts
    time_needed: About 2 h
    best_time: "Tue–Sat, 12:00 (UTC+9)"
    extra:
      - { label: The meal, value: 9 courses, detail: "Porridge, abalone jeon, tteokgalbi, noodle hot pot, rib soup, hangwa" }
      - { label: Solo, value: "Yes, book 1 guest", detail: "Catchtable offered lunch slots for 1" }
      - { label: Out of place?, value: A little, detail: "A refined hanok dining room; neat casual is fine, no dress code published" }
  - type: highlights
    items:
      - title: Why go over the R$140 day
        text: "About **R$513**, almost four days of budget, for the one royal-court meal on this list. Dinner is ₩200,000, so lunch is the way in."
      - title: The court menu, course by course
        text: "The autumn lunch: pumpkin milk porridge, **abalone and shrimp jeon**, chicken and mung bean, seafood kimchi, **tteokgalbi**, a royal noodle hot pot, beef-rib soup with rice and side dishes, hazelnut sorbet, then **hangwa and tea**."
      - title: Serious food, no star price
        text: "Advisor chef **Cho Hee-sook** earned a Michelin star at her own Hansikgonggan; Korea House is one of six Seoul restaurants with **three Blue Ribbons** in the 2025 survey, and has no star."
      - title: No show at the table
        text: "Korea House is known for its dance troupe, but the dining page sells a meal only. The troupe performs on request, and no regular show is listed."
  - type: prose
    title: What it is
    text: |-
      Korea House is a government-run hanok complex in central Seoul. Its hanjeongsik follows Joseon **royal court** recipes, mixed with dishes from noble and common households, and is served course by course in a modern way.

      The menu changes each season. The PDF menu has **English** names for every dish, so you know what each plate is.
  - type: gallery
    images:
      - file: long-table-room
        caption: "A long-table dining room inside the hanok"
      - file: course-plates
        focus: center
        caption: "Plated courses as Korea House serves them"
      - file: main-hall
        caption: "The main hanok hall from the courtyard"
  - type: book_ahead
    steps:
      - days_before: 14
        text: "On Catchtable, choose a **Tue–Sat** January date, **1 guest**, and 12:00 (UTC+9). Pay the **₩50,000 deposit**; note any allergies in the request box."
      - days_before: 0
        text: "Arrive by 12:00 (UTC+9); the last lunch order is 13:00. The deposit is refunded on the spot and you pay the full ₩120,000."
