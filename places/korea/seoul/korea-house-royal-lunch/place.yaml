    note: "The ₩50,000 Catchtable deposit is refunded on site, not added."
  - type: map
    note: "From **Chungmuro** Exit 3 it's about three minutes on foot."
  - type: tips
    variant: insider
    items:
      - "Your free weekend days don't help here: it's **closed Sunday and Monday**. Use a work-day lunch: Tue Jan 12 – Fri Jan 15 or Tue Jan 19 (Sat 16 is your Hwacheon day)."
      - "Want a cheaper taste of Korea House? Its **Gohojae** tea room serves a one-person royal dessert tray for ₩30,000, booked on Catchtable."
  - type: tips
    variant: pitfalls
    items:
      - "Same-day changes are hard: the restaurant asks for allergies **in advance** and says substitutions on the day are difficult."
      - "Order by **13:00 (UTC+9)**; that's the last lunch order."
