  - type: highlights
    items:
      - title: Prices for locals, not tourists
        text: "A Seoul city reporter found **₩5,000 kalguksu** here in 2024, about half what a bowl costs elsewhere in the city. Croquettes and twisted doughnuts are ₩1,000."
      - title: Uirak's stuffed peppers
        text: "The stall that made the market famous in Korea: big fried stuffed chili peppers, **₩11,000–12,000 for 3**, with a cream makgeolli. Expect the longest queue."
      - title: Glazed fried chicken by the cup
        text: "Dakgangjeong in a walking cup for **₩4,000**, with a long list of glazes. Larger boxes are ₩9,000–16,000."
      - title: A neighbourhood, not a sight
        text: "Banchan by weight, rice cakes, kimchi and fruit for Mapo residents. Mangwon's cafés and the Han River park are a few minutes north."
  - type: prose
    title: Why come here instead of Gwangjang
    dropcap: true
    text: |-
      Gwangjang is the market tourists hear about. Mangwon is the one people living in western Seoul actually shop at. It was renovated into a tidy covered market, and young Seoulites cross from Hongdae and Yeonnam-dong for the cheap food.

      Graze instead of sitting down to a meal. Start with a croquette, queue for Uirak's peppers or a cup of chicken, finish with a hotteok. The street-food stalls at the entrance are busiest from about **14:00 to 18:00**.

      Locals carry market food to **Mangwon Hangang Park** and eat it by the river. In January that's a short, cold picnic, but the park is right there.
  - type: quote
    variant: vibe
    text: Steam off a kalguksu pot, a ₩1,000 croquette in a paper bag, and nobody trying to sell you anything.
