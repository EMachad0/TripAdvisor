  - type: tips
    variant: insider
    items:
      - "Come **mid-afternoon** on a work day. You'll eat before a 21:00 shift, and the entrance stalls are in full swing."
      - "Graze small: ₩1,000–4,000 items let you try five things for the price of one restaurant meal."
      - "After a Hongdae night out, it makes an easy recovery meal one stop away. Seoul's listing gives a 10:00 opening, but the food stalls get going later."
  - type: tips
    variant: locals
    items:
      - "Buy at the market and walk north to **Mangwon Hangang Park**. That's the classic local combo, even if winter keeps it short."
      - "Weekend afternoons bring crowds from Hongdae and Yeonnam-dong. Weekdays feel like a real neighbourhood market."
