  - type: highlights
    items:
      - title: The cheapest round in central Seoul
        text: "Draft beer (*saeng-maekju*) at about **₩4,000–5,000** and nogari at a couple of thousand won a stick. It's a standard after-work round for Seoul office workers."
      - title: Born in 1980
        text: "**Eulji OB Bear** opened here in 1980 among the tool and printing shops. Copycat hofs followed, and the street got its name from the snack. The original OB Bear was evicted from the alley in 2022."
      - title: Hipjiro upstairs
        text: "Unmarked cocktail and wine bars sit on 2nd to 4th floors above hardware stores. It's the reason locals now call Euljiro **Hipjiro**."
      - title: Manseon Hof, the beer hall
        text: "Spread across several buildings with a rooftop. Sometimes called Korea's Oktoberfest, it is listed as open until midnight."
  - type: prose
    title: How an evening goes
    dropcap: true
    text: |-
      On a work night, keep it to a hof stop from about 18:30 to 20:30. For the full crawl, pick Saturday 16 January (if you are not away in Hwacheon), since Sunday 10 January is the alley's quiet night. Start at one of the big hofs. Order a couple of **saeng-maekju** and a plate of **nogari**: young pollack, dried, grilled, then torn and dipped in a sweet-spicy gochujang-mayo sauce. It's chewy, salty and made for beer.

      After a round or two, move upstairs. Euljiro's hidden bars hide behind tiny lifts with handwritten floor numbers or dark stairwells next to closed metal shutters. Pick two or three on **Naver Map** beforehand, because walking around looking for them doesn't work.

      In January, be honest with yourself. The famous sea of street tables shrinks, and it's below freezing. You come for warm, packed indoor halls and the upstairs bars, not the summer street party.
