  - type: tips
    variant: insider
    items:
      - "Your free evening here is **Sat 16 Jan** (packed after 20:00, so arrive early). **Sun 10 Jan** is a Sunday, when many bars shut. Mon–Fri you work from 21:00, so only a short early hof stop fits."
      - "Save upstairs bars on **Naver Map** before you go. Look for a small lift with handwritten floor numbers."
      - "Keep going east to **Dongdaemun** if you want a late night. It stays open long after the alley quiets down."
  - type: tips
    variant: locals
    items:
      - "Locals pour for each other: fill your neighbour's glass, and hold yours with two hands when someone older pours."
      - "Keep it down on the street **after midnight** and don't sit on loading bays. Shopkeepers have complained about noise, and the district has cracked down before."
