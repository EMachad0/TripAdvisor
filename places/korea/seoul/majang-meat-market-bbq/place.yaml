      - label: Payment
        value: Prices posted by law
        detail: Cut, origin and price on every tray
  - type: highlights
    items:
      - title: The country's meat larder
        text: "About **3,000 shops** over 110,000 m². The market began as a livestock market in 1922 and is now a Seoul Future Heritage site. ZenKimchi says it supplies over 60% of Korea's beef."
      - title: Hanwoo without the restaurant markup
        text: "Every cut is labelled with grade and origin, and prices run **20–30% under** shops. iVisitKorea found top-marbled hanwoo for about ₩12,000 per 100 g, and you can bargain."
      - title: Buy downstairs, grill upstairs
        text: "Take your tray to a *sangcharim* (table-setting) restaurant on the 2nd or 3rd floor. For **₩4,000–6,000 a head** you get a charcoal grill and side dishes. The butcher will usually point you to one."
      - title: Cuts to ask for
        text: "**Kkotdeungsim** (ribeye), **anchangsal** (thin skirt, beefy and chewy), **salchisal** (flap) and **chaekkeut** (strip loin). Butchers sometimes throw in a little raw beef for yukhoe as 'service'."
  - type: prose
    title: How it works, and doing it alone
    dropcap: true
    text: |-
      Walk the halls first. Pork and beef shops are separate, and hanwoo specialists sit apart from imported meat. Point at a cut, ask the price per 100 g, and don't be shy about asking for a mixed tray (*gogi modeum*, 고기 모둠). Then take it upstairs. **Gogi Ingneun Maeul** (고기익는마을), at the West Gate on the 3rd floor, is run by the market's own co-op and certified by the city. In 2022 it charged ₩6,000 per adult.

      **Solo:** this is one of the few BBQ formats with no "two servings" rule, because you're not ordering servings at all. You pay one table fee and grill what you bought. The catch: butchers often pre-cut trays for two or three people, so ask for **about 200 g** (*이백 그램만 주세요*). Upstairs, order a **doenjang-jjigae** and ask the staff to drop in some of the fatty trimmings. iVisitKorea recommends it on a cold night.

      **Etiquette:** use the tongs and scissors provided, wrap bites in lettuce or perilla with ssamjang, and dip hanwoo in salt or wasabi. Good beef needs little more. Soju and beer are sold upstairs.
