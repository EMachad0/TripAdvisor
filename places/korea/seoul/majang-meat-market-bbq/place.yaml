  - type: tips
    variant: insider
    items:
      - "Ask the butcher where to grill. They often work with a restaurant upstairs and will point you to it."
      - "Want to compare prices? Buy one cut, grill it, and go back down for a second round. You've only paid the table fee once."
      - "Order a doenjang-jjigae upstairs and ask for the fatty trimmings to go in."
  - type: tips
    variant: pitfalls
    items:
      - "Don't come on **Sun Jan 17**: the 1st and 3rd Sundays are closing days."
      - "The famous old **Majang BBQ Beef Alley** has been torn down (ZenKimchi), so don't go looking for it. The market halls are the place now."
      - "Hanwoo adds up fast. Set a budget per 100 g before the butcher starts slicing."
