  - type: highlights
    items:
      - title: Half the old Seoul budget
        text: "**₩332,000** (R$1,406) for a dorm bed all 9 nights with breakfast, against the ₩480,000 plan."
      - title: Curtains and daily cleaning
        text: "Dark curtains, a lamp and a socket on each bunk; recent guests say rooms and showers are cleaned every day."
      - title: Hongdae on the doorstep
        text: "Booking.com guests rate the location 9.7. Hongdae's club streets are about 10 min on foot."
      - title: Straight from the airport
        text: "The AREX train from Incheon stops at Hongik Univ.; the host says the guesthouse is 4 min from Exit 6."
  - type: book_ahead
    steps:
      - days_before: 57
        text: "Book all 9 nights (11–20 Jan) in one booking on Booking.com: every night has a 2-night minimum. Pick the free-cancellation rate."
      - days_before: 15
        text: "Last day to cancel free is 27 Dec 2026 (free until 28 Dec on the 15 Nov search). Payment is due around 26 Dec."
      - days_before: 0
        text: "Land 08:40 UTC+9, take AREX to Hongik Univ. and leave your bag at reception (office from 08:30 UTC+9). Check in from 15:00 UTC+9 with your passport and card."
  - type: map
    note: "From Hongik Univ. Exit 6, 7 or 8 walk north into the lanes. Reviewers mention a small slope and uneven pavement with a suitcase."
  - type: tips
    variant: insider
    items:
      - "**Working 21:00–06:00 UTC+9 here:** silent laptop work in the lounge looks possible, but no source says it stays open all night. A spoken call there is only realistic before 00:00 UTC+9."
      - "**Mondays and Fridays (you speak):** after midnight take the call in a private room, quietly, or keep the dorm and step outside. Booking.com scores the wifi 9.4; carry mobile data as backup."
      - "**Sleeping 06:30–14:00 UTC+9:** in a dorm, roommates wake, pack and leave around you until 11:00 UTC+9. A private room is quieter, though a Dec 2025 guest found its walls thin too."
  - type: tips
    variant: insider
    items:
      - "Departure day (Wed 20): check out by 11:00 UTC+9 and leave your bag; collect it before 21:00 UTC+9. A June 2026 guest was charged ₩5,000 after that."
      - "Need privacy only on work weeks? Book a private room 11–16 Jan and 18–20 Jan and a dorm bed for 16–18 Jan: about ₩810,000 (R$3,431). Each booking needs at least 2 nights."
      - "For Saturday 16 Jan, join an organised Hongdae pub crawl: no review shows guests here going out together."
  - type: tips
    variant: pitfalls
    items:
      - "Don't confuse it with **Bunk Backpackers Guesthouse** (ex Crossroad Backpackers, 11-1 Wausan-ro 29da-gil), a separate listing run by another host. It is a real alternative: Booking.com 9.4 (903 reviews), same ₩332,000 dorm price for the 9 nights."
      - "The Hostelworld page (id 265891) is dormant: no beds on any date, no rating, newest reviews from 2022."
