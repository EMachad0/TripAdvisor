    rating:
      score: 8.9
      out_of: 10
      source: Booking.com
      reviews: 1735
      checked: 2026-11-15
    social:
      - "Guests meet at breakfast (08:00–10:00 UTC+9) and in the lounge: \"people socialise during breakfast\" (Oct 2025), \"it never gets lonely\" (Apr 2026)."
      - "\"Lots of opportunities to socialise with other guests. Not loud at nighttime\" (Irish guest, 6-bed mixed dorm, Oct 2025)."
      - "Winter 2025–26 reviews call it homey and quiet; Jan 2026: guests chatted happily in the lounge. No review mentions guests going out to clubs together."
      - "Most reviewers are Asian solo women in the female dorms, so the mixed dorm is a smaller crowd."
      - "The host's old Hostelworld text lists a Thursday Korean BBQ party (₩25,000) and a Tuesday tour. No 2025–26 review mentions either: ask on arrival."
      - "Booking.com says there is a pub on the ground floor and a rooftop terrace. No recent review mentions the pub."
    good_to_know:
      - "**Quiet hours** 00:00–07:00 UTC+9; rules on the lounge table ask for no talking after midnight (May 2026). Thin walls: rooms hear lounge talk."
      - "**Day sleep in a dorm** is the weak spot: breakfast 08:00–10:00 UTC+9, check-out 11:00 UTC+9, daily cleaning. Bring earplugs and an eye mask."
      - "**Wifi:** guests score it 9.4 on Booking.com, but no review describes speed. Keep a phone data plan as backup for calls."
      - "**Clean:** cleanliness 9.1 (Booking.com and Agoda), daily housekeeping. Complaints: dusty bunks (Apr 2026) and a smelly mixed 4-bed dorm (Dec 2024)."
      - "**Lockers** are in the room but small: bring your own padlock. Every room door has a code lock."
      - "**Card surcharge:** Booking.com says up to 5% for an overseas card paid on site; the host's Hostelworld text says 10%. Prepay on Booking.com."
      - "Two buildings, stairs only, no lift. Wobbly metal bunks in some rooms."
  - type: prose
    title: Your 9 nights, priced
    text: |-
      Booking.com, 1 adult, read 15 Nov 2026. Dorm bed in the 6-bed mixed dorm and the cheapest private room for one (twin with bunk bed):

      - **Mon 11, Tue 12, Wed 13, Thu 14 Jan:** dorm ₩36,000 (R$152.50) · private ₩100,000 (R$423.60) each night
      - **Fri 15, Sat 16 Jan:** dorm ₩40,000 (R$169.44) · private ₩134,000 (R$567.62) each night
      - **Sun 17, Mon 18, Tue 19 Jan:** dorm ₩36,000 · private ₩100,000 each night
      - **9 nights:** dorm **₩332,000 (R$1,406.35)** · private **₩968,000 (R$4,100.45)**

      The dorm is ₩148,000 (R$626.93) under the ₩480,000 plan; the private room is ₩488,000 (R$2,067.17) over it. Signing in to Booking.com Genius takes 10% off: ₩298,800 and ₩871,200.
