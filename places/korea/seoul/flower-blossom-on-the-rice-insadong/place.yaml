  - type: map
    note: "From **Anguk Station** Exit 6, walk into Insadong and turn into **Insadong 16-gil**."
  - type: tips
    variant: insider
    items:
      - "Book the **11:30 (UTC+9)** session: it runs to 13:20, long enough for eight courses before you rest for a night shift."
      - "On a tight budget, the lunch-only **bojagi bibimbap set (₩28,000)** gets you the signature dish; the wild-greens rice set (₩26,000) is the cheapest meal."
  - type: tips
    variant: pitfalls
    items:
      - "The kitchen says it can't remove core ingredients such as the five pungent vegetables (garlic, onion and kin), mushrooms or soy. For temple-style cooking, Sanchon is the one."
      - "Late by more than 20 minutes and the table is gone, with no refund."
