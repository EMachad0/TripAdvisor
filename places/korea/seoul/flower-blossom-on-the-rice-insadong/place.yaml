blocks:
  - type: hero
    image: dining-room
    caption: "The dining room, under the exposed beams of the old hanok"
    hook: "Course after course of organic Korean food, brought one plate at a time, down a quiet Insadong alley."
  - type: quick_facts
    time_needed: About 90 min
    best_time: "Lunch, 11:30 (UTC+9)"
    extra:
      - { label: The meal, value: 8 courses, detail: "Seasonal vegan dishes, bojagi bibimbap, dessert" }
      - { label: Solo, value: "Yes, book 1 guest", detail: "Catchtable offered lunch slots for 1" }
      - { label: Out of place?, value: "No", detail: "No dress code listed; a casual lunch crowd" }
  - type: highlights
    items:
      - title: A coursed tasting, not a full table
        text: "Where Sanchon lands 20 bowls at once, this one **paces** the meal: 8 courses built around the signature **bojagi bibimbap**, rice wrapped in an egg crepe like a cloth parcel, then dessert."
      - title: Ingredients are the point
        text: "Organic rice from named farmers, **wild greens** from Yanggu, soy sauce, doenjang and gochujang aged over a year, and no fish sauce or chemical seasoning."
      - title: Solo booking in English
        text: "Catchtable Global's page is in **English**, menu and prices included, and the party-size picker **starts at 1**."
      - title: The 'almost as good' tier
        text: "Its own site lists **Bib Gourmand for 2018–2025**, Michelin's value mark, not a star. Michelin's site doesn't list it now (Nov 2026). **4.4 from 3,100** Catchtable reviews."
  - type: prose
    title: How it differs from temple food
    text: |-
      Everything on the basic menu is vegan, but the restaurant says plainly it is **not temple cuisine**: garlic, onion and the other pungent vegetables are in. Think modern home-style Korean cooking with very good produce.

      Want meat or fish? The **Pulroman grass-fed beef course** (₩120,000) and the **Heuksando rockfish course** (₩85,000) are the same idea with a protein, but both cost more.
  - type: gallery
    images:
      - file: banchan-set
        caption: "A table setting: wrapped rice, soups and small side dishes"
      - file: jeon-plating
        caption: "A jeon course plated with spring flowers"
      - file: frontage
        caption: "The frontage on Insadong 16-gil, with its flower bed"
  - type: book_ahead
    steps:
      - days_before: 14
        text: "Open the Catchtable page, choose your January date, **1 guest** and the **11:30 (UTC+9)** session. Ask in the request box (or call +82 2 732 0276) that the **Vegan Full Course** is served at lunch."
      - days_before: 1
        text: "To change anything, call **+82 2 732 0276**; a no-show is not refunded."
      - days_before: 0
        text: "Arrive on time: the table is released after **20 minutes**. The second lunch session ends at 15:00 (UTC+9)."
  - type: menu
    title: Menu (per person)
    items:
      - { name: Vegan Full Course, price_local: 62000, price_brl: 264.99, note: "8 courses with the bojagi bibimbap and dessert", tag: signature }
      - { name: Vegan Half Course, price_local: 45000, price_brl: 192.33, note: "3 courses: wild-green bibimbap, thistle doenjang soup, hangwa", tag: veg }
      - { name: Bojagi bibimbap set, name_local: 보자기 비빔밥, price_local: 28000, price_brl: 119.67, note: "Lunch only; the one-dish taste of the place", tag: cheap }
      - { name: Heuksando rockfish course, price_local: 85000, price_brl: 363.29, note: "The vegan courses plus steamed rockfish" }
    note: "No source says outright that the courses are served at lunch; a Polle reviewer had the half course with the lunch-only bibimbap. Dinner on Sun 17 (Sat 16 is your Hwacheon day) is the sure option. English menu on Catchtable."
  - type: cost_breakdown
    items:
