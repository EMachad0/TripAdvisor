blocks:
  - type: hero
    image: wall-at-night
    hook: Floodlit stone battlements and the city's lights spread out below.
    caption: The lit wall path on top of Naksan Park, autumn evening
  - type: quick_facts
    time_needed: 1–2 h
    best_time: Sunset, then the first hour of dark
    extra:
      - label: Climb
        value: 124 m hill, gentle
        detail: The official site rates the Naksan trail the easy one
      - label: Fits a work day
        value: Yes
        detail: Dark before 18:00; you're back down well before 21:00
  - type: highlights
    items:
      - title: The wall, lit up
        text: "A stretch of **Hanyangdoseong**, the city wall first built in 1396, runs along the ridge. The stones change shape where each era rebuilt it. At dusk, lights set below the wall come on and light it up from underneath (Seoul city articles, 2021 and Aug 2026)."
      - title: Namsan Tower without the tower crowd
        text: "You said the best pictures are the ones away from the tower. Here **N Seoul Tower** is in the frame, seen from a free park with no queue. A 2021 city article notes trees hide part of the Namsan side, so walk along the wall to find a clear gap."
      - title: Seoul's "Montmartre"
        text: "The official City Wall site calls Naksan Park the Montmartre of Seoul for its sunset and night views. It's the lowest of the four inner mountains, so it's a walk, not a hike."
      - title: Two villages on the way
        text: "Walk up through **Ihwa Village**, painted with murals since 2006, or come back down outside the wall through **Jangsu Village**, a post-war hillside settlement that its residents saved from redevelopment."
  - type: prose
    title: How the walk goes
    dropcap: true
    text: |-
      Naksan is a 124 m hill on the east side of the old city. The official Naksan section of the City Wall trail runs 3.2 km from Hyehwamun Gate to **Heunginjimun**, Dongdaemun's great East Gate, in about an hour. The park sits on the top of it.

      The easy plan: Hyehwa Station Exit 2, then roughly 15 minutes uphill through the residential lanes of Ihwa-dong to the summit plaza. Be there before sunset, watch the city switch on, then follow the wall downhill south to Dongdaemun. The official site asks walkers to keep quiet for the residents of Bukjeong Village.
