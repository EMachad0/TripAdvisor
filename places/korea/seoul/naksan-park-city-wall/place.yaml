  - type: map
    zoom: 15
    note: "Up: **Hyehwa Station Exit 2**, 15 min on foot to the top. Lazy way up: Jongno Town Bus **03** from Dongdaemun Station Exit 5 to Naksan Junction. Down: follow the wall south to **Dongdaemun Station** (Lines 1, 4)."
  - type: tips
    variant: insider
    items:
      - "Go up via **Ihwa Village** and come down along the wall to Heunginjimun and Dongdaemun. That keeps the climb short and ends near dinner."
      - "The **Naksan Exhibition Hall** in the park covers the wall's history. One guide gives 09:00–17:00 but says to confirm at the gate, so treat it as a maybe before sunset."
  - type: tips
    variant: pitfalls
    items:
      - "The lanes are steep with stone steps. Wear flat shoes with grip; after snow, those steps freeze."
      - "People live right along the path. Keep your voice down, especially in Bukjeong Village."
