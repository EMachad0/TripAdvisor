    note: "Seoul's January averages are 2.1 °C by day and −5.5 °C at night, and you'll be standing still on an open hilltop after sunset. Cold, clear nights give the sharpest view. The trees are bare, so the wall and the city show more than in the summer photos."
    wear: Windproof jacket, hat, gloves, shoes with grip
