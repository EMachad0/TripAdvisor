    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry and freezing, some snow
    note: "January in Seoul averages −5.5 °C at night and 2.1 °C by day. The walk up the hill from the station is short but icy on snow days."
    wear: Padded jacket, hat and gloves; shoes with grip
