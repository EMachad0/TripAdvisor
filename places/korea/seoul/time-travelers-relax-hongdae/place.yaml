        note: "Private rooms are on the 2nd floor, \"so more quiet\" (listing). Only 1 single, every night"
    rating:
      score: 8.8
      out_of: 10
      source: Hostelworld
      reviews: 1329
      atmosphere: 8.9
      checked: 2026-11-12
    social:
      - "Dorms are **solo travelers only**, \"for making more friends when you travel\", says the listing."
      - "Owner DJ plays guitar and joins jam sessions on request; one review says he cooked ramen for the guests."
      - "2026 reviews: \"Social but respectful roommates\", \"Perfect place to meet fellow travelers\", \"chill and social if you want, but never rowdy\"."
      - "It is very small, so it is quiet rather than a party hostel. One Sept 2026 guest found no social vibe that week."
    good_to_know:
      - "**Night shifts:** no source says the common room is open all night. Walls are thin and dorms open onto reception, so day sleep can be hard."
      - "**Wifi:** \"I wish they had better wifi\" (Jul 2026). Bring a phone data plan as backup for work calls."
      - "**Curtains:** reviews disagree, from \"loved the privacy curtains\" to \"partial curtain\" and \"top bunks could have curtains\"."
      - "**Lockers** are in the room and cost ₩1,000 extra (May 2026 review)."
      - "Beds are metal bunks that creak (Oct 2026). Towels are for hire, no breakfast."
      - "One Oct 2026 review reports a **10% surcharge** for paying by card: bring cash."
  - type: highlights
    items:
      - title: A good bed at a low price
        text: "**₩29,412** (about R$122) for an 8-bed dorm on every weeknight 10–19 Jan, in walking distance of Hongdae."
      - title: A quiet room option for work weeks
        text: "The **single private room** (₩58,825) is on the quieter 2nd floor: worth it after the 21:00–06:00 shifts (11–15, 18–19 Jan), when you sleep through the morning."
      - title: Between two neighbourhoods
        text: "Five minutes to Hongik Univ. station (Line 2 and the airport train), and a short walk to Sinchon."
      - title: Clean bathrooms, owner on site
        text: "Recent guests call the bathrooms \"super clean\" and praise DJ's tips; cleanliness scores 8.6 on Hostelworld."
  - type: book_ahead
    steps:
      - days_before: 14
        text: "Book on Hostelworld. If you will sleep days on work nights, book the **single private room** for those nights and a dorm bed for the others. Fri 15 and Sat 16 Jan were not on sale on 12 Nov."
      - days_before: 1
        text: "Arriving after 21:00? Message the guesthouse: check-in ends at 21:00."
      - days_before: 0
        text: "Bring cash for the locker and to avoid the card surcharge."
  - type: map
    note: "From Hongik Univ. station walk east towards Sinchon; the last stretch is uphill."
  - type: gallery
    images:
      - file: trick-art-gate
        caption: The trick-art gate at 90-13, the guesthouse's street entrance
      - file: dorm
        caption: A bunk dorm with painted floor art
      - file: private-room
        caption: A private room with two floor-level beds
  - type: tips
    variant: insider
    items:
      - "Split the stay: a dorm bed on nights you sleep at night, the single private room on nights you work and sleep by day. Fri 15 and Sat 16 Jan were not on sale: plan another bed for those two nights."
      - "Hostelworld lists the lot address (275-3 Changcheon-dong); taxi drivers know the road address 신촌로1길 90-13."
  - type: tips
    variant: pitfalls
    items:
      - "Do not confuse it with **Time Travelers Party Hostel**, the same group's party hostel nearby, rated 7.0 on Hostelworld."
