    social:
      - "Staff are the social engine: \"they definitely set the vibe and made an effort to get to know everybody\" (Aug 2026)."
      - "A rooftop, a common room and a lounge are listed; \"Love the rooftop\" (Oct 2026)."
      - "\"Everyone staying there was also kind and friendly\" (Oct 2026), but another October guest wrote \"not the most social\"."
    good_to_know:
      - "**Night shifts:** check-in is a kiosk after 22:00, and no source says the lounge stays open all night or how fast the wifi is. Ask first."
      - "**Sleeping by day:** a pod gives you your own box with a reading light and plugs; reviews call the capsules roomy with good privacy."
      - "**Lockers** are free; luggage space by the pods is tight, with an extra storage area around the corner (Oct 2026)."
      - "Separate men's and women's toilets and \"so many showers\" (Oct 2026). Towels and linen included, no breakfast."
      - "Cards are not accepted at the property; ages 18–60 only. Lift to the 8th floor."
  - type: highlights
    items:
      - title: Your capsule night
        text: "A real **pod** in Seoul's nightlife district, so you can tick off the capsule stay without waiting for Japan."
      - title: Odd hours are fine
        text: "No curfew, and a **self check-in kiosk** after 22:00, so a late arrival is no problem."
      - title: Hongdae on the doorstep
        text: "Clubs, T1 Base Camp and street food are a walk away, and the **airport train** stops at Hongik Univ."
      - title: Brand new and spotless
        text: "Cleanliness scores **9.9/10**; the building is new, with modern fire safety, says the listing."
