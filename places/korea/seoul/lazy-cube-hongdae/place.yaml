  - type: map
    note: "The hostel is on the **8th floor** of 178 Donggyo-ro; take the lift up to reception."
  - type: tips
    variant: insider
    items:
      - "Message the hostel before booking work nights and ask whether the lounge is open 21:00–06:00 and how fast the wifi is."
      - "Your club night is Sat 16 Jan, exactly when a pod costs ₩81,900. Sleep in the capsule on weeknights (₩45,000) and pick a cheaper dorm for Fri 15–Sat 16 to save about ₩37,000 a night."
  - type: tips
    variant: pitfalls
    items:
      - "**Weekend trap:** the same pod is ₩81,900 (about R$340) on Fri and Sat nights, more than double a Time Travelers dorm bed."
      - "Hostelworld's room list says **taxes not included** while its house notes say included: check the total before paying."
      - "A 70-bed room means plenty of people coming and going. Bring earplugs and an eye mask if you will sleep after 07:00."
