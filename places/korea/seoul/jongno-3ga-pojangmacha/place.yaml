  - type: tips
    variant: insider
    items:
      - "Arrive **before 19:00** to get a stool on a weekday. After 21:00 on a Saturday, expect to wait for a table."
      - "Solo and on a budget: order skewers and soju, then share a plate if neighbours invite you in."
      - "Ikseon-dong's hanok alleys are a few minutes north. Walk them at dusk, then come back for the tents."
  - type: tips
    variant: pitfalls
    items:
      - "**Prices aren't on the menu**, and Trazy warns some owners quote foreigners higher. Ask *eolmayeyo?* (얼마예요?) before you order and again when you pay."
      - "Carry **cash** in ₩10,000 notes. Card acceptance is patchy."
      - "On a work night (Jan 11–15 or 18–19), soju before a 21:00–06:00 shift is a bad idea. Save it for **Sat Jan 16** or **Sun Jan 17** (your next shift starts Mon 21:00). Sun Jan 10, your arrival night, also has no shift after it."
