  - type: highlights
    items:
      - title: The K-drama scene, for real
        text: "The tarp tent where characters drink soju and spill secrets. Here it's a whole row of them, full of office workers, young Seoulites and, more and more, foreign visitors."
      - title: Seafood and drinking snacks
        text: "Live octopus (**산낙지**), sea squirt, sea cucumber, chicken feet, kimchi pancakes, and udon or ramyeon to finish. Menus differ by tent."
      - title: The coolest neighbourhood of 2026
        text: "Time Out ranked Jongno 3-ga **#1 coolest neighbourhood in the world** for 2026, naming these tents along with Ikseon-dong's hanok lanes."
      - title: A solo-friendly bar
        text: "Shared tables and stools pushed together. A 2026 report described groups at neighbouring tables chatting and joining each other, which helps when you're on your own."
  - type: prose
    title: How a tent night goes
    dropcap: true
    text: |-
      As it gets dark, the strip near **Exits 5–6** fills with red tents and plastic tables spill across the pavement. Some spots are vinyl-walled tents and some are open-air tables. In January you want the tent.

      Drinks usually come first, then **anju**, food meant to go with them. A pot of fish-cake skewers in broth is the cheapest start. The seafood plates are the splurge. Prices are rarely written down and vary by tent, so point, ask *eolmayeyo?* (얼마예요?) and agree before you order.

      In September 2026 the Seoul Shinmun found 2–3 of every 10 customers on the Donhwamun-ro 11-gil strip were foreign tourists. The district now sends safety staff to keep tables inside marked lines until late. It's still a local drinking street, just a famous one now.
