    conditions: Freezing nights, dry wind, occasional snow
    note: "At night it's well below zero. Pick a **vinyl-walled tent**, where the burner and the crowd warm the air, over a pavement table. It's the classic winter-night drink in Seoul."
    wear: Heaviest jacket, hat, gloves. You'll sit still for hours
