  - type: highlights
    items:
      - title: A free night view
        text: "The plaza, the terraces around the tower, the love-lock terraces and the outdoor viewing platforms cost **nothing**. A guide checked in October 2026 calls the hour after sunset the best."
      - title: Three ways up
        text: "On foot through Namsan Park (free), on bus **01A or 01B** (₩1,500, transport card only), or on the cable car from near Myeongdong (₩12,000 one way)."
      - title: The observatory, if you want glass and heating
        text: "**₩29,000** buys the enclosed decks inside the tower. In January wind that is the warm way to see the same city."
      - title: The tower tells you the air quality
        text: "After sunset the tower is lit by fine-dust level: blue is good, green average, yellow bad, red very bad. Yellow or red also means a hazier view."
  - type: prose
    title: How to do it on a budget
    dropcap: true
    text: |-
      Namsan is the wooded hill in the centre of Seoul, and N Seoul Tower stands on its summit. The main structure is 236 m tall and opened to the public in 1980. Private cars can't drive up, so everyone arrives on foot, by loop bus or by cable car.

      The cheap plan is simple. Ride bus **01A or 01B** from Chungmuro Station Exit 2 or Dongguk University Station, get off at the tower, and spend the evening on the free terraces. The buses run 06:30–23:00.

      The **cable car** is a 3-minute ride, runs 10:00–23:00 and costs ₩15,000 return. Its lower station is a walk from Myeongdong Station Exit 3; the tower's site says 10 to 15 minutes. Whether the observatory is worth ₩29,000 on top is your call. That is most of a day's R$140 budget for a view you largely get outside for free.
