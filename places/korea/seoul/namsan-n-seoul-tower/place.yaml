    note: "Walking up through Namsan Park is free. The cable car and the observatory together come to ₩44,000, about R$180, which is more than the R$140 daily budget."
  - type: map
    zoom: 15
    note: "Bus: **Chungmuro Station Exit 2** or Dongguk Univ. Station, then 01A or 01B. Cable car: **Myeongdong Station Exit 3**, then the street to the right of the Pacific Hotel. The free **Namsan Oreumi** incline lift near Namsan Tunnel 3 also reaches it (09:00–23:00, shut Mondays until 14:00)."
  - type: tips
    variant: insider
    items:
      - "**Cheaper night view:** Naksan Park, by Hyehwa Station (Line 4, Exit 2), is free and open 24 hours. The old city wall is lit from below and the city spreads out under it. It is a 10 to 15 minute uphill walk through Ihwa-dong."
      - "Check the tower's colour from the city before you go up. **Blue or green** means clear air; on a yellow or red night the view is hazy and the ₩29,000 is poorly spent."
      - "The cable car's own site says mornings are quieter and that weekends and holidays mean longer waits."
  - type: tips
    variant: pitfalls
    items:
      - "The loop bus takes a **transport card only**, no cash."
      - "The cable car can be **suspended in strong wind** and may close early in bad weather. Check its status before walking up to the station."
      - "The main footpaths are lit, but a guide checked in October 2026 calls the bus the easy way down on a cold, dark evening. At Naksan the sloped alleys ice over in winter."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry, freezing, windy on the summit
    note: "Seoul's January averages are 2.1 °C by day and −5.5 °C at night, and you'll be on an exposed hilltop after dark. It gets dark early: January sunset is around 17:35. That makes the night view easy to fit before dinner. The paid observatory is heated; the free terraces are not."
    wear: Windproof jacket, hat, gloves, shoes with grip for icy steps
