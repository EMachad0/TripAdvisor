  - type: highlights
    items:
      - title: The top of Seoul
        text: "**Baegundae** (836 m) is the city's highest point. The Korea Herald describes a line of hikers waiting on bare granite to pose by the flag at the summit."
      - title: A real scramble
        text: "From **Baegunbongammun**, a 1711 fortress gate, the last 20 minutes are a rock scramble on footholds cut into the stone, holding steel rails. Not technical, but people afraid of heights find the way down just as hard."
      - title: Gear for a few dollars
        text: "The **Seoul Hiking Tourism Center** rents gear to foreign visitors. The Korea Herald says boots, jackets, pants, hats, bags and poles cost **$2 to $5**. KoreaToDo says crampons are on the list too, but I found no price for them."
      - title: Korea's first mountain hut
        text: "On the way up you pass **Baegun Shelter** at about 650 m, whose history goes back to 1924. If the top is iced over, it's a fine place to turn around."
  - type: prose
    title: Is it a good idea alone in January?
    dropcap: true
    text: |-
      Honest answer: yes, if you're a fit hiker, have crampons and go on a clear weekday, and no if it has just snowed and you've never walked on ice. The Seoul Tourism Guide (Nov 2026) says that in winter the snow-covered granite slabs turn technical, crampons are recommended for the summit section, and the hike is for experienced hikers only. KoreaToDo says the same about footwear on snow and ice.

      The safety net is good for a city mountain. About 240 numbered location signs stand every 200 to 500 m: read the number to **119** in an emergency. A park rescue team is on standby 24 hours a day. On the day the Korea Herald went up, a park official said more than half the hikers were foreigners: you won't be the only one.

      **The gentler plan**: climb as far as Baegun Shelter or Baegunbongammun, have your snack, enjoy the ridges, and come back the same way. Or take the easier valley and "main road" loop from the **Bukhansanseong** entrance (Gupabal Station, Line 3, then bus 34/704/8772), which KoreaToDo calls relatively easy.
