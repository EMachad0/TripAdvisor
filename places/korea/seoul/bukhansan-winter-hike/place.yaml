  - type: tips
    variant: insider
    items:
      - "Get gear first: the **Hiking Tourism Center** opens at 09:00 (closed Mondays). Rentals are for foreign visitors (and Koreans hiking with them)."
      - "The Seoul Tourism Guide says to avoid weekends: there is a queue at the summit scramble. Your rested weekdays are **Mon 11 and 18 Jan**, but the rental centre is shut Mondays: buy slip-on crampons on the way. Sat 16 – Sun 17 Jan is planned for Hwacheon: a weekend hike means dropping it."
      - "Coming down past **Doseonsa**, a temple founded about 1,100 years ago, is how the Korea Herald's route comes down, on the Ui side."
      - "Pack lunch and water: the Seoul Tourism Guide says there are no food vendors past the trailhead."
  - type: tips
    variant: pitfalls
    items:
      - "Plan to be down early. One guide (KoreaToDo) gives winter trail hours of **04:00–16:00** and says night hiking is banned, and sunset is only about 17:32–17:42 on 10–20 Jan. Being caught on icy granite in the dark is the real danger."
      - "Ice on the steel-rail section is the real risk. If it's glazed and you have no crampons, stop at Baegunbongammun."
      - "On a Monday the Hiking Tourism Center is shut, so check the trail notices on knps.or.kr the day before for ice or closures."
      - "No rental slot? KoreaToDo says the hiking shops on the way to the park entrance sell affordable slip-on crampons."
