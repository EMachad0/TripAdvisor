    items:
      - "**Don't lock days for a match yet.** The 13 January start is an estimate from two past seasons. Decide after Riot publishes the 2027 schedule. With sales opening 9 days ahead (2026 rule), a 16 Jan match would go on sale around 7 Jan, while you are still in Thailand."
      - "The Korea Times says LCK tickets sell out in seconds. A fan guide says T1 fan-zone seats go within a minute."
      - "A 2026 guide lists the Riot Store and LCK shop as open **Wednesday to Sunday** only, from 14:00. On a Monday or Tuesday you may find just the PC bang."
