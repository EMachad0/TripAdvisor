  - type: hero
    image: arena
    hook: A circular stage under three giant screens, with only a few hundred seats around it.
    caption: Inside the LCK Arena at LoL Park (photo from an earlier season)
  - type: quick_facts
    time_needed: Half a day on a match day
    best_time: "Wed 13 – Fri 15 Jan, first match"
    extra:
