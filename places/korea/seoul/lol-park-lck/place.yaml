        value: About 450 seats
        detail: Tickets are reported to sell out in seconds
      - label: Without a ticket
        value: Lobby, store, PC bang
        detail: Open on non-match days too
  - type: highlights
    items:
      - title: The home of the LCK
        text: "The arena has hosted Korea's League of Legends league since **September 2018**. It holds about **450** people around a circular stage."
      - title: A T1 match, if the dates line up
        text: "In 2026 T1 played its first LCK Cup match in the opening week, at this arena. The 2027 schedule is **not out yet**."
      - title: Worth a visit on a quiet day
        text: "The lobby has an LCK exhibition with team jerseys, player statues and the trophy, plus a Riot Store and an LCK shop."
      - title: A PC bang next to the arena
        text: "The Riot Games PC Bang seats about 100 and is open 24 hours. VisitKorea listed it at **₩1,500 an hour** in 2024."
  - type: prose
    title: Is there a good opportunity?
    dropcap: true
    text: |-
      Probably, yes. The year opens with the **LCK Cup**, which began on **15 January 2025** and **14 January 2026**, both Wednesdays. If 2027 follows the pattern, the first matches fall around **Wednesday 13 January**, in the middle of your Korea stay (10–20 Jan). That date is an estimate, not an announcement. In 2026 matches ran Wednesday to Sunday, and T1 played Hanwha Life on 16 January, the third day.

      **Which days fit your shifts.** Sat 16 – Sun 17 Jan is planned for Hwacheon, so the realistic slot is a work-day afternoon, **Wed 13 – Fri 15 Jan**. In the 2025 regular season the first weekday match started at **17:00**. No source gives the January Cup's weekday times or format, so check the 2027 Cup schedule: an early first match should leave time to get back before your 21:00 shift, a late second match won't. A weekend T1 match (17:00 start in 2026) would mean moving Hwacheon to the other weekend day.

      **The price.** January matches are LCK Cup games, and two guides put 2026 Cup group-stage seats at about **₩40,000 on weekdays and ₩50,000 at weekends**, double the regular season. That is more than a day of your R$140 budget; for a T1 fan who came to Seoul partly for T1, a live Faker match is the one splurge that makes sense.

      **The commentary.** If Korean casting loses you, the official **English broadcast** is on LCK Global (YouTube) and the LCK Twitch channel, so you can follow it on your phone with earbuds while watching the stage. Even without the commentary, a T1 crowd is the show.

      There is one more thing to watch. The league held a season-opening all-star show at this arena on **9 January 2026**, with Faker, Oner and Keria playing. No source says whether it returns in 2027, on which day, or whether fans can buy seats; if it falls on Sun 10 Jan, your arrival day, it might fit.

      Without a match, LoL Park is still worth an hour for a fan: the exhibition, the stores, the PC bang and Cafe Bilgewater.
