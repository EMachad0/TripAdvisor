blocks:
  - type: hero
    hook: "A robe, a quiet room on the sixth floor of a Gangnam hotel, and 60 to 90 minutes of nobody needing you."
  - type: quick_facts
    time_needed: "1.5 h with changing"
    best_time: "Sun 17 Jan, any hour"
    extra:
      - { label: Slot, value: "Afternoon, done by 20:00", detail: "Work days 11–15, 18, 19 Jan: start by 18:00. Sun 17 Jan: 10:00–22:00" }
      - { label: Choose, value: "Korean, Swedish, deep tissue", detail: "Aroma Korean, Swedish or Lux Deep Tissue, all the same price" }
      - { label: Tip, value: "None", detail: "Korea's culture is tip-free (Korea Times)" }
  - type: highlights
    items:
      - title: A real full-body massage
        text: "Three styles on the menu: **Aroma Korean** works points along the meridians; **Swedish** uses \"long and smooth strokes\" for relaxation; **Lux Deep Tissue**, the house signature, mixes acupressure with deep-tissue work on knotted muscles."
      - title: Published price, VAT in
        text: "**₩175,000 for 60 min, ₩264,000 for 90 min**, the same for every style, and the site says all prices include 10% VAT. No menu handed over in a back room."
      - title: A hotel spa since 2010
        text: "IN SPA has run since 2010 and sits on the 6th floor of the **Four Points by Sheraton** in Sinsa-dong; the hotel lists it as its own spa. Its Westin Seoul Parnas branch is closed; the site says it is reopening soon."
      - title: Couples and men welcome
        text: "A WAUG review from Oct 2026 is a couple who came **for the husband's birthday**. Nothing on IN SPA's site limits it to women."
  - type: prose
    title: The legal version of what you liked in Bangkok
    dropcap: true
    text: |-
      In Bangkok you had nuru and soapy houses. Korea's equivalents are the **"Swedish" (스웨디시), 건마 and one-person aroma shops** that sell a sexual finish after the oil. In Korea that is prostitution for the client too: the Supreme Court counts manual relief at a massage parlour as a "similar sex act" under the 2004 Act. In 2026 police broke up exactly this kind of operation: a ring selling sex as "Swedish massage" from 33 Gangnam studios (Korea Herald, Oct 2026).

      So this card is what is left when you take the "extras" out: the best part of a nuru session that you can legally buy. A long full-body massage in a private room in a proper hotel spa. For the closest thing to the warm-oil part, ask for the **Aroma Korean** style.

      **Which day:** Sun 17 Jan is the easy pick, any time from 10:00. On a work day (11–15, 18 or 19 Jan) take a 60-minute slot that starts by 18:00, so you are home well before your 21:00 shift. It also works as a jet-lag fix on the afternoon of Mon 11 Jan, the day you land. Sat 16 is the Hwacheon day trip; the spa is open until 22:00, but no source gives a last booking time.

      **This is a one-off splurge.** At ₩175,000 (about R$757) one hour costs more than five days of your R$140 "everything else" budget. The **WAUG voucher lists US$124.69 (about R$721, ≈₩166,600)** before a 3% coupon that may end before January, and it doesn't show which length that buys, so confirm the 60-min price for your date; the spa's own online price is US$133 (R$769), and paying at the desk is ₩175,000. For ₩65,000 less, take the **Nanda Aroma** card in Myeongdong (aroma oil 60 min, ₩110,000).
  - type: book_ahead
    steps:
      - { days_before: 3, text: "Message IN SPA on **KakaoTalk (inspadesk)** or **WhatsApp (82-10-4276-0553)**: day, time, 60 or 90 min, and which style (Korean, Swedish, Lux Deep Tissue)." }
      - { days_before: 2, text: "Once they confirm, pay the **US$40 deposit** on the official reservation page, or pay the 60-min massage (US$133) there." }
      - { days_before: 0, text: "Arrive **10 minutes early** at the 6th floor. You change into a robe and disposable underwear the spa provides." }
  - type: cost_breakdown
    items:
      - { label: "Full-body massage, 60 min, at the desk (VAT incl.)", local: 175000, brl: 757.23 }
      - { label: "90 min instead (difference)", local: 89000, brl: 385.1, optional: true }
  - type: map
    note: "Search **포포인츠 바이 쉐라톤 서울 강남** in Naver Map or Kakao Map; take the lift to the **6th floor**. The hotel is at the north end of Garosu-gil."
  - type: tips
    variant: insider
    items:
      - "All three styles cost the same, so pick by feel: **Aroma Korean** for the aroma-oil hour, **Swedish** for long, smooth strokes, **Lux Deep Tissue** if your back is wrecked from night shifts."
      - "Check the **WAUG voucher** (US$124.69 base, about ₩8,000 under the desk price if it covers 60 min) before paying ₩175,000 at the desk; then book your slot with the spa by phone, KakaoTalk or email, as the voucher instructs."
      - "Leave the phone in the locker: the house rules ban phones, cameras and tablets during your visit."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** Korea's Act on the Punishment of Acts of Arranging Sexual Traffic (Art. 21) punishes the *buyer*: up to 1 year in prison or a ₩3M fine. It covers manual and body 'extras' (Supreme Court, 2005도8130), so 'Swedish', 건마 and one-person aroma shops that sell them are out."
      - "**Foreigners** get no pass: on top of a fine, immigration can issue a departure order or an entry ban (Seoul Law Group, KLawGuru)."
      - "**Why this one is legal:** a hotel spa with a public price list that sells massage only. Its own rules say the therapist will stop the treatment if a guest behaves inappropriately."
      - "**Cancellation:** a no-show or cancelling within 24 hours costs 100% of the treatment (spa's etiquette page)."
      - "**Book only on the spa's own channels** (site, KakaoTalk, WhatsApp, phone). Online listings for 'Swedish' and aroma rooms in Gangnam are how the ring the police broke up in 2026 found clients (Korea Herald)."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: "Dry and freezing; snow possible"
    note: "January in Seoul averages about 2 °C by day and −5 °C at night. The spa is indoors and heated; the cold only hits on the 750 m walk from Apgujeong station."
    wear: "A warm coat for the walk; the spa gives you a robe"
  - type: pairs_well
    items:
      - { id: lion-super-club-cheongdam, note: "Same side of the river, if Sat 16 or Sun 17 turns into a night out" }
      - { id: sparex-dongdaemun, note: "The cheap Korean version: a 24-hour jjimjilbang soak for about ₩10,000" }
