      - title: The ₩1,000 hour
        text: "The price has not changed since the rink first opened in **2004**. In 2025/26 it covered one hour on the ice with skates and a helmet."
      - title: Right in front of City Hall
        text: "The rink is built on Seoul Plaza every winter. In spring the lawn comes back."
      - title: Skating after dark
        text: "Last season the final session ran **20:30–21:30** on Sunday to Friday, and **22:00–23:00** on Saturdays and public holidays."
      - title: Where Seoul goes in winter
        text: "The 2025/26 season counted **180,701** skaters in 52 days, about 3,475 a day. Expect company on the ice."
  - type: prose
    title: How a session works
    dropcap: true
    text: |-
      This is last season's system. Seoul has announced only the reopening date for 2026/27, **Friday 18 December 2026**, so check the rules again in December.

      You buy a ticket for one numbered session. Sessions started at 10:00, 11:30, 13:00, 14:30, 16:00, 17:30, 19:00 and 20:30, with a ninth at 22:00 on Saturdays and public holidays. Each lasted one hour, and the ice was resurfaced after every session. On your work days, take the **16:00 or 17:30** session (the lights come on around sunset); 19:00 is the latest that leaves time before a 21:00 shift.

      Half the tickets were sold online from seven days ahead, the other half at the box office on the day. The city press material lists the official site as seoulskate.kr.

      The city says the rink can stop for bad air (fine-dust alerts), snow or rain. People who booked online got a text message, and the box office screens showed the status.
