  - type: highlights
    items:
      - title: A temple older than Seoul's palaces
        text: "Founded in **794** in the Silla kingdom and renamed Bongeunsa in 1498. It keeps 3,479 Buddhist scriptures, including works by the calligrapher **Kim Jeong-hee**."
      - title: Drop-in tea on Tuesdays
        text: "**Bong-pass** opens the Templestay hall to anyone for ₩5,000: tea, a try at meditation, a quiet room. No guide, no timetable, come and go."
      - title: Ring the bell on Sunday evening
        text: "**Twilight Resonance** starts with a 17:00 temple tour, then the Buddhist ritual instruments and the evening service. ₩5,000."
      - title: Gen Z's wish-making temple
        text: "Young Seoulites now come to pray for money: coins tossed at a statue in a pond, three laps round the giant **Maitreya Buddha**, and a sold-out *moktak* keyring that clicks when pressed."
  - type: prose
    title: Monks, Gangnam and a lottery prayer
    dropcap: true
    text: |-
      Bongeunsa sits just north of COEX, the mall and convention centre. Step through the gate and the traffic fades. Monks still hold morning and evening services here, and the grounds are free from 05:00 to 22:00.

      In 2026 the temple became an unlikely **Gen Z hot spot**. The Korea Times found it packed with people in their 20s and 30s in October, many there to ask for good fortune with money. Rumours that the head of Samsung visits fed the trend. The temple's *gongdeok* keyring, a tiny wooden-block drum that clicks, sold 2,000 units in two and a half hours.

      For a visitor, the best way in is one of the temple-life programs on **Templestay.com**, listed in English and aimed at foreign visitors. Your one free Sunday in Seoul is **Sun 10 Jan**, the day you land from Bangkok (the 16–17 Jan weekend is planned for Hwacheon), and the 17:00 bell-and-evening-service program fits that evening if your flight lands by mid-afternoon. On a work week, Tuesday's drop-in Bong-pass fits an afternoon.
