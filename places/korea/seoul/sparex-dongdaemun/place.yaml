  - type: tips
    variant: insider
    items:
      - "Buy the **night voucher** online before you go and scan it at the kiosk: pick your language, scan the QR code, give the printed slip to the counter."
      - "Bring **shampoo and conditioner**, or buy single-use ones inside. For a body scrub, bring your own scrub towel if you'd prefer not to share one."
      - "Travelling with a big bag? Large items that don't fit a locker are checked at the counter, free while you are inside."
  - type: tips
    variant: pitfalls
    items:
      - "**Don't count on a full night's sleep.** The night ticket runs 19:00–05:00 (from 1 Dec 2026), and one reviewer was unable to sleep on past 05:00. Ask at the counter what staying until morning costs."
      - "The men's bath is cleaned **00:30–01:30** (women's 03:00–04:00). Shower before or after."
      - "Leave cash and valuables at the front counter. A lost locker key costs **₩20,000**."
      - "No outside food or drink, and no re-entry once you walk out."
