  - type: highlights
    items:
      - title: Open now, and used to foreigners
        text: "Four ticket sites sell it for same-day use, with reviews up to **October 2026**. The entry kiosk has a language menu, one listing marks English as available, and a reviewer says the front desk speaks Chinese."
      - title: Hanok-style inside
        text: "The interior is built like a traditional Korean house in natural wood. Listings describe dry and wet saunas, an ice room, a clay room, a food court and sleeping areas."
      - title: The snacks are part of it
        text: "The classic pair is **sikhye**, a sweet rice punch served slushy, and eggs roasted on hot stones."
      - title: A bed-free night, with a catch
        text: "It never closes and has a sleeping hall, so you can stay the night. A reviewer in October 2026 found the women's sleeping room packed on a Saturday night."
  - type: prose
    title: How it works, as far as the sources say
    dropcap: true
    text: |-
      Sparex is in the basement of the **Goodmorning City** mall. Take Exit 14 of Dongdaemun History & Culture Park Station, enter the building on your left through Gate 1, and ride the lift down to **B3**. The listings all note that the escalator is not running.

      Pay at the counter, or scan a voucher at the kiosk and hand the printed slip to the staff. You get a **locker key** and a set of **jjimjilbang clothes**, plus a towel. Baths and showers are separate for men and women. The heated rooms, food court and sleeping hall are shared, and there you wear the clothes you were given.

      From 1 December 2026, tickets are sold as **day (05:00–19:00)** or **night (19:00–05:00)**; before that the switch was at 20:00. Creatrip says that if you buy a day pass and visit during night hours, you pay an additional fee on site. Once you leave you can't come back in.
