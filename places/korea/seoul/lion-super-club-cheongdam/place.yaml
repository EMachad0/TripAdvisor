      - title: The ranked one
        text: "**DJ Mag's Top 100 Clubs 2026** has Lion at #57, a new entry, and no other club from Seoul. It is the one to pick if you want a famous night."
      - title: Foreign DJs on Fridays
        text: "The **GLOBAL CALLING** series brings DJs from abroad (CamelPhat, Danny Avila and Kasablanca were booked for Nov 2026). Other nights go to Korean labels, trance and hard techno."
      - title: Two drinks in the cover
        text: "A regular night is **₩30,000 at the door or ₩25,000 in advance, with two drinks included**, according to NightFlow. That is less than one cocktail at many clubs back home."
      - title: Small enough to dance
        text: "Techno Airlines gives the capacity as **700**. That is far smaller than Octagon's 3,000, so the room is full, not endless."
  - type: prose
    title: What happened to Octagon?
    text: |-
      For a decade, the answer to "Seoul's famous club" was **Octagon**, a 3,000-person basement in Nonhyeon-dong that regularly made DJ Mag's list. NightFlow's October 2026 check found that Korean references list it as closed since 2020 and that there is no dated news of a reopening. Promoter pages still sell "Octagon" tables, so ignore them.

      In 2026, Lion is the Seoul club on DJ Mag's list. It is a Gangnam night: dress up a little, carry your passport, and expect bottle tables (NightFlow lists a ₩1,400,000 minimum spend per group) next to a floor where a ticket and two drinks are enough.

      **For your dates:** in your Korea days (10–20 Jan) the club nights are Thu 14, Fri 15 and Sat 16 Jan. Thu 14 and Fri 15 are work nights (your shift runs 21:00–06:00), so **Sat 16 Jan** is the one that works: no shift that night or on Sunday. Check @lionseoul on Instagram for the line-up a week or two before.
