  - type: map
    zoom: 16
    note: "**Dongdaemun History & Culture Park Station** (Lines 2, 4, 5) connects straight into DDP. The 365 Light show is by the relic display at **Eoullim Square** (어울림광장)."
  - type: tips
    variant: insider
    items:
      - "The shows start **on the hour and the half hour** and last about 5 minutes. Arrive at 17:50 and you get dusk on the panels and then the first show."
      - "The **Design Market** inside is open 24 hours, a warm place to duck into between shows."
      - "Walk to **Heunginjimun**, the great East Gate (Dongdaemun Station Exit 6 or 7), and climb the city wall to Naksan Park for the night view."
  - type: tips
    variant: pitfalls
    items:
      - "The paid exhibitions inside are the only thing here that costs money. The building is the attraction; you don't need a ticket."
      - "The city says the 365 Light schedule **may change**. Check ddp.or.kr on the day."
