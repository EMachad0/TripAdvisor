  - type: hero
    image: night-curves
    hook: A building with no straight lines, glowing silver in the dark.
    caption: DDP's aluminium skin lit up after dark
  - type: quick_facts
    time_needed: 1–2 h
    best_time: 17:45, for dusk and the 18:00 show
    extra:
      - label: Light show
        value: "Every 30 min, 18:00–22:00"
        detail: DDP 365 Light, about 5 min, open-air (Nov–Feb times)
      - label: Fits a work day
        value: Yes
        detail: Catch the 18:00 or 19:00 show, home before a 21:00 shift
  - type: highlights
    items:
      - title: Zaha Hadid's curves
        text: "Designed by **Zaha Hadid** with Samoo and opened in March 2014, the main building is 280 m long, with no straight edges and a skin of aluminium panels."
      - title: Walk on the roof
        text: "There's a walkable park on its roofs, with grass slopes, so you can wander over the building as well as through it."
      - title: A laser show every night
        text: "**DDP 365 Light** is an open-air show of lasers, video and sound at Eoullim Square, every 30 minutes 18:00–22:00 from November to February. No ticket is mentioned; the city listed the same laser piece as free in its autumn festival."
      - title: The old city wall underneath
        text: "Building it uncovered pieces of old Seoul: the **Igansumun** water gate of the city wall and the remains of a Joseon military office sit in the Dongdaemun History & Culture Park, part of the complex."
  - type: prose
    title: What January looks like
    dropcap: true
    text: |-
      DDP was built where Dongdaemun Stadium stood, in the middle of Seoul's wholesale fashion district. During the day it's a silver landscape of ramps and curves; at night the panels glow and the building really looks like the spaceship people call it.

      The city's big winter festival, **Seoul Light DDP 2026 Winter**, which projects art onto the facade, starts on 17 December and ends with a New Year countdown. One listing gives 1 January 2027 as the last day, so it ends before you reach Korea on 10 January. What you'll get is the permanent **DDP 365 Light**, an outdoor show every night. Check DDP's site in case the winter edition is extended.
  - type: gallery
    images:
