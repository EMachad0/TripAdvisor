  - type: tips
    variant: insider
    items:
      - "Take the **first entry**: you get the full three hours, and the Korea Travel Planning reviewer still found three hours too short."
      - "Go alone in spirit: entry times and starting floors differ, so friends split up anyway. Pick one actor and follow them."
      - "Wear comfortable shoes: you climb stairs across several floors (Vanilla Hai guide). Contacts beat glasses under the mask."
      - "The **Manderley Bar** is the one place you may use your phone (Korea Travel Planning review). The venue says it has live jazz and cocktails."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** a theatre production by a registered company (Ms. Jackson, Inc.), sold through NOL Ticket. Only the ticket and bar drinks are sold. Korea punishes buying sex: up to **1 year in prison or a ₩3M fine** (Act on the Punishment of Acts of Arranging Sexual Traffic, Art. 21)."
      - "**19+ and ID:** WAUG says a passport or government photo ID is required; under-19s are refused. Bring your passport."
      - "No refunds or changes after the cancellation deadline, including for missing the rules (official site)."
      - "Arrive before your entry time: the official FAQ covers late arrivals and re-entry, but its answers would not open for us, so ask NOL World or the box office."
      - "Buy via NOL World (the official site's BOOK NOW link) or the producer's named overseas sellers, Trip.com and Klook (Edaily)."
