      - { label: Age, value: "19+, ID checked", detail: "Bring your passport (WAUG, NOL World)" }
  - type: highlights
    items:
      - title: The costume is yours
        text: "Everyone gets a **white Punchdrunk mask** and stays silent; only the actors show their faces. You are a ghost in the hotel, free to go anywhere (official FAQ)."
      - title: A seven-floor set
        text: "The old **Daehan Cinema** was rebuilt as the **McKithan Hotel**, seven floors you roam at will: the largest Sleep No More set so far (ABC News)."
      - title: One-on-ones
        text: "Some guests get pulled into a **private scene** with an actor and handed an object to keep; others never do (Korea Travel Planning). Follow one character closely and keep moving."
      - title: Adults only, for a reason
        text: "Strictly **19+**: the review lists blood, violence and nudity among the scenes. It is still theatre, choreographed and with no dialogue."
  - type: prose
    title: Why this is the legal Psyche Dream Spa
    dropcap: true
    text: |-
      What you liked in Bangkok was the **costume, the themed set and the script** you step into. Sleep No More sells exactly that, minus anything sexual: a hotel built for the part, a cast who act around you and sometimes with you, and a story (Macbeth, told in film-noir style) that you assemble by choosing whom to follow. The Seoul version opened in July 2025 in a former cinema in Chungmuro and drew about 100,000 guests in its first year.

      It is a splurge: **₩200,000 (about R$865)** for the first entry, six days of your Korea budget. The case for it: nothing else in Seoul is like it, it needs no Korean, and it fits your only free afternoon. The catch is the calendar. The official seller lists shows only to **31 December 2026**, and dates are released one or two months at a time, so check in December whether January is on sale.
  - type: book_ahead
    steps:
      - { days_before: 30, text: "In December, open **NOL World** and check whether **Sun 17 Jan** (or Sat 16) is on sale, and that Sunday shows still run. Dates open in 1–2 month blocks." }
      - { days_before: 14, text: "Buy a **Guest** ticket for the **first entry** (14:45 on a Sunday): it gives you the full three hours." }
      - { days_before: 0, text: "Arrive early with your **passport**. Coat and bag go to the cloakroom, the phone into a locked pouch, the mask on." }
