    caption: "Masked audience members crowd round a scene inside the McKithan Hotel"
    hook: "Put on a white mask, lose your friends, and chase Lady Macbeth up the stairs of a hotel built for the play."
  - type: quick_facts
    time_needed: "Up to 3 h, on your feet"
    best_time: "Sun 17 Jan, 15:00 show"
    extra:
      - { label: Slot, value: "Sun 17 Jan afternoon", detail: "Weeknight shows end near 22:00, after your 21:00 shift; Sat 16 is Hwacheon" }
