    conditions: Dry, sharp cold, occasional snow
    note: "Seoul's January normals are about 2 °C by day and −5.5 °C at night. The roof keeps snow off but not the cold, and you'll sit on a stool in an open corridor. Upside: hot pancakes and steaming broth taste their best at −5 °C."
    wear: Padded jacket you can eat in, gloves you can take off quickly
