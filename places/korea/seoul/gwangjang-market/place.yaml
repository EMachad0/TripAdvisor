blocks:
  - type: hero
    image: food-alley
    hook: Under a roof of flags, vendors grind mung beans and fry pancakes the size of a plate.
    focus: center
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: Weekday 11:30–14:00 or early evening
    extra:
      - label: Payment
        value: Bring cash
        detail: Many stalls don't take cards
      - label: Seating
        value: Benches at the stalls
        detail: Often shared with strangers
      - label: Good in cold
        value: Covered, but not heated
  - type: highlights
    items:
      - title: Bindaetteok, fresh from the grinder
        text: "Soaked mung beans are ground at the stalls and fried into thick, crisp pancakes, about **₩4,000–8,000**. Eat it hot."
      - title: Mayak gimbap
        text: "Finger-sized rice rolls with mustard dip, nicknamed *mayak* (\"narcotic\") because one plate is never enough. About **₩3,000** for ten."
      - title: Korea's first daily market
        text: "Founded in **1905** by Korean merchants answering a Japanese-controlled market. It was the first market open every day of the week."
      - title: Netflix-famous alley
        text: "The food alley was featured in the Seoul episode of Netflix's *Street Food*. Expect queues at the best-known stalls."
  - type: prose
    title: How to eat here
    dropcap: true
    text: |-
      Walk the whole roofed food corridor once before sitting down. Stalls cluster by dish: bindaetteok griddles, gimbap counters, sundae and offal, and raw-beef **yukhoe**. Pick a stall with a posted price board, take a stool and point.

      The classic pairing is a hot bindaetteok with a bowl of **makgeolli**, Korea's milky rice wine, poured from a kettle. Share a yukhoe if you're braver. It's raw beef with pear and egg yolk, and the market's most famous splurge.

      The market has had an honest problem. In late 2025, viral videos showed some stalls charging more than their boards and serving small portions. The district suspended offending vendors and announced plans for a real-name system for about 250 street stalls. Go anyway, and stay alert.
