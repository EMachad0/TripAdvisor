  - type: map
    zoom: 17
    note: "From **Jongno 5-ga Exit 8**, the market is a short walk. The food alley is the roofed crossroads in the middle of the building."
  - type: tips
    variant: insider
    items:
      - "The stalls near the **entrances** are the most tourist-facing. The central corridor is where prices tend to match the boards."
      - "Carry **cash** (₩10,000 notes) and withdraw it before you go."
      - "Arrive just before noon, before the lunch crowd fills the benches."
  - type: tips
    variant: pitfalls
    items:
      - "**Ask the price first** and confirm the total before eating. In Nov 2025 a stall listing sundae at ₩8,000 charged ₩10,000 and was suspended for 10 days."
      - "Say no to add-ons you didn't order (extra meat, a side plate). Unrequested extras were the core of the 2025 complaints."
  - type: weather
