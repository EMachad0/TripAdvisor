  - type: map
    note: "From **Noksapyeong** Exit 2 it's about 12 minutes on foot, uphill into Haebangchon. The bar is in the **basement of 37 Sinheung-ro** (신흥로 37 지하1층)."
  - type: tips
    variant: insider
    items:
      - "Go on the **Saturday**: the Korea Times says Saturdays have about twice the performers of Fridays, over three sets."
      - "A reseller sells a ticket with one cocktail on GetYourGuide (from R$68). The door is cheaper only if you drink nothing: cover plus a ₩7,000 beer is about R$73, so if you want a drink the ticket wins. Check it sells Sat 16 Jan."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** a bar (술집 on Kakao; licence type not published) with a stage show. Korean law bans bar staff from drinking with or entertaining customers but exempts performers giving a show (Food Sanitation Act Art. 44(3)), so the show is legal; only the cover and drinks are sold."
      - "Buying or selling sex in Korea is a crime for both sides: up to **1 year in prison or a ₩3,000,000 fine** (Art. 21, sex-trade punishment act). Foreigners can also be deported (Immigration Act Art. 46) and refused re-entry for 5 years (Art. 11)."
      - "Bring your **physical passport**: Korean bars check ID, and photos or photocopies are refused (NightFlow)."
      - "The sign above the door warns you to **watch your liver** (Korea Times): drinks are strong and the shots are ₩5,000."
