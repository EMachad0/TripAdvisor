blocks:
  - type: hero
    image: haebangchon-sign
    caption: "Haebangchon, the hillside neighbourhood below Namsan Tower (no free photo of the bar)"
    hook: "Lip-sync, sequins and loud audience games in a basement arcade bar on the hill under Namsan Tower."
  - type: quick_facts
    time_needed: "2–3 h"
    best_time: "Sat 16 Jan, from 21:00"
    extra:
      - { label: Fits, value: "Sat 16 Jan only", detail: "Shows are Fri/Sat; Fri 15 is a work night, Sun 17 has no show" }
      - { label: Bring, value: Physical passport, detail: "Korean bars check ID; photos and copies refused (NightFlow)" }
      - { label: Language, value: "Mostly visual", detail: "Lip-sync and dance; Korean and international performers" }
  - type: highlights
    items:
      - title: The legal version of a cabaret night
        text: "We found no strip theatre or regular burlesque club open in Seoul. What there is: a **weekly drag revue** with queens, kings, burlesque and voguing numbers and audience games (Qlist), on Friday and Saturday nights."
      - title: Cheap for a show
        text: "About **₩10,000** at the door (R$43, Qlist; the bar posts no price), with drinks from **₩5,000** for a shot. Cover plus two drinks stays under your R$140 day."
      - title: Running since 2016
        text: "Rabbithole opened in **December 2016**. On Saturdays there are roughly twice as many performers as on Fridays, over **three sets** (Korea Times). GetYourGuide's latest reviewer (Oct 2026) called it \"amazing atmosphere, excellent performers\"."
      - title: Open to everyone
        text: "The bar calls itself a gay bar that **opens its doors to everyone**, and its manager says the crowd is very mixed (Korea Times). The latest reviewer praised the crowd and the performers alike (GetYourGuide)."
  - type: prose
    title: What it is, and what it isn't
    dropcap: true
    text: |-
      In Bangkok the costume and the act came with the massage. In Korea, where buying sex is a crime for both sides, the legal version is a stage show: you pay the cover, buy drinks and watch. Rabbithole is a small basement arcade bar in Haebangchon (HBC), the hillside village between Itaewon and Namsan, and its weekend drag revue (lip-sync, dance, comedy and audience interaction, says the reseller's listing) is the best-documented regular adult stage show we found open in Seoul now. It's a comic cabaret, not an erotic show.

      Only one night fits: **Saturday 16 January**, after you're back from Hwacheon. The Saturday show starts at about 21:00 and runs in sets through the evening. Friday the 15th is a work night, and Sunday the 17th has no drag (shows are Friday and Saturday only). Take a Hwacheon → Dong Seoul bus by about **17:30** (2 h 35, per the Hwacheon page), then cross town to HBC. Walk in and pay at the door; Qlist says there's no online ticketing from the bar itself.
