    temp_low_c: -6
    temp_high_c: 2
    conditions: Dry and freezing, some snow
    note: "January in Seoul averages −5.5 °C at night and 2.1 °C by day, with about seven snowy days. The rooftop is cold at night: dress for it."
    wear: Padded jacket, hat and gloves for the walk home from the clubs
