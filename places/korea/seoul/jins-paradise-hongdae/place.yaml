      checked: 2026-11-12
    social:
      - "**Weekend Korean BBQ**: \"Every weekend you can sign up for a Korean BBQ with people\", says the hostel."
      - "A **rooftop** with \"entertaining things\", and \"Party with guests\" on the hostel's list of daily events."
      - "October 2026 review: \"great for solo travelers… you can easily meet other backpackers. We had dinners at night and drinks at the rooftop.\""
      - "Hostelworld's review summary singles out the host, Jin. Staff walk every new guest to their room."
    good_to_know:
      - "Free security lockers and free luggage storage."
      - "Free coffee and tea 24 hours, free communal laundry, free city maps and tips."
      - "Leave a contact number when you book: the hostel says it will message you."
      - "**Pay in cash:** Hostelworld takes a deposit; the rest is paid on arrival in cash, or by card with 10% extra (₩39,999 becomes about ₩44,000)."
      - "**Day sleep after shifts:** check-out is by 11:00, so on a move-out day you can't sleep in after a 06:00 finish."
      - "The address says **4F** (fourth floor); a lift is not mentioned."
      - "No children. Free cancellation only if you book more than 15 days ahead."
      - "Cleanliness scores lowest of its Hostelworld sub-scores (8.6)."
  - type: highlights
    items:
      - title: Built for meeting people
        text: "Hostelworld guests score its **atmosphere 9.8/10**, and recent reviews talk about dinners together and drinks on the rooftop."
      - title: Hongdae on the doorstep
        text: "It sits in Seogyo-dong, the Hongdae nightlife district. Club Street and NB2 are a few hundred metres away on the map."
      - title: Cheapest on weeknights
        text: "The same dorm bed is **₩39,999** on weeknights and **₩69,000** on a Saturday (Hostelworld, December nights seen 12 Nov)."
  - type: book_ahead
    steps:
      - days_before: 30
        text: "From early December, check Hostelworld for 10–19 Jan: on 12 Nov nothing after Tue 5 Jan was on sale."
      - days_before: 16
        text: "Book by **26 Dec** (for a Sun 10 Jan arrival) to keep **free cancellation**: it ends 15 days before each night."
      - days_before: 1
        text: "Answer the hostel's message with your arrival time, especially if it is after 23:00."
      - days_before: 0
        text: "Check in from 14:00; a staff member walks you to your room."
  - type: map
    note: "From Hongik Univ. station, walk south into Seogyo-dong. Check the pin: the hostel is on the 4th floor."
  - type: tips
    variant: insider
    items:
      - "Weeknights are the cheap ones (₩39,999 against ₩69,000 on a Saturday in December): expect Fri 15 and Sat 16 Jan to cost more."
      - "Ask at check-in when the next **weekend BBQ** is and sign up early."
  - type: tips
    variant: pitfalls
    items:
      - "**Not bookable yet for your dates**: on 12 Nov every night 10–19 Jan showed \"no availability\". Have a backup (Time Travelers Relax or Lazy Cube nearby both had beds)."
      - "**Work week:** cleanliness is its weakest score (8.6), and no source mentions a desk or an all-night lounge. For the Jan 11–15 shifts, the cleaner Lazy Cube (9.9) or Original Backpackers (10/10, coworking room) may suit better."
