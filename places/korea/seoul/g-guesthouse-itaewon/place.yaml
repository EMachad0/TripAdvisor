    social:
      - "**Rooftop with BBQ facilities** looking over Itaewon, open to guests \"from all over the world\", in the hostel's words. January use not stated."
      - "Sep 2026 review: \"The rooftop is also mostly good for socialising although it depends on the night.\""
      - "Shared kitchen and cafeteria for tea time; one review mentions a bar downstairs to socialise."
    good_to_know:
      - "Every dorm bed has its own light, outlet and locker; rooms have Korean floor heating."
      - "Free breakfast, free luggage storage, coin laundry (powder provided)."
      - "Hostelworld's review summary: bathrooms can feel dated and wet, and the common areas are small."
      - "No children. Free cancellation only if you book more than 4 days ahead."
      - "The cheapest rate is non-refundable; the flexible rate was ₩905 more on weeknights. Cash or card on arrival, says the hostel."
      - "**Night shifts:** fast wifi \"everywhere\" and a meeting room are listed, but no source says a common space is open 21:00–06:00. Ask first."
      - "**Day sleep:** check-out is before 11:00. For work nights, the 4-bed dorm or the twin room (prices above; rooms have a desk and chair) are calmer."
