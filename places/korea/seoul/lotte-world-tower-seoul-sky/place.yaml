  - type: map
    zoom: 16
    note: "From **Jamsil** station take Line 2 Exit 1 or 2, or Line 8 Exit 10 or 11. Follow signs for Seoul Sky down to the entrance on **B1–B2** of the tower."
  - type: tips
    variant: insider
    items:
      - "Seoul Sky's ticket page says tickets for a visit date go on sale on the **1st of that month**. In January you can buy one online or simply at the booth."
      - "Resellers sell **foreigner-only** Seoul Sky tickets for less than the on-site price (Trazy says so; check its live price). Bring your **passport**: it's checked at the gate."
      - "Bring your **own phone ticket**: copies and screenshots aren't accepted at the gate."
      - "Seoul Sky closes at **22:00 Sun–Thu** and 23:00 on Fri–Sat, and ticket sales stop an hour before that."
  - type: tips
    variant: pitfalls
    items:
      - "₩33,000 is about a full day's budget, and a little over once you add the subway. The free option is Seokchon Lake and the mall; Namsan's terraces are a free view too."
      - "Look at the sky before you buy. On a hazy day the view is mostly white; a clear, cold day is when it pays off."
