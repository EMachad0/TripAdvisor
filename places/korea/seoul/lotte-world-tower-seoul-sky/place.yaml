blocks:
  - type: hero
    image: tower-dawn
    caption: Lotte World Tower over Seokchon Lake at dawn
    hook: A 555 m tower rising out of a mall, with a glass floor at the top and the city under your shoes.
  - type: quick_facts
    time_needed: 2–3 h
    best_time: "16:45 arrival; sunset 17:33–17:41"
    extra:
      - label: Fits a work day
        value: "Yes, if you're out by 19:00"
        detail: Sunset and the first hour of city lights, then home for a 21:00 shift
      - label: Tickets
        value: Online or at the booth
        detail: Booking opens on the 1st of each month for that month
  - type: highlights
    items:
      - title: Korea's tallest building
        text: "Lotte World Tower is **555 m** high with 123 floors above ground. The tower's site ranks it 6th in the world and says 55 million people visited the tower and mall in 2023."
      - title: The glass floor
        text: "The **Sky Deck** is a glass floor 478 m above the ground. Seoul Sky says Guinness listed it as the highest glass-floor observatory."
      - title: Floors 117 to 123
        text: "The **Sky Shuttle** lift runs from B2 to the 117th floor. Seoul Sky lists a Sky Show on 117, a Sky Theater on 118 and a mapping show on 121, plus the open-air 120th-floor **Sky Terrace** (486 m) and the 123 Lounge, a premium café-restaurant."
      - title: The mall below
        text: "Lotte World Mall is open 10:30–22:00 and free to wander, with the tower's lobby, a cinema, the Lotte World Aquarium and the Avenuel luxury store under one roof."
  - type: prose
    title: Why it's more than a mall
    dropcap: true
    text: |-
      The mall is the part you walk through to get to the view. Seoul Sky is the observation deck at the top of the tower, from the 117th to the 123rd floor, and its windows give a 360-degree view of the city. On a clear January evening you watch the lights come on below you.

      Time it for sunset: in mid-January the sun sets between 17:33 and 17:41, and civil dusk ends around 18:01–18:09. That fits a work day: arrive at 16:45, watch the sunset and the city light up, and be out by 19:00.

      If you want to walk off the ticket price, **Seokchon Lake** is right next to the tower. The tower's own guide suggests taking a snack from the mall's food floors down to a lakeside bench with the tower in view.
