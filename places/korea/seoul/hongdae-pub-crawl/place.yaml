  - type: tips
    variant: insider
    items:
      - "**Dress to impress** (the organiser's words): no sportswear, running or trekking shoes, big backpacks, flip-flops, or sandals and tank tops for men."
      - "Message **@seoul_pub_crawl** on Instagram for changes; the organiser says email and Ticket Tailor messages are slow."
  - type: tips
    variant: pitfalls
    items:
      - "Arrive after **21:40** and you lose the ticket: no refund for late arrivals."
