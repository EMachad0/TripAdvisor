  - type: hero
    image: hongdae-night-crossing
    caption: "Hongdae at night. No free photo of the crawl itself exists"
    hook: "Wristband on, a shot in every bar, and by the time you reach the club you are out with a crew."
  - type: quick_facts
    time_needed: "4–5 h"
    best_time: "Sat 16 Jan, by 21:40"
    extra:
      - { label: Includes, value: "3 bars, 1 club, 4 shots", detail: "Plus skip-the-line entry and wristband discounts" }
      - { label: Bring, value: Physical photo ID, detail: "No photocopies; 19+ (international age)" }
      - { label: Club age limit, value: "Can be 19–34", detail: "First 3 bars have no age limit" }
  - type: highlights
    items:
      - title: Built for solo travelers
        text: "A **party captain** collects everyone at the first bar and walks the group from venue to venue. You don't need a hostel crew to go out: this makes one."
      - title: Cheap for Hongdae
        text: "₩25,000 covers **4 shots or drinks, three bars and a club**, with skip-the-line, guaranteed entry, from the organiser's own ticket page."
      - title: On sale for your free night
        text: "The Seoul Pub Crawl lists a Hongdae crawl on **Sat 16 Jan**, the one night in Korea with no shift before or after. An Itaewon crawl runs the same night."
      - title: Then you're out with friends
        text: "The last stop is a club. The organiser doesn't publish an end time (Absolute's similar crawl says about 01:00); after that you are in Hongdae with a group and a wristband."
  - type: prose
    title: Which night works for you
    text: |-
      In your Korea dates (10–20 Jan) there are two listed Hongdae nights. **Sat 16 Jan**, starting at Mike's Cabin, is the one that fits: no shift that night and none on Sunday. **Fri 15 Jan** starts at **Dokkaebi Party House** (22 Wausan-ro 17-gil; the organiser says that is *not* Dokkaebi club), but check-in at 20:30 runs straight into your 21:00 shift.

      Sunday 10 Jan, your arrival day, has no crawl (they only run Fridays and Saturdays). If the Hwacheon ice festival also lands on Sat 16 Jan, take a mid-afternoon bus back: the Hwacheon page has the bus times, and check-in closes at 21:40.
