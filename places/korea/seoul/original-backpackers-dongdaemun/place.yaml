    social:
      - "Staff run a **WhatsApp group** with daily plans and food tips; several 2026 guests say it got them out with others."
      - "Events: **movie nights** and yoga (2026 reviews), a BBQ (2025). Rooftop terrace and a big kitchen on the top floor."
      - "\"The hostel actively connects you with the others\" (Jul 2026); \"social but not necessarily a party vibe\" (Mar 2026)."
      - "Some weeks are quiet: \"not as social but that's ok\" (Jun 2026). Parties are not permitted."
    good_to_know:
      - "**Night shifts:** a coworking space is listed on the 3rd floor. No source says whether you can use it 21:00–06:00: ask."
      - "**Wifi:** \"snappy wifi\" (Aug 2025), \"Wifi worked\" (Oct 2026). Keep mobile data as a backup."
      - "**Day sleep:** each bunk has blackout curtains (Mar 2025) and earplugs are provided (May 2025). One guest found the walls thin (Jun 2026)."
      - "**Lockers** are free, spacious and come with locks (Dec 2025). Towels, toiletries, laundry, coffee and ramen free."
      - "**No lift:** 3rd to 5th floor on uneven stairs, and one toilet per floor (Dec 2025)."
      - "Reception closes at 22:00. Check-in until midnight; later arrival on request."
  - type: highlights
    items:
      - title: The clean one
        text: "Cleanliness **10/10** on Hostelworld; guests keep calling the showers the best they have seen in a hostel."
      - title: Built for working nights
        text: "A **coworking room**, blackout curtains on the bunks and free ramen and coffee for 03:00 on the 21:00–06:00 shifts."
      - title: Free breakfast and laundry
        text: "Breakfast, washing machine and dryer are free: real savings over a week in Seoul."
      - title: Central, airport bus at the door
        text: "Dongdaemun station is a minute away, and the airport bus to Incheon stops in front of the hostel."
  - type: book_ahead
    steps:
      - days_before: 60
        text: "Check the Hostelworld page for January dates; on 12 Nov they were not on sale yet."
      - days_before: 30
        text: "Book as soon as beds appear: it is small and the December beds were nearly gone. Cancelling inside 7 days costs the full price."
      - days_before: 0
        text: "Arriving after midnight? Ask in advance for late check-in."
  - type: map
    note: "Use **Dongdaemun station Exit 3**; the hostel is on the 3rd floor, right by a 7-Eleven."
