    extra:
      - label: Fits a work day
        value: "Yes"
        detail: Closes 20:00 Mon–Thu, before a 21:00 shift
      - label: Monthly closure
        value: One Monday a month
        detail: Avoid Mondays 11 and 18 Jan until the calendar is out
  - type: highlights
    items:
      - title: Sounds Forest
        text: "An indoor garden of about **3,300 m²** on the 5th floor, lit by daylight through a **20 m** glass ceiling. It's free to walk through; a 6th-floor ledge looks down on it."
      - title: Waterfall Garden
        text: "Step in on the 1st floor and there's a waterfall dropping **12 m** from the 3rd floor down to the 1st."
      - title: Richard Rogers' building
        text: "Designed in the spirit of architect **Sir Richard Rogers**, with maroon columns that borrow from traditional Korean buildings and their painted *dancheong*."
      - title: The basement food hall
        text: "The B1 food hall works like a food court with self-order kiosks (cards) and a counter that takes cash. A 2026 guide puts most dishes at about ₩8,000–17,000."
  - type: prose
    title: Why it's worth the trip
    dropcap: true
    text: |-
      The Hyundai Seoul opened in Yeouido in 2021, and over 6,600 m² (2,000+ *pyeong*) of its roughly 80,000 m² is indoor green space. That's the reason to come: you walk in from the cold and find a waterfall, then ride up to a skylit garden with real trees and benches, five floors above the street.

      The shops matter less. B2 is the floor of young Korean streetwear brands, and it's the busiest one on weekends. If you came for one thing to buy, the food hall downstairs is where your money goes.
