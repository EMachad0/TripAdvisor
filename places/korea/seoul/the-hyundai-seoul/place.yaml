    note: "From **Yeouido** station (Lines 5, 9), Exit 3 leads to a 500 m underground walkway that ends at the B2 entrance. From **Yeouinaru** (Line 5), Exit 1 brings you to the rear entrance."
  - type: tips
    variant: insider
    items:
      - "Enter on the **1st floor** first for the waterfall, then take the escalators up to the **5th floor** for Sounds Forest."
      - "Weekday mornings right after the 10:30 opening are the quietest time, according to Creatrip."
      - "The **1F tourist desk** stores luggage, and tax refunds are on the 6th floor (bring your passport)."
  - type: tips
    variant: pitfalls
    items:
      - "Some B2 shops queue you on a tablet that only accepts **Korean phone numbers**. Creatrip's workaround: scan the tablet's QR code and queue in the Hyundai Food Museum app."
      - "Weekends, B2 in particular, are crowded."
