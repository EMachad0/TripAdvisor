    conditions: Dry, freezing, occasional snow
    note: "The lane is covered but open to the cold. You pick food outside, then eat **indoors** upstairs, so it's one of the warmer cheap lunches in Seoul."
    wear: Padded jacket and gloves you can pull off to pay
