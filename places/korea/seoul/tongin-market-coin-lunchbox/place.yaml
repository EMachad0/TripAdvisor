    note: "From **Gyeongbokgung Exit 2**, walk straight up Jahamun-ro for about 500 m. The entrance is on the left side of the road."
  - type: tips
    variant: insider
    items:
      - "Walk the whole lane **before** spending a coin. Every stall's dishes are on display, and the good stuff isn't always at the front."
      - "Go on a **weekday**. Weekends at lunchtime get packed and the upstairs seats fill."
      - "Want just one thing? You can also pay cash at the stalls, e.g. a full plate of oil tteokbokki."
  - type: tips
    variant: pitfalls
    items:
      - "Avoid **Mondays and Tuesdays** (11–12 and 18–19 Jan): sources disagree on which one the café closes. The café also shuts on the 3rd Sunday, **Sun 17 Jan**. Wed 13 – Fri 15 Jan are the safe days."
      - "Coin sales stop an hour before closing, and the closing time is disputed (15:00, 16:00 or 17:00). **Arrive by 13:30** to be safe."
