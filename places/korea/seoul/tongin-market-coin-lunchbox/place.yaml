      - label: Fits a night-shift day
        value: Yes, lunch only
        detail: Arrive by 13:30; one listing ends the café at 15:00
  - type: highlights
    items:
      - title: A lunch tray you build yourself
        text: "Buy coins, take the plastic tray and walk the lane. Stalls with the **도시락카페** sign scoop small portions for 2–4 coins each, so you can try 6–8 things in one meal."
      - title: Oil tteokbokki
        text: "Rice cakes stir-fried in oil instead of stewed in sauce, in a **soy** or **gochujang** version. It's the market's signature dish."
      - title: A real neighbourhood market
        text: "About 70 shops: banchan, fruit, fish, tailors. It's been a market since **1941**, and locals still shop here between the tourists."
      - title: Gyeongbokgung's cheap lunch
        text: "About 500 m from Gyeongbokgung Station, so it fits before or after the palace. Seochon's hanok lanes are right outside."
  - type: prose
    title: How it works
    dropcap: true
    text: |-
      Go to the customer centre in the middle of the market and climb to the **2nd floor**. Exchange cash for brass *yeopjeon* coins, at least 10 (₩5,000). You get a plastic lunch tray with them.

      Walk the lane and look for stalls showing the lunchbox-café sign. Point at what you want and hand over coins. Most dishes cost 2–4 coins. Then go back upstairs, where rice and soup cost about 2 coins each and there are tables, drinks and utensils.

      The scheme has run since **2012**, and a Seoul city writer noted in 2023 that it's still going when most tourist gimmicks fade. Ten coins is a light lunch. Twenty with rice is a proper meal, and the counter refunds coins you don't spend.
