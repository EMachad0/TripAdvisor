  - type: map
    note: "Search **난다아로마** in Naver Map or Kakao Map. Walk from Myeongdong station Exit 6 toward the **Myeongdong Police Box**; the shop is on the 2nd floor, in the alley near the NANTA theatre (Seoul Travel Pass)."
  - type: tips
    variant: insider
    items:
      - "Arrive **15 minutes early**: the shop asks for it, and more than 15 minutes late cancels the booking with no refund (Seoul Travel Pass)."
      - "Say **\"aroma oil, 60 minutes\"** (아로마 오일 60분) when you call if you want the oil course; the cheapest headline price is the dry Thai one."
      - "A 2023 Trazy reviewer was taken on a walk-in and given tea on arrival; they found it through Naver."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** Korea's Act on the Punishment of Acts of Arranging Sexual Traffic (Art. 21) punishes the *buyer*: up to 1 year in prison or a ₩3M fine. It covers manual and body 'extras' (Supreme Court, 2005도8130), so 'Swedish', 건마 and one-person aroma shops that sell them are out."
      - "**Foreigners** get no pass: on top of a fine, immigration can issue a departure order or an entry ban (Seoul Law Group, KLawGuru)."
      - "**Why this one is legal:** a long-running tourist shop with a public menu of massages and facials, listed on mainstream booking sites, with no 'extras' on offer. If anyone offers one, leave."
      - "**Price:** listings disagree (₩80,000 on Seoul Travel Pass, older Trazy page ₩55,000). Confirm the price on the phone, and add-ons are paid at the shop."
