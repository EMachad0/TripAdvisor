  - type: hero
    image: myeongdong-theater
    caption: "Myeongdong Theater on Myeongdong-gil; the shop is a few doors away (no free photo of it)"
    hook: "A warm foot bath, then an hour of Thai stretching or slow aroma oil, two floors above Myeongdong's street-food crowd."
  - type: quick_facts
    time_needed: "1.5 h with the foot bath"
    best_time: "Work day, 14:00–18:00"
    extra:
      - { label: Slot, value: "Afternoon, done by 18:00", detail: "Work days 11–15, 18, 19 Jan. Sun 17 Jan any time; last booking 21:00" }
      - { label: Oil or not, value: "Thai dry, or aroma oil", detail: "Thai ₩80,000; Aroma Oil Therapy ₩110,000, both 60 min" }
      - { label: Tip, value: "None", detail: "Korea's culture is tip-free (Korea Times)" }
  - type: highlights
    items:
      - title: Two kinds of hour
        text: "**Thai** (₩80,000): foot bath, stretching, full-body hand massage, scalp. **Aroma Oil Therapy** (₩110,000): foot bath, full-body aroma lymphatic massage, scalp, stretch. The oil one is the closer cousin of what you liked in Bangkok."
      - title: Fifteen-plus years on one street
        text: "The venue says it has run in central Myeongdong **since 2009** and renovated in 2025. On Google it held **4.9 from 462 reviews** on 18 Nov 2026, with the owner replying to them."
      - title: Fixed menu, no back-room upsell
        text: "Every course and price is on a public list, and staff languages are listed as Korean, English, Japanese and Chinese. Extras added on site are paid at the shop, so ask the price first."
      - title: Private rooms
        text: "Trazy's listing says there are **private treatment rooms** and rooms for two, and that it suits couples, families and friends."
  - type: prose
    title: The legal hour, and the cheapest way in
    dropcap: true
    text: |-
      In Korea the body-to-body and "happy ending" shops you liked in Thailand are illegal for the client: the 2004 sex-trade Act punishes the buyer, and the Supreme Court counts manual relief at a massage parlour as a "similar sex act". In the summer 2026 crackdown, massage parlours were the biggest offline category: **152 cases, 331 arrests** (JoongAng Daily). So the "Swedish", 건마 and one-person aroma shops are out.

      What's left is the massage itself. Nanda is a Thai-and-skincare shop in the tourist centre, priced on a public menu; the venue says locals and tourists both use it. Pick the **aroma oil hour** (₩110,000, about R$476) if you want the slow, warm, full-body part of a nuru session. Pick the **Thai hour** (₩80,000, about R$346) if your back needs stretching after a night shift. That is 2.5 to 3.4 days of your R$140 budget. The cheapest ways in: an older Trazy menu lists a **40-min foot massage at ₩35,000** and a **60-min body massage at ₩55,000**; ask on the phone whether they still exist. Or skip the shop and take a ₩10,000 jjimjilbang night at Sparex (separate card).

      **Which day:** any work-day afternoon (11–15, 18 or 19 Jan) from 14:00, done by 18:00, home before your 21:00 shift. Mon 11 Jan, after the morning landing, works well. On Sun 17 Jan any time fits. Sat 16 is the Hwacheon trip; the last booking is 21:00 if you are back in time.
  - type: cost_breakdown
    items:
