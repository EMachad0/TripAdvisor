  - type: highlights
    items:
      - title: T1's own PC bang
        text: "Opened in **May 2023** as the team's first Base Camp, in a basement near Hongik Univ. Station. The opening report counted **250-plus seats**."
      - title: Pay as a non-member
        text: "VisitKorea lists a **non-member rate of ₩3,000 an hour**, so no membership is needed to sit down and play."
      - title: The T1 shop at the door
        text: "The official T1 Shop is at the entrance, with photo booths that use T1 player frames."
      - title: Food to your seat
        text: "A visitor (Creatrip post) ordered from the on-screen menu and staff brought it to the desk. The menu includes dishes picked by T1 players."
  - type: prose
    title: What it is
    dropcap: true
    text: |-
      T1 Base Camp is the fan venue you can count on. LCK matches need a schedule that is not out yet, but this place is open around the clock. You walk down a lit staircase, pass the T1 shop and pay by the hour for a seat.

      At opening in 2023 the venue had large LED screens on the pillars showing League of Legends and Valorant matches, wider **Elite seats** for ₩500 more per hour, a console room and soundproof tournament booths. Those details are from 2023 reports and may have changed.

      It also covers the gaming café on your list: seats by the hour, and food ordered from the screen and brought to your desk.

      T1 now runs three Base Camps. The newest, in **Gangnam**, soft-opened on 3 October 2026 two minutes from Sinnonhyeon Station. It has a Trophy Room with player handprints and jerseys, the T1 Flagship Store and a restaurant open 11:00–24:00. If you want trophies more than a PC seat, go there.
