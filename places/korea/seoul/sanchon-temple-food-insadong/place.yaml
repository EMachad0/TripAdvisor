blocks:
  - type: hero
    image: table-spread
    caption: "A Sanchon spread of temple side dishes (an older photo; the dishes change with the season)"
    hook: A former monk's mountain-herb table, one tray of little bowls after another, for the price of a cheap dinner.
  - type: quick_facts
    time_needed: 60–90 min
    best_time: "Lunch, 11:30 (UTC+9)"
    extra:
      - { label: The meal, value: "~20 dishes", detail: "Water kimchi, wild greens, tofu jelly, deodeok, fritters, rice, stew, tea" }
      - { label: Solo, value: "Yes, priced per person", detail: "Visit Seoul: \"Set Course (for 1)\"" }
      - { label: Out of place?, value: "No", detail: "A casual old Insadong room; no dress code listed" }
  - type: highlights
    items:
      - title: The many-small-dishes meal, without the show
        text: "There's **only one set**, and it comes in waves: water kimchi and starters, then fernbrake and bellflower, tofu jelly, seasoned deodeok, chop suey, fritters and herbs, then rice, stew, tea and yukgwa. Like the Shuyanfu banquet, but quiet."
      - title: Built for one
        text: "The website prices the set **per person** (₩29,000), and Visit Seoul calls it **\"Set Course (for 1)\"**. Solo reviewers in 2026 warn you'll eat *a lot*."
      - title: Real temple roots
        text: "The owner, **Kim Yeon-sik**, spent years as a Buddhist monk and built the menu on temple cooking: wild herbs and vegetables with no chemical additives, mostly vegan."
      - title: The cheapest of the three
        text: "About **R$124**, the same at lunch and dinner. About a quarter of the Korea House royal lunch."
  - type: prose
    title: What to expect
    text: |-
      Sanchon is old-school Insadong: a wood-and-lantern room off the main street, with low tables and a temple bell. You don't order; you sit, and the dishes keep coming until the table is covered.

      Recent reviews split. Most enjoy tasting so many vegetables in one sitting; some find it **pricey for vegetables** and say service can be rushed. Go hungry, go at opening, and treat it as a tasting, not a feast.
