  - type: highlights
    items:
      - title: A BBQ street with a history
        text: "It began when thousands of labourers building **Yeouido** in the late 1960s crossed the Mapo Bridge each night for soju and meat. Today it's office workers from Yeouido, Gongdeok and Gwanghwamun."
      - title: The egg crust
        text: "The grills have a **groove around the edge**. Staff pour beaten egg into it, and it sets into an omelette ring you eat between the meat. In the alley this egg crust is the trademark."
      - title: Galmaegisal, not samgyeopsal
        text: "Pork skirt (the diaphragm): lean, a bit chewy, lightly seasoned with garlic. **₩17,000 for 200 g** at Jangsu Galmaegi, one of the alley's best-known shops, with free refills of doenjang soup."
      - title: Cheaper than across the road
        text: "Yonggang-dong, on the other side of the main road, is the **expense-account** strip: hanwoo jumulleok at ₩40,000–50,000 a serving. Dohwa-dong is where workers on a budget eat."
  - type: prose
    title: Finding it, and eating alone
    dropcap: true
    text: |-
      Come out of **Mapo station exit 3 or 4**, walk into the lanes behind the Seoul Garden Hotel, and head uphill towards Gongdeok. That's the alley. Coal-fired drum tables spill out of shopfronts. Nobody agrees who was first, but **Busan Galmaegi**, **Jangsu Galmaegi** and **Mapo Galmaegi** are the names locals give.

      **The honest solo answer:** no source we found says whether these shops serve one person. Seoul BBQ places usually want **two portions** at least, and this is a group-dinner street. Two ways to go: bring people from the hostel (a Saturday works, and it's a cheap pre-game before Hongdae), or go alone early on a weeknight and ask *"1인분 돼요?"* ("Can I order one serving?"). If not, two servings are ₩34,000 (about R$141). For a guaranteed solo version, see the Hongojib page: a solo-BBQ restaurant near Hongdae with a galmaegisal set.

      **How to eat it:** grill it yourself and turn it often, which is what locals told Arukikata's writer. Cut it with the scissors, wrap it in lettuce or perilla with ssamjang and garlic, and finish with a bowl of cold **yeolmu-guksu** (radish-kimchi noodles, ₩2,000).
