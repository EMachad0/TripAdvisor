  - type: tips
    variant: locals
    items:
      - "Turn galmaegisal **again and again** over medium heat. It toughens if you leave it."
      - "Eat the egg ring between bites of meat. It's there to cut the fat and the soju."
      - "Finish with yeolmu-guksu instead of rice: cold, sour, ₩2,000."
  - type: tips
    variant: pitfalls
    items:
      - "Don't wander across the main road to **Yonggang-dong** by mistake: that's the ₩40,000-a-serving hanwoo strip."
      - "Going alone at 19:30 on a weekday means the full after-work rush. Arrive by 18:00 if you'll be asking for one serving."
