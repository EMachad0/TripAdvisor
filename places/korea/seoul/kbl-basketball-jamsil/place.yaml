  - type: highlights
    items:
      - title: Organised cheering
        text: "A **cheer captain** (응원단장) leads the crowd all game long from sections 204–205, and a fan's seat guide says fans who cheer hard can get a signed ball. Sit opposite (213–214) for a quieter view."
      - title: Cheaper than a club cover
        text: "A general seat is **₩15,000** (₩13,000 for teens). Second-floor centre seats are ₩26,000, and courtside P seats ₩50,000 (official 2026–27 prices)."
      - title: Two Seoul teams, one old gym
        text: "Samsung's Jamsil Arena is being torn down, so **SK and Samsung share this 1976 gymnasium** in 2026–27. Three of their home games here fall in your Korea days (10, 17 and 19 Jan)."
      - title: An Olympic building
        text: "Wikipedia says the 7,500-seat gym hosted **boxing at the 1988 Seoul Olympics**. Its own demolition was postponed by a year, so this may be one of its last seasons."
  - type: prose
    title: Which game to pick
    text: |-
      In your Korea dates (10–20 Jan) there are three home games here, all SK Knights, so the official prices on this page apply:

      - **Sun 17 Jan, 14:00, SK vs Daegu KOGAS**: the pick. It is a free weekend afternoon, and it leaves Sat 16 Jan for the Hwacheon day trip and a night out. The game is over by late afternoon.
      - **Sun 10 Jan, 14:00, SK vs Changwon LG**: your arrival day from Bangkok. It only works if you land in the morning and drop your bag first.
      - **Tue 19 Jan, 19:00, SK vs Wonju DB**: a work day. A 19:00 tip-off ends around your 21:00 shift start, so skip it.

      Just outside your dates: Samsung's games here on Thu 7 and Sat 9 Jan, SK vs Busan KCC on Fri 22 Jan, and the Seoul derby (Samsung vs SK) on Sun 24 Jan.

      **How a foreigner buys:** tickets go on sale on the KBL website or app **5 days before, at 11:00**. If the sign-up won't take your number, go to the box office, which opens 2 hours before tip-off. SK keeps **50 general seats per game** (one each) for people who can't book online, and names foreigners, with a passport check. That allocation stops an hour after the box office opens, so arrive early.
