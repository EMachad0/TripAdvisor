blocks:
  - type: hero
    image: library-hall
    caption: Starfield Library's two-storey shelves under the glass roof
    hook: Two storeys of bookshelves rising out of a shopping mall, and nobody asks you to buy anything.
  - type: quick_facts
    time_needed: 1.5–3 h
    best_time: Weekday before noon, or after 19:00
    extra:
      - label: Fits a work day
        value: "Yes"
        detail: Indoors, open from 10:30; home well before a 21:00 shift
      - label: Good in the cold
        value: Fully indoors
        detail: Underground passages from two subway lines
  - type: highlights
    items:
      - title: The library
        text: "**Starfield Library** fills about 2,800 m² over two levels, with **13 m** bookshelves holding around 70,000 books and 600 magazine titles. It is free and open to anyone."
      - title: An underground city
        text: "COEX Mall opened in 2000 and covers about **85,000 m²** under Gangnam, so you can spend an afternoon here without going outside."
      - title: Talks and small shows
        text: "The library runs a programme of author talks, poetry readings and book concerts. Check the schedule on the Starfield site before you pick a day."
      - title: A temple across the road
        text: "Bongeunsa, a Buddhist temple, is about a 5-minute walk from the mall's main street exit: a quiet stop on the same afternoon."
  - type: prose
    title: Why it's worth an afternoon
    dropcap: true
    text: |-
      Shopping is the smallest reason to come here. Starfield Library opened in 2017 in the middle of the mall, a two-level reading room with walls of books that rise the full height of both levels. Most titles are in Korean, but you can sit, read the magazines or just look up, and nobody checks a ticket.

      Use it as your landmark: most corridors of the mall lead back to the library. Around it are a food hall, cafés and floors of restaurants, plus the SEA LIFE COEX Aquarium if you want a paid add-on.
