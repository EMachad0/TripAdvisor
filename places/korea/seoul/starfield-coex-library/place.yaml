  - type: tips
    variant: insider
    items:
      - "The best view of the full shelves is from the **upper reading level**. Go on a weekday before noon for fewer people in your photos."
      - "Evenings after 19:00 are quieter too: you can come here on a work day and still be back before your shift."
  - type: tips
    variant: pitfalls
    items:
