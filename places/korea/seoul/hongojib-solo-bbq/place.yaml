  - type: highlights
    items:
      - title: The solo answer
        text: "Most BBQ places want **2 servings** at least. Hongojib was built for one person: a personal grill at each seat and self-order kiosks. A Polle reviewer came because '2 servings felt like too much', and found a room of 1–2-person tables."
      - title: Three cuts for under ₩12,000
        text: "Sets mix three cuts: neck, *galmaegisal* and belly for **₩9,800** (Feb 2026), or beef brisket, short rib and neck for ₩11,500. Side dishes and soup come with it; a fresh grill plate is ₩1,000. Try galmaegisal here before the Mapo alley."
      - title: Beef if you want it
        text: "Beef sets with skirt, flank or wagyu cost **₩13,600–17,800**. A reviewer's flank, short-rib and wagyu set came to about 100 g of each cut."
      - title: A shift-day dinner
        text: "Open 11:30–15:30, then 17:00–22:00 (last order 21:30). Arrive at 17:00 when it reopens and you've eaten long before a 21:00 shift."
  - type: prose
    title: How Korean BBQ works, in one minute
    dropcap: true
    text: |-
      Meat comes raw (or marinated) to a grill in your table, and you cook as you eat. **Scissors** come with the tongs: cut the strips into bites on the grill. That's normal, not rude. At mid-range places staff often grill for you. At cheap spots, like this one, you grill it yourself.

      Wrap a piece in **lettuce or a perilla leaf** with a dab of *ssamjang* (soybean-chili paste), raw garlic and green chili, and eat it in one bite. This is a *ssam*. Soju or beer goes with it, and your jacket will smell of smoke afterwards, whatever you do.

      Usually the catch for a solo traveler is the **two-portion minimum**. Hongojib doesn't have one, which makes it the easiest first BBQ in Seoul when you're alone.
