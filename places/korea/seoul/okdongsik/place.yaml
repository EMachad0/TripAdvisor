      - "A November 2026 solo reviewer arrived at 11:40 UTC+9 on a weekday and found a queue; their tip is to go in the 14:00 hour, just before the 15:00 break."
      - "Taste the broth plain first: the solo reviewer found a pinch of salt and pepper was all it needed."
  - type: tips
    variant: pitfalls
    items:
      - "No reservations in the normal sense: it's a queue, and about 100 bowls a day can run out."
      - "There is also a **Songpa-Hanam** Okdongsik with grilled meat; the Bib Gourmand is this Seogyo-dong original."
      - "On work days (Jan 11–15, 18–19) the 17:00–22:00 UTC+9 dinner slot is tight before a 21:00 shift; lunch is the safe bet."
