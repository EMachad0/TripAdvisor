  - type: highlights
    items:
      - title: Pork soup that looks like beef gomtang
        text: "Michelin calls it a refined dwaeji-gukbap with a **light, clean broth reminiscent of gomtang**, made from the ham and foreleg of black pigs raised on Jirisan."
      - title: Made for one
        text: "About ten bar seats face the open kitchen. A November 2026 solo reviewer says one or two people usually get a bar seat faster than a table."
      - title: The toryeom trick
        text: "Hot broth is poured over the rice again and again (**toryeom**) before it reaches you, so the rice warms through without going mushy."
      - title: Bib Gourmand price
        text: "**₩14,000** for a regular bowl (about R$62). The large adds more meat for ₩19,000; kimchi mandu are ₩7,000."
  - type: prose
    title: One dish, a hundred bowls
    text: |-
      Okdongsik serves one thing: pork gomtang in a brass bowl, with pork cooked about 80% and sliced thin, then finished by the hot broth (Siksin). The broth is clear, not the milky pork soup most people picture. Michelin's inspectors list it as a Bib Gourmand and tag it "worth queueing for."

      The original shop sits on the ground floor of a residential villa in Seogyo-dong, between Hapjeong and Hongdae. Reviews put the daily output at about 100 bowls, and the chef's turn on the TV cooking contest 흑백요리사 (season 2) made the queue longer: a 2026 blog cites a December 2025 report of 34 people waiting on CatchTable at lunch.
  - type: quote
    variant: vibe
    text: Steam off a brass bowl, a seat at the counter, Seoul below freezing outside.
