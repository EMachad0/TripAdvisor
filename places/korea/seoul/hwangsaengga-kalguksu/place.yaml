  - type: highlights
    items:
      - title: Bib Gourmand for ₩13,000
        text: "On the MICHELIN Guide Seoul **Bib Gourmand** list in the cheapest ₩ band. A bowl of sagol kalguksu is ₩13,000 (about R$58)."
      - title: Dumplings made at the door
        text: "Michelin's inspectors note staff at the entrance folding **oversized mandu** from fresh market ingredients. You watch them while you queue."
      - title: Hot broth on a frozen day
        text: "The highlight, says Michelin, is the soft kalguksu in a **deeply comforting beef-bone broth**. In a Seoul January that is the whole point."
      - title: A palace lunch
        text: "It sits by MMCA Seoul, across from the National Folk Museum, so it fits a morning at Gyeongbokgung before your night shift."
  - type: prose
    title: Kalguksu, Bukchon style
    text: |-
      Kalguksu means "knife noodles": wheat noodles cut with a knife rather than pulled. Hwangsaengga makes the **sagol** version, in a beef-bone broth, and the Where to Eat Seoul guide lists fresh geotjeori kimchi on the side.

      Michelin keeps it on the Seoul Bib Gourmand list for value and calls it a beloved noodle and dumpling specialist with long queues throughout the day. Its own advice is to come outside peak hours.
