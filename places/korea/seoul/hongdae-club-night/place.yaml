      - title: NB2, the name everyone gives
        text: "KORLENS calls it \"hip-hop focus, backed by YG Entertainment, big floor. Touristy but legitimately fun.\" It is at 72 Wausan-ro, two basement floors down."
      - title: A whole street of clubs
        text: "Creatrip points people to **Club Street** around Wausan-ro 21-gil and 29-gil, with names like M2, Aura, Ocean, B1 and Club FF nearby."
      - title: Covers with a drink included
        text: "Covers typically run **₩10,000–20,000 with a drink included**, and many clubs waive it before midnight or with a flyer (KORLENS)."
      - title: Out until the first train
        text: "Most clubs run until 5 or 6 AM, some to 7 AM on weekends; the first trains leave around 5:30 AM."
  - type: prose
    title: Is NB2 still going?
    text: |-
      Esquire Korea called NB2 "Hongdae's representative hip-hop club" when it wrote, in 2022, that it had not survived COVID and had disappeared. A Kakao Map review from October 2023 says it is back after a **renewal**, with Friday entry of ₩15,000 for men and ₩10,000 for women, but also that it was nearly empty inside that night and worse than before.

      Today Kakao Map lists NB2 at 72 Wausan-ro, opening at 22:00, with its Instagram account, and the KORLENS guide, checked in October 2026, still recommends it. Check the Instagram before you go. If NB2 is quiet, **Sabotage** on Wausan-ro 17-gil has a business-verified Kakao listing, but Esquire (2022) reports it stops letting foreigners in once they are about **20% of the crowd**, so a solo foreigner may be turned away late in the night.

      Which night: you work 21:00–06:00 Mon–Fri, and 16–17 January is Hwacheon, so **Sunday 10 January** is the sure free night (Monday's shift starts at 21:00). Expect a thinner crowd and weekday-style covers on a Sunday; no guide gives Sunday prices. **Saturday 16 January** is the full-crowd option only if you are back from Hwacheon that evening.

      The plan that works best: drinks at the hostel first, walk down together before midnight to dodge covers, and stay out until the first train.
