blocks:
  - type: hero
    image: pyongyang-naengmyeon
    caption: "Pyongyang naengmyeon at another Seoul shop; no free photo of Pildong Myeonok"
    hook: Buckwheat noodles in a cold, delicate beef broth that Seoul's noodle nerds still argue about.
  - type: quick_facts
    time_needed: 30–60 min
    best_time: Weekday at 11:00 (UTC+9)
    extra:
      - { label: Solo, value: Yes, detail: "Michelin tags it good for solo dining" }
      - { label: Style, value: Pyongyang naengmyeon, detail: "Buckwheat noodles in chilled beef broth" }
  - type: highlights
    items:
      - title: A Pil-dong landmark
        text: "Michelin calls it a neighbourhood landmark that has served Pyongyang cold buckwheat noodles **for decades**, next to Namsangol Hanok Village."
      - title: The divisive broth
        text: "The chilled broth has a *delicate* beef flavour. Michelin says its subtlety is **both loved and disputed** among naengmyeon fans, so decide for yourself."
      - title: Fine for one
        text: "Michelin lists it as good for **solo dining**, and Polle reviewers write about eating there alone. One bowl is a full lunch."
      - title: A winter dish, really
        text: "Cold noodles in January sound wrong, but Wikipedia notes mul-naengmyeon was **historically a winter dish**; the summer craze came later."
  - type: prose
    title: Why cold noodles in a Seoul winter
    text: |-
      Pyongyang-style naengmyeon means buckwheat noodles in a chilled beef broth. Pildong Myeonok is one of the old Seoul houses for it, and Michelin keeps it in the Bib Gourmand list as a **₩**-band, worth-queueing-for shop.

      The taste is the point and the argument. Michelin says the broth's subtlety is loved and disputed in equal measure. Pair the noodles with the house **boiled pork**, which Michelin calls buttery and tender, cut in thick slices with a dipping sauce, if you can find someone to split a plate.
