  - type: hero
    image: wall-to-namsan
    hook: Granite, a stone wall on the ridge, and the whole old city at your feet.
    caption: The wall on Inwangsan, looking across downtown to N Seoul Tower
  - type: quick_facts
    time_needed: 2.5–3 h
    best_time: Up for sunset, down in the dusk
    extra:
