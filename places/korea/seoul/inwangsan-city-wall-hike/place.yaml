        detail: KoreaToDo advises it for after-dark hiking
      - label: Fits a work day
        value: Yes, if you start by 16:00
        detail: Down and fed before a 21:00 shift
  - type: highlights
    items:
      - title: A view nobody blocks
        text: "The ridge is bare granite, so the view is open both ways: **Gyeongbokgung** and the old Blue House below, **N Seoul Tower** across the city, **Bukhansan** behind you."
      - title: Walking on the wall
        text: "The trail follows **Hanyangdoseong**, the Joseon city wall, up and over the summit. Near the top you can see where different centuries rebuilt it in different stone."
      - title: Rocks with names
        text: "Inwangsan is known for its strange rock formations: **Seonbawi**, said to look like a monk in meditation, Chimabawi (Skirt Rock) and Gichabawi (Train Rock)."
      - title: Closed for 25 years
        text: "After North Korean commandos infiltrated Seoul on 21 January 1968, the mountain was off-limits. It only reopened in 1993."
  - type: prose
    title: The route
    dropcap: true
    text: |-
      The official Inwangsan section of the City Wall trail runs 4.0 km from the site of Donuimun Gate to **Changuimun Gate**, about 2½ hours. Most people start nearer the top: from Gyeongbokgung Station Exit 1 walk 5 minutes to Sajikdan Altar, then follow the wall uphill. KoreaToDo's version, from the 7-Eleven by the Korea Social Science Library over the summit to Changuimun, is 3.1 km and about 2 h 15 min.

      For a short evening: go up to the summit for sunset and come back down the same way, or carry on north to **Yun Dong-ju Hill** above Changuimun and catch bus 7212, 1020 or 7022 back to Gyeongbokgung Station. Muakjae and Dongnimmun stations (Line 3) on the west side are other ways off the mountain.
