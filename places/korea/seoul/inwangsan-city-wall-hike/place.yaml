    note: "Start: **Gyeongbokgung Station Exit 1** → Sajikdan, then up along the wall. Finish: down the same way, or on to **Yun Dong-ju Hill** (bus 7212 / 1020 / 7022 back to Gyeongbokgung Station Exit 3)."
  - type: tips
    variant: insider
    items:
      - "Time it backwards from sunset: about **17:32** on 10 Jan and **17:42** on 20 Jan, dark by about 18:00–18:10. Leave Sajikdan an hour before."
      - "Night hiking is allowed, and KoreaToDo recommends a **headlamp**. Your phone torch works, but you'll want both hands on the steep steps."
      - "Coming down by the Gyeongbokgung side puts you a short walk from dinner in the hanok lanes between the mountain and the palace, the old Sangchon (Udae) quarter the official site describes."
  - type: tips
    variant: pitfalls
    items:
      - "The official site warns that Inwangsan's rocky sections need extra care **in winter**. After snow or frost, wet granite and stone steps get slick. Skip the dark descent if it's icy; go at midday instead."
      - "**Mondays:** the official City Wall site and the Seoul city trail guide both say open 24 hours, and their only Monday closures are buildings (Yun Dong-ju Literary Museum, Sungnyemun). KoreaToDo still says no hiking on Mondays. Your Mondays are **11 and 18 Jan**: pick another day to be safe."
      - "Going alone? KoreaToDo says there is only one main trail, along the wall: stay on it and tell someone when you expect to be down."
  - type: weather
    temp_low_c: -6
    temp_high_c: 2
    conditions: Freezing, dry, windy on the open ridge
    note: "Seoul's January averages are 2.1 °C by day and −5.5 °C at night. The climb warms you up, then the summit wind and the stop for sunset cool you down fast. Cold, dry air gives the longest views."
    wear: Layers you can open and close, windproof shell, gloves, hat, shoes with real grip
