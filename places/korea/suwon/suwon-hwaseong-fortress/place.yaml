blocks:
  - type: hero
    image: wall-walk
    hook: An 18th-century king's wall wraps a whole city centre, and you can walk all of it for free.
    focus: center
  - type: quick_facts
    time_needed: Half a day (5.7 km wall loop + palace)
    best_time: "Afternoon, finishing on the wall at dusk"
    extra:
      - { label: Wall entry, value: Free, detail: "Open at all hours; night walks allowed" }
      - { label: From Seoul Station, value: "Line 1, ≈ 50 min", detail: "≈ ₩2,250 each way with T-money, no transfer" }
  - type: highlights
    items:
      - title: A wall you can walk end to end
        text: "The fortress wall runs **5.74 km** around old Suwon, with four main gates and dozens of watchtowers, command posts and sluice gates along it. It costs nothing to walk."
      - title: Korea's biggest gate
        text: "**Janganmun**, the north gate, is the largest gate in Korea. **Paldalmun**, the south gate, now sits alone in the middle of a traffic roundabout."
      - title: A king's palace for ₩2,000
        text: "**Hwaseong Haenggung** was King Jeongjo's temporary palace inside the walls. Entry is ₩2,000, or ₩4,000 with the Suwon Museum and Suwon Hwaseong Museum."
      - title: Shoot 10 arrows
        text: "Traditional Korean archery at **Yeonmudae** costs ₩3,000 for 10 arrows, 09:30–17:00 in winter, but not on rainy or snowy days."
  - type: prose
    title: Built in two years, rebuilt from the plans
    dropcap: true
    text: |-
      King Jeongjo of Joseon had Hwaseong built **from 1794 to 1796**, to a design by the scholar Chŏng Yagyong. It became a UNESCO World Heritage Site in 1997.

      Much of the wall was damaged in the 20th century. It was rebuilt in the 1970s from the **Hwaseong Seongyeok Uigwe**, the 1801 construction record that drew every structure in detail. That is why the restoration is so exact.
  - type: gallery
    images:
      - { file: paldalmun, caption: "Paldalmun, the south gate, alone in its roundabout" }
      - { file: wall-gate, caption: Stone walkways and a gate tunnel along the wall }
      - { file: banghwa-pond, caption: "Looking out from a pavilion over the pond below the wall" }
  - type: quote
    variant: vibe
    text: "Crunching along cold stone battlements, tiled roofs below, apartment towers beyond."
  - type: cost_breakdown
    items:
      - { label: Fortress wall, local: 0, brl: 0 }
      - { label: Hwaseong Haenggung palace, local: 2000, brl: 8.31 }
      - { label: "Combo instead: palace + 2 museums (extra over palace)", local: 2000, brl: 8.31, optional: true }
      - { label: "Archery, 10 arrows", local: 3000, brl: 12.47, optional: true }
      - { label: Hwaseong tourist trolley, local: 6000, brl: 24.94, optional: true }
      - { label: "Line 1, Seoul Station ↔ Suwon, both ways", local: 4500, brl: 18.70, estimate: true, optional: true }
    note: "Hanbok wearers get in free."
  - type: map
    note: "From **Suwon Station exit 9** (매산시장 stop), buses 11, 13, 35 and others run to the **팔달문** stop, then it's 5 minutes on foot. From Gangnam, express bus **3000** stops at 팔달문 too."
  - type: tips
    variant: insider
    items:
      - "The wall never closes and night walks are allowed, so you can start at Paldalmun after lunch and end on the wall after dark."
      - "On a work day, start by early afternoon and leave Paldalmun by about **19:00**. That covers the bus to Suwon Station plus ~50 min on Line 1, with a buffer before a 21:00 shift (my estimate, not a timetable)."
      - "The **₩4,000 combo** covers the palace and two museums, but it is not sold on the first Monday of the month, when the museum closes."
      - "Wear **hanbok** and the palace is free. The other free day, the last Wednesday of the month, is 27 Jan: after you leave Korea."
  - type: tips
    variant: pitfalls
    items:
      - "The **trolley** is closed on Mondays and stops on rainy or snowy days. Archery also stops in rain or snow."
      - "The palace closes at 18:00 in January: the summer night opening ended on 1 Nov."
  - type: weather
    temp_low_c: -7
    temp_high_c: 3
    conditions: "Cold and dry, with occasional snow"
    note: "January normals for Suwon (1991–2020). The wall is fully exposed, with no shelter between towers, and the climbs up Paldalsan hill are steep. In snow the trolley and archery stop, but the wall stays open."
    wear: "Warm layers, gloves, shoes with grip for icy stone steps"
  - type: pairs_well
    items:
      - { id: gyeongbokgung-palace, note: "The Seoul palace of the same Joseon dynasty, for a second history day" }
      - { id: inwangsan-city-wall-hike, note: "Seoul's own city wall, if you want another wall walk" }
