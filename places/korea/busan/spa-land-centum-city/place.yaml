  - type: tips
    variant: insider
    items:
      - "Spend **₩10,000 or more** inside (food, drinks or treatments, admission not counted) and the limit rises from four hours to six."
      - "Arrive by **18:00** if you want the full four hours: doors close at 22:00 and last entry is 21:00."
      - "Travelling with a suitcase? Leave it in the locker by the ticket desk **before** you enter."
  - type: tips
    variant: pitfalls
    items:
      - "Older guides list **₩17,000–20,000** and 06:00 opening. Both are out of date: the official page says ₩26,000 and 09:00."
      - "Stay past your limit and it is **₩5,000 per hour**."
      - "The store closes about one day a month and a ticket seller says Spa Land closes with it. Check the calendar on the official page the week you go."
      - "The women's **outdoor bath** is marked as not operating on the official page."
