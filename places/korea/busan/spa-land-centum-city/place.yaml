blocks:
  - type: hero
    image: hot-spring-baths
    caption: "Spa Land's bath hall, its pools under round skylights"
    hook: A January evening spent moving between hot pools, a salt room and an ice room, inside a department store.
  - type: quick_facts
    time_needed: 3–4 h
    best_time: Weekday afternoon or evening
    extra:
      - label: Time limit
        value: 4 h per ticket
        detail: 6 h if you spend ₩10,000+ inside; ₩5,000 per extra hour
      - label: Age rule
        value: Primary-school age and up
        detail: Primary pupils need a same-sex guardian
      - label: Suitcase locker
        value: ₩3,000 for 5 h
        detail: At the ticket desk; ₩1,000 per extra hour
  - type: highlights
    items:
      - title: Two kinds of spring water
        text: "The official page lists **18 hot-spring baths** fed by two natural spring waters (calcium chloride and sodium chloride) pumped from 1,000 m down, plus massage, bench-jet and bubble-jet pools."
      - title: A dozen themed rooms
        text: "The official page counts **13 themed rooms**: yellow clay, charcoal, salt, ice and a fire kiln, plus rooms named Roman, Hamam, Pyramid and Bali, and Finnish, Roman and steam saunas."
      - title: A floor for doing nothing
        text: "Upstairs is the entertainment zone: a relax room, an aesthetic (beauty) room, a restaurant, and a café and drinks bar."
      - title: No wallet inside
        text: "Your wristband works as an e-wallet. Food and drinks are charged to it and paid at the counter on the way out."
  - type: prose
    title: Why a bathhouse earns a Busan day
    dropcap: true
    text: |-
      A *jjimjilbang* is a Korean bathhouse with a shared lounge of heated rooms, and Spa Land is the upmarket version, set on the first floor of the Shinsegae Centum City department store. You pay once, get four hours, and move between the baths and the themed rooms at your own pace.

      It is not cheap for a backpacker. **₩26,000 (R$106.50)** is about three quarters of the R$140 daily budget for Korea, and the price is now the same on weekdays and weekends. What it buys is half a day indoors and warm, which matters in January.

      One practical use: suitcases are not allowed in the locker room, but the ticket desk has a **suitcase locker** at ₩3,000 for five hours. That makes Spa Land a workable last stop before an evening train or a flight.
