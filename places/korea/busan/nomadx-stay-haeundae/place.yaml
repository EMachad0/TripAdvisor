      - "Free toiletries (toothbrush, shampoo, shower gel, slippers). Laundry room and a soundproof music room with drums, guitar and piano."
      - "No children. No curfew."
  - type: highlights
    items:
      - title: Something every evening
        text: "The listing promises daily events (**Beer Day, Pizza Day, Cinema Day**) and outdoor ones like night runs on the beach and surfing at Songjeong."
      - title: Breakfast and a gym, free
        text: "A continental breakfast runs **08:00–11:00** every day, and the 24-hour gym on the 2nd floor costs nothing after you register."
      - title: Capsules with storage
        text: "If ₩12,127 more (with tax) is worth it, the capsule beds have big wardrobes; one October guest said his capsule had its own code and a fan that muffled night noise."
      - title: Top scores
        text: "**9.6 out of 10** from 85 reviews on Hostelworld, with 9.9 for cleanliness, facilities and value, and 8.9 for atmosphere."
  - type: prose
    title: Is it worth the ride out?
    text: |-
      The social side is organised: games in the lounge, a movie night, beer and pizza days, group runs and hikes. Reviewers in October 2026 describe it as easy to meet people and easy to hide when you want to.

      The trade-off is location. It sits by **Jangsan**, the last stop at the eastern end of Metro Line 2, and Hostelworld puts it about 9 km from the city centre. Jagalchi and the old town are on the other side of the city. It suits a plan built around Haeundae, Centum City and the east coast; for a Nampo-dong plan, look elsewhere.

      A weeknight dorm bed is ₩33,075 on Hostelworld, which adds 10% tax at the hostel: **₩36,383 (R$151.21)**. For the night shifts, the quiet hours (23:00–08:00) make the dorm a bad desk; the single room with a desk costs ₩64,680 with tax.
