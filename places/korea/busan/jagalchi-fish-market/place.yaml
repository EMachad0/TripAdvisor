blocks:
  - type: hero
    image: mackerel-stall
    hook: Rows of silver fish on ice, tanks of live crab, and a harbour full of boats right behind the stalls.
    focus: center
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: Late morning, 10:00–12:00
    extra:
      - label: Payment
        value: Cards indoors, cash outside
        detail: One guide says cash can bring 5–10% off at outdoor stalls
      - label: Solo-friendly
        value: Partly
        detail: Portions are sized for groups; see the grilled fish set
      - label: Good in cold
        value: Indoor hall and restaurants
  - type: highlights
    items:
      - title: You choose the fish
        text: "The ground floor of the main building holds the live tanks, more than **300 stalls** by one guide's count. You point, the vendor weighs, and you pay by weight."
      - title: Then you eat it upstairs
        text: "A runner or the vendor takes your seafood to a partner restaurant in the same building. It comes back as sashimi, grilled or steamed, with rice, kimchi and side dishes."
      - title: The outdoor rows
        text: "Outside, stalls sell fish, shellfish, sea vegetables and dried seafood from about **05:00**. One guide calls this part older and less polished than the building."
      - title: The women who run it
        text: "The vendors are known as **Jagalchi Ajumma**, a name from the years after the Korean War when women sold fish on the street here. *Jagal* means gravel, after the shore the market grew on."
  - type: prose
    title: How eating here works
    dropcap: true
    text: |-
      There are two ways in. You can pick seafood at a stall, pay the vendor, and be led to a table. Or you can sit down at a restaurant first and let it source the fish from its own vendor. Either way there are **two bills**: the seafood, and then the restaurant's charges for the table and the cooking.

      The guides do not agree on that second bill. One puts the table fee (*sang-charim*, 상차림비) at **₩5,000–6,000 per person**. Another says about ₩5,000 per person for preparation plus ₩2,000–4,000 for the seat. A third says ₩5,000–10,000 per group. Ask before you sit.

      The market is built for groups. A plate of flounder or rockfish sashimi is sold for two, at about **₩35,000**, and a king crab costs ₩80,000–100,000 a kilo. For one person, the same guide points to the **grilled fish set** in the outdoor alleys, about **₩15,000** with rice and soup, or a small plate of pre-sliced sashimi.

      Order *maeuntang* (매운탕), a spicy stew made from the head and bones of your fish, about halfway through the meal.
