  - type: map
    zoom: 17
    note: "From **Jagalchi Station Exit 10**, turn right onto Jagalchi 3-gil. The main building is on the waterfront, near BIFF Square and Gukje Market."
  - type: tips
    variant: insider
    items:
      - "Go **late morning**. One guide gives 10:00–12:00 as the window when both the hall and the outdoor rows are in full swing and the lunch crowd has not arrived."
      - "Ask for *service* (free extras) instead of a discount. One guide says haggling over premium crab rarely works."
      - "Wear **closed shoes** with grip. The floors are wet and slippery."
      - "With shellfish, say how you want it cooked: steamed is *jjim* (찜), grilled is *gui* (구이)."
  - type: tips
    variant: pitfalls
    items:
      - "The **second bill** surprises first-timers. One guide suggests keeping ₩20,000–30,000 aside for the table fee, cooking and drinks on top of the seafood."
      - "Check that the **basket is empty** of water before the vendor weighs your fish."
      - "Crab, lobster and large prawns push the bill up fast. Agree the total weight and price before anything is cut."
      - "**Tuesday Jan 19, 2027** is a third Tuesday: the indoor building is listed as closed."
