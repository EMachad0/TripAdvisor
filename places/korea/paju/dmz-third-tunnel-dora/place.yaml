blocks:
  - type: hero
    image: dora-winter
    caption: "Dora Observatory's old building in winter. Tours have used a newer one since 2024"
    hook: "73 metres under the border, then binoculars on North Korea: the Cold War, 44 km from Seoul."
  - type: quick_facts
    time_needed: "Full morning: 3 h course + travel"
    best_time: "Sun 10 Jan, your free day, on an early run"
    extra:
      - { label: JSA (Panmunjom), value: Closed, detail: "Suspended since July 2023; no reopening date" }
      - { label: Bring, value: Your physical passport, detail: "No copies or photos; no entry without it" }
      - { label: Guide, value: None on the city tour, detail: "Paid tours from Seoul add one" }
  - type: highlights
    items:
      - title: Inside an invasion tunnel
        text: "The **Third Tunnel**, found in 1978, runs about **73 m** below ground in bedrock, 44 km from Seoul. You go down by monorail or on foot (₩3,000 cheaper) and walk the cramped tunnel toward the line."
      - title: Looking into North Korea
        text: "From **Dora Observatory** on Dorasan, binoculars pick out the **Kijong-dong** propaganda village and the city of **Kaesong**."
      - title: Not a tour bus price
        text: "Paju city runs the official course itself: Imjingak → Third Tunnel → Dora Observatory → Unification Village → Imjingak, about 3 hours, **₩12,200**."
      - title: Imjingak before the gate
        text: "The shuttle starts at **Imjingak**, the one part of the area you can visit on your own, with the Peace Bell and memorials facing the Imjin River."
  - type: prose
    title: What's open, honestly
    dropcap: true
    text: |-
      The famous part, the **Joint Security Area at Panmunjom**, has been closed to tourists since **July 2023**, when a US soldier crossed into the North during a tour. Guides checked in October and November 2026 still list it as closed, with no reopening date. Any tour that sells "JSA" today means a museum or photo zone, not the huts.

      What does run is the **Civilian Control Line** course north of Imjingak: the Third Tunnel and Dora Observatory, with passport checks at the gate. Paju city runs it Tuesday to Sunday. You can go on your own for ₩12,200, or pay a Seoul tour company for transport and a guide.
  - type: gallery
    images:
      - { file: dora-view, caption: "The view hall at Dora Observatory, looking north (June 2024)" }
      - { file: peace-bell, caption: The Peace Bell at Imjingak }
      - { file: imjingak-pinwheels, caption: "Pinwheels at Imjingak's Peace Nuri park" }
      - { file: third-tunnel, caption: "Entrance area of the Third Tunnel. No photos are allowed inside" }
  - type: book_ahead
    steps:
      - days_before: 1
        text: "Try the official site: **실시간예약 > 개인**, pick the date, course and run, enter each visitor's details and pay. Details can't be changed after payment."
      - days_before: 0
        text: "Reach **Imjingak** early. The counter opens at 09:00 and only sells to people who are there. Online bookings must collect tickets 20 min before departure, walk-ins buy up to 10 min before."
    passport_note: "Bring your **original, valid passport**. Screenshots, photocopies and expired passports are refused at the checkpoint."
  - type: cost_breakdown
    items:
      - { label: "Course A ticket, monorail into the tunnel", local: 12200, brl: 50.70 }
      - { label: "Paid tour from Seoul instead (VIP Travel, Oct 2026)", local: 80000, brl: 332.48, optional: true }
    note: "The walking route costs ₩9,200 instead of ₩12,200. Foreigners get no discounts on the city's fees. Train to Imjingang station not included."
  - type: map
    note: "Take the **Gyeongui–Jungang line** to **Imjingang station**, then village bus **058A or 058B**, or walk about 20 min to Imjingak. The ticket counter is inside the Imjingak tourist area."
  - type: tips
    variant: insider
    items:
      - "Go on **Sun 10 Jan**, your free day before the night shifts start. Weekends have the most runs (09:20–14:40). Sat 16 or Sun 17 Jan would mean giving up Hwacheon, and a work day doesn't fit: you'd need a morning start after a shift ending at 06:00."
      - "Each run has 44 seats, and only 14 are sold online. The rest go first come at the counter, so arriving at 09:00 is your safest bet without a Korean booking."
      - "There's no guide on the city tour. Read up on the tunnel and Kaesong first, or pay a Seoul company if you want the story told."
  - type: tips
    variant: pitfalls
    items:
      - "**Mondays** are closed (11 and 18 Jan)."
      - "The official rules ban photos and video **anywhere on the course**, drones included. Phones out only where staff allow it."
      - "Snow can close the DMZ for the day, so check the site's notices that morning."
      - "Tours still advertising **JSA** mean a museum or photo stop, not Panmunjom."
  - type: weather
    temp_low_c: -11
    temp_high_c: 2
    conditions: "Very cold, dry, often clear; occasional snow"
    note: "January normals for Paju (2002–2020), colder at night than Seoul. The observatory and Imjingak are exposed to the wind off the river. The tunnel is sheltered, but the walk down and back up is steep. Snow can cancel runs."
    wear: "Down jacket, hat, gloves, warm shoes with grip"
  - type: pairs_well
    items:
      - { id: hongdae-club-night, note: "Sun 10 Jan: DMZ in the morning, Hongdae that evening before the work week" }
      - { id: gyeongbokgung-palace, note: "The other half of Korea's history, in central Seoul" }
