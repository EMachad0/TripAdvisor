  - type: tips
    variant: insider
    items:
      - "Bring your **passport**. The discounted rate for foreigners is given to foreign passport holders."
      - "Paid alternative: Trazy lists a [2027 shuttle package](https://www.trazy.com/experience/detail/hwacheon-sancheoneo-ice-festival-shuttle-bus-package) from Hongik Univ. and Myeongdong with fishing ticket, rod rental and one grilled fish. It needs 20 people to run."
      - "The other public route: ITX-Cheongchun train from Cheongnyangni to Chuncheon (about 1 h, ₩9,600), then a Hwacheon bus (₩5,800, every 30–60 min). Both figures are from the 2026 edition page."
      - "If you take the train route, the organiser says buses from **Chuncheon station** are often full during the festival. Board at the Chuncheon bus terminal near Namchuncheon station instead."
  - type: tips
    variant: pitfalls
    items:
      - "**Check the last bus back before you start fishing.** The festival page says the last Hwacheon → Dong Seoul bus left at 21:00 in the 2026 edition, but timetables change and seats are limited."
      - "The general fishing areas expect you to bring a rod, a lure and a chair. The official page does not say whether the foreigner zone lends rods, so ask at the ticket booth or look for one at the festival fishing store."
      - "No food, ice boxes, tents or stoves are allowed on the fishing ice. Fish bags are handed out at the booth."
  - type: weather
    temp_low_c: -9
