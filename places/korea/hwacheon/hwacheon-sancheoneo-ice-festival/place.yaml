    conditions: Dry, hard frost, snow on about 9 days in January
    note: "Figures are January normals for Chuncheon, the nearest city with a climate table. Hwacheon is further north in the mountains. You stand or sit still on river ice for hours, so this is colder than walking around Seoul at the same temperature. The festival has warm rest areas."
