  - type: highlights
    items:
      - title: Ice fishing with a foreigner zone
        text: "In 2026 a separate fishing area for foreign visitors ran all festival long, below the suspension bridge, with a rest area and a grill zone. Solo travellers paid **₩10,000** and got a **₩5,000** Hwacheon gift certificate back."
      - title: Eat what you catch
        text: "The festival's grill and sashimi centres cook the trout you caught for **₩3,000 per fish** (2026 price). They don't sell fish separately."
      - title: More than fishing
        text: "The 2026 programme had bare-hand fishing, snow sleds, an ice bobsleigh, ice soccer, the Haneulgareugi ('fly to the sky') ride and an indoor ice sculpture plaza carved by sculptors from the Harbin ice festival."
      - title: Lantern street after dark
        text: "The town's Seondeung street is hung with trout-shaped paper lanterns and LED lights. In the 2025/26 season it ran from 20 Dec to 8 Feb, longer than the festival itself."
  - type: gallery
    images:
      - { file: barehand-pool, caption: "The bare-hand fishing pool, in festival T-shirts and shorts in January" }
      - { file: grilled-trout, caption: "Visitors with their trout at the festival grill zone" }
  - type: prose
    title: Which day to go
    dropcap: true
    text: |-
      The organiser's site shows **Sat 9 Jan – Sun 31 Jan 2027**, 23 days, so the whole of your Korea stay (10–20 Jan) is inside it. Your weekdays are work days (afternoons only, shift from 21:00), and with almost 3 hours of bus each way the festival needs a whole day. That leaves your free weekend, **Sat 16 or Sun 17 Jan**.

      Saturday is the better of the two: Sat night is your one free night out in Seoul, and Sunday then stays free to recover. The organiser warns that on weekends walk-up fishing tickets can run out before noon, so take the first bus and be on the ice by mid-morning. You don't need to book: the foreigner zone sold tickets on site in 2026.

      **Sancheoneo** is a mountain trout that lives only in very clean water. The stream freezes thick enough for people to walk on, holes are cut in the ice, and you fish with a short rod and a lure. Live bait is banned.

      Programme, fees and booking for 2027 are not published yet. The official pages still show 2026 content with a note that the update is being prepared. In October 2026 the county was reviewing a rise of the standard fee from ₩15,000 to about ₩25,000, with a bigger voucher given back.
