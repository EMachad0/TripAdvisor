  - type: tips
    variant: insider
    items:
      - "Bring your own **gloves and goggles**. The resort does not rent goggles, and a guide lists gloves as a ₩20,000 purchase on site."
      - "Collect rental gear outside Saturday and Sunday 12:00–14:00. The resort warns that gear can run out for an hour or two then."
      - "Check your boots and bindings at the counter. The resort swaps or readjusts them on request before you go up."
  - type: tips
    variant: pitfalls
    items:
      - "A cancelled or exchanged lift pass costs ₩2,000, and there is no refund once you pass the gate."
      - "You cannot switch from skis to a snowboard, or back, after renting."
      - "The slopes shut **17:00–18:30** for grooming. Plan a 4-hour pass to finish before 17:00 or start after 18:30."
