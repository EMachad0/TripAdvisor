  - type: highlights
    items:
      - title: A ski resort on the subway map
        text: "The resort says it is the only one in Korea with a metro station (**Baegyang-ri**, Gyeongchun Line) on its grounds. A free resort shuttle links the station and the slopes."
      - title: Built for first-timers
        text: "Eight of the ten slopes are for beginners and intermediates. A travel guide points first-timers to the gentle **Panda** and **Rabbit** slopes."
      - title: Arrive with nothing
        text: "You can rent the ski or snowboard set (skis, boots and poles), a ski jacket and trousers, and a helmet. Helmets have been compulsory since 1 Jan 2026."
      - title: Pay for the hours you ski
        text: "Lift passes are sold by time. The clock starts when you first pass the gate and the evening grooming break does not count."
  - type: prose
    title: Is it worth three to four days of budget?
    dropcap: true
    text: |-
      At 2025/26 list prices, a weekday beginner day costs **₩135,000**: a 4-hour lift pass bought on site (₩72,000), a ski set for up to 4 hours (₩33,000), ski clothes (₩25,000) and a helmet (₩5,000). On weekends the same lift pass was ₩85,000. That is close to four days of your R$140 Korea budget, so pick it only if skiing itself is the goal.

      Nobody pays list price, though. The resort says its prices are before discounts, and its 2025/26 table gave anyone **buying on site** (up to 4 people) 25% off the lift and 30% off rental in the 20 Dec – 22 Feb peak. In January that makes the 4-hour weekday pass about **₩54,000** and the ski set about **₩23,100**; clothes-only and helmet rentals get no discount, so the day comes to about **₩107,000**. **ITX-Cheongchun riders** got more: 40% off the lift and 50% off rental. The page doesn't say what proof either discount needs, so keep your train ticket and ask at the ticket office. The 2-hour on-site pass (₩62,000 list) is enough for a first try.

      **Which day.** The Trazy guide puts the resort about **2.5 hours from Seoul by subway**. Coming off the slopes at the 17:00 grooming break puts you back in Seoul around 20:00 at the earliest, too tight for a 21:00 shift. Your rested weekdays are **Mon 11 and Mon 18 Jan** (no shift the night before); the other weekdays come straight after a 21:00–06:00 shift. On those Mondays a 2-hour pass ending by about 16:00 gets you back with a margin. Sun 10 Jan is your arrival day and pays the weekend rate (₩85,000 lift list price), with rental queues at midday; Sat 16 – Sun 17 Jan is planned for Hwacheon.

      About the train: the resort's own directions say ITX-Cheongchun passengers get off at **Gapyeong or Gangchon** and ride the Gyeongchun Line on to Baegyang-ri. The ordinary Gyeongchun Line subway stops at Baegyang-ri directly. A travel guide gives **Sangbong station** as the Seoul starting point.

      I checked whether another resort would suit a solo beginner without a car better and found no reason to swap: this one ran a full 2025/26 season, most of its slopes are easy, and you reach it on the subway with no tour and no fixed return time.
