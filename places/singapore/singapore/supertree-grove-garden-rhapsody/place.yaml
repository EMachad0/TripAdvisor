  - type: map
    note: "**Bayfront MRT Exit B**, follow the underground linkway, then cross the Dragonfly or Meadow Bridge into the Gardens."
  - type: tips
    variant: insider
    items:
      - "Tap the **same contactless card** at every gate. The S$0.60 foreign-card fee is charged once per day, not per ride."
      - "From Changi Airport station, take the first train to **Expo** (one stop) and change there to the Downtown Line (blue) for Bayfront."
  - type: tips
    variant: pitfalls
    items:
      - "Don't plan on the 20:45 Rhapsody plus Jewel's 22:00 show by MRT. It doesn't fit. Pick one."
      - "Don't drag the 8 kg suitcase around the city: the Jewel L1 counter is open 24 h, and you pass it on the way back to check-in anyway."
      - "Evening taxis (daily 17:00–23:59) cost 25% more than the meter, plus an S$8 surcharge on trips that start at the airport."
