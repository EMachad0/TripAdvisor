    conditions: Hot, humid; frequent afternoon showers in January
    note: "January averages 24–31 °C, the northeast monsoon season with about 13 rainy days. The grove is open-air: a shower can delay or dampen the evening, so carry a small umbrella."
    wear: "Light clothes, a compact umbrella, sandals that can get wet"
