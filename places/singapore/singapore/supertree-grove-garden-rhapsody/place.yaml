  - type: hero
    image: supertrees-mbs
    hook: "Steel trees up to 50 m tall, wrapped in living plants, light up in time to the music. Free, twice a night."
  - type: quick_facts
    time_needed: "5–6 h door to door"
    best_time: "19:45 show, then MRT back"
    extra:
