      - { label: Leave the grove by, value: "≈20:05", detail: "For Jewel's 22:00 show (21:00 is too tight)" }
  - type: highlights
    items:
      - title: The Supertrees
        text: "Twelve of the Gardens' 18 Supertrees stand in the grove, the tallest **about 16 storeys**: vertical gardens of ferns, orchids and bromeliads on steel frames."
      - title: Garden Rhapsody, free
        text: "The grove lights up to music at **19:45 and 20:45** every night. Ground-level viewing in the grove costs nothing."
      - title: Marina Bay all around
        text: "Gardens by the Bay lists **panoramic views of Marina Bay** from the grove. Come before dark and you'll see the bay by day too."
      - title: One change from Jewel
        text: "Changi Airport MRT to Expo, change to the **Downtown Line** for Bayfront: no taxi needed, both ways on a contactless card."
  - type: prose
    title: When the city beats the airport
    dropcap: true
    text: |-
      This is **plan B**. If the only cheap Bangkok flight lands around **midday**, you'd have 9–10 hours at Changi. That's too long for Jewel alone, and the city is 45 minutes away.

      The order: land, leave your bags at the **Jewel L1 baggage counter (24 h)**, then take the MRT from Changi Airport station to Expo and change to the Downtown Line for Bayfront, Exit B. Spend the afternoon around Marina Bay and the gardens, have a hawker dinner, and be in Supertree Grove for the **19:45** show. It's dark by then: sunset on 10 Jan is 19:13.

      Then go straight back. Leave around 20:05 and you reach Changi Airport station around 21:00, with time to collect the bag and stand at the Rain Vortex for the **22:00** show, Sunday's last. Stay for the 20:45 Rhapsody and you'll miss it by MRT. A taxi from the city takes about 30 min, at S$25–45 plus Sunday-evening surcharges.
