blocks:
  - type: hero
    image: canopy-park
    hook: "A rooftop garden under a glass dome, with a glass-floored bridge that crosses straight over the waterfall's mouth."
  - type: quick_facts
    time_needed: 1–2 h
    best_time: "Late afternoon, before 21:00"
    extra:
      - { label: Cheapest way in, value: "S$8 (R$35)", detail: "Gardens, Discovery Slides, Foggy Bowls" }
      - { label: Paid extras close, value: "21:00", detail: "Bridge, nets and mazes; park itself to 22:00 Fri–Sun" }
  - type: highlights
    items:
      - title: Canopy Bridge
        text: "**23 m** up with a glass-bottom middle section and fog at both ends: the best view down into the Rain Vortex. S$13.90, Canopy Park included."
      - title: Walking Net
        text: "A taut net **25 m** above ground, stretched over a void. S$18.90. You need closed shoes and pants or shorts."
      - title: Two mazes
        text: "**Hedge Maze** (Singapore's largest, with a watchtower, S$13.90) and the **Mirror Maze** under a cover of greenery (S$18.90)."
      - title: The free-ish part
        text: "The **S$8** park ticket gets you the Petal Garden, Topiary Walk, Foggy Bowls and the Discovery Slides (minimum height 110 cm)."
  - type: gallery
    images:
      - { file: petal-garden, caption: "The Petal Garden under the dome, part of the S$8 park ticket" }
      - { file: canopy-bridge, caption: "The glass panels of the Canopy Bridge floor, 23 m above the valley" }
      - { file: discovery-slide, caption: "A yellow chute of the Discovery Slides inside its mirrored sculpture" }
  - type: prose
    title: Worth it, or stay on the free floor?
    text: |-
      The free floor (Rain Vortex, Forest Valley, the shows) is the reason you're here, and it costs nothing. Canopy Park is the extra: for a six-hour airport day, **one ticket** is a good use of an hour.

      The pick for you is the **Canopy Bridge (S$13.90, R$61)**. It's the only spot where you stand over the waterfall's mouth, and it includes the gardens and slides. Add the Walking Net if heights are your thing. The **S$39 bundle** (R$171) covers bridge, both mazes, Walking Net and park, but that's more than your R$120 day budget for an hour of mazes: skip it.

      The **Changi Experience Studio** (L4, S$25, Sundays 10:00–20:00) is still open: 20 interactive games and projections about how the airport works. Jewel pitches it to adults and kids alike, but at S$25 it isn't worth it on a one-day stop.
