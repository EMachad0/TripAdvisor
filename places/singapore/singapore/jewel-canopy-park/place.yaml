      - "Luggage and wheeled bags aren't allowed on the nets, mazes or bridge. Drop them at Baggage Storage first: Jewel L1, near the Early Check-in Lounge, open 24 h, S$11 per item under 10 kg."
      - "Bridge, nets and mazes close at **21:00** (last entry 20:30), an hour before the park itself on a Sunday."
