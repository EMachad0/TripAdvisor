  - type: tips
    variant: insider
    items:
      - "Do the bridge **before 19:00** while there's daylight through the dome (sunset 19:13 on Jan 10), then come down for the 20:00 show."
      - "Each attraction ticket already includes Canopy Park entry: don't buy the S$8 park ticket on top of one."
  - type: tips
    variant: pitfalls
