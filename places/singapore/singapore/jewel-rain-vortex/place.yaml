  - type: map
    note: "From T1 arrivals, follow the **Jewel** signs on Level 1. From the MRT, use the link bridges on **Level 2 of T2 or T3**."
  - type: tips
    variant: insider
    items:
      - "Forest Valley is off-limits to luggage and wheeled bags, so drop the suitcase **first**, then explore."
      - "Watch two shows from different heights: from the basement edge you look up into the water, from the upper floors you see the whole dome."
      - "Sunday is the one day you get a **22:00** show. It's also the last one: the waterfall switches off at 22:00."
  - type: tips
    variant: pitfalls
    items:
      - "The free cinema, Butterfly Garden and other transit-area sights are **airside**: you only get there after check-in and immigration, not while you wait for your counter to open."
      - "Scoot's counter closes **60 min** before departure. After the 22:00 show, collect your bag and check in before you do anything else."
