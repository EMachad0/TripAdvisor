blocks:
  - type: hero
    image: rain-vortex-day
    hook: "Seven storeys of water falling through a glass doughnut, with a forest planted around it. Inside an airport."
  - type: quick_facts
    time_needed: 2–3 h (with shows)
    best_time: "Before 19:00 for daylight, then 20:00–22:00"
    extra:
      - { label: Sunday shows, value: "20:00 · 21:00 · 22:00", detail: "Mon–Thu only 20:00 and 21:00" }
      - { label: Bags, value: "Jewel L1, 24 h", detail: "Smarte Carte counter near the Early Check-in Lounge" }
      - { label: Sunset Jan 10, value: "19:13", detail: "Daylight through the dome until about 19:00" }
  - type: highlights
    items:
      - title: The world's tallest indoor waterfall
        text: "Jewel calls it that: water drops **40 m** from the roof oculus to the basement, through seven storeys you can see from every floor."
      - title: Two looks in one evening
        text: "By day the sun catches the spray. After dark the falling water becomes a screen for the **Light & Music Showcase**; on a Sunday you get three runs."
      - title: A forest you walk up through
        text: "**Forest Valley** wraps the waterfall in trees and shrubs on trails from L1 to L4, open 24 h. Jewel says to allow about 30 min per trail."
      - title: Five minutes from your check-in
        text: "Jewel is joined to **Terminal 1's arrival hall** and to T2/T3 by link bridges. You never need a taxi or a train for this stop."
  - type: prose
    title: Your Sunday, airport-only
    dropcap: true
    text: |-
      The plan that fits a **15:00–16:00 landing**: clear immigration, leave the suitcase at the Jewel L1 baggage counter, then see the waterfall by daylight from the L1 floor and the Forest Valley trails. Sunset is 19:13, so you get a few hours of natural light through the dome.

      After that: Canopy Park on L5 (S$8 entry, last entry 21:30 on Sundays; bridge, nets and mazes S$13.90–24.90, close 21:00, last entry 20:30), dinner, and the shows at **20:00, 21:00 and 22:00**. Watch one from the basement edge and one from higher up. After the last show you can fit, collect the bag, check in and go airside.

      **Which show you can stay for depends on your departure.** Scoot's counters close 60 min before departure and boarding closes 15 min before. Roughly: the 22:00 show fits a departure at **00:00 or later**, and the 21:00 show one at **23:00 or later**. For an earlier flight, check in at Jewel's Early Check-in (Scoot from 18 h before) or online before the shows, then go airside right after the 20:00 show.

      Is it enough to fill the day? For **about six hours, yes**. The free floor plus the shows is about 3 h, and Canopy Park and dinner fill the rest. If your flight lands around midday, you'd have 9–10 hours here. That's when the city fallback (Gardens by the Bay, back for the 22:00 show) is worth it.
  - type: gallery
    images:
      - { file: vortex-skytrain, caption: "The Skytrain runs right past the falls; seen from Jewel's upper levels" }
      - { file: vortex-night, focus: center, caption: "After dark, before the Light & Music Showcase" }
  - type: faq
    title: Before you book the flight
    items:
      - q: "Is a whole day at the airport too boring?"
        a: "Landside (no check-in needed) you have the Rain Vortex (10:00–22:00), Forest Valley (24 h), Canopy Park on L5 (10:00–22:00 Fri–Sun) and Jewel's shops and restaurants (mostly 10:00–22:00). That fills about **6 h** comfortably. The airside extras, such as the T3 **Butterfly Garden** and the **free 24-h cinema** in T3 transit (closed for maintenance on Thursdays), are only reachable after check-in and immigration. Landing around midday? Go to the city for the afternoon (see the Gardens by the Bay page)."
      - q: "When can I check in for a red-eye, and does early check-in still exist?"
        a: "Yes. Jewel's **Early Check-in facility** on L1 is open daily **08:00–23:59**. Scoot uses it from **18 h to 3 h** before departure, Singapore Airlines from 24 h to 3 h. Scoot's T1 counters open **2.5–3 h** before departure (A320 vs 787) and close 60 min before. Online check-in opens 48 h before, and the T1 kiosks 18 h before. With carry-on only, early check-in doesn't take your bags off your hands, so use left-baggage."
      - q: "Where do I leave my bags, and what does it cost?"
        a: "Smarte Carte baggage storage at **Jewel L1, near the Early Check-in Lounge**, open **24 h**. There are more counters in T2, T3 and T4 public areas. Rates per 24 h: **S$11 (R$48) per item under 10 kg** (your 8 kg suitcase), S$6 for loose items, S$16 over 10 kg. Changi says every item is searched, so take the laptop out. No self-service lockers are listed on Changi's page; it's a staffed counter."
