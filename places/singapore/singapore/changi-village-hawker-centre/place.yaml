  - type: highlights
    items:
      - title: Changi's nasi lemak
        text: "Coconut rice, fried chicken, egg, ikan bilis and a **sambal** people cross the island for: **S$4** at International Muslim Food Stall, Sundays 17:00–23:00."
      - title: The original Hokkien mee stall
        text: "Eatbook says the Changi Village Fried Hokkien Mee outlet is the original of a stall you see all over Singapore. Open **24 h**, S$5–8."
      - title: Real hawker prices
        text: "Most mains here are **S$4–5**: a full dinner plus dessert for under R$30."
      - title: Almost no tourists
        text: "Changi Village sits at the island's far eastern tip, a bus terminal and a hawker centre most visitors never reach."
  - type: prose
    title: Why this one, for your Sunday
    text: |-
      You asked to stay near the airport, and this is the best cheap meal I found close to Jewel. I checked the on-airport options too. The **T2 staff canteen** (Foodies' Clan) has S$5–8 hawker dishes, but on Sundays it closes at **17:30**, before dinner. The revamped **Kopitiam food court in T3 Basement 2** keeps 15 of its stalls open 24 h and needs no trip, but I couldn't find its current prices.

      For a proper hawker dinner, come here. Leave your bag at Jewel, take a taxi or Grab (about **12 min**), eat between **17:00 and 19:00** when the nasi lemak stall has just opened, and be back at the Rain Vortex for the **20:00** show. If you go by MRT and bus 2, leave by about 16:00.
