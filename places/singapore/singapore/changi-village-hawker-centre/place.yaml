  - type: tips
    variant: insider
    items:
      - "Eatbook (June 2024) lists the nasi lemak stall as Sun 17:00–23:00; that's 2024 data. Call **8400 6882** or check Google Maps that week; if it's shut, the 24 h Hokkien mee and lor mee stalls are the fallback."
      - "Bus 2 runs every **12–15 min** on Sunday evenings."
  - type: tips
    variant: pitfalls
    items:
      - "By taxi the round trip costs about **S$56 (R$246)**, roughly twice your R$120 day budget. The bus costs a few dollars but takes much longer: decide based on how much time you have left before the shows."
      - "Several stalls close one weekday, but Sunday is fine for every stall listed here. Hours are each stall's own, not the centre's."
