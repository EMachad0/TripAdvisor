blocks:
  - type: hero
    image: harmonica-sunday
    caption: Harmonica Yokocho, the lantern alley the game borrows for its Kichijoji
    hook: Royal turned Sun Road into "Sanpo Road" (stroll road) and kept almost everything else, down to the queue for croquettes.
  - type: quick_facts
    time_needed: 3–4 h
    best_time: Weekday late morning, stay till dark
    extra:
      - { label: Game, value: Persona 5 Royal, detail: "Kichijoji: darts, billiards, a thrift shop, hangouts" }
      - { label: From Shibuya, value: Inokashira Line, detail: "Its Shibuya terminal is inside Shibuya Mark City" }
  - type: highlights
    items:
      - title: "Screenshot vs reality: Sanpo Road"
        text: "The arcade gate of **Kichijōji Sun Road** is nearly identical in the game, renamed **Sanpo Road**. The blue **Daiya-gai** arcade next to it becomes **Platinum-gai**."
      - title: The croquette queue is real
        text: "The game's meat shop with a long queue is **Satou**, in Daiya-gai. People queue for its fried beef **menchi-katsu**: **¥350** each in 2026. Weekday mornings have the shortest line."
      - title: Harmonica Yokocho at night
        text: "A covered post-war warren of tiny bars by the north exit, which shows up in Royal's trailers. Red lanterns, standing bars, small eateries: good for one drink."
      - title: Inokashira Park
        text: "The park is a hangout spot already in the original Persona 5, and Royal sends the Shujin students there to pick up litter. It's free and open 24 h; the pond has rowboats (¥800 per 30 min) and swan boats (¥1,000)."
  - type: prose
    title: Royal's extra district
    dropcap: true
    text: |-
      Persona 5 Royal adds Kichijoji as a whole new district. In the game it's where you play darts and billiards and trade old armour at a thrift shop. The real Kichijoji sits at the end of the Keio Inokashira Line from Shibuya, and the game's version is a close copy, with the shop names changed.

      Atlus merged two arcades into one: Gessō-ji temple's gate, really halfway along Sun Road, appears on the same street as Satou. Walk both arcades and spot the switch.
  - type: gallery
    images:
      - { file: harmonica-lantern, caption: A paper lantern in Harmonica Yokocho }
      - { file: harmonica-lane, caption: "One of Harmonica Yokocho's narrow lanes", focus: center }
      - { file: inokashira-swan-boat, caption: A swan boat on Inokashira Pond, focus: center }
  - type: cost_breakdown
    items:
      - { label: Walking Sun Road and Daiya-gai, local: 0, brl: 0 }
      - { label: "Satou menchi-katsu (元祖丸メンチカツ)", local: 350, brl: 12.31 }
      - { label: Inokashira Park, local: 0, brl: 0 }
      - { label: "Rowboat, 30 min (swan boat ¥1,000)", local: 800, brl: 28.14, optional: true }
  - type: map
    zoom: 16
    note: "From Shibuya take the **Keio Inokashira Line** to the end, Kichijōji. Leave by the **North Exit**: Sun Road and Harmonica Yokocho are right there. The park is 5–10 min south of the station."
  - type: tips
    variant: insider
    items:
      - "Queue at **Satou before noon on a weekday**. Menchi-katsu go on sale at 10:30 and stop when they sell out."
      - "Do the arcades by day, the park before sunset, then come back to **Harmonica Yokocho** after dark when the lanterns are lit."
  - type: tips
    variant: pitfalls
    items:
      - "Don't search maps for the game's shop names: Atlus changed the names of real businesses, so only the look matches."
      - "Boats don't run on **Wednesdays from December to February**, and in winter the last ticket is sold at **15:50**."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Mostly clear, dry and cold
    note: "The arcades are covered, so they're fine in any weather. Winter trees are bare, but the pond walk is quiet and pretty in low sun. Rent a boat before 15:50."
    wear: Warm coat, gloves for the park
