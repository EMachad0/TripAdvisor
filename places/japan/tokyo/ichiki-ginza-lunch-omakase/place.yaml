  - type: map
    note: "One minute from **Ginza Station**, on the 4th floor of the Nishigo Building."
  - type: tips
    variant: insider
    items:
      - "Book the **12:00** entry: you get the full 90 minutes. The 13:30 entry is cut to one hour."
      - "Tabelog says the shop may also take bookings by phone (050-5890-3942, the number Tabelog lists for reservations) when the online calendar shows nothing."
  - type: tips
