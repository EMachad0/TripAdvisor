blocks:
  - type: hero
    image: ginza-5-chome
    caption: "Ginza 5-chōme crossing, a minute from the restaurant (no free photo of the counter)"
    hook: Ginza sushi at lunch prices, in front of the knife.
  - type: quick_facts
    time_needed: 90 min seat
    best_time: Lunch from 12:00
    extra:
      - { label: Course, value: 16 items, detail: "11 nigiri, 2 rolls, tamagoyaki, soup, dessert" }
      - { label: Solo, value: "Yes, 1 guest", detail: Tabelog's booking box starts at 1 }
      - { label: Out of place?, value: A little, detail: "A Ginza business-lunch room; the only stated rule is no perfume" }
  - type: highlights
    items:
      - title: Why go over the R$170 day
        text: "About **R$428**, roughly **2.5 days of budget**. You sit at the counter while an Edomae chef serves 11 nigiri one by one, plus rolls, tamagoyaki, soup and dessert. The same room's dinner is ¥18,000 before service; lunch is the smart way in."
      - title: Booking built for foreigners
        text: "The Tabelog course page is in **English** and has its own rules **for customers from overseas**. You don't need a concierge."
      - title: What the room is like
        text: "A modern Japanese room with a **12–13 seat counter** and private rooms. Tabelog tags it as a *relaxing space* that's popular for business meals."
      - title: Honest ranking
        text: "**3.54 on Tabelog** from 760+ reviews. No Michelin or Tabelog award: pick it for a proper counter lunch in Ginza, not for prestige."
  - type: book_ahead
    steps:
      - days_before: 3
        text: "Open the Tabelog **Lunch Omakase Course (¥11,000)**, choose the date, **1 guest**, 12:00. Use your hostel or hotel phone number, as the shop asks."
      - days_before: 1
        text: "From the day before, cancelling costs **50%**; on the day, **100%**."
      - days_before: 0
        text: "Go up to **4F** of the building. An entry at 13:30 gets only one hour."
  - type: menu
    title: The courses (tax included)
    items:
      - { name: Lunch Omakase, price_local: 11000, price_brl: 389.40, note: "16 items; entry 12:00–13:30", tag: signature }
      - { name: Dinner Omakase, price_local: 18000, price_brl: 637.20, note: "21 items, from 17:00" }
    note: "A **10% service charge** is added to both. Drinks are extra and not priced online."
  - type: cost_breakdown
    items:
