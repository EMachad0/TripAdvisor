    social:
      - "**Café & bar lounge on the ground floor**, open to guests and locals: its stated idea: a place where travellers and Tokyo people \"can meet naturally\"."
      - "Café 8:00–18:00, then a bar from 18:00 to 24:30, says the GLTJP directory."
      - "Hostelworld's review summary: guests love \"the vibrant cafe/bar downstairs, which attracts both locals and travellers\"."
      - "No pub crawls or hostel events are mentioned anywhere I looked: the social life is the bar. Quieter common areas upstairs."
    good_to_know:
      - "Check-in 16:00–23:00. 23:00–24:00 only with advance notice and a fee; no check-in after midnight."
      - "Book with your name in English letters exactly as in your passport."
      - "Dorm beds have reading lights, power outlets and privacy curtains; rooms use security key access."
      - "Common areas for reading or working, separate from the bar."
      - "Shared showers and bathrooms. Free Wi-Fi in the whole building."
