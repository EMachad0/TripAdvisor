        text: "From 18:00 the lounge downstairs becomes a bar that locals use too, so you meet more than other backpackers."
      - title: Riverside, near Asakusa
        text: "On the Sumida River in Kuramae; the hostel says Senso-ji is about 15 minutes' walk along the river."
