    note: "Shibuya Scramble Square sits directly on Shibuya Station. The crossing is right outside the **Hachikō exit**."
  - type: tips
    variant: insider
    items:
      - "Set an alarm for **14 days before** your date. The sales window opens then, and sunset slots don't last."
      - "The official top page shows **today's rooftop status** (open or closed) and the sunset time. Check it on the day."
      - "Cross the scramble once **after 22:30**, when Shibuya Sky has closed and the nightlife is just getting going."
  - type: tips
    variant: pitfalls
    items:
      - "If web tickets are sold out, **the counter is sold out too**. Don't count on a walk-up."
      - "No refunds after entry, even if the rooftop shuts while you're up there."
      - "Big bags, food and drink aren't allowed. Station lockers are for luggage; smaller items go in the 46th-floor lockers."
