        text: "Web tickets for your date go on sale **2 weeks ahead**. Choose a slot starting just before sunset (15:00+ price, ¥3,400)."
      - days_before: 1
        text: "Check the forecast. The rooftop can close without notice when the weather turns."
      - days_before: 0
        text: "SHIBUYA SKY is on floors 14, 45–46 and the roof of Shibuya Scramble Square. Leave bags in the 46th-floor lockers before the roof."
