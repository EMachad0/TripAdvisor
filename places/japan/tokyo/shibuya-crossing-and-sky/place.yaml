      - label: Rooftop height
        value: 229 m, open-air
        detail: Can close without notice in bad weather
      - label: Ticket window
        value: 2 weeks ahead
        detail: Web sells out first, counter after
  - type: highlights
    items:
      - title: The scramble, from street level
        text: "Every light cycle, **1,000–2,000 people** cross at once from all sides. It costs nothing. Cross it a few times, then find a window above it."
      - title: A rooftop with no glass
        text: "Shibuya Sky's roof is an open deck **229 m** above the crossing, with Tokyo all around you. Loose hats, tripods and selfie sticks aren't allowed up there."
      - title: Sunset into night
        text: "Book an entry just before sunset and stay as the city lights up. The official page shows each day's sunset time. You can stay until closing at **22:30**."
      - title: Shibuya after dark
        text: "Come down to the clubs of Maruyamachō. **WOMB**, one of Tokyo's best-known clubs, is about an 8-minute walk from the Hachikō exit."
  - type: prose
    title: How to do Shibuya in one evening
    dropcap: true
    text: |-
      Start at street level. Come out of the **Hachikō exit**, wait for the lights to change and walk the crossing in one direction, then back diagonally. It's free and open at any hour.

      Then go up. Shibuya Sky is on top of **Shibuya Scramble Square**, the tower connected to the station. Tickets are timed. An entry before 15:00 costs ¥2,700 online, and one from 15:00 costs ¥3,400. In January the sunset falls in the more expensive band, and those slots go first.

      Winter is the honest catch. The roof is open-air and closes when the weather turns. If that happens you only get the indoor floors, and there are no refunds once you've entered. Check the forecast before your slot.
  - type: gallery
    images:
      - file: view-down
        caption: The crossing from the top of Shibuya Scramble Square
      - file: sky-stage
        caption: "Sky Stage, the open-air rooftop at 229 m"
  - type: quote
    variant: vibe
    text: Cold wind on the roof, the city turning gold and then neon, and the crossing pulsing far below like a heartbeat.
  - type: book_ahead
    steps:
