  - type: tips
    variant: insider
    items:
      - "Come at **13:30** for the first show: seats are first come, first served, and the ones next to the round stage go first (2026 review)."
      - "Bring **cash** in yen. Leave any camera at the front desk; the theater holds it until you leave."
      - "Smoking is only in the lobby. Talking happens in the lobby too: inside, the theater asks for cinema manners."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the Entertainment Business Act (風営法) lists strip theaters as store-type sex-related businesses: notified to the safety commission, commercial zones only. Police still raid them for public indecency: **60+ theaters** and **450+ people**, customers included, 1998–2021 (Bengo4)."
      - "Recent raids hit other theaters: Theater Ueno (2021) and Osaka's Tenma Toyo Show (Nov 2024, 10 arrested, police citing extreme staging). I found no news of a raid on Rock-za itself."
      - "**Phones stay in your pocket.** Taking one out inside is banned outright because of the camera, and staff walk the aisles. Secret filming is a crime in Japan."
      - "Drunk visitors are refused, and anyone who gets drunk inside is dealt with. ID may be checked for the 18+ rule, so carry your passport."
