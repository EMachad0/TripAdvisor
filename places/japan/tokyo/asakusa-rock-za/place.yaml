  - type: hero
    image: rockza-facade
    caption: "Rock-za on the Rokku street (Dec 2023); the theater is behind the arched door at left"
    hook: "Kimono, ballet, hip-hop: each act is a short story set to music, and the costume comes off as the story ends."
