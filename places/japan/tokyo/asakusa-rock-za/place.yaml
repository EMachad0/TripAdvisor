      - { label: Seats, value: "129", detail: "Around a round stage; first come, first served" }
  - type: highlights
    items:
      - title: The oldest strip theater still running
        text: "Rock-za opened in **1947** and is the oldest strip theater still running. The industry is shrinking: Bunshun counted only **15 theaters** left in Japan in May 2026, down from over 300 at the peak."
      - title: A revue, not a club
        text: "The official site describes a **revue**: each scene has a main dancer plus back-up dancers, in styles from Japanese dance and ballet to rock, jazz, hip-hop and cosplay. A 2026 review counts up to ten acts with a short interval."
      - title: Foreigners are expected
        text: "The site has **English and Chinese** versions, and the theater's link page has an English guide video. A 2026 English review describes a respectful, quiet crowd that claps along and throws ribbons at key moments."
      - title: Strict, simple rules
        text: "No touching or talking to the dancers, no phones out, cameras left at the desk. The theater says plainly that it is **a show to watch, not a place for sex acts**."
  - type: prose
    title: What you're buying
    dropcap: true
    text: |-
      The theater itself compares Japanese strip to the strip club in a foreign movie, then says it grew into its own mix of Japanese dance, ballet, rock, jazz and cosplay. Nobody touches or talks to the dancers. You sit in a 129-seat hall around a circular stage, and the dancers rotate through themed numbers that start fully dressed and finish nude. The cast changes with each program of about 20 days, and a 2026 review says it sometimes includes AV actresses.

      At ¥6,000 (about R$215, over one day of your "everything else" budget) it is one evening or afternoon, not a habit. The case for it: this is the oldest strip theater still open, it is listed in English, and it still sits in Asakusa's old Rokku show district, the street in the 1930 photo below.
