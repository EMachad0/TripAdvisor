  - type: highlights
    items:
      - title: Tachigui, the old way
        text: "No seats means no seat costs. Tokyo Cheapo says the money goes into the fish instead. You stand at the counter, order, eat and leave."
      - title: Ordered in pairs
        text: "Nigiri is made **two pieces per order**, so it's easy to taste many fish in a short meal."
      - title: The ¥75 cult item
        text: "2025–26 reviewers keep reordering the **grilled squid tentacle with mayo**, at ¥75."
      - title: A cheap hour in Shibuya
        text: "It's 5 minutes from the Scramble, so it fits between Shibuya Sky and a night out. Most reviewers spent ¥1,000–1,999."
