  - type: highlights
    items:
      - title: About 100 retro cabinets
        text: "The 2nd floor is lined with about **100 '90s-style cabinets**, old but well looked after. The 1st floor has racing and rhythm games."
      - title: Fighting-game history, still played
        text: "*Super Street Fighter II X* (1994) is still studied and played seriously here. *Fatal Fury Special* (1993) even has a yearly 'world championship'."
      - title: Three screens wide
        text: "Look for *The Ninja Warriors* (1987), a cabinet with **three CRT screens** side by side."
      - title: An arcade with a community
        text: "In-store tournaments, some streamed online, and a notebook where regulars leave messages for each other."
  - type: prose
    title: Why Mikado and not a big arcade
    dropcap: true
    text: |-
      Mikado is a one-owner arcade with a point of view. Owner **Minoru Ikeda**, an arcade worker since the mid-'90s, opened it in Kabukichō in 2006 and moved it to Takadanobaba in 2009. He chose to fill it with the cabinets that defined the '80s and '90s.

      It almost didn't survive Covid: crowdfunding kept it alive. Today players around forty share the sticks with people half their age, and the line-up rotates with tournaments.
  - type: quote
    variant: vibe
    text: Clattering joysticks, chiptune from every direction, and a stranger's coin dropping into the other side of your cabinet.
  - type: cost_breakdown
    items:
      - label: About ten games at ¥100
        local: 1000
        brl: 35.1
        estimate: true
    note: "No entry fee: you only pay per game, so spend as much or as little as you like."
  - type: map
    zoom: 17
    note: "About 30 seconds from the JR Toyama exit, 45 seconds from Metro Exit 1. The arcade is on the 1st and 2nd floors of the Oasis Plaza building."
  - type: tips
    variant: insider
    items:
      - "Check the official top page the same morning: Mikado posts **late openings** (13:00 or 16:00) when it's booked for a private event."
      - "Come on a night with a tournament to see the regulars at full strength. Events are listed on the Mikado site."
  - type: tips
    variant: pitfalls
    items:
      - "Mikado has **two Tokyo branches**. This is the Takadanobaba one; the other is near Ikebukuro's east exit."
      - "Closing time differs between sources (24:00 officially, 23:30 in a 2025 guide). Don't plan to arrive after 23:00."
