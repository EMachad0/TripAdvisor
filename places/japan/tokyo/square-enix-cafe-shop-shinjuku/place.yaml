  - type: hero
    image: shinjuku-3chome
    caption: "Shinjuku 3-chōme at night, the district the café is in. No free photo of the café itself"
    hook: "A Slime you can eat, a Potion in a bottle, and a random coaster from four Square Enix worlds."
  - type: quick_facts
    time_needed: 90 min
    best_time: Weekday lunch
    extra:
      - label: Cover
