        detail: The shop is open to everyone, no booking
      - label: Payment
        value: Cards, IC card, cash
  - type: highlights
    items:
      - title: Four games on one menu
        text: "Regular menu themes: **Dragon Quest**, **Final Fantasy**, **NieR:Automata** and *Fullmetal Alchemist*. Think a jiggly Slime sweets plate or Chocobo & Moogle curry."
      - title: The cover comes back to you
        text: "The ¥1,200 cover includes a **drink**, a **random coaster** and a paper **placemat** from the title you choose."
      - title: A free goods floor
        text: "The 1F shop sells official goods from Dragon Quest, Final Fantasy, NieR, Kingdom Hearts and more, without booking or paying a cover."
      - title: Right at the station
        text: "The café says it is **0 minutes** from JR Shinjuku's Southeast exit."
  - type: prose
    title: The café that replaced the café
    dropcap: true
    text: |-
      Square Enix's Akihabara café closed in March 2025 after eight years. In **June 2026** a new permanent one opened in Shinjuku, run by **Newton** (ニュートン), with a fixed menu across four series and limited collaborations on top.

      For more goods, **ARTNIA** in Higashi-Shinjuku is Square Enix's official shop with a café & bar area, open 11:00–21:00 (closed on irregular days), switching to bar time at 17:00.
  - type: quote
    variant: vibe
    text: Chocobo plushies at the next table, and everyone photographing their latte before the first sip.
  - type: book_ahead
    steps:
      - { days_before: 30, text: "Slots for your date open on TableCheck at **12:00 Japan time**, one month ahead." }
      - { days_before: 0, text: "Order on your own phone from the table's **QR code**; the 90-minute limit includes a last order 40 minutes before the end." }
