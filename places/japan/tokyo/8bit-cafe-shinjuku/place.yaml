blocks:
  - type: hero
    image: gameboy-corner
    caption: "Inside 8bit Cafe: the giant Game Boy display, Famicom boxes and shelves of retro toys"
    hook: "Up a steep staircase to a room where everyone grew up on a Famicom."
  - type: quick_facts
    time_needed: 1–3 h
    best_time: At 19:00
    extra:
      - label: Cover
