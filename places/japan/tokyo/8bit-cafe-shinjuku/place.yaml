        detail: Plus a drink every 90 min
      - label: Menu
        value: English menu
        detail: Per Stars and Stripes, 2022
      - label: Seats
        value: About 30
        detail: You may share a table when it's busy
  - type: highlights
    items:
      - title: Every console of your childhood
        text: "Famicom, Mega Drive, Game Gear, a giant Game Boy display and, yes, the **Power Glove**."
      - title: Play with the room
        text: "A 2022 visitor played **Pico Park**, a co-op puzzle game for 2–8 players, on the big Game Boy: sharing a controller with strangers is a solo traveler's easy way into a conversation."
      - title: Game-named cocktails
        text: "The **Dr. Mario** comes in a beaker with candy 'pills' in a test tube; there's a Puyo Puyo and a Metroid too."
      - title: A ¥50 Xevious table
        text: "A 2022 visitor sat at a table-top **Xevious** cabinet, ¥50 a game."
  - type: prose
    title: The after-school room, for adults
    dropcap: true
    text: |-
      8bit Cafe is a small bar run by owner **Nao Fukuda**, who has filled it with the consoles, figurines and manga of the '80s and '90s. Chiptune plays, and the light comes from LEDs and the glow of the TVs.

      It's tiny: about 30 seats up a steep, narrow staircase in an office building, so it fills fast. On some nights musicians play live for the crowd.
