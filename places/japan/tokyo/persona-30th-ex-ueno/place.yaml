blocks:
  - type: hero
    image: winter-queue
    caption: "A winter queue outside the Ueno Royal Museum for an earlier show (2015)"
    focus: "60% 50%"
    hook: Thirty years of Velvet Rooms, tarot cards and Shadows, in a small museum in the middle of Ueno Park.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: A weekday from 26 Jan, at 10:00
    extra:
      - { label: Series, value: "Persona 1 to P4 Revival", detail: "Art, 3D models, first-shown production material" }
      - { label: Entry gift, value: A4 art print, detail: "Key visual 21–29 Jan; 8-hero group art 30 Jan – 7 Feb" }
      - { label: Good in rain, value: "Yes, once inside", detail: "The queue may stand outdoors" }
  - type: highlights
    items:
      - title: Thirty years in one building
        text: "Atlus is a partner on the official show for the series' **30th anniversary**: art and **3D models** from the 1996 original to *Persona 4 Revival* (due 2027), plus production material shown **for the first time**."
      - title: New art for the show
        text: "Every series protagonist was drawn again **for this exhibition**, and the art is going on show-only goods. The goods list is still \"coming soon\"."
      - title: A free print at the door
        text: "Each entry gets an **A4 art print**: the key visual from 21 to 29 Jan, then the art of all eight heroes from 30 Jan. They are handed out while stocks last."
      - title: It fits your dates
        text: "The show runs **21 Jan – 7 Feb 2027**; you're in Japan **20 Jan – 4 Feb**. It is in Tokyo, so go before you head to Kyoto."
  - type: prose
    title: Why this one earns a day
    dropcap: true
    text: |-
      Persona's 30th year has been a run of pop-ups, but almost all of them close before you land: the Shibuya TSUTAYA anime pop-up ends on 4 Jan, and the Loft collab on 7 Jan. This exhibition opens the day after you arrive in Japan, and it is the big one: a show organised with Atlus' help, on two floors of the Ueno Royal Museum.

      Be honest with yourself first: this is a fan exhibition, not a Louvre-level museum. It earns a day only if you have played or watched Persona; if you haven't, skip it and spend the money on an arcade night.

      Plan it for a **weekday after 22 Jan**. The ¥2,700 weekday ticket works on any weekday except the 21st and 22nd, so you don't need to commit to a date. Weekend and opening-day entry is in timed slots.
  - type: gallery
    images:
      - { file: key-visual, caption: "The show's key visual: Joker from Persona 5, with the dates and the museum's name" }
      - { file: ameyoko-entrance, caption: "Ameyoko market, by Ueno Station: street food after the show" }
  - type: book_ahead
    steps:
      - days_before: 1
        text: "On **Lawson Ticket** (Japanese SIM/eSIM): from 21 Jan entry is **¥3,000** while stocks last; weekends and 21–22 Jan need a **timed ticket** (日時指定入場券). Cheaper: the **weekday ticket** (平日入場券) is ¥2,700 by **20 Jan, 23:59**."
      - days_before: 0
        text: "Arrive 5–15 min before a timed slot, and show the e-ticket on your phone."
  - type: cost_breakdown
    items:
      - { label: "Entry ticket, bought from 21 Jan", local: 3000, brl: 105.51 }
      - { label: "Instead: weekday ticket bought by 20 Jan", local: 2700, brl: 94.96, optional: true, note: "Replaces the ¥3,000 ticket; saves ¥300" }
      - { label: "Playmat voucher (show-only goods)", local: 3300, brl: 116.06, optional: true }
  - type: map
    note: "Leave **JR Ueno** by the **Park Exit** (公園口) and walk into the park; the museum is a 3-min walk from the gate. Big suitcases are not allowed and there are no lockers."
  - type: tips
    variant: insider
    items:
      - "The weekday ticket isn't tied to a date: buy it by 20 Jan for ¥2,700, then go on whatever weekday the weather is worst."
      - "Fridays run to 19:00 (last entry 18:00): a late visit leaves the morning for Ueno Park or Akihabara."
  - type: tips
    variant: pitfalls
    items:
      - "**No tickets are sold at the museum**, not even on the day. Sort the e-ticket out before you walk over."
      - "**No video** at all, phone and tablet photos only where allowed, no selfie sticks, and no re-entry once you leave."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Dry and cold
    note: "January normals for central Tokyo (JMA): 1.2 °C low, 9.8 °C high, about 60 mm of rain. Indoors, but the organisers warn that queues may stand outside."
    wear: Warm coat for the queue; a bag small enough to carry, since there are no lockers
  - type: pairs_well
    items:
