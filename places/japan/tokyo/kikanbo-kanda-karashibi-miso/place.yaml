  - type: map
    note: "Corner shop on the east side of Kanda Station. Next door (2-10-10) is **Kikanbo Lab**, which seats Fast Pass holders only; don't join the wrong line."
  - type: tips
    variant: insider
    items:
      - "First time? Order **regular** (普通) for both kara and shibi. Time Out found that spicy but bearable."
      - "Queue too long? Kikanbo's **Fast Pass** on TableCheck sells a timed slot at the new **Kikanbo Lab** in Kanda for **¥1,000** on top of your food. It's cashless only, the fee is non-refundable and doesn't cover food, and it isn't a seat reservation: at busy times you may still wait."
  - type: tips
    variant: pitfalls
    items:
      - "**Peanut allergy?** Kikanbo Lab's booking page says peanuts are used in its noodle dishes. Honten serves the same Karashibi menu, so assume the same and ask before ordering."
      - "**Sunday closes at 16:00**, with no evening service."
