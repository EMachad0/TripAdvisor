blocks:
  - type: hero
    image: kanda-east-exit
    caption: Kanda Station's east side, 3 min from the shop. No free photo of the shop itself
    hook: Two dials, kara and shibi. Turn both up and your lips go numb before the bowl is half gone.
  - type: quick_facts
    time_needed: 30 min + the queue
    best_time: A weekday (Sunday closes at 16:00)
    extra:
      - { label: Style, value: Spicy miso, detail: "Miso + seafood and meat stock, chili and sansho oil" }
      - { label: Pay, value: Card or QR, detail: "Tabelog: cards and QR yes, IC e-money no" }
      - { label: Seats, value: 15 at the counter }
  - type: highlights
    items:
      - title: Kara + shibi
        text: "Buy a ticket at the machine; staff then ask your level for **kara** (chili heat) and **shibi** (the numbing tingle of sansho pepper), each on its own scale."
      - title: Rich without the fire
        text: The menu says the miso, seafood and meat broth is good **even at zero spice**, so heat-shy eaters can still come.
      - title: Ogre's den
        text: "*Kikanbō* is an ogre's iron club, and the room plays along: black walls, **festival devil masks** and taiko drumming on the speakers."
      - title: One stop from Akihabara
        text: Pair it with an Akihabara afternoon; Kanda is the next JR stop south.
