blocks:
  - type: hero
    image: tsukemen-set
    caption: "Fuunji's tsukemen: thick noodles beside the chicken-and-fish dip with fish powder and nori"
    hook: Dip, slurp, repeat — a bowl of chicken-and-fish sludge so thick it clings to every noodle.
  - type: quick_facts
    time_needed: 30 min + the queue
    best_time: 11:00 opening or 17:00 reopening
    extra:
      - { label: Style, value: Tsukemen (dipping noodles), detail: "Chicken + fish double soup, thick straight noodles" }
      - { label: Pay, value: "Card, IC and QR OK", detail: "Tabelog lists credit cards, Suica-type IC cards and QR codes" }
      - { label: Seats, value: 15 at the counter, detail: Solo-friendly; you eat shoulder to shoulder }
  - type: highlights
    items:
      - title: The dipping soup
        text: A **double soup of boiled chicken and fish**, thick and creamy without feeling heavy — Time Out calls it *the* place for tsukemen in Shinjuku.
      - title: Under budget
        text: "**¥1,000 (R$35)** for the standard tsukemen, about the price of a cheap meal."
      - title: A Top 100 shop
        text: Picked for Tabelog's **Ramen Tokyo Hyakumeiten 2025** (the Top 100), and Time Out says repeat customers keep the queue long day and night.
      - title: Next to everything
        text: 2 minutes from the Shinjuku subway gates — easy to slot before the Tocho deck or after Shinjuku shopping.
  - type: prose
    title: How tsukemen works
    text: |-
      Tsukemen arrives as two dishes: a bowl of cold-rinsed, thick noodles and a small bowl of hot, concentrated soup. Dip a mouthful, eat, repeat. The soup is meant to be too strong to drink on its own.

      Ramen Adventures' blogger called it his new favourite tsukemen, ahead of Tokyo heavyweights TETSU and Rokurinsha, for the "layers upon layers of fish flavors". A large portion of noodles (麺特盛) is ¥200 more on the official menu.
