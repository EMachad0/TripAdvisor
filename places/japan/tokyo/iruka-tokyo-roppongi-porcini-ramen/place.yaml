blocks:
  - type: hero
    hook: Shoyu ramen that smells of porcini, with a side of truffle paste to stir in halfway.
  - type: quick_facts
    time_needed: 30 min + queue
    best_time: Mid-afternoon
    extra:
      - { label: Order, value: Kiosk in English, detail: "Pay by card, IC or QR; no cash (Tabelog, Aug 2025 blog)" }
      - { label: Seats, value: 9 at the counter, detail: Plus one 4-seat room (Tabelog) }
      - { label: Out of place?, value: "No", detail: "Michelin tags it 'Worth queueing for' and 'Solo dining'" }
  - type: highlights
    items:
      - title: The fancy part
        text: "Time Out lists chicken meatballs, chicken slices, chashu, pork, **smoked duck** and Kujo green onion on the special porcini shoyu, with a side dollop of **mushroom and truffle duxelles**. That's a long way from a ¥1,000 tonkotsu."
      - title: Locals and Michelin agree
        text: "**3.82 on Tabelog** from almost 3,000 reviews, and a **Bib Gourmand** in the current **Michelin Tokyo 2026** selection."
      - title: Backpacker-proof ordering
        text: "No booking, no dress code: queue, then order at a **touch-screen kiosk with English** and pay by card or Suica."
      - title: Under R$80
        text: "The special bowl is **¥2,200 (R$78)**; add the truffle egg rice for ¥400 if you're hungry."
  - type: menu
    title: What people order (Nov 2026 reviews)
    items:
      - { name: Porcini shoyu ramen, price_local: 1800, price_brl: 63.72 }
