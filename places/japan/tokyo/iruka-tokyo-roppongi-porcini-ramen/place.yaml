    variant: insider
    items:
      - "Queues vary a lot. Tabelog reviews from Oct–Nov 2026: **no wait** around 16:00 on a weekend, 4 people ahead at 13:00 on a weekday, but **over an hour** at 17:40 and **1.5 hours** on a holiday morning."
      - "Go **mid-afternoon**: the Aug 2025 blog got in within 15 minutes at about 15:00 on a weekday."
      - "Queue first, then the kiosk: you order and pay when it's your turn (Aug 2025 blog)."
