  - type: highlights
    items:
      - title: The same price as locals
        text: "Unseen Japan says shops that let foreigners in often add a **\"foreigner tax\"** (about ¥3,100, sometimes more). Enishi writes that foreign guests pay **no extra charge**, nomination is free, and the listed price is the total."
      - title: Costume play, the Psyche link
        text: "From **90 minutes** a costume is included at no charge, and there are free drinks in the salon (venue FAQ). It's the closest a Yoshiwara bath house gets to Psyche Dream Spa's themed sessions, without a script."
      - title: Staff who can talk to you
        text: "The listing says it has staff who speak **English** and **Chinese**. The most recent reviewers (Nov 2026) are from Taiwan, New Zealand and Singapore."
      - title: Yoshiwara, the real one
        text: "Japanese Wikipedia calls Yoshiwara, a former red-light district, **Japan's largest soapland district** (about 160 shops). Most of them turn foreigners away; this one is on the official foreigner-welcome portal."
  - type: prose
    title: How it compares, and why it's a splurge
    dropcap: true
    text: |-
      A soapland is a private bath room where a woman washes you and gives a body massage; Japanese Wikipedia classes it as a store-based sex business under the Entertainment Business Act. Enishi is in the high-end tier: Unseen Japan puts the average soapland at about ¥30,000 for 70 minutes and luxury houses at ¥85,000 or more for 120.

      Be clear about the money: even the **60-minute course at ¥40,000 (about R$1,430)** is over eight days of your R$170 "everything else" budget, nearly double Psyche Dream Spa, for one hour. The venue itself suggests 60 minutes for a first visit. The 90-minute course (¥60,000, about R$2,145) adds the free costume; only take it if this is the one splurge of Japan. The case for Enishi: one transparent price, staff who speak English, in Japan's biggest soapland district. The value soapland in Asakusa is ¥3,000 cheaper for the same hour.
  - type: book_ahead
    steps:
      - { days_before: 0, text: "Open the venue's YOASOBI HEAVEN page, check who is working, and message through the **multilingual chat** or LINE with the day, time and course." }
      - { days_before: 0, text: "Take out **¥40,000 in cash** (60 min; ¥60,000 for 90); the venue says foreign cards don't work at the desk." }
      - { days_before: 0, text: "Hibiya Line to **Minowa**, Exit 1a, then walk about 10 minutes southwest. Pay at the front desk." }
