  - type: tips
    variant: insider
    items:
      - "Book in the venue's own chat or LINE, not through anyone on the street or an agency."
      - "Ask in chat which costumes are available; the page doesn't list them."
      - "Unseen Japan says workers at many foreigner-friendly shops ask for a condom from the start, and Tokyo syphilis cases have risen four years running. Expect it."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the 1956 Anti-Prostitution Act bans intercourse for payment but sets no penalty for the act; it punishes soliciting, procuring and providing a place. Soaplands are licensed under the Entertainment Business Act and sit in a tolerated grey zone."
      - "**Enforcement is real for shops:** in June 2026 police arrested five people at **Louvre**, a high-end Yoshiwara soapland, for providing a place for prostitution (coki, Unseen Japan). Unseen Japan calls the risk small but non-zero."
      - "**The law may change:** a 2026 Justice Ministry panel backed rules on people who solicit to buy sex, and HRW (Oct 2026) says a reform bill is expected. Today clients face no penalty."
      - "Most Yoshiwara shops refuse foreigners (Wikipedia, Unseen Japan). Don't walk door to door; go to the one you booked."
