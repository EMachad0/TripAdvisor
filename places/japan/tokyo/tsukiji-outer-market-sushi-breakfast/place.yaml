blocks:
  - type: hero
    image: zanmai-sushi
    caption: Nigiri at Sushi Zanmai in the outer market
    hook: The tuna auction moved to Toyosu in 2018. The breakfast stayed in Tsukiji.
  - type: quick_facts
    time_needed: 2–3 h with the walk
    best_time: 8:00 sushi, market after 9:00
    extra:
      - { label: Avoid, value: "Wed, Sun", detail: Many shops close; Sushi Zanmai doesn't }
      - { label: Card OK, value: Yes, detail: "Sushi Zanmai takes cards, Suica, PayPay" }
  - type: highlights
    items:
      - title: The 24-hour flagship
        text: "**Sushi Zanmai Honten** never closes. You can order a single piece: egg or squid at ¥140, bluefin lean at ¥382, chūtoro at ¥547."
      - title: Pros first, then you
        text: "The market's official site asks visitors to let professional buyers go first **until 9:00**. Eat sushi early, then shop the stalls."
      - title: The cheap way vs the trap
        text: "Ordering eight pieces à la carte costs about **¥2,460**. A set like Kokoro-iki (12 pieces) is ¥3,828, and the deluxe set is ¥5,148. Choose the fish yourself and stop when you're full."
      - title: Toyosu, honestly
        text: "The **tuna auction** now happens at Toyosu. It's only worth the 5:30 start if you win the free lottery for the close-up deck. Everyone else watches from the 2nd-floor visitor walkway."
  - type: prose
    title: Tsukiji or Toyosu?
    text: |-
      **Tsukiji** is where you eat: an open grid of food stalls and sushi counters. It's busiest between 9:00 and 13:00 and quiet after the shops close in the afternoon.

      **Toyosu** is the working wholesale market, open 5:00–17:00 except Sundays, holidays and market closed days. The close-up **tuna auction deck** runs 5:45–6:25 and is free, but places are drawn by lottery: 100 people a day, and you show your passport at the 5:30 meeting. For **January 2027** tours, entries are open **Dec 2–8, 2026**, with results on Dec 17. The February 2027 dates weren't out yet. If you lose the draw, the 2nd-floor walkway doesn't justify a 5 a.m. alarm. Spend that morning here instead.
