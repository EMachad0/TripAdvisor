  - type: highlights
    items:
      - title: A low posted price
        text: "**¥37,000 for 60 minutes** (about R$1,323), tied with Shinkaigyo in Kabukicho for the lowest 60-min fare on the foreigner portal's Tokyo soapland list. Yoshiwara's high-end houses ask ¥60,000 and up for 90 min (Enishi)."
      - title: Used to foreign first-timers
        text: "Recent reviews from foreign visitors (Oct–Nov 2026: Mexico, Denmark, the US, the UK, Malaysia, Australia, Hong Kong and more) mention staff with **explanations in several languages**, a woman with the rules ready in English, translation apps for the rest."
      - title: 25 years in Asakusa
        text: "The venue calls itself **the only soapland in Asakusa**, open there for 25 years, on a back street behind the Don Quijote store (Camikaze)."
      - title: No Kabukicho detour
        text: "It's in the sightseeing district, steps from the **Tsukuba Express** exit, so it fits a Senso-ji day without a night in Kabukicho."
  - type: prose
    title: What a soapland is, and how this one compares
    dropcap: true
    text: |-
      A soapland is a private bath room where a woman washes you and gives a body massage; Wikipedia files it under Japan's licensed, store-based sex businesses. Unseen Japan puts the average at about ¥30,000 for 70 minutes, with luxury houses at ¥85,000 or more for 120. Unseen Japan also says foreigner-friendly shops often add a "foreigner tax"; MAX's page lists none, so confirm.

      At ¥37,000 it is still about eight days of your "everything else" budget, about one and a half times what Psyche Dream Spa cost in Bangkok. What you give up against Enishi in Yoshiwara: the costume, the longer session and the old pleasure quarter. What you get: a posted price, a central location and recent reviews from foreign first-timers.
