  - type: tips
    variant: insider
    items:
      - "Reviewers say the women use translation apps; one speaks English well. Ask in chat if language matters to you."
      - "Unseen Japan says workers at many foreigner-friendly shops ask for a condom from the start, and Tokyo syphilis cases have risen four years running. Expect it."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the 1956 Anti-Prostitution Act bans intercourse for payment but sets no penalty for the act; it punishes soliciting, procuring and providing a place. Soaplands are licensed under the Entertainment Business Act and sit in a tolerated grey zone."
      - "**Enforcement hits shops:** police arrested five people at Yoshiwara's **Louvre** in June 2026 for providing a place for prostitution. A 2026 Justice Ministry panel backed rules on people who solicit to buy sex, and HRW says a reform bill is expected; clients face no penalty today."
      - "Wikipedia says many shops refuse foreigners. Book here; don't try other doors on the way."
      - "**MAX's Kabukicho branch** (¥40,000 for 60 min) is in the area the UK government says most British drink-spiking victims were targeted, often by English-speaking street touts. Never follow a tout to any venue."
