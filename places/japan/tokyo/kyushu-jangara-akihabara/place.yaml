    variant: insider
    items:
      - "Try the **mild** house bowl first; go **Bonshan** if you want the thick, creamy Hakata style."
      - "Vegetarian friend along? This is the branch with the **vegan ramen**, and staff can leave out the five pungent ingredients (garlic, onion and the like) if you ask."
