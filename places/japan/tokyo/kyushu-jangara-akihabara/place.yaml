blocks:
  - type: hero
    image: shopfront-night
    caption: "The Akihabara Honten at night: neon sign, lanterns and a wall of menu posters"
    hook: The 1984 shop that brought Kyushu-style pork-bone ramen to Electric Town, open late and cheap.
  - type: quick_facts
    time_needed: 30 min
    best_time: Evening after the arcades
    extra:
      - { label: Style, value: Tonkotsu, detail: "Mild pork-bone, chicken and vegetable soup" }
      - { label: Reopens, value: 26 Nov 2026, detail: After a renovation that adds the space next door }
      - { label: Veg option, value: Vegan shoyu ramen, detail: Only at this main branch (Chiyoda tourism site) }
  - type: highlights
    items:
      - title: Tonkotsu, five ways
        text: "The house bowl is a **mild** pork-bone soup. **Bonshan** is creamy Kurume/Hakata-style, **Kobonshan** adds Kumamoto-style black garlic oil, and **Karabon** is the spiced one."
      - title: Cheap and late
        text: "About **¥890 (R$31)** for a bowl at the Akasaka branch (Akihabara's new price isn't published), open until **22:00** every day before the renovation. A safe dinner after Akihabara's arcades close in on you."
      - title: Akihabara history
        text: "Here for **nearly 42 years** (the shop's own words in Sept 2026), so since about 1984, long before Akihabara turned anime."
      - title: The vegan bowl
        text: The main branch's **dark-soy vegan ramen** uses no animal products or chemical seasonings. It was once served on JAL flights.
