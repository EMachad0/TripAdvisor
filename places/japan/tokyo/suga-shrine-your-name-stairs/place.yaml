  - type: highlights
    items:
      - title: The film's final scene
        text: "The closing scene of the anime film **Your Name** (2016) takes place on these stairs, and they were on the film's posters too."
      - title: A real neighbourhood staircase
        text: "Locals use these stairs every day. That's the charm: it's an everyday Tokyo street, not a theme park."
      - title: An Edo-era shrine at the top
        text: "Suga Shrine has guarded Yotsuya's 18 neighbourhoods since the early Edo period. Its June festival was once one of Edo's five great festivals."
      - title: Fans' wishes on wood
        text: "Fans of the film leave **ema**, wooden wish plaques, at the shrine. Add your own or just read theirs."
  - type: prose
    title: Finding the stairs
    dropcap: true
    text: |-
      From **Yotsuya-sanchome** on the Marunouchi Line it's about a 7-minute walk; from JR Yotsuya, about 10. The shrine's own site lists five lanes in from the main roads. Two of them end at "the stairs below the shrine", and cars can't get past.

      Look for a flight of stone steps with **red railings** climbing toward the shrine. Try it from the bottom looking up, and from the top looking down into the street.

      Then climb up and see the shrine itself. The gate closes at 17:00, and charms and goshuin stamps are sold from 10:00 to 16:45.
