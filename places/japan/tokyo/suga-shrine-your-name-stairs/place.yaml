  - type: tips
    variant: insider
    items:
      - "Go **early on a weekday**. It's quieter, and you won't spend your visit waiting for a gap in other people's photos."
      - "Re-watch the last 5 minutes of the film on the train there. Standing on the steps hits differently."
  - type: tips
    variant: pitfalls
    items:
      - "These are **residents' stairs**. Keep to one side, keep your voice down and don't block anyone carrying shopping."
      - "The shrine gate opens at **06:30** in winter. If you want the shrine too, don't come before that."
