    note: "From JR Ikebukuro, walk east along **Sunshine 60 Street** (about 8 min), or ride the Yurakucho Line one stop to Higashi-Ikebukuro."
  - type: tips
    variant: insider
    items:
      - "Time the observatory for sunset, around **17:00** in late January, and stay for the night view; last entry is 20:30."
