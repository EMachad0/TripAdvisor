blocks:
  - type: hero
    image: view-60f
    caption: "Ikebukuro from the Sunshine 60 observatory"
    hook: "Sixty floors up there's a lawn to lie on, and Tokyo runs to the horizon in every direction."
  - type: quick_facts
    time_needed: 3–4 h
    best_time: Weekday, sunset at the top
    extra:
      - { label: Mall entry, value: Free, detail: "About 220 shops and restaurants" }
      - { label: Observatory, value: "251 m, 60th floor", detail: "¥700 weekdays, ¥900 weekends, ¥1,200 peak" }
      - { label: Aquarium, value: "¥2,600–3,200", detail: "On the roof; the price changes by day" }
  - type: highlights
    items:
      - title: A park on the 60th floor
        text: "The observatory is now **Tenbou-Park**: artificial grass, a hill to sit on and a 251 m view that takes in Tokyo Tower and the Metropolitan Government Building at night."
      - title: Penguins over the city
        text: "The **Sunshine Aquarium** sits on the roof of the World Import Mart building. Its 12 m **Penguins in the Sky** tank hangs overhead, so the birds look as if they are flying over the towers."
      - title: Pokémon, Ghibli and a gyoza stadium
        text: "The flagship **Pokémon Center Mega Tokyo** is on alpa 2F. GO TOKYO lists **Donguri Kyowakoku** (Studio Ghibli goods) and, inside the Namjatown indoor theme park, a stadium of famous gyoza stalls."
      - title: Free to wander
        text: "Walking the malls costs nothing. Only the observatory, the aquarium, the planetarium and Namjatown charge."
  - type: prose
    title: Why it's worth a card
    text: |-
      Sunshine City opened in 1978: an office tower, a hotel, a theatre, a museum, a planetarium and several malls in one complex on Ikebukuro's east side. The shopping is ordinary chain retail. The reasons to come are the things on top of it and in between: the lawn at 251 m, the rooftop aquarium and the Pokémon Center Mega Tokyo.

      On a budget, the observatory at **¥700** on a weekday is a cheap paid view; the Metropolitan Government Building's deck in Shinjuku is free. Skip the aquarium unless penguins are your thing. At ¥2,600 or more it eats most of a day's budget.
