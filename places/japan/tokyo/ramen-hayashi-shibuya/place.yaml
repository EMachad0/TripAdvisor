blocks:
  - type: hero
    image: bowl
    caption: A Hayashi bowl with chashu and egg (older photo from Commons)
    hook: Ten stools, a short menu and a shoyu broth that Shibuya regulars have queued for since 2003.
  - type: quick_facts
    time_needed: 30 min + the queue
    best_time: Before 11:30 on a weekday
    extra:
      - { label: Style, value: Shoyu, detail: "Pork-chicken bone and seafood soup, soy-sauce seasoned" }
      - { label: Pay, value: Cash only, detail: "No cards, IC or QR (Tabelog)" }
      - { label: Seats, value: 10 at the counter }
  - type: highlights
    items:
      - title: One bowl, done right
        text: "Ramen, ramen with egg, chashu ramen — and that's about it. No rice, no sides: you're here for the **soup**."
      - title: The secret shio
        text: "Not on the machine: buy a regular ramen ticket and say **\"shio\"** when you hand it over — same price, salt instead of soy."
      - title: A local's Shibuya
        text: Magical Trip says that in Shibuya, "ramen" often just means **Hayashi**. And it's only 6 minutes from the Scramble.
      - title: Cheap for the quality
        text: "**¥1,000 (R$35)** for a bowl from a 3.77-rated Tabelog shop with 3,600+ reviews."
