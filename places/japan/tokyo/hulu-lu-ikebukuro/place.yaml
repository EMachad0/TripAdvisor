  - type: hero
    image: shoyu-bowl
    caption: "A bowl at Hulu-lu: fine noodles, rare chashu, menma and sprouts in a clear broth (2019)"
    hook: A Hawaiian café look, Kibi black chicken in the pot, and noodles made with Hawaiian water.
  - type: quick_facts
    time_needed: 40 min + the queue
    best_time: Wed, Thu, Sat or Sun at 11:00
    extra:
      - { label: Style, value: Shio (and shoyu), detail: "Chicken and aromatic-veg soup, house noodles" }
      - { label: Pay, value: Cash only, detail: "No cards, IC or QR (Tabelog)" }
      - { label: Seats, value: 11, detail: 5 counter seats + tables }
  - type: highlights
    items:
      - title: Chicken, done clear
        text: The base is **Kibi black chicken, whole chicken and aromatic vegetables** — light, fragrant, the opposite of a tonkotsu bomb.
      - title: Award shelf
        text: "The shop says it won a **ramen grand prix**, and it was in Tabelog's **Hyakumeiten** (Top 100) five years running, **2017–2021**."
      - title: Hawaii in Ikebukuro
        text: Opened in 2012 by the former manager of the famed Chabuya; the room looks like a **Hawaiian café**, the noodles are reportedly made with **Hawaiian water**, and sets come with **Spam**.
      - title: Under ¥1,000
        text: "Shio or shoyu SOBA for **¥970 (R$34)**, about the price of a cheap meal."
  - type: prose
    title: Read the calendar first
    text: |-
      Hulu-lu runs a rota. **Fridays** are tsukemen-only (curry, spicy or miso dips). The **2nd and 4th Mondays** serve only abura soba and TKM, a raw-egg noodle bowl. The **1st of each month** is "Tomato.Hulu-lu", tomato ramen and tomato tsukemen only. **Tuesdays** it's closed.

      For the shio, aim for a **Wednesday, Thursday, Saturday or Sunday**. Thursdays and Saturdays also bring a limited chicken paitan, and Sundays and Mondays a light niboshi bowl.
