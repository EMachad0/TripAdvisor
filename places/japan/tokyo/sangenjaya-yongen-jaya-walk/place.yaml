blocks:
  - type: hero
    image: suzuran-dori
    caption: Suzuran-dōri, the alley lane beside Sangenjaya station
    hook: The station is called San-gen (three) here and Yon-gen (four) in the game. Same narrow streets, same quiet.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: Dusk, then the free deck after dark
    extra:
      - { label: Game, value: Persona 5 / Royal, detail: "Yongen-Jaya (四軒茶屋): Café Leblanc, the bathhouse, the laundromat" }
      - { label: Good in rain, value: Partly, detail: The deck is indoors; the walk is not }
  - type: highlights
    items:
      - title: "Screenshot vs reality: Yongen-Jaya"
        text: "The game's district is the wedge of streets **enclosed by Route 246 and Setagaya-dōri**, by the station. Guides say not every shop sits where the game puts it, but the low houses, wires and tight lanes feel the same."
      - title: Leblanc's real-world model
        text: "Café Leblanc doesn't exist. Guides name a small **snack bar, New Marina**, on these backstreets as the model for its front. It's a working bar: look from the street, don't block the door."
      - title: The bathhouse and the laundromat
        text: "Guides match the game's **Fuji no Yu** to the old **Chiyo no Yu** sentō, across from that bar, and a 2017 fan photo walk found the coin laundry and supermarket too. A current bathhouse listing marks it **temporarily closed**, so expect to see it from outside only."
      - title: A free view on the 26th floor
        text: "**Carrot Tower**, the orange tower over the station, has a free observation lobby on 26F, open until 22:00. On clear days you can see as far as Mt Fuji."
  - type: prose
    title: Why this neighbourhood
    dropcap: true
    text: |-
      Persona 5's hero spends the year sleeping in the attic of Café Leblanc in **Yongen-Jaya**, a district Atlus copied from Sangenjaya, a five-minute train ride from Shibuya. It's a pun: *san* is three, *yon* is four.

      This is a lived-in residential corner of Setagaya, not a theme park. In 2017 Atlus asked fans on the game's official site to keep things low-key here: take your rubbish with you, don't photograph places where photos aren't allowed, and leave the residents alone. Come as a walker, not a film crew.

      Pair it with the Shibuya walkway the same evening: in the game, the Den-en-toshi Line ride from here to Shibuya is the protagonist's daily commute.
  - type: gallery
    images:
      - { file: backstreet-night, caption: "Sangenjaya 2-chōme after dark: the Yongen-Jaya mood" }
      - { file: carrot-tower-alley, caption: Carrot Tower above the alleys; its 26F deck is free, focus: center }
      - { file: sangenjaya-crossing, caption: The Sangenjaya crossing under the expressway }
  - type: quote
    variant: vibe
    text: Wires overhead, a laundromat humming, a bar sign flickering on. You half expect a black cat to cross the street.
  - type: map
    zoom: 16
    note: "Take the **Tokyu Den-en-toshi Line** from Shibuya to Sangen-jaya. Wander the lanes of **Sangenjaya 2-chōme**, between Route 246 and Setagaya-dōri; the pin marks that block, not one door."
  - type: tips
    variant: insider
    items:
      - "Go **at dusk** and finish on the deck: its night view is free until 22:00."
      - "Ride the **Tokyu Den-en-toshi Line** from Shibuya both ways, the commute the game has you make."
  - type: tips
    variant: pitfalls
    items:
      - "This is a **residential neighbourhood**. Atlus itself asked fans not to trespass, cosplay at people's homes or leave rubbish."
      - "Don't count on a soak at the 'Fuji no Yu' bathhouse: Chiyo no Yu is listed as temporarily closed, with no reopening date."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Mostly dry, sunny and cold
    note: "January is Tokyo's driest, sunniest stretch, so the walk is easy. Dusk comes early in winter, which suits the night-time look of the backstreets."
    wear: Warm jacket, gloves for after dark
