blocks:
  - type: hero
    image: mural-from-below
    caption: Myth of Tomorrow seen from below its plaque; no free photo shows the whole 30 m
    focus: top
    hook: In the game it's the Walkway in the Teikyu Building. In real life it's a glass corridor under a huge atomic-bomb mural.
  - type: quick_facts
    time_needed: 1–1.5 h
    best_time: Walkway before 21:00, then Center Gai
    extra:
      - { label: Game, value: Persona 5 / Royal, detail: "Shibuya: the Walkway hideout, Central Street, Station Square" }
      - { label: Good in rain, value: Mostly, detail: The walkway is indoors }
  - type: highlights
    items:
      - title: "Screenshot vs reality: the hideout"
        text: "The Phantom Thieves plan their heists in the **Walkway**. The real one is the 2nd-floor passage in **Shibuya Mark City**, from the JR/Ginza Line side to the Keio Inokashira Line gates, with tall windows over the street."
      - title: A freshly restored mural
        text: "Taro Okamoto's **Myth of Tomorrow** runs 30 m along the walkway. It was lost in Mexico for decades, and its first big restoration since 2008 **finished at the end of June 2026**."
      - title: Central Street is Center Gai
        text: "Atlus renamed Center Gai **Central Street**. Guides say you'll recognise many signs and shop fronts, but the game moved buildings around, and the backstreet airsoft shop doesn't exist."
      - title: "Station Square: one thing is gone"
        text: "Politician Yoshida's speeches happen on **Station Square**, modelled on Hachikō Square. One real landmark has gone since: the old green train car that served as a tourist info centre was **moved to Odate, Akita, in August 2020**."
  - type: prose
    title: How the game uses Shibuya
    dropcap: true
    text: |-
      Persona 5 opens in Shibuya, and the station is the hub you pass through almost every day: up from the underground mall, through the walkway, out to the square. Atlus kept the layout and changed the names: the walkway sits in the "Teikyu Building", and Center Gai becomes Central Street.

      Do it in one loop: in from the Ginza or Inokashira Line side, the walkway and mural, down to the Scramble and Hachikō, then into Center Gai. Royal adds a second hangout district, Kichijoji, at the far end of the Inokashira Line.
  - type: gallery
    images:
      - { file: walkway-commuters, caption: "Commuters hurrying through the walkway (2016)" }
      - { file: center-gai-rain, caption: "Center Gai on a rainy afternoon, the game's \"Central Street\"" }
      - { file: ginza-line-mark-city, caption: "A Ginza Line train sliding into the station at Mark City" }
  - type: quote
    variant: vibe
    text: Commuters stream past a 30-metre skeleton on fire. Nobody looks up. You sit by the window and plan a heist.
  - type: map
    zoom: 17
    note: "From the Hachikō exit, follow signs for the **Keio Inokashira Line**. The walkway is the long 2F glass corridor before its gates; the mural is on the inner wall. No ticket needed."
  - type: tips
    variant: insider
    items:
      - "Step back to the **window side** of the walkway to take in more of the 30 m mural."
      - "Do it on the same evening as the Scramble and Shibuya Sky (their own card): it's all one station."
  - type: tips
    variant: pitfalls
    items:
      - "Hours for the walkway aren't published: do it **before 21:00** and leave the late evening for Center Gai and the Scramble."
      - "Don't look for the game's airsoft shop in Center Gai's backstreets: guides say it has no real counterpart."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Mostly clear, dry, cold evenings
    note: The walkway is indoors and sheltered, so winter only matters for the street part. Clear, dry January evenings are good for Center Gai's neon.
    wear: Warm jacket; it gets cold once the sun is down
