blocks:
  - type: hero
    image: entrance
    caption: "The entrance on a Ginza side street (Dec 2023)"
    hook: Ramen made like a French consommé, by a chef who cooked French food for 30 years.
  - type: quick_facts
    time_needed: 30 min seat + queue
    best_time: Booked slot from 12:00
    extra:
      - { label: Seats, value: 6 at the counter, detail: Tabelog; you eat and go }
      - { label: Pay, value: "Card, IC or QR", detail: "Tabelog lists Visa/Master/JCB/Amex, Suica-type IC cards and PayPay" }
      - { label: Out of place?, value: "No", detail: "Michelin: good for solo dining. No dress rule in its house rules" }
  - type: highlights
    items:
      - title: A clear step up from our everyday bowls
        text: "Time Out lists a broth of **Nagoya Cochin chicken, duck, scallop, dried tomato, shiitake, kombu and cured ham**, seasoned with **French sea salt** instead of tare. It's light gold and clear, a different animal from Fuunji or Kikanbo."
      - title: Ex-starred, now Bib, still ¥1,200
        text: "Michelin moved it up from Bib Gourmand to **one star in the 2022 guide**. It lost the star in the **2024** guide (Time Out) and is Bib Gourmand in the current **Tokyo 2026** selection. The 2027 list comes out on **Feb 16, 2027**, after your Japan days."
      - title: Locals rate it too
        text: "**3.92 on Tabelog** from about 2,570 reviews."
      - title: Casual, and honest about it
        text: "A six-seat counter, one bowl per person, 30 minutes per seat. The only house rules are about time, photos (food only) and phone calls."
  - type: prose
    title: Who's behind it
    text: |-
      Owner-chef Matsumura spent more than 30 years in French kitchens before opening Hachigou (Time Out). Michelin's 2022 announcement called his bowl a "borderless balance of Japanese and Western elements".

      This is the one ex-starred shop on your list. Nothing about it is formal: it's a ramen counter where you queue or book a 30-minute slot.
  - type: book_ahead
    steps:
      - days_before: 7
        text: "The **Saturday before** your week, at **09:00 Japan time** (21:00 Friday in Brazil), open TableCheck and pick a slot from 12:00, party of **1**. Pay the ¥500 fee by card."
      - days_before: 0
        text: "Arrive on time with the confirmation email; they may ask for ID. You have **30 minutes** from your slot time."
  - type: menu
    title: The bowls (tax included)
    items:
      - { name: Chūka soba, name_local: 中華そば, price_local: 1200, price_brl: 42.48, note: "The clear signature bowl", tag: signature }
      - { name: With seasoned egg, name_local: 味玉中華そば, price_local: 1400, price_brl: 49.56 }
      - { name: Special chūka soba, name_local: 特製中華そば, price_local: 1600, price_brl: 56.64 }
      - { name: Ravioli Gourmandise chūka soba, name_local: ラビオリグルマンディーズ中華そば, price_local: 2200, price_brl: 77.88, note: "Limited to 30 bowls a day; can sell out", tag: must-try }
      - { name: Meat rice, name_local: 肉ご飯, price_local: 500, price_brl: 17.70 }
    note: "Prices from the official page (Nov 2026). One bowl per person; no second bowl."
  - type: cost_breakdown
    items:
      - { label: Ravioli Gourmandise bowl, local: 2200, brl: 77.88 }
      - { label: TableCheck booking fee, local: 500, brl: 17.70, optional: true }
      - { label: Meat rice on the side, local: 500, brl: 17.70, optional: true }
  - type: map
    note: "3 min from **Higashi-Ginza** or **Shintomichō** stations; 10 min from JR Yūrakuchō."
  - type: tips
    variant: insider
    items:
      - "Set an alarm for **Saturday 09:00 JST**: TableCheck releases the following Tuesday–Sunday then, and the venue says it can't help if no dates show."
      - "Walk-ins are taken in order from **11:00**; booked guests get priority from 12:00, so the earlier you queue, the better."
  - type: tips
    variant: pitfalls
    items:
      - "The ravioli bowl is **limited to 30 a day**, and TableCheck warns a booking doesn't guarantee it."
      - "Arrive **10 minutes late** and the booking counts as cancelled, with the ¥2,500 charge."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Cold, dry and mostly sunny
    note: "If you walk in rather than book, expect to queue for your turn before 12:00; with a booking the wait is short."
    wear: Coat for the queue; anything you like inside
