  - type: prose
    title: A free floor that earns an hour
    dropcap: true
    text: |-
      Shibuya PARCO reopened in late November 2019 after a rebuild, with a floor of Japanese pop-culture shops. The pull is that the **official stores sit side by side**: you can buy a Nintendo sound clock, a Pikachu plush and a Monster Hunter mug without leaving one floor.

      It costs nothing to walk around, so it fits between the Scramble and dinner. Go on a weekday morning: on weekends Nintendo TOKYO lets people in with numbered tickets.
