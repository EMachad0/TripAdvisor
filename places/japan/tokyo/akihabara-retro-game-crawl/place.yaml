  - type: highlights
    items:
      - title: The retro floor
        text: "Super Potato's **3rd floor** is old games and consoles, mainly Nintendo; the official page lists everything from Famicom and Mega Drive to oddities like the Pyuta."
      - title: Free play with candy
        text: "The **5th floor** is a small retro game center. A 2022 guide describes a timed free-play system (about ¥1,000 an hour) where players eat as much candy as they like."
      - title: Soundtracks and strategy guides
        text: "The **4th floor** is the merch floor: soundtrack CDs, strategy guides, art books. Good for souvenirs that fit in a backpack."
      - title: HEY across the street
        text: "Taito's **HEY** has four floors and, per Tokyo Cheapo, more than 300 video games. In 2017 it had a whole shoot 'em up corner (photo below); check what runs now on its official page."
  - type: prose
    title: Why this pair
    dropcap: true
    text: |-
      Akihabara has dozens of game shops. **Super Potato** is the one that treats retro games like a museum you can buy from: it calls itself Japan's No. 1 for retro game stock, and the shelves go from boxed Famicom carts to Game & Watch handhelds in glass cases.

      Across the street, **HEY** (Hirose Entertainment Yard, in the Hirose head-office building) is Taito's arcade under a huge orange sign. Mikado in Takadanobaba is the place to *watch* old fighting games played seriously; HEY is where you drop in for a credit or two on the way past.
