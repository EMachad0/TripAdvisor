blocks:
  - type: hero
    image: side-lanterns
    caption: "Hantei's wooden side wall in Nezu (2015)"
    hook: "Thirty-odd kinds of skewer in rotation, behind iron bars on a Nezu corner."
  - type: quick_facts
    time_needed: "2 h dinner, 70 min at peak"
    best_time: "Dinner 17:00 (UTC+9)"
    extra:
      - { label: Course, value: 12 skewers + sides, detail: "Small plates, vegetable sticks, miso, ochazuke, dessert" }
      - { label: Solo, value: "Yes, 1 guest", detail: "TableCheck's guest picker starts at 1 adult" }
      - { label: Out of place?, value: "No", detail: "Neighbourhood dinner spot; English menu listed; tatami rooms" }
  - type: highlights
    items:
      - title: The tasting format, without a show
        text: "The **Hantei Course** brings **12 seasonal skewers** a few at a time, with appetizers, side dishes, raw vegetable sticks and the house miso, then seaweed **ochazuke** and dessert. You stop thinking about what to order and just eat."
      - title: More than pork and onion
        text: "The official site says the kitchen rotates **30-odd kinds of skewer**, and TableCheck lists Kyoto carrots, tofu curds and white fish next to the classic pork and lotus root, with salt and miso as well as sauce."
      - title: The house is the other half
        text: "A **Meiji-era three-storey wooden house** built entirely of keyaki (zelkova), which survived the 1923 earthquake. It's a registered tangible cultural property. The windows upstairs look over old tiled roofs."
      - title: Why go over the R$170 day
        text: "About **R$275** for dinner, or **R$130** for the lunch set with eight skewers. That's the cheapest of the tasting menus on your list, with no service charge listed."
  - type: gallery
    images:
      - { file: iron-lattice, caption: "The street front behind its iron lattice, added when the road was widened" }
      - { file: entrance, caption: "The entrance and its noren curtain" }
      - { file: corner-2024, caption: "The house in 2024", focus: top }
      - { file: skewers, caption: "A round of fried skewers on the bamboo tray (2016)" }
  - type: book_ahead
    steps:
      - days_before: 3
        text: "Open Hantei on **TableCheck**, pick **1 adult**, the date and a time, and choose the **Hantei Course (¥7,700)**. It's only sold online."
      - days_before: 1
        text: "Last day to cancel: TableCheck says parties of 1–4 cancel **by the day before**."
      - days_before: 0
        text: "Arrive **at** your booked time: there's no waiting area and they can't seat you early. Twenty minutes late without calling and the booking may be cancelled."
  - type: menu
    title: The courses on TableCheck (tax included)
    items:
