      - { name: "Yoruzen (dinner)", name_local: よる膳コース, price_local: 6600, price_brl: 235.95, note: "12 skewers, appetizers, sides, vegetable sticks, miso; no ochazuke or dessert" }
      - { name: "Hiruzen (lunch)", name_local: ひる膳コース, price_local: 3630, price_brl: 129.77, note: "8 skewers, sides, rice and red miso soup or ochazuke, dessert; 90 min" }
    note: "Drinks are extra; their prices aren't published online."
  - type: cost_breakdown
    items:
      - { label: Hantei Course (dinner), local: 7700, brl: 275.28 }
    note: "Drink prices aren't published, so they're left out."
  - type: map
    note: "One minute from **Nezu Station** (Chiyoda Line), exit toward Shinobazu Pond. The building is on the corner, behind tall iron bars."
  - type: tips
    variant: insider
    items:
      - "Lunch is the budget way in: the **Hiruzen** set is ¥3,630 with eight skewers, from 11:30 (UTC+9), last order 14:15 (UTC+9)."
      - "The ¥6,600 **Yoruzen** has the same 12 skewers as the Hantei Course but no ochazuke or dessert, and you can book it too."
  - type: tips
    variant: pitfalls
    items:
      - "**Closed Mondays.** On Sundays it may shut early if ingredients run out, so book Sunday for lunch or an early dinner."
      - "Seating includes **stairs and tatami**; you can't pick your seat. The kitchen fries in shared oil and can't take severe allergies."
      - "Japan Food Guide sells different course versions at different prices; compare before you book."
