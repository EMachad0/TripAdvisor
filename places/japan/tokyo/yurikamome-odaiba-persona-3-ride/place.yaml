blocks:
  - type: hero
    image: on-the-bridge
    caption: "An oncoming train inside Rainbow Bridge's lower deck"
    hook: "No driver, a front window over the track, and a loop up onto a suspension bridge. Play Burn My Dread."
  - type: quick_facts
    time_needed: 3–4 h
    best_time: "Start mid-afternoon on a clear day"
    extra:
      - { label: Game link, value: "Loose (fan theory)", detail: "Persona 3's Port Island and its monorail" }
      - { label: Bridge walk, value: "Free, ~30 min", detail: "Last entry 17:30 in winter" }
  - type: highlights
    items:
      - title: The front seat
        text: "The Yurikamome has **no driver's cabin**: a big window looks straight down the track as the train leaves Shimbashi, winds between towers and makes a **270-degree loop** up onto **Rainbow Bridge**."
      - title: A bay bridge you can walk
        text: "Get off at **Shibaura-futo** and cross Rainbow Bridge on the free walkway, about **30 min** each way, with the bay below."
      - title: The artificial island
        text: "Like Port Island, Odaiba is built on reclaimed land in the bay. The game itself calls Port Island **\"the Bay Area\"**, and the film's monorail views look like this line."
      - title: Cheap, for a whole afternoon
        text: "The suggested route is two rides, about **¥590**. Add stops (Telecom Center, Toyosu) and a tapped contactless card stops charging at **¥820** a day, the same as the QR one-day pass."
  - type: prose
    title: How loose is the link?
    dropcap: true
    text: |-
      Be honest with yourself before you go: Atlus has never said Port Island is Odaiba. A fan who mapped the locations says the game deliberately avoids anything you could pin to a real place. Only the anime film's monorail scenes, with the bay and a big bridge outside the window, look like the Yurikamome.

      One fan favourite is gone: VenusFort, the indoor "Venetian" mall often matched with Paulownia Mall, **closed for good on 27 March 2022**. What is left is the feeling: a quiet driverless train to an island of glass towers, a long bridge, and the bay at night. Kobe also has a real Port Island, with Japan's first fully automated line (1981). Nobody has tied that one to the game either.
  - type: quote
    variant: vibe
    text: Headphones on, front seat, the city tilting as the train climbs the loop. Somewhere it is the Dark Hour.
  - type: cost_breakdown
    items:
      - { label: "Shimbashi → Shibaura-futo (ticket fare)", local: 260, brl: 9.14 }
      - { label: "Odaiba-kaihinkoen → Shimbashi (ticket fare)", local: 330, brl: 11.61 }
      - { label: Rainbow Bridge walkway, local: 0, brl: 0 }
  - type: map
    note: "Start at **Shimbashi**. Ride to **Shibaura-futo** (5 min walk to the walkway's Shibaura entrance), walk across to Daiba, then pick the train up again at **Odaiba-kaihinkoen** (15 min walk from the Daiba entrance)."
  - type: tips
    variant: insider
    items:
      - "Board at **Shimbashi**, the first station: mid-route the train is usually packed, and local kids compete for the front seats."
      - "Ride back to Shimbashi **after dark** for the bridge at night from the front window, since the walkway shuts at 18:00 in winter."
  - type: tips
    variant: pitfalls
    items:
      - "The ¥820 cap counts only taps with the **same card number on the same device**: use the card *or* the phone with it, not both. Suica and paper tickets pay every fare."
      - "The walkway is closed on the **3rd Monday** and may refuse entry in bad weather: check before you plan the walk."
  - type: weather
    temp_low_c: 1
    temp_high_c: 10
    conditions: Dry and cold
    note: "January normals for central Tokyo (JMA): 1.2 °C low, 9.8 °C high, about 60 mm of rain. The bridge and the island are open to the wind off the bay, and the walkway may shut in bad weather."
    wear: Windproof jacket, gloves and a hat for the bridge
