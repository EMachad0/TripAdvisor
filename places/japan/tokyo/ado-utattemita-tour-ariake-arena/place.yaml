blocks:
  - type: hero
    image: ariake-arena
    focus: center
    caption: Ariake Arena from outside; no free photo of an Ado show
    hook: Ado's 10th year as a singer, celebrated with a covers tour that opens in Tokyo on her anniversary day.
  - type: quick_facts
    time_needed: About 5 h
    best_time: Sun Jan 10 or Mon Jan 11
    extra:
      - { label: Tickets, value: Lottery only so far, detail: "Fan site; general sale date not announced" }
      - { label: Age rule, value: "3+ need a ticket", detail: "Under 3 not admitted" }
      - { label: Venue, value: "Arena, ~12,000 seats", detail: "Up to 15,000 with extra seating" }
  - type: highlights
    items:
      - title: Exactly on your dates
        text: "The only Ado concerts in Jan 4–22: **Sun Jan 10** (17:00) and **Mon Jan 11** (16:00, holiday) at Ariake Arena. The tour then goes to Osaka (Jan 30–31) and Nagoya (Feb 27–28)."
      - title: A 10th-anniversary show
        text: "The *Utattemita* (\"I tried singing it\") tour marks ten years since Ado started as a cover singer. Opening night falls on the anniversary date itself, **Jan 10**."
      - title: Covers, fresh off an album
        text: "Her new covers album, *Adoの歌ってみたアルバム その2*, comes out Dec 23, 2026, two weeks before the tour opens."
      - title: Arena size, not stadium
        text: "Ariake Arena seats about 12,000. Ado played Nissan Stadium in July 2026, so this is a much closer room."
  - type: prose
    title: How to get a ticket
    dropcap: true
    text: |-
      This is the hard part. So far tickets have been sold only by **lottery** to members of Ado's paid fan site, *Ado no Dokidoki Himitsu Kichi*. The first round ran Oct 20–27, 2026 and a second member lottery opened on Nov 5. DISK GARAGE, the Tokyo promoter, lists the **general sale** as "before general sale", with no date yet.

      Prices (tax included): **A seat ¥10,000**, S seat ¥15,000, VIP ¥20,000 with extras. There are seated-only versions of A and S. Up to four tickets per application. At R$351 for the cheapest seat it's two days of your budget. The trade: it's the one Ado concert anywhere near your trip.

      Watch DISK GARAGE's page for the general sale. We couldn't confirm whether a foreign visitor can join the fan site or buy without a Japanese phone number, so check that first.
  - type: book_ahead
    steps:
      - { days_before: 60, text: "Check Ado's fan site for any further member lottery, and whether you can join from abroad." }
      - { days_before: 45, text: "Watch the **DISK GARAGE** pages for the general sale date; buy the moment it opens." }
      - { days_before: 0, text: "Doors open 90 min before the show. Bring the ticket in whatever form the seller issues it." }
  - type: quote
    variant: vibe
    text: Twelve thousand penlights in the dark, and that voice.
  - type: cost_breakdown
    items:
      - { label: "A seat (cheapest)", local: 10000, brl: 351 }
      - { label: "Upgrade to S seat (¥15,000)", local: 5000, brl: 175.5, optional: true }
  - type: map
    zoom: 15
    note: "8 min on foot from **Shin-Toyosu** or **Ariake Tennis no Mori** (Yurikamome). The venue says the Toei 05-2 bus from Tokyo Station may be too full to board on event days."
  - type: tips
    variant: insider
    items:
      - "Bookmark the **DISK GARAGE** pages for both dates. They'll show when the general sale opens."
      - "**Jan 10** suits your work week (it's a Sunday); **Jan 11** is a public holiday at the start of your vacation."
  - type: tips
    variant: pitfalls
    items:
      - "**Don't buy from resellers.** DISK GARAGE bans resale without the promoter's consent and has a form for reporting resold tickets."
      - "Family seats need a child aged 3–12 with you, and staff may check. Don't pick them to save time."
      - "Leave time for the queue: doors open 90 minutes before the show."
