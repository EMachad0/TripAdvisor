      - { name: Premium Omakase, price_local: 13200, price_brl: 467.28, note: "Adds lobster; drinks extra. On TableCheck: 'Special Assigned Selection'" }
      - { name: All-Omakase (with drinks), price_local: 13200, price_brl: 467.28, note: "Listed on TableCheck as 'Full Omakase Course'. Tabelog: all-you-can-drink", tag: signature }
      - { name: All Premium (with drinks), price_local: 16500, price_brl: 584.10, note: "Lobster course plus drinks" }
    note: "From TableCheck (Nov 2026). The drinks course is the only one with a known all-in price; à la carte drink prices aren't published."
  - type: cost_breakdown
    items:
      - { label: "All-Omakase dinner, drinks included", local: 13200, brl: 467.28 }
  - type: map
    note: "Shibuya Stream is **directly connected to Shibuya Station** (Exit C2, or the JR New South Exit). The restaurant is on **3F**."
  - type: tips
    variant: insider
    items:
      - "Only want to taste it? The **weekday lunch omakase is ¥5,500** at the counter, 11:00 or 13:30."
      - "The **drinks** course costs the same as the lobster course without drinks. If you drink sake, it's the better deal."
