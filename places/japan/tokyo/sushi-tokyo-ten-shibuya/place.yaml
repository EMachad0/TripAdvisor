blocks:
  - type: hero
    image: shibuya-stream-atrium
    caption: "Inside Shibuya Stream, home of the restaurant (3F). No free photo of the counter"
    hook: "Omakase without the hush: sushi and sake for one fixed price, upstairs from Shibuya Station."
  - type: quick_facts
    time_needed: About 2 h
    best_time: Dinner, any day
    extra:
      - { label: Courses, value: "¥9,900–16,500", detail: "Tax incl.; one ¥13,200 course includes drinks" }
      - { label: Solo, value: "Yes, counter", detail: TableCheck takes 1 adult at the counter }
      - { label: Out of place?, value: "No", detail: "26 seats in a station mall; reviewers book last-minute after work" }
  - type: highlights
    items:
      - title: Why go over the R$170 day
        text: "At **R$467** it's about **2.7 days of budget**. A chef-made omakase of appetisers and nigiri, and Tabelog files this course as **all-you-can-drink** (last order 30 min before the end). Bluefin **tuna from Ōma and Iki**. Do it once, on a day with no other paid plans."
      - title: The relaxed kind of omakase
        text: "A 26-seat room of counter and tables inside a Shibuya station complex. A Tabelog reviewer booked it last-minute after work with a friend. Neither TableCheck nor Tabelog mentions a dress code."
      - title: Foreigner-proof booking
        text: "**TableCheck in English**, party of one at the counter, card on file. Prices shown already include tax."
      - title: What locals say
        text: "**3.57 on Tabelog** from about 400 reviews. Not a Michelin or Tabelog award winner: it's here for value and ease, not prestige."
  - type: book_ahead
    steps:
      - days_before: 3
        text: "On TableCheck pick **Counter seats → 'Full Omakase Course' ¥13,200**, 1 adult. That's the drinks course; 'Special Assigned Selection' at the same price is the lobster course **without** drinks. Add your card."
      - days_before: 1
        text: "Last day to cancel without paying. From the day itself, cancelling costs the full course."
      - days_before: 0
        text: "Go to **Shibuya Stream 3F**. Arrive on time; same-day changes are by phone only."
  - type: menu
    title: The courses (tax included)
    items:
      - { name: Lunch Omakase, price_local: 5500, price_brl: 194.70, note: "Weekdays only; counter at 11:00 or 13:30", tag: cheap }
