    rating:
      score: 3.83
      out_of: 5
      source: Rakuten Travel
      checked: 2026-11-11
    social:
      - "**Not a place to meet people.** Men and women sleep on separate floors and the capsule floors are for sleeping only."
      - "The lounge (46 seats, desks, power, Wi-Fi) is where eating, drinking and talking are allowed."
    good_to_know:
      - "Multi-night guests: out by **10:00** for cleaning. **Lockers can't be opened then**, so take what you need; the lounge stays open."
      - "Locker is 33 × 58 × 158 cm. A bigger backpack goes in the luggage room: ask at check-in."
      - "Free: loungewear, bath and face towel, slippers, earplugs. A toothbrush costs ¥100, so bring yours."
      - "**No cash.** Pay by card, transport IC card (Suica/Pasmo) or QR (Alipay, WeChat Pay, PayPay)."
      - "Arriving after midnight? Tell them in advance or the booking can be cancelled for the day."
      - "No eating or drinking inside the capsule. Soiled bedding costs a ¥5,000 cleaning fee."
      - "Official-site bookings: free to cancel until the day before. Rakuten, Booking.com and others: their own terms apply (Rakuten's 返金不可 plans are non-refundable)."
  - type: faq
    items:
      - q: "Why is this so expensive? Is it cheap on Japan prices? It's literally a pod, why the high price?"
        asked: 2026-11-11
        correction: true
        a: "It depends on the night. Booking.com (seen 11 Nov) had the pod at **¥5,555** on Mon 11, Tue 12 and Sun 17 Jan, ¥6,349 Wed–Thu, ¥10,317 Fri and **¥15,873** on Sat 9, Sat 16 and **Sun 10**, the eve of the Coming-of-Age Day holiday. A social-hostel dorm bed the same week on Hostelworld: Nui. ¥4,750 Wed 13 / ¥7,410 Sat 16, Wise Owl Shibuya ¥6,500 / ¥9,250. So midweek a pod costs about a dorm bed; on weekends up to twice as much. Book Sun 17 or Mon–Thu, not \"any Sunday\"."
  - type: highlights
    items:
      - title: The pod itself
        text: "Inside it is **215 cm deep, 105 cm wide and 102 cm high**, with a mattress, pillow, duvet, a power outlet, a light dimmer and a roll-down blind instead of a door."
      - title: Your sleep, measured
        text: "Book a **sleep-analysis plan** and sensors in the capsule log sleep time, movement, snoring, breathing and heart rate, and a PDF report arrives by email about five business days later."
      - title: Two minutes from the Yamanote Line
        text: "Shin-Okubo station is a 2-minute walk. Seibu-Shinjuku station, which sits next to the **Kabukicho** entertainment district, is 7 minutes on foot."
      - title: Open until 05:00
        text: "Check-in runs from 15:00 to 05:00, so a late night out in Shinjuku still ends in your own pod."
  - type: prose
    title: How a capsule night works
    text: |-
      You check in at reception and get a locker. Everything you carry goes in there: the capsule holds you and your phone, nothing else. Change into the loungewear, shower in a private booth (shampoo, conditioner and body soap provided), then find your numbered pod.

      In the morning you check out by 11:00. If you booked several nights you keep the same capsule and locker, but the capsule floors are off-limits during the daily cleaning (from 10:00 to be safe) and lockers stay shut then, so take what you need and plan to be out or in the lounge.

      One night is enough to tick this off. You get more privacy than in a dorm and less company, so sleep here on Sun 17 Jan or a Mon–Tue night (¥5,555 on Booking.com) and keep a social hostel for the weekend.
