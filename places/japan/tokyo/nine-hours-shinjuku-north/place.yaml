    conditions: Cold, dry and mostly sunny
    note: "January in central Tokyo averages 1.2 °C at night and 9.8 °C by day, with about five wet days and 193 hours of sun. The stay is indoors and the station is 2 minutes away."
    wear: Warm coat for the street; loungewear is provided inside
