  - type: map
    note: "A 2-minute walk from JR Shin-Okubo station, or 7 minutes from Seibu-Shinjuku station."
  - type: tips
    variant: insider
    items:
      - "Pick **Sun 17 Jan or a Mon–Tue night** (¥5,555 on Booking.com), or Wed–Thu (¥6,349). Not Sun 10 Jan: as the holiday eve it costs ¥15,873, like a Saturday."
      - "Every capsule here has the sleep sensors. Rakuten's **sleep-analysis plans** start at ¥4,320 and add a report on how you slept in a pod."
      - "Earplugs are free if you ask. The capsule closes with a roll-down blind, not a door."
  - type: tips
    variant: pitfalls
    items:
      - "**Sat 9, Sun 10 and Sat 16 Jan at ¥15,873 (R$557)** cost almost three times a Monday for the same capsule. Don't."
      - "This is not where you meet people to go out with. Book it for one or two nights between hostels."
      - "No napping in your capsule during the daily cleaning, even with a multi-night booking, and your locker is shut too."
