blocks:
  - type: hero
    image: azabudai-hills
    caption: "Azabudai Hills, home of the restaurant. No free photo of the counter exists"
    hook: Over the R$170 day budget, once. A real omakase counter for the price of two Tsukiji breakfasts.
  - type: quick_facts
    time_needed: 90 min seating
    best_time: Weekday lunch
    extra:
      - { label: Courses, value: 13 dishes, detail: "Nigiri and a bara-chirashi bowl" }
      - { label: Solo, value: "Yes, counter", detail: TableCheck takes a party of 1 }
      - { label: Diets, value: No changes, detail: "No veg, gluten-free or allergy swaps" }
  - type: highlights
    items:
      - title: Why go over budget here
        text: "The course alone is **99% of the R$170 day**, and the compulsory drink takes you over it. In return a chef serves you Edomae sushi course by course. Time Out notes that an omakase meal can easily cost ¥20,000–30,000. Do it once, on a day with no other paid plans."
      - title: Foreigner-proof booking
        text: "**TableCheck works in English**, and you can book one seat at the counter."
      - title: A New York name
        text: "The sister **AZABU** restaurants in New York and Miami Beach each held a Michelin star. Time Out says the fish comes from **Toyosu**."
      - title: The room
        text: "An L-shaped hinoki counter in front of a wall of calligraphy by **Rintaro Hashiguchi**, three floors up in Azabudai Hills."
  - type: book_ahead
    steps:
      - days_before: 14
        text: "On TableCheck choose **Lunch → Counter → 'Light Chef's Choice, 13 dishes' (¥4,800)**, then a weekday from Jan 6, 2027 on. Register a credit card."
      - days_before: 4
        text: "Last day to cancel for free. From 3 days before, TableCheck charges the **full course price**."
      - days_before: 0
        text: "Arrive on time. TableCheck says the booking is cancelled if they can't reach you 15 minutes after the slot."
  - type: menu
    title: The weekday lunch
    items:
      - { name: "Light Chef's Choice, 13 dishes", price_local: 4800, price_brl: 168.82, note: "Mon–Fri, counter. Nigiri plus bara-chirashi", tag: signature }
      - { name: "Full Omakase lunch, 16 dishes", price_local: 9800, price_brl: 344.67, note: "Weekends and holidays. Not worth it on this budget" }
    note: "TableCheck: no à la carte menu, and each guest must order **at least one drink**. Drink prices aren't online."
  - type: cost_breakdown
    items:
      - { label: Weekday counter lunch (13 dishes), local: 4800, brl: 168.82 }
    note: "The total **leaves out the compulsory drink**: every guest must order one, and the restaurant doesn't publish drink prices. Expect the real bill to be a little over the R$170 day."
  - type: map
    note: "Sushi Azabu is on the **3rd floor of Tower Plaza** in Azabudai Hills, about 470 m from **Kamiyachō** (Hibiya Line). The pin marks the complex."
  - type: tips
    variant: insider
    items:
      - "Book the **weekday** ¥4,800 lunch. On weekends and holidays the only lunch is ¥9,800."
      - "TableCheck lists the deal from **Jan 6, 2027**, so your Jan 20 – Feb 4 dates are covered."
  - type: tips
    variant: pitfalls
    items:
      - "No-shows and cancellations 3 days or less before the date are charged **100%**, so only book a date you're sure of."
      - "There are no swaps: TableCheck says they can't change dishes for allergies or diets."
