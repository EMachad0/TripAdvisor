blocks:
  - type: hero
    image: sushi-counter
    caption: "Hanamaru's long sushi counter in KITTE, before opening"
    hook: "The queue is part of the plan: take a ticket and let LINE call you back."
  - type: quick_facts
    time_needed: 1 h + wait
    best_time: "Ticket at 11:00, seated ~12:30"
    extra:
      - { label: Wait, value: Up to 1.5 h, detail: "Even with a ticket taken at opening (Dec 2024)" }
      - { label: Seats, value: Counter + booths, detail: Booths take up to 4 }
  - type: highlights
    items:
      - title: Nemuro fish in Tokyo
        text: "Hanamaru started in **Nemuro**, eastern Hokkaido. JW Web Magazine praises its generous portions of Nemuro seafood at fair prices."
      - title: Above the ¥120 chains
        text: "At Dec 2024 prices, plates ran from **¥176 (tamago)** to **¥308** (salmon, sweet shrimp, negitoro), **¥418** (scallop, engawa) and **¥550** (chūtoro, crab gunkan)."
      - title: A queue you don't stand in
        text: "Take a numbered ticket from the machine and scan its **QR code**. The store page says you'll get a **LINE or email** alert, and you have 15 minutes to come back."
      - title: Next to Tokyo Station
        text: "It's on the 5th floor of the **KITTE** mall, next to Tokyo Station. Spend the wait exploring the mall."
