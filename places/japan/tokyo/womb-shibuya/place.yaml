        text: "In just one November 2026 week the calendar ran from Roman Flügel to **Joseph Capriati**. Global names play alongside Tokyo's resident DJs."
      - title: Four floors
        text: "A basement lounge, the laser-lit **main floor**, a premium lounge above it and a small top-floor room where it's easier to chat."
      - title: Cheap weeknights
        text: "The **WTW** party (Wednesdays and Thursdays) showcases local DJs, with door entry around **¥1,500** in November 2026."
      - title: Minutes from the crossing
        text: "WOMB is in Maruyamachō, about **8 minutes** on foot from Shibuya's Hachikō exit. Pair it with the scramble and Shibuya Sky."
  - type: prose
    title: How a night at WOMB works
    dropcap: true
    text: |-
      Doors open at **23:00** and the party runs to **04:30**. Each night is a different promoter's event, so the music and the price change. Check the night's page on womb.co.jp. Weeknights cost about ¥1,500. A standard weekend night is ¥3,000–4,000 in advance or ¥4,000–5,000 at the door. A star headliner can reach ¥8,000. Some events knock **¥1,500 off for 23 and under**.

      Bring your **passport**: entry is 20+ with photo ID. There is no dress code beyond "appropriate for a public venue", and there's no re-entry. Coin lockers exist but there aren't many.

      The last trains run around 1am, before the party peaks, so plan to stay until the end. The night ends at 04:30, and the Yamanote Line's first trains run from around 04:30.
