  - type: tips
    variant: insider
    items:
      - "Buy the **advance ticket** on the event page as soon as you pick a night. It's usually ¥1,000 less than the door."
      - "Going alone? Wednesday and Thursday **WTW** nights are cheap and local. Better still, bring people from your hostel."
      - "Stay until the end: the party closes at **04:30**, just as the first trains start."
  - type: tips
    variant: pitfalls
    items:
      - "No ID, no entry. Bring your **physical passport**: it's on WOMB's list of accepted ID, with a driver's licence and Japan's My Number card."
      - "**No re-entry.** Stepping out for air or a convenience-store run ends your night."
      - "Don't bring food or drinks: they're confiscated at the door."
