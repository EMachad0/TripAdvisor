        local: 0
        brl: 0
      - label: Projection-mapping show (outdoors)
        local: 0
        brl: 0
    note: "Both are free. Your only cost is the metro fare there."
  - type: map
    zoom: 16
    note: "From **Tochomae Station** (Oedo Line) you walk straight in. From JR Shinjuku, take the West Exit, about 10 min on foot."
  - type: tips
    variant: insider
    items:
      - "Pick the deck by the date. On **Jan 5 and Jan 19** only the North deck is open (until 22:00). On **Jan 12** only the South deck is open."
      - "If you want the sunset and the night view, arrive about an hour before sunset. The deck stays open well after dark."
      - "Bring headphones. The official projection site plays each show's music in sync, so you can hear it from the plaza."
  - type: tips
    variant: pitfalls
    items:
      - "**Tripods aren't allowed** on the deck. Brace your phone on the window ledge for night shots."
      - "Closures for bad weather are announced only on X (**@tocho_tenbou**). Check it on a stormy day before you go."
      - "Don't come Jan 2–3: both decks are shut for the New Year break."
