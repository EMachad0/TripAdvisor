    images:
      - file: projection
        caption: TOKYO Night & Light on the east wall of Building No. 1
      - file: deck-windows
        caption: Inside the deck, looking west towards Fuji
      - file: twin-towers
        caption: The twin-towered No. 1 Building from the street
