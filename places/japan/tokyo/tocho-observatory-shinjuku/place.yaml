        value: About 20–30 min
        detail: Official estimate; varies with weather and time of day
  - type: highlights
    items:
      - title: Free, unlike Shibuya Sky
        text: "Entry costs **¥0** and needs no booking. The official page says there's no advance or group reservation, so you just queue for the lift."
      - title: Mount Fuji in winter
        text: "Look west. The official page says the cold, clear months **December to February** give the most days with Fuji visible."
      - title: Open late on most days
        text: "The South deck lets you in until **21:30** and closes at 22:00. When it's shut, the North deck stays open late instead."
      - title: The tower becomes the screen
        text: "*TOKYO Night & Light* projects onto the building's east wall every evening, holder of the Guinness World Record for the largest permanent architectural projection-mapped display. Works include **Hatsune Miku**, *Bocchi the Rock!* and *Blue Lock*."
  - type: prose
    title: How to do it
    dropcap: true
    text: |-
      Come up in the late afternoon. If the air is clear, Fuji shows to the west. As the sun goes down the view flips to the city lights: Shinjuku's towers right below you and, to the north-east, the Skytree. The deck is indoors behind glass, so a January wind doesn't touch you up here.

      Then go back down and stand on the plaza side of the building. In November 2026 the projection show ran every half hour from **17:30 to 21:30**, with music you can stream on the official site from your phone. Check the timetable for January before you go, because it changes by month.

      On weekends and holidays the 2nd-floor entrance is closed, so walk round to the **1st-floor main entrance** and take the dedicated observatory lift.
