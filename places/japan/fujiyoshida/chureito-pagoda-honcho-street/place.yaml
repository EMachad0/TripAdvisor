  - type: map
    note: "Coaches can't reach the park: everything starts at **Shimoyoshida** station or the Shimoyoshida expressway bus stop."
  - type: tips
    variant: insider
    items:
      - "Sunrise around 25 Jan is about **06:50** and sunset about **17:05**. The first buses from Tokyo beat the tour coaches to the lake."
      - "On Honcho Street, shoot from the **pavement**. It is a working street with traffic, not a photo set."
      - "For a 7-Eleven with Fuji behind it, a Japan blogger suggests making your way to **Gekkoji Station** after the pagoda instead of back to Shimoyoshida, and calls the store there one of Japan's prettiest."
  - type: tips
    variant: pitfalls
    items:
      - "The Yomiuri found the deck **packed** on a weekday even after the autumn leaves had gone. Get there early and step aside after your shot."
      - "Fujikyu has put warning signs and alarms at level crossings because people walk onto the **tracks** for Fuji photos. Don't."
      - "Since 1 Oct 2026 Fujikyu-run and Keio-run buses on this route sell on **different sites** and can't be switched between them. Check which site sold yours before changing it."
