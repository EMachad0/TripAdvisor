blocks:
  - type: hero
    image: pagoda-march
    caption: "Chureito Pagoda and Fuji in early March, the trees still bare"
    focus: "45% 50%"
    hook: "Climb 398 steps through a hillside shrine and Japan's most printed view lines up in front of you."
  - type: quick_facts
    time_needed: Full day from Tokyo
    best_time: Morning
    extra:
      - { label: Entry, value: Free, detail: "Park open around the clock" }
      - { label: Clear-Fuji odds, value: "Very high in winter", detail: "isfujivisible's forecast scores: Jan 2026 all clear" }
      - { label: Train from Kawaguchiko, value: "¥310, a short ride", detail: "Fujikyu Railway to Shimoyoshida (IC ¥305); expresses cost extra" }
  - type: highlights
    items:
      - title: The postcard view
        text: "From the deck above the pagoda you see the five-storey **Chureito**, the town of Fujiyoshida and the whole cone of **Mt Fuji** in one frame. It is free and the park never closes."
      - title: Winter is the best season for it
        text: "isfujivisible's **forecast scores** (its own model, not observations) rated Fuji clear on every January 2026 day, morning and afternoon, against about half the mornings in summer. From November to February the mountain is out nearly all day."
      - title: Honcho Street, by the station
        text: "Fujiyoshida's **Honmachi (Honcho) Street**, about five minutes on foot from Shimoyoshida Station, runs straight at the mountain, lined with Showa-era shopfronts. The town says old buildings now hold cafés, a sweets shop and a craft gallery."
      - title: Pagoda and lake in one day
        text: "Shimoyoshida is a short ¥310 ride from Kawaguchiko on the Fujikyu Railway, so one bus ticket each way covers the pagoda, the **Lawson shot** and the lake."
  - type: prose
    title: How to do it from Tokyo
    dropcap: true
    text: |-
      **Bus (cheapest, simplest).** The Shinjuku–Fuji Five Lakes highway bus leaves from Busta Shinjuku and stops at **Shimoyoshida** on the expressway before Fuji-Q and Kawaguchiko. Fujiyoshida's own guide puts that stop about 1 h 30 from Shinjuku and a 20-minute walk from the park. To Kawaguchiko it is ¥2,000 online and ¥2,200 at the counter.

      **Train.** JR Chuo Line to Otsuki, then the private Fujikyu Railway: ¥1,170 for Otsuki–Kawaguchiko, plus ¥400 on the limited express. A JR Pass stops at Otsuki. It's slower and dearer than the bus unless you already hold a JR ticket, but it lets you hop off at Shimoyoshida and carry on to the lake.

      **Order of the day.** Take the earliest bus to Kawaguchiko and do the **Lawson** first: its light is best before 9:00, when the sun is still off to the side. Then the Fujikyu train back to **Shimoyoshida** (¥310 on a local train) for the pagoda and Honcho Street. Winter Fuji stays out most of the day, so the pagoda keeps until after lunch. Ride the train back to Kawaguchiko (another ¥310) and take the bus home from Kawaguchiko Station.
