    focus: "25% 75%"
    hook: "Thirty years of Persona heroes gather in a theme park that looks up at Mt Fuji and charges nothing to walk in."
  - type: quick_facts
    time_needed: Full day
    best_time: "Fri–Tue, 22–31 Jan, at 10:00"
    extra:
      - { label: Park entry, value: Free, detail: "Rides cost extra; one-day pass ¥6,000 in late Jan" }
      - { label: Collab, value: "Attraction, food, goods", detail: "New art; details still to be announced" }
      - { label: Bus from Shinjuku, value: "~1 h 40 min", detail: "Busta Shinjuku to the park's own terminal" }
  - type: highlights
    items:
      - title: The 30th-anniversary collab
        text: "Fuji-Q runs a **Persona 30th** event to **31 January 2027**: a collab attraction, collab food and limited goods with **newly drawn art**. Press coverage says every series protagonist gathers at the park. Details come later."
      - title: Free to walk in
        text: "Fuji-Q has **no entry fee**: claim a free entry pass and you can browse the collab, the shops and the food without buying a single ride."
      - title: Coasters with Mt Fuji behind them
        text: "If you do want rides, the park is known for its record-breaking coasters framed by Mt Fuji. A one-day pass is **¥6,000** on every open day from 15 Jan."
      - title: Your window is small
        text: "You're in Japan from 20 Jan, the park is shut Wed–Thu, and the collab ends 31 Jan. That leaves **22–26 and 29–31 Jan**."
  - type: prose
    title: Is it worth a whole day?
    dropcap: true
    text: |-
      Only if you're a fan. It's about two hours each way by bus, and the park and the coasters are the real draw. The Persona part is a themed attraction, food and goods, details still to come. Fuji-Q has a free entry pass, so a fan can go for the collab, eat, buy goods and leave for about ¥4,000 in bus fares.

      If you add a ¥6,000 ride pass, the day comes to about ¥10,000 (R$352), twice the daily budget. That is only worth it if you love coasters. Look at the event page in mid-January: if the collab attraction turns out to be a sticker rally and a menu, skip it and spend the day in Tokyo.
  - type: book_ahead
    steps:
      - days_before: 7
        text: "Check the **event page** for what the collab attraction and menu are, and the January calendar for closures."
      - days_before: 3
        text: "Book the **Fujikyu highway bus** from Busta Shinjuku online (¥2,000 each way). Pick a morning bus out and a bus back after 17:00 closing."
      - days_before: 1
        text: "Claim the **free entry pass** online the day before (face registration), or get the QR code at the gate."
  - type: cost_breakdown
    items:
      - { label: "Highway bus Shinjuku → Fuji-Q (online)", local: 2000, brl: 70.34 }
      - { label: "Highway bus back (online)", local: 2000, brl: 70.34 }
      - { label: Park entry, local: 0, brl: 0 }
      - { label: "One-day ride pass (22–31 Jan price)", local: 6000, brl: 211.02, optional: true }
  - type: map
    note: "The highway bus stops at the **Fuji-Q Highland bus terminal**, next to the park. Fujikyu says it doesn't run that stop on days the park is closed."
  - type: tips
    variant: insider
    items:
      - "Avoid **22 Jan** if you want Takabisha: it has a scheduled closure that day."
      - "The one-day pass is ¥6,000 on every open day from 15 Jan, so a weekend costs no more than a weekday."
  - type: tips
    variant: pitfalls
    items:
      - "Don't plan a **Wednesday or Thursday**: the park is closed, and the bus skips the park stop."
      - "The **Ferris wheel** is closed for renovation until 31 Jan, so don't count on it for Fuji views."
