blocks:
  - type: hero
    image: lawson-dusk
    caption: "The Kawaguchiko Station Lawson with Fuji above its roof"
    hook: "A blue-and-white shop sign, a parked car and the most famous volcano on Earth: the photo that made a town put up a wall."
  - type: quick_facts
    time_needed: Full day from Tokyo
    best_time: Before 9:00
    extra:
      - { label: Screen, value: "Gone since Aug 2024", detail: "A 1.4 m fence (Aug 2025) keeps people out of the road, not the view" }
      - { label: Which store, value: "Kawaguchiko Ekimae", detail: "3495-2 Funatsu, ~200 m from the station" }
      - { label: 7-Eleven?, value: "Yes, several", detail: "By Gekkoji Station (Fujiyoshida) and at Lake Yamanaka" }
  - type: highlights
    items:
      - title: The shot, as it is now
        text: "The 2024 **black screen** came down that August. Now there's a **1.4 m fence** (Aug 2025) and no-crossing barriers, and 2026 visitor photos show Fuji clear above the roof. Scaffolding on the building to the right sits at the edge of the frame."
      - title: Which Lawson it is
        text: "The viral one is the **Lawson Kawaguchiko Ekimae**, two to three minutes on foot west of Kawaguchiko Station. A second Lawson 1.2 km away also has Fuji behind it, with no crowd."
      - title: The 7-Eleven versions
        text: "Fuji rises behind several 7-Elevens too. A blogger rates the one by **Gekkoji Station** (Fujiyoshida, one stop from the Chureito Pagoda) among Japan's prettiest, and the one on **Lake Yamanaka**'s east shore for its light."
      - title: Then the lake
        text: "The **Red Line** sightseeing bus runs along Lake Kawaguchi's north shore to **Oishi Park**, where Fuji stands across the water. A ¥1,500 day pass covers the Red, Green and Blue Lines."
  - type: prose
    title: Where to stand, and why it matters
    dropcap: true
    text: |-
      The frame only works from the **far side of the road**, looking back at the shop with Fuji behind it. From the store's own car park you just get a photo of a shop. That is how the trouble started: people realised they were on the wrong side and ran across a two-lane road near a busy station.

      So use the **signalised crossing about 80 m along**. The forecourt opposite belongs to a dental clinic that uses it to drop off elderly patients. The clinic says it doesn't mind photos, only the parking, rubbish and people in the road. Take the picture, keep the pavement clear and move on.

      If it's busy, walk 15 minutes to the **Lawson Fujikawaguchiko Machiyakubamae** (1395-1 Funatsu). It also has Fuji behind it, and nobody is managing a crowd there.
