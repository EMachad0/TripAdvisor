  - type: map
    note: "Walk west from **Kawaguchiko Station**; the store is on the same side as the station. Cross at the **signalised crossing** to the far pavement for the shot."
  - type: tips
    variant: insider
    items:
      - "Before about 9:00 the sun is still off to your left; around midday it sits almost behind Fuji and you shoot into the glare. Sunrise around 25 Jan is about **06:50**."
      - "Come here **first**, straight off the earliest bus, then Oishi Park. The **Chureito Pagoda** is a ¥310 local-train ride away (Shimoyoshida) for the afternoon."
  - type: tips
    variant: pitfalls
    items:
      - "Don't cross between cars, and stay off the **clinic's forecourt** and the store's car park. They are why the barriers exist."
      - "Use the toilets at the **station**, not the shop or the clinic."
      - "Since 1 Oct 2026 the Shinjuku bus sells on two sites (Fujiyama Connect and Highwaybus.com), and a booking can't move between them."
