  - type: highlights
    items:
      - title: Why it's a step up
        text: "The broth is simmered from **Tanba black chicken and Hinai-jidori**, seasoned with a special fresh (nama) soy sauce, with thin house-made noodles from domestic wheat and both pork and chicken-breast chashu (TableCheck)."
      - title: Bib Gourmand and Tabelog Top 100
        text: "On Michelin's **Kyoto-Osaka 2026** Bib Gourmand ramen list, picked for Tabelog's **Ramen WEST Top 100 2025**, and **3.74 on Tabelog** from 820+ reviews. One Kyoto reviewer has eaten here 78 times."
      - title: Skip the queue for ¥500
        text: "A **TableCheck FastPass** puts you first in line at a set time. It isn't a table booking, so a short wait is still possible."
      - title: Cheap for what it is
        text: "**¥1,300 (R$46)** for the chicken shoyu, ¥1,700 for the special."
  - type: prose
    title: Out of the centre, on purpose
    text: |-
      Touhichi moved to Shugakuin, in Kyoto's northern Sakyō ward, in April 2022. It sits a few steps from Shugakuin Station on the little Eizan Railway, which starts at Demachiyanagi.

      There's no dining room to dress for: eight counter seats, a few tables, and cash in your pocket.
