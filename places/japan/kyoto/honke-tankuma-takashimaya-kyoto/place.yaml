    note: "No service charge is listed for this branch. Book on TableCheck: My Concierge Japan adds its own ¥1,650 seating fee. Drinks not included."
  - type: map
    note: "Inside **Kyoto Takashimaya**, 7th floor. Reached underground from **Kyoto-kawaramachi** (Hankyu) or 5 min on foot from Gion-Shijō (Keihan)."
  - type: tips
    variant: insider
    items:
      - "Lunch and dinner kaiseki cost the same, so a **12:00 (UTC+9)** booking leaves the whole afternoon free."
      - "For the cheaper dishes, like the oyakodon, just walk in; there's no booking for them. Tabelog reviewers report spending ¥3,000–4,000 on average."
  - type: tips
    variant: pitfalls
    items:
      - "**Tankuma Kitamise** is a different restaurant group nearby. Booking here and eating there counts as a no-show."
      - "No halal, vegetarian, kosher or gluten-free menu at this branch; the main shop handles those."
      - "Kaiseki last order is **13:30 (UTC+9)** at lunch and **19:30 (UTC+9)** at dinner, well before closing."
