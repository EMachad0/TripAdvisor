blocks:
  - type: hero
    image: lunch-tray
    caption: "A Tankuma lunch tray at the Takashimaya branch: sashimi, tempura, simmered dishes, rice"
    hook: Course after course of Kyoto kaiseki, above the Shijo crossing.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: "Lunch, by 13:30 (UTC+9)"
    extra:
      - { label: Course, value: 9 dishes, detail: "Appetizer, sashimi, soup, stew, steamed, fried, rice set, dessert" }
      - { label: Solo, value: "Yes, 1 adult", detail: "TableCheck's picker starts at 1 and each course at 1" }
      - { label: Out of place?, value: A little, detail: "A calm table room in a department store; no counter" }
  - type: highlights
    items:
      - title: Kaiseki as a tasting menu
        text: "The **Wakamurasaki** course is **nine dishes** in order: appetizer, sashimi, clear soup, a simmered dish, a steamed dish, something fried, rice with pickles and soup, then dessert. The ¥12,100 and ¥14,300 courses add grilled and vinegared dishes."
      - title: The almost-as-good tier
        text: "This is the department-store branch of **Honke Tankuma**, a Kyoto restaurant that counts **100 years** since its founding. Its own pages call the founder the 'god of Kyoto cuisine'. I found no Michelin listing for this branch: you pay for the cooking, not for prestige."
      - title: Same price at lunch and dinner
        text: "The kaiseki costs the same all day, so take it at lunch and spend the evening elsewhere. The branch has served its **oyakodon** for over 60 years, if you want the cheap walk-in version."
      - title: Why go over the R$170 day
        text: "About **R$354**, two days of budget, for the full kaiseki sequence in Kyoto, booked online in English, at a table of your own."
  - type: gallery
    images:
      - { file: dining-room, caption: "The 7th-floor dining room, screened by glass and gauze panels" }
      - { file: window-tables, caption: "Tables by the window in the Takashimaya branch" }
      - { file: takashimaya, caption: "Kyoto Takashimaya at the Shijō-Kawaramachi crossing; the restaurant is on the 7th floor" }
  - type: book_ahead
    steps:
      - days_before: 3
        text: "On **TableCheck**, choose **1 adult**, a time before the kaiseki last order and the **Wakamurasaki** course (qty 1)."
      - days_before: 2
        text: "From 72 hours before, cancelling costs **30%**; from 48 hours, **50%**; within 24 hours, **100%**."
      - days_before: 0
        text: "Go to **Takashimaya 7F** and pay at the end of the meal."
