    steps:
      - { days_before: 1, text: "Send a request on the **English page** (orange button) and message the course and time in the multilingual chat." }
      - { days_before: 0, text: "Bring **cash** for the course and nomination fee; the English page says no other charges." }
      - { days_before: 0, text: "Go to the **6th-floor reception** of the Top Hat Building on Kiyamachi-dori, north of Shijo. No secret filming or recording (house rules)." }
