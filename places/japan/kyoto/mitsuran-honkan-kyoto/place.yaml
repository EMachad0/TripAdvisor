    variant: insider
    items:
      - "Non-members can phone-book only from **the day before** (official site); fujoho says the line opens at 05:00."
      - "The English page suggests the **60 min** course as its recommended one."
      - "Kyoto days are short: Setsubun (Wed 3 Feb) and the KIX flight (Fri 5 Feb) leave Tue 2 or Thu 4 Feb."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the 1956 Anti-Prostitution Law bans prostitution (intercourse) but sets **no penalty** for the act itself; it punishes soliciting, procuring, providing a place. Fashion health sells non-coital services under the entertainment business law. Asking for intercourse breaks the rules."
      - "**Enforcement, 2025:** Tokyo police made Japan's first arrests at a shop aimed at foreign tourists, a Kabukicho men's esthe, in Feb 2025 (operator and six men; no customers reported charged)."
      - "**Touts:** Kiyamachi has street touts (FRIDAY, 2024). Book on the shop's own page and walk in yourself; don't follow anyone from the street."
      - "Two prices: the English page is about double fujoho's Japanese list. Confirm the total in the chat before you go."
