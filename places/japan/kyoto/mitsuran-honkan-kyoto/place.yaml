blocks:
  - type: hero
    hook: "Three women in kimono, five minutes each, then you choose: Kyoto's one fūzoku shop built on the kimono."
  - type: quick_facts
    time_needed: "50–60 min session"
    best_time: "Tue 2 or Thu 4 Feb"
    extra:
      - { label: Type, value: "Fashion health, kimono", detail: "Store-based health with a rotation format; Kyoto has no soaplands" }
      - { label: Payment, value: "Cash (English page)", detail: "The Japanese site takes cards with an ID check; bring cash" }
  - type: highlights
    items:
      - title: The kimono theme
        text: "The English page calls it **the one shop in Kyoto built on the kimono**: the women dress in kimono, and fujoho describes the old \"rotation\" health format brought back. It's a Kyoto version of the themed role-play room."
      - title: You meet them first
        text: "The **Triple Rotation** course has you meet three women, five minutes each, then pick one; a two-woman version costs ¥40,000. The basic course is one woman you choose from the list."
      - title: Foreigners welcome
        text: "The official site's **English** button goes straight to its YOASOBI HEAVEN page, with English-speaking staff registered and reviews in English and Chinese from Sep to Nov 2026."
      - title: Clear rules on health
        text: "The shop says every woman is tested **at least monthly** for chlamydia, gonorrhoea, trichomonas, candida, HIV and syphilis, and uses medicated body soap. The English page says no charge beyond course and nomination fees, plus options (¥1,000–3,000) if you ask."
  - type: prose
    title: Kyoto's kind of adult night
    dropcap: true
    text: |-
      YOASOBI HEAVEN says Kyoto has **no soaplands**: its store-based adult shops are fashion health parlours, clustered in **Kawaramachi and Kiyamachi**, west of the Shijo bridge. A 2024 FRIDAY report quotes a Kiyamachi tout saying health shops everywhere there take tourists, while many cabarets and oppa-bars refuse them.

      Mitsuran Honkan is the themed pick: kimono and a meet-then-choose format. It is not cheap. The English page starts at **¥30,000 for 50 min** (about R$1,073; ¥35,000 for 60), six days of your Japan "everything else" budget. The Japanese list on fujoho is far lower: **¥15,000** for the basic 55 min rotation course (¥13,000 for new customers or 06:00–09:00), but booking at that price means calling in Japanese, and no source says a foreigner gets it. The case for it is the theme, a booking you can make in English, and a slot on Tue 2 or Thu 4 Feb. If you'd rather a different shop, Osaka's store shops near Namba are a train ride away.
