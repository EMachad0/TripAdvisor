  - type: hero
    image: kinshi-don-open
    caption: "Kaneyo's kinshi-don with the omelette folded back over the grilled eel"
    hook: "Lift the yellow blanket of dashimaki omelette and the glazed eel is underneath."
  - type: quick_facts
    time_needed: 1 h
