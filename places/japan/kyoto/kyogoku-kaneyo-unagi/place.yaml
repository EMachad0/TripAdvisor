  - type: highlights
    items:
      - title: The kinshi-don
        text: "The shop's own description: an **unagi bowl topped with Kyoto-style dashimaki** omelette, one of its popular dishes."
      - title: Bib Gourmand eel for ¥2,400
        text: "On weekdays the **short-break set** brings a small kinshi-don with grilled eel and cucumber salad, pickles and soup, cheaper than the ¥3,000 bowl alone. Michelin lists the shop as Bib Gourmand, ¥ band, \"Solo dining\"."
      - title: Meiji-era house
        text: "Founded in the Meiji era; the official site points to a **Taisho-era interior** and the same taste for a hundred years. Michelin says seven generations."
      - title: Right in the centre
        text: "On Rokkaku-dōri at the heart of the Shinkyogoku arcade, an easy lunch between Kyoto sights."
