  - type: map
    note: "No parking and Nintendo asks visitors **not to come by taxi**. Use the Kintetsu Ogura East exit (5 min) or JR Ogura North exit (8 min)."
  - type: tips
    variant: insider
    items:
      - "The JR Nara Line to JR Ogura (25 min, ¥310) is covered by a JR Pass; the Kintetsu train is a bit quicker."
      - "Back in Kyoto, **Nintendo KYOTO** (the official store) is in Kyoto Takashimaya S.C. [T8], open 10:30–20:00: no ticket needed."
  - type: tips
    variant: pitfalls
    items:
      - "Tuesdays are closed: during your trip that is **26 Jan and 2 Feb**."
      - "Only cards registered for **3-D Secure** work for payment; check yours before the payment deadline."
