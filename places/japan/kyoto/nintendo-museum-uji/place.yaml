blocks:
  - type: hero
    image: museum-building
    focus: "68% 40%"
    caption: "The museum building in Ogura, Uji"
    hook: "The Kyoto card maker that became Nintendo, told in its own former factory, from hanafuda to Switch."
  - type: quick_facts
    time_needed: 3–4 h
    best_time: "First slot, not a Tuesday"
    extra:
      - label: Tickets
        value: Online only, in your name
        detail: "Drawing 3 months ahead, then first-come leftovers"
      - label: From Kyoto
        value: "20 min, ¥360"
        detail: "Kintetsu Kyoto Line to Ogura, then a 5 min walk"
      - label: Good in cold
        value: Yes, indoors
  - type: highlights
    items:
      - title: Every product side by side
        text: "The official site describes Nintendo's releases laid out **side by side**, from playing cards and toys to Nintendo Switch: a single hall of the company's whole history."
      - title: Exhibits you play
        text: "Your ticket comes with a starting stash of **coins** for the interactive play exhibits; japan-guide notes you can buy more inside."
      - title: Make your own hanafuda
        text: "Nintendo began in 1889 making **hanafuda** cards. The Craft & Play workshop lets you make a deck and learn the game (extra fee, same-day booking once inside)."
      - title: Built in the old factory
        text: "The museum stands on the site of the **Uji Ogura plant**, a former Nintendo factory; the café and the shop with museum-only goods are for ticket holders only."
  - type: prose
    title: Why a museum clears the bar
    dropcap: true
    text: |-
      You said museums aren't worth a day unless they're in the Louvre league. For a gamer this one is: it is Nintendo's own museum, run by a Kyoto-based company in its home prefecture on the site of its own factory, and you can't get in without winning or grabbing a ticket weeks ahead.

      The catch is the booking, not the trip. Uji is a short train ride from Kyoto, but tickets are only sold on the official site, first by monthly drawing and then, if seats are left, first-come. As of 12 November 2026, **January 2027** tickets are on sale first-come and the **February 2027** drawing is open until 30 November.
  - type: gallery
    images:
      - { file: signpost, caption: "The museum's signpost on the walk from Ogura Station" }
  - type: book_ahead
    steps:
      - days_before: 70
        text: "**Today (Nov 2026):** make a free Nintendo Account. For 20–31 Jan, buy first-come on the ticketing site now. For 1–4 Feb, enter the drawing **before 23:59 JST on 30 Nov**."
      - days_before: 62
        text: "1 Dec: drawing results arrive by email. If you win, pay by card by **23:59 JST on 7 Dec** or the ticket is cancelled."
      - days_before: 1
        text: "From **14:00** the day before, issue your QR code on the ticketing site (after that it can't be cancelled)."
      - days_before: 0
        text: "Show the QR code and your **passport** at the gate, then book the hanafuda workshop straight away if you want it."
    passport_note: "A **passport** is the only ID accepted for non-Japanese visitors, and the name must match the ticket."
  - type: cost_breakdown
    items:
