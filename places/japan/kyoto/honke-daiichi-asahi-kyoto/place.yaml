  - type: map
    note: "From the Karasuma exit, walk east along Shiokoji-dori toward the Takabashi bridge. Look for the yellow awning and the two queues."
  - type: tips
    variant: insider
    items:
      - "**09:00–10:00** is the quietest slot, between the breakfast crowd and lunch. Avoid Friday and Saturday nights (30–60 min waits)."
      - "Buy your **meal ticket at the machine inside first**, then join the queue on the south side (the Shinpuku Saikan side). With 31 seats it moves faster than it looks."
      - "Chashu cut is your choice for free: **赤** (lean) or **白** (fatty)."
      - "Ordering **ネギ大盛** (*negi ōmori*) gets you a mountain of onion at no extra cost."
  - type: tips
    variant: pitfalls
    items:
      - "**Closed Thursdays.** In your window that's Jan 21, Jan 28 and Feb 4."
      - "The Sanjo-Kawaramachi branch (opened Feb 2026, same prices) is a fallback if the queue here is long. It opens at 11:00, not 06:00."
