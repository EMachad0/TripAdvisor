      - { label: Ordering, value: Ticket machine, detail: "Cash, cards, e-money and QR payments accepted" }
  - type: highlights
    items:
      - title: A 1947 Kyoto classic
        text: "Open since **1947** next to Kyoto Station (rival Shinpuku Saikan next door is older, from 1938). It started at dawn to feed railway workers, and still opens at **06:00**."
      - title: Free green onion
        text: "Ask for **ネギ大盛** (extra green onion) or extra bean sprouts at no charge. Kujo onion is in season Nov–Feb, so late January is its best time."
      - title: A clear, light broth
        text: "Non-cloudy pork broth with soy sauce from Fushimi. Light enough for breakfast, unlike the thick Kyoto styles."
      - title: The ramen duel
        text: "Rival **Shinpuku Saikan**'s main shop is right next door. Order the ¥830 mini bowl here and try both."
  - type: prose
    text: |-
      Kyoto ramen is not one style, and Daiichi Asahi is the clear, soy-sauce one: thin straight noodles, slices of chashu, a heap of green onion and bean sprouts, in a light pork broth. The fourth-generation owner says the early-morning crowd has grown with Japan's *asa-ra* (morning ramen) habit: night-bus arrivals, shift workers, people catching early trains.

      It is the cheap classic on this list. A basic bowl is under ¥1,000; extra onion and sprouts and every seasoning change are free, and extra meat is ¥250.
