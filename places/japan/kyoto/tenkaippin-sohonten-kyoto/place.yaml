  - type: tips
    variant: insider
    items:
      - "Order **こってり** (kotteri) on a first visit, the beef-tendon bowl on a second."
      - "Open until **01:00** every night except New Year's Day, so it works as a late dinner."
  - type: tips
    variant: pitfalls
    items:
      - "It's far from the sights: the Eizan Railway is **¥220 each way** from Demachiyanagi, plus a 10-min walk. If you only want standard kotteri, the **Hachijo-guchi branch** 4 min from Kyoto Station serves it with no extra fare. Come here for the head-shop-only bowls."
      - "No seat reservations. Walk in and queue."
