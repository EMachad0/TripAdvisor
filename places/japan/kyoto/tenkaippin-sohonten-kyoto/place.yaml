blocks:
  - type: hero
    image: sohonten-facade
    caption: "The head shop today: paper lanterns, the cart wheel and the 総本店 sign in Ichijoji"
    hook: The original is a street cart's soup, simmered until it sticks to your lips.
  - type: quick_facts
    time_needed: 45 min at the table
    best_time: Late evening, until 01:00
    extra:
      - { label: Style, value: Chicken kotteri, detail: "Chicken bones and a dozen-plus vegetables, boiled down to a paste-thick soup" }
      - { label: Only here, value: Beef-tendon ramen, detail: "Head-shop dish; at every branch only until Jan 11, 2027" }
  - type: highlights
    items:
      - title: The source of a 200-shop chain
        text: "Started as a **street cart in 1971**. After four years of trial and error the founder had his soup, and he opened this shop in 1975."
      - title: Soup like gravy
        text: "**Kotteri** is a chicken soup thick enough to cling to the noodles. Nothing like the clear Kyoto shoyu at Daiichi Asahi."
      - title: Head-shop-only bowls
        text: "**牛すじラーメン** (beef tendon and konnyaku), a kimchi version and a **豚重定食** pork-bowl set aren't on the normal branch menu."
      - title: Ramen battleground
        text: "Ichijoji is one of Kyoto's busiest ramen districts. Fans call this shop the chain's holy ground."
  - type: prose
    text: |-
      Most Japanese know Tenkaippin as the chain with the red sign. Few foreign visitors know it started here, in a quiet corner of northern Kyoto, with a soup the founder took four years to get right. The head shop still makes it on site, and fans say it is wilder and deeper than at the branches.

      Come for the comparison. Have the clear Kyoto shoyu at Daiichi Asahi one day and this the next, and you'll have eaten Kyoto ramen's two opposite styles.
