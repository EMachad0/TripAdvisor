  - type: highlights
    items:
      - title: The stage
        text: "The famous wooden stage juts out about **13 metres** above the hillside. The main hall and stage were built **without nails**, Japan Guide says."
      - title: Otowa waterfall
        text: "At the foot of the main hall the spring splits into three streams: long life, success at school, luck in love. Drinking from all three counts as greedy."
      - title: Up before Kyoto wakes
        text: "Gates open at **06:00** every day of the year, much earlier than Kinkaku-ji (09:00). Come at opening and you share the stage with far fewer people than at midday."
      - title: New Year at the temple
        text: "The New Year service, **Shushō-e**, runs Jan 1–7. If you're in Kyoto by then, it's your chance to see the temple in festival mode."
  - type: prose
    title: How to see it
    dropcap: true
    text: |-
      Take bus 206 or 100 from Kyoto Station to **Gojozaka** and walk east, uphill, about 10 minutes. The temple warns that some map apps route you to a dead end. The grounds can only be reached from the Nio-mon gate at the top of **Kiyomizu-zaka** or from Chawan-zaka.

      Pay at the gate, walk onto the stage, then go down the steps to the Otowa waterfall. Japan Guide puts a typical visit at 30–60 minutes, plus the walk up through the old shopping streets.

      **Temple or shrine?** The traveler asked for a *temple*. Kiyomizu-dera is a Buddhist temple. Fushimi Inari, with its tunnels of red gates, is a Shinto shrine. Both count as Kyoto icons; this card is the temple. Want the snow photo? Kinkaku-ji, the Golden Pavilion, opens 09:00–17:00. Check the forecast and go if it snows overnight.
