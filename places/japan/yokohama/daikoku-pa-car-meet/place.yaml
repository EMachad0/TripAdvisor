blocks:
  - type: hero
    image: night-panorama
    caption: "Daikoku PA at night under the expressway ramps. No free photo of a meet itself"
    hook: A car park inside an expressway junction, ringed by spiralling ramps, where Japan's tuned cars gather after dark.
    focus: center
  - type: quick_facts
    time_needed: 4 h tour from Tokyo
    best_time: "Fri or Sat night"
    extra:
      - label: On foot
        value: Not possible
        detail: Walking in is trespassing and can mean arrest
      - label: Police closures
        value: Common on weekends
        detail: Lot closed to new cars or cleared, at short notice
      - label: What you see
        value: Parked cars, not racing
        detail: Owners chatting next to their cars
  - type: highlights
    items:
      - title: The car park inside a junction
        text: "Daikoku PA is the **largest parking area** on the Shuto Expressway, a lot surrounded by the looping ramps of Daikoku Junction."
      - title: Japan's car culture, parked
        text: "Supercars, sports cars, lowriders and tuned cars gather here. It's a static meet: owners talking next to parked cars, not racing."
      - title: Friday and Saturday nights
        text: "There's no official schedule. Friday and weekend nights after sunset draw the biggest crowds."
      - title: The honest catch
        text: "Police often close the lot on weekend nights. Book a tour that has a **plan B**, such as Tatsumi or Umihotaru PA."
  - type: prose
    title: Getting there without a car
    dropcap: true
    text: |-
      Daikoku PA sits inside the Shuto Expressway's Bayshore Route. There is **no footpath, no train and no bus**. LIVE JAPAN is blunt: climbing fences or walking in from the surrounding roads is trespassing and could lead to arrest. You arrive by car or not at all.

      That leaves three options. A **licensed taxi** is legal; it costs more, and you must arrange the ride back before you go. The **self-drive package** sold on Klook (¥75,625) is the one LIVE JAPAN confirmed as legal, but it needs a 1949 Geneva-Convention international permit. Check whether your Brazilian licence qualifies. The third option is a **small-group tour**, from about ¥15,000 per person.

      Be picky about tours. In September 2026 LIVE JAPAN wrote that most "JDM Night Tours" on booking sites are "highly likely to be illegal". In July 2026 a man in Shibuya was arrested for allegedly running an unlicensed taxi after offering tourists a ¥5,000 GT-R "driving tour" that crashed. Choose an operator that drives legally and ask whether it's licensed for paying passengers.
  - type: gallery
    images:
      - { file: junction-loops, caption: "The ramps of Daikoku Junction curling over the car park, by day" }
      - { file: parking-lot, caption: "The car park by day; the meets happen on Friday and Saturday nights" }
  - type: quote
    variant: vibe
    text: Sodium lights, ramps curling overhead, and engines ticking as they cool, until the police decide it's time to go.
  - type: book_ahead
    steps:
      - days_before: 2
        text: "Pick a **Friday or Saturday** night in Tokyo and book a tour that says what it does if Daikoku is closed. Ask about its passenger-transport licence."
      - days_before: 1
        text: "Last day for free cancellation on the Niche Drive tour (up to 24 h before)."
      - days_before: 0
        text: "Meet at **Harajuku Station** for Niche Drive. If police close Daikoku, the guide switches to other stops."
  - type: cost_breakdown
    items:
      - label: "Small-group tour (from)"
        local: 15000
        brl: 526.5
    note: "This is about three days of your R$170 budget for one night. It's on your must-do list and there's no cheap way in. If cars are only a mild interest, this is the one to skip."
  - type: map
    zoom: 14
    note: "The pin is the parking area inside Daikoku Junction. There's no pedestrian access: arrive by tour, taxi or rental car only."
  - type: tips
    variant: insider
    items:
      - "Expect a **static meet**: engines off, owners chatting. Ask before close-up photos of people, and keep bags and belt buckles away from paintwork."
      - "Consider a **Friday**: a 2018 report said closures were most common on Saturday nights."
      - "Wear something reflective or bright. It's a busy car park in the dark."
  - type: tips
    variant: pitfalls
    items:
      - "**Never** accept a paid ride from someone who approaches you on the street. Police warn this is how unlicensed 'driving tours' operate."
      - "If police tell the crowd to leave, leave. Don't argue."
      - "A 'Tokyo Drift' tour means looking at parked cars, not drifting. Read the itinerary before you pay."
  - type: weather
    temp_low_c: 3
    temp_high_c: 10
    conditions: Cold and dry, on the bay
    note: "Yokohama's January averages 3 °C at night and 10 °C by day, with about 6 wet days. You'll stand in an open lot on the bay at night for an hour or more."
    wear: Warm jacket, gloves, something reflective
  - type: pairs_well
    items:
