blocks:
  - type: hero
    image: mlx01
    caption: "MLX01-1, the maglev that ran 581 km/h in 2003, at the museum entrance"
    hook: "The fastest trains Japan has built, parked by Nagoya port, halfway between Tokyo and Osaka."
  - type: quick_facts
    time_needed: 3–4 h
    best_time: "Fri 29 Jan, at 10:00"
    extra:
      - label: Extra vs riding through
        value: "¥1,750 (R$61.95)"
        detail: "Unreserved; ¥2,380 (R$84.25) with Nozomi reserved seats"
      - label: From Nagoya Station
        value: "24 min, ¥360"
        detail: "Aonami Line to the last stop, Suica works"
      - label: Your backpack
        value: Lockers at both ends
        detail: "Nagoya Station and the museum; prices not found"
  - type: highlights
    items:
      - title: Three world records at the door
        text: "The entrance hall holds the **C62 17** steam engine (129 km/h, 1954), the **300X** test Shinkansen (443 km/h, 1996) and **MLX01-1**, the superconducting maglev that set the world rail record of **581 km/h** in 2003."
      - title: Every Shinkansen generation
        text: "39 real vehicles, among them **0, 100, 300, 700 and N700 series** Shinkansen and **Doctor Yellow**, the yellow track-inspection train (923 series, T4 set). Some you can step inside."
      - title: Drive an N700
        text: "A full-size N700 cab mock-up with a 10 × 3 m curved screen: 15 minutes at the controls for **¥500**. A ¥100 local-train driving simulator and a ¥500 conductor simulator are there too."
      - title: The maglev and the diorama
        text: "A theatre built like the maglev cabin plays a CG ride on the Yamanashi test line. The diorama, among Japan's largest, runs the Tokaido Shinkansen from Tokyo to Kansai through a whole day and night."
  - type: prose
    title: Why a museum earns this day
    dropcap: true
    text: |-
      Museums usually don't make your list. This one gets a card because it costs you **no sightseeing day** and only about **¥3,670 (R$129.92)**: Fri **29 Jan** is the move from Tokyo to Osaka, and Nagoya is a stop on that line anyway. It is also the one place for the "bullet train stuff" you asked the planner about: the museum of **JR Central**, the company that runs the Tokaido Shinkansen, with the maglev and the 300X record holders in the same room.

      **A realistic day.** Take a Nozomi from Tokyo by about **07:30** (about 1 h 40 min to Nagoya). Put your backpack in a station locker or carry it on, ride the Aonami Line (24 min, every 15 min) and be at the door at the **10:00** opening, which is your best chance at an N700 simulator ticket. Stay until about **14:00**, with lunch from the bento shop. Back at Nagoya around 14:30, a Nozomi gets you to Shin-Osaka in about 50 minutes: in Osaka by about **15:30–16:00**, well before the Ado weekend.

      **Why not Omiya or Kyoto?** JR East's Railway Museum in Omiya (closed Tuesdays) would take one of your Tokyo days. The Kyoto Railway Museum (¥1,500, closed Wednesdays, so shut on Setsubun, Wed 3 Feb) is the one for steam: a roundhouse full of steam engines and a ¥300 steam ride. Neither has the maglev, and neither sits on a day you are already on the Shinkansen.
