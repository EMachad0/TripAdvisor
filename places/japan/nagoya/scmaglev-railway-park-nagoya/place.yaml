  - type: faq
    title: The fare question
    items:
      - q: What does stopping in Nagoya add to the Tokyo → Osaka ticket?
        a: "Buy **one base fare ticket Tokyo → Osaka** (¥8,910): it is over 100 km, so you may leave the gates at Nagoya. Shinkansen express tickets can't be used for a stopover, so you need **two**: Tokyo–Nagoya ¥4,180 + Nagoya–Shin-Osaka ¥2,530 unreserved. Total **¥15,620** vs ¥13,870 straight through: **+¥1,750 (R$61.95)**. With Nozomi reserved seats (¥4,920 + ¥3,270) it is ¥17,100 vs ¥14,720: **+¥2,380 (R$84.25)**."
      - q: Is two separate tickets the same thing?
        a: "No, it costs more. Tokyo–Nagoya ¥10,560 + Nagoya–Shin-Osaka ¥5,940 unreserved = **¥16,500**, which is ¥880 more than the through base ticket. Ask for the through base fare ticket with the two express tickets."
      - q: Is there a cheaper way from Nagoya to Osaka?
        a: "The **Meishin Highway Bus** is ¥3,100 (discount seats from ¥1,600) and takes about 3 h. With the ¥10,560 Shinkansen to Nagoya that is ¥13,660, **less than riding straight through**. **Kintetsu** to Osaka-Namba (about 2 h) is ¥4,790, or ¥4,990 on the Hinotori; it saves the transfer to Namba but costs about the same as the Nozomi stopover."
      - q: Do these prices change on 29 Jan?
        a: "Reserved seats cost ¥200 less to ¥400 more depending on the season; unreserved prices are the same all year. The Nozomi increase announced for 2027 applies from **1 Jul 2027** purchases, so not to your trip."
  - type: map
    note: "From Nagoya Station follow the **Aonami Line** signs and ride to the last stop, **Kinjo-futo**. The museum is about 2 minutes on foot."
  - type: tips
    variant: insider
    items:
      - "Simulator tickets are sold **first-come at the information desk**, from opening until 17:15, in limited numbers. You get **either** the N700 **or** the conductor simulator, not both. When busy, numbered tickets may be handed out before opening. Go to the desk first."
      - "The free audio guide works on your phone over the museum Wi-Fi, in English and **Portuguese**."
      - "**PLUSTA Bento** (2F, 11:00–17:00) sells ekiben you can only buy here, including a Doctor Yellow box. You can eat it inside the N700 cars."
      - "Your Suica works on the Aonami Line. It is a separate company, so the JR Pass doesn't cover it."
  - type: tips
    variant: pitfalls
    items:
      - "Don't buy the Shinkansen ticket all the way to Shin-Osaka as one express ticket: leaving the gates at Nagoya voids the rest of it."
      - "A backpack up to 160 cm (length + width + height) rides free on the Shinkansen; above that you need a seat reservation with an oversized-baggage area."
      - "Tuesdays are closed: in your Japan dates that is **26 Jan and 2 Feb**. 29 Jan is a Friday and open."
      - "If the **Daikoku PA** retry moves to the night of Fri 29 Jan, you leave Tokyo on Sat 30 Jan instead. The museum is open that day too, but it is the Ado weekend: only stop if your show time leaves the afternoon free, otherwise ride straight through."
  - type: weather
    temp_low_c: 1
    temp_high_c: 9
    conditions: "Cold, sunny, little rain; about 4 cm of snow a January"
    note: "Nagoya's January averages about 1 °C at night and 9 °C by day. The visit is indoors; only the walk from the station and the outdoor N700 are in the wind off the port."
    wear: "Your travel jacket is enough; layers you can stuff in the backpack"
