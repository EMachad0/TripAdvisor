  - type: prose
    title: "The day, train by train (weekday, all times UTC+9)"
    text: |-
      From JR East's timetable for weekdays 20 Jan – 4 Feb 2027; on weekends there are a couple more trains.

      **Going (pick one):**

      - **Fast:** Tokyo 07:24 (UTC+9) *Asama 603* Shinkansen, non-reserved → Takasaki 08:19 · Takasaki 08:27 local → Minakami 09:33 · Minakami 09:42 → **Doai 09:51 (UTC+9)**, underground platform.
      - **Cheapest:** Tokyo 06:20 (UTC+9) Ueno-Tokyo Line → Takasaki 08:15, then the same 08:27 and 09:42 locals → Doai 09:51 (UTC+9).

      **At Doai:** climb out, coffee when the café opens at 10:00 (UTC+9). For the ropeway, the bus leaves Doai-eki-mae at 10:58 (UTC+9) and reaches Tanigawadake Joch at 11:05 (¥240). Last ropeway up is 16:00 (UTC+9). Buses back to Doai-eki-mae leave the ropeway at 12:00, 13:52, 14:55, 16:13 and 17:05 (UTC+9), arriving 3 min later.

      **Coming back (up trains from the surface platform):**

      - **15:33 (UTC+9)** → Minakami 15:48 · 15:53 local → Takasaki 16:57 · 17:05 *Hakutaka 568* → **Tokyo 17:52 (UTC+9)**. All-local: 16:59 from Takasaki → Tokyo 18:54 (UTC+9).
      - **With an onsen:** soak at Yubuki-no-yu (listed 16:00–19:00 UTC+9, hours vary by date: call ahead), then 18:19 (UTC+9) → Minakami 18:34 · 18:44 → Takasaki 19:48 · 20:00 *Asama 630* → Tokyo 20:52 (UTC+9).
      - **Last via Takasaki:** 19:45 (UTC+9) → Minakami 19:59 · 20:16 → Shin-Maebashi 21:09 · 21:14 → Takasaki 21:24 · 21:41 *Toki 344* → Tokyo 22:28 (UTC+9).
      - **Very last:** 21:01 (UTC+9) *down* train → Echigo-Yuzawa 21:27 · 22:25 *Toki 346* → Tokyo 23:40 (UTC+9). Jorudan prices this at ¥7,360 with a reserved seat.

      Gaps between trains are 1–3 hours, so set the return train before you leave the station.
