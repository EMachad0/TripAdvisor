blocks:
  - type: hero
    image: staircase
    caption: "The 462-step tunnel staircase from the down platform"
    hook: "A Niigata-bound train drops you in a tunnel 70 m down. The only way out is a 338 m staircase."
  - type: quick_facts
    time_needed: Full day (5–7 h on trains)
    best_time: "Weekday: 09:51 to 15:33 (UTC+9)"
    extra:
      - { label: Depth, value: 70 m below the station, detail: "Down platform in the Shin-Shimizu Tunnel" }
      - { label: The climb, value: 462 + 24 steps, detail: "338 m of stairs, no escalator or lift; about 10 min down" }
      - { label: Trains, value: 7–8 a day each way, detail: "7 on late-Jan weekdays, 8 on weekends; gaps of 1–4 h" }
  - type: highlights
    items:
      - title: Arrive underground
        text: "Ride the local from Minakami and you step out onto the **down platform inside the Shin-Shimizu Tunnel**, about 70 m below the station building. That is the way to do it: arriving by bus misses this."
      - title: "The 462 + 24 steps"
        text: "A straight, lit, 338 m tunnel staircase with no escalator or lift, then 24 more steps over the river and road to the ticket gate. Going down takes about 10 minutes; Japanese Wikipedia says climbing can take tourists 30 minutes or more."
      - title: A station with no staff
        text: "Unstaffed since 1985. The old station office is now **Kissa Mogura**, a café (10:00–15:00 UTC+9, irregular days off) with hand-drip coffee and a Napolitan spaghetti lunch, run by the DOAI VILLAGE camp next door."
      - title: Snow country add-ons
        text: "Two bus stops away, the **Tanigawadake Joch** ropeway climbs into the snow (¥3,000 return in late Jan). By the station, **Yubuki-no-yu** day onsen is listed 16:00–19:00 (UTC+9); hours vary, no price posted: call 0278-72-5522."
  - type: prose
    title: "Which \"deepest\"?"
    text: |-
      Doai is the deepest station **in service** in Japan, measured **below the ground above it**: its down platform sits about 70 m under the station building (station signs: 653.7 m and 583 m above sea level).

      - **Yoshioka-Kaitei** in the Seikan Tunnel was deeper, 149.5 m **below sea level**, but passenger stops ended in 2006 and it closed formally in 2014. Its twin, Tappi-Kaitei, is also closed.
      - **Roppongi** on the Toei Ōedo Line is the deepest *subway* station in Tokyo, with its lower platform about 42 m down.

      So "Japan's deepest station you can still get off a train at" is Doai, and that is the one locals call the *Nihon-ichi no mogura-eki*, Japan's number-one mole station.
