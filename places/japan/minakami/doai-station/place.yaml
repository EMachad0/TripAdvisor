    items:
      - { label: "JR fare Tokyo → Doai (local trains)", local: 3190, brl: 118.16 }
      - { label: "JR fare Doai → Tokyo (local trains)", local: 3190, brl: 118.16 }
      - { label: "Shinkansen Tokyo ⇄ Takasaki, non-reserved surcharge ×2", local: 5020, brl: 185.94, optional: true, note: "Jorudan quote; saves about 1 h each way" }
      - { label: "Bus Doai-eki-mae ⇄ Tanigawadake Joch", local: 480, brl: 17.78, optional: true, note: "¥240 each way, Kan-etsu Kotsu fare table" }
      - { label: "Tanigawadake Joch ropeway, return", local: 3000, brl: 111.12, optional: true, note: "Late Jan – early Feb price (C tier), official calendar" }
    note: "Over the Japan day budget because it is a 175 km trip each way; the station itself is free. The Shinkansen-to-Jōmō-Kōgen + bus route costs more (¥5,930 reserved e-ticket + ¥1,400 bus each way) and lands you at the top of the stairs, not the bottom."
  - type: map
    note: "Bus stop Doai-eki-mae (土合駅前) serves the station; Tanigawadake Joch is two stops further up the road."
  - type: tips
    variant: insider
    items:
      - "Arrive on a **down train** (towards Nagaoka) so you start at the bottom. Up trains to Minakami stop at the surface platform, which is where you leave from."
      - "Doai has **no Suica readers, no ticket machine and no staff**. Buy a paper ticket to Doai before you set off. For the way back, the station has a boarding-certificate machine (乗車駅証明書): take one and pay at your destination."
      - "Times on this page come from JR East's December 2026 edition, which already covers 20 Jan – 4 Feb. Re-check [JR East's Doai timetable](https://timetables.jreast.co.jp/2612/timetable/tt1035/1035020.html) the week before."
  - type: tips
    variant: pitfalls
    items:
      - "On **weekdays** the 11:48 down and 10:21 up trains don't run in late January (weekends only). Don't plan around them."
      - "Miss the 15:33 (UTC+9) and the next up train is 17:19, then 18:19 (UTC+9). Sunset is about 17:00 (UTC+9) at the end of January."
      - "The café keeps irregular days off and posts them on Instagram; bring a snack in case it is shut."
  - type: weather
    temp_low_c: -4
    temp_high_c: 3
    conditions: "Deep snow: January snow depth in Minakami peaks around 119 cm"
    note: "Minakami (524 m) averages −4.4 °C to 2.6 °C in January; Doai sits higher, at about 650 m. The staircase is inside the lit tunnel and out of the snow, but the plaza and the bridge passage outside can be snowbound. In heavy snow, check JR East train info before you set off."
    wear: "Snow boots with grip, layers you can open on the climb, gloves, a hat"
