  - type: map
    zoom: 15
    note: "Walk from Kami-Suwa Station, about 1.5 km north-east and uphill. The city asks visitors to come on foot: the road is narrow and the 23-space car park fills at sunset. Toilets are across the road from the park, with no crossing."
  - type: tips
    variant: insider
    items:
      - "**Day trip by bus:** the 07:25 bus from Busta Shinjuku reaches Kami-Suwa Station at 10:27, and the last bus back leaves Kami-Suwa at 19:26 and reaches Busta Shinjuku at 22:35 (all UTC+9, Alpico timetable revised 2025-07-01). Book on Highway Bus .com up to a month ahead."
      - "Arrive by **16:30 (UTC+9)** to watch the sunset from the terrace, then stay for the night view. Walk down by 18:30 to make the last bus."
      - "Kill the afternoon near the station: **Katakurakan**, a Romanesque-style brick bathhouse with a deep pebble-floored bath; the **foot bath inside Kami-Suwa Station**; and the **Gokura**, five sake breweries on the old Kōshū-kaidō road just south of the station."
      - "Check the park's **live camera** on the Suwa City site before you climb, to see snow and crowds."
  - type: tips
    variant: pitfalls
    items:
      - "The on-demand **Choisoko Karin-chan** bus stops near the park, but it needs registration in Japanese, runs only 08:00–16:00 (UTC+9) and costs ¥500. It's no use for the trip back after sunset. Walk."
      - "Taxis take about 15 minutes from the station. The city mentions a fixed-price taxi plan through the tourist office (0266-58-0120), but the price isn't published."
      - "After snow, the uphill lanes and the terrace steps can be icy in the dark. Wear shoes with grip and bring a phone light for the walk down."
  - type: weather
    temp_low_c: -6
    temp_high_c: 4
    conditions: Clear, dry and well below freezing after dark; some snow
    note: "Suwa's January averages 3.8 °C by day and −5.5 °C at night, with about 27 cm of snow over the month. Lake Suwa has failed to freeze in most recent winters, so expect open water or patchy ice, not a white sheet. You'll stand still on an exposed hillside at dusk, so it feels colder than the numbers."
    wear: Down jacket, hat, gloves and shoes with grip for icy steps
