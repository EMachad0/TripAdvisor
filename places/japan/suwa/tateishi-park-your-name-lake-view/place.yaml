  - type: highlights
    items:
      - title: The lake from the film
        text: "Lake Suwa from up here looks like **Itomori Lake**: a round lake ringed by town and mountains. Nagano's tourism site says the park grew popular for exactly that resemblance."
      - title: Steps facing the view
        text: "The park's grassy terrace drops toward the lake in wide **steps**, like an open-air theatre. This is the staircase-with-a-lake photo fans post."
      - title: Sunset behind the Alps
        text: "The sun sets across the lake behind the Japanese Alps. Then the town lights come on all around the shore. The city lists it among Japan's **100 best night views** (新日本三大夜景・夜景百選)."
      - title: Free, and you can walk it
        text: "No ticket, no gate. From Kami-Suwa Station it's about **30 minutes on foot**, uphill through a residential neighbourhood."
  - type: prose
    title: Which place is it, really?
    dropcap: true
    text: |-
      **Itomori doesn't exist.** The comet town in *Your Name* (君の名は。) is a mix of real places. Its town scenes and library draw on the city of **Hida** in Gifu (the Hida-Furukawa area). Its lake has no single twin: director Makoto Shinkai said his image for Itomori Lake was **Matsubara and Otsuki lakes** in Koumi, his Nagano hometown, but the lake people compare it to is **Lake Suwa**, in Nagano too. No real town has both the streets and the lake.

      The view fans match to the film is the one from **Tateishi Park**, on the hill behind Kami-Suwa's hot-spring district. Nagano's own tourism site says the park grew popular for that resemblance. It's the place to go for the film's round lake ringed by a town and mountains.

      If you meant the long **stone stairs up to Mitsuha's shrine**, those are modelled on Ketawakamiya Shrine in Hida-Furukawa, and there's no lake there. The red-railed stairs from the film's last scene are [Suga Shrine](https://sugajinjya.or.jp/access/) in Tokyo.
