blocks:
  - type: hero
    image: west-side
    focus: center
    hook: "Seawalls, gutted concrete flats and a pithead on 6 hectares of rock: a mining town left to rot in 1974."
    caption: "The west side's apartment blocks, seen from the cruise boat"
  - type: quick_facts
    time_needed: "2.5 h boat (~3.5 h door to door)"
    best_time: "Morning sailing, first full day in town"
    extra:
      - { label: Time on the island, value: "40–50 min", detail: "Three viewing points along a fenced walkway" }
      - { label: Winter landings, value: "About half to two-thirds", detail: "Rough reading of Yamasa's Jan–Feb 2025 chart" }
      - { label: English guide, value: "Yamasa: Tue/Thu/Sat/Sun", detail: "Free, per Yamasa's English page" }
  - type: highlights
    items:
      - title: A whole town in concrete
        text: "From 1887 to 1974 this tiny island was an undersea coal mine. At its 1959 peak **5,259 people** lived on 6.3 hectares. In 1916 Mitsubishi built Japan's first large reinforced-concrete apartment block here, and the shells of the later blocks still stand."
      - title: You actually set foot on it
        text: "Since 2009 licensed boats can tie up at the pier. A guide walks you along a fenced walkway past **three viewing points** in the south of the island for 40–50 minutes. More than 95% of the island stays off-limits, so you see the ruins from the path, never inside."
      - title: The loop by boat
        text: "After the landing, Yamasa's boat circles the island so you see the **apartment blocks** from the sea. Even when you can't land, this loop is what you get."
      - title: A difficult history
        text: "UNESCO listed the mine in 2015 in **Sites of Japan's Meiji Industrial Revolution**. Korean conscripts and Chinese POWs were forced to work its mines in the 1930s–40s. Japan promised to tell that story; UNESCO has found its efforts insufficient."
  - type: prose
    title: What you are signing up for
    dropcap: true
    text: |-
      Hashima sits about 19 km out from Nagasaki port, on open sea. Since 2009, when the city reopened it after 35 years, the only way to visit is a licensed cruise. You board, ride out for about half an hour, and the captain decides at the island whether you can land. **The boat can sail and still not land.** If the wind is over 5 m/s or the waves over 0.5 m, you get a lap around the island and a partial refund instead.

      Winter is the worst season for this. Read roughly off [Yamasa Kaiun's chart](https://www.gunkan-jima.net/graph-ja/) for 2024–25, only **about half to two-thirds** of December–February sailings landed; the rest circled the island or stayed in port. Book the earliest sailing you can, and keep a second day free for another try. For your dates Yamasa is the operator to use: Gunkanjima Concierge's boat is in dry dock from 4 Jan to 5 Feb 2027.

      **Is it too far out of the way?** From Osaka it is about **4.5 hours each way** by Shinkansen with two changes, ¥19,900 (R$699.88) one way reserved, or ¥15,850 (R$557.44) bought 2+ weeks ahead. That's roughly R$1,100–1,400 return plus two nights, three of your 15 Japan days, and one rough sea can still cost you the landing. Tomogashima near Osaka is the cheap fallback: real ruins, but a fort island, not a town.

      The other thing to know is the history. The island had a school, a hospital, a cinema and rooftop gardens, and that daily life is the story the tours are built around. Its wartime forced labour is documented by the UNESCO process and is still disputed between Japan and South Korea. Wikipedia's article covers both sides and is worth reading on the way out.
