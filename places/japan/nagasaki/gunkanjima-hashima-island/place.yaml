  - type: quote
    variant: vibe
    text: "Thirty minutes of open sea, a pier, and a town where the last resident left more than fifty years ago."
  - type: book_ahead
    steps:
      - days_before: 20
        text: "Book on **Yamasa's calendar**: free cancellation ends 15 days out, and the early fares need advance booking (Yamasa doesn't say how far). Pick the **morning** sailing on your first full day."
      - days_before: 1
        text: "Check the sea forecast and Yamasa's homepage. A high-wave advisory or warning cancels the sailing outright."
      - days_before: 0
        text: "Check in at **window 7** of the Nagasaki Port Terminal 45–60 min before sailing, sign the safety pledge and pay. Bring **¥5,350 in cash**: Yamasa's English FAQ says cash only (its Japanese FAQ lists cards)."
  - type: cost_breakdown
    items:
      - { label: "Yamasa Kaiun boat fare (regular)", local: 4700, brl: 165.3 }
      - { label: "Nagasaki City entry fee (refunded if you can't land)", local: 650, brl: 22.86 }
      - { label: "Tram to Ohato and back", local: 300, brl: 10.55, optional: true }
    note: "Over the R$170 day budget, because it is the whole day's plan and Japan's best-known ruin. The early fare (¥3,800 + ¥650 = R$156.51) brings it under."
  - type: map
    note: "Yamasa leaves from **Nagasaki Port Terminal** (pier 2), a 10-minute walk from JR Nagasaki Station."
  - type: tips
    variant: insider
    items:
      - "Book **Yamasa on a Tue, Thu, Sat or Sun**: that's when its English page says the free English guide is aboard."
      - "Yamasa's page says the morning sailing sees the island's east side in full light; in the afternoon it's the reverse."
      - "On Yamasa seats are unreserved and go in queue order: line up early for a window."
      - "Bring water and take rubbish home: the island has no toilets, shops or bins."
  - type: tips
    variant: pitfalls
    items:
      - "No umbrellas on the boat or the island (rule from the city). Bring a rain jacket."
      - "The sea outside the harbour can be rough even when the port is calm; Yamasa advises seasickness tablets 30 min before."
      - "If the landing fails, Yamasa refunds the ¥650 fee and 10% of the fare. You don't get a free second try."
      - "Don't plan on **Gunkanjima Concierge**: no sailings 4 Jan – 5 Feb 2027 while its boat is in dock."
  - type: weather
    temp_low_c: 4
    temp_high_c: 11
    conditions: "Cool, often windy at sea; 10 rainy days a month"
    note: "January normals are 4.0–10.7 °C, February 4.5–12.0 °C. The cold is mild; wind and swell decide whether you land."
