blocks:
  - type: hero
    image: tobihino-deer
    focus: "50% 60%"
    caption: "Tobihino lawn, where the deer-calling horn sounds (August 2025)"
    hook: "Wild deer that bow for crackers, a giant bronze Buddha, and a forest path lined with stone lanterns."
  - type: quick_facts
    time_needed: "Half day; full day with Kasuga"
    best_time: "08:00 at Todai-ji, Kasuga after"
    extra:
      - { label: Closest base, value: "Osaka-Namba, 37 min", detail: "Kintetsu ¥680 each way; Kyoto Kintetsu ¥760, 48 min" }
      - { label: Deer, value: "1,687 (2026 count)", detail: "Wild, a national natural monument" }
      - { label: Crackers, value: "¥200 a bundle", detail: "Shika senbei, sold at stalls across the park" }
  - type: highlights
    items:
      - title: The bow
        text: "Hold up a bundle of **shika senbei** and some deer dip their heads to you. The deer foundation says: give the cracker quickly once they bow. Teasing them, or pretending you have one, is what makes them butt."
      - title: The Great Buddha
        text: "Todai-ji's **Daibutsuden** (Great Buddha Hall) is ¥800, open 08:00–17:00 from November to March. Next door, **Nigatsudo** is free and always open, with a view over the city from its balcony."
      - title: Lantern forest
        text: "Kasuga Taisha sits about 25 minutes' walk east of Kintetsu Nara, at the end of a path lined with stone lanterns. The shrine counts about **3,000**, stone and hanging. The outer worship hall is free; the inner area is ¥700."
      - title: Three dates to aim for
        text: "**Sat Jan 23**: Wakakusa Yamayaki, the hill set on fire after fireworks. **Sun Jan 31**, 10:00: the winter deer calling. **Wed Feb 3**: every lantern at Kasuga lit for Setsubun."
  - type: prose
    title: How the day works
    dropcap: true
    text: |-
      **Base: Osaka is closer.** From **Osaka-Namba**, the Kintetsu rapid express reaches **Kintetsu-Nara** in about 37 minutes for **¥680** (R$24.07). From **Kyoto Station**, the Kintetsu express takes about 48 minutes for **¥760** (R$26.90), or 34 minutes on the ¥1,280 limited express. Both end at Kintetsu-Nara, about **5 minutes' walk** from the park. JR runs too, to JR Nara station, about 20 minutes' walk from the park: Kyoto ¥720, JR Osaka ¥840. The cheapest way in is JR from **JR Namba** on the Yamatoji line, **¥580** and a 41-minute ride, plus the 20-minute walk from JR Nara. A JR Pass covers JR, not Kintetsu.

      **The walk.** Walk east from Kintetsu-Nara into the park, then north to **Todai-ji** (japan-guide puts it at about 30 minutes on foot from the station). From Todai-ji, climb to **Nigatsudo** for the view. Then walk south through the woods to **Kasuga Taisha** (about 25 minutes from the station by the shrine's count), and back west across the **Tobihino** lawn.

      **Where the deer are calmer.** The prefecture says the deer live on the park's grass, leaves and acorns; crackers are a treat. The foundation warns that anyone feeding crackers draws a crowd of deer. So the pushy ones are where the crackers are: by the stalls. Empty-handed out on the lawns, you mostly watch them graze.

      **Half day or full?** Deer and the Great Buddha fit in a morning. Add Kasuga and the walk, and it's a day. On **Jan 23**, stay on after dark for the hill burning and take a late train back.
