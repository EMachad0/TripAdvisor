  - type: quote
    variant: vibe
    text: "Cold air, brown winter grass, and a deer nodding at the cracker in your hand."
  - type: cost_breakdown
    items:
      - { label: "Todai-ji Great Buddha Hall", local: 800, brl: 28.32 }
      - { label: "Kasuga Taisha inner area (special worship)", local: 700, brl: 24.78 }
      - { label: "Shika senbei, one bundle", local: 200, brl: 7.08 }
      - { label: "Kintetsu Osaka-Namba ⇄ Kintetsu-Nara, return", local: 1360, brl: 48.14 }
      - { label: "From Kyoto instead: Kintetsu express return", local: 1520, brl: 53.81, optional: true }
      - { label: "Yamayaki paid standing area, advance (Jan 23)", local: 2500, brl: 88.50, optional: true }
    note: "The park, Nigatsudo and the outer Kasuga worship hall are free. Yamayaki can also be seen from places outside the paid areas."
  - type: map
    zoom: 15
    note: "Get off at **Kintetsu-Nara**, not JR Nara: it's the station next to the park. There are **no bins** in the park, so carry your rubbish out."
  - type: tips
    variant: insider
    items:
      - "**Sun Jan 31, 10:00**: the free winter *shikayose* on the Tobihino lawn. A natural horn calls the deer out of the woods and they get acorns. No booking. It's the only winter date in your Japan window (Jan 24 is skipped)."
      - "**Sat Jan 23**: Wakakusa Yamayaki. Fireworks at 18:15, hill lit at 18:30. The organisers say there are places to watch outside the paid areas. If one firework goes up or the hill is lit, paid tickets aren't refunded, rain or not."
      - "Paid standing area: the ¥2,000 early-bird ends **Jan 15**, before you land. Jan 16–22 it's ¥2,500 (7-Eleven +¥165; online +¥330 and more), or ¥3,000 cash on the day if left. Swap it for a wristband at **Iraka** hall, 14:30–17:30, then walk about 30 min uphill."
      - "**Wed Feb 3, Setsubun**: about 3,000 lanterns at Kasuga are lit around 18:00; the gate is due to close about 20:30. The inner corridor is ¥700 that night. Kasuga's inner area is closed that morning."
      - "Kasuga's inner area is also closed on the mornings of the **1st, 11th and 21st** of each month. So skip it on the mornings of Jan 21 and Feb 1."
  - type: tips
    variant: pitfalls
    items:
      - "**Show, then give.** Once a deer bows, hand the cracker over. The foundation warns that holding it back, or faking it, stresses them and they butt."
      - "**Only senbei.** Feeding them anything else (snacks, bread, vegetables, leftovers) is banned; it makes them sick. They also eat maps and plastic bags: keep them in your pocket."
      - "**They do hurt people.** The prefecture logged **110** injuries from April to 31 Dec 2025, **80** of them foreign visitors, 19 taken to hospital. Biting, kicking, butting and antlers are the risks. Don't touch them, and wash your hands if you do."
      - "Buy bundles with the paper **certification band**. The deer foundation sells the bands to the makers, and that money funds deer care, says Japanese Wikipedia."
      - "Sunset is **17:13** on Jan 20 and 17:28 on Feb 4, and the Great Buddha Hall closes at 17:00. Start early."
  - type: weather
    temp_low_c: 0
    temp_high_c: 9
    conditions: "Cold, mostly dry; a little snow possible"
    note: "Nara averages 0.1 °C at night and 9.0 °C by day in January (JMA 1991–2020), with about 8 wet days and 1 cm of snow in the month. Everything here is outdoors except the Buddha hall, and the Yamayaki and Setsubun evenings are after dark: plan for near freezing."
    wear: "Warm coat, gloves and hat, shoes for gravel paths; a bag that closes (the deer go for paper)"
