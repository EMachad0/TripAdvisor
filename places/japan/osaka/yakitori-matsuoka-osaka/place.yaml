blocks:
  - type: hero
    hook: One chicken breed, about twenty courses, and a counter of nine.
  - type: quick_facts
    time_needed: 2 h seating
    best_time: "18:00 (UTC+9)"
    extra:
      - { label: Course, value: About 20 dishes, detail: "Skewers of every cut plus soup, salad and dessert" }
      - { label: Solo, value: "Yes, 1 guest", detail: "TableCheck party size starts at 1; Michelin: good for solo" }
      - { label: Out of place?, value: "No", detail: "Small hidden counter; English menu; no dress rule listed" }
  - type: highlights
    items:
      - title: A tasting menu built on one bird
        text: "The whole course uses **Kuro-Ou**, a black Satsuma chicken, with the rare parts too: heart, gizzard, tail, wing and shoulder. The official site counts **about 20 dishes**; Tabelog's listing adds soup, salad and dessert."
      - title: Everyone starts together
        text: "Nine counter seats and **two seatings a night**, at 18:00 and 20:30 (UTC+9). The chef grills over Kishu binchōtan for the whole counter at once, so it feels like a dinner course, not an izakaya."
      - title: The almost-as-good tier
        text: "In the **Michelin Guide Kyoto–Osaka 2025 and 2026** without a star, and on Tabelog's **Yakitori WEST top 100** for 2024–2026 (3.69)."
      - title: Why go over the R$170 day
        text: "About **R$462** with the 5% service: close to three days of budget, for the one yakitori dinner that tastes a single chicken from end to end."
  - type: quote
    variant: vibe
    text: Charcoal smoke, nine stools, and the next skewer already on the grill.
  - type: book_ahead
    steps:
      - days_before: 45
        text: "Book now: open Matsuoka on **TableCheck**, set **party size 1**, and pick the 18:00 or 20:30 (UTC+9) seating. TableCheck opens **120 days** ahead, so your dates are on sale. Only 9 seats."
      - days_before: 1
        text: "Check the cancellation terms TableCheck shows when you book. Fully booked? Watch the restaurant's Instagram stories for freed seats."
      - days_before: 0
        text: "Arrive before your seating: the course starts for everyone at once."
  - type: menu
    title: The course (tax included)
    items:
      - { name: Kuro-Ou Yakitori Omakase, name_local: 黒王 焼鳥おまかせコース, price_local: 12320, price_brl: 440.44, note: "About 20 dishes; 5% service added", tag: signature }
    note: "Drinks are extra; TableCheck mentions rare sake such as Jūyondai, but drink prices aren't online. TableCheck also lists a ¥13,200 version without saying why."
  - type: cost_breakdown
    items:
      - { label: Kuro-Ou omakase course, local: 12320, brl: 440.44 }
      - { label: 5% service charge, local: 616, brl: 22.02 }
    note: "Drinks not included."
  - type: map
    note: "A quiet residential block, about **7 min** on foot from Tanimachi 6-chōme or 9-chōme (Tanimachi Line) and from Kintetsu Osaka-Uehommachi."
  - type: tips
    variant: insider
    items:
      - "Take the **18:00 (UTC+9)** seating: the 2-hour seat ends at 20:00 (UTC+9), with the evening still ahead."
      - "The restaurant posts cancelled seats on **Instagram stories**; useful if TableCheck shows your night full."
  - type: tips
    variant: pitfalls
    items:
      - "**Closed Mondays** and some irregular days; check the calendar for Feb 1."
      - "No vegetarian or gluten-free menu, and guests with two or more allergies get fewer dishes."
      - "Late arrivals join the course in the middle and miss what's already been served."
  - type: weather
    temp_low_c: 3
    temp_high_c: 10
    conditions: Cool and mostly dry
    note: "Indoors at the grill; a 7 min walk from the subway."
    wear: Warm coat; clothes that can take some charcoal smoke
