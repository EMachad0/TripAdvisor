  - type: map
    note: "From **JR Tenma**, turn left out of the gate onto Tenma-ekimae Hondori, turn right at the Times parking, and look for the **Gyomu Super** on your left: the theater is on its 3rd floor (official directions)."
  - type: tips
    variant: insider
    items:
      - "Want to step out for food? Ask the front desk for a **go-out ticket** (外出券) so you can come back on the same entry."
      - "Monday 1 Feb is your only full Osaka day without an Ado evening: come for the 12:00 show and stay as long as you like."
      - "Programs run about 10 days. Fri 29 – Sun 31 Jan falls in the 21–31 Jan program (provisional lineup posted); Mon 1 Feb likely starts a new one, not listed yet."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the Entertainment Business Act (風営法) lists strip theaters as store-type sex-related businesses: notified to the safety commission, commercial zones only. Police still raid them for public indecency: **60+ theaters** and **450+ people**, customers included, 1998–2021 (Bengo4)."
      - "This theater was one of them, in **Nov 2024** (10 arrested, ABEMA TIMES). A former police official quoted there called it a possible warning before Expo 2025. Customers weren't reported arrested, but a raid during your visit is a real, small risk."
      - "**Phones are banned** inside the hall, and chatting during shows is discouraged. Only take photos at photo time, with the staff's camera."
      - "Under-18s are refused. Carry your passport in case staff ask your age."
