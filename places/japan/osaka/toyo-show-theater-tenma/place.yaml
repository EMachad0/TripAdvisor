  - type: highlights
    items:
      - title: One ticket, all day
        text: "**¥5,000** gets you in for the whole day, and you can walk in mid-show. The theater calls it the lowest entry price in the business. After **20:45** it drops to ¥3,000."
      - title: A big stage for the genre
        text: "**129 seats**, a revolving stage, moving lights and projectors: the theater calls itself one of the largest in western Japan. Each of the four daily shows has five dancers."
      - title: A bar between acts
        text: "The standing bar **CHACO** next to the hall serves soft drinks and alcohol at ¥500 each, and its decor changes with the season and events."
      - title: Written for visitors
        text: "The official site has **English and Chinese** pages with prices and show times. The show itself is music and dance, so no Japanese is needed."
  - type: gallery
    feature: false
