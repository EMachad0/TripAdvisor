      - { file: hall, caption: "The empty hall: 129 seats around the runway and revolving stage" }
      - { file: bar-chaco, caption: "CHACO, the standing bar beside the hall" }
  - type: prose
    title: The value pick, with a history
    dropcap: true
    text: |-
      Toyo Show is the Osaka counterpart to Tokyo's Asakusa Rock-za, and cheaper: ¥5,000 (about R$179) for a whole day, against ¥6,000 general admission in Asakusa. After the third and fifth dancer there's a **photo time**: you queue for the dancer you want, staff hand you a camera, and the printed souvenir photo costs ¥500.

      Know before you go: in November 2024 Osaka police raided it and arrested **10 people**, the operator, staff and dancers, for public indecency. Police cited extreme staging, including long lighting of dancers and filming with cameras the theater provided. No coercion or minors were reported. In November 2026 the theater is open, posting lineups and photo-session days. Bunshun counted only 15 strip theaters left in Japan in May 2026.
