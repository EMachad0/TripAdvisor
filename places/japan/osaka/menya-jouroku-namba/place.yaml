    note: "It's on a back alley one street off Namba's main shopping streets, about 5 min on foot from Namba station. No reservations; if it's full, wait on the chairs inside."
  - type: tips
    variant: insider
    items:
      - "Come near the **end of lunch service** or at an off-peak hour. Reviewers who did walked straight in."
      - "Order the **hayazushi** with the ramen. At ¥150–200 it's one of the cheapest add-ons on the menu."
  - type: tips
    variant: pitfalls
    items:
      - "**Closed Wednesdays**, and there's a gap from 15:00 to 18:00. Don't turn up mid-afternoon."
      - "There's a sister branch in Wakayama city. Make sure your map points to the **Namba** shop."
