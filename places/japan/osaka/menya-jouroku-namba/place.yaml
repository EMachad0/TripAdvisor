  - type: highlights
    items:
      - title: Osaka's own ramen style
        text: "**Takaida chuka soba** comes from East Osaka: near-black soy soup, coarse-cut green onion, a sweet-sour finish that surprises people."
      - title: Ramen and sushi
        text: "Order a **早寿司** (*hayazushi*, ¥150–200): vinegared mackerel pressed and wrapped in an *ase* leaf, a Wakayama speciality."
      - title: Cheap, and on the best-of lists
        text: "A regular bowl is **¥900**, and a 2026 reviewer notes it has made Tabelog's Top 100 ramen list **five years running**."
      - title: Free noodle refill
        text: "A 2025 reviewer got a **free kaedama** (refill of thin noodles). Ask for 替え玉 if the bowl isn't enough."
  - type: prose
    text: |-
      Most visitors to Namba eat at the neon places on Dotonbori. Jouroku is on a back street a few minutes away, with signed celebrity boards on the walls and a counter where you order out loud. Its soup is East Osaka's black Takaida style. Few foreign visitors have heard of it, though a 2026 reviewer found the counter mostly full of them, so word is spreading.

      It is the cheap classic for Osaka: under ¥1,000 for the bowl, ¥100 for a seasoned egg, ¥150–200 for a piece of sushi. Pair it with the Jinrui Mina Menrui queue on another day.
