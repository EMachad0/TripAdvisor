blocks:
  - type: hero
    image: garden-terraces
    caption: "Parks Garden's terraces, with Namba's towers behind"
    hook: "Walk through a canyon of shops and keep climbing until you're in a forest eight floors above the street."
  - type: quick_facts
    time_needed: 1–2 h
    best_time: After dark
    extra:
      - { label: Garden, value: "Free, open till midnight", detail: "About 11,500 m², 2F to 9F" }
      - { label: Plants, value: "~500 species", detail: "About 100,000 plants, with resident gardeners" }
      - { label: From Dotonbori, value: Short walk south, detail: "Directly linked to Nankai Namba Station" }
  - type: highlights
    items:
      - title: The canyon
        text: "The 2F walkway, the **Canyon Court**, was modelled on the Grand Canyon: layered walls of shops opening to the sky. The tall 'monument' called **Glacier** at its south end is really the escalator tower."
      - title: A forest on the roof
        text: "**Parks Garden** climbs in terraces from 2F to 9F: about **11,500 m²**, 500 plant species and 100,000 plants, with a grass hill on 8F and a wooded step garden on 9F. Entry is free."
      - title: Lit until midnight
        text: "The garden stays open until **24:00**, and Time Out says it is lit from sunset to midnight, which makes it a quiet walk after Dotonbori's crowds, even in winter."
      - title: A baseball ghost
        text: "The complex stands where **Osaka Stadium** was, home of the Nankai Hawks. The Nankai Hawks Memorial Gallery tells the team's 50-year story with trophies and uniforms."
  - type: prose
    title: Why a mall gets a card
    text: |-
      The shops are mid-range fashion and lifestyle chains, nothing you came to Japan for. What earns Namba Parks a card is the building: a long open canyon through the middle and a terraced park on top that steps up eight floors. Wikipedia says it was meant as a park first, in a city short on green.

      It costs nothing, it is open late, and it is close to the hostels around Namba. Go after dinner, take the escalators up through the garden to 9F, and look back over the city.
  - type: gallery
    images:
      - file: canyon
        caption: "The terraced garden and the canyon, seen from above"
        focus: center
      - file: level-2
        caption: "Inside on 2F"
  - type: map
    note: "From **Nankai Namba Station** walk straight south into the building; from Dotonbori it's a short walk past Namba station."
  - type: tips
    variant: insider
    items:
      - "Buy takeaway downstairs and eat on the **6F terrace**: the official guide says outside food is welcome there. Take your rubbish with you."
      - "The whole garden is **non-smoking**; smoking rooms are on 3F and 6F inside."
  - type: tips
    variant: pitfalls
    items:
      - "Shops close at **21:00** and most restaurants at **22:00**. Only the garden stays open until midnight."
      - "Check the official site for the month's **closing day** before you go."
