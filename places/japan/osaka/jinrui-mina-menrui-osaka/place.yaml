      - { name: "Macro, thick-cut pork", name_local: らーめん macro（厚切り焼豚のせ）, price_local: 1199, price_brl: 42.17, note: "The lighter shellfish-dashi bowl. Oct 2025 price" }
      - { name: Seasoned egg, name_local: 煮玉子, price_local: 72, price_brl: 2.53, tag: cheap }
    note: "Prices from 2025 reviews. A 2025 visitor ordered by scanning a QR code and ordering on LINE, so have mobile data."
  - type: map
    note: "From Shin-Osaka take the Midosuji Line one stop south to Nishinakajima-Minamigata, then walk 1 min. Or walk about 11 min south from JR Shin-Osaka. The shop is on a quiet side street with small black-and-white signage."
  - type: tips
    variant: insider
    items:
      - "Come on a **weekday at 11:00** (opening) or **after 14:00**. Lunch queues run 30–60 min, weekends up to 90."
      - "Leaving Osaka by Shinkansen? Shin-Osaka is one subway stop away. Eat here last."
  - type: tips
    variant: pitfalls
    items:
      - "It can **close early when the pork runs out**. Don't come at last order."
      - "Tsukemen isn't served here. It has its own shop of the same name a few minutes away, so check your map says **1-12-15**."
      - "Reported as **cash only** (Oct 2025), and ordering may be by QR code on LINE: have cash and mobile data."
  - type: weather
    temp_low_c: 3
    temp_high_c: 10
    conditions: Cool and mostly dry
    note: "The wait is outdoors on the pavement. Late January in Osaka is chilly rather than freezing; the time in line is the cold part."
    wear: Winter jacket for the queue
