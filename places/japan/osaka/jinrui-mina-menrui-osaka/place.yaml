blocks:
  - type: hero
    image: genten-bowl
    caption: "Ramen Genten: soy broth, thick-cut pork and finger-thick menma (the shop's photo)"
    hook: A ramen shop named "Humanity Is All Noodles", and a queue that proves the point.
  - type: quick_facts
    time_needed: 1–1.5 h incl. queue
    best_time: Weekday 11:00, or after 14:00
    extra:
      - { label: Style, value: Sweet shoyu, detail: "Sweet-edged soy sauce on a bonito-led dashi, not pork fat" }
      - { label: From Shin-Osaka, value: One subway stop, detail: "Midosuji Line to Nishinakajima-Minamigata" }
  - type: highlights
    items:
      - title: Steak-thick pork
        text: "The shop's signature is **極厚煮豚**, braised pork sliced very thick and soft enough to fall apart."
      - title: A broth that tastes like nobody else's
        text: "**Genten** (\"the origin\") is the original bowl: sweet-edged soy over a strong bonito dashi. *Macro* is lighter, on shellfish; *micro* is thicker soy."
      - title: Fat bamboo shoots
        text: "The **極太メンマ** are soaked for a long time in soft water. They come as thick as fingers."
      - title: The queue is the show
        text: "In 2025 reviewers waited **about an hour** at 16:00 and on an October evening. The line moves faster than its length suggests."
  - type: prose
    text: |-
      Matsumura opened the original shop in Nishinakajima in 2012, and it has been near the top of Osaka's ramen rankings since. The name roughly means "all humanity is noodle-kind": the shop doesn't take itself seriously, but the ramen is taken very seriously. Branches have opened since, but this one is the shop people travel for.

      Come here first: it's the one Osaka ramen worth queueing for on this list. Have the cheap Takaida-style bowl at Menya Jouroku another day.
  - type: gallery
    feature: false
    images:
      - { file: thick-pork, caption: "The thick-cut pork lifted from a Genten bowl at the Minamigata shop, 2024" }
      - { file: counter, caption: "Wooden counter and open kitchen (the chain's own photo)" }
      - { file: noren, caption: "Hanging the noren at opening time (the chain's own photo)" }
  - type: quote
    variant: vibe
    text: A queue on a quiet office street, and a slab of pork that covers half the bowl.
  - type: menu
