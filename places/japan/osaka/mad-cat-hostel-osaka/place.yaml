    good_to_know:
      - "Free security lockers; luggage storage only while reception is open (16:00–24:00)."
      - "Kitchen with fridge, microwave and toaster. Laundry ¥200, bike rental ¥500."
      - "It is in a residential part of Abeno, about 8 km from the centre by Hostelworld's count: Namba nights mean a train ride back."
      - "No children, no pets, no curfew."
  - type: highlights
    items:
      - title: The highest scores in Osaka
        text: "**9.7 overall and 9.8 for atmosphere** from 330 Hostelworld reviews, with 10.0 for security and for value."
      - title: A bar that brings locals in
        text: "The ground-floor bar opens at 19:00 for guests and neighbours alike, so the evening starts in the building."
      - title: Cheap on work nights
        text: "**¥3,600** a dorm bed on Mon 4 and Tue 5 Jan, ¥4,500 on Sat 9 Jan, all with free cancellation on 11 Nov."
      - title: Lazy mornings
        text: "Check-out is at **12:00**, an hour later than most hostels, after a late night out."
  - type: map
    note: "Hankai tram to Matsumushi (about 1 minute away), or the Midosuji Line to Showacho and walk about 7 minutes."
  - type: tips
    variant: insider
    items:
      - "Go down to the bar on your first evening: the welcome drink is the easy way to meet the people heading out that night."
      - "If you stay for the remote-work week, keep a weeknight base here: the dorm price is lowest Mon–Tue."
  - type: tips
    variant: pitfalls
    items:
      - "No source mentions a quiet work room or desks here. For laptop days, a café or Hostel Chillax in Namba, which lists a coworking space, is the safer bet."
      - "Check-in ends at 23:00 and reception at 24:00, and the listing says nothing about later arrivals: ask the hostel before a late flight into Kansai."
