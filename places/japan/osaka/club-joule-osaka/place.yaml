  - type: highlights
    items:
      - title: The club with a rooftop
        text: "Joule calls its rooftop terrace **the only one among Osaka nightclubs**. Three floors: main dancefloor, a mezzanine and a VIP level up top."
      - title: Real lineups
        text: "Time Out lists past guests from Steve Aoki and Calvin Harris to Fatboy Slim. The club's 2026 news announced Dixon, and its GOODLIFE techno parties come back several times a year."
      - title: A cheap midweek night
        text: "**MIDWEEK GROOVE** is techno every Wednesday from 23:00. ¥2,000 at the door, and the lineup changes each week."
  - type: prose
    title: How a night works
    dropcap: true
    text: |-
      Joule opened in **1999** next to Triangle Park in Amerikamura, moved to its current building in 2009 and was refurbished in 2016 (Time Out). The main dancefloor holds about **800 people**. Music changes by night: techno and house most often, with hip-hop and reggae nights between them.

      Prices depend on the party. The Wednesday techno night is ¥2,000. For a bigger weekend name, expect about ¥3,000 in advance or before midnight and ¥4,000 at the door (GOODLIFE, October 2026). Osaka residents get a discount with proof of address, which you won't have.

      **Getting home:** Osaka's subway runs until about midnight and starts again around 05:00. Either stay until the first train, take a taxi (20% late-night surcharge after 22:00) or walk back if your hostel is in Namba or Shinsaibashi.
