  - type: tips
    variant: insider
    items:
      - "The official site lets you book **two days ahead** and asks for a confirmation call **one hour before**; withheld numbers are refused."
      - "From 60 min, pantyhose come free (black or beige); the English page gives them free to overseas guests anyway."
      - "Osaka's store-based shops can't open from **midnight to 06:00** (Fuzoku Concierge): plan it before the Ado show, not after."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** the 1956 Anti-Prostitution Law bans prostitution (intercourse) but sets **no penalty** for the act itself; it punishes soliciting, procuring, providing a place. Fashion health sells non-coital services under the entertainment business law. Asking for intercourse breaks the rules."
      - "**Enforcement, 2025:** Tokyo police made Japan's first arrests at a shop aimed at foreign tourists, a Kabukicho men's esthe, in Feb 2025 (operator and six men; no customers reported charged). Stick to notified shops like this one."
      - "**Touts:** Osaka City bans touting in parts of Minami and still names violators in Dotonbori (2026). Fuzoku Concierge says store shops may not tout: anyone offering health on the street doesn't work for one."
      - "Two price lists: the English page is ¥10,000 dearer for 60 min than a phone booking. Confirm the total before you go."
