blocks:
  - type: hero
    image: shopfront
    caption: "The shopfront on a Nishi-Shinsaibashi side street, from the shop's access guide"
    focus: "38% 50%"
    hook: "A suit, pantyhose and a pretend office: Osaka's take on the role-play room, one theme done properly."
  - type: quick_facts
    time_needed: "60 min session"
    best_time: "Afternoon, before an Ado night"
    extra:
      - { label: Slot, value: "Sat 30 / Sun 31 Jan", detail: "Daytime before the Ado shows, or free Mon 1 Feb; shuts 23:59" }
      - { label: Type, value: "Imekura (image play)", detail: "A store-based fashion health with an office theme; not a soapland" }
      - { label: Language, value: "Japanese, or English page", detail: "English, Chinese and Korean speakers registered (English page)" }
  - type: highlights
    items:
      - title: The office as a set
        text: "The shop's concept is the **office lady (OL)**: the women wear suits and pantyhose, and the Japanese site calls it office-romance **image play (イメクラ)**. It's the closest thing in Osaka to Bangkok's themed role-play rooms, with one theme done well."
      - title: Foreigners welcome, in writing
        text: "The shop's English page on YOASOBI HEAVEN is headed **\"Foreign visitors are welcome\"**, lists English, Chinese and Korean speakers, and gives **free pantyhose to guests from overseas**. Wikipedia notes many Japanese shops refuse foreigners outright."
      - title: Rare and legal
        text: "Osaka bans new store-based health shops across the prefecture; the ones still open were notified before the ban, and one booking listing showed only **about 15** in Oct 2026. Club Ash is a store-based shop still operating: you go to the shop, not a hotel."
      - title: Card OK, no fee
        text: "The official site takes **all major credit cards** and says it charges **no card fee** (0%). It's a 3–5 min walk from Namba Station, Exit 25."
  - type: gallery
    images:
      - { file: front-night, caption: "The building lit up at night" }
      - { file: reception, caption: "The front desk inside the entrance" }
  - type: prose
    title: What you're paying for
    dropcap: true
    text: |-
      **Fashion health** is a store-based fūzoku type: Wikipedia calls these shops notionally massage parlours, and they sell non-coital services. **Imekura** ("image club") adds a scenario. Club Ash's is the office: she plays the office lady, and the Japanese site sells the pantyhose as part of the act.

      The official site says phone bookings pay the regular price: **¥20,000 for 60 min** (about R$715), or **¥15,000** from 06:01 to 09:59. The English page charges **¥30,000** for the same hour; Fuzoku Concierge, a paid booking service, found that split at five Osaka shops and says to ask which price applies. Either way it's a splurge, four days or more of your Japan "everything else" budget. Its case: a real Osaka store, a clear theme, and a free afternoon on Sat 30 or Sun 31 Jan before the Ado show, or Mon 1 Feb.
