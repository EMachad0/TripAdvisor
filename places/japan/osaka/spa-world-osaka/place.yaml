    note: "From **Dobutsuen-mae Exit 5** or **JR Shin-Imamiya East Exit**. It's in Shinsekai, so dinner and the bath are one evening."
  - type: tips
    variant: insider
    items:
      - "Leave before **midnight** to avoid the ¥1,450 late surcharge, or stay all night and treat it as a cheap bed."
      - "No tickets or coupons needed, per the official FAQ. Just walk in."
      - "Make it the second half of a Shinsekai evening: kushikatsu first, then a long soak."
  - type: tips
    variant: pitfalls
    items:
      - "**Tattoos are banned** (including tattoo ink and seals). The rules say anyone breaking them may be asked to leave."
      - "No outside food or drink, and you can't use the baths **drunk**. Go easy on the beers at dinner."
      - "The baths close **08:45–10:00** every morning for inspection, so you can't arrive or stay through that window."
