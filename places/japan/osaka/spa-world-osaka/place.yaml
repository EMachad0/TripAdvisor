blocks:
  - type: hero
    image: building
    focus: center
    caption: "The Spa World building in Shinsekai. No free photos of the baths themselves exist"
    hook: "A whole building of hot-spring baths in Shinsekai: Roman-themed baths on the 4th floor, a Bali bath on the 6th."
  - type: quick_facts
    time_needed: 2–3 h, or overnight
    best_time: Weeknight after work, before midnight
    extra:
      - label: Tattoos
        value: Not allowed
        detail: Any size, ink or seals; official rule
      - label: Included
        value: Towels, shampoo, loungewear
        detail: Bring nothing for the baths
      - label: Late surcharge
        value: +¥1,450 for 24:00–05:00
        detail: ¥1,300 late fee + ¥150 bathing tax
  - type: highlights
    items:
      - title: Two worlds of baths
        text: "The **European zone** has Roman, Greek and Spanish-themed baths. The **Asian zone** has Japanese, Persian and Bali ones. Each is men-only or women-only for a month, then they swap."
      - title: Cheap for what you get
        text: "**¥1,500** any day for the baths, with towels, shampoo and loungewear included."
      - title: Open almost all night
        text: "Baths run **10:00 to 08:45 the next morning**. Stay past midnight and you pay an extra ¥1,450."
      - title: More than baths
        text: "Pools with water slides, darts, ping-pong, karaoke and billiards (extra fees), plus a food court open until **01:00** (03:00 on Fri, Sat and holiday eves)."
  - type: prose
    title: How it works
    dropcap: true
    text: |-
      Walk in, no ticket needed. Staff may ask to see your wristband, and everyone pays at the machines when leaving, even if you bought nothing extra. The homepage shows which zone is men's and which is women's this month; it swaps monthly.

      The **pools** on the 8th floor need a **swimsuit** (rent one for ¥650). The pool ticket costs more (¥2,000 on weekdays) and the pools close at 19:00 on weekdays, so on a work night, just do the baths.

      The rule that matters most for foreigners: **no tattoos** of any size, *including tattoo seals*, per the official regulations. If you have ink, this one isn't for you.
