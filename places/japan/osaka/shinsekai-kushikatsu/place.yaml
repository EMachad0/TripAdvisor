    variant: insider
    items:
      - "Bring **cash**. The main shop doesn't take cards."
      - "Queue too long? Try Daruma's **Janjan branch** (bookable for 2+) or the Tsutenkaku branch. Same opening hours."
      - "Make it a work-week evening: kushikatsu, a lap of the neon streets, then a bath at **Spa World** in the same neighbourhood."
  - type: tips
    variant: pitfalls
    items:
      - "**Don't double-dip.** Use the cabbage to scoop more sauce over your skewer."
      - "\"Daruma Shoten\" (だるま商店) is **not** Daruma. The chain posted a notice that it has nothing to do with this look-alike izakaya in Shinsekai and Namba."
      - "Everyone must order at least one drink. It's the house rule, so add it to your budget."
