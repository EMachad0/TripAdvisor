  - type: highlights
    items:
      - title: Where kushikatsu began
        text: "Daruma's founder opened in **1929** on the site of the old Luna Park amusement park. The menu then had two skewers: beef and potato."
      - title: Cheap, one stick at a time
        text: "Most vegetable, egg and cheese skewers are **¥143**, the original beef **¥154**. Order a few, then a few more."
      - title: The sauce rule
        text: "The sauce pot is shared, so **no double-dipping**. Dip once, then scoop more sauce over with the free cabbage."
      - title: Shinsekai after dark
        text: "The neighbourhood was laid out in **1912**, half modelled on Coney Island, around Tsutenkaku tower. Janjan Yokocho, a 130 m alley of about 50 shops, is part of it."
  - type: prose
    title: How to order
    dropcap: true
    text: |-
      Sit at the counter, order a drink (it's required) and start with **Set No. 3**: nine skewers plus a bowl of doteyaki, Osaka's beef tendon stewed in miso. The set has the original beef, shrimp, quail egg, asparagus, mochi, pork cutlet, chicken meatball, cheese chikuwa and a sausage.

      Then add singles. In January the menu has winter-only skewers: **oyster**, **fugu** (puffer fish) and **Omi duck with green onion**. If you're full, stop; if not, the Kobe beef skewer is ¥748.

      The main shop has only 12 seats and takes no bookings. If the queue is long, Daruma's **Janjan branch** nearby has the same hours and takes reservations for two or more, and there's a Tsutenkaku branch too.
