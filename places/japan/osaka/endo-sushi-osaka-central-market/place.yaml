hours:
  summary: "Mon–Sat from about 6:00 (6:15 in 2026 reviews) to 14:00. On busy days the queue is cut off around midday."
  closed: Sundays and national holidays
  winter: "The market's official 2027 calendar closes it on Sun Jan 24 and Jan 31, and also on Wed Jan 20, Wed Jan 27 and Wed Feb 3. The shop's own site lists only Sundays and holidays, so on those Wednesdays call 06-6469-7108 before going. Safest days: Mon, Tue, Thu, Fri, Sat."

