confidence_note: "Hours, closed days, menu and history come from the official site, and Retty reviews show it open in Aug 2026. Plate price: ¥1,500 in a June 2024 blog. A May 2026 Retty review (7 plates and 2 soups for about ¥12,000) points to about ¥1,600–1,700, so ¥1,650 is an estimate. Cash only is from the 2024 blog. Unknown: whether the shop opens on the market's Wednesday closed days."
