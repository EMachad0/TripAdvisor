blocks:
  - type: hero
    image: market-gate
    caption: "A gate of Osaka's Central Wholesale Market. No free photo of the restaurant exists"
    hook: Four generations of the Endō family have served market workers here since 1907.
  - type: quick_facts
    time_needed: 1–2 h with queue
    best_time: Weekday, 6:15
    extra:
      - { label: Pay, value: Cash only, detail: Per a 2024 visit report }
      - { label: Seating, value: 45 min, detail: Per a 2026 Retty review }
      - { label: Queue, value: Up to 1 h, detail: "From a Retty review posted May 2026" }
  - type: highlights
    items:
      - title: Tsukami-zushi, "grabbed" sushi
        text: "The rice is cooked and used **hot**, without cooling. It's grabbed lightly instead of pressed, so it falls apart in your mouth. The official site calls this the house signature."
      - title: Jō-maze, plate by plate
        text: "Each plate brings **5 seasonal pieces**, and you order the next when you're ready. Retty reviewers say about **4 plates** cover the full range of toppings."
      - title: Brush your own soy
        text: "Soy sauce comes with a **brush**, so you paint each piece yourself (2026 Retty review)."
      - title: A real market morning
        text: "The official site says it began in **1907** at Osaka's old Zakoba fish market and moved into the new Central Market when it opened in **November 1931**. Four generations later, it's still there."
  - type: menu
    title: "The order"
    items:
      - { name: "Jō-maze (chef's 5-piece plate)", name_local: 上まぜ, price_local: 1650, price_brl: 58.03, note: "≈¥1,600–1,700 in 2026 (¥1,500 in 2024). Order more plates as you like, or pick your own 5", tag: signature }
      - { name: Horse-mackerel bar sushi, name_local: あじ棒, note: "Made the same way since the shop opened" }
      - { name: Conger eel, name_local: 穴子, note: "The other house classic named on the official site" }
      - { name: Red miso soup with clams, name_local: 赤だし, note: "Shijimi clam and blended miso, the house recipe" }
    note: "The jō-maze price is worked out from a May 2026 bill. A 2017 blog listed the soup at ¥300 before tax, so check the board for current prices."
  - type: cost_breakdown
    items:
      - { label: "First jō-maze plate (5 pieces)", local: 1650, brl: 58.03, estimate: true }
      - { label: "Second plate (10 pieces in all)", local: 1650, brl: 58.03, estimate: true }
      - { label: "2 more plates for the full range of toppings", local: 3300, brl: 116.06, optional: true, estimate: true }
    note: "Cheapest way in: **one plate plus the akadashi soup**, about ¥1,650 plus the soup. That's still almost 2× a ¥900 meal, so make this your one sushi breakfast in Osaka, not a daily habit."
  - type: map
    note: "Enter the market grounds. The official site says you'll see a **big clock** in front of you as you enter. Its map marks the restaurant's building from there."
  - type: tips
    variant: insider
    items:
      - "Arrive at **opening**. A reviewer turned up at 6:15 on a Friday in July 2026 and walked straight in."
      - "Bring **cash**. A recent visit report says cards aren't accepted."
  - type: tips
    variant: pitfalls
    items:
      - "Don't go late. One visitor found the queue already closed at **12:15**."
      - "The **Kyōbashi** branch some guides list closed in February 2025. Go to the market shop."
  - type: weather
    temp_low_c: 3
    temp_high_c: 9
    conditions: Cold and mostly dry; still dark at opening
    note: "You may queue outdoors before sunrise, so dress warm. Inside, the hot rice helps."
    wear: Warm jacket, hat and gloves for the queue
