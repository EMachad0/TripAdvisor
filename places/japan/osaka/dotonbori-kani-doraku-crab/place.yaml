  - type: highlights
    items:
      - title: The crab itself
        text: "Wikipedia: a **6.5-metre** mechanised crab that moves its arms and eyestalks. The first was built in **1960**; the current one went up in 1996."
      - title: You've walked here before
        text: "SEGA's Yakuza series turned Dotonbori into **Sotenbori**, the Omi Alliance's turf. Stand on the bridge and it feels like a save point."
      - title: Glico Man, next door
        text: "The Glico running man has stood just west of Ebisubashi since **1935**. Today's sixth version is LED, installed in 2014. It's the classic Osaka photo."
      - title: Eat until you drop
        text: "Dotonbori is the home of Osaka's *kuidaore* food culture: takoyaki, okonomiyaki, kitsune udon. Otakoya has sold takoyaki here since 1972."
  - type: prose
    title: How to do it
    dropcap: true
    text: |-
      Come after dark. Walk onto **Ebisubashi** (the bridge), take the Glico Man photo looking west, then cross to the south end. The crab hangs over the door of Kani Doraku's flagship, right at the foot of the bridge.

      Dotonbori has been Osaka's entertainment street since 1621. By 1662 it had six kabuki and five bunraku theatres. Today the canal runs between walls of signs, and the bridge is still the meeting point. Foreigners call it *nanpa-bashi*, the pick-up bridge.

      Want to eat the crab too? Kani Doraku's 300-seat flagship serves crab set lunches until 16:00. The cheapest, **Hoshi**, costs ¥3,740 with crab tempura, crab sushi and chawanmushi. The full courses on the regular menu start at ¥6,600. Card and QR payment are accepted.
