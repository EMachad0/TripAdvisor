blocks:
  - type: hero
    image: counter
    caption: "The pale-wood counter and shoji-screened private rooms under bare concrete"
    focus: "70% 50%"
    hook: "Red rice for the tuna, white rice for the bream. Two cities' sushi traditions on one counter."
  - type: quick_facts
    time_needed: 2 h seating
    best_time: Weeknight dinner
    extra:
      - { label: Course, value: "10 nigiri + 4 dishes", detail: "Plus grill, hand roll, red miso soup, egg, fruit (¥11,000)" }
      - { label: Solo, value: "Yes, counter", detail: TableCheck takes a party of 1 }
      - { label: Out of place?, value: A little, detail: "Michelin: good for solo dining. The site asks for smart casual" }
  - type: highlights
    items:
      - title: Why go over the R$170 day
        text: "At **R$389** (≈2.3 days of budget) this is one of four Osaka sushi counters on Michelin's **Bib Gourmand** list in the current **Kyoto-Osaka 2026** guide. A full omakase with appetisers, a grilled dish and ten nigiri, at an 8–10 seat counter."
      - title: The two rices
        text: "**Red** vinegar rice, the Edomae style, for tuna and blue fish; **white** rice with rice vinegar and sugar, from Osaka's pressed-sushi tradition, for white fish and shrimp (official site)."
      - title: Relaxed, with one rule
        text: "8–10 counter seats and two small semi-private rooms. The site asks for **smart casual**, so pack one neat outfit for this night."
      - title: What locals say
        text: "Only **3.43 on Tabelog** from 121 reviews, so locals rate it as good value rather than a destination. Michelin is the stronger signal here."
  - type: gallery
    feature: false
    images:
      - { file: starters, caption: "The opening tray of small appetisers" }
      - { file: shrimp-nigiri, caption: "Kuruma-ebi nigiri on the counter" }
      - { file: uni, caption: "Sea urchin and salmon roe over rice" }
  - type: book_ahead
    steps:
      - days_before: 3
        text: "On TableCheck choose **party of 1**, a weeknight, and the **¥11,000 course** (or ¥15,400 for the special fish and premium grill)."
      - days_before: 2
        text: "Last chance: the ¥11,000 course must be booked **at least 2 days ahead**."
      - days_before: 0
        text: "Arrive on time: the seat is held only **15 minutes** past your booking, and the meal is capped at 2 hours."
  - type: menu
    title: The courses (tax included)
    items:
