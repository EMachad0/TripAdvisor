      - title: 600+ games, free
        text: "GaijinPot counts **over 600 games** to play at no charge, from arcade Donkey Kong and Mario Kart 64 to co-op PC games, with no time limit."
      - title: Real hardware on the bar
        text: "Famicom, Super Nintendo, N64, Mega Drive, Saturn, Dreamcast, PlayStation and Xbox are listed across reviews, with Western and Japanese versions of games."
      - title: The décor
        text: "A 2018 visit describes LED **Space Invaders** on the stairs, arcade boards on the walls and a bar counter shaped like the **Famicom** logo."
      - title: Where you meet people
        text: "Run since 2011 by an American owner, the crowd is mixed locals and travellers; a September 2026 review recommends it for **solo travelers**."
  - type: prose
    title: Why this game bar
    dropcap: true
    text: |-
      Osaka has dozens of game bars, and GaijinPot says the owner prides himself on being the one without a cover charge. **Space Station** opened in 2011 as one of the first in the city and runs on a simple deal: buy a drink and play anything on the shelf.

      It's small: one recent review notes the room is tight, which, as that reviewer says, makes it easy to make friends with your neighbour. Arrive early if you want a particular console.
