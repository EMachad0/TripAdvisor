  - type: hero
    image: super-potato-entrance
    caption: "Mario guards the door of Super Potato's Osaka store (2017)"
    focus: "30% 50%"
    hook: "Osaka's answer to Akihabara, on two parallel streets: carts, game soundtracks and classic fighting-game cabinets."
  - type: quick_facts
    time_needed: 2–4 h
    best_time: "From 12:00, any day"
    extra:
      - label: Entry
        value: Free to browse
        detail: Pay only for what you buy or play
      - label: Layout
        value: Sakaisuji + Ota Road
        detail: "Two parallel streets, all three stops within about 10 min"
      - label: Good in cold
        value: Yes, mostly indoors
  - type: highlights
    items:
      - title: Super Potato on Ota Road
        text: "Super Potato calls its Otaroad store a **retro-game specialist** with the biggest stock in western Japan, from Famicom and Mega Drive to PC-Engine, Neo Geo and Virtual Boy, plus a dagashi (old-school sweets) corner."
      - title: Game Tanteidan
        text: "*Game Detectives* has been in Nipponbashi since **2000**. Walls of software, and its own speciality: **game soundtrack CDs**, strategy guides and doujinshi."
      - title: Fighting games at Athena
        text: "Athena's own site lists a capsule-toy shop on 3F and a **classic fighting-game corner on 5F–6F**, open **9:00–24:00** every day; the 2025 article adds prize games on 1F–2F."
      - title: Less crowded than Akihabara
        text: "Inside Osaka's guide says Den Den Town sees less foot traffic than Akihabara, and the shops sit on two easy parallel streets."
  - type: gallery
    images:
      - { file: super-potato-front, caption: "Super Potato Retro-kan on Ota Road, under the Surugaya sign at the Hirata Building" }
      - { file: sakaisuji, caption: "Sakaisuji, the main street through Den Den Town (2023)" }
  - type: prose
    title: How to do it
    dropcap: true
    text: |-
      Den Den Town (from *denki no machi*, "electric town") runs about a kilometre along **Sakaisuji**, with more than 150 shops; **Ota Road**, one street west, is where the anime, figure and game shops cluster.

      Start at **Super Potato** on Ota Road, walk south to **Game Tanteidan** well before 18:45 (its 2020 notice; a 2025 article says 19:00), then finish at **Athena** at the north end of Ota Road, which its own site says is open until midnight every day. If you only buy one souvenir, a soundtrack CD from Game Tanteidan fits in a backpack better than a boxed console.
  - type: quote
    variant: vibe
    text: "A wall of Famicom carts, game soundtracks on CD, and classic fighters on an arcade's top floors."
  - type: cost_breakdown
    items:
      - label: Browsing all three
        local: 0
        brl: 0
      - label: "A few arcade credits at Athena (your budget)"
        local: 500
        brl: 17.59
        estimate: true
        optional: true
  - type: map
    zoom: 16
    note: "Pin: **Super Potato** on Ota Road. **Game Tanteidan** is at 5-7-18 Nipponbashi (大阪市浪速区日本橋5-7-18), a few blocks south. **Athena** is at 2-1-22 Namba-naka (浪速区難波中2-1-22), at the north end of Ota Road."
  - type: tips
    variant: insider
    items:
      - "Game Tanteidan closes earliest (**18:45** per its 2020 notice), so go there first. Athena stays open until **24:00**, so leave it for last."
      - "Super Potato opens an hour earlier (10:00) on weekends."
  - type: tips
    variant: pitfalls
    items:
      - "Retro carts are region-locked to Japanese consoles: check that what you buy will run on what you own back home."
      - "Inside Osaka warns that shop labels are mostly Japanese; a translation app helps."
