  - type: tips
    variant: insider
    items:
      - "Standing bars usually skip the **otoshi** (a small compulsory starter charged at most sit-down izakaya)."
      - "Carry **cash**, ideally small notes. Smaller spots don't take cards."
      - "Tenma is on the **Osaka Loop Line**, so it's easy to reach after work from most of the city."
  - type: tips
    variant: pitfalls
    items:
      - "Sit-down izakaya often add an **otoshi** you didn't order. It's normal, not a scam."
      - "Some bars allow smoking. If that bothers you, look in before you commit."
