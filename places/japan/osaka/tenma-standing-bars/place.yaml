  - type: highlights
    items:
      - title: Osaka's cheap-drinking quarter
        text: "Japan-guide calls Tenma a \"bustling nightlife quarter\": a maze of narrow alleys north of the station with hole-in-the-wall bars near the station and smarter places further out."
      - title: Standing-bar prices
        text: "At Tachinomi Shomin, a draft beer or highball is **¥350** and dishes top out around **¥500**, per Time Out (Jul 2026)."
      - title: Made for a solo evening
        text: "A standing bar takes about **half an hour**. Have a drink and a plate, then move to the next one. Easy to do on your own."
      - title: Longest shopping arcade in Japan
        text: "Tenjinbashi-suji, a covered arcade of **more than 2 km**, runs right by Tenma. Walk it before the bars get busy."
  - type: prose
    title: How to bar-hop Tenma
    dropcap: true
    text: |-
      Get off at **JR Tenma** on the Loop Line and go out the north side. The alleys start right there. Look in: if there's a counter, a handwritten menu on the wall and room to stand, go in.

      Order a beer or highball, then point at one or two small plates. When the glass is empty, pay and walk to the next place. The osakatourism.org guide names **Gifuya**, under the JR tracks, as a classic, and calls Thursday the sweet spot.

      Expect smoke at some places, noise and very little English. That's the appeal: the guides describe it as working-class and unpretentious, not a tourist street.
