    temp_low_c: 3
    temp_high_c: 10
    conditions: Cool, windy on the water, dry days common
    note: "Wakayama averages 2.9–9.8 °C in January (Wikipedia, 1991–2020) with about 7 wet days. You'll be outdoors all day, and the ferry deck and cliffs catch the wind."
    wear: Windproof jacket, hiking shoes, gloves
