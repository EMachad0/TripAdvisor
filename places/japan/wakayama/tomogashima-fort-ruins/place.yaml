      - { label: "Nankai train Namba–Kada, return", local: 1920, brl: 67.39, estimate: true }
  - type: map
    zoom: 13
    note: "The pin is the island's ferry pier and information centre. **Kada port** is on the mainland across the strait, a 20-min walk from Kada station."
  - type: tips
    variant: insider
    items:
      - "Take the **09:00** boat if you can: from the second sailing, numbered boarding tickets are handed out and can run out early."
      - "Bring a **flashlight** (or a phone light) for the Third Battery's tunnels."
      - "Buy lunch and water near Kada station before boarding. The island has only a small refreshment stand by the pier."
  - type: tips
    variant: pitfalls
    items:
      - "**No weekday ferries in January.** Plan it for Sat Jan 9, Sun 10, Mon 11 (holiday), Sat 16 or Sun 17."
      - "Boats are cancelled in bad weather. Check the operator's daily notice on the morning you go."
      - "Don't miss the **16:30** last boat back in winter. There's no other way off."
      - "Some ruins are unlit and slippery, and the Fourth Battery is overgrown and unsafe. Wear proper shoes."
