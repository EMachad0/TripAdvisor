blocks:
  - type: hero
    image: arsenal-ruin
    focus: center
    hook: Brick tunnels and gun pits, abandoned after WWII and slowly swallowed by the forest.
  - type: quick_facts
    time_needed: Full day
    best_time: "Sat/Sun/holiday, 09:00 boat"
    extra:
      - { label: Ferry, value: "20 min, ¥2,800 return", detail: "Only Tomogashima Kisen; no advance booking" }
      - { label: Last boat back, value: "16:30", detail: "Winter timetable, Jan–Feb" }
      - { label: Bring, value: "Flashlight, food, water", detail: "Tunnels are pitch black; few shops on the island" }
  - type: highlights
    items:
      - title: The Third Battery
        text: "The largest and most open ruin: tunnels and ammunition chambers you can walk through, deep in the island's forest. Japan Guide calls it the most extensive and freely explorable."
      - title: Off the map for decades
        text: "In **1888** the island became a military site and was removed from civilian maps. The army kept the public out until the end of WWII; then the forts were abandoned."
      - title: An 1872 lighthouse
        text: "The lighthouse at the western tip dates from **1872** and still works. The First Battery beside it is reached through a tunnel."
      - title: Anime island
        text: "Wikipedia links Tomogashima to Hitogashima, the island in the manga and anime *Summer Time Rendering*."
  - type: prose
    title: How the day works
    dropcap: true
    text: |-
      Leave Namba early. Take the Nankai line to **Wakayamashi** (about 1 hour by limited express) and change to the little **Kada line** (about 25–30 min). From Kada station it's a 20-minute walk to the port. The ferry takes 20 minutes.

      In January the boat only sails on **weekends and holidays**, at 09:00, 11:00, 13:00 and 16:00 from Kada. Come back on the 13:30 or the last boat at **16:30**. A loop of the sights takes about three hours at an easy pace, with some steep, uneven stretches. Pass the Second Battery (roped off, partly collapsed), the lighthouse and First Battery, the navy listening post on the southwest cliff, and the big **Third Battery**.

      It isn't a ghost *town*. It's the closest thing on the Osaka side: a whole island of military ruins you're allowed to walk into, a short ferry from the mainland.
