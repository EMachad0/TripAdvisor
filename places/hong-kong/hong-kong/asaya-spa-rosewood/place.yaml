    steps:
      - { days_before: 2, text: "Call **+852 3891 8588** or email the spa (address above); ask for the Imperial Relaxing Massage and whether you can choose your therapist." }
      - { days_before: 2, text: "Give a **credit card** to confirm. Changes inside 24 hours cost the full price." }
      - { days_before: 0, text: "Arrive **30–45 min early** at the 6th floor of the Rosewood for the consultation and the sauna." }
