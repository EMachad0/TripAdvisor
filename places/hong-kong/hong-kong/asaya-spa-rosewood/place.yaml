    title: Massages (official menu, Fri–Sun and holidays)
    items:
      - { name: "Imperial Relaxing Massage, 60 min", price_local: 2280, price_brl: 1690.62, note: "Signature; 90 min HK$2,780" }
      - { name: "Muscular Energy (men's menu), 60 min", price_local: 2280, price_brl: 1690.62, note: "90 min HK$2,780" }
      - { name: "Deep Muscular Massage, 60 min", price_local: 2580, price_brl: 1913.07, note: "90 min HK$3,080" }
      - { name: "Intensive Body Therapy, 120 min", price_local: 3380, price_brl: 2506.27, note: "Scrub plus massage" }
    note: "Mon–Thu prices are HK$300 lower, but every day of your stay is Fri–Sun or a public holiday. Add 10% service charge."
  - type: map
    note: "In the **Rosewood Hong Kong** at Victoria Dockside, on Salisbury Road by the harbour; the spa is on the **6th floor**."
  - type: tips
    variant: insider
    items:
      - "Every day of your stay is billed at the Fri–Sun rate, so the day doesn't change the price. Only **Fri 5 Feb** isn't a general holiday (GovHK counts every Sunday), but you land at 17:15 and the spa shuts at 22:00."
      - "Bring swimwear or shorts for the sauna and steam: the etiquette section of the menu recommends them."
      - "The swimming pool is shut until 10 Mar 2027; don't plan around it."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** buying sex from an adult isn't a crime in Hong Kong; premises used by 2+ people for it are vice establishments (Crimes Ordinance s.117(3), s.139). This is a massage menu only; asking for more would be out of line."
      - "**Therapist:** a spa without a Cap. 266 licence may only give full-body massage by a therapist of the **same sex** (s.3(f)). We couldn't check Asaya's licence, so ask who will do your massage when you book."
      - "**Cancellation:** within 24 hours or a no-show is charged **100%** (menu)."
      - "The price on the menu isn't the total: add **10% service charge**."
