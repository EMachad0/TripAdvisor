  - type: hero
    image: treatment-room
    caption: "An Asaya treatment room: marble basin, massage beds and a soaking tub behind the screen"
    hook: "No legal nuru house exists in Hong Kong. The honest splurge: a sense-led oil ritual six floors above the harbour."
  - type: quick_facts
    time_needed: "60 or 90 min treatment"
    best_time: "Any day, 09:00–22:00"
    extra:
      - { label: Slot, value: "Fri 5 Feb evening", detail: "The one non-holiday day; land 17:15, spa open to 22:00" }
      - { label: Before you go, value: "Arrive 30–45 min early", detail: "For the consultation, then sauna and steam (menu)" }
      - { label: Licence, value: "Not verified", detail: "No public register; it decides the therapist's gender (Pitfalls)" }
  - type: highlights
    items:
      - title: Guerlain's signature massage
        text: "The **Imperial Relaxing Massage** pays tribute to Eau de Cologne Impériale; Guerlain's own menu says it \"arouses all the senses\". 60 min HK$2,280, 90 min HK$2,780 at the weekend and holiday rate."
      - title: A private bath, if you want one
        text: "Add **30 minutes of private bath** in a 6/F treatment room for HK$980, or in a **7/F Spa Duet Suite** for HK$1,980 (menu add-ons)."
      - title: Sauna and steam first
        text: "The spa page lists a **Relaxation Sanctuary** with sauna, steam room and vitality pool, and the menu asks you to come **30–45 min early** to use it."
      - title: Clear rules
        text: "Published prices, a 10% service charge, a credit card to hold the slot, and a **100% charge** if you cancel within 24 hours. No surprises in the room."
  - type: gallery
    images:
      - file: level-7-bath
        caption: "A 7/F Spa Duet Suite: the stone bath and its private terrace"
      - file: double-treatment
        caption: "A massage in an Asaya double treatment room (Rosewood's photo)"
  - type: prose
    title: Why a hotel spa is on this list
    dropcap: true
    text: |-
      Hong Kong licenses every place where a man gets a full-body massage from a woman (Cap. 266 s.3), and the police licensing guide is strict: a see-through window in each massage-room door (paras 2.1–2.3), doors never locked (1.5), no dimmers (3.2), and no vice on the premises (Annex H). That's why no legal Bangkok-style nuru or role-play spa exists here. The one online "nuru" menu we found listed no address and no licence, so it is out.

      What's left at the top end is luxury: a Guerlain ritual in the Rosewood, with steam, sauna and an optional private bath. It is **not** sexual, and the menu treats it as wellness. It is also expensive: the 60-minute massage with service is **HK$2,508, about R$1,860**, more than 15 days of your R$120 budget. That's over the "no crazy spending" line unless this is your one splurge in Hong Kong.
