        text: "**酥皮焗叉燒包**: a crackly, sweet crust over sticky barbecue pork. Every source names it first; HK$35 for three in 2025."
      - title: Dim sum made to order
        text: "MICHELIN counts 20-plus dim sum here, some swapped every two or three months. Its picks: har gow, the baked buns and tangerine-peel beef balls."
      - title: Michelin, cheaply
        text: "The chain won a star within a year of opening in 2009. This shop is on MICHELIN's current Hong Kong **Bib Gourmand** list."
