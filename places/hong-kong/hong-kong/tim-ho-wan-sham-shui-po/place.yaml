        text: "Take a number at the self-service machine at the door. It sorts parties by size, with a separate queue for 1–2 people."
  - type: prose
    title: From star to Bib
    text: |-
      Tim Ho Wan opened in 2009 as a 20-seat shop in Mong Kok. Within a year it had a Michelin star, and the press called it the world's cheapest Michelin-star restaurant. It now has branches in Hong Kong, mainland China, Singapore and the US, and the Fuk Wing Street shop in Sham Shui Po is one of its early branches.

      Today MICHELIN lists this branch as a **Bib Gourmand**, its label for good cooking at a low price, with the tags "Worth Queueing For" and "Eat like a local". Prices have risen: a 2025 visitor paid HK$35 for the buns, about HK$10 more than older menus. It is still one of the cheapest Michelin-listed meals in the city.
