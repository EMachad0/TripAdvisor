  - type: highlights
    items:
      - title: A free terrace in Central
        text: "The roof garden on **level 4** is public space. Sit on the grass or at the tables with a harbour-side view, and buy nothing: guides say you can bring your own food and drinks."
      - title: The cheapest harbour-view drink
        text: "Time Out's tip: grab drinks at the **7-Eleven in the basement** near the Airport Express and take them up. It beats paying HK$1,000+ at a rooftop bar."
      - title: Under Two IFC
        text: "The garden runs to the foot of **Two IFC**, so here you sit under the skyline instead of looking at it from Kowloon."
      - title: A Brazilian artist's New Year
        text: "For Lunar New Year 2026, ifc brought **Naíma Almeida**, from Brazil, for her Hong Kong debut: a 4 m phoenix and flock of geometric birds under the atrium dome. Free to see. The 2027 artist isn't announced yet."
  - type: prose
    title: Why a mall earns a card here
    dropcap: true
    text: |-
      ifc mall is 200-plus international brands, mostly mid-range to luxury, and you'll walk past most of them. The reason to come is upstairs. The roof garden is one of Central's few patches of grass, ringed by glass towers on one side and the harbour on the other. Time Out calls it an urban oasis for lunch and a go-to spot for late-night drinks.

      **On your dates**: Lunar New Year is Saturday Feb 6, and the public holiday runs to Tuesday Feb 9, which is also roughly your flight home. The mall sits on **Hong Kong Station**, so it's the natural last stop before the Airport Express. Some airlines let you check in and drop bags at the station from 24 hours to 90 minutes before departure (Cathay Pacific, Qantas, Singapore Airlines and a few others). If yours is one, drop your backpack and spend your last hours on the roof.
