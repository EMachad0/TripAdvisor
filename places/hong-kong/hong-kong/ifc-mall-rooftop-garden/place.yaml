  - type: map
    zoom: 16
    note: "From Hong Kong Station take **Exit F or E1** into the mall. For the roof, use the lifts near **City Super** and press **P4**."
  - type: tips
    variant: insider
    items:
      - "Take drinks up from the **basement 7-Eleven** near the Airport Express, as Time Out suggests. Clear your table when you leave."
      - "On your last day, check whether your airline does **in-town check-in** at Hong Kong Station; it's listed on the MTR site with each airline's hours."
      - "The Lunar New Year installation goes in the **Oval Atrium, Podium Level 1**. In 2026 it ran Feb 5 – Mar 3, opening about two weeks before New Year (Feb 17). The 2027 dates aren't out."
  - type: tips
    variant: pitfalls
    items:
      - "No official rooftop hours are published. Don't plan a midnight visit without checking it's open."
      - "In-town check-in covers **only the listed airlines' own flights**, not codeshares, and you need an Airport Express fare to enter."
      - "Star Ferry fares rise on **Jan 25, 2027**: up to HK$6 on weekdays and HK$8.30 at weekends. The fare on the Mon–Tue holidays (Feb 8–9) isn't stated; budget the weekend one."
