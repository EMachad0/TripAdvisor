      - { label: Licence, value: "Not checkable", detail: "No public register; it decides the therapist's gender (Pitfalls)" }
  - type: highlights
    items:
      - title: The local form
        text: "Hong Kong has no legal nuru or soapy house. What it does have is the **桑拿 (sauna)**: a bath-and-massage club where you pay once, change, and spend hours between pools, steam and a massage room."
      - title: A menu you can read first
        text: "The price page lists every item: sauna only **HK$344**, sauna + one 45-min massage **HK$456**, an extra 45 min **HK$270**, all plus 10%. Pedicure, ear cleaning and foot massage are HK$216–260."
      - title: Late-night deals
        text: "Enter between **21:00 and 01:00** and a two-massage session is **HK$598**, service charge included; after **01:00** it drops to **HK$498**. From 2026, double sessions also get a free lobby item."
      - title: Open almost all night
        text: "Google lists it open until **06:00**, reopening at 11:00, so a late arrival after a night out still works."
  - type: prose
    title: Why a sauna, and what it is not
    dropcap: true
    text: |-
      In Bangkok you got nuru and soapy houses. In Hong Kong the law draws a hard line: one person selling sex from her own flat is legal, but any premises used by **two or more** people for it is a "vice establishment", and its keeper faces up to 10 years. The police licensing guide for massage rooms asks for a see-through window in each door (paras 2.1–2.3), doors never locked (1.5) and no dimmers (3.2), and bans vice on the premises (Annex H). So the legal adult-adjacent night here is the old-school men's sauna, which is mostly a bath house: hot and cold pools, steam, a lounge, and a massage.

      This TST East branch of the 東方棕泉 group has the cheapest published **single-massage** session we found (Causeway Bay charges HK$526). For the late double-massage deals, though, the Causeway Bay branch's 2026 prices are lower: HK$538 in the discount window and HK$368 after 01:00. It is not glamorous: Google rates it **3.4 from 24 reviews**, with praise for the massage and a note that it could be cleaner. With the 10% charge the standard visit is about **R$372**, three days of your R$120 "everything else" budget, before any tip.
