  - type: map
    note: "On the **3rd floor of Hilton Towers**, 96 Granville Road; the group's other TST East venue, The Sauna & Spa, is next door at No. 100."
  - type: tips
    variant: insider
    items:
      - "Arrive **after 21:00** so the double-massage price applies; the menu says discounts go by **entry time**."
      - "Phone **2156 1133** before a holiday visit (Sat 6, Mon 8 or Tue 9 Feb): no Lunar New Year hours or surcharge are published."
      - "The site doesn't say which cards it takes. Bring cash for the tip."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** buying sex from an adult isn't a crime in Hong Kong; soliciting in public (s.147) and premises used by 2+ people for it (s.139) are. A sauna sells baths and massage; police licence terms ban vice on the premises (guide, Annex H). Its licence can't be checked (no public register)."
      - "**Raids:** police may search everyone on suspect premises (s.152). A two-week Yau Tsim Mong crackdown in Dec 2024, including a forced entry at a TST building, arrested 83, **clients among them** (Dimsum Daily). Raids target unlicensed parlours and flats (Tsuen Wan, Aug 2026)."
      - "**Tip pressure:** older Google reviews of the group's Causeway Bay branch say staff demanded a big tip and quoted more than the site. Agree the total at the desk first."
      - "Prices are **+10%** and exclude tips; the HK$598 and HK$498 deals already include the 10%."
      - "**Therapist:** a place without a Cap. 266 licence may only give full-body massage by a therapist of the **same sex** (s.3(f)); ask at the desk who does the massage."
