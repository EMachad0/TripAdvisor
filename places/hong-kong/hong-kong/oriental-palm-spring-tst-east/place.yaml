blocks:
  - type: hero
    hook: "Change into shorts, cycle the hot and cold baths and steam room, then a massage room, all on a printed menu."
  - type: quick_facts
    time_needed: "3–4 h"
    best_time: "Enter 21:00–01:00"
    extra:
