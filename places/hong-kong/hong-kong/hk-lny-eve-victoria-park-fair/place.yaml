        detail: The biggest of 14 fairs (about 1,500 stalls citywide)
      - label: Eve hours (2026)
        value: All night
        detail: Open until 07:00 on New Year's Day
  - type: highlights
    items:
      - title: The all-nighter
        text: "On New Year's Eve 2026 all 14 fairs stayed open **until 7 a.m.**, and big crowds headed to Victoria Park after dinner. In 2027 the eve is **Friday Feb 5**, your second night in town."
      - title: Flowers and junk toys
        text: "In 2026 Victoria Park had about 180 stalls of flowers and plants, 216 of dry goods (toys, decorations, gadgets) and 4 selling fast food."
      - title: Prices fall at night
        text: "On the last night stalls cut prices: in 2026, HK$150 items went three for HK$100 and two orchid pots for HK$100. One plush-toy seller let shoppers stuff a paper cup for 15 minutes."
      - title: First incense at Wong Tai Sin
        text: "Wong Tai Sin Temple reopened at **21:00** on the 2026 eve for the first-incense queue, with incense from **23:00**. It expected 20,000–40,000 people. Earlier means luckier, people say."
  - type: prose
    title: What's confirmed for 2027, and what's last year's pattern
    dropcap: true
    text: |-
      **Confirmed**: Lunar New Year's Eve is Friday Feb 5, 2027 and New Year's Day is Saturday Feb 6 (Hong Kong Observatory). The Food and Environmental Hygiene Department will run the 2027 fairs from **Jan 31 to Feb 6** at 14 sites. All 400 Victoria Park stalls were auctioned in October 2026.

      **2026 pattern, not yet announced for 2027**: daily hours (08:00 to midnight, then to 01:00 on the last weekend), the all-night eve until 07:00, the overnight MTR on the eve, and Wong Tai Sin's eve schedule (closed 16:30, reopened 21:00, incense from 23:00, open through the night).

      **A two-stop eve**: the fair after dinner, then the MTR to Wong Tai Sin to join the queue for the 23:00 first incense, then home on the all-night trains (if they run again). Or stay at the fair past midnight for the deepest discounts. Either way, this is the night Hong Kong is out on the streets.
