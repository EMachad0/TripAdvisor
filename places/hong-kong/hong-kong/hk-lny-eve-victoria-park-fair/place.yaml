  - type: cost_breakdown
    items:
      - label: Entry to the fair
        local: 0
        brl: 0
      - label: Two orchid pots at the late-night price (2026)
        local: 100
        brl: 72.19
        optional: true
    note: "Only if you want flowers for the hostel; plants are a hassle to fly home with."
  - type: map
    note: "In 2026 Causeway Bay **Exit E** led straight to the fair with one-way crowd control. Tin Hau **Exit A2** is a 3–5 min walk. Lockhart Road and East Point Road were pedestrianised on fair evenings."
  - type: tips
    variant: insider
    items:
      - "Go **after dinner** on Fri Feb 5. That's when the 2026 crowds arrived, and prices kept dropping as the night went on."
      - "For first incense: Wong Tai Sin MTR **Exit B3** for the temple. In 2026 the temple closed at 16:30 on the eve and let the queue in from 21:00."
      - "At Wong Tai Sin, leave paper offerings, candles, oil and large incense sticks at home. In 2026 there was a one-way route and no space for fortune sticks on the night."
  - type: tips
    variant: pitfalls
    items:
      - "**Many restaurants close or change hours** over the holiday. Eat before you go, or at the fair's few fast-food stalls."
      - "**Beds**: New Year nights fill up. Hostelworld wasn't selling Feb 2027 beds yet on Nov 14 (Yesinn @YMT, for one). Book the day your hostel opens those dates."
      - "Causeway Bay traffic is heavy on the eve. Take the MTR, not a taxi."
