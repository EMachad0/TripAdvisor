blocks:
  - type: hero
    image: fair-stalls
    caption: The Victoria Park fair by day in 2019; on the eve it's packed after dark
    hook: Floodlit stalls of orchids and plush toys, and half the city out shopping until dawn.
  - type: quick_facts
    time_needed: "2–3 h (all night with Wong Tai Sin)"
    best_time: "Fri Feb 5 (the eve), after dinner"
    extra:
