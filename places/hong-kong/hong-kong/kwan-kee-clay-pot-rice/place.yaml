  - type: highlights
    items:
      - title: The crust
        text: "Each claypot rice is cooked to order, so every pot comes with its own scorched layer of rice at the bottom. Scrape it out last."
      - title: White eel is the order
        text: "The **white eel and chicken** pot (白鱔滑雞煲仔飯) is the one reviewers single out. A Feb 2026 blog paid **HK$135** (about R$102)."
      - title: Fine alone
        text: "A HK$100 minimum per head is the only rule, and one pot clears it. Staff seat you at shared round tables, so a solo diner gets a seat."
      - title: Old Sai Ying Pun
        text: "Michelin notes the red sign and basic interior: a plain room on Queen's Road West, on Michelin's Bib Gourmand list for good, cheap cooking."
  - type: prose
    title: Why claypot rice in February
    text: |-
      Kwan Kee's claypot rice comes with chicken, white eel or **lap mei** (Cantonese cured meat and sausage), each cooked in its own pot. HK01's advice for skipping the queue: phone ahead or come early.

      Staff ask for your order as soon as you sit, because the rice takes long: 2026 reviews describe 25 minutes to over an hour between ordering and the pot arriving. An Oct 2026 blog puts the stir-fries and steamed dishes at about HK$70–120 each if you want a side.
