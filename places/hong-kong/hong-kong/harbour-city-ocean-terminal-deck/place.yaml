blocks:
  - type: hero
    image: deck-skyline
    caption: The Ocean Terminal Deck, with Two IFC and Hong Kong Island across the water
    hook: Walk through 2 million sq ft of shops and come out on a roof deck in the middle of Victoria Harbour.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: "From about 17:45, for the 18:15 sunset"
    extra:
      - label: Deck view
        value: 270° of harbour
        detail: Hong Kong Island, Kowloon and out to the islands
      - label: Deck hours
        value: 07:00–24:00
        detail: Free, no ticket
      - label: Size
        value: 450+ outlets
        detail: Over 2 million sq ft, plus 80+ dining outlets
  - type: highlights
    items:
      - title: A free viewing deck
        text: "The roof of the Ocean Terminal extension, designed by **Foster + Partners** (the firm behind the HSBC Main Building), sits out in the harbour with a **270°** view. No ticket, open until midnight."
      - title: Sunset into the skyline
        text: "The Tourism Board calls it a perfect sunset spot. In early February the sun sets at about **18:15**; stay on as the island's towers light up."
      - title: Scale you can get lost in
        text: "Over **2 million sq ft**, **450+ outlets** and **80+ places to eat** across Ocean Terminal, Ocean Centre and Gateway Arcade. One of the largest malls in Hong Kong, and it runs straight onto the water."
      - title: Lunar New Year displays
        text: "Harbour City dresses up for the New Year. For 2025 it built a **28 m corridor of 18 lions** with drums at the Ocean Terminal Forecourt, plus a lion photo stage in the atrium. The 2027 theme isn't out yet."
  - type: prose
    title: Why a mall earns a card here
    dropcap: true
    text: |-
      Harbour City is mostly luxury and mid-range brands, which matters little on R$120 a day. What earns it a card is the end of the walk. Follow Ocean Terminal to the extension at its tip and go up to the roof: a lawn, a 200-seat grandstand facing a performance stage, and nothing between you and Hong Kong Island but water, ferries and junks.

      **On your dates**: Lunar New Year's Day is Saturday Feb 6, and the public holiday runs to Tuesday Feb 9. In 2026 the harbour fireworks were on the second day at 20:00 and lasted about 23 minutes. If 2027 follows that pattern, that's Sunday Feb 7, but nothing is announced yet. None of the fireworks guides found mention this deck, so don't count on it being open to everyone that night.
  - type: gallery
    images:
      - file: central-skyline
        caption: Central's skyline from the deck on a grey winter day
      - file: roof-deck
        caption: The open roof deck at the tip of Ocean Terminal
      - file: forecourt
        caption: The Ocean Terminal Forecourt, where the 2025 New Year lions stood
  - type: quote
    variant: vibe
    text: Shopping bags on one side, the whole harbour on the other, and a lawn to sit on in between.
  - type: cost_breakdown
    items:
      - label: Ocean Terminal Deck and mall
        local: 0
        brl: 0
      - label: Star Ferry from Central (weekend fare, from Jan 25)
        local: 8.3
        brl: 5.99
        optional: true
  - type: map
    zoom: 15
    note: "The deck is on the roof of the **Ocean Terminal extension**, at the far end of Ocean Terminal; follow the mall signs. The Star Ferry pier is on the same waterfront."
  - type: tips
    variant: insider
    items:
      - "Come by **Star Ferry** from Central, then walk out to the deck. It's the cheapest harbour crossing, and Ocean Terminal is part of the **Symphony of Lights** buildings at 20:00."
      - "Sunset is around **18:15** on Feb 4–9. Get onto the deck 30 minutes before for a spot at the rail."
  - type: tips
    variant: pitfalls
    items:
      - "**Feb 6–9 is a public holiday** and 2027 holiday hours aren't published. Check Harbour City's site in late January before you plan around a shop."
      - "Don't plan the **fireworks night** around the deck until the 2027 arrangements are announced; watch for news in January."
      - "Star Ferry fares rise on **Jan 25, 2027**: up to HK$6 on weekdays and HK$8.30 at weekends. The fare on the Mon–Tue holidays (Feb 8–9) isn't stated; budget the weekend one."
