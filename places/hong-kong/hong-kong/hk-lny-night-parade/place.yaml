  - type: highlights
    items:
      - title: Dragons, lions and dinosaurs
        text: "In 2026 the **Chinese Martial Arts Dragon and Lion Dance** team shared the road with Cromosauro, an Italian dinosaur troupe, and two Chinese dragons. On your dates, this is the most reliable place to see a dragon dance."
      - title: Floats with local jokes
        text: "Twelve floats in 2026, including a Cathay Pacific plane, a retro McDonald's train, Labubu and Molly, and a glowing wishing tree from Lam Tsuen village."
      - title: Free from the kerb
        text: "No ticket needed: crowds line **Canton Road, Haiphong Road and Nathan Road**. The parade starts at the Cultural Centre and ends outside the Sheraton on Salisbury Road."
      - title: The lantern display at the start
        text: "The Cultural Centre Piazza, where the parade begins, hosts the free **Chinese New Year Lantern Display**. In 2026 it was paper-craft horses, lions and cheongsams, lit 18:00–23:00."
  - type: prose
    title: Is this the Lantern Festival?
    dropcap: true
    text: |-
      **No, but they belong together.** Chinese New Year is day 1 of the first lunar month (Sat Feb 6, 2027). The **Lantern Festival** (Yuen Siu, 元宵) is day 15 of the same month, **Sat Feb 20, 2027**, the night that closes the New Year season. You fly home around Feb 9, so you miss the festival itself and its lantern carnivals (in 2024 those ran Feb 20–25, around day 15).

      What you *can* see is the **Chinese New Year Lantern Display** at the Cultural Centre Piazza. In 2024 it opened 8 days before New Year and in 2026 five days before, and both years it stayed up until after the Lantern Festival. If 2027 follows that pattern, it will be lit while you're here. Nothing is announced yet.

      **2027 status of the parade**: not announced. The Tourism Board's page says it runs on the first day of the holiday. In 2026 it ran from 20:00 to 21:45 with a street warm-up from 18:00.
