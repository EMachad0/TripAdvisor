blocks:
  - type: hero
    image: parkes-street
    caption: "Parkes Street, Jordan (2023): no free photo of the noodle shop itself"
    hook: One shrimp in every wonton and noodles made in-house, served at the same Parkes Street shop for over sixty years.
  - type: quick_facts
    time_needed: 30–45 min
    best_time: Fri Feb 5 evening or Tue Feb 9
    extra:
      - { label: Pay with, value: Bring HK$ cash, detail: "Trip.com traveler posts say cash only; not confirmed by the shop" }
      - { label: Solo diner, value: Easy, detail: "Small shared tables; one bowl is a normal order" }
      - { label: LNY closure, value: Feb 6–8 shut, detail: "Days 1–3 of the Lunar New Year, per the shop" }
  - type: highlights
    items:
      - title: The Bib Gourmand bowl
        text: "Michelin lists Mak Man Kee as a Bib Gourmand and tags it **Worth Queueing For**. The basic bowl is HK$46 (about R$35)."
      - title: One shrimp per wonton
        text: "The shop says every wonton holds a whole shrimp. The broth is made from dried flounder, pork bones and luo han guo."
      - title: Only one shop, anywhere
        text: "It started as a lane-side stall, moved into 51 Parkes Street, and never opened a branch. The second generation of the Mak family runs it now."
      - title: Open until 00:30
        text: "Daily from 12:00 to 00:30 (UTC+8). That fits a late arrival from the airport, or a last meal before a midnight flight."
  - type: prose
    title: Plan around the New Year
    text: |-
      Mak Man Kee closes for the **first three days of the Lunar New Year**, as its website states. In 2027 that is Saturday Feb 6 to Monday Feb 8, three of your four full days in Hong Kong.

      That leaves two chances. On **Fri Feb 5**, New Year's Eve, you land at 17:15 (UTC+8). A bowl here before the Victoria Park fair works, as long as the shop keeps normal hours that night (I found no notice either way). On **Tue Feb 9**, the 4th day, it should be open all day, and your flight leaves at 23:55.
