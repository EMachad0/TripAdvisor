  - type: tips
    variant: insider
    items:
      - "Time it so you walk out onto the **Avenue of Stars** before **20:00** for the Symphony of Lights. The music plays there."
      - "Carrying your backpack? **Self-service lockers** are on B1 and B2, 10:00–22:00."
      - "Free Wi-Fi: join the **K11** network; there's a 30-minute free option."
  - type: tips
    variant: pitfalls
    items:
      - "Harbour-view restaurants book out for the **Lunar New Year fireworks**; in 2026 they were nearly full. Don't count on a walk-in table that night."
      - "The Symphony of Lights is cancelled on days with a **No. 3 typhoon signal** or a Red/Black rainstorm warning at or after 15:00."
