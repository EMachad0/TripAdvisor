  - type: highlights
    items:
      - title: The Opera Theatre atrium
        text: "The main atrium is dressed in **brass** around a **10-metre Gold Ball** wrapped in 285 carved glass panels, used for exhibitions and events. People come just to look up."
      - title: A mall that wants to be a museum
        text: "The Tourism Board says it bridges retail space and art gallery. About **100 creatives** worked on it, and art installations run through ten floors next to **250+ stores**."
      - title: Green walls and a glasshouse
        text: "The Tourism Board counts over **50,000 sq ft** of green walls carpeting the mall. Up top there's the **Nature Discovery Park**, a garden with a glasshouse; the official site lists it for private events, so public access isn't confirmed."
      - title: Avenue of Stars outside
        text: "It's part of the same Victoria Dockside project as the revamped **Avenue of Stars**, one of the best spots for the free **Symphony of Lights** at 20:00."
  - type: prose
    title: Why a mall earns a card here
    dropcap: true
    text: |-
      You can't afford most of what's on sale at K11 MUSEA, and that's fine. Opened in August 2019 on the Tsim Sha Tsui waterfront, it's the Hong Kong mall people visit for the building: architects KPF and around a hundred designers and artists turned ten floors into something between a gallery and a theatre. The Tourism Board lists it under architectural gems.

      **On your dates**: Lunar New Year is Saturday Feb 6 and the holiday runs to Tuesday Feb 9. In 2026 K11 had its busiest New Year week since opening, with a lion dance and harbour-view restaurants nearly full for the fireworks. The 2027 programme isn't out yet. Go on a weekday afternoon if you can (Fri Feb 5), and expect crowds over the holiday.
