  - type: highlights
    items:
      - title: Racing's biggest party day
        text: "The Tourism Board lists the day-3 races as one of the year's biggest events. In 2026 more than **98,000** people came; racegoers got free pinwheels and a set by singer Kelly Chen."
      - title: Lions in the paddock
        text: "In 2025 officials dotted the eyes of a lion dance before racing and jockeys held up New Year couplets. In 2026: lion dances, live music, photo spots."
      - title: Che Kung's pinwheels
        text: "Day 3 is **Red Mouth Day**, when you avoid visiting family and go to a temple instead. Che Kung Temple in Sha Tin was packed from opening in 2026; people spin its **fortune wheel** three times and buy pinwheels to turn their luck."
      - title: Or the Lam Tsuen wishing trees
        text: "The Well-wishing Festival in Tai Po ran from day 1 to day 15 in 2026: free entry, **HK$50** wishing placards to throw into the trees, and a 70-stall New Year market. It fits any day of your stay."
  - type: prose
    title: How a visitor gets in, and what's confirmed
    dropcap: true
    text: |-
      **Getting in**: the HKJC lists **free public-enclosure entry** as a visitor privilege for anyone 18+ with a valid travel document, so bring your passport (tourists also got in free on New Year Raceday 2025). Everyone else taps an Octopus card for **HK$10**. For trackside and the members' halls, a **Tourist Badge** costs **HK$400** on major racedays (the HKJC lists Chinese New Year Raceday as one), including two HK$50 food and drink vouchers. No flip-flops; no shorts or singlets in the members' area.

      **Confirmed for 2027**: a Sha Tin day meeting on **Monday Feb 8**, the 3rd day of New Year. **Not announced**: the New Year programme, first-race time and giveaways.

      **The day**: Che Kung Temple sits between Tai Wai and Che Kung Temple stations. From Tai Wai it's East Rail to Racecourse station, which opens only on race days. Prefer the wishing trees? East Rail further north to Tai Po Market, then KMB bus **64K** to Fong Ma Po.
