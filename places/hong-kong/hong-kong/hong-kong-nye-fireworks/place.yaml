  - type: cost_breakdown
    items:
      - label: Watching from the promenade
        local: 0
        brl: 0
    note: "Free. Harbour-view bars and cruises sell NYE packages at a big markup; the promenade has the same view."
  - type: map
    zoom: 15
    note: "The Clock Tower and Cultural Centre fill first. Once they're full, police divert people to other parts of the waterfront."
  - type: tips
    variant: insider
    items:
      - "Be on the Kowloon side by **20:00**. Late arrivals get diverted far from the water."
      - "Bring water and snacks and use the toilet before you settle. Once you're in a pen, you can't easily leave."
      - "Watch for the official **HKTB announcement** (discoverhongkong.com) in December: viewing areas, MTR arrangements and timing."
      - "Book your hostel **now** if you go. NYE nights in TST fill early."
  - type: tips
    variant: pitfalls
    items:
      - "**Some MTR exits** at Tsim Sha Tsui and East TST have closed for crowd control on past NYEs. Know a second station (Jordan, Hung Hom)."
      - "Lan Kwai Fong is closed to cars from 14:00 to 05:00 and police may hold people back when it's full. Go early or go after 01:00."
      - "Leaving Hong Kong for NYE **cuts your mainland China stay short**. You can't do Chongqing or Harbin NYE as well."
  - type: weather
    temp_low_c: 14
    temp_high_c: 20
    conditions: Mild, dry, often clear; can be windy by the water
    note: "The warmest NYE option by far. A light jacket is enough; the crowd is the hard part, not the weather."
    wear: Light jacket, comfy shoes, small bag
