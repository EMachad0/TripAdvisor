  - type: highlights
    items:
      - title: The comeback show
        text: "After last year's cancellation, the Tourism Board says NYE 2026 fireworks will be **bigger**, themed on **30 years of the Hong Kong SAR**."
      - title: The skyline as a stage
        text: "Shells go up from barges in the middle of the harbour (five of them last time). From Tsim Sha Tsui you see the whole island skyline lit up behind them."
      - title: Winter Fest all around
        text: "**Hong Kong Winter Fest** (Nov 18 – Jan 5) puts Christmas villages and light shows in Central, Tsim Sha Tsui and Causeway Bay."
      - title: Lan Kwai Fong after midnight
        text: "Hong Kong's bar quarter becomes a street party. Police close it to cars from 14:00 to 05:00 and manage the crowd on foot."
  - type: prose
    title: What happened last year, and what's known now
    dropcap: true
    text: |-
      For the countdown into **2026**, the harbour fireworks were **cancelled** after the deadly Wang Fuk Court fire in Tai Po in November 2025. Instead, the city held a countdown on the **Chater Road** pedestrian zone in Central, with a light show projected onto eight buildings and live music.

      On **Nov 10, 2026**, launching this year's Winter Fest, Tourism Board chairman Lam Kin-ngok said the year-end fireworks would return as the festival's finale, larger than before. As of today there's no official time, length or map of viewing zones. Expect the usual midnight start, and expect it to be the biggest crowd of your trip.

      **The catch for this trip**: you plan to stay in mainland China until Jan 2, with Hong Kong on Feb 4–9. NYE here means leaving the mainland by Dec 30–31 and reshuffling the route. Worth it only if fireworks rank above everything else on the China leg.
