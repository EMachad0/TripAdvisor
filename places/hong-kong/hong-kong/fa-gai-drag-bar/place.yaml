  - type: highlights
    items:
      - title: Drag every weekend
        text: "The Gay Passport lists **drag shows and live DJs on Friday and Saturday**; the rest of the week is happy hour (Tue–Thu 15:00–20:00) and dinner."
      - title: Big-name guests
        text: "It brings **RuPaul's Drag Race** queens to Hong Kong: Kandy Muse played on 6 Nov 2026 (HK$350–450, The Beat), and Lady Gagita's Art Pop Ball is on 12 Dec (HK$250)."
      - title: Liked by its regulars
        text: "**4.9 from 74 Google reviews**, the newest a month old, mostly about friendly staff, DJs and drag queens. One mentions board games on quiet nights."
      - title: Open late in Central
        text: "The bar side, **Fa Gai After Dark**, says it is open **until 4 am**."
  - type: prose
    title: The adult-adjacent night that's simply legal
    dropcap: true
    text: |-
      Hong Kong has no legal equivalent of Psyche Dream Spa: anything selling a role-play experience with sex would be an unlicensed or vice operation. What it does have, like Seoul's Rabbithole, is drag: a gay bar in Central with a stage, a DJ and queens on Friday and Saturday nights. It sells drinks and, on some nights, show tickets, nothing more.

      Your best chance is **Fri 5 Feb**, the night you land (17:15), which is the eve of Lunar New Year. **Sat 6** is New Year's Day: the bar traded through the 2026 New Year season, but its 2027 holiday hours aren't out. **Mon 8** is its weekly closed day. Check Instagram the week before for a ticketed show.
