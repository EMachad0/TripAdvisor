        value: 23 min, 31,888 shells
        detail: Eight scenes on a horse theme
      - label: Crowd (2026)
        value: "360,000+"
        detail: Police count, both shores
  - type: highlights
    items:
      - title: The second-night show
        text: "Hong Kong's New Year runs parade, fireworks, races on days 1, 2 and 3. In 2026 the fireworks were on the 2nd day at **20:00**: 23 minutes, 31,888 shells, eight scenes."
      - title: Both shores work
        text: "Time Out's picks: **Tsim Sha Tsui** (the Avenue of Stars is hard to beat), Central (Central Ferry Piers), Wan Chai (Bauhinia Square), Causeway Bay and Hung Hom. The West Kowloon Art Park is the less crowded option."
      - title: The soundtrack on the radio
        text: "In 2026 **RTHK Radio 4 (FM 97.6–98.9)** played music synced to the show. Bring earphones and a phone with an FM radio, or stand near someone who has one."
      - title: Free, and a bigger crowd than you've seen
        text: "Police counted more than 360,000 spectators in 2026. The show is free; the price is the wait."
  - type: prose
    title: What's known for 2027
    dropcap: true
    text: |-
      **Not announced yet** (as of Nov 14, 2026). Every detail here is from the 2026 show: the 2nd day of New Year at 20:00. In 2027 the 2nd day is **Sunday Feb 7**, in the middle of your five days. Watch the Tourism Board's and the government's announcements in January.

      **Not the same as the New Year's Eve fireworks.** The Dec 31 countdown show over the same harbour has its own page (linked below), but that's the Western New Year, when you're still in mainland China. This one is the Lunar New Year show, inside your Hong Kong dates.

      **How early**: in 2026 crowds were on the Tsim Sha Tsui and Wan Chai waterfronts hours before the show, one resident from 9 a.m., and police taped off the promenade ahead of the main crowds.
  - type: gallery
    images:
      - file: tst-crowd-2014
        caption: The crowd on the Tsim Sha Tsui waterfront for the 2014 show
      - file: fireworks-2026
        caption: "The 2026 show (Feb 18) seen from a hillside, high above the harbour"
  - type: quote
    variant: vibe
    text: The whole waterfront goes quiet for the first shell, then roars.
  - type: cost_breakdown
    items:
      - label: Watching from the waterfront
        local: 0
        brl: 0
    note: "Free. A harbour-view table or cruise costs money; the promenade costs nothing."
  - type: map
    zoom: 15
    note: "The Avenue of Stars and the promenade by the Cultural Centre fill first. If they're full, try the West Kowloon Art Park, a walk west along the water."
  - type: tips
    variant: insider
    items:
      - "Be on the waterfront by **mid-afternoon**. In 2026 crowds were in place hours before 20:00."
      - "Bring water, snacks and an FM radio app or earphones for **RTHK Radio 4** (97.6–98.9 MHz in 2026)."
      - "Spend the day nearby: Harbour City's Ocean Terminal deck, K11 MUSEA and the ifc rooftop all have harbour views, and their pages (linked below) cover their New Year displays."
  - type: tips
    variant: pitfalls
    items:
      - "**Roads around Tsim Sha Tsui close in phases** from the afternoon. Take the MTR; seven lines were scheduled to run more often in 2026."
      - "**Many restaurants are closed** or on short hours in the first days of New Year. Eat before you claim your spot."
