blocks:
  - type: hero
    image: fireworks-2012
    caption: The Lunar New Year fireworks over Central, January 2012
    hook: Half the city on the waterfront, the whole island skyline behind the shells, and the radio playing the soundtrack.
  - type: quick_facts
    time_needed: "Afternoon to 20:30"
