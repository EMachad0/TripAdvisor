blocks:
  - type: hero
    image: snow-ridge
    hook: "Glacier, black rock and thin air at 4,500 m, an hour above Lijiang's old town."
  - type: quick_facts
    time_needed: "Full day from Dali"
    best_time: "Morning slot, clear day"
    extra:
      - { label: Top of the cable car, value: "4,506 m", detail: "Boardwalk on to 4,680 m; the summit is 5,596 m" }
      - { label: From Dali, value: "1 h 36 min – 2 h 39 min", detail: "Train Dali → Lijiang, ¥48–80, first at 07:00" }
      - { label: The dragon, value: Just the name, detail: "No dragon carving or statue; the mountain is the show" }
  - type: highlights
    items:
      - title: "Honest note: the dragon is the name"
        text: "**玉龙** means \"jade dragon\", but nothing up here is a dragon you can see. You come for a **5,596 m** snow massif and a glacier you can stand next to. If you want real carved dragons, see the walls in [Beijing and Datong](https://en.wikipedia.org/wiki/Nine-Dragon_Wall)."
      - title: A glacier at 4,500 m
        text: "The Glacier Park cable car goes up to **4,506 m**, and a boardwalk climbs on to **4,680 m**. People carry canned oxygen (about ¥39 at the base)."
      - title: December is the season
        text: "December falls in the dry season (Nov–Mar), with the clearest views of the year, and Dec–Feb has the deepest snow. Lijiang gets about **80% of possible sunshine** in December."
      - title: Blue Moon Valley comes free
        text: "The park ticket includes **Blue Moon Valley**: milky-turquoise lakes under the peaks, along a flat boardwalk of 2–3 hours. Do it after the cable car if you still have energy."
  - type: prose
    title: From Dali, or sleep in Lijiang?
    text: |-
      A same-day trip from Dali works, but it's long. Take the **07:00** train to Lijiang, ride bus 101 or a DiDi up to the mountain, do the cable car, and catch the last bus down around 18:00. Then take an evening train back (the last one leaves Lijiang at 22:05).

      It's easier to sleep one night in **Lijiang**. Then you can take the earliest cable-car slot and still have time for Blue Moon Valley. Either way it's a vacation-days trip (before Dec 24), not one for your Dec 28–31 work nights.
  - type: gallery
    images:
      - { file: blue-moon-valley, caption: "A turquoise lake below the massif", focus: center }
      - { file: from-the-valley, caption: "The massif from the valley floor, February 2026" }
  - type: book_ahead
    steps:
      - days_before: 7
        text: "At **20:00**, seven days before, big cable-car tickets go on sale: WeChat mini-program (choose \"passport\") or Trip.com. Pick a morning slot."
      - days_before: 1
        text: "Book the Dali → Lijiang train. If you're doing it in one day, book the evening train back too."
      - days_before: 0
        text: "Bring the passport you booked with: entry is passport plus face scan."
    passport_note: "Big cable-car tickets are limited to **one purchase per ID every 90 days**, so check the date and slot before you pay."
  - type: cost_breakdown
    items:
      - { label: "Scenic-area entry", local: 100, brl: 84.89 }
      - { label: "Big cable car to Glacier Park (includes shuttle)", local: 140, brl: 118.85 }
      - { label: "Train Dali ↔ Lijiang, both ways", local: 130, brl: 110.36, estimate: true }
      - { label: "Bus 101 Lijiang ↔ mountain, both ways", local: 30, brl: 25.47 }
      - { label: "Can of oxygen at the base", local: 39, brl: 33.11, optional: true }
  - type: map
    note: "The pin is the cable car, about 30 km north of Lijiang. Bus 101 leaves from Zhongyi Market near the old town; a DiDi takes about 45–60 min."
  - type: tips
    variant: insider
    items:
      - "Buy oxygen in **Lijiang Old Town** (about ¥20) rather than at the base (¥39)."
      - "Walk slowly on the boardwalk: Lijiang is at about 2,400 m and the top is 4,680 m, a big climb in one day."
  - type: tips
    variant: pitfalls
    items:
      - "Don't count on a ticket at the window. Slots for the big cable car sell out, and the mountain is pointless without it."
      - "Keep a **spare day**: snow or wind can shut the cable car for a day."
