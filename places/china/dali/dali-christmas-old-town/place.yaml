    note: "The town itself is free. The money goes on leaving: about four to seven times Chengdu's ¥85 train. The sleeper route is cheapest because it replaces a hostel night, but it costs you the afternoon of the 25th."
  - type: map
    zoom: 16
    note: "The pin is the **Catholic church**. Its alley opens onto Renmin Road. The train station (in Xiaguan) and the airport are both well outside the old town."
  - type: tips
    variant: insider
    items:
      - "**Getting to Chongqing on the 26th**: two ways on the day, from timetables read on Nov 10. **Fly**: West Air 12:10 → 13:40, about **¥582 (R$481)**. **Direct train**: G2850, Dali 09:56 → Chongqing West 17:10, **¥530.5 (R$439)**."
      - "**Cheapest, leaving on the 25th**: C9508 at 14:52 to Kunming (17:07, ¥114), then sleeper K986 at 19:03, arriving Chongqing West at 08:03 on the 26th (hard sleeper ¥215). Total **¥329 (R$272)**, and the train is your bed."
      - "Changing in Kunming on the 26th saves almost nothing: D8662 at 07:23 to Kunming South (10:08, ¥155.5), then G2852 at 11:11 to Chongqing West (16:05, ¥369). That's ¥524.5 and one hour earlier than the direct train."
      - "These are November timetables, and on the dates I checked Ctrip showed the ¥114 seats and the ¥215 sleepers as **sold out, waitlist only**. Book the minute sales open on Dec 10, and keep G2850 or the flight as the fallback."
      - "The church courtyard has a café. It's a quiet place to sit before the bars open."
  - type: tips
    variant: pitfalls
    items:
      - "The last departures that work on the 26th are the **09:56 train** and the **12:10 flight**. The 16:00 train arrives at 23:13, after the drone show. The 17:30 flight lands at 19:00, too tight for a 20:30 show."
      - "The ¥582 West Air fare was shown with carry-on baggage only. Check the bag rules if you travel with a big backpack."
      - "Don't plan around a Christmas party. I found none announced. Bad Monkey at 59 Renmin Road is listed as Dali's longest-running foreign bar, but I couldn't confirm it's open in 2026."
      - "A 2026 guide says to skip the restaurants directly on Renmin Road and Fuxing Road, and to rent e-bikes only through Meituan or Qingju."
