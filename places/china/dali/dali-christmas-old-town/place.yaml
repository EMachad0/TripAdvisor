blocks:
  - type: hero
    image: old-town-night
    caption: "Foreigner Street (Yangren Jie) on an ordinary night in 2012, not Christmas"
    hook: Grey-tile lanes between a mountain range and a lake, loud bars after eight, and a church that looks like a temple.
  - type: quick_facts
    time_needed: "Christmas Eve + part of the 25th"
    best_time: "Dec 24 after 20:00, when the bar streets start"
    extra:
