    note: "At 1,978 m the days reach about 16 °C and the nights drop to about 3 °C. December brings about 11 mm of rain. The UV index is high (6) even in winter. Good weather for the lake by day; bring a real jacket for the bar streets at night."
    wear: "Padded or down jacket for the evening, layers and sunscreen by day"
