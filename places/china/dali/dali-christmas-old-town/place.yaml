        caption: "The church gate tower: Bai eaves with a cross on top"
      - file: church-interior
        caption: Painted beams inside the nave, looking back to the door
  - type: quote
    variant: vibe
    text: A temple roof with a cross on it, then folk guitars in a courtyard bar.
  - type: book_ahead
    steps:
      - days_before: 15
        text: "Train sales open about **Dec 10** for the 25th and **Dec 11** for the 26th. Book on Trip.com or 12306 with your passport. Flights for Dec 26 were already on sale on Nov 10."
      - days_before: 0
        text: "Leave the old town early. **Dali station** is in Xiaguan: guides give 45–90 min on bus 8 (¥2–5), so allow 1.5 h, or about 30 min by taxi (¥40–50). The **airport** is about 45 min by taxi (¥80–120)."
    passport_note: "Book and travel with the **same passport**. Station gates scan its photo page."
