        detail: "Train ¥530.5 (R$439); flight about ¥582 (R$481)"
      - label: Christmas
        value: Nothing announced
        detail: A normal bar night; Mass times unpublished
      - label: Night temp
        value: About 3 °C
        detail: "Dry and sunny by day, about 16 °C"
  - type: highlights
    items:
      - title: A church with temple eaves
        text: "The **Dali Catholic Church** sits in an alley at 6 Xinmin Road, off Renmin Road. It dates from **1927** and mixes Bai woodwork with a Catholic interior. A 2026 guide calls it the old town's most overlooked building."
      - title: Bar streets that start late
        text: "**Foreigner Street** (Yangren Jie) is a souvenir street until about 20:00, then the bars turn the music up. Renmin Road has the other cluster. Trip.com's November 2026 list has **Wild Pigeons Bar** with live folk music every night."
      - title: Erhai on Christmas Day
        text: "An **e-bike for about ¥50 (R$41) a day** is the usual way to reach Erhai lake from the old town. December brings about 7 hours of sun a day and almost no rain."
      - title: The catch is the way out
        text: "Only **two direct trains a day** go to Chongqing: 7 h 14 min, ¥530.5. Chengdu's train costs ¥85. Of the Christmas options, this is the hardest and most expensive one to leave."
  - type: prose
    title: How Christmas goes here
    dropcap: true
    text: |-
      Christmas in most of China isn't a religious or family holiday: malls decorate and people give apples on Christmas Eve. Dali adds no program of its own that I could find. What you get is the old town doing what it does every night: free to enter, grey-tile streets full of bars.

      Spend the afternoon of the 24th at the **Catholic church**, then wait for dark. Foreigner Street and Renmin Road wake up after 20:00 and peak between 21:00 and 23:00. Bars are how a solo traveler meets people here; the church is for looking, since Mass times aren't published.

      The 25th depends on how you leave. With a flight or the direct train on the 26th you get the whole day: rent an e-bike and ride to **Erhai**. Winter is rated fine for the town and less ideal for hiking Cangshan. With the cheap sleeper route you leave Dali at 14:52 on the 25th.
