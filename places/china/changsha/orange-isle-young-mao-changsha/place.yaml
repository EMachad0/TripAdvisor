  - type: highlights
    items:
      - title: A head the size of a building
        text: "The sculpture shows Mao as a young man, hair swept back, and is **32 m tall, 83 m long and 41 m wide**: only the head and shoulders, rising out of a long stone base at the island's south tip."
      - title: Why here
        text: "Mao studied in Changsha from 1913 to 1918 and crossed to the isle with classmates; his 1925 poem *Changsha* opens at its head, 'myriad hills drenched in crimson'."
      - title: Lit after dark
        text: "Floodlit at night against the river and the city towers. With sunset around **17:30** in December, a 16:00 start gives you both day and night views."
      - title: Free and on the metro
        text: "No ticket, Metro Line 2 to the island, and a sightseeing bus (¥20 or ¥40; sources disagree) down its 5 km length if you don't want to walk."
  - type: prose
    title: Fitting it into the route
    dropcap: true
    text: |-
      Orange Isle is a 5 km sliver of land in the Xiang River in the middle of Changsha, the capital of Hunan. The statue was finished on 20 December 2009, and the free island now gets about 17 million visits a year (People's Daily, December 2025).

      Changsha is not one of your bases, but it sits on the rail line out of Zhangjiajie, about **1 h 45 – 2 h** by train from Zhangjiajie (around 40 trains a day to Changsha station, ¥138–166 in second class). The easy way is a stopover: arrive in the afternoon, see the statue at dusk, sleep in Changsha and move on. A return day trip from Zhangjiajie works too, but the trains cost about ¥276 (R$234) for a sight that is free, so only do it if a giant Mao is worth that to you.

      Bookings run on WeChat in Chinese, built for Chinese ID cards. On holidays the slots sell out; on a December weekday crowds are unlikely to be the problem, but the booking might be. Have the hostel help, or ask at the gate with your passport.
