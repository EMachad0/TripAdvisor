  - type: highlights
    items:
      - title: The slogan ceiling
        text: "In the **798 Art Factory** hall, red Maoist slogans painted during the Cultural Revolution still run along the arched concrete ceiling. Artists asked the renovators to keep them."
      - title: Socialist-bloc engineering
        text: "The **718 Joint Factory** was designed with East German expertise and opened in 1957: north-facing sawtooth roofs, huge open halls, some of the old machinery left in place."
      - title: Free to wander
        text: "Walking the lanes and most galleries costs nothing. Big shows charge **¥30–120**; UCCA, the main museum, sells tickets at the front desk."
      - title: Mao kitsch, on purpose
        text: "Wikipedia notes the kept slogans give the galleries an ironic **'Mao kitsch'** touch. In Dec–Jan UCCA shows Carsten Höller's *Two* (to 31 Jan 2027)."
  - type: prose
    title: "Socialist factory, contemporary art"
    dropcap: true
    text: |-
      In the early 1950s the new People's Republic asked its allies to build its industry. East Germany sent engineers for a giant electronics works in Dashanzi, north-east Beijing, which ran from 1957 as the 718 Joint Factory and was later split into numbered plants, among them 798. The Germans built to Bauhaus rules: function first, north-facing windows for shadowless light, and earthquake standards the Chinese and Soviet advisers thought excessive.

      During the Cultural Revolution workers painted slogans in praise of Mao and Mao Zedong Thought across the ceilings. Production wound down from the late 1980s, an art academy and then galleries moved into the empty halls from 1995, and when the site was saved from demolition in the 2000s the tenants asked for the slogans to stay. So you get a rare mix: socialist industrial architecture, Cultural Revolution paint and a contemporary art scene in one place.

      The slogans are the reason to come for this list, so check the **798 Art Factory** (enter via the underpass just west of UCCA, per Lonely Planet) first; the hall is used for exhibitions, so what's on the floor changes.
