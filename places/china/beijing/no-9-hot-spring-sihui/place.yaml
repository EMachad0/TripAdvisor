  - type: tips
    variant: insider
    items:
      - "Go on a **weekday**: reviewers paid ¥378–439 Monday to Thursday and ¥499–539 on weekends and holidays."
      - "Pick dinner as your included meal (18:00–21:00); the late-night snack and breakfast come after it."
      - "A 6-hour ticket exists (reviewers: ¥369 weekdays) but costs almost as much as 18 hours. Take the 18."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** Since 1 Jan 2026, Art. 78 of China's revised Public Security Administration Punishments Law gives 10–15 days' detention and up to ¥5,000 fine for buying sex; foreigners can be expelled (Art. 10) and barred 10 years. This card is the legal option: no extras are sold or asked for."
      - "Massages, scrubs, alcohol, private rooms and some games are **extra** and go on the wristband. Massages are often pricier than expected (one reviewer: \"significantly more expensive\"), so ask the price first."
      - "Bring the **physical passport**: it is needed to register, overnight included."
      - "Reviewer prices are undated and can change. Check the current ticket on Meituan or Dianping before you go."
