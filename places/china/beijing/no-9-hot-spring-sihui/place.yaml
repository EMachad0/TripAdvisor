  - type: hero
    image: outdoor-pool
    caption: "Steam off No. 9's outdoor spring pool on a freezing day"
    hook: "Soak outdoors in 36–40 °C spring pools, eat crab in pajamas, sleep in a capsule while Beijing freezes."
  - type: quick_facts
    time_needed: "Overnight, 12–18 h"
    best_time: "Weekday, from 17:00"
    extra:
      - { label: Slot, value: "Mon 14 or Tue 15 Dec night", detail: "Any Beijing night (13–15 Dec) works; Sun 13 is likely the weekend price" }
      - { label: Bring, value: "Passport + swimsuit", detail: "Passport to register; swimsuit for outdoor pools (or buy one there)" }
      - { label: Sleep, value: "Capsule or recliner", detail: "In shared rest areas; private rooms cost extra" }
  - type: highlights
    items:
      - title: The biggest one on the strip
        text: "The Economic Observer (Jan 2026) counts four bathhouses on one street; No. 9 is the biggest at **40,000 m²**, and the only one with a natural outdoor spring: 2,000 m² of pools fed by 48 °C well water. A reviewer puts the open-air pools at **36–40 °C**, swimsuit required."
      - title: Dinner is in the ticket
        text: "Reviewers list breakfast 07:00–09:00, lunch **or** dinner buffet, and a late-night snack around 23:30–01:30. The buffet has oysters, crab and Peking duck; fruit, drinks, yogurt and Häagen-Dazs are unlimited. A second main meal is ¥99."
      - title: A cheap, warm bed
        text: "Stay from 02:00 to 06:00 for ¥59 more and sleep in a capsule or recliner in the rest areas. On a −5 °C night, a hot soak and a capsule cost about what a hostel bed plus dinner would."
      - title: The legal option
        text: "This is a family bathhouse: the Economic Observer saw parents with children queueing in the lobby. Massage here is a priced body massage added to your wristband, nothing else."
  - type: prose
    title: How a night goes
    dropcap: true
    text: |-
      **Check in.** Show your passport at the desk. You get a wristband that opens your locker, and anything extra goes on it. You settle the wristband when you leave. Reviewers describe buying the ticket at the desk; Meituan or Dianping may be cheaper.

      **Soak.** As is typical of Chinese bathhouses, the indoor bathing areas are single-sex and nude. Shower, then go outside first while the outdoor pools are open, then the saunas (up to 90 °C).

      **Eat and lounge.** Change into the pajamas and go up to the buffet and the mixed lounges: games, films, billiards (some reviewers paid extra for billiards and PlayStation).

      **Sleep.** Pick a capsule on the 3rd floor or a recliner. You pay the ¥59 night fee if you are still inside between 02:00 and 06:00. Breakfast is from 07:00, then a last soak. Beijing is fixed on your route, so any of the nights of **13, 14 or 15 Dec** works; Mon 14 or Tue 15 get the weekday price.
