blocks:
  - type: hero
    hook: A giant dumpling on chopsticks sticks out of the wall; behind the window, the aunties are folding.
  - type: quick_facts
    time_needed: 45–60 min
    best_time: Lunch at 798
    extra:
      - { label: Solo, value: "Yes: one plate is a meal", detail: "Ctrip lists the mackerel dumplings as 4 palm-sized pieces, 240 g" }
      - { label: Style, value: Jiaodong (Shandong coast), detail: "Big dumplings, seafood fillings" }
  - type: highlights
    items:
      - title: Spanish mackerel and chive
        text: "The filling Michelin tells you to order: juicy, tender **mackerel and chive**, from the seafood side of the menu that's the most popular."
      - title: Made in front of you
        text: "Michelin and Ctrip reviewers both mention the **open kitchen**: you watch the dumplings being wrapped and boiled."
      - title: Free sides bar
        text: "A Ctrip reviewer lists a free station with **corn porridge**, a water-chestnut drink, laba garlic and dipping sauces."
      - title: Lunch inside 798
        text: "It's in the art district itself, so it slots into an afternoon of galleries. About **¥57** (R$51) a head."
  - type: prose
    title: Shandong on a plate
    text: |-
      Jiaodong is the peninsula on Shandong's coast, and its dumplings are big and full of seafood. Visit Beijing's January 2026 guide recommends the mackerel, the **chive with two kinds of shrimp** (韭菜双虾) and the **scallop with octopus** (干贝八蛸). Michelin adds seasonal fillings such as kelp, dried shrimp and shepherd's purse.

      One plate of the mackerel dumplings is four palm-sized pieces, so a solo eater can try one filling and stop, or order a second plate to compare.
