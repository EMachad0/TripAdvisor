blocks:
  - type: hero
    image: luzhu-bowls
    caption: "Bowls of luzhu at Chen Ji: offal, tofu and flatbread in the spiced broth"
    hook: A family pot of spiced broth since 1982, ladled over offal, tofu and torn flatbread.
  - type: quick_facts
    time_needed: 30–60 min
    best_time: Off-peak, mid-morning
    extra:
      - { label: Solo, value: "Yes: shared tables", detail: "Nine tables; Michelin says expect to share at meal times" }
      - { label: In the bowl, value: "Intestine, lung, pork", detail: "Plus tofu and flatbread in the broth" }
  - type: highlights
    items:
      - title: The dish Beijing eats in winter
        text: "**Luzhu**: braised pork and pork offal in a savoury spiced marinade, with silky tofu and chewy unleavened flatbread that soaks up the broth (Michelin's description)."
      - title: Family-run since 1982
        text: "Michelin says the third generation now runs it. The shop has **nine tables**."
      - title: In the Qianmen lanes
        text: "Langfang Ertiao is near **Qianmen and Dashilar** (SMZDM), so it fits a day around Tiananmen and the old shopping streets."
      - title: Bib for about ¥36
        text: "Ctrip's average spend is **¥36** (R$32) a head; Michelin rates it ¥, its cheapest band."
  - type: prose
    title: What's in the bowl
    text: |-
      A Ctrip reviewer ordered "one base, three flatbreads plus intestine" and found **tofu, white pork and lung** in the bowl too, with a thick, fragrant broth and dense flatbread that stays chewy. You build the bowl by flatbread count: Ctrip's dish list has a small bowl, a base with one flatbread, and extra white pork.

      This is offal, and proud of it. If intestine is a step too far, ask for more white pork (加白肉) and fewer innards.
