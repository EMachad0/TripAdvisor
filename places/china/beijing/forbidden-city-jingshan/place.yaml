blocks:
  - type: hero
    image: snow-from-jingshan
    hook: "Through the palace from south to north, then up the hill behind it to see every yellow roof at once."
    caption: "The Forbidden City after snow, seen from Jingshan, January 2020"
  - type: quick_facts
    time_needed: "4–5 h with Jingshan"
    best_time: "Morning session, then Jingshan"
    extra:
      - { label: Closed, value: Mondays, detail: "Except public-holiday Mondays" }
      - { label: Way through, value: South → north, detail: "In at the Meridian Gate (Wumen), out at Shenwumen" }
  - type: highlights
    items:
      - title: R$33 for an imperial palace
        text: "Low-season entry (Nov 1 – Mar 31) is **¥40**, a third less than in summer. The Treasure Gallery and the Gallery of Clocks are ¥10 each on top."
      - title: The view from Jingshan
        text: "Leave by the north gate and cross the street to **Jingshan**: ¥2, and about 5 minutes up from the west gate to a hilltop pavilion looking straight down the palace axis."
      - title: Snow, if you're lucky
        text: "Beijing gets snow on about **2–3 days** in an average December. Red walls and white roofs are the photo everyone wants; dry blue-sky days are far more common."
      - title: Capped and calm-ish
        text: "Visitor numbers are capped at **40,000 a day**, and every ticket is booked online in advance. On Nov 10 every date open for booking was already sold out."
  - type: gallery
    images:
      - { file: supreme-harmony-snow, caption: "The Hall of Supreme Harmony in snow, March 2022" }
      - { file: corner-tower, caption: "The north-west corner tower and the moat, with the last snow" }
      - { file: jingshan-sunset, caption: "The palace from the top of Jingshan (Coal Hill)" }
  - type: book_ahead
    steps:
      - days_before: 7
        text: "Tickets for your date open on the official booking site, at **20:00 Beijing time** according to one guide. Be online when yours opens."
      - days_before: 7
        text: "Enter your **passport number**, pick the morning session and add a gallery if you want it."
      - days_before: 0
        text: "Morning session: get in by 12:00. Enter at the **Meridian Gate** (Line 1, Tiananmen East, Exit A). Pay ¥2 at the Jingshan gate on the way out."
    passport_note: "The ticket is your **passport**: bring the same one you booked with."
  - type: cost_breakdown
    items:
      - { label: "Palace Museum, low season", local: 40, brl: 33.07 }
      - { label: Jingshan Park, local: 2, brl: 1.65 }
      - { label: Treasure Gallery, local: 10, brl: 8.27, optional: true }
      - { label: Gallery of Clocks, local: 10, brl: 8.27, optional: true }
  - type: map
    note: "In from the south (Tiananmen East, Line 1), out at the north gate (Shenwumen). Jingshan's gates are on the west and east sides; the south gate is often closed. Shichahai (Line 8) is the nearest station after."
  - type: tips
    variant: insider
    items:
      - "Plan your Beijing days around **Monday**: the palace is shut, so make Monday the Great Wall or a food day."
      - "Book the palace before anything else in Beijing: it's the one thing with a hard 7-day window and sell-outs."
      - "Climb Jingshan from the **west gate**: about 5 minutes to the top, against 10–15 from the east."
  - type: tips
    variant: pitfalls
    items:
      - "There are **no same-day tickets** at the palace. Without a booking you are left with Jingshan's view from outside."
      - "Last entry is **15:30** in winter, and the museum can close on irregular days. Check the notices on the official site."
      - "Jingshan's price goes up to ¥10 during exhibition periods."
  - type: weather
    temp_low_c: -5
    temp_high_c: 4
    conditions: "Dry, sunny and freezing; about 59% of possible sunshine in December"
    note: "Most of the palace is open courtyards and long walks between halls, so you're outdoors for hours. Jingshan adds an open, windy hilltop."
    wear: "Down jacket, hat, gloves, warm shoes for the stone paving"
  - type: pairs_well
    items:
