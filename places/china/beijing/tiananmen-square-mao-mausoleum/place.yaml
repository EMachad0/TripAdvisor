blocks:
  - type: hero
    image: mao-portrait-gate
    hook: "The giant portrait on the Gate of Heavenly Peace, the 38 m Heroes' obelisk, and Mao himself under glass."
    caption: "Mao's portrait on Tiananmen Gate, facing the square"
  - type: quick_facts
    time_needed: "2–3 h, more if security is slow"
    best_time: "Tue–Sat, mausoleum at 08:00"
    extra:
      - { label: Mausoleum, value: "Tue–Sun 08:00–12:00", detail: "Reopened 1 Sep 2026 after a renovation" }
      - { label: Inside the hall, value: "No bags, no camera", detail: "Free bag storage on the east side of the square" }
      - { label: Your slot, value: "Tue–Sun mornings", detail: "Not after Dec 28–31 shifts; 26 Dec (Mao's birthday) has own hours" }
  - type: highlights
    items:
      - title: Mao's body under glass
        text: "The mausoleum, built in 1977 a year after Mao died, keeps his **embalmed body** on display. You queue, walk past without stopping and out again; the north hall has a seated statue of him."
      - title: Monument to the People's Heroes
        text: "A **37.94 m** granite obelisk from 1958, with Mao's calligraphy on the front and eight large reliefs of revolutions from the Opium War to the 1949 Yangtze crossing."
      - title: The portrait and the gate
        text: "Mao's portrait hangs over the **Gate of Heavenly Peace** at the north end; he proclaimed the People's Republic here on 1 Oct 1949. Climbing the rostrum costs ¥15 on a separate booking."
      - title: Flag-raising at dawn
        text: "A guard of honour raises the flag at sunrise, about **07:25–07:35** in December. It needs its own flag-raising slot in the booking."
  - type: prose
    title: How the visit works
    dropcap: true
    text: |-
      At 765 × 282 m the square is the political centre of the People's Republic: the Great Hall of the People on the west side, the National Museum on the east, the gate with Mao's portrait to the north, and in the south half the obelisk and the mausoleum. Entry is free but booked, with your passport, for one of four slots (flag-raising, morning, afternoon, flag-lowering), and everyone passes an ID check and airport-style screening. Travel guides from 2026 report 30–90 minutes at security on busy days.

      The mausoleum is a second, separate booking and is open mornings only, Tuesday to Sunday. It was closed for most of 2026 and reopened on 1 September. Inside you may not carry a bag, camera, water or any liquid, so leave everything at the storage on the east side of the square before joining the line. The official rules ask visitors to stay silent and not linger, so the time with Mao himself is short.

      This is the most charged public space in China, and the official story told here is the Party's. The page describes what you see; how you read it is up to you. In practice, keep your passport on you all the time, don't bring flags, banners or printed material (on the mausoleum's 2026 banned list), and don't fly a drone.
