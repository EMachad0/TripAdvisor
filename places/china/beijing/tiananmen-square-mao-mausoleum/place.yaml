  - type: tips
    variant: insider
    items:
      - "Do the mausoleum first: it closes at **12:00**, while the square stays open all afternoon on the same day if your square slot allows it."
      - "No WeChat booking? A May 2025 forum answer says the hall keeps same-day places for foreign visitors at a desk on its **south-east corner**, 08:00–12:00. Not confirmed since the 2026 reopening."
      - "Trip.com (Oct 2026) says the Gate rostrum route is one-way: you can't come back past Duanmen, so see the square first. The Forbidden City beyond needs its own booking."
  - type: tips
    variant: pitfalls
    items:
      - "The mausoleum is **closed on Mondays**, and can close at short notice for events on the square (official notice)."
      - "A Forbidden City ticket does not get you onto the square, and a square booking does not get you into the mausoleum: three separate systems."
      - "Square screening bans lighters, knives and drones (Wander in China); the mausoleum's 2026 list also bans banners, flags and printed material. Leave them at the hostel."
