blocks:
  - type: hero
    image: dragon-detail
    hook: "The biggest dragon wall in China, built for a Ming prince. Then a cliff of giant Buddhas, 16 km west."
    caption: "A dragon on the Datong wall, photographed in January 1985"
  - type: quick_facts
    time_needed: "Full day, about 12 h"
    best_time: "Early train; the wall first, then Yungang"
    extra:
      - { label: The wall, value: "45.5 m × 8 m", detail: "Nearly twice as long as Beihai's" }
      - { label: Train, value: "1 h 40 min fastest", detail: "Beijing North / Qinghe → Datong South, ¥151–170 each way" }
      - { label: Cold, value: "−14 to −1 °C", detail: "December average; everything is outdoors" }
  - type: highlights
    items:
      - title: The largest dragon wall in China
        text: "Datong's city government calls it the **biggest and oldest** surviving dragon wall in China: **45.5 m long and 8 m high**, with nine glazed dragons. It was built in the early Ming as the screen wall of Prince Zhu Gui's mansion, so the dragons really are the point."
      - title: More than 600 years old
        text: "It's from the early Ming; Beihai's wall dates from 1756 and the Forbidden City's about 16 years later. See Beihai's Qing wall too and you can compare the two dynasties side by side."
      - title: Yungang, the reason to stay all day
        text: "**252 caves and 51,000 statues** carved into a sandstone cliff in the 5th and 6th centuries. It's UNESCO-listed; Cave 20's seated Buddha sits in the open air. Winter price **¥100**."
      - title: Cheap to get between them
        text: "From the old city to Yungang, city buses **3 or 12** cost ¥1–2 and a taxi about ¥30–40. A ¥10 shuttle also runs from Datong South station to Yungang in about 40 minutes."
  - type: prose
    title: Is it worth the day?
    text: |-
      Few foreign visitors stop in Datong. Here you can see China's largest dragon wall and a UNESCO-listed cliff of Buddhas in one day. A fast train from Beijing takes as little as 1 h 40 min, so you can go and come back without moving your bed.

      On cost: at about **¥510 (R$433)** it's roughly two and a half days of the "everything else" budget. Most of that is the train. To spend less, skip Yungang and take an afternoon train to see only the wall. But Yungang is what turns this from a long ride for one wall into a full day out.
  - type: gallery
    images:
      - { file: yungang-cave-20, caption: "Yungang, Cave 20: the open-air seated Buddha" }
      - { file: wall-scale, caption: "Dragons on the Datong wall, with a visitor for scale (1985)" }
      - { file: yungang-cave-5, focus: top, caption: "A painted Buddha inside Cave 5" }
  - type: book_ahead
    steps:
      - days_before: 7
        text: "Book the **fast train** both ways (12306 or Trip.com, passport). Pick a departure around **07:00–08:00** and a return around 17:00–18:00."
      - days_before: 7
        text: "Book **Yungang** on Trip.com or the 云冈研究院 mini-program with your **passport number** as soon as your date opens. Pick a late-morning or midday slot."
      - days_before: 0
        text: "Datong South → taxi to the old city → **Nine-Dragon Wall** (opens 08:30) → bus 3/12 or taxi to **Yungang** → taxi back to Datong South."
    passport_note: "The train and Yungang are both real-name: bring the **same passport** you booked with."
  - type: cost_breakdown
    items:
      - { label: "Fast train Beijing → Datong South", local: 160, brl: 135.82, estimate: true }
      - { label: "Fast train Datong South → Beijing", local: 160, brl: 135.82, estimate: true }
