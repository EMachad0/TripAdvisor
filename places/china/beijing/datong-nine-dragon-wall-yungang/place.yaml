  - type: map
    note: "The pin is the Nine-Dragon Wall on Heyang Street in the walled old city. Yungang is 16 km west, about 30–40 min by taxi."
  - type: tips
    variant: insider
    items:
      - "Do the **wall first**: it's in the old city, opens 08:30 and may stop entry at 17:00. Then spend the middle of the day at Yungang, aiming to be inside before about 16:00."
      - "To compare: Beihai's wall is 25.52 m long (Visit Beijing) and Datong's is 45.5 m, nearly twice the size."
  - type: tips
    variant: pitfalls
    items:
      - "There's **no ticket window** at Yungang. Without an online booking you may not get in."
      - "Don't plan this for **Dec 28–31**: it's a 12-hour day and those are your work nights. Do it before Dec 24."
