  - type: prose
    title: Buying a piece of the Mao era
    dropcap: true
    text: |-
      Panjiayuan is a huge antique and flea market in south-east Beijing, and one of the easiest places to find second-hand Mao-era things: badges, pocket copies of *Quotations from Chairman Mao* (the Little Red Book), posters, medals and figurines. It sits between jade bracelets, old tools and stone lions, so treat it as a treasure hunt rather than a Mao shop.

      Assume most of it is reproduction. The guides all say copies are mixed with originals, and a badge or poster sold as "original" for a high price should be treated with suspicion. For a souvenir that doesn't matter: a badge or a Little Red Book is cheap. For anything sold as a valuable antique, ask for documentation, or leave it.

      Come on a weekend morning, when temporary vendors set up and the market is at its busiest. Bring cash and patience.
