  - type: tips
    variant: insider
    items:
      - "Go on **Saturday or Sunday morning**: that's when temporary vendors come and the stall area is full (Trip.com, 2026)."
      - "Evening option: the **night market** runs Wed and Fri to 23:00 (Beijing government, 2025); Ruqin calls Friday evening the liveliest. Saturday nights in winter are unconfirmed."
      - "Learn two phrases: **太贵了** (tài guì le, too expensive) and **可以便宜一点吗?** (can it be cheaper?)."
