blocks:
  - type: hero
    image: wall-bare-hills
    hook: "Watchtowers strung along a brown winter ridge, wind in your face, and nobody on the steps ahead of you."
  - type: quick_facts
    time_needed: "Full day, 8–9 h"
    best_time: "Clear weekday, 09:10 coach"
    extra:
      - { label: On the wall, value: "3–4 h", detail: "Plus 1.5–2 h each way on the coach" }
      - { label: Walk up, value: "30–40 min", detail: "South gate to tower 6 or 8, free" }
      - { label: Cold, value: "−9 to 3 °C", detail: "December average, Miyun station; windier on the ridge" }
  - type: highlights
    items:
      - title: The Ming wall, restored
        text: "**22 watchtowers** on a 2,250 m stretch, rebuilt in 1569. The top is 4–5 m wide, so even in winter you're not edging along a ledge."
      - title: Up by chairlift, down by toboggan
        text: "A chairlift up and the metal **toboggan** track down is ¥140 (R$116). It runs on dry days only and shuts in rain or snow."
      - title: Free if you walk
        text: "From the south gate to **tower 6 or 8** is a 30–40 minute climb on steps. Skip the lifts and the wall costs you the ¥45 entry."
      - title: Old enough to matter
        text: "First built in the **mid-500s** under the Northern Qi; the Ming added a pass here in 1404. Restoration was approved in 1983."
  - type: prose
    title: How the day works
    dropcap: true
    text: |-
      The simplest way is the **Dongzhimen tourist coach**: one departure at **09:10** from the Dongzhimen transport hub, ¥80 return, 1.5–2 hours each way. Coaches come back between **13:00 and 16:00**, which gives you about three hours up top.

      The cheaper DIY route is the **916 Express** from Dongzhimen (¥16, every 10–30 minutes from 05:50) to Huairou Beidajie, then bus **H23, H24, H35 or H36** to the Mutianyu roundabout: 2–2.5 hours in all, with more freedom on the way back.

      At the site, a ¥15 shuttle runs up the valley to the gates. Walk up to tower 6 or 8, walk the wall as far as the cold allows, and decide by the weather whether you ride down or walk.
  - type: gallery
    images:
      - { file: towers-spring, caption: "Towers along the ridge (spring photo; in December the trees are bare)" }
      - { file: cable-car, caption: "The enclosed cable car; it closed for annual maintenance on 13 Dec 2025" }
      - { file: toboggan, caption: "The toboggan track down; it shuts in rain and snow" }
  - type: book_ahead
    steps:
      - days_before: 15
        text: "Real-name tickets open. A December weekday rarely needs this much notice."
      - days_before: 1
        text: "Check the forecast and the official notices, then buy entry with your **passport number** (official QR shop or Trip.com)."
      - days_before: 0
        text: "Take the 09:10 coach or the 916 Express. Lifts and toboggan can be bought at the site once you see the conditions."
    passport_note: "Bring the **original passport** you booked with; it is your ticket at the gate."
  - type: cost_breakdown
    items:
      - { label: Entry ticket, local: 45, brl: 37.2, note: "Official Aug 2026 price; guides say ¥40" }
      - { label: Valley shuttle bus, local: 15, brl: 12.4 }
      - { label: "Tourist coach from Dongzhimen, return", local: 80, brl: 66.14 }
      - { label: "Cable car, return", local: 140, brl: 115.74, optional: true }
      - { label: "Chairlift up + toboggan down", local: 140, brl: 115.74, optional: true }
      - { label: "Instead of the coach: 916 Express, return", local: 32, brl: 26.45, optional: true, note: "Plus the H-bus fare, not listed" }
  - type: map
    note: "The coach and the 916 Express both leave from the **Dongzhimen** public transport hub. The pin is the wall itself; the ¥15 valley shuttle takes you up to it from where the buses stop."
  - type: tips
    variant: insider
    items:
      - "Walk up, ride down: legs are fresh on the climb, and the toboggan or chairlift saves your knees on icy steps."
      - "Take the **916 Express** if you want to stay past the coach's return window: it runs back from Huairou until 18:50."
      - "Buy lifts at the site, not in a bundle, so you can choose on the day once you know whether the toboggan is running."
  - type: tips
    variant: pitfalls
    items:
      - "The coach has **one departure a day** at 09:10. Miss it and you're on the 916 Express."
      - "After snow the steps are icy and steep: the site itself warns of slippery slopes and asks visitors to hold the handrails."
      - "Ticket sales stop at **16:30** and the toboggan shuts in rain or snow. Don't arrive late counting on the slide."
  - type: weather
    temp_low_c: -9
    temp_high_c: 3
    conditions: "Dry, bright and freezing; colder than the city, wind on the ridge"
    note: "Normals for Miyun, next to Huairou: December highs about 3 °C and lows about −9 °C. The wall is fully exposed, so the wind makes it feel colder. Snow and ice make the steps slippery and stop the toboggan. The hills are bare and brown, not green."
    wear: "Down jacket, thermal layers, hat, gloves, shoes with grip; water and snacks"
