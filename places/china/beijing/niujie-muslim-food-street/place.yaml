  - type: map
    note: "Line 19 to **Niujie**, Exit D2, puts you at the north end. Jubaoyuan is at **牛街5-2号**; Line 7 Guang'anmennei is about 700 m away."
  - type: tips
    variant: insider
    items:
      - "Walk the whole street first and eat second: it is under a kilometre long."
      - "Jubaoyuan's queue is two to three hours at meal times, per a 2026 Visit Beijing guide; its takeaway window often has a line too. Go mid-afternoon."
      - "Try **douzhi** once for the story, with a shaobing to chase it."
  - type: tips
    variant: pitfalls
    items:
      - "No shop hours are published: check Dianping or Amap the day before for the stalls you want."
      - "Non-Muslims may not enter the mosque's prayer hall; the halls close after the last prayer of the day."
  - type: weather
    temp_low_c: -5
    temp_high_c: 4
    conditions: Dry and freezing; little snow
    note: "You eat on the move and queue outside on a freezing street, so a hot bun or a warm douzhi does double duty. The hotpot is the sit-down, warm-up option."
    wear: "Warm coat, gloves you can take off quickly to eat"
