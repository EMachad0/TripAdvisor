blocks:
  - type: hero
    image: niujie-street
    hook: "A queue at the sticky-rice stall, ¥1 sesame bread from the oven, and Beijing's oldest mosque down the street."
    caption: "The north end of Niujie Street"
  - type: quick_facts
    time_needed: "1.5–2 h"
    best_time: "Weekday, off-peak"
    extra:
      - { label: Halal, value: Whole street, detail: "Beef and lamb; no pork" }
      - { label: Mosque, value: "¥10", detail: "Foreign visitors; courtyards only for non-Muslims" }
  - type: highlights
    items:
      - title: The cheapest good meal in Beijing
        text: "A sesame **shaobing** for ¥1, a beef one for ¥5, lamb or beef **baozi** at ¥2.5 each. Five or six snacks make a meal for about ¥50 (R$41)."
      - title: Sticky-rice sweets at Bai Ji
        text: "**白记年糕** sells glutinous-rice cakes with red-bean paste or purple jam for ¥10–20. It moved to a street-side stall and still has a long queue."
      - title: Copper-pot lamb hotpot
        text: "**聚宝源 Jubaoyuan** at No. 5-2 is the famous one: thin lamb in a copper pot, about ¥100–120 a head, with an English menu. Come early or prepare to wait."
      - title: A 1,000-year-old mosque
        text: "**Niujie Mosque** was first built in **996**, rebuilt in 1443 and expanded in 1696. Foreign visitors pay ¥10; non-Muslims can see the courtyards but not the prayer hall."
  - type: gallery
    images:
      - { file: mosque, caption: "Niujie Mosque: Chinese roofs on a mosque first built in 996" }
