blocks:
  - type: hero
    image: dragons-close
    focus: "30% 60%"
    hook: "Nine coiling dragons in seven colours of glaze on each face, still bright after 270 Beijing winters."
  - type: quick_facts
    time_needed: "1 h (3 h with the park)"
    best_time: "Tue–Sun, mid-morning"
    extra:
      - { label: Dragons, value: "9 big per side", detail: "Over 600 counting the small ones on the roof and tiles" }
      - { label: Built, value: "1756", detail: "Qianlong era; outlived two fires" }
  - type: highlights
    items:
      - title: The dragon really is the point
        text: "This isn't a place that's just *named* after dragons. The wall exists to show them: **nine big dragons** per face playing with pearls over waves, plus small ones on the roof ridges and eaves. Sources count **633 or 635** in all."
      - title: Two faces, seven colours
        text: "It's **5.96 m high and 25.52 m long**, faced on both sides with glazed brick in yellow, white, orange, purple, green, blue and sky blue. Of China's three old nine-dragon walls, it's the only one with dragons on both sides."
      - title: The wall that outlived its temple
        text: "It was built in 1756 to screen a hall that burned before it was finished. The hall built in its place burned again in 1919. Only the gate and this wall are left."
      - title: The cheapest imperial sight in Beijing
        text: "**¥5** gets you into the park in winter, or **¥15** for the combo. Walk on to the White Dagoba on its island while you're there."
  - type: prose
    title: Beijing's other dragon wall
    text: |-
      The **Forbidden City** has a Nine-Dragon Screen too. It was built about 16 years later, in front of the Ningshou Palace. It has one face and five panels, and its glaze has faded and cracked. A 2024 *Beijing Evening News* piece blames the palace screen's back, set against a wall, for trapping moisture. The Beihai wall stands free, which may be why it stayed brighter.

      To see both, add the **¥10 Treasure Gallery** ticket when you book the palace. The screen is inside that area. Do the palace in the morning and Beihai after lunch: Jingshan, the hill behind the palace, sits between the two.
  - type: gallery
    images:
      - { file: wall-sunny, caption: "The wall on a clear day, with the glazed roof on top" }
      - { file: wall-front, caption: "The whole wall, end to end" }
  - type: quote
    variant: vibe
    text: "Bare willows, low sun, and nine dragons that never fade."
  - type: cost_breakdown
    items:
      - { label: "Beihai combo ticket, low season", local: 15, brl: 12.73 }
      - { label: "Metro to Beihai North and back", local: 6, brl: 5.09, estimate: true, optional: true }
      - { label: "Forbidden City Treasure Gallery, for the second wall", local: 10, brl: 8.49, optional: true }
  - type: map
    note: "Come in by the **North Gate** (Line 6, Beihai North, Exit B or D): the wall is on the north shore, a few minutes inside. From the Forbidden City, walk out the palace's north gate, past Jingshan, and west to Beihai."
  - type: tips
    variant: insider
    items:
      - "Buy the **¥15 combo** at the gate rather than the ¥5 ticket. One 2026 guide says the wall is in the combo, and the difference is under R$9."
      - "In the low season the inner sights close at **17:00** (last entry 16:30). Get to the wall by mid-afternoon; the sun sets just before 17:00 in December."
  - type: tips
    variant: pitfalls
    items:
      - "**Mondays**: the park's own rules close its inner gardens (all but the Round City) on Mondays. It isn't clear whether that includes the wall, so go Tuesday to Sunday."
      - "Reseller sites sell \"fast-track\" Beihai tickets for far more than the official ¥5–15. You don't need them."
  - type: weather
    temp_low_c: -5
    temp_high_c: 4
    conditions: "Dry, cold and usually sunny"
    note: "It's all outdoors, but you only need an hour at the wall. Low winter sun makes the glaze glow."
    wear: "Down jacket, hat and gloves"
