        text: "Nanchizi Street runs along the Forbidden City's east side. Visit Beijing says you can see the corner tower by Donghuamen, the palace's east gate."
      - title: Modern, not touristy-old
        text: "Visit Beijing calls the room modern Chinese, clean and bright. Trip.com lists an English menu and card payment."
      - title: Bring the rest of Beijing
        text: "Order **zhajiang noodles** (炸酱面) on the side; a Trip.com reviewer calls them the main dish to pair with the duck."
  - type: prose
    title: Why this branch, and the queue
    text: |-
      Siji Minfu is the Peking duck chain locals and visitors queue for. The Gugong branch is the one beside the Forbidden City, so it fits the palace day. Visit Beijing calls it good value, puts the spend at **¥150–220 per person**, and says there is usually a queue.

      The queue can be serious. In Golden Week 2025, Times Weekly reported that this branch had **closed online queuing**, so people took numbers inside the shop. At 12:40 on 7 October, 165 small tables (1–2 people) were waiting, and one visitor queued for three hours. That was China's busiest holiday; mid-December should be calmer, but I found no report from that time of year. On a normal day a 2026 reviewer at another branch took a queue number by WeChat on arrival and went shopping until the alert came.
