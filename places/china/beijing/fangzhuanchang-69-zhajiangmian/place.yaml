  - type: highlights
    items:
      - title: Bib Gourmand, sixth year running
        text: "Visit Beijing says the Fangzhuanchang Hutong shop made Michelin's Bib list for the **sixth year** in the 2026 guide, and it is on the current 2027 Beijing list too."
      - title: A one-dish shop
        text: "This branch sells **zhajiangmian**: wheat noodles, a dark fried soybean-and-pork sauce and a plate of raw vegetable toppings you mix in yourself."
      - title: Eat until you stop
        text: "Refills of **noodles and sauce are free**, and every table has a jar of vinegar-pickled laba garlic, also free."
      - title: Old Beijing, cheap
        text: "About **¥38** (R$34) for the signature bowl. Ctrip's users average ¥28 a head."
  - type: prose
    title: From courtyard No. 69 to No. 1
    text: |-
      The name is an address. Visit Beijing's December 2025 profile says the business started with the family selling noodles at the gate of **No. 69 Fangzhuanchang Hutong**, tables set out in the lane, and now trades from No. 1, the shop Michelin lists. It has grown into a chain of 40-plus branches across Beijing (Winshang counts them, May 2026), from Qianmen to Daxing Airport, but the Bib Gourmand goes to the hutong shop only.

      Zhajiangmian is the city's everyday noodle dish: thick wheat noodles, a salty-sweet fried bean paste with pork, and cucumber, radish and beans on the side. Mix everything, add a clove of the green laba garlic, and order a second round of noodles if you're still hungry.
