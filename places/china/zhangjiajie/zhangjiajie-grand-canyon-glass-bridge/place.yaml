  - type: highlights
    items:
      - title: The glass walk
        text: "A **430 m** suspension bridge with a deck of 99 glass panels, about **300 m** above the canyon floor. Officially called 云天渡, Yuntiandu. Crossing takes 20–30 minutes; free shoe covers are handed out."
      - title: Down into the canyon
        text: "The B line carries on from the far end down stairs and walkways past waterfalls and caves, about 3.5 km and 3.5 hours, mostly downhill."
      - title: A boat to the exit
        text: "The walk ends at a jetty: a short boat ride across the lake is the only way out, included in the ticket."
      - title: Extras if you want them
        text: "A zip line, slides, a cliff via ferrata (about ¥138) and the 260 m bungee from the bridge (about ¥1,998) are all sold separately."
  - type: prose
    title: Which glass bridge is this?
    dropcap: true
    text: |-
      Three things get called "the Zhangjiajie glass bridge" online. **This is the big one**: a glass-floored suspension bridge across the Zhangjiajie Grand Canyon in Cili County, opened in 2016 and then billed as the world's highest and longest glass-bottomed bridge. Tianmen Mountain only has short glass sections on its cliff paths, and the National Forest Park has no glass bridge at all.

      It is a half-day trip of its own, closer to Wulingyuan (about 27 km, 35–50 minutes) than to Zhangjiajie city (about 50 km, 60–90 minutes). Pair it with the park side, not with Tianmen.

      **Is it worth about R$147?** It is just under the daily budget. The bridge itself is a short thrill; the canyon walk underneath is the longer, quieter part, so buy the B line if your legs allow. The bridge-only ticket gives you the photo for less.
