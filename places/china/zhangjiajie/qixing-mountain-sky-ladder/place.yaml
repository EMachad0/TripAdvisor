  - type: tips
    variant: insider
    items:
      - "Wear non-slip, thick-soled shoes, quick-dry clothes and long trousers. Water and chocolate are sold on site."
      - "If you only want the view and a taste of the height, a guide lists a cliff-jump experience (¥168) and a cloud swing (¥280), both including entry."
  - type: tips
