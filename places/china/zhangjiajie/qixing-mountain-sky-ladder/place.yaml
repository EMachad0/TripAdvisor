  - type: faq
    items:
      - q: "Is this the sky ladder from the videos, or is that Tianmen's 999 steps?"
        a: "The **iron ladder** in the viral videos is this one: a 168 m section of the via ferrata on Qixing Mountain, which China Daily calls the \"sky ladder\". Tianmen's 999 steps are a stone staircase to the cave that the operator also calls 上天梯; you walk it, with no harness. Two different places, about 13 km apart."
        asked: 2026-11-11
  - type: highlights
    items:
      - title: The ladder itself
        text: "**168 m** of metal rungs up a vertical cliff on a karst tableland, billed as China's highest via ferrata. The ladder sways a little as people climb above and below you."
      - title: Clipped in all the way
        text: "A 12 mm main lifeline plus a second cable, two locking carabiners that open only with a tool, a helmet and a harness, and coaches on the wall."
      - title: Something to take home
        text: "At the top you ring a bell; finishers get a certificate in Chinese and English, a trophy and drone footage of the climb."
      - title: A crowd from everywhere
        text: "Since it opened in November 2024 it has had nearly 150,000 climbers, more than 27,000 of them from abroad."
  - type: prose
    title: How the day works
    dropcap: true
    text: |-
      Qixing Mountain is a separate scenic area about 13 km from downtown Zhangjiajie. You go to the cable car tourist centre, ride the cable car up to the plateau and take the shuttle bus to the gear station. After a safety briefing the climb takes three to four hours; a Ukrainian climber China Daily followed set off around 08:00 and finished before noon.

      **Is it worth R$645?** That is almost four days of the "everything else" budget. You pay it because nothing else in the region does this: a real via ferrata with nearly 1,000 m of air below, coached, with gear included, open to beginners. If the price hurts, Tianmen's 999 steps give you a stairway to the sky for the price of the Tianmen ticket.

      **In December** it is a gamble on the weather. A guide puts the plateau well below freezing in winter and says the climb closes in rain or wind; on the snowy 31 December 2025 it was shut. Pick a dry, clear day, and keep a spare day.
