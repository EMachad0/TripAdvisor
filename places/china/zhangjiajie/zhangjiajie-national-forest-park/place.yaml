blocks:
  - type: hero
    image: pillars-mist
    hook: Stone towers with pine trees on top, standing in a valley that fills with cloud.
    caption: The pillar forest in summer mist. December has bare trees and, often, more cloud
  - type: quick_facts
    time_needed: 2 days (1 is a rush)
    best_time: First clear morning; views best 10:00–14:00
    extra:
      - label: Ticket validity
        value: 4 days
        detail: Each entry needs its own timed slot
      - label: Winter crowds
        value: Quietest season
        detail: Summer lift queues run 60–90 min
      - label: Bring
        value: Your original passport
        detail: Gates read foreign passports since July 2026
  - type: highlights
    items:
      - title: Yuanjiajie and the Avatar pillar
        text: "Cliff-edge platforms at Mihuntai and the **No. 1 Bridge Under Heaven** look straight across at the towers. The Southern Sky Column was renamed **Avatar Hallelujah Mountain** in January 2010. Allow 4–5 hours."
      - title: Tianzi Mountain
        text: "The wide \"ten-thousand peaks\" panorama, 3–4 hours. A local guide ranks it first for winter because it is above the cloud line more often than any other viewpoint. The winter's first snow fell here on Dec 31, 2025."
      - title: The Bailong Elevator
        text: "A **326 m** glass lift bolted to a cliff, opened in 2002 and billed as the world's tallest outdoor lift. The ride takes under two minutes and costs **¥65** (R$54) each way."
      - title: Golden Whip Stream
        text: "A **7.5 km** path along the valley floor with the towers overhead, 2.5–3 hours end to end and no lift needed. The same guide calls it the underrated winter pick."
      - title: Rime and snow, with luck
        text: "On cold mornings rime ice can coat the trees. Snow usually comes between late December and mid-February, 4–8 falls a winter, and stays 2–5 days on the tops."
      - title: Not limestone
        text: "The pillars look like karst but are not limestone: they were cut by freeze-thaw cycles and plant roots. This was China's first national forest park (1982) and is part of a UNESCO site listed in 1992."
  - type: prose
    title: Is it worth it in December?
    dropcap: true
    text: |-
      On a clear day this is one of the strangest landscapes in China: you stand on a plateau rim and look across at hundreds of towers, some more than 200 m tall, each with its own tuft of pines. In December the trees on the slopes are bare, the paths are nearly empty, and the queues that eat hours in summer are gone.

      The catch is cloud. The city below gets about 23% of its possible sunshine in December and rain on eight or nine days. Up on the plateau, a local guide writes that early December "is more often cold rain and fog with little scenic value", that fog can sit until 10:00–11:00, and that in falling snow visibility drops to 20–50 m. Another puts it bluntly: you may spend part of the trip staring at a wall of white.

      Snow on the pillars is the picture people hope for, but it is unlikely on 9–22 December. The first snow of the winter fell on Dec 31 in both 2024 and 2025.

      **Why it can still be worth R$311.** The ticket lasts four days and the park has two kinds of day in it. If the plateau is in cloud, walk Golden Whip Stream on the valley floor and go up the next clear morning. Two park days bring the cost to about R$155 a day, under the daily budget. With only one day and a grey forecast, it is a poor bet.
  - type: gallery
    images:
      - { file: tianzi-snow, caption: "A viewpoint at Tianzi Mountain under snow, winter 2026" }
      - { file: tianzi-pillars-winter, caption: "Tianzi Mountain on a clear winter day, 2026" }
      - { file: bailong-elevator, caption: "The Bailong Elevator on its cliff" }
