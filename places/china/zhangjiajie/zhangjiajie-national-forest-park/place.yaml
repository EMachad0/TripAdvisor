  - type: quote
    variant: vibe
    text: Cold air, wet stone steps, and a tower sliding out of the cloud right where the map said it would be.
  - type: book_ahead
    steps:
      - days_before: 30
        text: "Sales open up to **30 days** ahead. There is no reason to buy that early in December: wait for the forecast."
      - days_before: 1
        text: "Buy the 4-day ticket on **Trip.com** with your passport number. Pick the date, an entry slot and the gate: the **east gate** (Wulingyuan) if you sleep in Wulingyuan town."
      - days_before: 0
        text: "Scan your passport at the gate. Before you leave the park, ask staff to book tomorrow's entry if the mini-program will not open for you."
    passport_note: "Entry is by **passport scan**, no paper ticket. Older passports without a chip go through the staffed lane."
