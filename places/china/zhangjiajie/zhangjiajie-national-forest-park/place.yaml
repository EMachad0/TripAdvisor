        brl: 53.74
        note: Or walk about 2,000 steps, 1.5–2 h
      - label: Tianzi Mountain cable car, down
        local: 72
        brl: 59.52
        note: Or walk down in about 1.5 h
      - label: Huangshizhai cable car, one way
