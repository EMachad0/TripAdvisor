        brl: 10.75
        optional: true
    note: "The ticket-plus-two-rides combo is sold at the same ¥376. A combo with four rides is ¥477 (R$394), unlimited rides ¥537 (R$444)."
  - type: map
    zoom: 12
    note: "Most visitors enter by the **east gate** (标志门, Wujiayu) beside Wulingyuan town; an eco-bus reaches the Bailong Elevator in 20–25 min. The **south gate** (森林公园), on the city side, opens onto Huangshizhai and Golden Whip Stream."
  - type: tips
    variant: insider
    items:
      - "A two-day plan from one guide: day 1 east gate, Bailong lift up, Yuanjiajie, Tianzi Mountain, cable car down. Day 2 south gate, Golden Whip Stream east to the eco-bus, back to the east gate."
      - "Fogged in? Do the stream walk and wait. The clearest views come on the first clear morning after rain, when cloud fills the valleys below the rim."
      - "Ride the Bailong lift one way only, and take stairs the other way if you want to save ¥65–72 per ride."
      - "Food on the plateau is basic and marked up: noodles ¥25–35, a rice box ¥30–40. There is a KFC near the No. 1 Bridge parking area."
  - type: tips
    variant: pitfalls
    items:
      - "The last eco-buses run at about **17:00** in the off-season. The plateau is a long way from the gate, so start down by mid-afternoon."
      - "Macaques snatch bags and snacks and can turn aggressive. Keep food out of sight and do not feed them."
      - "Large suitcases are not allowed on the eco-buses, cable cars or the lift. Leave luggage at your hostel."
      - "Crampons can be rented at the entrances on icy days. Secondary trails may stay icy after the main ones are cleared."
  - type: weather
    temp_low_c: 0
    temp_high_c: 10
    conditions: Cold, damp, often in cloud; frost and rime on clear mornings
    note: "At around 1,000 m the viewpoints rarely pass 10 °C by day and drop below freezing after sunset; the plateau runs 4–8 °C colder than the city (Dec normals 4.9–12.2 °C). All of it is outdoors. Snow is unlikely before late December. Heavy snow or ice can close cable cars, the lift and glass walkways for 12–24 hours."
    wear: Down jacket, thermals, hat and gloves, non-slip hiking shoes, a poncho
  - type: pairs_well
    items:
      - id: tianmen-mountain
        note: The other mountain, in the city, about 40 min away by bus. Save it for a clear day
