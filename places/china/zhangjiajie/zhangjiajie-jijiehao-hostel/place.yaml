      - "Free lockers and luggage storage; shared kitchen; paid rooftop laundry"
      - "Check-in needs an ID card or passport; recent guests from Europe, Canada and the USA stayed in Oct–Nov 2026"
      - "Some reviews: hard beds, no wifi in the rooms, coffee and snacks pricey, bathrooms not always clean"
  - type: highlights
    items:
      - title: Built for the park
        text: "About **15–30 minutes on foot** to the National Forest Park's East Gate, and the staff plan your route through it."
      - title: The glass bridge is close
        text: "The Grand Canyon glass bridge is about 27 km away, with a coach from Wulingyuan bus station."
      - title: Tianmen is not
        text: "Tianmen Mountain is at the city's edge: a guide puts it at 50–70 minutes and ¥80–120 by taxi from Wulingyuan. Fine for one day trip; if Tianmen is your only stop, sleep in the city instead."
