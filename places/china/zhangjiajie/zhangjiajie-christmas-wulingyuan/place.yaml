    note: "The town costs nothing at Christmas. The money goes on the way out, about three times Chengdu's ¥85 train; the park ticket for the 25th is extra and on the park's own card."
  - type: map
    zoom: 15
    note: "The pin is **Xibu Street** (approximate, the street block). Jijiehao Hostel is on Huanxi Road, under 1 km southwest. Wulingyuan has no train station: Zhangjiajie West is a taxi or DiDi ride (about ¥55–80); ask the hostel how early to leave for a 07:30 train."
  - type: tips
    variant: insider
    items:
      - "Message Jijiehao a week or two ahead and ask whether they do a Christmas dinner and how many guests are booked for the 24th. That answer decides whether this is a good Christmas."
      - "Book the **07:30 G2452** on Dec 26 when sales open, 15 days ahead (Dec 11). For a 07:30 train, plan on a taxi or DiDi to Zhangjiajie West (about ¥55–80); ask the hostel to arrange one."
      - "If the 25th is clear, go to the park: December's empty paths are the upside of coming now."
  - type: tips
    variant: pitfalls
    items:
      - "Don't come here *for* Christmas. Come for the park, and treat Christmas as a hostel night that might be quiet."
      - "Don't plan Christmas Day around skiing or the ice festival: in the last two seasons they opened on Dec 26 and Dec 27."
      - "Tianmen's city cableway is shut for rebuilding in December 2026 (see the area page), so Tianmen on the 25th means the long way up."
