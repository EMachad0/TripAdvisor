blocks:
  - type: hero
    image: heavens-gate-steps
    hook: A doorway in the sky, 131 metres tall, reached by a cable car and 999 steps you can climb yourself.
    caption: "Tianmen Cave above the 999 steps, seen from the square at their foot"
  - type: quick_facts
    time_needed: 5–8 h
    best_time: A clear day; late morning once fog lifts
    extra:
      - label: Way up in Dec 2026
        value: Express cableway only
        detail: City cableway shut since 13 Oct 2026; no 99-bend bus
      - label: On foot
        value: 999 steps + cliff paths
        detail: Steps free, 30–45 min up; summit loop 4–8 h
      - label: Bring
        value: Your original passport
        detail: Tickets are tied to the passport number
  - type: faq
    items:
      - q: "Is this the one with the sky ladder, the mountain with a hole and the glass bridge?"
        a: "Two out of three. The **hole** is Tianmen Cave, and the operator's own name for the **999-step stairway** up to it is 上天梯, \"ladder to heaven\". The viral **iron sky ladder** in videos is a via ferrata on Qixing Mountain, and the big **glass bridge** is in the Grand Canyon. Both are separate places with their own cards. Tianmen has short glass sections on its cliff paths, not a bridge."
        asked: 2026-11-11
      - q: "Can I walk it?"
        a: "Partly. No bus runs up the 99-bend road and no source shows a public hiking trail from the city, so the **express cableway** takes you from the Mountain Gate up to the cave area. From there you walk: about 10 minutes on a plank path to the square, then the **999 steps** (free, 30–45 minutes up) to the cave. The summit cliff paths take about 4 hours for the west half, or 6–8 hours for the full loop. The 999 steps can close in ice or snow."
        asked: 2026-11-11
  - type: highlights
    items:
      - title: Tianmen cave
        text: "A natural arch **131.5 m** high near the top of the mountain. From the square below it looks like a gate cut through the ridge."
      - title: The 999 steps on foot
        text: "The **上天梯**, a stairway from the cave square (about 1,050 m) to the arch (about 1,170 m), free to climb in 30–45 minutes. The escalator beside it costs **¥32** (R$26) going up."
      - title: Escalators through the mountain
        text: "From behind the cave, seven escalator sections tunnel up inside the rock to the summit. Both directions are in the ticket."
      - title: Cliff paths and glass sections
        text: "Plank paths and the Guigu cliff walk run along the summit edge, with short glass-floored sections (West and Panlong Cliff; the East one closed for works in May 2026). Shoe covers cost ¥5."
      - title: The view down
        text: "On a clear day the summit looks over the city and the **99 bends** of the 11 km road. You no longer ride that road; you see it from above and from the express cableway."
      - title: Rime ice
        text: "Tianmen got its first rime of the 2025 winter on 17 November. A local guide gives late December to mid-February as the snow season."
  - type: prose
    title: What you get in December 2026
    dropcap: true
    text: |-
      Tianmen Mountain was sold for years on its cable car: 7,455 m from the middle of the city to the summit, built in 2005. **That ride is not available on this trip.** On 13 October 2026 the operator stopped the whole line for rebuilding and said it will announce a reopening date as the works progress. The bus up the 99-bend road was part of the suspended Lines A and B, so it is not running either.

      What runs is **Line C**. A free shuttle takes you from the old downtown station to the Mountain Gate. The Tianmen Cave express cableway lifts you to a plank path, and ten minutes on foot brings you to the square under the arch. You climb the 999 steps (or ride the paid escalator), walk through the cave, and take the tunnel escalators to the top for the cliff paths. You come back the same way.

      **Is it worth R$238?** It is over the daily budget for one ticket. On a clear or frosty day you get the arch, a real stair climb and long cliff walks, with few people around: a fair splurge. In fog you pay the same for a staircase and a white wall, and in ice the steps or glass sections can be shut. The ticket is tied to one date, so book it only when the forecast is good.
  - type: gallery
    images:
      - { file: cliff-walkway, caption: "A walkway bolted to the summit cliff (summer photo)" }
      - { file: escalator, caption: "The escalators inside the mountain" }
      - { file: cloud-sea, caption: "Above the cloud in March 2018, from the old cableway" }
  - type: quote
    variant: vibe
    text: Nine hundred and ninety-nine cold steps, then a hole in the mountain with the weather blowing through it.
  - type: book_ahead
    steps:
      - days_before: 3
        text: "Start watching the forecast. Guides say to book **1–3 days ahead**; in winter there is no gain in booking earlier."
      - days_before: 1
        text: "Book the **Line C** ticket on Trip.com with your passport number. Pick an entry slot from late morning, when fog has had time to lift."
      - days_before: 0
        text: "Go to the downtown cableway station, take the **free shuttle** to the Mountain Gate, and enter within your slot with your passport."
    passport_note: "Bring the **same passport** you booked with; entry is by passport scan or the e-ticket QR code."
