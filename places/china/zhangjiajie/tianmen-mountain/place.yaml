  - type: map
    zoom: 13
    note: "The pin is the **downtown lower station**, beside Zhangjiajie railway station. The cableway there is closed, but the ticket office is open and the free shuttle to the Mountain Gate leaves from it."
  - type: tips
    variant: insider
    items:
      - "Sleep in the city the night before if you can. From Wulingyuan a guide puts the trip at 50–70 minutes and ¥80–120 by taxi."
      - "**Walk up** the 999 steps; it is the one real climb left now the cable car is gone. Allow 30–45 minutes and take the stops."
      - "On the summit go **west** first: the West glass section and the Guigu cliff path are the classic route."
      - "The summit is 8–12 °C colder than the street. Bring the layers you would wear in the park."
  - type: tips
    variant: pitfalls
    items:
      - "Do not plan around the long cable car or the 99-bend bus. Many guides, photos and tour listings predate the October 2026 shutdown."
      - "Routes A and B are not sold. If a listing offers them for December 2026, it is out of date."
      - "The ¥32 cave escalator and the tunnel escalators are different things. Only the tunnel ones are in the ticket."
      - "After snow or ice the steps and glass sections can stay shut. Ask at the downtown ticket office before you pay."
  - type: weather
    temp_low_c: -5
    temp_high_c: 4
    conditions: Cold and exposed; often in cloud; ice and rime possible
    note: "No summit normals were found. The city averages 4.9–12.2 °C in December and a guide puts the summit 8–12 °C colder, so expect around or below freezing. Fog may not clear until 10:00–11:00. In November 2025 the first rime came with icy trails; snow is more likely from late December."
    wear: Down jacket, thermals, hat and gloves, shoes with grip for wet or icy stone
