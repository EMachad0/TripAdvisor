  - type: hero
    image: south-lake
    hook: Whitewashed walls and horse-head gables doubled in a still lake, an hour's bus ride below the mountain.
    caption: South Lake, Hongcun
  - type: quick_facts
    time_needed: 3–4 h
    best_time: Weekday morning
    extra:
      - { label: Ticket valid, value: 3 days, detail: Unlimited entries from the first scan }
      - { label: Good in rain, value: Partly, detail: Halls are covered; the lanes and lakeside are not }
  - type: highlights
    items:
      - title: The Moon Pond
        text: "A crescent pond in the middle of the village, built about 600 years ago for water, fire-fighting and washing. On a windless morning the houses around it reflect cleanly."
      - title: South Lake and the bridge
        text: "The bow-shaped lake at the entrance dates from **1607**. Its arched bridge is where *Crouching Tiger, Hidden Dragon* filmed."
      - title: Chengzhi Hall
        text: "The richest house, called the \"Folk Imperial Palace\": about **5 kg of gold** went into gilding its wood carvings (TravelChinaGuide)."
      - title: A cow-shaped water system
        text: "In the Ming dynasty the Wang family built a water system in the shape of an ox, with 1,200 m of channels and two ponds as its stomach and belly. **About 140** Ming and Qing houses still stand."
  - type: prose
    title: What it's like in December
    dropcap: true
    text: |-
      Hongcun is a UNESCO-listed Hui village 11 km from Yi County. In summer and autumn it is busy; Travel China With Me reckons December weekdays bring about a **fifth of normal crowds**, with temperatures around 0–10 °C. A snowfall turns the black roofs white, which the same guide rates as excellent for photos.

      Plan **3–4 hours**: South Lake first, then the lanes up to the Moon Pond, Chengzhi Hall and the Nanhu Academy on the lake's north bank. Wikivoyage finds it prettier than nearby Xidi but much more crowded, and says you don't need both if time is short. Travel China With Me quotes a returning visitor who found red lanterns, neon and loudspeaker tour groups in 2024: go early on a weekday.
