    note: "Buses stop at the bus station by the village entrance. Yixian East high-speed station is 40 min away by bus No. 10 (¥8)."
  - type: tips
    variant: insider
    items:
      - "Go **after the mountain**, on the way out: Tangkou bus in the morning, Hongcun at midday, then a ¥30 bus to Huangshan North for the train."
      - "TravelChinaGuide lists only **four** Tangkou–Hongcun buses off-season (07:40, 09:40, 13:40, 15:40); China Highlights says hourly 07:00–16:30. Catch an early one and ask at the station."
      - "With the big bag in tow, Travel China With Me lists luggage storage at the bus stations for **¥10–20**."
  - type: tips
    variant: pitfalls
    items:
      - "Buses don't run at night (Wikivoyage); a taxi to Tangkou costs ¥100–200."
      - "Travel China With Me lists 10 buses from Hongcun to Huangshan North, **08:30–17:00**, taking 100 minutes. Leave a margin before an evening train."
