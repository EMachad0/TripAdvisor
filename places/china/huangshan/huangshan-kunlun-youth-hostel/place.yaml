  - type: map
    note: "From Huangshan North, take the bus to the mountain's south gate (¥20, about 50 min, 06:30–19:30), which stops in Tangkou. The pin is Hostelworld's map point: check it against the address in a map app."
  - type: tips
    variant: insider
    items:
      - "Book **two nights** (around Dec 9–10 or 10–11): arrive, hike the next day, sleep, and leave for Hongcun with the bag on the third morning."
      - "Ask for the evening hike briefing on arrival: guests rate the staff's mountain advice."
  - type: tips
    variant: pitfalls
    items:
      - "There are **two Kunlun hostels**: this one in Tangkou and a Kunlun International Youth Hostel in Tunxi (Huangshan city), by the long-distance bus station, about an hour from the mountain. Check the address on the booking."
