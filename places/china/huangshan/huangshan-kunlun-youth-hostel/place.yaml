    social:
      - "A **bar** downstairs (tea, coffee, wine) and lounge spaces a 2026 guest called good \"for chilling or socialising\""
      - "**Film nights**: a Canadian guest found a movie night \"each night I was there, so you can easily connect\""
      - "A free **evening briefing** on the Huangshan hike (Hostelworld and Booking reviews)"
      - "Self-service kitchen for cooking with other guests"
      - "A Spanish guest called it \"un hostel sociable\". Only 2 + 13 reviews, so this is thin evidence: expect hikers who go to bed early, not a party"
    good_to_know:
      - "**Free luggage storage** (Hostelworld; Booking lists luggage storage). Ask whether they hold the bag overnight if you sleep on the summit"
      - "Booking.com says **cash only**; Hostelworld says cash or cards on arrival. Bring cash"
      - "Reception speaks English and Chinese (Booking.com); reception hours are limited (Hostelworld)"
      - "Guests mention borrowing hiking poles and free drinking water"
  - type: highlights
    items:
      - title: Your bag stays at the bottom
        text: "Sleep here the night before the hike and the night after. The big bag stays in the dorm; after check-out the hostel lists **free luggage storage**."
      - title: A hike briefing included
        text: "Guests mention a free evening briefing on the mountain, advice on climbing safely, and borrowed hiking poles."
      - title: Half the price of the summit
        text: "A ¥94 bed against roughly ¥200–300 for a summit dorm (Wikivoyage, 2019 prices)."
