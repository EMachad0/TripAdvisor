  - type: map
    note: "Pin: Yungu Temple, the lower cable car station and the start of the Eastern Steps. Shuttles leave from the Tangkou transfer centre."
  - type: tips
    variant: insider
    items:
      - "Walk **up** the Eastern Steps (2–3 h) instead of taking the cable car and save ¥80; or ride up and walk down the Western Steps. Wikivoyage reminds you that a long descent is not much easier than the climb."
      - "Buy **snow spikes** from the vendors on the mountain (Wikivoyage) or rent crampons at the base (China Highlights)."
      - "Buy snacks and water in Tangkou: food on top costs about twice as much."
      - "Ask at the ticket counter whether a foreigner discount applies: one traveler paid **¥95** instead of ¥190 with a passport in Sept 2025. No official source confirms it."
  - type: tips
    variant: pitfalls
    items:
      - "Do not plan on **Tiandu Peak** or the **Xihai Grand Canyon** train: both were shut from Dec 1 in 2024 and 2025. Lotus Peak is on its closed rest rotation."
      - "Check the cable car you want is running. In 2025–26 the **Taiping** line stopped Nov 24–Dec 8 for inspection; this winter's dates are not out yet."
      - "Last December the province made the ticket **free for Anhui residents** all month. If that repeats, weekends get busy; China Highlights already advises skipping Fridays and Saturdays."
      - "Missing the 15:00 trail gate or the 16:40 cable car means a long descent in the cold dark: sunset is around 17:08."
