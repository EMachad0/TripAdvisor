  - type: faq
    title: Your questions
    items:
      - q: Is it worth the days in winter?
        a: "Yes, if you accept the gamble on views. December at the summit has about **half the possible sunshine** and 10.8 days with rain or snow, and fog can hide everything. In return there is snow and rime, the sea of clouds shows **more often in winter** (China Highlights), and crowds are low. The ticket is valid **3 days with re-entry**, so a fogged-out day 1 can be retried on day 2: book the re-entry on the official platform."
        asked: 2026-11-11
      - q: What do I do with my luggage?
        a: "Book **two nights at a Tangkou hostel** (the night before and the night of the hike). The big bag then stays in your dorm and you climb with a daypack. The Kunlun hostel lists **free luggage storage** if you need to leave it after check-out. If you sleep on the summit, ask before booking whether they hold bags overnight: no listing says so. Bring only a daypack to the summit."
        asked: 2026-11-11
      - q: How hard is the hike, especially in the cold? Is it safe?
        a: "Moderate but long. It is all **stone stairs**: the Eastern Steps take 2–3 h up, the Western Steps 6–7 h. Wikivoyage calls the trails wide walkways with railings, often lit, with workers clearing snow. China Highlights says the main paths are safe when icy because they are cleared daily, and management closes risky trails. Real risks: **ice in the morning** (buy snow spikes), −3 °C on top, and the 15:00 trail cut-off."
        asked: 2026-11-11
  - type: highlights
    items:
      - title: Frost and snow on granite
        text: "The 1,840 m station gets **6.5 snowy days** in an average December, and China Highlights says snow lingers on the peaks because it melts slowly in the cold."
      - title: The sea of clouds
        text: "Clouds pool in the valleys overnight, especially after rain or snow (Wikivoyage). China Highlights says it shows **more often in winter**; nobody publishes odds, so treat it as a bonus."
      - title: Cheap re-entry for bad weather
        text: "One **¥190** ticket covers three consecutive days with unlimited entries once it is scanned on day one: a real fog insurance."
      - title: Real hike, safe paths
        text: "Up the **Eastern Steps** in 2–3 h or by cable car, then down the long **Western Steps**: a blogger walked down to Ciguangge in about 2 hours."
  - type: prose
    title: How the day works
    dropcap: true
    text: |-
      Sleep in **Tangkou**, the town at the south gate. Book the ticket for the south gate the day before. From the Tangkou transfer centre, the winter shuttle goes up from **07:40** to **Yungu Temple** (¥19). There you either ride the **Yungu cable car** (¥80, from 08:00) or walk the **Eastern Steps**, the easier of the two southern stairways, in 2–3 hours.

      On top you walk the plateau between Beihai and Bright Summit (Guangmingding) on stone paths. Leave enough time for the way down: the **Yuping cable car** (¥90) or the **Western Steps** past Yuping to Ciguangge, where the shuttle takes you back to Tangkou (last one down at **17:10**). Trail gates stop letting hikers in at **15:00** and the cable cars stop at **16:40**.

      Sunrise is at about 06:52 in mid-December and the first shuttle is at 07:40, so on a day hike you only see sunrise from the top if you **sleep on the summit**. Summit hotels are expensive: Wikivoyage lists dorm beds at ¥200–300 (Shilin) or ¥100–250 (White Goose, which in 2021 did not take foreigners), and warns that several hotels close in winter. A Tangkou dorm bed costs about a third of that.
