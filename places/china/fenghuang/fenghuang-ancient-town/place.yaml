  - type: tips
    variant: insider
    items:
      - "Skip the ¥128 ticket unless you want the boat: the river, bridges, stepping stones and lights are all free."
      - "Sleep upstream of Nanhua Bridge or downstream of Hongqiao if you want quiet; riverside rooms in between face the bar strip."
      - "Day boat boards at the **North Gate pier**; the night cruise has its own pier near Wanshou Palace (China for Travelers)."
  - type: tips
    variant: pitfalls
    items:
      - "Riverbank touts offering a cheap private boat are not the licensed service; the price is made up on the spot."
      - "Costume-photo boards (\"all-in ¥199\") end with add-ons; agree what's included first."
      - "Street-sold Miao-village day tours make their money in a silver and medicine shop."
