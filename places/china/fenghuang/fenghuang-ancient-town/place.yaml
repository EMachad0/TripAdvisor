  - type: highlights
    items:
      - title: Stilt houses on the Tuojiang
        text: "Rows of wooden *diaojiaolou* hang over green water on both banks. The best free panorama is the far-bank stretch between the **Wanming Pagoda** and the Feng Bridge."
      - title: Hongqiao and the stepping stones
        text: "The covered **Hongqiao** bridge is free to cross; only its upstairs gallery is ticketed. Below the **North Gate** a line of stepping stones crosses the river: empty early, a queue by mid-morning in busy months."
      - title: The lights
        text: "From about **19:30** the riverfront lights double in the water. **Nanhua Bridge** gives the wide view (Unusual Nomad); after about 22:30 the crowds thin."
      - title: Nine courtyards, if you want them
        text: "The ¥128 ticket covers the **Shen Congwen** and Xiong Xiling residences, halls, the East Gate tower and the Hongqiao gallery. One guide says paying per sight (about ¥20 for Shen Congwen) is cheaper if you skip the boat."
  - type: prose
    title: A one-night plan
    dropcap: true
    text: |-
      **Afternoon.** Arrive on a morning or midday train from Zhangjiajie West, take the Line 1 shuttle to Qifeng Square, and drop your bag. Walk the loop: out through the lanes, across Hongqiao, along the far bank past the Wanming Pagoda, and back over the stepping stones below the North Gate.

      **Evening.** Be on Nanhua Bridge or the far bank around 19:30 when the lights come on. The strip between Nanhua Bridge and Hongqiao is the bar street: a beer there is the social part of the night. If you want the river from the water, the night cruise runs roughly 19:00–22:00 on its own ticket.

      **Morning.** Set an alarm for 06:30. China for Travelers says the mist on the river until about 08:00, with locals washing and fishing below the stilt houses, is what Chinese photographers rate above the lights. Then breakfast, a last walk, and the 16:38 G3376 to Chongqing, or an earlier train back to Zhangjiajie West.
