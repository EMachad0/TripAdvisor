blocks:
  - type: hero
    image: old-town-night
    caption: "The old town and the Tuo River lit up at night (July, not at Christmas)"
    hook: Lanterns on black water, a few bars playing to a half-empty strip, and nobody you know.
  - type: quick_facts
    time_needed: "Christmas Eve + Christmas Day"
