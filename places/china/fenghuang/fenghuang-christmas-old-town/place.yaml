        detail: "2 dorm hostels, 15 reviews since 2024"
      - label: To Chongqing
        value: "One direct, 16:38"
        detail: "G3376, 3 h 47, ¥314 (R$260)"
  - type: highlights
    items:
      - title: The lights don't care what season it is
        text: "The stilt houses and bridges light up every evening around **19:30**, and entry to the town is free. That part of Fenghuang is the same on Dec 24 as in July."
      - title: The bar strip still exists
        text: "Bars between **Nanhua Bridge and Hongqiao** play live music by the water, with posted quiet hours of 23:30 and noise until about 1 am. I found no report of how full they are on a December weeknight."
      - title: A Chinese tourist town, not a backpacker one
        text: "Fenghuang had **21 million visitors in 2024**, about 1% from abroad. Hostelworld lists three places; the two with dorms have **15 reviews between them** since 2024, and two of Border Town's three say it is *not social*."
      - title: The big night is New Year, not Christmas
        text: "On **Jan 1, 2025** the town held a lighting ceremony with Miao drums, a lion dance and shows on the river. Nothing similar was reported for Christmas."
  - type: prose
    title: What Christmas here is honestly like
    dropcap: true
    text: |-
      You guessed right: there is no party hostel. Fenghuang has a bar strip, so you will not be in a silent village. But the bars play to Chinese tourists (about 99% of visitors), and in the cold season the guides describe the town as quiet. Christmas Eve is a Thursday, and I found no bar, inn or church doing anything for it in 2024 or 2025, and nothing announced for 2026.

      The places a foreigner would sleep are small. **Hemu House** has a 10/10 rating and an English-speaking owner who books tickets, but its dorms are two-bed rooms and a Spanish guest wrote it is "not a hostel for solo backpackers". **Border Town** has a rooftop pool table and ¥35 dorm beds on Dec 24, but only three reviews. With so few reviews, you may well be the only foreign guest in either on Dec 24.

      Come for the river and the lit stilt houses, which are lovely and free; go for a beer on the strip and see who is there. If meeting people is the point of Christmas, this is the wrong town. On the 25th, sleep in, walk the town at dawn, and take the 16:38 train to Chongqing on the 26th.
