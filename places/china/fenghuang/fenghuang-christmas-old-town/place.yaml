    note: "The pin is **Hongqiao**. The bar strip runs upstream from here to Nanhua Bridge. The station is about 7.5 km north: shuttle or taxi."
  - type: tips
    variant: insider
    items:
      - "If you do come, stay at Hemu House and ask Veronica, the owner, where people go on Christmas Eve: she knows the town and speaks English."
      - "Watch the lights from Hongqiao first, then drink on the quieter side: below Hongqiao toward Shawan has calmer bars, and above Nanhua Bridge is quietest."
      - "Book **G3376** when sales open, 15 days ahead (Dec 11): it is the only direct train to Chongqing."
  - type: tips
    variant: pitfalls
    items:
      - "Don't pick Fenghuang to meet people at Christmas. Pick it for the river, and spend Christmas elsewhere if company matters."
      - "Ride-hailing barely operates in the old-town core. Plan the trip to the station by shuttle or a metered taxi."
      - "Riverside rooms on the bar strip are loud until about 1 am."
