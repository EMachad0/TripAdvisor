  - type: tips
    variant: insider
    items:
      - "**Getting to Chongqing on the 26th**: in the November timetable, **G3726 leaves Yangshuo at 11:04 and reaches Chongqing West at 15:43 (¥340)**. G2240 leaves 12:39 and arrives 17:05 (¥340). The cheapest, D1838 at 16:34 (¥329), arrives 21:22: too late for the 20:30 drone show."
      - "Guilin has more trains (25 a day, ¥303–470, about 4 h). That's useful if Yangshuo's trains are sold out."
      - "**Yangshuo Culture House** includes a family-style Chinese dinner every evening in the price, the closest thing to a Christmas dinner with strangers."
  - type: tips
    variant: pitfalls
    items:
      - "The station is **not in town**. From the bus stop it's another 15 minutes by golf cart to West Street, so allow time."
      - "Don't come for the river: December is cold and windy, and rafting isn't pleasant."
      - "Seats on the few direct trains on Dec 26 can sell out. Buy as soon as sales open on 12306 or Trip.com."
