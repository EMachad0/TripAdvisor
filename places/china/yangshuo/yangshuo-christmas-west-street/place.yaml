  - type: highlights
    items:
      - title: Bars for every mood
        text: "China Highlights lists folk bars, live bands and reggae: **Kaya Reggae Bar** and **Xiaoma's Sky Folk Bar** near Shuangyue Bridge, plus cocktails at **Mixology Homebar**. There's a night market too."
      - title: A street that speaks English
        text: "West Street has hosted foreign travelers for decades. Guides still say you might hear locals chatting in **English**, which is rare in a Chinese town."
      - title: Karst all around
        text: "Limestone peaks rise straight out of the town. Spend Christmas Day cycling or walking the countryside. The rivers are too cold for rafting."
      - title: A train straight to Chongqing
        text: "**Yangshuo station** has about **10 direct trains** a day to Chongqing. A morning train on the 26th gets you to Chongqing West by late afternoon."
  - type: prose
    title: What Christmas looks like here
    dropcap: true
    text: |-
      Yangshuo was China's backpacker capital, and West Street was its living room. Today it is busier and more commercial, with Chinese tour groups by day. After dark the bars still fill up with music and travelers from the hostels.

      Nobody has announced a Christmas program, and Christmas isn't a holiday in China. So treat it as a bar-street night with travelers. Have dinner at your hostel, then walk the 517 m of West Street. Pick the folk bar with the best singer and stay. On the 25th, rent a bike for the countryside, or stay in town and recover.

      Leave on the 26th. The station is 34 km away, so allow 1.5 h door to door.
