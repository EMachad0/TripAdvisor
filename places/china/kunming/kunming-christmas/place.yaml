    note: "The sleeper costs more than a day's budget, but it replaces a hostel night and is the cheapest way out with a bed. The two days in Kunming themselves cost almost nothing."
  - type: map
    zoom: 14
    note: "The pin is **Green Lake Park**. Wenlin Street is just north of the lake, up the slope from Green Lake North Road. Nanping Street and the Jinma Biji arches are about 1.5 km south-east (Metro Line 2, Dongfeng Square)."
  - type: tips
    variant: insider
    items:
      - "**Getting to Chongqing on the 26th**: the easy way is a sleeper on the 25th. The Nov 12 timetable has **K986** 19:03 → 08:03 and **K692** 20:06 → 09:30, both to Chongqing West: hard sleeper **¥215 (R$178)**, soft sleeper ¥336."
      - "Or a G train on the 26th from Kunming South: **G2872** 08:02 → 13:10 (¥343), **G2868** 09:30 → 14:40 (¥369), **G3474** 10:05 → 15:00 (¥369). The last one that arrives in the afternoon is **G3472**, 11:36 → 16:15 (¥394)."
      - "Flying isn't cheaper. For Dec 26 Trip.com showed **¥452 (R$374)** on Lucky Air, 06:40 → 08:15, and ¥472 on Sichuan Airlines at 06:55. The flight takes about 1 h 35 min."
      - "December timetables can differ from November's. 12306 opens sales **15 days ahead**, so check the real times when Dec 25 goes on sale."
      - "Go to the lake on a clear late morning. Guides suggest a weekday morning or afternoon to avoid the crowd; Dec 24 and 25 are a Thursday and a Friday."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect a Christmas market or a program. Decorations in the centre aren't confirmed for 2026."
      - "Old reports from Christmas Eve mention strangers spraying canned snow at each other around Nanping Street. Police banned unlicensed street vendors from selling it in 2014. Don't wear your best jacket."
      - "The metro starts at about **06:20** and stops at about **22:00–22:30**. Kunming South is 35–45 minutes out on Line 1, so the 07:34 train and the 06:40 flight both mean a taxi before dawn."
      - "Two stations: sleepers leave from **Kunming Station**, most G trains from **Kunming South**. Check the ticket."
  - type: weather
    temp_low_c: 5
    temp_high_c: 16
    conditions: "Dry and mostly sunny; cold as soon as the sun goes down"
    note: "Warmer and far sunnier than Chengdu or Xi'an at Christmas: the lake and the streets are comfortable all day. The difference between day and night is large."
    wear: "Long sleeves and a coat by day; add gloves and a hat at night"
  - type: pairs_well
    items:
      - id: chongqing-drone-light-show
        note: "Arrive 08:03 on Sat Dec 26; the 20:30 drone show that night is likely, not confirmed"
