  - type: highlights
    items:
      - title: Gulls from Siberia
        text: "Black-headed gulls have wintered in Kunming every year since **1985**. About **41,000** were counted across the city in the winter of 2020–21, and Green Lake is the spot right in the city centre: vendors sell bread and the birds snap it up."
      - title: Sun at 16 °C
        text: "Kunming sits at about **1,890 m**. December averages **16 °C** by day and 5 °C at night, with about 195 hours of sunshine and almost no rain. It's one of the two driest months of the year."
      - title: Christmas Eve, honestly
        text: "The crowd has gathered around **Nanping Street**, a 685 m pedestrian street with an evening food market, and the **Jinma Biji arches**. But the reports are old (2010, 2014, 2020), and nothing recent confirms decorations."
      - title: Sleep your way to Chongqing
        text: "**K986** leaves Kunming Station at **19:03** on the 25th and reaches **Chongqing West at 08:03** on the 26th. That saves a hostel night and gives you all of Saturday before the drone show."
  - type: prose
    title: What Christmas is like here
    dropcap: true
    text: |-
      Christmas in mainland China is a shopping-and-going-out night, not a family holiday. In Kunming even that is uncertain. Older accounts describe Christmas Eve around Nanping Street as a crush of people spraying each other with canned snow, with streets turned one-way from 19:00 to midnight. In **2018** police in Panlong district told bars and hotels to take down Christmas decorations. A travel note from 2020, a pandemic year, called the mood "unusually quiet". Nothing newer turned up.

      So come for the daytime. Spend a sunny morning at **Green Lake** with the gulls, then walk up to **Wenlin Street**, the university street beside the lake, where bars and cafes line the slope. On the evening of the 24th walk down to Nanping Street and the arches and see what the city does this year.

      There's no old church to anchor the night. The Catholic cathedral on Beijing Road, rebuilt in 2018, was **demolished in 2021**.
