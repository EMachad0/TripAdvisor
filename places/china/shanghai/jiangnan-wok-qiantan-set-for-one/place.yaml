blocks:
  - type: hero
    image: set-menu-table
    caption: "A Jiangnan Wok table laid with the set menu, in the hotel's own promo photo"
    hook: Yangtze-delta cooking as a set for one, a short walk from the metro.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: "Weekday lunch (UTC+8)"
    extra:
      - { label: Solo, value: "Yes: set for one", detail: "The hotel sells separate sets for 1, 2, 4 and 6 people" }
      - { label: Courses, value: Not published, detail: "Ask when you book; the hotel lists only the price" }
      - { label: Out of place?, value: "No", detail: "Hotel dress code is casual; English on the menu" }
  - type: highlights
    items:
      - title: The only solo-priced set I found
        text: "Most Chinese banquet sets start at two people. This hotel prints a **set menu for single at ¥387** next to its sets for 2, 4 and 6. No stage, no costume. The hotel does not publish the dishes, so email first and ask."
      - title: Huaiyang, not Sichuan
        text: "Huaiyang is the cooking of Yangzhou and Nanjing: knife work, clear soups, braises, river fish and eel. The 2026 menu has **Yangzhou-style sliced bean curd**, **braised pork meatballs** (lion's head), Nanjing duck soup and boneless eel. A calm contrast to Sichuan later."
      - title: An almost-as-good pedigree
        text: "The original Jiangnan Wok in Nanjing has been on Dianping's **Black Pearl** list since 2018 (two diamonds) and in the Michelin Guide in 2025, says the hotel. This Shanghai branch is not on the Michelin star lists I checked."
      - title: Why go over the R$170 day
        text: "About **R$329**, roughly **two days of budget**, for one sit-down regional feast. It's under the €100 ceiling, and a weekday lunch keeps the evening free."
  - type: gallery
    images:
      - { file: dining-room, caption: "The main dining room on Level 7" }
      - { file: private-room, caption: "A private room with a round table" }
      - { file: lions-head, caption: "Lion's head meatball, a Huaiyang classic (photo from another restaurant)" }
      - { file: qiantan-taikoo-li, caption: "Qiantan Taikoo Li and Qiantan Center, next door to the hotel" }
