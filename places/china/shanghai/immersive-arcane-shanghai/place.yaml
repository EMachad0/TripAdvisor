  - type: highlights
    items:
      - title: The Sleep No More format, rebuilt
        text: "Made with **Punchdrunk**, the company behind Sleep No More. You get a **mask**, roam two floors that stand in for Piltover and Zaun, and choose which character to follow (City News Service)."
      - title: Rare one-on-ones
        text: "The creative director says a character might **take you to a small room, lock the door, maybe take off your mask, and whisper their deepest secret in your ear** (DEN interview). Few guests get one, so treat it as luck, not a promise."
      - title: A big cast, up close
        text: "Over **30 performers** do songs, dances, fights and acrobatics around you across a two-level space (China Daily)."
      - title: Cheaper than Sleep No More was
        text: "The spring run sold tickets at **¥499 / ¥588 / ¥688**, and the December round has **¥380** early-bird matinees on Wednesdays, Thursdays and Sundays, 100 a show (票星球)."
  - type: prose
    title: Why this, now that Sleep No More is gone
    dropcap: true
    text: |-
      **Sleep No More Shanghai is over.** Its owner announced in May 2026 that the McKinnon Hotel run would end on **30 August 2026** after its 2,670th show, and Wenhui Daily wrote its farewell in September. The Punchdrunk team's next China show, in Shenzhen, is due in 2027.

      The closest thing left in Shanghai is **Immersive Arcane**, co-produced by the same company in the annex of the Shanghai Hotel in Jing'an. It keeps the mask, the free roaming and the private one-on-ones; the story is the animated series, not Macbeth. It is fully legal: it is theatre, and nothing beyond the show is sold. The catch for you is language: everything is in Mandarin, so watch the series before you go, as the City News reviewer advises.
