  - type: map
    note: "The Maglev concourse is a 3–4 minute walk from the Line 2 platforms at Longyang Road; the ticket counter is there."
  - type: tips
    variant: insider
    items:
      - "Buy the **round trip (¥80) or the ¥85 combo at the counter**. Tapping a foreign Visa or Mastercard at the gate works too, but it charges ¥50 for each ride."
      - "With a **Shanghai transport card**, each ride is ¥40. With your own same-day flight ticket, a single ticket is also 20% off (¥40). Discounts don't stack."
      - "The **Maglev Museum** is on the ground floor of Longyang Road station. The operator lists 09:00–17:30; Chinese Wikipedia says 09:00–17:00 and free with a same-day Maglev ticket, while one 2026 guide says it may charge about ¥10. Go before 17:00 and give it 20 minutes."
      - "Economy is fine. VIP doubles the price on the same train at the same speed."
  - type: tips
    variant: pitfalls
    items:
      - "Some 2026 guides still promise 431 km/h windows in the morning and afternoon. The operator's timetable says **300 km/h all day** in both directions."
      - "Doors close **1 minute** before departure, and ticket checks stop 5 minutes before the last train (21:40 from Longyang Rd, 21:42 from the airport)."
      - "Bags go through an **X-ray check**, and you may be asked to sip from your water bottle."
      - "Line 2 is packed at **08:00–09:30 and 17:30–19:00**. Avoid it with a big backpack."
  - type: weather
    temp_low_c: 3
    temp_high_c: 11
    conditions: "Cool, damp and often grey: about 5–11 °C in December, 3–9 °C in January"
    note: "The ride and the stations are indoors, so the weather barely matters. On a grey day the view out the window is just a flat blur of suburbs."
    wear: A jacket for the walk between the metro and the Maglev hall
