blocks:
  - type: hero
    image: longyang-platform
    hook: "The world's first commercial maglev still hovers at 300 km/h. The famous 431 readout ended in 2021."
    caption: A Maglev train waiting at the platform (2024)
  - type: quick_facts
    time_needed: About 2 h from a central hostel
    best_time: Mid-afternoon, then Lujiazui for the sunset
    extra:
      - { label: Top speed, value: 300 km/h, detail: "Every departure, all day (431 km/h until May 2021)" }
      - { label: The ride, value: About 8 min, detail: "30 km, Longyang Road to Pudong Airport" }
  - type: highlights
    items:
      - title: "300 on the readout"
        text: "A display in each cabin shows the live speed. It climbs to **300 km/h** about two minutes in and holds there. The **431 km/h** runs ended in May 2021 and haven't come back for passengers."
      - title: The passing moment
        text: "If your timing is lucky, the oncoming Maglev flashes past at a closing speed of about **600 km/h**."
      - title: No wheels
        text: "The train floats on magnets above a concrete guideway, covering **30 km in about 8 minutes**. It has carried passengers since 2003."
      - title: "A cheap thrill"
        text: "The operator's **¥85 combo** gets you there and back plus 24 hours of unlimited metro (about R$72). The round trip alone is ¥80."
  - type: prose
    title: How to fit it in
    dropcap: true
    text: |-
      **Not on arrival morning, mostly.** You land at Pudong around 05:10 on 6 December. The first Maglev leaves the airport at **07:02** (official timetable), while Metro Line 2 runs from about 06:00 and goes straight downtown for about ¥8 in 70–90 minutes. You *can* wait for the 07:02 train and pay ¥40 with your same-day flight ticket, but then you change at Longyang Road onto Line 2 with your pack. It isn't the joyride, just a tired transfer, so take Line 2 that morning.

      **Do it as a round trip on another Shanghai day.** Take Line 2 east to **Longyang Road**, buy the round trip at the Maglev counter, ride to the airport and ride straight back. China for Travelers puts the round trip at about 45 minutes; add the metro from Jing'an or Huangpu each way and plan on about **2 hours**. If you later fly out of Pudong, the one-way ride is ¥40 with that day's ticket and the last train leaves Longyang Road at 21:40.

      **Longyang Road isn't downtown.** It's in eastern Pudong. Line 2 west from there goes to Lujiazui, East Nanjing Road, People's Square and Jing'an Temple; Line 7 also reaches Jing'an.

      **Does it earn a day?** On its own, no: it's 16 minutes of riding. It works as a half-day add-on. Ride mid-afternoon, then take Line 2 a few stops back to **Lujiazui** for the sunset (about 16:51) and the Bund lights.
