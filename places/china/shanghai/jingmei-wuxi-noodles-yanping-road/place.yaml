  - type: prose
    title: Wuxi on a Jing'an back street
    text: |-
      Jingmei's menu centres on Wuxi-style pork ribs braised in soy paste. Michelin calls this an "unstuffy stall" serving Wuxi dishes and dim sum as well as noodles, and says the ribs are "loaded in flavour".

      Rachel Gouk's guide says the Yanping Road room is "small and a little cramped but brimming with character", and that the food runs sweet. Ctrip reviewers in 2024 still found a queue at lunch. They also said tables turn over fast and people share them. Be warned that the few Ctrip and Trip.com ratings are low (2.0–2.3 out of 5), and one reviewer called the take-a-number system chaotic.
