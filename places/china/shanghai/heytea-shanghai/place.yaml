  - type: highlights
    items:
      - title: The original new-style tea
        text: "HeyTea opened in **2012** in Jiangmen, Guangdong, as Royal Tea. Its signature is **cheese-foam tea**: a cap of Anchor cheese, milk, cream and salt."
      - title: Real boba
        text: "**Roasted Brown Sugar Bobo Milk** (烤黑糖波波牛乳) is the pearl drink: ¥19 in China, against 7,500 won (about ¥38) in Seoul."
      - title: Two ground-floor shops, one block apart
        text: "New World City has the bigger room with more seats and more staff. The **Shimao Plaza** branch, a 3–4 minute walk down Nanjing Road East, is smaller and hard to sit in."
      - title: Build your own cup
        text: "A DIY option in the mini-program lets you pick tea base, milk, fruit, toppings, temperature and sweetness (one 500 ml size). It was rolling out store by store in 2026, so it may not be offered here."
  - type: prose
    title: Which HeyTea, and how it compares
    text: |-
      HeyTea is everywhere: over 4,000 shops, mostly in China. Go to New World City because it is on the way to everything near People's Square and has room to sit.

      If you want the version you can only get here, the **heytea lab** at **Feng Sheng Li** (丰盛里, 259 North Maoming Road, Jing'an) opened on 28 Feb 2026, the first Lab 2.0 in China. It has tea, cake, gelato and bakery counters and Shanghai-only drinks such as the **Yanlan Chongming Rice Brew** (岩兰·崇明米酿). Whether it also pours the standard boba menu is not confirmed.

      Rivals in one line: **Chagee** sells jasmine milk tea at about ¥20, and **Mixue** undercuts everyone (¥7 lemonade in a 2025 report). HeyTea sits in the middle: fruit and cheese-foam teas, plus one proper pearl drink.

      Beyond Shanghai, HeyTea's own site lists a **Sanlitun teabar in Beijing**, and its Chengdu Raffles store was refitted in Feb 2026 (Digitaling), so you can drink it again later in China. In Thailand it has a **heytea lab at centralwOrld**, Bangkok, its first in the country (opened 25 Sep 2026).
