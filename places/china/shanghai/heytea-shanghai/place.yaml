  - type: tips
    variant: insider
    items:
      - "**How to order**: open Alipay, scan the QR code at the entrance or on the menu, order in the HeyTea mini-program, then watch the screen for your number and collect at the counter."
      - "**English**: in Alipay, turn on Me > Settings > General > Translation Tool to get a floating translate button inside the mini-program. In WeChat, use the three-dot menu > Translation."
      - "**Foreign card**: Alipay and WeChat Pay both accept a linked international bank card (limit US$5,000 per payment); set it up before you leave Brazil."
      - "**Sugar**: regulars ask for 少少甜 or 少少少甜 (less and even less sweet). Look for the hot (热) option in winter; we could not confirm which drinks offer it."
  - type: tips
    variant: pitfalls
    items:
      - "At peak times both Nanjing Road branches were slow to hand over drinks, even at New World City with twice the staff. Budget for a wait after you pay, and grab a seat while you watch the number screen."
