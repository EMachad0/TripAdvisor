    note: "VIP seats are ¥598 lunch / ¥698 dinner, SVIP ¥698 / ¥798 (Oct 2025 list). Bundles with styling run ¥996–1,096."
  - type: map
    note: "From East Nanjing Rd: **Line 2** to Century Avenue, change to **Line 6** towards Gangcheng Rd, to Jinqiao Road: about 45 min from People's Square. From Exit 3, walk 10–15 min to Building 38, EKA·Tianwu park. Dinner ends around 20:10 (UTC+8); last Line 6 train ~22:54 (UTC+8, unverified)."
  - type: tips
    variant: insider
    items:
      - "**Lunch** has better natural light for photos; dinner feels more immersive."
      - "Ask for the **front rows**. Several reviewers say they see best, and the English screens are hard to read from the back."
      - "After the show there is a short photo window. Bring a phone light: the hall is dim."
  - type: tips
    variant: pitfalls
    items:
      - "Avoid seats **beside the pillars**: they block part of the stage."
      - "Reseller prices run well above the venue's: GetYourGuide shows from R$754 (16 Nov) against ¥498 (R$423) for a standard lunch seat. Compare Trip.com before you pay."
      - "Styling takes time. One reviewer says come 1.5–2 h early; others felt rushed through the meal."
