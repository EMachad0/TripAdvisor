blocks:
  - type: hero
    hook: Ten Sichuan courses served between acts of Chinese court history, in a 14-metre-high hall in an old Pudong factory.
  - type: quick_facts
    time_needed: 3–4 h with the metro
    best_time: Weekday lunch, 12:30 (UTC+8)
    extra:
      - { label: Language, value: Little spoken text, detail: "Music and dance; English on screens and on each dish card" }
      - { label: Solo seats, value: One table per guest, detail: "Reviewers booked single seats; front rows see best" }
      - { label: Spice, value: Mild, detail: "Sichuan dishes toned down for Shanghai and foreign guests" }
  - type: highlights
    items:
      - title: Dinner as theatre
        text: "About **100 minutes**: courses arrive between staged acts, from early dynasties to later court styles, with live music, dancers and projections. It ends with a costume parade."
      - title: Built for a solo guest
        text: "Seating is **one person per setting** with its own servings, so you are not squeezed onto a couples' table. Reviewers booked single seats in the third row and front-row centre."
      - title: Mild Sichuan food
        text: "The menu draws on Sichuan's classic flavours but is toned down. Reviewers call it \"mild and palatable\", and the house plum wine is refilled at no charge."
      - title: Dress up if you want
        text: "Over 200 hanfu outfits for men and women in a separate styling building. It costs extra and you can skip it."
  - type: prose
    title: Is it worth R$423?
    dropcap: true
    text: |-
      This is a **splurge**. The cheapest ticket, a standard seat at lunch, is ¥498 (R$423), about two and a half days of your R$170 China budget. A dinner seat is ¥598 (R$508). Those are the venue's own prices from Chinese ticket sites; English resellers charge more (GetYourGuide from R$754), and Trip.com showed no price when checked, so look there first. It counts against the daily budget here: the ticket is mostly the show, and the meal only replaces a cheap dinner you would eat anyway.

      It is worth it if you want **one** big Chinese-history splurge on this trip and nothing else in Shanghai fills that slot. Reviews are close to unanimous: 5.0 out of 5 from 1,653 reviews on Trip.com. Most of the show is music, dance and costume, so not speaking Chinese costs you less than at a play. Skip it if a costumed, photo-heavy show sounds like a tourist trap to you. Normal clothes are fine: the hanfu is a paid extra, not a dress code.

      The cheapest sensible way: **standard seat, weekday lunch, no styling**. If you want the photo, the outfit-only option is ¥198 (R$168).
  - type: faq
    title: Your four questions
    items:
      - q: Is it open to foreigners?
        a: "Yes. Foreign tourists are over 25% of daily guests, and over half on the peak day (China News, Apr 2026). English-language tickets are on Trip.com and GetYourGuide. Bring your **passport**: one reseller's voucher terms ask for it at the entrance."
      - q: How does the dress-up work for men?
        a: "It is optional and paid. Men can rent the **outfit only** for ¥198 (R$168), or take the **men's basic package** (outfit plus make-up) for ¥298 (R$253). A premium package with hair accessories is ¥598. Styling is in a separate building: arrive **1–1.5 h early**. No source shows a men's hat or hairpiece, so ask at the desk."
      - q: Are the shows in Chinese only?
        a: "Mostly there is little to understand: it is music, dance, ritual and costume. The story has **English text on screens**, though one reviewer wanted it nearer the table, and every dish card has an English description. Staff English is limited. Trip.com's ticket lists Mandarin and English service."
      - q: Will I enjoy it without Chinese?
        a: "Probably, if you like spectacle. Foreign reviewers on Trip.com rate it highly and nobody says the language spoiled it. You will miss the finer points of the history, so read up on the dynasties beforehand. Sit **in front** and away from pillars, because the back rows struggle to read the screens."
  - type: book_ahead
    steps:
      - days_before: 7
        text: "Book a **weekday lunch, standard seat** on Trip.com (instant confirmation) or GetYourGuide. Weekend shows go first."
      - days_before: 7
        text: "Want the costume? It is a paid extra; reviewers booked the makeover **in advance**."
      - days_before: 0
        text: "Metro to Jinqiao Road (Line 6), Exit 3. Arrive by **12:00 (UTC+8)** for the 12:30 (UTC+8) lunch show, or 1–1.5 h earlier if you are getting styled."
    passport_note: Bring your **passport** with the voucher; a reseller's terms ask for both at the door.
