blocks:
  - type: hero
    image: covered-walkway
    focus: bottom
    caption: "The covered walkway, December 2015: listings on the ground, people on stools"
    hook: No faces, no names. Just birth year, height, salary and a flat, laid out on the ground by worried parents.
  - type: quick_facts
    time_needed: 1–2 h
    best_time: "Sat or Sun, 14:00–17:00"
    extra:
      - { label: Photos, value: Not of sheets or people, detail: "Parents and brokers object; ask before any close-up" }
      - { label: Language, value: Mostly Mandarin, detail: "Most sheets are in Chinese; Newstalk saw some in English" }
  - type: highlights
    items:
      - title: Résumés without faces
        text: "Each sheet is a child in numbers: birth year, height, education, job, income, **hukou**, flat (owned or rented, how many rooms), car, parents' health, even smoking. A few add a zodiac sign. The sheets carry no photos or names; brokers bring out photos once you show interest."
      - title: A market with districts
        text: "The Paris Review's writer found a seniors' corner, a divorced zone, a Muslim corner, an old-Shanghai corner for families who go back generations, and a \"foreigners'\" corner for Chinese based outside Shanghai."
      - title: Brokers, not just parents
        text: "Many stalls are run by paid matchmakers. One charged **¥100 a month** per listing plus ¥50 per date; another agency **¥300** for three months on display. Seniors born in the 1940s–50s come too."
      - title: Still going last winter
        text: "Reports from **December 2025** and **January 2026** describe it busy on weekends, and singles now come alongside their parents. I found no report of the park stopping it since a 2014 crackdown on unlicensed agencies."
  - type: prose
    title: Why the parents come
    dropcap: true
    text: |-
      The market began in 2004, when retirees in People's Park started setting up their children together. It is now the biggest of its kind in China. Most of the children being advertised are in their thirties or forties, and most are not there: the Paris Review's writer met a father who had told his son to stop driving for DiDi and date instead, a mother hunting a wife for her son in Tokyo, and a group of friends who take turns each weekend to advertise all their children.

      What they trade is security. A **Shanghai hukou** (household registration) decides access to local schools, health care and housing, so many sheets state it, and nearly all ask for it. Parents expect to help buy the couple a flat, and a 2014 Guangzhou Daily report says parents follow the old rule of *mén dāng hù duì* (门当户对): marry within your own class. Wikipedia calls the market an outlet for parents' private worries in a public place; one father in December 2025 feared a single child would age with no one to look after them.

      It has survived official pressure before. In September 2014 the city cracked down on the unlicensed agencies crowding in, and the district greening office said the park would **not interfere** with the corner itself. The brokers stayed. Success is rare, everyone admits; the parents keep coming anyway.
  - type: gallery
    images:
      - { file: crowded-arcade, caption: "A covered walkway on a busy day, listings clipped along both sides" }
      - { file: umbrella-stalls, caption: "Umbrellas double as stalls: one listing on each" }
      - { file: park-and-towers, caption: "People's Park itself, a green block between Nanjing Road and People's Square" }
  - type: quote
    text: "You have to make compromises if you yourself are not perfect. We used to stumble blindly into relationships, and it worked fine!"
    attribution: "A father at the market, Dec 2025, to Becky Zhang (The Paris Review)"
  - type: map
    note: "Show the driver **人民公园 南京西路231号**. Inside, follow the umbrellas and folding stools; the Paris Review found the busiest square by the **north gate**, on the Nanjing Road side. Stephen Leng's guide enters by **Gate 5**, near the metro."
  - type: tips
    variant: insider
    items:
      - "Your landing day, **Sun Dec 6**, is a market day: you arrive at PVG at 05:10, so a nap and an afternoon here works. Otherwise Dec 12–13 or 19–20."
      - "Come after lunch. The Paris Review's writer felt the energy pick up **at three**, and the brokers packed up **around five**. Sunset on Dec 6 is 16:51."
      - "Expect brokers to ask your birth year and degree: the first one asked the Paris Review's writer on sight. A translation app helps; most sheets are in Chinese."
      - "Walk the whole loop: the covered walkway, the umbrellas on the lawns, the square at the north gate. Each corner serves a different crowd."
  - type: tips
    variant: pitfalls
    items:
      - "**Don't photograph the sheets, booklets or parents up close.** They carry real data (phone numbers, salaries). Aunties stop tourists, one guide says, and a broker snatched her booklet back from the Paris Review's writer: \"No photos!\""
      - "Don't hand your **WeChat** or details to brokers. A regular told the Paris Review some sell contact lists in bulk and vanish once paid."
      - "Never post a readable sheet online. If you want a picture, a wide shot of the walkway with no legible text or faces is the polite limit."
  - type: weather
    temp_low_c: 5
    temp_high_c: 11
    conditions: Cool and damp; rain on about 8–9 days in December
    note: "All outdoors, with a covered walkway for drizzle. The market ran in the cold and after rain last December. Heavy rain likely thins it, but no source says by how much: check the forecast and keep a second weekend day in reserve."
    wear: A warm waterproof layer and shoes for wet paving
