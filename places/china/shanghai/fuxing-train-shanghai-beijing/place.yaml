blocks:
  - type: hero
    image: smart-fuxing
    caption: "A CR400AF-Z smart Fuxing"
    focus: "25% 65%"
    hook: "A 164.8 km viaduct, the Yangtze crossing, and your passport as the ticket."
  - type: quick_facts
    time_needed: "4h24–4h26 (G8, G10, G12)"
    best_time: "G8 08:00 or G10 09:00 on Sun Dec 13"
    extra:
      - { label: Fast vs slow, value: "4h26 vs 5h47", detail: "2 stops (Nanjing S, Jinan W) vs 7 on G532, same Fuxing" }
      - { label: Window seats, value: "A and F", detail: "In every class. Avoid B, the 2nd-class middle seat" }
      - { label: On sale, value: "Sun Nov 29, 13:45", detail: "Beijing time, 15 days ahead" }
  - type: highlights
    items:
      - title: 350 km/h, on a screen
        text: "Since September 2017 the Fuxing trains have run this line at **350 km/h**, and the speed shows on screens inside the carriage. Watch it climb out of Shanghai."
      - title: The world's longest bridge
        text: "Out of Shanghai you ride the **164.8 km Danyang–Kunshan Grand Bridge** past Kunshan, Suzhou and Wuxi, including 9 km over open water on Yangcheng Lake."
      - title: Over the Yangtze
        text: "After Nanjing South the line crosses the Yangtze on the **Dashengguan Bridge**, 1,615 m long, with two 336 m spans."
      - title: The smart Fuxing
        text: "On 12306, G8 and G10 carry **智** (smart Fuxing) and offer a premium 1st class (优选一等座, ¥1,522). G12 is a standard **复** Fuxing at the same 2nd-class fare."
  - type: prose
    title: Which train is the real thing
    dropcap: true
    text: |-
      Every high-speed train on this line runs as a G train, and most are Fuxing (复兴号) sets, so what you are really choosing is **how many stops it makes**. On 12306's list for a November Sunday, the four-and-a-half-hour group from Hongqiao is **G8 08:00→12:26, G10 09:00→13:26, G12 10:00→14:24 and G14 11:00→15:31**. They stop only at Nanjing South and Jinan West. G532 at 06:31 uses the same kind of train but stops seven times and takes 5h47. When you book, sort by duration: anything near **4h30 is an express**, anything near **6h is a stopper**. G2 (06:43, 4h49) stops five times.

      The next generation, the 400 km/h **CR450**, was still in testing in March 2026, halfway through the 600,000 km it must run before it carries passengers. I found no report of it in service. Don't plan around it for Dec 13.

      The low numbers (G1–G44) are the express family. The G5xx–G8xx trains are the stoppers. Some fast ones leave from **Shanghai station** instead of Hongqiao (G4 07:00, G16 11:53), and one G28 ends at Beijing station, not Beijing South. Check both station names.
  - type: gallery
    images:
      - { file: danyang-kunshan-bridge, caption: "The Danyang–Kunshan viaduct near Wuxi, the first hour out of Shanghai" }
      - { file: second-class, caption: "Fuxing 2nd class: 3+2 seats, a socket at every seat" }
      - { file: dashengguan-bridge, caption: "Through the Dashengguan truss over the Yangtze" }
      - { file: coupled-fuxing, caption: "Two Fuxing sets coupled at a station platform" }
      - { file: hongqiao-hall, caption: "Shanghai Hongqiao's departure hall" }
  - type: book_ahead
    steps:
      - days_before: 20
        text: "Open a **12306** account on the English site or app and add your passport. It verifies automatically, or you upload the photo page. If it fails, a station ticket counter can verify you."
      - days_before: 14
        text: "**Sun Nov 29, 13:45 Beijing time** (02:45 in Brazil): Dec 13 goes on sale. Book G8 or G10, tick the quiet-carriage option, pick seat **A or F**."
      - days_before: 0
        text: "Be at Hongqiao **30+ min** before departure for the X-ray and body check. Boarding opens about 30 min before. Scan your passport at the gate."
    passport_note: "Your **passport is the ticket**. Book and travel with the same passport; there's no paper ticket."
  - type: cost_breakdown
    items:
      - { label: "2nd class, G8/G10/G12 (fastest)", local: 692, brl: 587.44 }
      - { label: "Metro to Hongqiao (Line 2)", local: 5, brl: 4.24, estimate: true, optional: true }
      - { label: "Or 1st class", local: 1107, brl: 939.73, optional: true }
      - { label: "Or business class (meal included)", local: 2420, brl: 2054.34, optional: true }
    note: "Fares from 12306 for Sun 22 Nov; they float by date and hour. The stopping G532 is ¥576 in 2nd class. It is over the daily budget because it is also your Shanghai → Beijing leg, which you would pay for anyway."
  - type: tips
    variant: insider
    items:
      - "**Cheaper options:** the overnight D8 sleeper (Shanghai 19:08 → Beijing 07:17) saves a hostel night; Seat61 lists D-train berths from about US$86. The T110 is ¥304.5 hard sleeper or ¥177.5 hard seat for 16 hours."
      - "**Flying** on Dec 13 starts at ¥682 on Trip.com, about the same as the train, but from Pudong or Hongqiao airport to Capital or Daxing. The train runs centre to centre and is the ride you came for."
      - "Every Fuxing seat has a **power socket and USB**. Each car has a **boiling-water tap**: bring noodles or tea."
      - "The buffet car is car 5 (8 cars) or 9 (16 cars). Carry **some cash**; it may not take cards."
  - type: tips
    variant: pitfalls
    items:
      - "**Wrong station**: some fast trains use Shanghai station, not Hongqiao, and one G28 runs to Beijing station. The station name is on your booking."
      - "Bags: **20 kg** per adult. They go on the overhead rack or the luggage stack at the end of the car."
      - "The quiet carriage is **2nd class only** and costs nothing extra; pick it when you choose your seat."
  - type: map
    note: "**From central Shanghai:** Metro Line 2 from People's Square or East Nanjing Road goes straight to Hongqiao (Seat61: about 40 min, ¥5). **In Beijing:** Line 4 from Beijing South runs north to Xidan and Ping'anli; Line 14 also stops there. About 40 min to the centre."
  - type: weather
    temp_low_c: -5
    temp_high_c: 4
    conditions: "You leave Shanghai at about 5–11 °C and arrive in Beijing at about −5 to 4 °C"
    note: "The train is air-conditioned, so the cold matters only on the platform and the walk to the metro. Snow north of the Yangtze can bring speed limits and delays."
    wear: "Layers you can peel off on board; the down jacket on top for Beijing"
  - type: pairs_well
    items:
      - { id: dayin-hostel-east-nanjing-road, note: "People's Square, Line 2: one metro to Hongqiao" }
      - { id: beijing-xingshe-youth-hostel, note: "Ping'anli is on Line 4 straight from Beijing South" }
