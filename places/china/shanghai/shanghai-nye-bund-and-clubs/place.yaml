  - type: highlights
    items:
      - title: The Bund, before the crowds peak
        text: "Walk the riverside between the **Peace Hotel** and the Customs House while Pudong's towers glow across the water. It's lit every night, so go early and skip the 20:00 crush."
      - title: INS, a club building
        text: "**INS Land** (109 Yandang Rd) stacks clubs on six floors: hip hop at La Fin, trap at Hush, house and techno at **Dirty House**, K-pop at Culture Club. One all-pass covers them all."
      - title: Or go up, or go underground
        text: "Hotel rooftop countdowns cost **¥198–788** in 2025 (91st floor of the Park Hyatt at the top end). For techno, **Abyss** and **Heim** are the serious picks."
      - title: Late metro, real nightlife
        text: "Six metro lines run late on NYE, and Shanghai's club scene goes until 04:00. It's the most \"party\" NYE of the mainland options."
  - type: prose
    title: What NYE in Shanghai is actually like
    dropcap: true
    text: |-
      First, reset expectations. Since **36 people died in a crush on the Bund on NYE 2014**, Shanghai has held **no public countdown and no fireworks** in the centre. Police seal the riverside to cars from 20:00 and shut the nearest metro stations. The Bund still fills up, but with police lines and one-way flows, not a show.

      So use the Bund as the **warm-up**. Get there by 18:30 via Yuyuan Garden (Line 10, which stays open), walk north for the classic photo, and eat on Nanjing Road East, where more than 30 shops stayed open past midnight in 2025.

      Then go where the actual countdown happens: **indoors**. By 22:30 head to INS or a club you've booked. Countdowns are run by the DJs, and the floor stays full until 04:00.
