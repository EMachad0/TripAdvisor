      - "Do the Bund **18:30–20:00**, then leave before the station closures and crowd controls kick in."
      - "Hostel crowds often go out together on NYE. Ask at check-in; it's the easiest way to meet people for the night."
      - "Clubs only fill up after **23:00**. Pre-drink with the group or eat late on Nanjing Road."
  - type: tips
