blocks:
  - type: hero
    image: museum-facade
    hook: A 4.5-tonne Olmec head and Andean gold, half a world from home, in a museum shaped like a bronze cauldron.
    focus: center
  - type: quick_facts
    time_needed: 3–4 h
    best_time: Weekday morning, first entry slot
    extra:
      - label: On until
        value: Nov 14, 2027
      - label: Good in rain
        value: Yes, fully indoors
      - label: Bring
        value: Your original passport
        detail: The same one you booked with; no photocopies
  - type: highlights
    items:
      - title: Olmec Colossal Head 4
        text: "A **4.5-tonne** basalt face carved around 3,000 years ago, on loan from the Xalapa Museum of Anthropology in Veracruz."
      - title: A Maya king under glass, outdoors
        text: "The 4-metre **Calakmul Stela 51**, showing ruler Yuknoom Took' K'awiil, stands on People's Square in a climate-controlled case."
      - title: Andean gold from Lima
        text: "The 3rd floor holds 325 Andean pieces from Peru's **Larco Museum**, 116 of them shown outside Peru for the first time."
      - title: Huge for a temporary show
        text: "1,129 sets (about 3,000 objects) from 13 Mexican institutions, across more than **7,000 m²** on three floors."
  - type: prose
    title: Why fly to China to see Mexico and Peru
    dropcap: true
    text: |-
      After its record-breaking ancient Egypt show *On Top of the Pyramid*, the Shanghai Museum turned its whole People's Square building over to the Americas. The Mesoamerican galleries (1st and 2nd floors) cover gods, kings and the ball game of the Olmec, Maya and Aztec. The Andean floor (3rd) covers Inca-era gold, silver and ritual art.

      For a Brazilian it's a strange detour that's still worth it. Seeing this much of Mexico's national collection together usually means a trip to Mexico City, Xalapa and Lima. Here it's one ticket and a metro ride.

      The building is a sight too. Architect Xing Tonghe's 1996 museum is shaped like a *ding*, an ancient bronze cauldron: a round top on a square base, for the old Chinese idea of "round sky, square earth".
