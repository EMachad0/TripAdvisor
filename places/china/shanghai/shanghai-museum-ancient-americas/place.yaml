        focus: center
  - type: quote
    variant: vibe
    text: Three thousand years of the Americas, a short walk from the neon of Nanjing Road.
  - type: book_ahead
    steps:
      - days_before: 7
        text: "For a **weekend or Jan 1**, buy on **Trip.com** (pick the Americas exhibition ticket). Enter your **passport number** and pick a dated entry slot."
      - days_before: 3
        text: "For a weekday, 2–3 days ahead is usually enough. Book the **¥135 designated-date** ticket, not the ¥148 full price."
      - days_before: 0
        text: "Bring the **original passport** (not a photo or photocopy) and the QR code. Allow 15 min for the security line."
    passport_note: "Real-name ticket: the passport you show at the gate must be the **same one** you booked with."
  - type: cost_breakdown
    items:
      - label: Designated-date ticket
        local: 135
        brl: 111.6
      - label: Metro there and back
        local: 6
        brl: 4.96
      - label: Shanghai Museum East (Pudong), main galleries
        local: 0
        brl: 0
        optional: true
        note: Free, walk-in with passport, closed Tuesdays
    note: Takes about two-thirds of a China day's R$170 budget. It's worth it as the trip's single biggest museum day. The free East Building covers Chinese bronzes and porcelain on another day.
  - type: map
    zoom: 16
    note: "Use **Exit 1** of People's Square station and walk through the park. Individual visitors enter by the **south gate** on Renmin Avenue."
  - type: tips
    variant: insider
    items:
      - "Budget your energy. The Mesoamerican section (1F–2F) has over 2,600 objects, so leave at least an hour for the smaller **Andean floor (3F)**."
      - "Don't miss **Stela 51**, displayed **outdoors** on People's Square in its own glass case. It's easy to walk past on the way in."
      - "Make it a two-museum trip: **Shanghai Museum East** in Pudong is free and has China's best bronzes and porcelain. It's closed Tuesdays, so don't go on a Monday + Tuesday."
  - type: tips
    variant: pitfalls
    items:
      - "It's **closed on Mondays**. The East Building closes on Tuesdays instead."
      - "Ignore older guides that say the museum is free with no booking. The People's Square building is **ticket-only** until Nov 2027."
      - "Same-day tickets at the on-site office **aren't guaranteed**. Don't count on walking up on a weekend."
  - type: weather
    temp_low_c: 2
    temp_high_c: 9
    conditions: Damp, grey, occasional drizzle
    note: "Fully indoors and heated, so it's a great choice for a raw, wet Shanghai day. The only cold part is the security queue and the walk across People's Square."
    wear: Warm jacket you can carry (there's a cloakroom). Comfortable shoes for 3 floors
