  - type: highlights
    items:
      - title: The other Shanghai bun
        text: "Everyone knows xiaolongbao. Shengjian are the pan-fried cousin with a crisp base, sold in Shanghai's tea houses since the 1920s."
      - title: The 1932 style
        text: "Da Hu Chun makes the **qingshui** kind: fully leavened dough, pleats facing up, and no aspic, so the juice comes from the meat itself."
      - title: Cheap, even for China
        text: "**¥11 for four buns** (about R$9). HK01's July 2026 review puts the average spend at around ¥28 with a bowl of soup."
      - title: A block from the Bund
        text: "The Sichuan Middle Road shop is the one HK01 tells you to pick. Eat, then walk straight out to the river."
  - type: prose
    title: Two kinds of shengjian
    text: |-
      Shanghai's government food guide splits shengjian into two schools. **Hunshui** buns have half-risen dough, pleats down and pork-skin aspic that melts into a hot broth; Yang's Fry-Dumpling (since 1994, ¥13 for four) pushes that to a thin skin and lots of broth. **Qingshui** buns, Da Hu Chun's style since 1932, use fully risen dough, sit pleats up and rely on the meat's own juices. They are cleaner-tasting and more like bread.

      Locals call Da Hu Chun's bun the "naked beauty with pleats facing the sky." Rachel Gouk's guide calls it the "soupless" shengjian, because the fluffy wrapper soaks up most of the juice. Try both styles while you're in town and pick a side.
