      - { label: Solo?, value: Yes, detail: "A noodle counter; one bowl is a meal" }
  - type: highlights
    items:
      - title: Cooked to order
        text: "More than **30 toppings**, each stir-fried when you order it. Michelin says all of them are cooked à la minute, so expect to wait a little."
      - title: The cuttlefish bowl
        text: "Michelin's pick: **cuttlefish with pickled greens**, chewy and crunchy, ¥28. Or go cheap with scallion-oil noodles at ¥11."
      - title: Free refills
        text: "A bowl is 3 liang (150 g) of custom-made noodles, and The Paper says you can ask for more noodles **for free**."
      - title: By the French Concession
        text: "On Sinan Road, about 400 m from Dapuqiao station and about 1 km south of INS Land."
  - type: prose
    title: Thirty years of queues
    text: |-
      Lao Di Fang spent about thirty years on South Xiangyang Road. A January 2024 NetEase food blog put it simply: "30 years of queues, from opening day until today". In June 2023 it moved to 107 Sinan Road, a bigger room with 32 seats. Michelin says the menu and flavours did not change.

      You pick a topping (*jiaotou*) and it is cooked when you order it. Besides the cuttlefish, Michelin points to dark-soy braised pork belly and pork wrapped in tofu skin. Ctrip reviewers on the old site waited about half an hour at lunch.
  - type: quote
    variant: vibe
    text: Wok hiss behind the counter, a bowl of noodles, and nobody in any hurry.
