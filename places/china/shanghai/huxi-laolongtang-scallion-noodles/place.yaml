blocks:
  - type: hero
    hook: Spring onions fried slow until they turn to dark gold, then tossed through noodles with two kinds of soy.
  - type: quick_facts
    time_needed: 30–45 min
    best_time: "10:00 or 15:30"
    extra:
      - { label: Say, value: 葱油拌面, detail: "Cong you ban mian: scallion-oil noodles" }
