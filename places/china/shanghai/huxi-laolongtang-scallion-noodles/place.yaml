  - type: highlights
    items:
      - title: Shanghai's home noodle
        text: "The modern dish was created in **1889** by Chen Youzhi, a snack master at the City God Temple, says the Shanghai government's 2026 food guide."
      - title: Seven yuan
        text: "**¥7 a bowl** (about R$6) at a shop that has been serving the dish for over 40 years, with a generous pile of dried shrimp."
      - title: The toppings are the secret
        text: "That's Shanghai found the plain bowl modest and the **braised pork intestine** and **fried pig liver** toppings the real draw. Trip.com's popular dishes include spicy pork with pickled greens and edamame."
      - title: A queue that moves
        text: "Expect a line at meal times. That's Shanghai saw one 50 people deep at another branch and still ate in under ten minutes."
  - type: prose
    title: Five ingredients and a lot of patience
    dropcap: true
    text: |-
      Scallion-oil noodles go back to the cold noodle dishes of the Tang and Song dynasties, but the Shanghai bowl dates from 1889. The trick is the oil: small spring onions fried slowly in hot oil until they are dry, golden and fragrant. Then the sauce: **light soy** for salt and **dark soy** for colour, often with *kaiyang*, dried shrimp.

      The government guide tells you how to eat it: before the first bite, lift the noodles from the centre with your chopsticks a few times until every strand is coated. At Huxi Laolongtang, add a topping (浇头) and you have a full Shanghainese lunch for very little.
