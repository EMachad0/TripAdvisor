blocks:
  - type: hero
    image: global-harbor-night
    caption: "Global Harbor at night; no free photo of the Chagee counter inside"
    hook: "Jasmine green tea, fresh milk, no pearls: the cup China queues for, in the mall of Chagee's Shanghai flagship."
  - type: quick_facts
    time_needed: 15–30 min
    best_time: Weekday mid-morning
    extra:
      - { label: Pearls, value: "None", detail: "Brewed-leaf milk tea; no tapioca on the menu" }
      - { label: Caffeine, value: Strong, detail: "Real tea leaves; one cup early, or before a night shift" }
      - { label: Branches, value: Everywhere on the route, detail: "Shanghai, Beijing, Chengdu and the rest of the route" }
  - type: highlights
    items:
      - title: The cup that made the brand
        text: "**伯牙绝弦 Boya Juexian** is jasmine green tea with fresh milk, Chagee's signature cup and the one to try first."
      - title: A flagship mall, not a random counter
        text: "Chagee opened two Shanghai **TEA BAR** flagships in June 2023, at Global Harbor and Metro City, with an 8-metre brewing bar you can watch. Metro City is now listed as paused; Global Harbor still has two counters."
      - title: Easy for a foreigner
        text: "A July 2026 review found **English names** on the menu board at the Pudong Airport branch, and paid by scanning the QR code with **Alipay**. Elsewhere, the mini-program or phone translation fills the gap."
      - title: The same cup in every city
        text: "Chagee is in the malls of every big city on the route, from Beijing to Chengdu. If you like it here, you can have it on any day of the China leg."
  - type: prose
    title: Is this bubble tea?
    text: |-
      Not quite, and it is worth knowing before you go. Chagee makes **milk tea from freshly brewed whole leaves**: jasmine green, Da Hong Pao oolong, black tea. It does not use tapioca pearls, jelly or a menu of add-ons. If what you want is a chewy straw full of pearls, this is the wrong shop; what it does better than most is a cup that tastes of real tea.

      **Against the other big names:** HeyTea started China's "new tea" wave with cheese-foam tea and is known for playful, inventive drinks, so go there for something new. Chayan Yuese (Sexy Tea) is the cult brand from Changsha, sold mostly in Hunan and a few other cities, Chongqing among them. Chagee is the steady, tea-forward one that is on every corner.
