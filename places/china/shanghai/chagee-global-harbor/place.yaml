        caption: "Inside Global Harbor, one of Shanghai's biggest malls"
  - type: menu
    title: What to order
    items:
      - name: Boya Juexian (jasmine green milk tea)
        name_local: 伯牙绝弦
        price_local: 18
        price_brl: 15.85
        note: "Regular cup, Pudong Airport, Jul 2026. The one to try first"
        tag: signature
      - name: Da Hong Pao milk tea
        name_local: 白雾红尘
        note: "Roasted oolong with fresh milk, bolder than the jasmine. Good hot; price not confirmed"
        tag: must-try
      - name: Perfume lemon green tea
        name_local: 千峰翠
        note: "Jasmine green tea with fresh lemon, no milk. A crisp iced option; price not confirmed"
        tag: drink
    note: "Most classic drinks run **¥15–22**. Say **热 (rè)** for hot, **少冰** for less ice, **三分糖** for 30% sugar or **半糖** for 50%."
  - type: map
    note: "Use the **underground entrance from Jinshajiang Road station**. Two Chagee counters are in the mall: 1F 1054c by the north entrance, and B1 B1015–B1016."
  - type: tips
    variant: insider
    items:
      - "**Order on your phone:** in WeChat or Alipay search **霸王茶姬** or CHAGEE and open the official mini-program, pick the store, pay with your linked Visa/Mastercard. A foreign phone number is often enough."
      - "**At the counter:** point at the menu board (screen-translate it if there is no English) and scan the shop's QR code with Alipay. *Zhège* (这个, \"this one\") does the rest."
      - "**Landing at Pudong?** The Terminal 2 branch is open 24 hours and sold a regular Boya Juexian for ¥18 in July 2026."
      - "**Closer to the sights:** a Chagee opened in Oct 2025 at the foot of the Oriental Pearl Tower (丰和路211号), handy on a Lujiazui day."
  - type: tips
    variant: pitfalls
    items:
      - "**It is strong.** Trip.com warns that a large cup can bring a racing heart or insomnia. Have it before about 15:00 (UTC+8), or right before a night shift (Dec 28–31 in Chongqing), not on an empty stomach."
      - "A **light-caffeine Boya Juexian** (轻因, about half the caffeine) launched in March 2025; I could not confirm it is still on the menu."
      - "**An empty shop can still mean a wait:** dozens of app orders may be queued at lunch and after work. Check the queue in the mini-program before you pay."
      - "The Metro City (美罗城) flagship in Xujiahui is listed as **paused** on Baidu Maps; don't make the trip there."
