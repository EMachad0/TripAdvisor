  - type: highlights
    items:
      - title: Burlesque, legally and up close
        text: "SmartShanghai lists **showgirl, drag and burlesque** nights and original cabaret productions; That's Shanghai calls the theme **1920s burlesque glamour**. The room is tight and close-up (Nomfluence), with tables around a small stage."
      - title: A new show for 2026
        text: "**After Babylon** is the second chapter of the house's Babylon production, with new characters, costumes and choreography (SmartShanghai), two hours with two intermissions."
      - title: Cheap for what it is
        text: "**¥200** gets you in (about R$171). Reviewers in 2023 called the same price a good deal; the catch is the drinks, about **¥100** a cocktail."
      - title: Inside a historic theatre
        text: "Candor fills the 2nd and 3rd floors of the **Lyceum Theatre**, one of Shanghai's oldest Western-style theatres (SmartShanghai calls it \"the oldest theatre in China\"): a piano lounge below, the stage above."
  - type: prose
    title: The legal version of a themed night
    dropcap: true
    text: |-
      What you liked about Psyche was the costume, the set and the act. In China the version that stays legal is a show: Candor is a cabaret and burlesque lounge, with a bar, a stage and ticketed seats. Nothing beyond the show and the drinks is on sale, and you're a paying audience member, not a client.

      It suits a weekend night in Shanghai: **Fri 11 or Sat 12 Dec at 20:00**. The backup is **Sun 6 Dec at 19:00**, your first day in town; Wednesday the 9th works only if you push Huangshan back. Sun 13 Dec is out: that's your train to Beijing. Buy a standing or shared-table ticket online, then call if you want a table; a ¥500 minimum spend applies to the front tables.
