  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** a licensed cabaret show; nothing beyond the ticket and drinks is sold. For context, buying sex in China carries 10–15 days' detention, up to ¥5,000 fine and expulsion for foreigners (Art. 78, Art. 10 of the 2026 law)."
      - "The ticket doesn't guarantee a seat: without a table booking you may stand for two hours."
      - "Drinks are extra: at about ¥100 each, two or three cocktails roughly double the night's cost. The front-table minimum spend is separate from the ticket."
