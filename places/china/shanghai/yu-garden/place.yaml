  - type: highlights
    items:
      - title: The Grand Rockery
        text: "A **12-metre** mountain of yellow *huangshi* stone in front of Sansui Hall, probably by Ming garden designer Zhang Nanyang. Climb the paths for a view over the roofs."
      - title: The Exquisite Jade Rock
        text: "A **3.3-metre**, 5-tonne boulder riddled with holes. Legend says it was meant for Emperor Huizong's garden and was fished out of the Huangpu after its boat sank."
      - title: Dragon walls and moon gates
        text: "Grey-tiled walls ripple like dragons' backs between the **six sections**, so every doorway frames a new courtyard, pond or pavilion."
      - title: A rebel headquarters
        text: "**Dianchun Hall** (1820) was the base of the Small Swords Society from 1853 to 1855, when rebels held Shanghai's old walled city."
  - type: prose
    title: A garden built for a father
    dropcap: true
    text: |-
      In 1559 Pan Yunduan, a Ming official who had just failed the imperial exams, started a garden so his elderly father could spend his last years in comfort. He called it *Yu* (豫), "pleasing and satisfying to one's parents". Work stalled while he served as governor of Sichuan, and the garden was finished only in 1577.

      It packs about **2 hectares** of Suzhou-style garden into Shanghai's old walled city: halls, pavilions, carp ponds, rockeries and zigzag corridors, each section sealed off by its own wall. The Opium War, the Taiping years and 1942 all left damage. What you see is mostly the 1956–61 restoration, opened to the public in 1961 and a national monument since 1982.

      Outside the walls is the **Yuyuan Bazaar**: neon, souvenir shops, the zigzag bridge and the Huxinting teahouse. It's free and fun after dark, but it isn't the garden. Pay the ¥30, go through the gate, and the noise drops away.
