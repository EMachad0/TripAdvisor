  - type: map
    zoom: 16
    note: "From **Yuyuan Garden station**, walk south to the **north gate** on Fuyou Road. The south gate sits at the end of the zigzag bridge, inside the bazaar."
  - type: tips
    variant: insider
    items:
      - "Be at the gate at **09:00** on a weekday. Winter is the quiet season, and the first hour is the calmest."
      - "Don't skip the **Inner Garden** (内园). It's the quietest section, and many groups rush past it."
      - "Come back after dark for the **bazaar lights**. The garden itself closes at 16:30, but walking around outside is free."
  - type: tips
    variant: pitfalls
    items:
      - "It's **closed on Mondays**. The bazaar stays open, which fools people into thinking the garden is too."
      - "Strangers inviting you to a **\"tea ceremony\"** or an art student show around the bazaar are a well-known scam that ends in a huge bill."
      - "The garden's rules say to buy only through **official channels**. Skip anyone selling tickets outside the gates."
  - type: weather
    temp_low_c: 2
    temp_high_c: 9
    conditions: Damp, grey, occasional drizzle
    note: "Almost all outdoors and the halls are unheated, so it feels colder than the number. The upside: off-peak price, thin crowds and misty ponds. Leave before 16:00, when the light goes."
    wear: Warm layers, a hat and waterproof shoes for wet stone paths
