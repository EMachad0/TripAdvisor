  - type: quote
    variant: vibe
    text: Wet stone, bare willows and a carp surfacing under a moon gate while Shanghai hums outside the wall.
  - type: book_ahead
    steps:
      - days_before: 3
        text: "For a **weekend or Jan 1**, book on **Trip.com** a few days ahead. Pick the visit date, choose **Passport** as the ID type and type the number exactly as printed."
      - days_before: 1
        text: "For a weekday, booking the day before is enough. Buy the **¥30 adult** ticket (Dec–Mar price); students can try the half-price ticket with a student card at the gate."
      - days_before: 0
        text: "Walk in through the **north gate** on Fuyou Road and show your **original passport** and QR code. No ticket? The gate windows also sell real-name tickets with your passport."
    passport_note: "The passport at the gate must be the **same one** you booked with. Photos and photocopies aren't accepted."
