blocks:
  - type: hero
    image: castle-day
    caption: Enchanted Storybook Castle, the largest castle in any Disney park
    hook: Ride the lightcycle where it first launched, then watch the castle light up in winter costume.
  - type: quick_facts
    time_needed: "Full day, 08:30 to the night show"
    best_time: "Mon 7 Dec, at the gate by 08:00 UTC+8"
    extra:
      - { label: Your dates, value: "¥475 Mon–Wed 7–9 Dec", detail: "¥499 Sun 6, Fri 11, Sun 13 · ¥569 Sat 12" }
      - { label: Bring, value: Original passport, detail: "No copies or phone photos; the ticket is tied to its number" }
      - { label: Night show, value: "ILLUMINATE! at the castle", detail: "21:15 UTC+8 on late-Nov days that close at 21:30" }
  - type: highlights
    items:
      - title: TRON started here
        text: "The motorbike-seat **TRON Lightcycle Power Run** first opened in Shanghai on 16 June 2016; Florida got its copy only in 2023. You need to be 122 cm or taller."
      - title: A pirate ride only Shanghai has
        text: "**Pirates of the Caribbean: Battle for the Sunken Treasure** has its own storyline and a magnetic boat system the older Pirates rides never used: Davy Jones, the Kraken, a sea battle and a backwards drop."
      - title: Zootopia and the big castle
        text: "**Zootopia** opened as the eighth land on 20 Dec 2023, with the chase ride **Hot Pursuit**. The 60 m Enchanted Storybook Castle is the largest in any Disney park."
      - title: Winter Frostival
        text: "Snow falls on **Mickey Avenue** in *Mickey's Snow Magic*, a winter parade runs twice a day, and Mickey's tree-lighting ceremony runs in the Gardens of Imagination from 1 Dec to 3 Jan."
  - type: gallery
    feature: false
    images:
      - { file: castle-night, caption: "The castle lit at night, where ILLUMINATE! plays", focus: center }
      - { file: tron-canopy-night, caption: "TRON Lightcycle Power Run's canopy glowing after dark" }
      - { file: tron-train, caption: "A lightcycle train racing under the lit canopy" }
  - type: prose
    title: Which day, and why Monday 7 December
    dropcap: true
    text: |-
      Prices on the official calendar on 23 Nov: **Mon 7, Tue 8, Wed 9 Dec: ¥475 (R$422.37)**, the base tier and the store's "starting from" price. **Sun 6, Fri 11, Sun 13: ¥499 (R$443.71)**. **Sat 12: ¥569 (R$505.95)**, the dearest of your dates. Buy the **Early Bird** ticket at least 10 days ahead and those drop to ¥425 (R$377.91), ¥449 (R$399.25) and ¥519 (R$461.49).

      Pick **Monday 7 December**. It is a ¥475 day, you have had Sunday to recover from the 05:10 UTC+8 landing, and on the official closure list only Roaring Rapids and Explorer Canoes are shut that day (they are shut on every date you are in town). Tuesday and Wednesday cost the same but also lose the Pixar exhibit and the Mickey's Storybook Adventure stage show, and on Wednesday you leave for Huangshan.

      Do not count on weekday crowds being much thinner. Queue-Times' crowd calendar for December 2025 shows Mon–Thu in the first half of the month about as busy as the weekends. In December weather will matter more than the day of the week, so check the forecast and swap between the 7th and 8th if one of them looks rainy: the ¥475 tickets allow two date changes up to 48 hours before (on the plain ticket a date change ends any refund).
  - type: prose
    title: Buying as a foreigner
    text: |-
      Tickets are **real-name**: you type your **passport number** when you buy, it cannot be changed later, and at the gate staff check the **original passport** at the manual turnstiles. Copies and digital versions are refused. Buy on the official English site or app, or from a company on Disney's official partner list, which includes Shanghai Ctrip (Trip.com). Klook was not on that list on 23 Nov.

      One May 2026 guide says the official app takes international credit cards but that payment can ask for an SMS code that some foreign numbers never receive. If that happens, use Trip.com. Dated tickets go on sale about 30 days ahead: on 23 Nov the calendar ran to 22 Dec, and every one of your dates was available.

      **Three tickets for 7 Dec.** The **¥475 ticket with a free ¥88 dinner coupon** (one combo meal after 16:00 UTC+8 at selected counters): no refund, but two date changes. This is the pick: you will eat dinner in the park anyway. The **¥425 Early Bird**: buy by 27 Nov, never refunded or moved. The plain **¥475 ticket**: free refund online until 23:59 UTC+8 on 30 Nov (21:00 UTC+8 by phone), ¥80 fee after, none on the day.
  - type: book_ahead
    steps:
      - { days_before: 10, text: "**Fri 27 Nov** is the last day to buy the ¥425 Early Bird ticket for Mon 7 Dec (official site, passport number, no refunds)." }
      - { days_before: 7, text: "Or buy the ¥475 ticket with the free **¥88 dinner coupon** (two date changes, no refund) any time before the day." }
      - { days_before: 1, text: "Install the **Shanghai Disney Resort app** and add your ticket: wait times, show times and Premier Access are all in it." }
      - { days_before: 0, text: "Take Line 11 to Disney Resort, show the **original passport** at the manual turnstile, and let them take your entry photo; refusing it blocks Premier Access and re-entry." }
    passport_note: "Bring the **same physical passport** you typed in when you bought the ticket. A screenshot of the order helps; it does not replace the passport."
  - type: cost_breakdown
    items:
