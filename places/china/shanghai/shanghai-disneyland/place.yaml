      - { label: "Metro there and back (¥3–10 each way)", local: 20, brl: 17.78, estimate: true }
      - { label: "Quick-service lunch (¥51–100 counters)", local: 100, brl: 88.92, optional: true, estimate: true }
      - { label: "Snack from a cart (popcorn, churro)", local: 40, brl: 35.57, optional: true, estimate: true }
