  - type: prose
    title: What the day costs, said plainly
    text: |-
      Ticket and metro come to about **¥495, R$440**: two and a half days of the R$170 "everything else" budget in one go. With the ¥425 Early Bird it is ¥445, R$396. Food is budgeted separately, but count on ¥150–220 for two quick meals and a snack in the park, so the full day is roughly **¥645–715, R$575–635**.

      Shanghai is the only park with this TRON's original and this Pirates ride. It is worth one splurge day, and only one. The dinner coupon takes about ¥88 off the food side. Skip the big Premier Access sets: the Carefree Set of 8 makes the ticket **¥1,574 (R$1,399.60)**, more than eight days of budget.
  - type: tips
    variant: insider
    title: One day, in this order
    items:
      - "Be at the gate before the 08:30 UTC+8 opening (late-Nov hours; check the app for 7 Dec) and walk straight to **TRON** in Tomorrowland before its queue builds."
      - "Then **Zootopia: Hot Pursuit**; use its **single rider** line if the main queue is long. **Seven Dwarfs Mine Train** has a single rider line too."
      - "Late morning: **Soaring Over the Horizon** (Great Wall and Shanghai skyline in the film), then **Pirates** in Treasure Cove; the stunt show *Eye of the Storm* plays there most of the day."
      - "Afternoon: Peter Pan's Flight and Seven Dwarfs in Fantasyland, the 14:15 UTC+8 winter parade if you want it. Eat at a ¥51–100 counter (Barbossa's Bounty, Stargazer Grill)."
      - "Dusk: *Mickey's Snow Magic* on Mickey Avenue (17:45 and 19:15 UTC+8 in late Nov), then hold a spot at the castle for **ILLUMINATE!**, listed at 21:15 UTC+8 on late-Nov evenings; check the app for 7 Dec."
  - type: tips
    variant: pitfalls
    title: Premier Access and other traps
    items:
      - "**Premier Access** (paid skip-the-line) is sold only on Disney's own site, app, WeChat and Fliggy; single rides only once inside. Cheapest on 7–9 Dec: the ¥655 bundle, **¥180** over the ticket for Zootopia plus a free Pooh. **Skip it**: Zootopia has a single rider line."
      - "Bag limit **56 × 36 × 23 cm**, and no wheeled luggage of any size. A 40 L backpack may be too deep: leave it at the hostel or pay ¥80 at the luggage storage opposite Wishing Star Park's West Gate."
      - "Outside food is allowed if it needs no heating or cooling and doesn't smell: no instant noodles, no durian. **No alcohol, cans or glass bottles, no selfie sticks or tripods.**"
      - "Park counters run on Alipay or WeChat Pay; one guide says foreign cards are rarely taken inside. Set up Alipay with your card before the day."
  - type: faq
    title: Arriving at 05:10 on Sunday 6 Dec?
    items:
      - q: Can I go straight from Pudong Airport to Disney on the arrival morning?
        a: "Possible, not sensible. The official site gives 30–50 min by taxi or 80–90 min by metro from PVG, and Line 11's first train reaches Disney at 07:08 UTC+8, so you could be at the gate for an 08:30 UTC+8 opening. But Sunday is a ¥499 day, you would carry your 40 L bag (¥80 at the luggage storage; wheeled bags are banned) and spend 13 hours on your feet after a long-haul night flight. Sleep, and go on Monday at ¥475."
      - q: How do I get there from East Nanjing Road or Jing'an, and back?
        a: "Metro: Line 2 to Longyang Road, Line 16 to Luoshan Road, Line 11 to Disney Resort, about 50–60 min from East Nanjing Road; one guide says ¥3–10 each way, by distance. From Jing'an Temple it is the same Line 2 route, about 55 min (Rome2Rio). Last Line 11 trains leave Disney at 22:00–22:30 UTC+8 depending on the branch, so you can stay for the night show."
  - type: map
    note: "Line 11 ends at **Disney Resort**: Exit 1 or 4, 5–10 min walk. Taxis stop at the **West Public Transportation Hub**. **Free, no ticket:** Disneytown (Christmas Market this winter) and lakeside Wishing Star Park (10:00–17:00 UTC+8 on late-Nov weekdays)."
  - type: weather
    temp_low_c: 5
    temp_high_c: 11
    conditions: "Cool, often grey; about 8 rainy days in December"
    note: "December averages 5–11 °C, and you are outdoors and standing in queues for 12 hours, colder once the sun sets around the night show. Shows can be delayed or cancelled for rain, wind, fog or poor air, so check the forecast and use a date change (up to 48 h before) if 7 Dec looks wet."
    wear: "Warm layers, a windproof jacket, gloves for the evening; light rain jacket"
  - type: pairs_well
    items:
      - { id: dayin-hostel-east-nanjing-road, note: "East Nanjing Road: Line 2 → 16 → 11, about an hour to the gate" }
      - { id: shanghai-maglev, note: "Maglev from PVG to Longyang Road, then Line 16 → 11" }
      - { id: shanghai-christmas-markets, note: "Disneytown has its own Christmas Market and tree trail this winter" }
