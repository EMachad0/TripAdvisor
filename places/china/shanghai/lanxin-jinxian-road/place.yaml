blocks:
  - type: hero
    hook: "Soy, rock sugar and pork belly braised until it trembles, in a room the size of a living room."
  - type: quick_facts
    time_needed: "1 h, plus the queue"
    best_time: "At 11:00 or 17:00 sharp"
    extra:
      - { label: Style, value: Benbang (本帮菜), detail: "Shanghai's own 'thick oil, red sauce' home cooking" }
      - { label: Queue, value: Up to 90 min, detail: "No reservations, per a 2025 guide" }
      - { label: To INS Land, value: About 1 km, detail: "Straight line to Fuxing Park" }
  - type: highlights
    items:
      - title: The real benbang taste
        text: "Benbang is Shanghai's own cooking: soy sauce, sugar, slow braising. Diners on Trip.com call Lanxin's \"thick oil and red sauce\" the taste of their grandmother's kitchen."
      - title: Thirty years on one street
        text: "Sohu (Jan 2026) calls it the oldest of Jinxian Road's benbang shops: **30+ years** and eight years running in the Michelin Bib Gourmand list."
      - title: Priced for one
        text: "Michelin puts it in its cheapest **¥** band. One plate of pork plus rice is a full meal for one person."
      - title: Dinner before INS
        text: "Jinxian Road is about a kilometre from Fuxing Park. Eat at 17:00, walk it off, and be at INS Land when it gets going."
  - type: prose
    title: Order like a regular
    text: |-
      Lanxin is a small, plain room. A 2021 Trip.com reviewer says the walls are covered with food awards and that you can order by following the stars on the menu. The dishes every source names are **红烧肉** (red-braised pork belly), **油爆虾** (river shrimp flash-fried in a sweet glaze), **酱爆猪肝** (pork liver in sweet bean sauce) and **草头** (wine-tossed clover greens), which one regular orders every visit.

      Eating alone, order one main plus rice, and the greens if you're still hungry. The pork is the dish to come for.
