  - type: tips
    variant: insider
    items:
      - "Be at the door at **11:00** or **17:00**. A Qunar diner who arrived at 11:00 sharp found three tables already eating; another who came back after the evening rush found no queue."
      - "Line too long? **Maolong (茂隆)** at No. 134 and **Chun (春)** a few doors away are the street's other benbang shops (Sohu, 2026)."
  - type: tips
    variant: pitfalls
    items:
      - "Don't plan this as a quick bite: a 2025 guide waited 90 minutes for a table."
      - "Benbang is sweet. If you want it less sweet, Urban China Travelogue suggests asking \"shǎo fàng diǎn táng\"."
