  - type: map
    note: "Search **漾·SPACE汤泉生活** in Amap; Ummi warns that Google Maps is offset in China. The pin marks Pudian Road, not the door."
  - type: tips
    variant: insider
    items:
      - "**Passport:** carry it. IntoChinaTrip says foreign guests must be registered and that some venues can't register foreign passports for overnight stays, so ask before you pay."
      - "**Tattoos:** China has no Japan-style blanket ban (bswen), but venues can set their own rules. I found no tattoo rule for Yang·SPACE: if yours are large, message first."
      - "**Overnight:** ask whether your ticket includes the night (过夜, *guòyè*) and breakfast. Guides say some venues add an overnight fee, and SCMP reports stays are capped at 24 hours."
      - "Don't eat a big dinner first; the fruit is the point."
      - "**Alternative:** Shuiguo (水裹) Wujiaochang, 13,000 m², about ¥300 for 8–16 hours with unlimited food and drinks (Shanghai government, April 2026)."
  - type: tips
    variant: pitfalls
    title: Family bathhouse or something else?
    items:
      - "Signs you're in the right kind of place (my reading of the guides): a big chain with a public ticket price on Trip.com, Klook or Meituan, a fruit bar and families in the lounges. SCMP describes a British couple bringing their child."
      - "Start with a well-known chain and check Amap ratings and comments (MyChinaGuide's advice)."
      - "Walk out of any place that offers a 'special' massage in a private room or adds services you didn't order. Prostitution is illegal in China, and a law firm reports foreigners being shaken down by fake police after 'massages'."
      - "Scrubs and massages are normal paid extras at real bathhouses (bswen): they go on your wristband, so ask the price before you say yes."
