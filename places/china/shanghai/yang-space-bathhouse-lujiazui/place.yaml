blocks:
  - type: hero
    hook: Soak, sauna, eat mango in pajamas, sleep on a recliner, shower, repeat.
  - type: quick_facts
    time_needed: 6 h to overnight
    best_time: Evening, then stay the night
    extra:
      - { label: Bring, value: Passport, detail: "Foreign guests may need to register; carry the physical passport" }
      - { label: Swimsuit, value: Not worn, detail: "Bathing areas are single-sex and nude; pajamas everywhere else" }
      - { label: Sleep, value: Recliner or cubicle, detail: "First come, first served; blankets, earplugs, eye masks given" }
  - type: highlights
    items:
      - title: The fruit
        text: "Ummi Goes Where describes bowls of berries, mango, golden kiwi, dragon fruit and cherries that are refilled as soon as they empty, plus free juices, coffee, scoop ice cream and one free herbal tea."
      - title: A whole night inside
        text: "Hot pools and saunas downstairs; upstairs a salt room, games room with pool tables, mahjong rooms, a small cinema, phone-booth karaoke and reading rooms."
      - title: It can replace a bed
        text: "Ummi slept on a recliner with its own charging port and called it nicer than some hostels. Her overnight package included breakfast."
      - title: Pure China, not a Western spa
        text: "Shanghai's government reports foreign tourists 'luggage in tow' flocking to the city's bathhouses. It's the everyday local version, not a resort day."
  - type: prose
    title: Your first time, step by step
    dropcap: true
    text: |-
      **1. Pay and get a wristband.** At the desk you pay the entry (walk-ins are fine; Trip.com and Klook also sell tickets) and get a waterproof wristband. It opens your locker and anything you order goes on it; you settle up when you leave.

      **2. Shoes off, then split.** Shoes go in a shoe locker and you get slippers. Men and women then go to separate changing rooms with more lockers.

      **3. Shower, then soak.** In the bathing area everyone is naked. Shower properly before any pool. Yang·SPACE asks for a **shower cap** and long hair tied up (both provided). No cameras here.

      **4. Pajamas and upstairs.** Staff hand you pajamas, and the mixed areas upstairs are for fruit, games, films and naps. Meals from the restaurant cost extra.

      **5. Sleep, shower, check out.** Claim a recliner or a curtained cubicle early; spots aren't assigned. In the morning, a last soak, then pay the wristband at the desk.
  - type: quote
    variant: vibe
    text: Pajamas, a plate of golden kiwi, and the whole of Pudong asleep outside.
  - type: cost_breakdown
    items:
      - { label: "Base ticket (around ¥299; prices vary by day and time)", local: 299, brl: 247.18, estimate: true }
      - { label: "Overnight surcharge, if charged (¥30–69 at venues generally)", local: 69, brl: 57.04, optional: true, estimate: true }
