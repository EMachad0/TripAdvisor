    note: "Market streets are **Yuanmingyuan Road** and Huqiu Road behind the north end of the Bund. Paulaner is across Suzhou Creek at 500 Dongdaming Road."
  - type: tips
    variant: insider
    items:
      - "Pre-buy the **¥30 ticket** on the SmartShanghai mini-program in WeChat (needs a working WeChat Pay)."
      - "Weekday afternoons (Wed–Fri, 15:00) are the calmest. Dec 24 evening is the busiest."
      - "Save money with the **free** Kerry Centre or BFC markets for photos, and pay entry only at one German market."
      - "**Getting to Chongqing on the 26th**: fly. On Nov 10, Trip.com showed Juneyao 07:25 → 10:40 and Air China 07:40 → 10:40 from Pudong for **¥632 (R$522)**, and China Eastern 09:30 → 12:40 for ¥732. The airport rail link takes about 60 min to downtown, so the afternoon arrival is realistic."
      - "**By train instead**, you give up Christmas night. In the Nov 12 timetable, sleeper D982 leaves Hongqiao at 18:22 and reaches Chongqing North at 05:25 (berth ¥700, seat ¥544). D57 leaves Shanghai South at 19:40 and arrives 12:51 (berth ¥438, seat ¥292)."
  - type: tips
    variant: pitfalls
    items:
      - "Closed **Mondays and Tuesdays** in 2025. Don't plan the 22nd or 23rd blind."
      - "The Bund market ended **Dec 28** in 2025, so it's no help for NYE."
      - "Glühwein adds up fast. Two mugs cost more than a day of metro and street food."
      - "No day train on the 26th works. The earliest, G3390, leaves Hongqiao at 07:04 and reaches Chongqing North at 16:57 for ¥824; every other one arrives after 18:00."
      - "The ¥632 fare is what Trip.com showed on Nov 10 for Dec 26. Fares move daily, and the train times are from a November timetable."
