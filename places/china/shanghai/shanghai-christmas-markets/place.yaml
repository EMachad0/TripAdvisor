  - type: highlights
    items:
      - title: The big German one
        text: "**Christkindlmarkt on the Bund**: more than 40 wooden chalets in the old Rockbund streets, ¥30 if you pre-buy on WeChat, ¥40 at the door. Santa came on Dec 25–26."
      - title: Paulaner's North Bund market
        text: "Shanghai's longest-running Christmas market (19th edition in 2025). **¥50 entry that you spend on food and drink**, open 13:00–22:00 on Dec 24–25."
      - title: Free mall markets
        text: "**Jing An Kerry Centre** ran a free market daily until Jan 1, and **BFC** on the Bund had free weekend markets plus an ice rink (¥39.9 for 90 min)."
      - title: A social Christmas Eve
        text: "Christmas is a **date night** for young Shanghainese, so malls and Nanjing Road are packed. The expat crowd lives at the markets and bars. Good night to go out with people from your hostel."
  - type: prose
    title: How to do Christmas Eve here
    dropcap: true
    text: |-
      Arrive at **Yuanmingyuan Road** around 16:00, when the market has warmed up and dusk is coming. Grab a glühwein, walk the chalets, then at 17:30 cut through to the Bund for the riverside lights. It's 2 minutes away.

      For round two, take a taxi or metro to **Paulaner** on the North Bund (2/F, 500 Dongdaming Road). There the ¥50 entry comes back as food and beer vouchers, and it stayed open until 22:00 on Christmas Eve in 2025.

      Then go back to the hostel. A shared Christmas with dorm-mates from half a dozen countries is a backpacker classic. **Ask at check-in** whether they're doing a dinner, a party or a pub crawl. None are confirmed for 2026.
