  - type: highlights
    items:
      - title: Columns that turn into trees
        text: "Most buildings hide their columns. Here **up to 1,000** of them rise through the façade and end as planters, with more than **70 tree species** on top (Metalocus)."
      - title: A mall shaped like hills
        text: "Dezeen called it two **tree-covered mountains** on the Suzhou Creek bank. Up close it reads like a stepped ruin taken over by a garden."
      - title: Cheap food inside
        text: "At the 2021 opening, B1 had a supermarket, KFC and Daoxiangcun and **L5 a food hall**; tenants change, so check. Lao Wall Root hotpot on L6 is listed in 2026."
      - title: M50 next door
        text: "The M50 galleries in an old textile mill are about **five minutes' walk** away; Jade Buddha Temple is about 15 minutes further."
  - type: prose
    dropcap: true
    text: |-
      Thomas Heatherwick's studio was given a plot beside the M50 art district and asked for a mall. Its answer was to show the columns instead of hiding them: each one climbs the stepped façade and finishes as a pot with a tree in it. The first phase opened in December 2021; the second phase next door is due at the end of 2027.

      As a mall it is small and its shops come and go, says Travel of China. The building and the creek are the reason to come. Walk the outside first, from the Suzhou Creek side, where the two hills are clearest. Then go in and ride up through the floors.

      It costs nothing and sits on Line 13, so it fits a short afternoon before a work night or a slow first day in Shanghai. Stay until dusk if you can: the trees are lit after dark, though no switch-on time is published.
