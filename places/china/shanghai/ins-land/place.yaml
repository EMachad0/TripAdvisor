  - type: tips
    variant: insider
    items:
      - "Go **Sunday to Thursday** for the ¥168 pass: Fri/Sat is ¥288. Your first Shanghai nights (Sun Dec 6 to Wed Dec 9) are all weeknights."
      - "Want techno, not Top 40? Dirty House is the small room with good sound, says SmartShanghai."
      - "Come with your hostel crew: the app lets friends find each other inside, DJ Mag says, and you will get lost."
  - type: tips
    variant: pitfalls
    items:
      - "Bring your **passport**: ID is checked at the ground-floor entrance."
      - "Qunar lists no pass for **Monday**, although SmartShanghai says INS opens daily. Check the price on the day if you go on Mon Dec 7."
      - "La Fin is a table club. SmartShanghai: if you're not buying a table package, \"you are probably not the audience\"."
