blocks:
  - type: hero
    image: tower-night
    caption: "The INS Land building lit up at night on the edge of Fuxing Park"
    hook: A former karaoke empire turned into a six-floor club tower, where every floor is a new level of the game.
  - type: quick_facts
    time_needed: 4–6 h
    best_time: "Arrive 22:00–23:00"
    extra:
      - { label: Floors, value: "Six (staff joke: 6, 7 or 8)", detail: "10 dancefloors and dozens of venues, per DJ Mag" }
      - { label: At the door, value: ID check, detail: "Passport; one guide says a copy or phone photo was accepted" }
  - type: highlights
    items:
      - title: One ticket, many clubs
        text: "Wikipedia says one entry covers **10 nightclubs**. Ride the escalators floor by floor: hip hop at La Fin, trap at Hush, house and techno at **Dirty House**, K-pop at Culture Club."
      - title: Famous for a reason
        text: "INS entered DJ Mag's Top 100 Clubs at **No. 12** in 2026. SmartShanghai calls it the main commercial clubbing destination in Shanghai."
      - title: A mixed crowd
        text: "SmartShanghai's October 2026 guide: the crowd \"leans local, but there's a heavy international contingent\" and is young."
      - title: Built by gamers
        text: "The founders come from Hero Esports. Once inside, DJ Mag says, you try to win drink tokens on arcade games; an app that maps the building and lets friends find each other."
  - type: prose
    title: How a night works
    dropcap: true
    text: |-
      INS opened in June 2023 inside Fuxing Park, a century-old French-era garden. DJ Mag says the company spent about US$100 million turning a shuttered karaoke empire into 20,000 m² of clubs, bars and odd attractions. On its biggest nights more than 80,000 people pass through.

      You pay once at the ground floor, where your ID and ticket are checked, then work your way up. The **all-pass** is the deal: one 2026 guide puts single-club tickets from about ¥88 on weekdays and says the pass is better value once you visit two or more. On Qunar the pass costs **¥168 Tuesday–Thursday and Sunday** and **¥288 on Friday and Saturday**.

      The metro has stopped by the time you leave, so plan a DiDi home. SmartShanghai says INS is open daily and busy even on weeknights.
