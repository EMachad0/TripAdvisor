    social:
      - "The lobby is a **craft beer hall**, café and book bar in one. Reviewers praise the taps and a cheap, well-stocked bar."
      - "\"Definitely the most social hostel I've stayed at in China\" (July 2026). \"Super social bar area, made great friends\" (Jan 2026)."
      - "One April 2026 guest \"went out with people from the hostel group chat\"."
      - "Hostelworld lists a rooftop bar, foosball, board games and game consoles."
      - "**Honest caveat:** a May 2026 guest found no organised events or group chat, and several reviews mention long-term residents and a dead vibe some nights."
    good_to_know:
      - "Separate male and female dorms; card-access lockers; free luggage storage."
      - "Big: one guest counted 50+ dorms and rooms. Several say the dorms are windowless and compact."
      - "Some reviewers found the mattresses thin; one asked for a second and got it."
      - "No page states the foreign-passport rule; 2026 guests came from Australia, the UK and the US."
  - type: highlights
    items:
      - title: The bar is the lobby
        text: "You walk in through the beer hall. Guests in 2025–26 describe a good vibe every night, \"not rowdy\", and a place to meet people over a beer."
      - title: Bigger crowd than Desti
        text: "**483 Hostelworld reviews** against Desti's 139, and 8,576 on Ctrip. More guests means more chances to find a group for INS on a given night."
      - title: Central for everything else
        text: "30 m to the Nanjing Road pedestrian street, about 800 m to the Bund (hostel's own figures) and 320 m to People's Square metro."
      - title: Straight from the airport
        text: "A 2026 guest says it's a 5-minute walk from the airport metro line, and another had staff help load bags into a taxi at 05:00."
  - type: prose
    title: Why this one, and not a party hostel
    text: |-
      Shanghai doesn't have a real party hostel. Of the names people still mention, **Meego Yes** is on Hostelworld but its review summary calls it "quiet and not very social". **WeFlow Xintiandi** is the closest to INS Land, but its atmosphere score is 7.2 and cleanliness 6.3. Blue Mountain, The Phoenix, Rock&Wood and Mingtown weren't among Hostelworld's 26 Shanghai listings when I searched on 11 Nov.

      That leaves this Dayin and Desti in Jing'an. Desti scores higher on atmosphere (8.9 against 8.4) and is ¥50 cheaper. Dayin has the bigger crowd, a bar inside the building and the central location. If finding a group for clubbing matters more than a quiet dorm, stay here. If you'd rather save money and have a calmer room, stay at Desti.
  - type: book_ahead
    steps:
      - { days_before: 4, text: "Book on Hostelworld while free cancellation is still open. Choose the 8-bed male or female dorm for the lowest price." }
      - { days_before: 3, text: "The hostel's rule: after this point a cancellation or no-show costs the first night." }
      - { days_before: 0, text: "Check in from 14:00 with your **passport**. If you arrive early, leave your bags at the 24 h reception and ask whether a bed is ready." }
    passport_note: "Bring the passport itself to check in."
  - type: map
    note: "From People's Square station walk about 320 m to Liuhe Road, at the west end of the Nanjing Road pedestrian street. For INS Land, take a taxi or DiDi to Fuxing Park (about 2.1 km in a straight line)."
  - type: tips
    variant: insider
    items:
      - "Landing at 05:10 means reaching the hostel hours before the 14:00 check-in. Drop your bags, go eat, and come back. If you need a bed at 07:00, the only sure way is to also book the night of **Dec 5**."
      - "On your first evening, sit at the bar and ask who's going to INS. Reviewers who met people did it there, not in the dorms."
      - "Price check: the same dorm costs about ¥50 less at **Desti** (¥108) if the bar crowd turns out quiet."
  - type: tips
    variant: pitfalls
    items:
      - "Hostelworld shows the price without tax and lists 16%, but the hostel says taxes are included. Budget up to ¥183 a night until you see the bill."
      - "Cancel at least 3 days ahead, or you pay the first night."
      - "Dorms can be windowless and tight. Keep your suitcase small or use the luggage room."
