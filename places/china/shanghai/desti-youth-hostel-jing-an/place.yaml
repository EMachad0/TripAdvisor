    good_to_know:
      - "Dorms are split into male and female rooms. Beds are capsule-style bunks with curtains."
      - "Key-card access, large lockers, lift. Linen and towels are included."
      - "Paid washing machines and dryers."
      - "Pay the balance on arrival in cash or by card. No curfew. No children."
      - "No page states the foreign-passport policy, but 2026 reviews come from guests of a dozen countries."
      - "Not in the tourist centre: Line 7 is one stop from Jing'an Temple, and most sights need a change of line."
  - type: highlights
    items:
      - title: Among the best-scored in town
        text: "**9.5 from 139 Hostelworld reviews**, with 9.8 for cleanliness and 10 for security. Only two smaller hostels score higher, on far fewer reviews. Ctrip guests give it 4.7 out of 5 across more than 1,100 reviews."
      - title: A bar you don't have to look for
        text: "The hostel shares its front with 2Dollars Café & Bar. One guest wrote that a lot of the Westerners hang out there rather than inside, so go there first."
      - title: Pod-style beds at dorm prices
        text: "Curtained capsule-like bunks from **¥108 (R$89)**. Guests praise the privacy and the sleep."
      - title: Opened in 2025
        text: "Everything is new: bathrooms with separate wet and dry areas, hotel-grade bedding, a common room with sofas and soundproof booths."
  - type: prose
    title: Why this one
    text: |-
      Shanghai has no real party hostel. The two places where foreign backpackers actually gather are this one and the much bigger Dayin on East Nanjing Road. I picked Desti because it scores higher on atmosphere (8.9 against 8.4), is far cleaner, costs about ¥50 less a night and has a bar at the door.

      Reviews from 2026 are split. Some say "good social life" and "everything is made so that we can easily meet new people"; others say "people keep to themselves". The pattern in them is clear: the dorms and the common room are calm, and the meeting happens at the bar out front and around the pool table. Ask at reception what is on that evening, because one guest never found the event times posted.
  - type: book_ahead
    steps:
      - { days_before: 3, text: "Book on Hostelworld with a **15% deposit**. Choose the male or female 8-bed dorm for the lowest price." }
      - { days_before: 2, text: "Free cancellation ends at 23:59 two days before check-in." }
      - { days_before: 0, text: "Check in from 14:00 with your **passport** and pay the balance in cash or by card." }
    passport_note: "Bring the passport itself, not a photo of it: you need it to check in."
  - type: map
    note: "Take Line 7 to **Changping Road**, leave by Exit 4 and walk east along Changping Road to Xikang Road. The hostel is on floors 1–2 of number 608, with 2Dollars Café & Bar at its door."
  - type: tips
    variant: insider
    items:
      - "Spend your first evening at **2Dollars** or the pool table, not in the dorm. The reviews that praise the social side point to those two spots."
      - "Ask reception for tonight's event and its time; they are not always posted."
      - "Want a busier lobby right beside the Nanjing Road pedestrian street? **Dayin Hostel East Nanjing Road** has a taproom and far more guests (8.8, 483 reviews), but dorms from ¥158 and weaker cleanliness scores."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect organised pub crawls or family dinners. Several guests wished for more events."
      - "The Bund and Yu Garden are a metro ride with a change of line, not a walk."
