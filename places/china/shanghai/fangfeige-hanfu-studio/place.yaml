  - type: highlights
    items:
      - title: Posing is their job, not yours
        text: "The listing says photographers tell you **where to put your hands and where to look**. Reviews say the same: \"the photographer told us all the poses to do\", \"patient and gave me a lot of directions\"."
      - title: Hair, makeup and costume in one price
        text: "One-on-one makeup designed for your face, hair done by hand, the outfit and all accessories are in every photography package. Makeup and hair take about 1–1.5 h."
      - title: A man's result you can check
        text: "A customer posted a video of her partner styled here (a dark embroidered robe, hair up under a small crown). She picked the studio for its **\"excellent male makeup\"**. [See the video on Lemon8](https://www.lemon8-app.com/@cyndisxy/7471117814670164498?region=sg)."
      - title: Foreigner-proof booking
        text: "Book and pay by card on KKday or GetYourGuide, then confirm by email. Staff speak English on site; 34 GetYourGuide reviews average 4.9."
  - type: prose
    title: Is it the right shoot for you?
    text: |-
      This is a **costume shoot**, not a studio headshot. You choose a Tang, Song or Ming-style outfit at the studio, get styled, then a photographer takes you to Yu Garden, City God Temple or the Bund for the outdoor shoot. The studio arranges and pays the ride there.

      The weak spot is the menswear. The studio markets itself almost entirely with women's looks, and an independent comparison of Shanghai studios (Sep 2026) lists its men's range as "not verified". So **before you pay** (or while a pay-later GetYourGuide booking is still free to cancel), email them and ask for photos of their men's robes and of a recent male client. If they can't show you three or four men's outfits, cancel.

      **The cheaper alternative.** Qiujianyu (秋笺语), inside the Yu Garden department store, sells the same 30 raw + 6 retouched with makeup, hair, outfit and a photographer for ¥613 on [KKday](https://www.kkday.com/en/product/614301) (sale price on 25 Nov 2026; list ¥833), and charges ¥60 per extra retouched photo against Fangfeige's ¥80. Its reviews also praise the posing help, and the same comparison guide says it offers men's hanfu. What it lacks is any men's photo we could find, and none of the KKday reviews we could read mentions a man. At the sale price Fangfeige costs about ¥200 more; what that buys is the one male client we could actually see, plus a ride to the Bund or City God Temple. If Fangfeige can't show you men's outfits, ask Qiujianyu the same question (its listing gives WeChat and WhatsApp contact) before booking there instead.

      Why it's worth more than a day's budget: you asked for photos you keep for good, with someone else doing the styling and posing. Either studio's 30 + 6 package covers that whole job.
