  - type: tips
    variant: insider
    items:
      - "Ask for **all your photos by WeChat file or a download link**. The one review that describes hand-over says AirDrop, which your Android phone can't receive."
      - "Ask for **light, natural makeup** if you don't want the heavy 'wanghong' look; the listing says looks are designed per face, so say it at the start."
      - "You choose photos right after the shoot, and that is when extras are sold. Decide your limit before you start looking."
  - type: tips
    variant: pitfalls
    items:
