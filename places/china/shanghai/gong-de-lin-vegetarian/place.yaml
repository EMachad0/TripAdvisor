blocks:
  - type: hero
    image: shopfront
    caption: "Gong De Lin's entrance at 441 West Nanjing Road (2022)"
    hook: The eel is mushroom, the pork ribs are lotus root, and the recipes go back to 1922.
  - type: quick_facts
    time_needed: 45 min–1 h
    best_time: Lunch from 11:00
    extra:
      - { label: Diet, value: Meat-free, detail: "Mock meat from veg, soy and mushroom (Michelin)" }
      - { label: Pay, value: Cards accepted, detail: "Per Trip.com's listing" }
      - { label: Solo?, value: "Yes, order small", detail: "Plates are for sharing; pair one with noodles" }
  - type: highlights
    items:
      - title: Food in disguise
        text: "Michelin: sweet-and-sour pork and fried shredded eel are on the menu, and **all of it** is made from vegetables, soy or mushrooms."
      - title: A 1922 institution
        text: "Michelin calls it the institution of Shanghai's plant-based cooking, serving \"dishes in disguise since 1922\"."
      - title: Cheap for a Bib
        text: "**Vegetarian noodles ¥30**, sweet-and-sour mock ribs ¥26 and vegetarian duck ¥25 on Trip.com's menu: about R$50 for a full meal."
      - title: The snack shop next door
        text: "The annexed shop sells cakes and snacks made in-house, like the **mugwort rice dumplings** Michelin recommends."
  - type: prose
    title: Shanghai cooking without the meat
    text: |-
      Gong De Lin's menu copies the classics of Shanghai cooking without meat. A Trip.com reviewer describes the "fragrant oil eel shreds" as an imitation of the city's stir-fried eel, slightly crisp and a little sweet, and the sweet-and-sour "ribs" as having bones made of lotus root.

      It sits on West Nanjing Road a few minutes' walk from People's Square, with a restaurant over two floors and a shop for cakes and snacks. Michelin gives it a Bib Gourmand and a single ¥ for price.
