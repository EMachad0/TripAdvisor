    note: "Prices in RMB from Trip.com's menu data (undated; the page shows USD by default). A June 2026 review there says baskets of 4–8 run from ¥28 to ¥158."
  - type: map
    note: "From People's Square station, walk north towards Nanjing Road; Tianjin Road runs parallel, one block north."
  - type: tips
    variant: insider
    items:
      - "You order at the counter **before** you sit, as a Trip.com reviewer describes. Decide while you queue."
      - "The city guide's tip: try the first dumpling without vinegar, then dip the next one and compare."
      - "Spring 2026 reports mention scaffolding outside and a new branch planned across the road, so look on both sides of Tianjin Road."
  - type: tips
    variant: pitfalls
    items:
      - "Restaurant QR codes in China often only work in WeChat, and some merchant codes reject foreign cards (Trip.com, Oct 2026). Set up both Alipay and WeChat Pay with your card before Dec 6."
      - "The shop closes for **one hour** between the lunch and dinner sittings (Michelin). Don't turn up in the gap."
