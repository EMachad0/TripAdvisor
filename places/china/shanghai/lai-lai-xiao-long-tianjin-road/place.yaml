blocks:
  - type: hero
    hook: Thirty square metres, three floors, and a queue down Tianjin Road for crab-roe soup dumplings.
  - type: quick_facts
    time_needed: 45–90 min with the queue
    best_time: Around 09:00, or before 20:00
    extra:
      - { label: Order, value: At the counter first, detail: "Order at the front of the queue, then sit" }
      - { label: Menu, value: English menu, detail: "Listed as a feature on Trip.com" }
      - { label: Solo?, value: Yes, detail: "Shared small tables; one basket is a meal" }
  - type: highlights
    items:
      - title: Crab roe, all day
        text: "Michelin says the **crab roe xiaolongbao** is the one most people come for. The full crab-paste basket is ¥78 for eight on Trip.com's menu."
      - title: A cheaper basket
        text: "Pork with matsutake mushroom is **¥33** a basket. With a ¥13 bowl of chicken-and-duck blood soup, that's lunch for about R$41."
      - title: A block off Nanjing Road
        text: "506 Tianjin Road is about 200 m from Dayin Hostel and a short walk from Nanjing Road and People's Square."
      - title: Elbow to elbow
        text: "Shanghai Daily counts about **80% foreign diners** now, all squeezed onto small shared tables across three tiny floors."
  - type: prose
    title: Thirty years on one lane
    text: |-
      Lai Lai started in 1994 selling ordinary Shanghai snacks and only later went all in on crab roe, Shanghai Daily reports. Michelin describes cooks making xiaolongbao non-stop in a shop "tucked away in a bustling alley", and in crab season putting crab into the wontons, spring rolls and soups too.

      It is famous now. The line often runs dozens of metres, and the shop took the unit next door for overflow seating. A Trip.com reviewer in June 2026 waited about 20 minutes. Go early, order at the counter, and share a table.
  - type: quote
    variant: vibe
    text: Bite a hole, sip the broth, then the crab, at a table you share with three strangers.
  - type: cost_breakdown
    items:
      - { label: "Pork and matsutake xiaolongbao (1 basket)", local: 33, brl: 29.34 }
      - { label: "Chicken and duck blood soup", local: 13, brl: 11.56 }
      - { label: "Crab-paste xiaolongbao (8), instead or as well", local: 78, brl: 69.36, optional: true }
  - type: menu
