  - type: faq
    items:
      - q: This is far from Shanghai. How do I reach it?
        a: |-
          Harbin is about 2,400 km north of Shanghai by rail. Two direct trains a day, both into **Harbin West**:

          - **Z172 overnight**: Shanghai station 19:34, arrives 19:37 next day (24 h). Hard sleeper **¥463.5 (R$383)**, hard seat ¥273.5 (R$226).
          - **G1204 high-speed**: Shanghai Hongqiao 09:33, arrives about 21:40 (12 h). 2nd class about **¥1,032 (R$853)**.

          A **flight** takes about 3 h; a reseller quotes from US$74 one way, and Christmas week will cost more. Fares here are from a 2024 timetable: check 12306 or Trip.com.
        asked: 2026-11-10
      - q: And from the station or airport to Central Street?
        a: "From **Harbin West station**: metro Line 3, change to Line 2 and get off at Central Street (中央大街). The **airport** has no metro: allow about an hour by airport bus or taxi. The budget route is a bus to Harbin Station, then Line 2 to Central Street."
        asked: 2026-11-10
  - type: map
    zoom: 15
    note: "The pin is mid-street. **St. Sophia** (圣索菲亚教堂) is about 10 minutes' walk east via Zhaolin Street."
  - type: tips
    variant: insider
    items:
      - "Tickets for the cathedral are sold **at the entrance** or on Meituan/Douyin (search 索菲亚景区). No need to book."
      - "Dress like you mean it: **two base layers**, insulated boots and hand warmers. Phone batteries die fast in the cold; keep the phone in an inside pocket."
      - "Combine with **Ice and Snow World** on another day. It usually opens around Dec 17–20."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect midnight mass. The cathedral is a museum, not a working church."
      - "The cobbles get **icy**. Walk flat-footed and wear boots with grip."
      - "The Sophia light show started on **Dec 27** in 2025. If it does the same in 2026, you'll miss it on Christmas Eve."
