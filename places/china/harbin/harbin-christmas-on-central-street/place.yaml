  - type: highlights
    items:
      - title: A Russian street in China
        text: "Built from **1898** by Russian railway-era Harbin, Central Street mixes Baroque, Renaissance and eclectic facades over cobbles laid in 1925."
      - title: The cathedral at night
        text: "**St. Sophia** (1932), once hailed as the largest Orthodox church in the Far East, has been an architecture museum since 1997. After dark the brick facade glows gold against the snow."
      - title: Ice and snow on the street
        text: "In winter the street fills with **ice and snow sculptures**, from polar bears to giant bottles, all free to walk past."
      - title: The interior is back
        text: "The cathedral reopened inside on **Dec 6, 2025** after a year of mural restoration, with a new exhibition and music performances (Tue–Sun ticket)."
  - type: prose
    title: How to spend Christmas Eve here
    dropcap: true
    text: |-
      Start at the **Songhua River** end of Central Street around 15:30, when the low sun turns the facades gold and dusk falls about 16:00. Walk south slowly, ducking into cafés and shops to thaw out every 20 minutes. That isn't optional at −20 °C.

      Cut east to **Sophia Square** once it's dark. The cathedral lights up from about 16:15. Go inside for the restored murals and a short music set (¥25), then come out to the lit square.

      Be clear about what Christmas means here. It isn't a Chinese holiday and there's no official Harbin Christmas program. Young locals treat it like Valentine's night out, so the street is busy and everything's open. The magic comes from the city itself: snow, Russian buildings and the ice season starting.
