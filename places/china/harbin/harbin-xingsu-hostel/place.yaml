  - type: highlights
    items:
      - title: The metro is the front door
        text: "Central Street station on **Line 2** is about 140 m away, and Line 2 runs straight to **Ice and Snow World** on the far bank."
      - title: Central Street in two minutes
        text: "The old Russian-era street and its winter ice sculptures are a short walk; Saint Sophia Cathedral is about 1 km (Ctrip)."
      - title: Cheap for Christmas week
        text: "A dorm bed was **¥58–68 (R$48–56)** a night for Dec 20–25 when searched, the lowest dorm price on Hostelworld's Harbin list that day."
      - title: Cook your own
        text: "Shared kitchen, and the Hongzhuan morning market (红专早市) is about 300 m away (Ctrip)."
  - type: map
    note: "The hostel asks guests to search **No. 93 Xiaman Street** on Amap or Google."
  - type: tips
    variant: insider
    items:
      - "After booking, **email the hostel** with your arrival time. Their terms say an unconfirmed booking may not be held, and a guest says they waited past midnight for a late flight."
      - "Pay the balance with **Alipay or WeChat Pay**; set one up with a foreign card before China."
  - type: tips
    variant: pitfalls
    items:
      - "Not a party hostel. For a night out, team up with someone at check-in or head to Central Street."
      - "Late flight? Check-in closes at **02:00**. Tell the hostel ahead."
  - type: book_ahead
    steps:
      - days_before: 10
        text: "Book on **Hostelworld** (15% deposit). Free cancellation ends about 8 days before arrival."
      - days_before: 7
        text: "**Email the hostel** to confirm, as their terms ask."
      - days_before: 0
        text: "Check in from 14:00 with your **passport**; pay the rest in cash, Alipay or WeChat Pay."
