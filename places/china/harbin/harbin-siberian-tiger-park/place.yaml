    note: "The pin is the middle of the park, not the gate. Buses 35 and 122 stop at **Hulin Park** (虎林园站), about 200 m from the entrance. A reseller puts a taxi from Central Street at about 30 minutes."
  - type: tips
    variant: insider
    items:
      - "Go **first thing**. Later in the day the tigers have eaten what visitors bought and lie down."
      - "Spend longer on the **walkway** than on the coach. The coach is a bet on where the animals are; the walkway is where they wait."
      - "No Chinese payment app? The 2026 guide says official tickets mostly sell inside WeChat and recommends Trip.com, which takes a passport and a foreign card. One reseller says buying at the entrance on the day works in most cases."
      - "Carry your **passport**: one reseller requires it together with the voucher."
  - type: tips
    variant: pitfalls
    items:
      - "**Live feeding happens in front of you.** If that would spoil the day, skip this card."
      - "Last entry is 16:00 and the walkways can be slippery in winter. Wear boots with grip."
      - "This is a breeding park with coaches and fences, not a wildlife reserve. Expect a managed safari."
      - "Check which parts are open on your day: Trip.com's guide says cub viewing depends on availability."
  - type: weather
    temp_low_c: -19
    temp_high_c: -10
    conditions: Dry, very cold, about 10 days with snow in December
    note: "Harbin's December averages are −19.1 °C at night and −9.8 °C by day, and January is about 3 °C colder. An 08:30 start is near the coldest part of the day, and the walkway is outdoors. The cold is why the tigers are active, so it works in your favour."
    wear: Down parka, thermal layers, insulated boots with grip, face cover, hand warmers
