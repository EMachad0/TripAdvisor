  - type: highlights
    items:
      - title: Tigers that like the cold
        text: "A 2026 guide puts it plainly: Amur tigers are built for cold and run in snow, while in summer they pant and sleep through the afternoon. Winter is the season to come."
      - title: The coach among them
        text: "The **¥90 ticket** includes a 30–40 minute coach circuit through the open enclosures. China Daily counts **more than 300 tigers**, nearly 200 of them in 13 free-range areas."
      - title: The raised walkway
        text: "After the coach you walk a raised corridor for 40–50 minutes. The tigers come to it and wait, so the close views are more reliable here than from the coach. The white tigers are on this part."
      - title: It is there whenever you come
        text: "In past years the ice parks opened between 17 and 31 December. This park is open every day, so a **10–14 Dec** visit still gets a full cold outdoor day."
  - type: prose
    title: What the visit is like
    dropcap: true
    text: |-
      Be at the gate for **08:30**. The guide I trust most on this says the tigers are fed early and are most active while hungry, and that by noon in busy periods an afternoon coach can drive past sleeping animals.

      The visit has three parts: the coach circuit (30–40 minutes), the raised walkway (40–50 minutes) and the cub enclosure (20–30 minutes). Most of it is outdoors, on a December day that averages about −15 °C, and that is the point of coming in winter.

      **Know this before you go:** the park sells feeding. Meat strips cost ¥20 each, a live chicken ¥80 and a live pheasant ¥150, and other visitors will buy them. Trip reports quoted by the same guide call it "more brutal than I was ready for". You can watch without buying anything; decide beforehand whether you want to see it.

      Is it worth a day? On its own it fills a morning. With the trip to the north bank and back, and a walk by the frozen river at dusk, it makes the day. For a Harbin stay before about 20 December it is the strongest outdoor plan I could confirm.
