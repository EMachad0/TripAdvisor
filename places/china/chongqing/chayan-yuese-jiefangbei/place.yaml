  - type: tips
    variant: insider
    items:
      - "**Order in Alipay**: switch Alipay to English, link your foreign card, search **茶颜悦色** and open its mini-program. One guide says the app shows English labels; at the counter, pointing at the picture menu works too."
      - "Orders are checked in person: you show the code, then wait for your drink. Expect to stand in line twice when it is busy."
      - "In winter say **热的** (hot). Pick **少糖** (less sugar) or **半糖** (half) if you don't like it very sweet."
  - type: tips
    variant: pitfalls
    items:
      - "Looking for tapioca pearls? This is the wrong shop: look for 珍珠 (pearls) on another shop's menu. Come here for the cream-topped teas."
      - "Don't stir straight away: eat the cream and pecans with the straw first, then stir the rest, as staff and guides suggest."
      - "Busy openings cap orders (2 drinks per person in Shenzhen, 2026). Don't plan on carrying a tray back for the hostel."
  - type: faq
    items:
      - q: "I want bubble tea. Are there famous ones I should check?"
        a: "Chayan Yuese is the cult one from Changsha, and on your route it is in **Chongqing** (Bayi Road and Hongyadong shops on Baidu Maps) and **Zhangjiajie** (Biaozhimen at the Wulingyuan gate, opened April 2026). Note that it is cream-topped milk tea, **not tapioca-pearl** bubble tea. Order the Orchid Latte (幽兰拿铁, about ¥18)."
