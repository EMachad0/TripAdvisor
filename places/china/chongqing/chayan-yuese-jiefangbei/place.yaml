  - type: highlights
    items:
      - title: The Orchid Latte
        text: "**幽兰拿铁**: black tea and milk under a cap of whipped cream and crushed pecans. The drink everyone orders first."
      - title: Cream first, then stir
        text: "Pandaily (2025) says staff suggest the cream and nuts first, then a stir; Maigoo says eat the top with the straw, then mix the rest."
      - title: Not bubble tea, honestly
        text: "There are **no tapioca pearls** on the 2026 menus we read. The chewy one is **烟花易冷**, with red beans and taro balls."
      - title: The queue legend, without the queue
        text: "Wuhan queued for hours in 2020 and Shenzhen for 2+ hours in April 2026. Chongqing has had shops since 2022; a 2025 review says there are plenty, and that most have a queue."
  - type: prose
    title: Why people care
    dropcap: true
    text: |-
      Chayan Yuese started in Changsha in 2013 and for its first seven years stayed mostly inside Hunan. The cups and shops borrow from Song-dynasty painting, and the drinks have poem names. People took the high-speed train to Changsha just to try one, and when the first shop outside Hunan opened in Wuhan in 2020, the lines ran for hours.

      It still does not franchise and grows slowly: 700 to 900+ shops in 2026 depending on who counts, more than half in Hunan. Outside the province it is in only a few places (Wuhan, Chongqing, Jiangsu, Sichuan, and Shenzhen since 2026). On this trip, Chongqing and Zhangjiajie are the confirmed stops that have it.

      Does it live up to it? A Chongqing reviewer in 2025 loved the cream top and found the tea under it "nothing special" for ¥18 in a small cup. Order it once, for the cream-and-pecan top. Next to it, Chagee is plain tea and milk and HeyTea leans on fruit teas: different drinks, not better or worse.
