  - type: tips
    variant: insider
    items:
      - "Arrive **by 20:00** and pick a spot near an edge or side street, not dead centre. It's easier to leave."
      - "Go with people from your hostel and agree on a **meeting point** away from the monument; phone networks clog at midnight."
      - "Check Chongqing Bendibao (重庆本地宝) around **Dec 25–28** for the 2026 traffic notice and metro hours."
  - type: tips
    variant: pitfalls
    items:
      - "**You can't do both** the 23:25 drone show by the river and midnight at the monument. Crowd controls make crossing between them unrealistic."
      - "Some metro station exits may close or run one-way for crowd control. Have a second station in mind."
      - "Taxis and Didi can't reach the core after 18:00. Walk out to a pickup point, or use the special night buses (00:00–01:00 in 2025)."
      - "Keep your phone and passport zipped away. It's very crowded."
