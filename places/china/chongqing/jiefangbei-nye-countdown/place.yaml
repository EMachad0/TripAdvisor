  - type: highlights
    items:
      - title: The monument at the centre of it all
        text: "The **Liberation Monument** (1947) is a clock tower in the middle of Chongqing's densest skyscraper district. At midnight on NYE 2025 it rang in the new year."
      - title: Hourly stage shows
        text: "In 2025 a city-run \"Gala of Light\" put on shows at **20:00, 21:00, 22:00, 23:00 and 24:00** around the square, so there's something to watch while you wait."
      - title: Balloons and wishes
        text: "Vendors sell glowing **¥10 balloons**. People write wishes and let them go at midnight (a few end up in the trees)."
      - title: Then eat, then dance
        text: "Snack stalls stay busy after midnight. Clubbers head to **9th Street (Jiujie)** in Guanyinqiao, the city's main club strip (normal-night cover ¥0–200)."
  - type: prose
    title: What the night is actually like
    dropcap: true
    text: |-
      Jiefangbei on NYE is less a party than a **human tide**. By 19:00 in 2025 the pedestrian crossings around the monument were already packed, mostly with students and young couples. Expect to shuffle, not walk, and expect police lines that steer the flow one way.

      The city doesn't call it an event. The 2025 traffic notice talks about "spontaneous crowd gathering" at Jiefangbei, and police closed roads in stages: the Qianshimen and Dongshuimen bridges from 17:00, the roads around the monument from 18:00 and more streets from 22:00. That framing matters: mainland cities have been cautious about big countdowns since the 2014 Shanghai Bund crush, and a spontaneous gathering can be managed differently from one year to the next.

      After midnight you have two choices. Hunt for **xiaomian** and skewers at the stalls, or catch the extended metro and taxi on to 9th Street, where the big clubs run late. Either way, decide your exit before the countdown, because everyone leaves at 00:05.
