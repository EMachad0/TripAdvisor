  - type: book_ahead
    steps:
      - { days_before: 14, text: "Send the hotel a message in **Trip.com chat**: 外国护照可以入住并使用电脑吗？可以登录自己的Steam账号吗？ (Can a foreign passport check in and use the PC? Can I log in to my own Steam account?)" }
      - { days_before: 13, text: "If they say yes, book the **Yun single room** for 28–31 Dec. Nothing is lost if you cancel before 18:00 (UTC+8) on 28 Dec." }
      - { days_before: 0, text: "Check in from **16:00 (UTC+8)**, well before the 20:00 shift. Pay the ¥200 deposit and test the wifi and a socket for your laptop." }
    passport_note: "Bring the passport itself. Trip.com says guests from all countries and regions are welcome."
  - type: map
    note: "The pin is **Jiaochangkou** metro station. The hotel (YEP·页谱电竞旅居酒店 重庆解放碑洪崖洞店) is on the **5th floor of Ruifu Plaza (瑞富广场)**, room 102; guests on Ctrip say it is across the road from the station, with a bus stop downstairs. Show the taxi driver the Chinese address."
  - type: tips
    variant: insider
    items:
      - "Pick **Yun (韵)** for the curved 165 Hz screen or **Ji (寂)** for a flat 185 Hz one: both are 15 m² single rooms with one PC and a 1.2 m bed (Ctrip)."
      - "Bring earplugs and an eye mask anyway: thin walls, and other guests game late."
      - "The listing includes a free game accelerator (加速器), per Ctrip's review summary."
  - type: tips
    variant: pitfalls
    items:
      - "**Steam and Battle.net in China:** the Steam client usually runs, but expect its store and community pages to be blocked; Battle.net runs through NetEase. Not confirmed for these PCs."
      - "Don't keep the room for New Year's Eve just to have it: ¥329 that night against ¥92 on the work nights."
      - "Arriving after **02:00 (UTC+8)** on check-in day? The hotel asks you to call a day ahead."
