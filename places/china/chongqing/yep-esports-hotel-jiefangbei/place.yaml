    rating:
      score: 9.8
      out_of: 10
      source: Trip.com
      reviews: 578
      checked: 2026-11-27
    social:
      - "**Not social.** A 42-room esports hotel (Ctrip) on the 5th floor of a plaza. Reviews are from Chinese friends gaming together; none mention meeting people."
      - "For company, sleep at a hostel on the free nights (26–27 Dec, New Year) and keep this for the shift nights."
    good_to_know:
      - "**Shared bathrooms:** separate shower and toilet stalls, wet and dry areas apart. Chinese guests in Oct–Nov 2026 found them clean, with hot water fast, 24 h."
      - "**No window** in any room type, so it stays dark for daytime sleep."
      - "**Noise:** a guest in Nov 2026 wrote that rooms are small, most guests come to game, some play late, and soundproofing is 'average' (隔音一般)."
      - "**Smoking** is allowed in the rooms, says Ctrip. Ask for a room that doesn't smell of it."
      - "**Deposit ¥200** (R$165), cash or third-party payment (Alipay/WeChat), refunded on check-out. No children; the guest checking in must be 18+."
      - "**Free laundry** with washer and dryer, free luggage storage, a vending machine."
      - "**Language:** the listing says staff speak Mandarin and use translation tools."
      - "**Key cards** sometimes failed for a German group in Oct 2026; staff fixed it quickly each time."
  - type: highlights
    items:
      - title: A gaming PC in your own room
        text: "Every room has an **RTX 4060** PC on a 27-inch 2K screen at 165 or 185 Hz. Chinese guests in Oct–Nov 2026: 'stable internet with no frame drops', 'amazing for FPS games'."
      - title: The cheapest door in town
        text: "**¥92 (R$76)** a night for the three shift nights, ¥276 (R$228) in all on 27 Nov. The Yun room is for one person with one PC."
      - title: Dark for daytime sleep
        text: "No window and a door: after a shift ending at **05:00 (UTC+8)** you can sleep until the afternoon."
      - title: On top of the metro
        text: "Jiaochangkou station is under 100 m away, Jiefangbei pedestrian street 400 m (7 min on foot), Hongyadong 1.2 km (Ctrip)."
  - type: prose
    title: Does it work for the shift nights?
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January and work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December. 31 December is free.

      **For sleeping, yes.** The room is windowless and has a door, and the noise complaint is about gamers playing late at night: by the time you go to bed around 06:00 (UTC+8) they are asleep. Check-out is 12:00 (UTC+8), so on the 31st you get about six hours unless they give you a late check-out.

      **For working, maybe.** You get a desk, a chair and fast wired internet, but the desk holds the hotel's PC and a 27-inch screen, so check there is space for your own laptop. Work on your laptop, not on the hotel PC. The walls are thin, so a call at night may be heard by the neighbours and you will hear them.

      **For gaming, probably, but check first.** Expect Chinese Windows and Chinese launchers. The hotel's own photo shows icons for Steam, WeGame and QQ on the desktop. Whether a foreigner can log in to the PC with a passport is not stated anywhere I could read.
