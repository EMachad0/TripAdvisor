  - type: tips
    variant: insider
    items:
      - "Qunar lists a separate ticket for **non-mainland residents** at the same ¥128, so a passport works. No advance booking is needed: tickets are sold for immediate use."
      - "Eat before you go up: the Qunar reviewer found no food on the deck."
      - "Fog or low cloud? Look up at the towers first. If The Crystal is in cloud, skip the deck: walk the 24-hour passage through the mall out to **Chaotianmen**, the peninsula's tip where the two rivers meet, for free."
  - type: tips
    variant: pitfalls
    items:
      - "The Cloud Walk combo (¥198) is a tethered walk outdoors. The same Qunar reviewer called it more dull than scary."
      - "The 10:00–22:00 hours come from one 2025 reseller listing. On a work day, check the closing time at the L1 desk or on Qunar before you plan around it."
      - "Prices have moved: ¥180 at the 2020 opening, ¥120 in a 2025 listing, ¥128 now. Check Qunar or the desk on the day."
