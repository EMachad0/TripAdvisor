  - type: highlights
    items:
      - title: A skyscraper lying down
        text: "Moshe Safdie's **Crystal** is a 300 m glass conservatory, 32.5 m wide, laid across four towers 250 m up. The complex opened in 2019."
      - title: Glass under your feet
        text: "At the end of the bridge a **glass floor cantilevers** out over the drop, CapitaLand says, above the meeting of the Yangtze and Jialing."
      - title: The mall is free
        text: "235,000 m² of mall under the towers; at opening, L1 had a **Chongqing food street** with local names like 盛天毛血旺. Shopping and wandering cost nothing."
      - title: Ends at the city's tip
        text: "A 24-hour passage runs from the Jiefangbei side through the mall to **Chaotianmen**, the tip of the peninsula, said The Paper at the 2019 opening."
  - type: prose
    dropcap: true
    text: |-
      Raffles City fills the tip of the Yuzhong peninsula, where the Jialing runs into the Yangtze. Eight towers rise from a mall podium, and across the tops of four of them lies **The Crystal**, a glass tube 300 metres long. At night it glows over the rivers; the Dahe listing also mentions a weekly Saturday drone show (see that card).

      The ticketed public part is the **Exploration Deck**, about 1,500 m² on the Jialing side of the bridge at L47, reached from a ticket desk on the mall's ground floor. A Qunar reviewer (June 2025) found the deck small, about five minutes to walk round apart from the Cloud Walk, but the glass terrace view across the rivers good.

      So come for the half hour up top and the walk through the mall below. On a work day, go up at about 17:00 and watch the light fade toward the ~18:05 sunset, then eat in the mall and still make it to the 20:00 shift.
