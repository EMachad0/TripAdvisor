  - type: map
    note: "Get off at Liziba and take **Exit 2**, then follow the **观景台** (viewing platform) signs to the lift and cross the road. Don't wait inside the station; the view is from outside."
  - type: tips
    variant: insider
    items:
      - "Be there by **08:00 on weekdays** (08:30 weekends). Trains run every 3–5 min at rush hour, so you get many tries at the shot."
      - "Ride a train through first, then go out to watch. You need both for the full experience, and together they cost ¥4."
      - "Bring your own snacks; the platform has only a kiosk (water, ice cream about ¥15) and no public toilet."
  - type: tips
    variant: pitfalls
    items:
      - "Mid-morning (10:00–11:30) and sunny weekend afternoons are the worst crowd windows."
      - "Roadside photographers charge about **¥20 a shot**; the wooden props are free and your phone works fine."
      - "During Golden Week holidays (Spring Festival, May Day, National Day) the deck goes one-way and the queue can take hours. None fall in December; New Year crowds aren't reported, but expect it busier than a weekday."
  - type: weather
    temp_low_c: 6
    temp_high_c: 12
    conditions: Cool, damp, often foggy; around 5% of possible sunshine
    note: "The platform is fully open and unshaded. Fog can soften the far side of the valley, but the building is close enough to stay sharp. Not freezing, but the damp chill gets in."
    wear: Warm layers, a light waterproof jacket, closed shoes
