  - type: highlights
    items:
      - { title: The swallow, text: "Every few minutes a train **disappears into the façade** and pops out the other side, all in plain view from the street." }
      - { title: Eat the train, text: "Free wooden props on the platform for the forced-perspective shot of the monorail **flying into your mouth**." }
      - { title: Ride through it too, text: "Tap in for ¥2 and stand on a platform that is literally **inside someone's apartment block**." }
      - { title: Peak 8D Chongqing, text: "Cliffside tracks, stacked towers and a river below: the city's vertical madness in one frame." }
  - type: prose
    dropcap: true
    text: |-
      Chongqing is built on a mountain peninsula with almost no flat ground, so when Line 2 needed a stop on the Jialing riverbank, the planners put it **inside a residential tower**. Station and building went up together and opened in 2005: shops at the bottom, the monorail on floors six to eight, about 240 flats above.

      For years it was just a commute. Then short videos made it viral, and in 2018 the city built a free viewing terrace across the road. Now people wait there with their mouths open, lining up the train so it looks as if they're swallowing it.

      Treat it as an hour, not a whole day. Pair it with the free war-heritage park down the hill and the E'ling Er Chang creative district up the slope, then ride Line 2 back along the river.
