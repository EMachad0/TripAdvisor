  - type: tips
    variant: insider
    items:
      - "Use **Dazhong Dianping's remote queue** (排号) before you walk over. Cities Insider warns that turning up at Pei Jie at 19:00 without a number often means no table."
      - "Sauce the Chongqing way: **sesame oil, garlic, coriander**. The oil coats your tongue and takes the edge off."
      - "Order **wei la** or a split pot. China Xian Tour suggests half tomato, half spicy for a first time."
  - type: tips
    variant: pitfalls
    items:
      - "Don't leave tripe or intestines in the pot: they go rubbery in a minute."
      - "Don't fight the heat with ice water. Soy milk, peanut milk or sour plum juice work; water doesn't."
      - "Want it cheaper? Cities Insider puts back-alley community hotpot at ¥60–100 a head, and China for Travelers points to the alley shops of **Bayi Haochi Jie** near Jiefangbei."
