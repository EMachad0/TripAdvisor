  - type: hero
    image: hotpot-pot
    caption: "A split pot at Pei Jie's Hongyadong branch: chili-heavy mala beside a mushroom broth"
    hook: Beef tallow, dried chilies and Sichuan pepper boiling in a grid, eleven floors up a cliffside of lights.
  - type: quick_facts
    time_needed: 1.5–2 h + queue
    best_time: "Late, after the dinner rush"
    extra:
      - { label: Say, value: 微辣 (wei la), detail: "Mild. Chongqing mild is hotter than most places' extra hot" }
      - { label: Solo, value: "One pot, few dishes", detail: "The base is charged per pot; keep the dish list short" }
  - type: highlights
    items:
      - title: The original hotpot
        text: "Chongqing hotpot began as a dockworkers' meal on the river: cheap beef tallow, chili and peppercorn, and offal. China for Travelers dates it to the 1920s–30s."
      - title: Why Pei Jie
        text: "Over 20 years old, and the classic pick of Cities Insider, China Xian Tour and Wander in China: deep beef-tallow aroma, **fresh tripe**, gongcai meatballs and premium beef slices."
      - title: Open till 02:00
        text: "Cities Insider lists the Hongyadong branch as open until **2:00 AM**, so eat after the Hongyadong lights instead of queueing at peak dinner time."
      - title: The nine-grid pot
        text: "The grid isn't for flavours, it's for heat: the centre boils hardest for quick dips, the corners barely simmer for duck blood and anything that stews."
  - type: prose
    title: How to do hotpot alone
    dropcap: true
    text: |-
      Hotpot is built for a table of friends, and the honest problem for a solo diner is the **base fee**: Cities Insider lists it separately at ¥38–68 per pot, so alone you pay all of it. Keep the rest small. One plate of **fresh tripe** (mao du, ¥48–88), a ¥6–12 sauce and an ice jelly to finish comes to about ¥100. Chongqing's default is a single red pot (China for Travelers); a split *yuanyang* pot with a mild half costs no extra there, but China Xian Tour's tip for Pei Jie is half tomato, half red.

      The better plan is to bring people: ask around your hostel, since three or four people make Pei Jie's ¥110–120 a head go much further. If you're alone anyway, use the late hours: it stays open until 02:00, so there is no need to queue at peak dinner time.
