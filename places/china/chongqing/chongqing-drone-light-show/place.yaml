    items:
      - label: The drone show
        local: 0
        brl: 0
      - label: Metro there and back (rough)
        local: 6
        brl: 4.96
    note: "Practically free. Spend the saved budget on hotpot afterwards in the Danzishi old street right behind the riverside."
  - type: map
    zoom: 15
    note: "Ask the taxi for **长嘉汇** (Changjiahui). The launch pad by the Planning Exhibition Hall is closed off; stand on Nanbin Road on either side of it."
  - type: tips
    variant: insider
    items:
      - "**Check the schedule** on Chongqing Bendibao (重庆本地宝) at the start of the month. Search 重庆无人机表演 时间."
      - "On a normal Saturday, **45 minutes early** is enough for the railing. On NYE, aim for 21:00 or earlier."
      - "For a seat, the riverside bars at Changjiahui have terraces facing the show. Buy a drink and you have a front-row table."
      - "Leave via **Zidanshi** or **Tushan** stations. Thousands leave at once, so taxis are hard to get."
  - type: tips
    variant: pitfalls
    items:
      - "**Chaotianmen gives the backwards view.** Characters and words read mirrored from there."
      - "Rain, drizzle or strong wind can cancel a show **on the day**. December in Chongqing is often foggy and damp."
      - "Saturdays that are official make-up workdays have **no show**. Oct 10, 2026 was cancelled for this reason."
      - "Don't fly your own drone: the whole riverside is a no-fly zone on show nights."
  - type: weather
    temp_low_c: 7
    temp_high_c: 12
    conditions: Grey, damp, often foggy, light drizzle
    note: "Not freezing, but the river wind at night feels colder than the number. Fog can soften the drones, and rain can cancel the show outright."
    wear: Warm jacket, a layer underneath, small umbrella
