  - type: highlights
    items:
      - title: The cyberpunk skyline, upgraded
        text: "The drones fly over the **Liangjiang four-banks** core, right above Raffles City and Hongyadong, so the shapes hang over the city you came to see."
      - title: Free and every week
        text: "No ticket, no booking. Shows run **every Saturday and on holidays**; officials counted close to 120 shows by early Oct 2026."
      - title: NYE goes huge
        text: "On **Dec 31, 2025** the city flew **8,000 drones for about 50 minutes** from 23:25, with laser and water-show boats on the river. Over 300,000 people watched."
      - title: Pick your angle
        text: "**Nanbin Road / Changjiahui** faces the show head-on. **Chaotianmen** has the widest view, but text reads mirrored. **Jiangbeizui** is side-on and calmer."
  - type: prose
    title: How a show night goes
    dropcap: true
    text: |-
      Get to the Nan'an riverside by about **19:45** on a Saturday. At 20:30 a swarm rises from the launch pad by the **Planning Exhibition Hall**. Over twenty minutes it draws spinning galaxies, giant Chinese characters and city logos above the towers of Raffles City.

      For **NYE**, multiply everything. In 2025 the city closed roads around the launch site from 17:00, capped the crowd at each viewing area and ran the metro until about 01:30. The 23:25 show ran past midnight, so the countdown happened under the drones.

      The catch is that nothing is certain until shortly before. Monthly dates come out at the end of the month before, and a wet evening can cancel a show on the day. If the drones are a must, keep **two Saturdays** free in Chongqing.
