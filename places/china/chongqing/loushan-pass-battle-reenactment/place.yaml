  - type: prose
    title: What you are signing up for
    dropcap: true
    text: |-
      In February 1935 the Red Army fought its way over Loushan Pass in northern Guizhou and went on to retake Zunyi; Mao wrote a poem about the crossing. Since 2016 the scenic area has replayed the fight as an outdoor show by the director of the TV war series *Drawing Sword*, and visitors can join in: they take a uniform and a prop rifle and run up the hill with the actors through smoke and explosions.

      **The catch for you:** a notice on the show's Ctrip page, valid 10 Nov 2026 to 31 Jan 2027, keeps the join-in places for domestic visitors. Foreigners can buy a normal ticket and watch, and an October 2026 review there is from a foreign visitor who paid for a uniform and was then not allowed to take part. So on your dates this is a show you watch, not one you play in.

      It went viral in 2026: local news counts 180 million views of visitors' clips, and in July AFP reported more than 1,000 people in replica uniforms storming the hill over a single weekend. Only 3.5% of visitors come from overseas. Everything is in Mandarin and it is unashamedly patriotic theatre, but you don't need words to follow a battle.

      The day costs about ¥392 (R$333) with the 13:30 show, or ¥260 if an 11:30 show still runs. That is well over the R$170 daily budget, mostly for transport, for an hour of watching. Go if a big outdoor battle show is worth a day to you; skip it if you only wanted to be in the charge. Also unconfirmed: whether it runs on your date. See the hours box, and only go when a ticket is on sale.
