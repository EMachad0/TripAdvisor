  - type: tips
    variant: insider
    items:
      - "**Which show?** The only 2026 report with a time says **13:30**; 2024 listings say 11:30. The show lasts a bit under an hour."
      - "**Back via Zunyi:** the last direct train (14:36) is too tight after a 13:30 start. Zunyi is about 50 min by car (Trip.com reviewers); fast trains to Chongqing West run roughly hourly in mid-afternoon (15:03, 15:47, 16:58), then every 10–30 min from about 17:40 to 22:00, ¥88."
      - "**Cheaper if 11:30 still runs:** C6039 out and G3726 back, both direct, makes the day ¥260 (R$221)."
  - type: tips
    variant: pitfalls
    items:
      - "Only **two direct trains** back to Chongqing in the afternoon (12:13 and 14:36). Check 12306 for your date; timetables change in December."
      - "Don't pay for a uniform: a foreign visitor in October 2026 paid for one and was then kept out of the charge."
      - "On Dec 28–31 you finish work at 05:00; the 07:12 or 09:49 train after that is a rough day. Better to go before Dec 28."
  - type: faq
    title: Reenacting a war in China
    items:
      - q: "Isn't the famous war reenactment in Yan'an?"
        a: "Yan'an has two. The big **Defense of Yan'an** live show opened only **25 Mar – 25 Nov** according to a 2021 answer on Baidu Zhidao (no newer schedule found), so it is probably closed on your dates. The newer **Defend Yan'an** role-play (2025, 3 runs a day, 45 min) has no winter timetable anywhere I looked, and Yan'an is a separate trip (a 2026 report says a bit over an hour from Xi'an by the new fast train). Loushan Pass is the one you can reach as a day trip from Chongqing, but as a foreigner you can only watch it until 31 Jan 2027."
  - type: weather
    temp_low_c: 5
    temp_high_c: 10
    conditions: Cool, grey, often drizzly; Zunyi gets about 38 hours of sun in all of December
    note: "An outdoor show. The pass is higher than Zunyi city, so expect it a bit colder (my estimate)."
    wear: "Warm layers, waterproof jacket, shoes with grip"
