      - { title: Real battlefield, text: "Staged at Loushan Pass, where the Red Army took the pass in February 1935, on the natural hillside where it happened." }
      - { title: Loud and smoky, text: "More than 100 real period rifles and artillery pieces, 500+ rounds and 100+ shells in one show, with a cast of 200+, most of them local villagers." }
