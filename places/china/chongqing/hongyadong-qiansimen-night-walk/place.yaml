  - type: highlights
    items:
      - title: The building that looks like a film set
        text: "An **11-storey** complex built against a river cliff, opened in 2006 to recreate Bayu stilt houses (diaojiaolou). Guides compare it to the bathhouse in *Spirited Away*."
      - title: The bridge view
        text: "Walk from Cangbai Road onto the pedestrian promenade of **Qiansimen Bridge**: the whole glowing facade, reflected in the Jialing River."
      - title: The '8D' city in one building
        text: "The **top floor opens onto a street**, and the first floor onto another, dozens of metres lower. That is Chongqing's layered city in one walk."
      - title: Free, and close to the hostels
        text: "No ticket. From Jiefangbei it is about a **15-minute walk downhill**."
  - type: prose
    title: An evening after work
    dropcap: true
    text: |-
      Finish work, eat early near Jiefangbei, and walk down at dusk. Arrive a little before **18:30** to see the river valley first and then the moment the amber lights come on, chongqing.guide suggests.

      Enter at the top: **Cangbai Road, Floor 11, Gate 1**. Browse the upper terraces, then walk straight out onto Qiansimen Bridge for the classic view. Going down inside means stone stairs, so to save your legs leave the same way you came. For a close-up from below, the riverside walk on **Jiabin Road** (Floor 1, Gate 7) lets you look straight up at the balconies.

      For the long view, go across the Jialing to **Jiangbeizui** near the Grand Theatre, where Hongyadong sits in front of the whole Yuzhong skyline. Fog is common in winter; on wet nights the stone paving reflects the lights.

      Hungry? **Liu Yishou**'s river-view hotpot branch is at 48 Cangbai Road, at the top entrance, and China Highlights lists Sister Pei's (Peijie) on the 11th floor at about ¥100 a head.
