    social:
      - "A 4th-floor common area with a **coffee bar and craft beer taps**, a book corner, board games, foosball and a screening room."
      - "Hostelworld lists an event on every night of 26 Dec – 2 Jan: a **drinking game** nightly and a movie night at 20:00 on 26 Dec."
      - "A one-hour guided **Mountain City Walk** from the hostel every Thursday at 16:00. In this stay that is 31 Dec."
      - "Recent guests who liked it: \"Great social hostel\" (Nov 2026), \"easy to meet people\" (Aug 2026), a bar with \"a very diverse range of people\" (Sept 2026)."
      - "**Honest caveat:** as many say the opposite. \"Not social at all\" (Sept 2026), \"hit or miss\" (March 2026), \"no atmosphere, no events\" (a Brazilian, May 2026)."
      - "Several 2025 guests note that there were few foreigners in the hostel."
    good_to_know:
      - "**No private rooms.** Hostelworld, Booking.com and Trip.com list only 4- and 6-bed dorms, split into male and female rooms."
      - "**Reception 08:00–01:00**, not 24 h. Hostelworld lists no curfew, but a May 2025 guest found the door locked from outside at 00:30."
      - "**Wifi:** the hostel says high-speed wifi covers the building. Not mentioned in Hostelworld reviews; Booking.com guests score it 8.5."
      - "**Work space:** Hostelworld lists a coworking space. Reviews describe a big common area, quiet in the daytime; none mentions working there."
      - "**Foreign passports:** Trip.com states that guests from all countries and regions are welcome."
      - "Bunks are built into the wall, with a curtain, key-card locker, lamp and socket. Linen and towels included. Lift, laundry."
      - "Pay on arrival in cash or by card. Breakfast is not included (Hostelworld)."
      - "Trip.com lists quiet hours from 23:00 to 08:00. Guests warn of a big staircase before the door and of map apps pointing to the wrong spot."
  - type: highlights
    items:
      - title: The cheapest good bed in Yuzhong
        text: "From **¥49 (R$41)** a night before New Year, against ¥65 at the top-rated hostel. Hostelworld guests score it 9.6 for value and 9.5 for cleanliness."
      - title: A common floor built for sitting
        text: "The hostel puts guest rooms and public areas on **separate floors** and fits soundproof doors. One guest liked that the rooms are far from the chill spaces, so they stay quiet."
      - title: Something on every night
        text: "Hostelworld shows a hostel event for each night from 26 Dec to 2 Jan, including a drinking game on **New Year's Eve** before you walk to the countdown."
      - title: In the old lanes, by the river
        text: "The building stands at the entrance of **Shancheng Lane**, a century-old hillside footpath above the Yangtze. The hostel puts Jiefangbei at a 15-minute walk."
  - type: prose
    title: The remote-work week, honestly
    text: |-
      **Working by day.** This is the stronger of the two Chongqing hostels for it. Hostelworld's facility list includes a coworking space, and the hostel describes high-speed wifi across the building and a large 4th-floor common area with a coffee bar. A 2025 guest wrote that the place is quiet during the day. Still, no Hostelworld review mentions wifi, a laptop or working here, and Booking.com guests score the wifi 8.5 out of 10.

      **The 01:00 call on Tue 29 Dec** needs a question before you book. There is no private room. Reception closes at 01:00, Trip.com lists quiet hours from 23:00 to 08:00, and one May 2025 guest found the front door locked at 00:30. The common area is on its own floor, away from the dorms, and the hostel lists a private screening room, but no source says either is open after 01:00. Ask the hostel in writing whether you can use one of them for a call at that hour. If the answer is no or vague, book one night in a private room: Merica Hotel had one on 28 Dec for ¥107 (R$88) prepaid, or ¥130 to pay later.
