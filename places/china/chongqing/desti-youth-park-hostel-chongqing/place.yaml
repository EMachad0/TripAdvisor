        caption: "A dorm: wooden pod bunks with curtains and their own lights"
      - file: lounge-cat
        caption: "The house cat in the lounge, decorated for the New Year"
      - file: house-beers
        caption: "The hostel's own-label beers at the bar"
  - type: book_ahead
    steps:
      - { days_before: 14, text: "Book 26 Dec – 2 Jan as one stay. On 10 Nov the male 6-bed dorm was **¥443 (R$366)** for the seven nights on Hostelworld and **¥435 (R$360)** on Booking.com, both with a 30% promotion." }
      - { days_before: 1, text: "Hostelworld asks for at least one day's notice to cancel for free. Booking.com showed free cancellation until 14:00 on check-in day." }
      - { days_before: 0, text: "Hostelworld gives check-in as 14:00–23:00; Trip.com says until 01:00. Message the hostel if you will arrive after 23:00. Pay in cash or by card." }
    passport_note: "Trip.com states that guests from all countries and regions are welcome. Bring the passport itself."
  - type: map
    note: "Leave Jiaochangkou by **Exit 5** and walk about 500 m. The hostel is the red-brick building at the entrance of Shancheng Lane, above a Chagee: guests say to navigate to the Chagee, because Amap points to the wrong place. Take the lift to the 4th-floor lobby."
  - type: tips
    variant: insider
    items:
      - "Before you book, message the hostel: is the 4th-floor common area or the screening room open at 01:00, and can you get back in after reception closes?"
      - "**A private room for the call night:** Merica Hotel on Xinhua Road had an ensuite double on 28 Dec for **¥107 (R$88)** prepaid with no changes allowed, or **¥130** to pay later (Booking.com, 8.9 from 423 reviews; searched 10 Nov). It has its own card."
      - "**Cheaper fallback:** Chongqing Rooftop Terrace Hostel, by its own account 5 minutes' walk from Jiaochangkou station, had a private single for ¥125 on 28 Dec, one left on 10 Nov. It scores 7.9 from 16 Hostelworld reviews."
      - "Go to the event on your first night. Guests who found it social met people in the bar and the common area."
      - "Want the most social hostel in town instead? **Only Cafe and Backpacker** scores 9.6 for atmosphere, from ¥65."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect a party hostel. Hostelworld's atmosphere score is 8.8, its lowest sub-score here."
      - "The 30% promotion was live on 10 Nov on both sites. Without it the same bed lists at ¥70–76."
      - "A March 2026 guest found too few toilets for everyone; a May 2026 guest reports bugs in the shower."
  - type: weather
    temp_low_c: 6
    temp_high_c: 12
    conditions: Damp and overcast, rain on about 10 days a month
    note: "Mild for a China winter, but grey: December gets about 6% of its possible sunshine. It is about 500 m from the metro exit to the door, with stairs on the way. Rooms have air conditioning; no review I read says how warm the dorms are in winter."
    wear: Mid-weight jacket, a rain layer and shoes with grip
