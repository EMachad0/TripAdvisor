  - type: tips
    variant: insider
    items:
      - "Book the spa at check-in. A Booking.com guest wrote: 'Make sure you make reservation for storm spa in advance'."
      - "TheSmartLocal's tip for spa photos: waterproof make-up and plain-coloured swimwear. Bring swimwear."
      - "Breakfast costs ¥88 (Trip.com). On Booking.com the breakfast rate adds ¥189 a night."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect English at the bar. A Nov 2026 guest waited 40 min for a drink and found bar staff struggle with English; reception speaks basic English."
      - "**Payment**: Booking.com shows only cash for the hotel, and its pay-the-hotel rates say 'before arrival'. The prepaid rate avoids this."
      - "The sister hotel, SEYA Raffles Plaza Jiefangbei (30F Chaotianmen Center), has a similar name. Check you booked 58F Yingli IFC."
