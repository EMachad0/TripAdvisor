  - type: prose
    title: Which night
    text: |-
      This is the "giant storm shower" hotel, but the storm is not in your room. The **storm spa** is a separate room in the hotel. What you get in the room is the window tub.

      You are in Chongqing from Saturday 26 December to Saturday 2 January and work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December. Booking.com prices for the cheapest king on 27 Nov, taxes in:

      - **Sat 26 Dec:** ¥2,158 (R$1,783). Arrival day.
      - **Sun 27 Dec:** ¥1,754 (R$1,449) prepaid, or ¥2,158 paid to the hotel. ¥1,798 (R$1,486) on Trip.com with free cancellation. Free all evening.
      - **Mon 28 Dec:** ¥1,696 (R$1,401) prepaid, the cheapest. You would work the first shift from the room.
      - **Thu 31 Dec:** ¥2,632 (R$2,175) prepaid. New Year's Eve, 500 m from the Jiefangbei countdown.

      **I would book Sunday 27 December.** You check in at 14:00 (UTC+8), book the spa at the desk, fill the tub once it is dark (about 19:00 UTC+8), and sleep in the next morning before the shifts start. Merica takes over from 28 December. New Year's Eve here costs ¥878 more than the Sunday for the same room. The countdown is a short walk either way.
