  - type: map
    note: "The pin sits on the cable line over the river. The **north station** is at 151 Xinhua Road (新华路151号), signed from Xiaoshizi Exit 5; the south station is 长江索道南站 near Shangxinjie Exit 2."
  - type: tips
    variant: insider
    items:
      - "Ride **one way**, come back on Line 6 from Shangxinjie. Return tickets mean a second queue."
      - "Go Monday to Thursday: weekend and holiday evenings mean an hour or more in line."
      - "Down for maintenance or fogged in? Baixiangju and the Dongshuimen bridge deck show the cableway for free, and the ¥15 Liangjiang ferry crosses the water."
  - type: tips
    variant: pitfalls
    items:
      - "Check the operator's WeChat a few days ahead: one weekday a month it shuts for maintenance (2026 dates so far: 31 Mar, 22 Apr, 27 May, 29 Jul)."
      - "In thick fog you pay ¥30 to see white for four minutes, China for Travelers warns. Look out the window first."
      - "There is no paid fast lane. Anyone selling one is running a scam."
