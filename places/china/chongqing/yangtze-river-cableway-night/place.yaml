  - type: highlights
    items:
      - title: Public transport with a view
        text: "Opened on **24 October 1987**, the line crosses 1,166 m from Xinhua Road in Yuzhong to Shangxin Street on the south bank. It is now a protected municipal heritage site and a 4A scenic area, says the operator."
      - title: Evening skyline from the air
        text: "chongqing.guide: daytime crossings show barges and bridges; evening rides show the glittering skyline and lit bridges."
      - title: Short enough for a work night
        text: "On an ordinary weekday the queue is **little or none, or 10–15 minutes**. The ride itself is 4–5 minutes."
      - title: Land in the old south bank
        text: "You step out next to **Longmenhao Old Street**, restored stone lanes and cliffside teahouses over the river."
  - type: prose
    title: How to do it after work
    dropcap: true
    text: |-
      Take Line 1 or 6 to **Xiaoshizi**, leave by Exit 5 and follow the signs along Xinhua Road to the north station. Buy a **one-way ticket for ¥30 (R$25)**. China for Travelers explains why not the ¥50 return: it does not hold your place, so you queue again at the far end.

      A ticket is not a boarding pass. Whatever channel you buy through, you take a **queue number** on the day, at the machines or through the operator's WeChat account, and board when it comes up. The official WeChat booking asks for your passport details, says chongqing.guide.

      In winter the binding time is **last admission, about 20:30**. Leave work by 18:00 and you can catch the lights coming on at Hongyadong first, then ride across before the cut-off. On the south bank, walk Longmenhao, then take Line 6 back from **Shangxinjie**, or stay for a set at Cici Park.
