      reviews: 46
      checked: 2026-11-24
    social:
      - "**Not social.** A 189-room chain hotel. Guests mention the 26th-floor lobby bar and its view, not meeting people."
    good_to_know:
      - "**Foreign guests:** Trip.com: 'guests from all countries/regions are welcome'. Guests came from Singapore, the UK, Australia, Argentina and Spain."
      - "**Payment:** Booking.com wants photo ID and a credit card at check-in and says cash is not accepted. Trip.com lists cash. Bring a card."
      - "**Desk and Wi-Fi:** Booking.com lists work desks; guests score the Wi-Fi 8.3, the lowest of its scores. Test it on the first evening."
      - "**Free laundry room**, praised by guests from Singapore and Spain."
      - "**Distance:** the hotel's own reply to a Nov 2026 review puts it 800 m from the Liberation Monument pedestrian street."
  - type: highlights
    items:
      - title: Blackout curtains that work
        text: "A guest in Nov 2026 wrote that the blackout curtains 'worked wonderfully, making it easy to sleep in without being disturbed by the morning sun'."
      - title: Late check-out on the 31st
        text: "The 28–31 Dec rate says **'includes late check-out'**, and Trip.com lists check-out at 14:00 (UTC+8). Your sleep ends about 13:00."
      - title: Pay at the desk
        text: "The 28–31 Dec rate is **paid at the hotel**, free to cancel until **14:00 (UTC+8) on 28 Dec**."
      - title: Metro at the door
        text: "Xiaoshizi station is **120 m** away (Trip.com), and the hotel says the Liberation Monument street is 800 m away."
  - type: gallery
    images:
      - file: tower-exterior
        caption: "The hotel tower on Xinhua Road at dusk, the Atour sign at the top"
      - file: lobby
        caption: "The lobby and front desk"
  - type: prose
    title: Work nights or the whole week
    text: |-
      You work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December and sleep about 05:30–13:00 on 29, 30 and 31 December. This room is built for that: 25 m², a desk, blackout curtains and a late check-out on the last morning. Booking.com, 24 Nov, taxes in:

      - **Work nights, 28–31 Dec:** ¥1,380 (R$1,215), ¥460 a night, paid at the hotel.
      - **Whole week, 26 Dec – 2 Jan:** ¥4,072 (R$3,586), ¥582 a night, paid before arrival.

      **It is the runner-up, not my pick.** It costs ¥285 (R$251) more than the Atour Light by Jiaochangkou for the same three nights, and two winter guests found the room too hot with the air conditioning fixed by the hotel: in December 2025 they slept with the window open. Take it over the Atour Light only if the late check-out on the 31st matters more to you than a cooler, cheaper room. For the whole week it is ¥882 more than the Atour Light and must be prepaid.
  - type: map
    note: "The pin is **Xiaoshizi** station; the hotel is 120 m away on Xinhua Road, with reception on the **26th floor**. Show taxi drivers the Chinese address."
  - type: tips
    variant: insider
    items:
      - "Sign in to Booking.com (free account) before booking: 28–31 Dec drops from ¥1,380 to **¥1,242**."
      - "At check-in ask what time the 'late check-out' on 31 Dec runs to, and to skip housekeeping until 13:00 (UTC+8)."
  - type: tips
    variant: pitfalls
    items:
      - "**Too hot:** a UK guest in Dec 2025 could not change the temperature ('the air condition set is fixed in the hotel') and opened the window; a Nov 2026 guest found it 'extremely hot at night'."
      - "A Singapore guest (Apr 2025) heard traffic in the early morning, when you go to sleep. Ask for a high floor away from the road."
      - "Only two lifts: guests in Sept and Oct 2026 waited up to 10 minutes at busy times."
      - "The whole-week and 5-night rates are paid before arrival. If arrival may slip, book 28–31 Dec only."
  - type: book_ahead
    steps:
      - { days_before: 32, text: "Book **28–31 Dec** on Booking.com, signed in. Nothing is charged; you pay at the hotel." }
      - { days_before: 0, text: "Free cancellation ends at **14:00 (UTC+8) on 28 Dec**. Check in from 15:00 with passport and card, well before the 20:00 shift." }
    passport_note: "Booking.com asks for photo ID and a credit card at check-in. Bring the passport itself."
