    social:
      - "**Not social.** The two reviews Ctrip shows first: friends on a soaking weekend, a guest praising the room. No bar, events or meeting people are mentioned."
      - "Use it for one quiet night; the hostels on the list are for the free nights you want company."
    good_to_know:
      - "**Every REEF ONSEN room** has a private pool (Ctrip lists it as a private pool, the name says 私汤, private hot bath). Rooms are 30–60 m² on floors 15–40."
      - "**Foreign guests:** Ctrip says the hotel takes guests from any country or region. Check-in needs a guest aged 18 or over."
      - "**No deposit**, a 24-hour front desk, free luggage storage and a lobby café. Breakfast is not served for now, says Ctrip."
      - "**Smoking is allowed** in all room types listed. Ask for a room that doesn't smell of smoke."
      - "Ctrip's review summary mentions smart controls, a **projector** and steady hot water. A guest asked if the bathroom glass is see-through; no answer shown."
  - type: highlights
    items:
      - title: The bath is at the window
        text: "A guest's post on Ctrip describes sitting in the pool at night with the city lit up and the **Nanjimen rail bridge** in the distance."
      - title: Less than R$400 a night
        text: "Ctrip's package costs **¥799 (R$660) for two nights** in the river-view onsen king, against a list price of ¥1,099. That is ¥399.50 (R$330) a night."
      - title: New and well rated
        text: "Opened in 2026 and scored **4.8 out of 5** from 560 Ctrip reviews; two November 2026 guests praise the design, the river view and the cleaning."
      - title: Walk to old Chongqing
        text: "Ctrip puts **Shibati** 320 m away, Shancheng Lane 299 m in a straight line, Jiaochangkou metro 640 m and Jiefangbei 1.5 km on foot."
  - type: prose
    title: Which night
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January and work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December. The package must be two nights in a row and must end by 30 December, so New Year's Eve is out.

      - **26–28 Dec, ¥869 (R$718):** your two free nights. You leave at 12:00 (UTC+8) on the 28th, eight hours before the first shift.
      - **27–29 Dec, ¥799 (R$660):** one free night, then the first shift from the room. You would need a table and good Wi-Fi, which no source confirms.
      - **28–30 Dec, ¥799:** both nights are work nights, so you would pay for a pool you only use in the morning.

      **I would take 26–28 December** if a stay costs this much; it gives you two evenings in the water before the work week. Only one night? No single-night price showed without signing in, so ask in the app first.
