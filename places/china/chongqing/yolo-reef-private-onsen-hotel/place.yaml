  - type: tips
    variant: insider
    items:
      - "Ask for a **high floor on the river side**. The river-view king is on floors 22–35; the PLUS room (48 m², floors 29–40) and the 180° room (60 m²) cost more."
      - "Sister hotels if this one is full: **YOLO Skyline Riverview Designer Hotel** near Hongyadong and **Yolo Private Hot Spring Designer Hotel** on Nanbin Road."
  - type: tips
    variant: pitfalls
    items:
      - "The package is sold on **Ctrip**, the Chinese site. If your account or foreign card won't go through, try Trip.com, which uses the same hotel id but hides prices until you sign in."
      - "Don't plan New Year's Eve here on this price: the package ends on 30 December and 31 Dec showed no package rate."
