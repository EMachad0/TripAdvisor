    rating:
      score: 9.7
      out_of: 10
      source: Hostelworld
      reviews: 251
      atmosphere: 9.6
      checked: 2026-11-10
    social:
      - "A November 2026 guest: people staying at other hostels ended up hanging out at this one. \"To meet people, this is the best place.\""
      - "Small on purpose: a lounge with a kitchen corner, a 20-metre balcony and a **rooftop garden** over the city."
      - "Free homemade bread every day, a welcome coffee, free tea and filtered water."
      - "The owners wrote their own Chongqing guidebook and talk you through where to eat and what to see."
      - "Guests write about going out together: a night out (July 2025), hotpot and a hike with new friends (Sept 2025)."
      - "**Caveat:** a July 2026 guest says the hostel arranges no activities. Booking.com lists film nights, classes and hikes; no review I read describes one."
      - "**Winter caveat:** a guest on 2 Jan 2026 found it \"not super social\" with few foreigners in town. A November 2025 guest said the same of the off season."
    good_to_know:
      - "**No private rooms.** Hostelworld, Booking.com and Trip.com list only 8-bed dorms (mixed, female or male) with shared bathrooms."
      - "**24 h reception and no curfew** (Hostelworld). Booking.com asks you to tell the hostel your arrival time."
      - "**Wifi:** free. Not mentioned in Hostelworld or Trip.com reviews; Booking.com guests score it 9.5 out of 10."
      - "**Work space:** no desks or coworking listed. Lounge, mini library, balcony; no review mentions working there."
      - "**Foreign passports:** no page states the policy. In 2026, Hostelworld reviewers came from 20 countries, Brazil included."
      - "Pay on arrival in cash, WeChat or Alipay (Hostelworld). Booking.com says cash only, plus a ¥100 cash deposit returned at check-out."
      - "Bunks have curtains and their own sockets. Free lockers, lift. Towels are for hire, and you make your own bed."
      - "Complaints: thin mattresses, tight and dated bathrooms, a lift one guest waited 10 minutes for, and one April 2026 report of mould in the showers."
  - type: highlights
    items:
      - title: The best-scored hostel in town
        text: "**9.7 from 251 Hostelworld reviews**, with 9.9 for staff and 9.9 for location. The next hostel on the list has 9.5 from 102. Booking.com guests give it 9.4 across 323 reviews."
      - title: A short walk from the countdown
        text: "The hostel says it is **5 minutes on foot** from the Liberation Monument. Booking.com measures 600 m to the monument and 1.2 km to Hongyadong."
      - title: A rooftop on the 31st floor
        text: "Reviewers keep coming back to the view from the rooftop garden. One Hostelworld guest called it the best view in the city."
      - title: Hosts who do the planning with you
        text: "A guidebook the owners wrote themselves, a map of routes to the sights, and help with Alipay for one first-timer in China."
  - type: prose
    title: The remote-work week, honestly
    text: |-
      **Working by day.** The listings show free wifi, a common lounge, a mini library and a balcony. They show no desks and no coworking room. No Hostelworld or Trip.com review mentions wifi, a laptop or working here, so the only signal is Booking.com's guest wifi score of 9.5. The hostel also runs a café, but sources disagree on where it is: Hostelworld calls it in-house, Booking.com says top floor, and a Trip.com guest says it is across the street on the ground floor of a Marriott building, with a free-drink voucher at check-in. Ask when you arrive.

      **The 01:00 call on Tue 29 Dec** is the weak point. There is no private room. One Trip.com guest wrote that the rooms are not soundproofed, though Booking.com lists soundproofing as a dorm feature. No source says whether the lounge is free and quiet after midnight. What is confirmed: reception is staffed 24 h and there is no curfew, so you can be up and about. Ask the owners on the first day where you may take a call. One Trip.com reviewer was offered a single room in a nearby building, so ask about that too. If neither works, book one night in a private room: Merica Hotel had one on 28 Dec for ¥107 (R$88) prepaid, or ¥130 to pay later.
  - type: gallery
    images:
      - file: dorm
        caption: "The eight-bed dorm: bunks with curtains and lockers"
      - file: balcony-sunset
        caption: "Sunset over the towers from the hostel balcony"
  - type: book_ahead
    steps:
      - { days_before: 14, text: "Book 26 Dec – 2 Jan as one stay. On 10 Nov, Hostelworld showed **¥595 (R$492)** for the seven nights in the mixed dorm, and Booking.com **¥520 (R$430)** in the male dorm with nothing to pay up front." }
      - { days_before: 1, text: "Hostelworld: book more than one day ahead for free cancellation. Booking.com showed free cancellation until 18:00 on check-in day." }
      - { days_before: 0, text: "Check in between 14:00 and 23:00 and pay the balance in cash, WeChat or Alipay." }
    passport_note: "Booking.com says guests must show photo ID and a credit card at check-in, and should contact the hostel if arriving after 18:00. Bring the passport itself."
  - type: map
    note: "From Jiaochangkou station, the hostel is on the top floor of the Yangguang Xingzuo building (阳光星座). An April 2026 guest: enter on the north-east side and take the first lift to the top. The hostel sends picture directions after you book; several guests still call it hard to find."
  - type: tips
    variant: insider
    items:
      - "Message the hostel before you book and ask one thing: where can a guest take a video call at 01:00?"
      - "**A private room for the call night:** Merica Hotel on Xinhua Road had an ensuite double on 28 Dec for **¥107 (R$88)** prepaid with no changes allowed, or **¥130** to pay later (Booking.com, 8.9 from 423 reviews; searched 10 Nov). It has its own card."
      - "**Cheaper fallback:** Chongqing Rooftop Terrace Hostel, by its own account 5 minutes' walk from Jiaochangkou station, had a private single for ¥125 on 28 Dec, one left on 10 Nov. It scores 7.9 from 16 Hostelworld reviews."
      - "Read the owners' guidebook on day one. Reviewers call it the best thing in the building after the view."
      - "Want a bar and a bigger common room with a coworking tag? **Desti Youth Park Hostel** uses the same metro station and costs less, but scores 8.8 for atmosphere."
  - type: tips
    variant: pitfalls
    items:
      - "Don't count on the rooftop in winter: a November 2025 guest never got up there because it closes in the rain."
      - "Light sleepers: a Trip.com guest reports no soundproofing and noisy guests at night."
      - "Bring cash. Booking.com lists the hostel as cash only, with a ¥100 deposit."
  - type: weather
    temp_low_c: 6
    temp_high_c: 12
    conditions: Damp and overcast, rain on about 10 days a month
    note: "Mild for a China winter, but grey: December gets about 6% of its possible sunshine. One December 2025 guest called the heating the best of their whole trip; a January 2024 guest found the heater weak and the dorm humid. The rooftop is closed when it rains."
    wear: Mid-weight jacket and a rain layer
