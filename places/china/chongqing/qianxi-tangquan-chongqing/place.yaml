  - type: tips
    variant: insider
    items:
      - "Pick the pass by how long you stay: 8 h (no overnight), 16 h or 24 h (overnight fee included). Staying past your time costs extra (240 Hours in China)."
      - "Phones aren't allowed in the bathing areas, and hair caps are needed in the pools."
      - "Bring a power bank, and get to the late-night snacks early (240 Hours in China)."
      - "The water is heated city water, not a natural spring (Weibo guide). Go for the bathhouse life, not mineral water."
  - type: tips
    variant: pitfalls
    items:
      - "**Legal status:** Since 1 Jan 2026, Art. 78 of China's revised Public Security Administration Punishments Law gives 10–15 days' detention and up to ¥5,000 fine for buying sex; foreigners can be expelled (Art. 10) and barred 10 years. This card is the legal option: no extras are sold or asked for."
      - "**Passport:** carry the real one. Chongqing registers guests' ID after midnight, and the Lanyue listing says this is strictly enforced."
      - "**Payment:** Alipay or WeChat Pay at the desk; foreign cards are reliable only at big chains (China Survival Kit). Booking on Trip.com avoids the problem."
      - "Paid extras go on your wristband. Ask the price before you say yes, and settle at the desk when you leave."
      - "Walk out of any place that offers a 'special' massage in a private room. Signs of a legit venue: public prices, uniformed staff, bright rooms (China Survival Kit)."
