      - title: One of the biggest
        text: "About **16,000 m²** (Maigoo, Weibo guide): hot and cold pools, saunas, salt and mugwort steam rooms, a cinema, an esports area and PS5s."
      - title: Fruit drinks all night
        text: "Every pass includes unlimited fruit drinks; some add one buffet meal (240 Hours in China). Maigoo lists a seafood buffet; the Weibo guide says it is limited unless you pay more."
      - title: A bed for the night
        text: "Shared rest areas with individual lounge beds, blankets and chargers. The 16 and 24 h passes include the overnight fee."
      - title: The legal option
        text: "A family bathhouse on public booking sites. Paid extras are foot massage and scrubs on your wristband, nothing else."
  - type: prose
    title: Why this one, and which night
    dropcap: true
    text: |-
      Chinese 24-hour bathhouses (汤泉, *tāngquán*) are where locals spend a whole evening: soak, sweat, eat, nap, watch a film, then sleep on a recliner. Qianxi is one of the biggest in Chongqing and the easiest to reach: the Trip.com guide puts it **270 m from Exit 4A of Chenjiaping metro station**. 240 Hours in China recommends it over Golden Lakeside (金色湖畔) for a first visit: newer, better rest areas, disposable underwear. Golden Lakeside has bigger pools and more saunas.

      **Free nights: Sat 26 Dec, Sun 27 Dec, New Year's Eve and 1 Jan.** Come in the evening and take a 16 h pass to stay over (its price is unconfirmed: ask at the desk). The cheapest way in is the 8 h pass, from ¥149 (Weibo guide). On 28–30 Dec you work 20:00–05:00, so only an 8 h daytime pass fits, out by 19:00. A daytime soak after a night shift, before sleep, also works.

      **Runner-up:** Lanyue Hot Spring (岚悦汤泉), in the basement of Jiangnan Gymnasium in Nan'an. Its 24 h ticket includes the buffets and overnight fee: about US$33 on Klook (4.7 from 343 reviews); Trip.com's guide says from £8.60 (≈¥76). Cheaper all-in, but harder to reach by metro.

      This card is the legal option. China punishes buying sex with detention and expulsion, and a mainstream bathhouse like this one sells pools, food and a bed, not "extras".
