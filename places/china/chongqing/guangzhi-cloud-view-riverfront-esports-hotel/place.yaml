      reviews: 2176
      checked: 2026-11-27
    social:
      - "**Not social.** Rooms are built for 2–5 friends gaming together (twin, triple, four- and five-person rooms). No common room or events are listed."
      - "Book it for one night of gaming and soaking, and sleep at a hostel on the other free nights."
    good_to_know:
      - "**Foreign guests:** Trip.com and Ctrip say all countries are welcome. No foreign review seen here; the Guanyinqiao sister branch had one on 22 Nov 2026."
      - "**Check-in:** Ctrip lists electronic Chinese ID check-in (电子身份证入住). Bring the passport and expect the desk to register it by hand."
      - "**PCs:** two per room. 16F rooms: RTX 5070 + Ryzen 7 9700X, Zowie 240–360 Hz or 2K 320 Hz. 23F hot-tub rooms: RTX 5080 + 9800X, ROG 4K/360 Hz or Zowie 600 Hz."
      - "**Games:** Ctrip promises 100+ Steam games to choose from and a free game accelerator. A guest says the desk will download games for you before you arrive."
      - "**Smoking** is allowed in every room type, per Ctrip. Ask for a room that doesn't smell of smoke."
      - "**No breakfast.** Ctrip rates include a self-heating hotpot dinner or a bakery set each day. Free laundry; food deliveries go to the room."
      - "**Quiet:** Sept–Oct 2026 guests call the rooms quiet with good soundproofing, and the internet stable for online games."
  - type: highlights
    items:
      - title: The hot tub you asked for
        text: "Seven room types on the **23rd floor** have a 私汤露台, a private hot tub on a covered terrace. The hotel's images show a round outdoor tub with the river and skyline behind it. Rooms are 56–90 m²."
      - title: Top-end rigs
        text: "Those rooms have **two PCs with RTX 5080 cards and Ryzen 9800X CPUs** (one 90 m² suite has an RTX 5090 and a PS5). Guests praise the low latency."
      - title: Hongyadong across the water
        text: "The listing says the rooms look **270° along the river at the Hongyadong night lights**. A guest in Oct 2026 called the night view stunning."
      - title: A real bathtub for less
        text: "On the 16th floor the 35 m² **江景•艺术泡坊** room has a whirlpool tub and two RTX 5070 PCs. Trip.com's cheapest bathtub room was **¥563 (R$465)** on 28 Dec."
  - type: prose
    title: Which night to splurge
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January, with night shifts **20:00–05:00 (UTC+8)** on 28, 29 and 30 December. Check-in here is after 16:00 and check-out before 12:00 (UTC+8), so the treat fits a free night best.

      - **Sunday 27 Dec, ¥762 (R$630):** the cheapest hot-tub night. Check out at 12:00 and you still have the afternoon to rest before the first shift at 20:00.
      - **Thursday 31 Dec, ¥933 (R$771):** your last shift ends at 05:00 that morning. Sleep somewhere else, check in at 16:00, and spend New Year's Eve between the PCs and the tub.
      - **Friday 1 Jan, ¥941 (R$778)**, or Saturday 26 Dec, ¥808 (R$668), if those suit you better.

      All prices are Trip.com totals with taxes for one adult, read on 27 Nov, and they will change. If you want a bathtub and good PCs but not the terrace, the whirlpool-tub room was ¥563 on 28 Dec and ¥695 on 31 Dec.

      Ask the hotel two things in the Trip.com chat before you pay. Your passport isn't a Chinese ID, and room PCs in China sometimes ask for a local login. Send this: **外国护照可以入住并使用电脑吗？可以登录自己的Steam账号吗？** (Can I check in and use the PCs with a foreign passport? Can I log in to my own Steam account?)
