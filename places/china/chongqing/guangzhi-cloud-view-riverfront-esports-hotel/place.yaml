    passport_note: "Ctrip lists electronic Chinese ID check-in. Foreign guests are accepted on paper; bring the passport itself."
  - type: map
    note: "The pin is **Liujiatai metro station**. The hotel is on Beibin 1st Road by the Jialing River, a **460 m walk** (about 7 min), in the Liujia Matou (鎏嘉码头) complex. Reception is on the **16th floor**."
  - type: tips
    variant: insider
    items:
      - "Trip.com's room page wants you signed in. To compare nights without signing in, use the list links here: they filter the hotel down to the hot-tub rooms."
      - "A Ctrip blogger says Hongyadong and Guanyinqiao are about 10 minutes away. Nobody gives a time to Jiefangbei, so check on a map app before booking."
      - "Rent a better headset or mouse at the desk: a Sept 2026 guest mentions peripherals for rent."
  - type: tips
    variant: pitfalls
    items:
      - "Expect **Chinese Windows and Chinese launchers**. In 2023 the Steam store worked in China but the Steam Community was blocked (Wikipedia). Blizzard games in China run through NetEase."
      - "The terrace pictures look like design renders, and no listing gives the tub's size, water or heating. Ask for a real photo in the chat."
      - "Don't take the bunk-bed twin as the splurge. It is the cheapest room, but it has no tub and no view."
