    social:
      - "**Not social.** A 333-room business hotel (Trip.com). The point is the room, the pool and the view, then back to the hostel."
    good_to_know:
      - "**Foreign guests:** Trip.com says guests from all countries are welcome; Booking.com asks for a passport at check-in."
      - "**Deposit ¥1,000 per night**, returned to the card or account you paid with at check-out (Trip.com)."
      - "**Paying:** Trip.com lists cash, credit and debit cards and third-party payment. It does not name Alipay. Booking.com asks for a bank transfer before arrival."
      - "**Taxes:** Booking.com shows the room price plus about 16.6% taxes and fees on top. Every price on this page includes them."
      - "**Pool:** indoor, heated, with a shallow end (Booking.com). A fitness centre, spa and sauna are listed; no source gives their hours."
      - "**Breakfast** buffet 06:00–10:30 (UTC+8), ¥158 bought separately (Trip.com)."
      - "**Arrival time:** Booking.com asks you to tell the hotel when you will arrive. Use the special-requests box."
  - type: highlights
    items:
      - title: The view comes with the cheapest room
        text: "Marriott sells the ¥1,250 room as a **Deluxe King with skyline view**; Booking.com calls it city view. The higher room types Trip.com lists are on floors 34 to 45."
      - title: Next door to your hostel
        text: "Jiefangbei's pedestrian street is 320 m away and Hongyadong 830 m (Trip.com). Google puts it 11 minutes on foot from Jiaochangkou, the station Only Cafe and Desti use."
      - title: Cheapest top-tier room sold with a view
        text: "On 27 Dec Ascott Raffles City started at ¥1,018 (no view named), Niccolo ¥1,309 on Trip.com, Regent ¥1,502 and the InterContinental ¥2,024. The Westin scores 9.4 from 4,667 Trip.com reviews."
      - title: Breakfast almost free
        text: "The breakfast rate costs **¥59 more** than room only on 27 Dec. Bought alone the buffet is ¥158, so take the breakfast rate."
  - type: prose
    title: Which night, and what it costs
    text: |-
      Book **Sunday 27 December**. It was the cheapest of the four candidate nights at almost every hotel I priced, the Westin included (¥1,250 against ¥1,308 on Saturday and ¥1,399 on 31 Dec and 1 Jan). You have no shift that night. Check out at 12:00 (UTC+8) on Monday and you still have eight hours before the first shift at 20:00 (UTC+8).

      The other nights lose something. On **Saturday 26** you arrive in the city and pay ¥58 more. On **New Year's Eve** you pay ¥149 more, then spend 19:00 to 01:00 (UTC+8) in the street crowd at Jiefangbei or at the drones by the river. On **1 January** you pay ¥1,399 the night before a flight. Shift nights (28–30 Dec, 20:00–05:00 UTC+8) would waste the room.

      The short answer to the videos: Chongqing's top hotels are cheap next to Europe, but not ¥350–600. The top international five-stars ran **¥1,018–2,030** a night on 27 Dec. ¥440–770 buys a five-star from a big chain, but its cheapest room is sold as city view (Kempinski, JW Marriott), with no view named (Hyatt Regency) or with river view as a separate room (Sheraton). Their prices are in the tips below.
