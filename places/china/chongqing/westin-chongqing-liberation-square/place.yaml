  - type: book_ahead
    steps:
      - { days_before: 14, text: "Book the night of **27 Dec** on the official site or Booking.com. Choose the breakfast rate; both cancel for free until the day before." }
      - { days_before: 2, text: "**25 Dec:** last day to cancel the room-only twin for free. The king and breakfast rates cancel free until 27 Dec. Message the hotel your arrival time." }
      - { days_before: 0, text: "Walk over from the hostel, check in from 15:00 (UTC+8) with your passport and leave a ¥1,000 deposit. Ask for a high floor." }
    passport_note: "Booking.com: a valid passport is required at check-in. Bring the passport itself, not a copy."
  - type: map
    note: "From **Only Cafe** or **Desti**, walk to Jiaochangkou station, then about 11 minutes on foot (Google). Xiaoshizi (Line 1) is 320 m away. For a taxi, show **重庆解放碑威斯汀酒店**."
  - type: tips
    variant: insider
    title: The other five-stars, priced for 27 Dec
    items:
      - "**Niccolo Chongqing** (Jiangbei, IFS tower 1): ¥1,309 on Trip.com, ¥1,364 on Booking.com, 9.4 there from 77 reviews. On NYE ¥1,676 (Trip.com)."
      - "**Regent Chongqing** (Jiangbeizui): ¥1,502 on Trip.com, ¥1,583 official, 9.4 on Booking.com from 53 reviews. NYE ¥2,039 (Trip.com)."
      - "**InterContinental Raffles City** (Chaotianmen): ¥2,028 on Booking.com for a non-refundable city-view king, ¥2,024 on Trip.com. 9.6 from 350 reviews. NYE ¥2,099 official."
      - "**JW Marriott** (Jiefangbei): ¥764 on Booking.com, ¥719 official, city-view rooms only at that price. 8.7 from 233 reviews. NYE ¥1,095 on Booking.com."
      - "**Sheraton** (Nan'an riverbank): ¥516 on Trip.com, ¥608 official and on Booking.com. The cheapest rooms are labelled city or mountain view; river view is a separate room type. NYE ¥653 (Trip.com)."
      - "**Hyatt Regency Liberation Square** (68 Zourong Road, Jiefangbei): ¥717 on Trip.com, ¥719 official via Google Hotels, a King room with no view named."
      - "**Ascott Raffles City** (serviced apartments, Chaotianmen): from ¥1,018–1,028 in Google Hotels' lists, ¥1,269 official for a Studio Deluxe. No view named for the studio."
      - "**Kempinski** (Nan'an): ¥438 on Booking.com, city view, 8.7 from 54 reviews. The only one with no NYE jump: ¥438 on 31 Dec."
  - type: tips
    variant: pitfalls
    items:
      - "Booking.com's fine print asks for a **bank transfer before arrival** and lists cash as the only payment. Without a Chinese bank account, book on the official site or Trip.com."
      - "The room-only Deluxe Twin can be cancelled free only **before 25 Dec**. The Deluxe King and breakfast rates cancel until 27 Dec."
      - "Keep ¥1,000 of room on your card or account for the deposit. It is returned at check-out, not charged."
      - "Don't plan on a late check-out. No source confirms one; ask at check-in."
