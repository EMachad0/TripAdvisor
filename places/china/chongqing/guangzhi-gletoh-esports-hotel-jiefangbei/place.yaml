  - type: book_ahead
    steps:
      - { days_before: 14, text: "Send the hotel the question in Trip.com chat (Chinese text under the booking buttons). Book only if they say a foreign passport can check in **and** use the PC." }
      - { days_before: 7, text: "Book the **Shuguang twin** for one night. Check that the room you pick names an RTX 4070 and that free cancellation is shown." }
      - { days_before: 0, text: "Check in from **16:00 (UTC+8)** with your passport. Pay the ¥200 deposit; it comes back on check-out day." }
    passport_note: "Bring the passport itself. Trip.com lists an electronic ID reader at check-in; no source says how the desk registers a foreign passport."
  - type: map
    note: "The hotel is on the **5th floor at street level** of 51 Minquan Road. The pin is on Minquan Road by Jiaochangkou station, not the door."
  - type: tips
    variant: insider
    items:
      - "Bring your **own mouse** only if you are picky: the room names already list a wireless mouse."
      - "Pick the room by its name on Trip.com: the names spell out the GPU and monitor (for example 'Ruomeng Twin Room (4070 + Zowie 240Hz Monitor …)')."
      - "The 46% 'China travel deal' price may depend on your Trip.com account; check the total before paying."
  - type: tips
    variant: pitfalls
    items:
      - "Don't assume your Steam account will just work. Steam Community has been blocked in mainland China since 2017; ask the hotel whether guests log in with their own accounts."
      - "Trip.com's guest-suggestion summary mentions **smoke smell and poor sound insulation**. Ask for a non-smoking room."
      - "Don't book it for the work nights: it is a gaming room, and you need a dark, quiet room for daytime sleep."
