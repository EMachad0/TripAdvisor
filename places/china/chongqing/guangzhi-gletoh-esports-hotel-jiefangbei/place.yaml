    rating:
      score: 9.5
      out_of: 10
      source: Trip.com
      reviews: 2166
      checked: 2026-11-27
    social:
      - "**Not social.** It is a 35-room esports hotel (Ctrip). Guests come as couples or groups of friends to play together; there is no bar or hostel-style event."
      - "Treat it as one night off from the hostel: play late, sleep in, check out by 12:00 (UTC+8)."
    good_to_know:
      - "**PC rooms:** doubles, twins, a quadruple and a mahjong suite. The cheapest twin lists '4070 + 2K260Hz'. Trip.com showed no single room."
      - "**Foreign guests:** Trip.com and Ctrip say guests from all countries are welcome, but every review shown is Chinese. Ask in Trip.com chat first."
      - "**Deposit ¥200 (R$165)** per room, by cash, card or third-party payment, refunded on check-out day (Trip.com)."
      - "**Language:** Trip.com lists English with a long list of other languages at the desk, but no review mentions English. Have a translator app ready."
      - "**Breakfast:** Chinese set menu ¥35 (R$29), 07:00–10:00 (UTC+8). Free luggage storage and a laundry room."
      - "**Nov 2026 reviews** praise the PCs, low latency and quiet, clean rooms. Trip.com's summary of guest suggestions mentions smoke smell and thin walls."
  - type: highlights
    items:
      - title: A gaming rig in your own room
        text: "The room names list an **RTX 4070** with a **240 Hz** monitor (2K or Zowie) and a wireless mouse. A November 2026 guest wrote that 'the setup runs very smoothly with low latency'."
      - title: The PC bang you sleep in
        text: "Esports hotels (电竞酒店) are a Chinese thing: rooms built around PCs, booked by friends for a night of games. This one opened in **2024** and scores **9.5** from 2,166 Trip.com reviews."
      - title: Cheap for one night of fun
        text: "**¥231 (R$191)** with taxes for the night of 27 or 28 Dec, quoted on 27 Nov. New Year's Eve costs ¥379 (R$313)."
      - title: Next to the metro
        text: "Trip.com puts **Jiaochangkou** station 0.1 km away and the Liberation Monument about 340 m. Easy to get back to a hostel the next day."
  - type: prose
    title: Which night
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January and work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December. Check-in here is from 16:00 and check-out by 12:00 (UTC+8).

      **Sunday 27 December is the night I would book.** It costs ¥231 (R$191), you can play until late, sleep in, and check out at 12:00 (UTC+8) with eight hours to spare before the first shift. Saturday 26 December costs ¥258 (R$213) and is your arrival day.

      New Year's Eve works too, because 31 December is free, but the same room costs ¥379 (R$313) and the countdown crowd is outside. The 28th is cheap (¥231) but you would be at work for most of the night.

      **What the PC will be like** is the part nobody confirms for a foreign guest. Expect Windows and launchers set up in Chinese. Steam's community pages have been blocked in mainland China since 2017 (PC Gamer), while the store was left open. Whether you need a Chinese ID or phone to log in to the room PC, no source says: ask the hotel first.
