  - type: tips
    variant: insider
    items:
      - "Start **wei la** (微辣, mild). A local on Trip.com calls the bowl very spicy and heavy on lard, and suggests one bowl for two if you have plans for lunch."
      - "Taste it plain first, then add the aged vinegar from the table. That's a Ctrip regular's trick."
      - "Want the *A Bite of China* noodles too? Qunar lists **Qin Yun Laotaipo Tantan Mian**'s flagship (秦云老太婆摊摊面) in Xiejiawan at about ¥16, with a free sour plum drink. Its newest Qunar review is from 2020, so check it on Amap first."
  - type: tips
    variant: pitfalls
    items:
      - "Guides give three different addresses for Hua Shi (Minsheng, Minquan and Shaanxi Roads). Trip.com and Ctrip both list **85 Minsheng Road**: search 花市豌杂面 民生路 in Amap before you go."
      - "Locals don't drink the broth (Cities Insider): it's mostly chili oil and salt."
      - "**Pang Mei** (胖妹面庄) is the other famous name, but Wander in China and Cities Insider give different addresses for it, so I left it as a side note."
