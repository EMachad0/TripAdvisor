  - type: highlights
    items:
      - title: The fan-favourite bowl
        text: "**Wan za mian** is xiaomian's richer cousin: soft yellow peas plus a salty minced-pork sauce, usually served **dry** (gan liu) so the sauce coats every noodle."
      - title: Breakfast, not dinner
        text: "Xiaomian is what Chongqing eats on the way to work. Wander in China describes the 6:00–9:00 rush of suits and builders on plastic stools."
      - title: Cheap, even on R$100 a day
        text: "Ctrip diners put the average at **¥17** (about R$14). One reviewer's two-liang wontons came to fourteen big dumplings."
      - title: Street-level seating
        text: "Ctrip's write-up says the shop is always full and eating on the roadside is normal. Wander in China warns you may eat standing outside."
  - type: prose
    title: How a Chongqing noodle shop works
    dropcap: true
    text: |-
      The noodles are fresh alkaline wheat noodles, but in Chongqing the sauce is the point: Wander in China counts up to fifteen condiments in one bowl, from chili oil and Sichuan pepper to lard, garlic water and pickled mustard greens. Wan za mian adds two toppings: peas boiled until creamy and *za jiang*, a minced-pork sauce.

      Order by weight, not by size: **er liang** (two liang of dough) is the standard adult bowl, san liang if you are hungry. Then say how you want it: *gan liu* (dry), *wei la* (mild), *jia wo zi* (add a fried egg). A Ctrip regular mixes for a long time, eats half plain, then adds the aged vinegar from the table for the second half.
