blocks:
  - type: hero
    image: tianfu-post-station
    caption: "The Tianfu post house film set on the sinkhole floor, below Tianlong Bridge"
    hook: A collapsed cave the size of a valley, with three stone arches still standing across the sky.
  - type: quick_facts
    time_needed: Full day
    best_time: Clear weekend day, gate by 09:00
    extra:
      - { label: Fast train, value: "35–45 min", detail: "Chongqing East → Wulong South, ¥62–76" }
      - { label: Last train back, value: "21:25", detail: "G3870 Wulong South → Chongqing East, ¥67" }
      - { label: Walking, value: "~2.5 km", detail: "Mostly downhill on stone paths; slippery when wet" }
  - type: highlights
    items:
      - title: Into the sinkhole
        text: "A glass lift drops you about **80 m** to the floor of the Tianlong sinkhole. From there a one-way path of roughly 2.5 km runs under the three arches: Tianlong, Qinglong and Heilong."
      - title: Film sets in a gorge
        text: "Zhang Yimou built the **Tianfu post house** here for *Curse of the Golden Flower* (2006), and *Transformers: Age of Extinction* filmed under the bridges in 2014."
      - title: Longshuixia slot gorge
        text: "Optional add-on (Qunar from **¥85**): boardwalks pinned to the walls of a narrow gorge, past an 80 m waterfall. A free shuttle links it to the Three Bridges exit in about 10 minutes (Sohu)."
      - title: Cheap and fast
        text: "On the fast line, Chongqing East to **Wulong South** takes 35–45 minutes for ¥62–76 in 2nd class. The slow K-trains from Chongqing North cost ¥24.5 but take over two hours."
  - type: prose
    title: The day, step by step
    dropcap: true
    text: |-
      Times from the 12306 timetable for 24 Nov 2026 (December assumed the same).

      - **07:17** G2425 Chongqing East → Wulong South **08:02** (¥62).
      - **~08:10** tourist bus from the station forecourt up to the **Xiannüshan visitor centre**, 35–45 min (¥10–16; sources differ).
      - **~09:00** park shuttle to the Three Bridges gate (about 15 min), lift down, walk the gorge: **2.5–3 h**.
      - **~12:30** lunch in Xiannü town. Optional: **Longshuixia** gorge 13:30–15:30.
      - **~16:00** bus back down to Wulong South.
      - **18:30** C6398 → Chongqing East **19:22** (¥74). Fallbacks: G2436 16:47 → 17:30 if you are fast, or the last fast train **G3870 21:25 → 22:10** (¥67).

      **From Chongqing North instead**, the only morning train is the slow K507 (09:15 → old Wulong station 11:23, ¥24.5), then a ~¥10 minibus to the visitor centre. That leaves time for the Three Bridges only; back on K9510 18:37 → Chongqing North 21:09 (¥24.5). The cheapest version, about ¥194 with the ¥125 ticket.

      **What December does.** Lower prices (Nov–Feb is low season), short days, and a real chance of low cloud: Trip.com advises against mountain hikes in January because visibility is often poor. The gorge floor is less exposed than a summit, but cloud can hide the tops of the arches. Pick the clearer of your two weekend days.
