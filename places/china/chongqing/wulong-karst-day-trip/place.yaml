  - type: map
    note: "Buses and taxis go to the **仙女山游客中心** (Xiannüshan visitor centre); park shuttles leave from there to the Three Bridges gate."
  - type: tips
    variant: insider
    items:
      - "Book both train legs the day sales open (15 days ahead): weekend fast trains are the bottleneck, not the park."
      - "Get off at **武隆南 Wulong South**, not the old 武隆 station, unless you are on a K-train."
      - "Keep your ticket QR code or passport handy: shuttles scan it between the visitor centre and the gorges."
  - type: tips
    variant: pitfalls
    items:
      - "Wet stone and planks in both gorges: wear shoes with real grip."
      - "Don't plan Fairy Mountain as well in one December day; its grassland is a separate ticket and the day is short."
