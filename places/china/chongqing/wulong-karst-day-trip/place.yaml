    note: "CMA normals at Wulong town (278 m): 6.6–11.9 °C in December, 9.7 wet days, 37 h of sun all month. The visitor centre and the bridges are much higher, so expect colder; no figures found."
    wear: Warm layers, rain shell, grippy shoes
