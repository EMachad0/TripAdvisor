  - type: highlights
    items:
      - title: The scene's busiest room
        text: "Techno Airlines lists **four Cici Park nights in December** and eight in November, more than any other Chongqing venue on its calendar."
      - title: A party on New Year's Eve
        text: "**'Time Factor - 太妃糖NYE 2027'** is listed for Thursday 31 December from 22:00, with Sunyoung on the lineup. Ticket price not out yet."
      - title: Good for a solo dancer
        text: "chongqing.guide calls it a small independent club for people who pick a night by the DJ, with an unpretentious floor for long sets. Craft beer is the main drink."
      - title: Cheap for a club
        text: "Paid nights have been **¥66 presale, ¥88 at the door** (R$55–73), and some parties are free."
  - type: prose
    title: How it fits a work week
    text: |-
      The room is in the **Opening Port Park** on the south bank of the Yangtze, across the river from the hostels in Yuzhong. You walk in through Gate 2, then take the sightseeing lift down two floors to the Youth Cultural Space. By metro it is Line 6 to **Shangxinjie**, Exit 2, then 8–12 minutes on foot. The Yangtze River Cableway lands at the same station, so you can ride over at dusk and come here later.

      Sets start after 22:00 and more dancers arrive after midnight, says chongqing.guide, and Friday nights are busiest. On a quiet night the floor can feel sparse. That makes this a **weekend or holiday** plan: Saturday 26 December (nothing listed yet), New Year's Eve, or New Year's Day if something gets announced. Not the night before the 01:00 call.

      The metro has stopped when you leave, so get a DiDi back across the river. Cities Insider puts a 20-minute night ride in the city core at ¥15–45.
