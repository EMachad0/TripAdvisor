  - type: tips
    variant: insider
    items:
      - "Check the poster first: Techno Airlines' Chongqing page lists each night with its DJs. Pick the one whose sound you like."
      - "Pair it with the **Yangtze River Cableway**: ride across before last admission (about 20:30 in winter), eat around Longmenhao, then walk to the club."
      - "In November the venue listed free **Open Deck** nights on Wednesdays (11 and 18 Nov). If one appears on Wed 30 Dec, it is a cheap midweek look."
      - "Want a darker, harder room? chongqing.guide points to **Inward Club** in Longfor Xinyijie (techno, peaks near 03:00, door ¥99–108)."
  - type: tips
    variant: pitfalls
    items:
      - "Arrive after midnight or not at all: before that, chongqing.guide says the floor can be thin."
      - "Have Alipay or WeChat Pay working: Cities Insider says cash is rarely used at night. No ID rule found for Cici; carry your passport anyway."
      - "Don't plan this for Monday 28 Dec: the video call is at 01:00 on Tuesday."
