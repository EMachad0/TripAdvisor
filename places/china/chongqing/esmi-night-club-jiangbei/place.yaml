        text: "Trip.com's Trip.Best list of Chongqing clubs, updated 11 November 2026, puts **ESMI's Jiangbei branch at No. 1**, for its 4D holographic screen room and EDM performances."
      - title: Big-room, not underground
        text: "EDM leads, with hip-hop and K-pop mixed in. Giant screens, moving light rigs and dancers turn the room into a show, says chongqing.guide. The 'heavy' night out, Chinese style."
      - title: Free at the door
        text: "Entry is **free for guests 18 and over**. You pay only for drinks, or a table if you come with a group."
      - title: A night with a schedule
        text: "Stage shows start around **22:30**, gain energy from 23:00 and peak around midnight; more dance routines run after 02:00."
  - type: prose
    title: Going alone, and getting home
    text: |-
      ESMI is built around tables. chongqing.guide gives E and W tables for two to four people at about **¥300–500 per person**, side booths at about **¥1,000** a table on weekends and centre booths at ¥3,000–4,000. For a solo traveller, the free entry is the point: get in, stand near the screens, buy a drink at a time. No source publishes a bar price, so ask before you order. Cities Insider warns that door promoters push VIP packages that are overpriced for visitors, and says you can usually get in without one.

      It is in the **Liyuchi 42 art park** at Guanyinqiao, the centre of 9th Street (Jiujie) across the Jialing River from Yuzhong. Flavor Tiki, an award-winning cocktail bar, is in the same art park (cocktails from about ¥80, open 20:00–02:30), so you can start there and walk over.

      The metro stops around 22:30–23:00, so plan a **DiDi** back. Cities Insider puts an average 20-minute night ride at ¥15–45. Copy the Chinese address into the app.
