    social:
      - "**Not social.** A 106-room chain hotel on the 5th floor of a mall. Reviews talk about laundry and breakfast, not about meeting people."
    good_to_know:
      - "**Foreign guests:** Trip.com says 'guests from all countries/regions are welcome'. Reviewers in Oct–Nov 2026 came from Australia, the US, Belgium and the UK."
      - "**Payment:** the week and 28–31 Dec rates are paid at the hotel. Booking.com lists only cash; Trip.com shows card icons and says no deposit."
      - "**Desk:** Booking.com lists a desk and soundproof rooms. No review rates the Wi-Fi or mentions calls: test it on the first evening."
      - "**Free laundry**, overnight laundry service and help with Taobao parcels, say guests in Nov 2026. Breakfast ¥38."
      - "**Finding it:** a Nov 2026 guest says the map address is wrong; look for the ONEMALL / Wanmo mall and take the lift on the left to the 5th floor."
  - type: highlights
    items:
      - title: Dim, quiet rooms for day sleep
        text: "The cheapest rooms look onto the hallway or a small courtyard, not the street. A Belgian guest in Nov 2026 found the room 'spacious and very quiet'."
      - title: The countdown on foot
        text: "The mall is about **300 m** from the Liberation Monument. On NYE 2025 police barred cars around it from 18:00 (UTC+8), so being able to walk home matters."
      - title: Pay at the desk, cancel late
        text: "The week and the work-night rates are **paid at the hotel**, and free cancellation runs to **18:00 (UTC+8) on check-in day**."
      - title: A week for less than the nights
        text: "Booked one by one, the seven nights add up to ¥3,258. As one stay they cost **¥3,190 (R$2,809)**, ¥456 a night with New Year included."
  - type: prose
    title: Whole week or work nights
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January and work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December, so you sleep from about 05:30 to 13:00 on 29, 30 and 31 December. Prices on Booking.com, 24 Nov, taxes in:

      - **Whole week, 26 Dec – 2 Jan:** ¥3,190 (R$2,809) in a 21 m² Standard Queen. Check-out on 2 Jan is 12:00 (UTC+8), in time for the 15:25 flight.
      - **Work nights only, 28–31 Dec:** ¥1,095 (R$964) in an 18 m² Comfort Queen. Check-out on 31 Dec is 12:00 (UTC+8), an hour before your sleep would end.

      **Book the whole week here if you want one bed for the trip.** It costs ¥456 a night with New Year's Eve and 1 January inside it, nights that cost ¥696 and ¥664 on their own. If arrival slips, you lose nothing up to 18:00 (UTC+8) on 26 Dec: cancel and rebook from 27 or 28 Dec.

      **For the work nights alone it is also my pick**: ¥285 (R$251) cheaper than the Atour by Raffles City, whose guests found the rooms too hot in Dec 2025 and Nov 2026. That one includes a late check-out on the 31st; here you have to ask for it.
  - type: map
    note: "The pin is the **ONEMALL (Wanmo)** mall on OpenStreetMap; the hotel is on its **5th floor**. Jiaochangkou station is 270 m away (Trip.com). Show taxi drivers the Chinese address, and on NYE walk in: in 2025 the roads closed to cars from 18:00 (UTC+8)."
  - type: tips
    variant: insider
    items:
      - "Sign in to Booking.com (free account) before booking: the week drops from ¥3,190 to **¥2,871**, the work nights from ¥1,095 to **¥986**."
      - "**Split the week into two bookings at the same price:** 26–28 Dec (¥802) plus 28 Dec – 2 Jan (¥2,388) = ¥3,190. If arrival slips, cancel only the first one."
      - "On 31 Dec ask for check-out at 13:00 or 14:00 (UTC+8) at the desk the day before. No source lists a late check-out price."
      - "Write in the special-requests box that you sleep in the daytime and want no housekeeping before 13:00 (UTC+8)."
  - type: tips
    variant: pitfalls
    items:
      - "A Nov 2026 guest smelled hot pot from the mall in a courtyard room. Ask for a room away from the restaurant side."
      - "An Italian guest (Nov 2026) found the air conditioning always on and the air dry. Bring a water bottle for the shift."
      - "Don't book NYE on its own later: on 24 Nov the queens for 31 Dec were already gone."
  - type: book_ahead
    steps:
      - { days_before: 32, text: "Book the **whole week** (or 28–31 Dec) on Booking.com signed in. Nothing is charged; you pay at the hotel." }
      - { days_before: 1, text: "Free cancellation ends at **18:00 (UTC+8) on check-in day**. If arrival slips to 27 or 28 Dec, cancel before then and rebook the new dates." }
      - { days_before: 0, text: "Check in from **14:00 (UTC+8)** with your passport. Test the Wi-Fi and the desk socket before the 20:00 shift." }
    passport_note: "Bring the passport itself. Trip.com says no deposit is required."
