    temp_low_c: 6
    temp_high_c: 12
    conditions: Damp and overcast, rain on about 10 days a month
    note: "Mild for a China winter, but grey and damp. The hostel lists central air conditioning and a fresh-air system; no review says how warm the rooms are in December."
    wear: Mid-weight jacket and a rain layer
