      - "An October 2026 Hostelworld guest was put in an apartment 5 minutes away instead. Confirm the room in writing."
      - "Ages 18–65 only (Booking.com). Luggage storage listed."
  - type: highlights
    items:
      - title: A real room for night shifts
        text: "Ensuite doubles from **¥188 (R$166)** a night, in a separate building from the dorms. On Booking.com, **¥594 (R$523)** covers 28–31 Dec with nothing to pay up front."
      - title: Wifi you can work on
        text: "Booking.com guests score the wifi **9.4**, against 6.3 at the Rooftop Terrace hostel and 8.8 at Smile Inn. Hostelworld lists 24 h reception."
      - title: Walk to the countdown
        text: "The map pin is about **700 m** in a straight line from the Liberation Monument. The hostel puts Chaotianmen, Hongyadong and Shibati about 10 minutes away on foot."
      - title: Free to cancel late
        text: "Booking.com lets you cancel for free until **18:00 UTC+8 on the day you arrive**, and you pay at the hostel. Useful if your arrival slips to 27 or 28 Dec."
  - type: prose
    title: The work nights, honestly
    text: |-
      **Why this one for 28–31 Dec.** Calls run from 20:00 to 05:00 UTC+8 on 28, 29 and 30 Dec, then sleep until about 13:00. That needs a door and quiet daytime. Here the private rooms are in their own building, the wifi is the best-scored in town, and reception is listed as 24 h on Hostelworld. Trip.com gives front-desk hours of 09:00–01:00 and quiet hours from midnight to 08:00, so you would be taking calls in your own room, not in the lounge.

      **What is not known.** No listing or review says whether the double has a desk, how big it is, or how warm it gets: there is central air conditioning, nothing about radiators. The restaurant opens at 11:00 UTC+8, two hours before you wake. Ask the hostel by message before you book: a room with a table, away from the restaurant and the street.

      **The social side.** Guests love the owners and the ¥15 buffet, but this is a calm hostel. For 26–27 Dec and New Year's Eve, a dorm at Only Cafe, about 700 m away, is where people go out together.
  - type: book_ahead
    steps:
      - { days_before: 14, text: "Book the work nights now: **Booking.com, Deluxe Queen, 28–31 Dec, ¥594 (R$523)**, nothing to pay up front. Book other nights as a separate reservation, so a late arrival does not touch this one." }
      - { days_before: 1, text: "Hostelworld bookings: free cancellation ends at 23:59 UTC+8 the day before arrival (25 Dec for a 26 Dec start). After that you lose the 15% deposit and pay the first night." }
      - { days_before: 0, text: "Booking.com bookings cancel for free until **18:00 UTC+8** on arrival day. Check in 15:00–00:00 UTC+8 and tell the hostel your arrival time." }
    passport_note: "Bring the passport itself; Trip.com states that guests from all countries are welcome. Booking.com takes no cash at this hostel."
  - type: map
    note: "From Jiaochangkou station, Exit 10A: walk 2 minutes to the Kaixuan Road lift (¥1; after 22:00 UTC+8 take the steps opposite it), go down, then follow the hostel's photo directions from the restaurant 山城赵二火锅. Taxis: give that restaurant's name. The hostel sends a map on WeChat after you book."
  - type: tips
    variant: insider
    items:
      - "Message the hostel before booking: does the double have a table, and can it be away from the restaurant? You will sleep until 13:00."
      - "**Split plan:** dorm at **Only Cafe** for 26–27 Dec and 31 Dec – 1 Jan, this double for 28–31 Dec. On Booking.com that is about ¥919 (R$809) for the week."
      - "No move at all: this hostel's male dorm on the other nights costs ¥194 (R$171) for the four of them, so ¥788 (R$694) for the week on Booking.com."
      - "Eat the ¥15 buffet at least once; guests rank it among the best things here."
  - type: tips
    variant: pitfalls
    items:
      - "Don't book the whole week as one reservation if your arrival might slip: a no-show on the first night can cancel the rest."
      - "The Kaixuan Road lift closes at 22:00 UTC+8, so the walk home from the countdown ends on stairs."
      - "One Hostelworld guest (Oct 2026) was moved to an apartment nearby. Ask for the room you booked."
