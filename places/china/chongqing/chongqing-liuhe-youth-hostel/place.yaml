  - type: highlights
    items:
      - title: Half the price of the others
        text: "**¥35 (R$29)** a night before New Year, against ¥49 at Desti and ¥75 at Only Cafe on 26 Dec. The full week is about **¥331 (R$274)**."
      - title: Terraces over the river
        text: "Several roof terraces face the Yangtze River Bridge. Reviewers call the rooftop amazing and a place to meet people."
      - title: Small, friendly, well scored
        text: "9.6 for staff, cleanliness and value. One reviewer: \"THE BEST HOSTEL!!\" (February 2026). The sample is just 12 reviews."
      - title: Central, on Line 1
        text: "Hostelworld puts it 1.6 km from the centre. The hostel lists Jiefangbei, Hongyadong, the cableway and Shibati as nearby."
  - type: prose
    title: Party hostel? Honestly, Chongqing has none
    text: |-
      I found no party hostel in Chongqing. On Hostelworld (11 Nov), by atmosphere score the order is **Only Cafe 9.6** (251 reviews), **LiuHe 9.2** (12), **Desti 8.8** (102), and **Chongqing Riverside 8.0** (62, a quiet courtyard hostel). The rest have fewer than 20 reviews or none.

      LiuHe is the one real alternative to the three stays already on your list. It is the cheapest good bed, and its terraces are a natural place to meet people. But it is small and new to Hostelworld, and no review mentions a big night out. For partying, the social plan is: find people here or at Only Cafe, then go out to ESMI or Cici Park together.

      **For the work week:** free wifi, but no desk or coworking listed and no review about working. **The 01:00 call on Tue 29 Dec** has no good spot here: dorms only, limited reception hours, and no source on the terraces at night. Book the Merica Hotel for 28 Dec, as the other hostel cards say.
