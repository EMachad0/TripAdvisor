  - type: map
    note: "The pin is Zhongshan 1st Road, not the building. Look for the Jinshan Business Building at number 97 and take the lift to the hostel at 32-3. The Four Rooftops hostel in the same building says it is near Exit 1 of Qixinggang station."
  - type: tips
    variant: insider
    items:
      - "Message the hostel before booking: is anything planned for New Year's Eve, and can you arrive after 20:00 on 26 Dec?"
      - "Want people to go out with? Spend an evening at **Only Cafe** (atmosphere 9.6 from 251 reviews), the best-scored hostel in town."
      - "**Chongqing Riverside Hostel** is the quiet option with 24 h reception and a private ensuite double (¥188 on 26 Dec). Atmosphere 8.0; reviews mention a lack of it."
  - type: tips
    variant: pitfalls
