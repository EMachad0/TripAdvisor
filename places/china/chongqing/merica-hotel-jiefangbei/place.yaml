    rating:
      score: 8.9
      out_of: 10
      source: Booking.com
      reviews: 426
      checked: 2026-11-15
    social:
      - "**Not social.** A 56-room hotel on one floor of an office building. It has a lounge with a shared fridge and a lobby arcade; no review mentions meeting people."
      - "Sleep at a hostel on the nights you are free. Both hostels on the list use Jiaochangkou station, which tiket.com puts 1.2 km from this hotel (straight line)."
    good_to_know:
      - "**Front desk:** tiket.com lists 08:30–12:00 (UTC+8), yet a June 2026 guest wrote about the night-shift receptionist. Tell the hotel when you will come and go."
      - "**Table and wifi:** a May 2026 guest in a windowless queen had a sofa and a small table. Booking.com guests score the wifi 9.0."
      - "**Corridor noise:** guests in Nov 2025 and Aug 2026 heard people talking in the hallway. A Jan 2026 guest found the windowless room very quiet at night."
      - "**Housekeeping** is listed as daily. No source says you can skip it; ask at check-in. Staff answer quickly on WeChat, say guests from 2025 and 2026."
      - "**Smoke:** five guests from Jan to Nov 2026 smelled cigarettes in the room, hallway or lift."
      - "**Showers** swing between hot and cold when others use water, say guests in Dec 2025 and Oct 2026."
      - "**Free laundry** with one washer and one dryer, often busy. Staff take in food deliveries and help you order takeaway."
      - "**Foreign guests** are accepted in practice: Booking.com reviews from Brazil, Germany, the UK and Canada in 2025–2026."
  - type: highlights
    items:
      - title: Dark when you sleep in the day
        text: "After a shift ending at 05:00 (UTC+8) you sleep until the afternoon. The cheapest room has **no window**; a Brazilian guest who took it in January 2026 called it 'a great choice because it's was so quiet at night'."
      - title: The 01:00 call in your own room
        text: "The call is at **01:00 (UTC+8) on Tuesday 29 December**, in the middle of the first shift. A room with a door and a table beats a hostel lounge for it."
      - title: Three nights for less than R$200 over a dorm
        text: "The three work nights cost **¥525 (R$462)** on 24 Nov. A bed at Only Cafe for the same nights is ¥195 (R$172), so the door costs **¥330 (R$291)**."
      - title: In the middle of town
        text: "Booking.com guests score the location **9.6**. Hotels.com puts the Xinhua Road cableway station 6 minutes away on foot."
  - type: prose
    title: One night, three or the whole week
    text: |-
      You are in Chongqing from Saturday 26 December to Saturday 2 January. You work **20:00–05:00 (UTC+8)** on 28, 29 and 30 December, so you sleep in the daytime on 29, 30 and 31 December. The video call is at 01:00 (UTC+8) on Tuesday 29 December. Nobody works on 31 December. Prices for the windowless queen on Booking.com, 15 Nov, compared with an 8-bed dorm at Only Cafe on Hostelworld the same day. **On 24 Nov prices were higher:** ¥525 (R$462) for the three work nights and ¥1,792 (R$1,578) for the week; the call night alone was ¥159.

      - **Call night only, 28 Dec:** ¥130 (R$110), ¥65 more than the dorm. You would then sleep in a dorm in the daytime on the 30th and 31st.
      - **Three work nights, 28–31 Dec:** ¥389 (R$330), ¥130 a night. ¥194 (R$165) more than the dorm.
      - **Four nights with New Year's Eve, 28 Dec – 1 Jan:** ¥736 (R$625), ¥184 a night after a 10% discount. ¥441 (R$374) more than the dorm. Booked alone, New Year's Eve costs ¥406, three times a normal night.
      - **The whole week, 26 Dec – 2 Jan:** ¥1,402 (R$1,190), ¥200 a night. ¥807 (R$685) more than the dorm.

      **I would book the three work nights.** They are the nights a dorm fails you: you sleep from about 06:00 to 14:00 (UTC+8), when a dorm is checking people out and in. For R$55 a day you get a dark room, a door and a table. Spend 26–27 December and New Year at a hostel: those are the nights for meeting people, and the countdown and drone show are better with company. A whole week here gives up all of that.

      The catch is the morning of the 31st. Check-out is 12:00 (UTC+8) and your shift ends at 05:00, so ask for a late check-out. If they say no and sleep matters more, take the four-night stay: keeping the room for New Year's Eve adds ¥347 (R$295) to the same booking.
  - type: book_ahead
    steps:
      - { days_before: 14, text: "Book **28–31 Dec** in the windowless queen and write your arrival time in the special-requests box. Nothing is charged until 26 Dec." }
      - { days_before: 13, text: "Booking.com says the hotel wants a **bank transfer before arrival** and will send instructions. Ask to pay by foreign card or at the desk (tiket.com says it takes cards and mobile payments), and ask for a late check-out on 31 Dec." }
      - { days_before: 2, text: "Free cancellation runs until **18:00 (UTC+8) on 28 Dec**. If the hotel still insists on a transfer you cannot make, cancel before then." }
      - { days_before: 0, text: "Check in from **14:00 (UTC+8)**, well before the 20:00 shift. Test the wifi, find a socket by the table, and ask how to keep housekeeping out while you sleep." }
    passport_note: "tiket.com says check-in needs government-issued photo ID and a card or cash deposit may be asked for. Bring the passport itself."
  - type: map
    note: "The pin is the **Changcheng (Great Wall) Building** bus stop on Xinhua Road. The hotel is on the **5th floor** of that building. A January 2026 guest found it on Amap by typing **'Mairuika hotel'**. In Sept 2026 the main entrance was shut for renovation; guests used a side door at the back."
  - type: tips
    variant: insider
    items:
      - "Take the **windowless queen**, not the inner-window room. A guest in an inner-window room in Oct 2026 said it had no window either, and it costs ¥73 more for three nights."
      - "The deluxe queen has a real window and a city view (¥570 for three nights), but a May 2026 guest's view was another building. For daytime sleep the dark room is the better buy."
      - "Food at 05:00 (UTC+8): a guest in May 2026 had a convenience store close by, and staff take in deliveries. No source gives opening hours that late, so check on the first evening."
  - type: tips
    variant: pitfalls
    items:
      - "Bring **earplugs**. Guests heard the corridor at night in Nov 2025 and Aug 2026, and neighbours at midnight in Sept 2025. Ask for a room away from the lift."
      - "The lobby and main entrance were under renovation in Sept–Oct 2026. If work is still going in December, it would be daytime noise: ask when you book."
      - "Don't book it for New Year's Eve just for the room: ¥406 alone, against ¥100 for the Only Cafe dorm. Book it only to sleep in after the last shift."
      - "Give yourself time to find the door. A September 2026 guest spent hours looking, and nobody answered the hotel's phone."
  - type: weather
    temp_low_c: 6
    temp_high_c: 12
    conditions: Damp and overcast, rain on about 10 days a month
    note: "Mild for a China winter, but grey. Rooms have air conditioning; the winter reviews I read mention no cold room."
    wear: Mid-weight jacket and a rain layer
