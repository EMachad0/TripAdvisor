blocks:
  - type: hero
    hook: A noodle as wide as a belt, slapped on the board until it goes biang, then hit with smoking chili oil.
  - type: quick_facts
    time_needed: 1–1.5 h
    best_time: "Morning: Qinyu before 11:00"
    extra:
      - { label: Not halal, value: Pork, detail: "Lazhi roujiamo is stewed pork: the Han side of Xi'an, unlike Sajinqiao" }
      - { label: Order, value: 优质肉夹馍, detail: "The 'premium' roujiamo: more meat. Ask for fat-and-lean" }
  - type: highlights
    items:
      - title: The pork roujiamo
        text: "**Qinyu** is one of the old names inside the city wall: a crisp baked bun stuffed with chopped stewed pork. It has been on *A Bite of China*, a Ctrip reviewer notes."
      - title: Gone by lunch
        text: "Qinyu bakes a fixed amount. A Ctrip regular says it is sold out by noon; Lost Plate arrived five minutes late and was told to come back earlier the next day."
      - title: Belt-wide noodles
        text: "**Biangbiang**: one strip is about 5 cm wide and a metre long, named for the slap on the board. Lao Li Jia's Bell Tower branch is 250 m east of the tower."
      - title: The other half of Xi'an food
        text: "Your Sajinqiao crawl is the Hui Muslim beef-and-lamb side. This is the Han side: pork, chili oil and wheat."
  - type: prose
    title: A Bell Tower breakfast-to-lunch
    dropcap: true
    text: |-
      Start at **Qinyu** on Dongmutoushi, a lane south of the Bell Tower. Order a *youzhi roujiamo* (优质肉夹馍, the premium one) and a bowl of liangpi, the cold noodles every roujiamo shop serves alongside. A Ctrip regular says the fat-and-lean version beats pure lean, which can be dry. One 2023 review says you pay for the bun and the liangpi separately.

      Then walk up Luomashi to **Lao Li Jia** for biangbiang. China Xian Tour describes the classic as *you po*: wide noodles under chili, garlic and scallion, finished with sizzling oil. Tomato-and-egg is the mild version if your mouth needs a break.
  - type: quote
    variant: vibe
    text: A paper bag, a burning-hot bun, and the queue behind you already shouting orders.
  - type: cost_breakdown
    items:
      - { label: "Qinyu roujiamo (+ liangpi), per person", local: 16, brl: 13.23, estimate: true }
      - { label: "Bowl of biangbiang at Lao Li Jia", local: 20, brl: 16.53, estimate: true }
