  - type: tips
    variant: insider
    items:
      - "Do Qinyu **first and early**: sources give closing as 13:00 or 14:00, and the bread can run out sooner."
      - "Search 秦豫肉夹馍 in Amap before walking: Ctrip lists the shop in Xingzhengyuan Plaza on Luomashi, older guides at 19 Dongmutoushi. On the map both are in the Luomashi lanes a few minutes from the Bell Tower."
      - "Lost Plate's pairing: roujiamo, liangpi and an **Ice Peak** (冰峰) orange soda."
