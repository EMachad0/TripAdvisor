  - type: tips
    variant: insider
    items:
      - "Judge by the queue, not the decor: the busy plain eateries are the good ones."
      - "Share dishes rather than ordering a big main each, so you can taste more."
      - "Useful words: 不辣 (not spicy), 不要香菜 (no coriander), 多少钱 (how much)."
