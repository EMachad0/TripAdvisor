blocks:
  - type: hero
    image: muslim-quarter-night
    caption: "The main Muslim Quarter strip at night; Sajinqiao is its quieter western end"
    hook: Walk a street or two past the tourist strip, to where Xi'an's locals eat breakfast and late-night lamb.
  - type: quick_facts
    time_needed: 1–2 h
    best_time: "17:30–22:00, or before 08:00"
    extra:
      - { label: Pay with, value: Alipay / WeChat Pay, detail: "Some small stalls don't take foreign cards" }
      - { label: Diet, value: Halal, detail: "Strict halal: pick shops that label themselves halal" }
  - type: highlights
    items:
      - title: Where locals eat
        text: "Guides send you one or two streets back from **Beiyuanmen**, which is priced for visitors, to Sajinqiao and Da Pi Yuan, where residents actually eat."
      - title: Breakfast like a Hui family
        text: "Stalls open around **06:00**. **Jing gao**, sweet steamed sticky rice with dates, sells out: be there before 08:00."
      - title: The evening crawl
        text: "Restaurants fill from 17:00, and the barbecue stalls keep grilling until about midnight: skewers, hulatang and roujiamo, a few yuan each."
      - title: Cheap even by China standards
        text: "Most snacks are about **¥10**, roujiamo ¥10–20 and paomo ¥20–40. Six snacks and a few skewers come to about ¥60."
  - type: prose
    title: How to crawl it
    dropcap: true
    text: |-
      Take Line 1 to Sajinqiao, leave by Exit B and walk about 400 m into a maze of lanes and small eateries in the Muslim community of Lianhu District. Residents still ride scooters through, so keep to the side.

      Go in the evening and graze: a **sour soup dumpling** at Ma Er (No. 131), a **crispy beef cake** at Lao Ma Jia, a **meatball hulatang** at Lao Li Jia, a **roujiamo** at Yang Tianyu, and skewers from whichever barbecue has the crowd. If you're hungry for a proper meal, sit down for **yangrou paomo** at Liu Xin (No. 129).
