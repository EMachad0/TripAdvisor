blocks:
  - type: hero
    image: xingqing-south-gate
    hook: "You get dressed, made up and posed by people who do this daily, in the park that was a Tang emperor's palace."
    caption: "The south gate of Xingqing Palace Park, one of the two shoot spots"
  - type: quick_facts
    time_needed: About 5 h, make-up included
    best_time: "Start by 10:00 (UTC+8)"
    extra:
      - { label: Language, value: English companion, detail: "Studio staff speak mainly Chinese; the companion translates" }
      - { label: Photos, value: "≥ 30 originals + ~5 edits", detail: "All originals the same day; retouches later" }
      - { label: Men's looks, value: "Round-collar robe, armour", detail: "Tang scholar-official robe with futou cap; armour as a prop" }
  - type: highlights
    items:
      - title: Built for people who can't pose
        text: "A guest who says she \"never\" knew how to pose wrote that she got \"helpful guidance how to pose\", only 2–5 frames per spot, and that 90% of the originals were usable. Other reviewers say the photographer \"really knew how to guide me through the poses\"."
      - title: Hair, make-up and clothes included
        text: "One outfit with cloak, shoes and accessories, **make-up and hair styling** with hairpieces, and props: fan, flute, book, umbrella or **armour**. The site's Tang page offers men the red round-collar robe with a futou cap."
      - title: A fixed package, not per-photo sales
        text: "At least **30 original photos**, all handed over the same day, plus about **5 retouched**. That is the opposite of the street stalls that shoot hundreds of frames and then sell them one by one."
      - title: Someone on your side
        text: "The English companion meets you at the metro, helps you pick the outfit, tells the make-up artist what you want and translates on the shoot. For a shy first-timer this is the part that matters most."
  - type: prose
    title: Is it worth R$998?
    dropcap: true
    text: |-
      It is about **six days** of your R$170 China budget for one half-day. You said a high price is fine because the photos last, and this is a fixed price for a guided shoot: US$125 (R$734) for the package plus US$45 (R$264) for the English companion and the taxi to the location. Skip the companion only if you read Chinese: CET's FAQ says the studio staff speak mainly Chinese, and without the companion you get a WeChat group chat.

      **The cheaper route:** Trip.com's hanfu guide (Sep 2026) says a Tang-style shoot in Xi'an "can run around $40 for makeup, hair, a photoshoot, raw photos and eight edits", and that men's choice is smaller than women's. The guide names no studio and lists no English companion. For a shy first-timer, the extra money here pays for someone who translates and checks the look.

      **What you walk out with:** every original (30 or more) on the day, and about five retouched photos later. Retouches beyond those, a second outfit and the "specific, elaborate dynasty sets" sold as upgrades all cost extra, and the site gives no prices. Get those prices in writing on WhatsApp before you pay. A realistic budget for a good set: the R$998 base, plus some room for a few extra retouches if the five are not enough.

      **Men's samples:** see the men's sections of the [Tang collection](https://chinaexplorertour.com/tang-dynasty-photoshoot-collection/) ("The Scholar-Official"), the [other-dynasty collection](https://chinaexplorertour.com/other-dynasty-photoshoot-collection/) ("Male" tabs) and [solo men's portraits](https://chinaexplorertour.com/hanfu-photoshoot-experience-for-every-traveler/). **The honest gap:** these are real male clients, but the captions I could read say Beijing. The studio in Xi'an is not named. Before booking, ask for **three or four Xi'an men's sets** from the last few months. If they can't send them, don't book.
