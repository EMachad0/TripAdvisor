  - type: book_ahead
    steps:
      - days_before: 10
        text: "WhatsApp or email info@chinaexplorertour.com: ask for **recent Xi'an men's samples**, the studio's metro station, prices per extra retouch and outfit, and email or cloud delivery of the retouches."
      - days_before: 7
        text: "Book the **All-Inclusive** package on the site for your full day in Xi'an, not the day you take the night train. Choose Xingqing Palace or the Giant Wild Goose Pagoda."
      - days_before: 0
        text: "Meet the companion at the metro around **09:30–10:00 (UTC+8)**. Make-up and dressing take about 2 h, the shoot about 1 h, then back to the studio to get your originals."
  - type: cost_breakdown
    items:
      - { label: "Standard package (styling, shoot, ≥30 originals, ~5 edits)", local: 125, brl: 733.75 }
      - { label: "English companion + transport (per booking)", local: 45, brl: 264.15 }
      - { label: "Xingqing Palace Park entry", local: 0, brl: 0 }
    note: "Extra retouched photos, a second outfit and premium costume sets are charged on top; the site lists no prices."
  - type: map
    note: "The pin is the shoot location, Xingqing Palace Park. The studio's address is not published: the All-Inclusive package starts with a pickup at the metro station nearest the studio. Without it, metro Line 3 to Xianning Road, then about 1.2 km on foot to the park."
  - type: tips
    variant: insider
    items:
      - "Ask for the **Tang round-collar robe with futou cap** or a look with **armour**. The site recommends Tang style in Xi'an, and it reads well on men who don't want heavy make-up."
      - "Say up front that you are shy and want **natural, not theatrical** expressions. The companion is there to pass that on."
      - "Mark your favourite frames with the companion **at the shoot**: the companion's service ends once you are back at the studio."
  - type: tips
    variant: pitfalls
    items:
      - "The page is partly copied from the Beijing listing (\"selected Beijing photoshoot location\", Ming-style men's robes). Confirm the Xi'an location, the men's costumes and the price in writing."
      - "The title mentions the City Wall, but the itinerary offers only Xingqing Palace or the Giant Wild Goose Pagoda. Don't expect a wall shoot."
      - "Don't book it on a night-train day. With about 5 h plus travel, it needs a free morning and early afternoon."
