  - type: map
    note: "Take Metro **Line 5 to Huangqutou, Exit B**, then walk about 730 m into Qujiang Creative Valley. The restaurant is on the ground level at the Central Plaza."
  - type: tips
    variant: insider
    items:
      - "Sit in the **main hall**, not a private room: the stage is in the hall."
      - "Shows run at **mealtimes**, so arrive around 18:00 (UTC+8) and stay through two or three of them."
      - "Diners mention a light drink with friends, but no drinks list or prices are published: ask before you order."
  - type: tips
    variant: insider
    title: Runners-up, and why they lost
    items:
      - "**Runner-up: 焰隐庐·国风酒馆** (Fengcheng 10th Rd, far north). A guofeng BBQ tavern with dancers that Douyin posts say opened in late 2025 or early 2026. Lost: address, prices and show times can't be checked outside Douyin."
      - "**Runner-up: 三秦古酒馆** (Xiangzimiao St, old city, 10:00–01:00 UTC+8). Warm osmanthus rice wine and yellow wine, with May 2026 reviews. Lost: no music or gufeng show reported."
      - "**Runner-up: 人籁 Empyrean 诗酒空间** (Xiying Rd). A resident band plays at 21:30 (UTC+8), with folk and stand-up in 2026. Lost: modern folk, not traditional instruments or gufeng."
  - type: tips
    variant: pitfalls
    items:
      - "Ruled out: the Tang taverns inside **Chang'an Twelve Hours** and **Xi'an Qianguqing** are parts of ticketed theme parks, not bars."
