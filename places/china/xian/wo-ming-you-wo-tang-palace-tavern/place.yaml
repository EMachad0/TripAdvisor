blocks:
  - type: hero
    hook: Red walls, lanterns and a star-canopy stage, with water-sleeve dancers going on about every half hour at peak times.
  - type: quick_facts
    time_needed: 1.5–2 h
    best_time: "Dinner, 18:00–20:00 (UTC+8)"
    extra:
      - { label: Live music, value: Not confirmed, detail: "Reviews describe dance shows; no source mentions live 民乐" }
      - { label: Payment, value: Card or mobile pay, detail: Trip.com listing }
  - type: highlights
    items:
      - title: A Tang palace, indoors
        text: "Reviewers describe **Tang-style décor**: red walls, drapes, lanterns, warm dim light and a stage under a starry canopy."
      - title: Hanfu dancers between plates
        text: "Ancient-style shows run during meals, including **hanfu** and **water-sleeve (水袖) dances**. An Aug 2026 review counts one about every half hour at peak times."
      - title: Cheap for a themed room
        text: "Ctrip puts the average at **¥66** a head; one diner in Oct 2026 paid ¥40. No cover or show fee shows up in any review."
      - title: Real Shaanxi food
        text: "Reviews and Trip.com's popular list name **葫芦鸡** gourd chicken, iron-pot chicken with steamed rolls (铁锅土鸡焖花卷), fish with silken tofu (鲜鱼嫩豆腐) and biangbiang noodles."
  - type: prose
    title: Why this, and not a music tavern
    dropcap: true
    text: |-
      The traveler asked for a Xi'an version of Chengdu's 听·江湖民乐酒馆: a jianghu-style tavern with live guzheng, pipa, erhu and dizi. The only branch found is on Yulin Road in Chengdu; no Xi'an branch turned up in Chinese searches. Searches on Trip.com, Ctrip, Baidu and 360 for 古风酒馆, 国风酒馆, 民乐酒馆, 唐风酒馆 and 汉服酒馆 also found **no Xi'an bar with a verifiable live traditional-music set** in 2026.

      Wo Ming You Wo is the closest open match. It calls itself a 唐宫酒馆 ("Tang palace tavern"), has gufeng decor and costumed shows, costs no ticket, and has reviews from October 2026. **But it is a restaurant with a stage, not a bar.** Reviews mention a light drink with friends (小酌), yet no source gives a drinks list or drink prices. The shows are dance, and no source says whether the music is played live.

      **Verdict:** this does not earn an evening of a two-night stop on its own. Book it as **dinner** on the free evening, see the show, then go on to a bar. If one night is spent on the sleeper train, skip it unless the Tang-palace look is the thing you want most.
  - type: cost_breakdown
    items:
      - { label: "Dinner, user-reported average", local: 66, brl: 56.03, estimate: true }
