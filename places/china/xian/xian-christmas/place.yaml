  - type: highlights
    items:
      - title: A cathedral from 1716
        text: "**St. Francis Cathedral** on Wuxing Street, locals' *Nan Tang*, was begun in 1716 and rebuilt in 1883 with a Baroque facade. It's a provincial heritage site, in the old city near the Bell Tower."
      - title: The towers after dark
        text: "The **Bell Tower** and **Drum Tower** are lit every night, and the **Muslim Quarter** between them stays lively for street food after dark."
      - title: A Christmas town, maybe
        text: "In **2024** the city set up a **Christmas town** downtown. Nothing has been announced for 2026 yet, so check in mid-December."
      - title: Sleep your way to Chongqing
        text: "**K507** leaves Xi'an East at **23:06** on the 25th and reaches **Chongqing North at 08:28**. That's one night's bed and the whole of the 26th in Chongqing."
  - type: prose
    title: How to do it
    dropcap: true
    text: |-
      Christmas in China is a night out, not a family holiday. Xi'an adds something most cities don't: a real old cathedral. **St. Francis** on Wuxing Street has served Xi'an's Catholics since the 1700s.

      Go after dark on the 24th. Look at the cathedral, then walk to the **Bell Tower** and through the **Muslim Quarter** for lamb soup and roasted meat. If the Christmas town returns, it'll be downtown too.

      Use the 25th for the city wall or the Terracotta Army, then board the **23:06 sleeper**. You wake up in Chongqing with Saturday ahead of you. The 20:30 drone show is likely that night but not confirmed: December dates come out in late November, and rain can cancel it on the day.
