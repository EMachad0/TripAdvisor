    items:
      - "**Getting to Chongqing**: the November timetable has **K507**: Xi'an East 23:06 → Chongqing North 08:28 (+1), hard sleeper **¥178 (R$147)**, hard seat ¥102. Daytime fast trains take 5 to 6 h; second class runs from ¥302 on D trains to ¥529. Flights take about 1.5 h."
      - "Christmas Eve at the cathedral: go early in the evening and stay outside if it's full. Watch the crowd rather than trying to get into the service."
      - "Eat in the Muslim Quarter before the train. There's nothing good on board."
  - type: tips
