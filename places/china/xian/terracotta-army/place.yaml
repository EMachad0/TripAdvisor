blocks:
  - type: hero
    image: pit-1-ranks
    hook: Rank after rank of life-size clay soldiers, laid out to guard the First Emperor's tomb from the east.
  - type: quick_facts
    time_needed: 3–6 h on site
    best_time: 08:30 entry, weekday
    extra:
      - { label: Cheapest ride, value: "Bus 306, ¥2–5", detail: "From Fangzhicheng coach station, about 60 min" }
      - { label: Shuttle, value: Free, detail: "Between the pits museum and Lishan Garden" }
  - type: highlights
    items:
      - { title: Pit 1, text: "A 14,260 m² hall where about 6,000 warriors and horses are thought to be buried; nearly 2,000 stand on show in battle formation." }
      - { title: Pit 2, text: "Kneeling and standing archers, a 64-chariot array and cavalry; an estimated 1,300 warriors and horses, still being dug." }
      - { title: Pit 3, text: "The command post: 68 warriors and a four-horse chariot. It escaped the fire that damaged the other pits." }
      - { title: Bronze chariots, text: "Two half-size bronze chariots with gold and silver ornaments, dug up near the mausoleum in 1980 and restored over 8 years." }
  - type: prose
    title: Why it earns the day
    dropcap: true
    text: |-
      In March 1974 farmers digging a well in Lintong hit pottery. What came out was an army made for Qin Shi Huang, the First Emperor, buried in 210–209 BC, laid out to guard his tomb from the east. Pit 2 is still being excavated.

      It is a long day: about an hour each way by bus, then TravelChinaGuide's suggested routes run 2.5–3 hours for the essentials or 6 hours for everything. A free shuttle links the pits museum with Lishan Garden, the tomb park. Go early and do Pit 1 first, while it is quiet.
  - type: gallery
    feature: false
    images:
      - { file: bronze-chariot, caption: "One of the two half-size bronze chariots" }
  - type: book_ahead
    steps:
      - { days_before: 7, text: "Sales open at 00:00 Beijing time. Without a Chinese phone number, use the **Trip.com** page linked from the museum's English site and enter your **passport number**. Pick the **08:30** entry." }
      - { days_before: 0, text: "Be at security by about 08:10 for 20 quiet minutes in Pit 1, and scan your **original passport** at the gate." }
    passport_note: "Name and passport number must match the passport you carry; a photocopy or a phone photo won't work."
  - type: cost_breakdown
    items:
      - { label: Entry ticket (pits museum + Lishan Garden + shuttle), local: 120, brl: 99.2 }
      - { label: "Bus 306 from Fangzhicheng, each way", local: 5, brl: 4.13, estimate: true, optional: true, note: "¥2–5 by distance" }
      - { label: "Electric cart at the pits museum", local: 5, brl: 4.13, optional: true }
      - { label: "Direct bus from the Bell Tower (instead of 306), one way", local: 25, brl: 20.67, optional: true }
  - type: map
    note: "In a ride-hailing app, enter **秦始皇帝陵博物院**, the name the museum uses itself. Didi from town is about ¥120–160 and 45–60 min."
  - type: tips
    variant: insider
    items:
      - "**Cheapest route:** metro to **Fangzhicheng** (Line 9), then Tourist Line 5 / bus **306** from the coach station: ¥2–5, about an hour, every 30–40 min from 07:00."
      - "**Easiest from the Bell Tower:** a direct bus leaves Bell Tower metro **Exit G1** every 30 min, 08:00–11:30 (¥25, about 1 h). Returns leave the museum's front gate at 14:00, 15:00 and 16:00."
      - "**Guide or not?** There's very little English signage in the pits, so some explanation helps. The museum runs its own guide service (029-81399047). Many lanyard-wearing guides at the gate are unlicensed."
  - type: tips
    variant: pitfalls
    items:
      - "By the old Xi'an Railway Station, people in lanyards selling bus \"tickets\" on the sidewalk are scammers; the ride ends at a fake museum."
      - "People in black uniforms who say tickets are sold out for days aren't museum staff. Your online booking is all you need."
      - "The 10:30–14:30 window is when the tour buses arrive; avoid it if you can."
  - type: weather
    temp_low_c: 1
    temp_high_c: 8
    conditions: Cold, dry, mostly cloudy; snow rare
    note: "December is low season, so crowds are much thinner than in summer. The shuttle stop and Lishan Garden are outdoors, and the walks between halls are long."
    wear: Down jacket, gloves, comfortable shoes for a lot of walking
  - type: pairs_well
    items:
      - { id: desti-youth-park-hostel-xian, note: "Your hostel in town" }
      - { id: sajinqiao-food-crawl, note: "Back in town by evening: skewers and paomo on Sajinqiao" }
      - { id: xian-christmas, note: "Pair with Christmas Eve at the Bell Tower" }
