      - "The listing says a stage is planned for occasional **folk concerts and stand-up comedy**; no dates found"
      - "Reviews: \"a great place to relax and meet other travellers\", \"good communal area with a cheap bar\", \"fairly social\""
      - "The hostel says it plans travel routes for backpackers"
    good_to_know:
      - "Nearly **400 beds**: big and busy rather than intimate"
      - "Dorms are single-sex; slippers, towel, bottled water and a key-card locker come with the bed"
      - "Pay on arrival by cash or card (Hostelworld); cancel at least a day ahead or pay the first night"
      - "The hostel asks guests to navigate with Baidu Maps: Google pins can be off"
      - "Breakfast isn't included; Booking.com lists it at ¥15"
  - type: highlights
    items:
      - title: The Bell Tower on the doorstep
        text: "Location scores **10.0** on Hostelworld and 9.8 on Booking.com: the Bell Tower, Drum Tower and Muslim Quarter are all a walk away."
      - title: One metro line from the train
        text: "Line 2 runs from **Xi'an North** station straight to the Bell Tower stop, by the hostel's Exit D."
      - title: Cheap for what you get
        text: "Value for money is **9.7** on Hostelworld, and the bar is called cheap in reviews."
  - type: map
    note: "Arriving at Xi'an North, take Line 2 to **Bell Tower (Zhonglou)** and use Exit D. Use Baidu Maps to find the building, as the hostel asks."
  - type: tips
    variant: insider
    items:
      - "For Dec 14 the dorm was ¥4 cheaper on Hostelworld than on Booking.com; Booking lets you pay at the property instead."
      - "An 8-bed dorm cost about ¥3 more than a 12-bed for Dec 14; fewer roommates for the price of a skewer."
