  - type: highlights
    items:
      - title: The infinity effect
        text: "The **mirrored ceiling** reflects the shelves and stairs, so the room seems to rise forever. It's the same trick that made the Chongqing store go viral."
      - title: A spiral staircase of books
        text: In the literature hall a spiral staircase winds up along the shelves to the second level.
      - title: Shelves shaped like a dam
        text: "The curved walnut book walls are modelled on the ancient **Dujiangyan irrigation system** nearby."
      - title: Free, and ranked world top 10
        text: "No ticket. 1000 Libraries put it **6th** among the world's most beautiful bookstores of 2025."
  - type: prose
    title: Why not Chongqing?
    dropcap: true
    text: |-
      The "infinity staircase" clips that went round the internet were shot in **Zhongshuge Chongqing**, in Yangjiaping. Its staircases sat under a mirrored ceiling, like an Escher print. That store **closed on 17 September 2024**. The Xi'an branch closed the same year, and the chain has been shutting other stores since.

      The Dujiangyan store comes from the same designer (Li Xiang of X+Living), opened in 2020, and on 2 October 2026 it drew over 4,500 visitors in one day. You get the same signature: staircases and shelves reflected to infinity in a mirrored ceiling. Take Metro Line 2 to **Xipu**, then the 20–30 min train to Dujiangyan. Pair it with the Dujiangyan irrigation system for a full day.
