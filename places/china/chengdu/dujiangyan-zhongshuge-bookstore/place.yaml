  - type: tips
    variant: insider
    items:
      - "Get there at **10:00 on a weekday**: a mall bookstore is usually at its quietest then."
      - Stand at the foot of the spiral and shoot straight up to get the infinity look in the mirror.
      - Make it a day trip with the Dujiangyan irrigation system in the same city.
  - type: tips
    variant: pitfalls
    items:
      - "Don't go looking for the Chongqing store in Yangjiaping: it **closed in September 2024**."
      - "It's a working bookstore, so keep your voice down. Avoid weekends and holidays, when the stairs fill with people posing."
