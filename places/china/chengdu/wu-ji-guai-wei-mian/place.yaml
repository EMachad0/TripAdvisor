blocks:
  - type: hero
    hook: Salty, sweet, spicy and numbing in one bowl, topped with pork the founder still fries himself.
  - type: quick_facts
    time_needed: 20–30 min
    best_time: Early, before meal times
    extra:
      - { label: Solo, value: "Yes: one bowl is a meal", detail: "A noodle shop; order a bowl and go" }
      - { label: Spice, value: "Spicy and numbing", detail: "Seafood noodles in clear broth are the mild bowl" }
  - type: highlights
    items:
      - title: The signature bowl
        text: "**Guai wei mian**, 'weird taste' noodles. A Ctrip reviewer: salty, sweet, spicy and numbing at once, with sourness to lift it, and plenty of pork topping."
      - title: Same family since 1989
        text: "Michelin says the shop opened in **1989**; the second generation runs it now, but founder Mr Wu still fries the **pork topping** (臊子) himself."
      - title: Two minutes from Line 2
        text: "Exit A of **Niuwangmiao** station is 187 m away on Line 2."
      - title: About ¥16
        text: "Ctrip users average **¥16** (R$14) a head."
  - type: prose
    title: What weird taste means
    text: |-
      *Guaiwei* means "weird taste". It is the house signature, and the one to order first.

      For a second bowl, Ctrip's dish list has **beef noodles** (牛肉多味面) and zajiang noodles. A reviewer who wanted something gentle liked the **seafood noodles** in a clear broth with dried squid and dried shellfish (仙贝). Others order the dan dan noodles.
  - type: quote
    variant: vibe
    text: A two-minute walk from the metro, a bowl that hits every taste bud at once, and back underground.
