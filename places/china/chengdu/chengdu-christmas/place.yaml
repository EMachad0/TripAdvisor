  - type: tips
    variant: insider
    items:
      - "**Getting to Chongqing on the 26th**: D trains from Chengdu East to Chongqing North cost about **¥85 (R$70)** and take 2 h or a little more. Fast G trains take about **1 h 15** from ¥125, but some G trains take over 2 h and cost ¥210–234: check both before paying. Buy on 12306 or Trip.com."
      - "Go to Taikoo Li **before 19:00** on the 24th: after that the crowd around the tree is shoulder to shoulder."
      - "The metro stops around **23:30**. After that use DiDi, which works with a foreign card."
  - type: tips
    variant: pitfalls
    items:
      - "Don't expect a European-style market. Expect mall decorations, crowds and couples."
      - "The Taikoo Li terraces charge **¥100–160** a drink. Drink in Yulin and only walk through Taikoo Li."
      - "Church services in China are run by state-registered churches. Mass times for Christmas are posted only shortly before."
