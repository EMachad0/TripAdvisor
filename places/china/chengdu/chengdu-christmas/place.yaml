  - type: highlights
    items:
      - title: The lights are downtown
        text: "**Chunxi Road, Taikoo Li, IFS and Tianfu Square** all put up Christmas decorations, and the city runs light shows downtown at the end of December."
      - title: Yulin, the backpacker's bar street
        text: "The original **Little Bar** on Yulin West Road has been Chengdu's indie-rock cradle since the late 1990s. Draft beer is **¥30–50**, half the price of the Taikoo Li terraces."
      - title: A real cathedral
        text: "The **Ping'anqiao Cathedral** (Immaculate Conception) was finished in **1904** by French missionaries. Go for the building; services are for the faithful."
      - title: The shortest trip back
        text: "No other Christmas option is closer to Chongqing: **166 trains a day**, the cheapest D trains at ¥85, so you can party on the 25th and still be in Chongqing by lunch on the 26th."
  - type: prose
    title: How Christmas goes here
    dropcap: true
    text: |-
      Christmas in mainland China is a shopping-and-dating night, not a family holiday. Couples swap **apples** on Christmas Eve (*píng'ān yè*, "peaceful night", sounds like *píngguǒ*, apple). The malls compete for the best tree. Chengdu does this on a big scale, because its centre is one huge pedestrian zone.

      Start at **Taikoo Li** around dusk for the decorations and the crowd. Walk through Chunxi Road to IFS, then take a taxi or the metro west to **Yulin** for bars where people actually talk to each other. Lan Kwai Fong is the club option, with drinks at ¥80–150.

      On the 25th sleep in, eat hotpot, or take the trip out to the Dujiangyan bookstore. Take any train to Chongqing on the morning of the 26th.
