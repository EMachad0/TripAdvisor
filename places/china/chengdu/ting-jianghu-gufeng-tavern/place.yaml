  - type: highlights
    items:
      - title: A jianghu tavern
        text: "The theme is the *jianghu*, the wandering-swordsman world of wuxia novels, with Chinese traditional-style décor."
      - title: Guofeng music
        text: "The music-bar brand **Music House** (音乐房子), which runs it, pitches 听·江湖 as Chinese-style music with a jianghu theme. Search snippets of a 2026 report add folk songs, classical dance and **pipa** nightly (not confirmed)."
      - title: Gufeng dance with energy
        text: "A visitor's video from Yulin Road (Oct 2025) shows *gufeng* (ancient-style) dance, which the poster says was surprisingly high-energy."
      - title: Drinks named after wuxia
        text: "Drinks are named after wuxia songs and stories, such as **凤求凰** (Qionglai News) and, per report snippets, **任逍遥**, **笑傲江湖** and **女儿红**."
  - type: prose
    title: Is this the place you meant?
    text: |-
      There is no English "Tingjianghu Gufeng Wine House" listing. The name matches **听·江湖古风酒馆**, "Listen · Jianghu, ancient-style tavern", at 13 Yulin Middle Road. Douyin posts have also called it 民乐酒馆 (folk-instrument tavern) and 民谣酒馆 (folk-song tavern).

      It has **two branches**, both under Chengdu: this one in **Yulin**, in the city, and a newer **听·江湖古风餐酒馆** at Wenmai Fang in **Qionglai**, a satellite city of Chengdu, open since at least October 2025. No branch in any other city turned up. Yulin is the one to go to.

      **Honest verdict:** worth one of your three free Chengdu evenings only if you want a Chinese costume-drama atmosphere and don't mind not following the lyrics. As a bar for meeting people from the hostel it is a weak pick: the crowd is local, the songs are Mandarin, and no source says anything about foreigners. It's better as a 1–2 hour stop on a Yulin evening than as the whole night.
