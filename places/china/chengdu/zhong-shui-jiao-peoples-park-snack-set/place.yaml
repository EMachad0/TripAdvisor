      - { label: Out of place?, value: "Not at all", detail: "A busy old snack shop in a public park" }
  - type: highlights
    items:
      - title: The cheap version of a tasting menu
        text: "Chengdu's best-known food is its **snacks** (小吃), not banquets. This set puts six of them in one tray for one person, so you taste the range at one table, with tea."
      - title: The shop that named the dumpling
        text: "**Zhong Shui Jiao** dates from 1893 and its making method is on Sichuan's provincial intangible heritage list. Its red-oil dumplings are mildly spicy, savoury and a little sweet."
      - title: In People's Park, next to Heming
        text: "The flagship sits **inside People's Park, beside Heming Teahouse**. Snacks, then a bowl of tea, or the other way round."
      - title: Solo without the guesswork
        text: "The Trip.com voucher is sold as a **single-person** set, paid in advance on Trip.com, so there's nothing to order in Chinese and no doubt about portions for one."
