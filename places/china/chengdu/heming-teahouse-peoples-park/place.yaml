  - type: quote
    variant: vibe
    text: Steam off the gaiwan, tiles clacking, and the whole afternoon still ahead.
  - type: map
    note: "Navigate to **人民公园** (People's Park), not 文化公园: there is a second Heming Teahouse in Culture Park across town."
  - type: tips
    variant: insider
    items:
      - "Walk past the first zone you meet from the photo wall (非遗体验区): it's the set-menu area at about ¥178 for two. The à-la-carte tables, with staff in blue, are further in."
      - "Say a polite no and the ear-cleaners move on; they come by often."
      - "Kuanzhai Alley is a 14-minute walk away and uses the same metro station."
  - type: tips
    variant: pitfalls
    items:
      - "Ear-cleaners push a **¥100–110** clean-and-wash combo. Agree on the basic price and what's included before they start."
      - "Lakeside seats fill first, and weekends are packed."
  - type: weather
    temp_low_c: 5
