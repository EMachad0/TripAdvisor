blocks:
  - type: hero
    image: heming-archway
    hook: Mahjong tiles, a long-spouted kettle and a man with a tuning fork offering to clean your ears.
    caption: "The 鹤鸣 archway into the teahouse, People's Park"
  - type: quick_facts
    time_needed: 1–2 h
    best_time: "07:30, or a weekday afternoon"
    extra:
      - { label: Entry, value: Free, detail: Park and teahouse; you pay per bowl of tea }
      - { label: Good in rain, value: Partly, detail: "Covered pavilions, but open to the air" }
  - type: highlights
    items:
      - title: One bowl, all afternoon
        text: "Order one **gaiwan** (lidded bowl) and the hot water is refilled free for as long as you stay. There's no minimum spend and nobody moves you on."
      - title: The ¥3 dawn tea
        text: "From **06:30 to 08:30** the same bowl costs **¥3** (R$2.48): the regulars' breakfast rate. Come around 07:30, after the staff have finished sweeping."
      - title: Ear-cleaning, 采耳
        text: "Uniformed ear-cleaners work the tables with picks, a feather and a tuning fork: about **¥30–40** for 3–5 minutes, plus about ¥10 for tools."
      - title: Old Chengdu, loud
        text: "Open since **1923**. Bamboo chairs, mahjong, gossip and kettles: it's a market hubbub, not a quiet Zen teahouse."
  - type: gallery
    images:
