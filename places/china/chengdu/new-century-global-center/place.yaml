  - type: highlights
    items:
      - title: The size of it
        text: "**500 × 400 m and 100 m tall**, about 1.7 million m² of floor space. China Discovery bills it as the world's largest building; Wikipedia ranks it third by floor area."
      - title: A beach indoors
        text: "Paradise Island water park has a **5,000 m² artificial beach** and a **150 × 40 m screen** that plays sunrises and sunsets over the waves."
      - title: Free to wander
        text: "Entry to the building is free, 10:00–22:00. Inside: a big shopping mall, an IMAX cinema, an Olympic-size ice rink and a mock Mediterranean village."
      - title: Still busy, still changing
        text: "Over **30 million visits in 2025** (Winshang). After Lotte left in 2024, its old 4th-floor shops became a food zone."
  - type: prose
    dropcap: true
    text: |-
      The Global Center opened in 2013 on Tianfu Avenue, about 10 km south of Tianfu Square. From outside it is one long wave of glass; inside are hotels, offices, a mall and, on the east side of the ground floor, a water park with a beach and a giant screen for a sky.

      The shopping alone isn't the reason to come; Chengdu's Chunxi Road and Taikoo Li do that better. Come for the scale. Walk the length of the atrium, look at the ice rink, and if the water park appeals, give it the afternoon: it closes at 18:00 on weekdays in winter.

      It works on a grey day, which in a Chengdu December is most days, and on a work-night afternoon: Line 1 stops at the door, and you can be back in the centre well before 20:00.
