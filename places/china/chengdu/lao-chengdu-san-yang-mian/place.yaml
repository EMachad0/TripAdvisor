blocks:
  - type: hero
    hook: Locals at shared tables from 07:30, slurping noodles from three menus called old, new and more.
  - type: quick_facts
    time_needed: 30 min
    best_time: Breakfast, from 07:30
    extra:
      - { label: Solo, value: "Yes: shared tables", detail: "Michelin: expect to share a table or sit outside" }
      - { label: Spice, value: Choose your bowl, detail: "Spicy zajiang and red-oil wontons; tomato beef noodles if you want none" }
      - { label: English menu, value: "Yes (Ctrip, Trip.com)" }
  - type: highlights
    items:
      - title: Three menus of noodles
        text: "Michelin says the noodles come in three sections, **old, new and more**. The most popular is from the old one: blanched noodles in a spicy meat sauce with diced string beans."
      - title: Chao shou too
        text: "**Red-oil wontons** (红油抄手) are on Ctrip's list of recommended dishes, so you get Chengdu's other classic in the same stop."
      - title: The cold finish
        text: "Michelin's tip after the chilli: **chilled tofu pudding with red bean** (红沙冰豆花)."
      - title: Near Kuanzhai, for about ¥19
        text: "Trip.com places it in the **Kuanzhai Alley** area. Ctrip's users average **¥19** (R$17) a head, roughly one bowl (only 2 reviews)."
  - type: prose
    title: A fly restaurant with a Bib
    text: |-
      Chengdu calls its tiny, plain neighbourhood eateries *cangying guanzi*, "fly restaurants". Michelin's words for this one are a no-frills "hole in the wall" where locals come for time-honoured flavours, and you will probably share a table or eat outside.

      The menu splits soup and dry noodles into the old, new and more sections. Ctrip's dish list adds tomato beef-brisket noodles, braised beef noodles, sesame-oil dan dan noodles and seafood squid noodles, so there is a mild bowl if the chilli gets too much.
  - type: quote
    variant: vibe
    text: Elbow to elbow at a shared table, a bowl of red chilli oil, and the Kuanzhai crowds still asleep.
