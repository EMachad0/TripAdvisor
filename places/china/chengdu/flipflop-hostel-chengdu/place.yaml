        text: "Hostelworld's atmosphere score is **9.5**, and its review summary singles out the dumpling parties as the place to meet other travellers."
      - title: One train to the pandas
        text: "Chunxi Road station is on **Line 3**, the Panda Base line, and Line 2 to People's Park and Chengdu East."
